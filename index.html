var MA=[{"id":"a1","n":"A01","book":0,"t":"Foundations, fast review","goal":"Check that the Track 1 basics are solid, set up a professional toolchain, and write small correct programs quickly.","res":[["roadmap.sh/rust","https://roadmap.sh/rust"],["Rust Playground","https://play.rust-lang.org/"],["rust-analyzer","https://rust-analyzer.github.io/"],["Rust by Example","https://doc.rust-lang.org/rust-by-example/"]],"items":[{"id":"A1.1","t":"What Rust is for, and a professional toolchain","min":45,"learn":"Why teams choose Rust (memory safety without a garbage collector, speed, fearless concurrency, great tooling), and setting up rust-analyzer, rustfmt, clippy and the Playground for daily work.","kind":"lesson","ex":[{"id":"A1.1a","t":"Set up your editor","p":"Install rust-analyzer in your editor of choice, open one of your Track 1 projects, and use it to (1) show the inferred type of a variable, (2) jump to the definition of a standard library function, (3) apply one quick fix. Note which editor you chose."},{"id":"A1.1b","t":"Clippy clean-up","p":"Run cargo clippy on your minigrep project from Chapter 12 and fix every warning. Then add a CI-style command that fails on warnings."}]},{"id":"A1.2","t":"Core syntax self-test","min":60,"learn":"A quick, timed check of variables, types, functions, control flow, ownership and borrowing. If anything here takes more than a few minutes, revisit the matching Track 1 chapter.","kind":"lesson","ex":[{"id":"A1.2a","t":"Run-length encoding","p":"Write rle(s &str) -> String that turns \"aaabccdddd\" into \"a3b1c2d4\". Include tests for an empty string and a single character."},{"id":"A1.2b","t":"Balanced brackets","p":"Write is_balanced(s &str) -> bool that checks (), [] and {} are properly nested, ignoring other characters."}]},{"id":"A1.3","t":"Structs, enums and matching review","min":45,"learn":"Model a small domain with structs and enums, implement methods, and handle every case with match, as a check before the deeper modules.","kind":"lesson","ex":[{"id":"A1.3a","t":"Pretty-print the expression","p":"Add a to_string-like method show(&self) -> String to the Expr enum that prints fully parenthesised infix notation, such as (-(2 + 3) * 4)."},{"id":"A1.3b","t":"A vending machine","p":"Model a vending machine as enum State { Idle, HasMoney(u32), Dispensing(String) } with a method next(self, event Event) -> State, where Event is InsertCoin(u32), Select(String, u32 price) or Cancel. Return an error message as a String when an event is invalid in the current state."}]}]},{"id":"a2","n":"A02","book":0,"t":"Standard collections in depth","goal":"Choose the right collection for the job, from Vec and VecDeque to HashMap, BTreeMap and BinaryHeap, and know their costs.","res":[["std::collections","https://doc.rust-lang.org/std/collections/"],["roadmap.sh/rust, data structures","https://roadmap.sh/rust"]],"items":[{"id":"A2.1","t":"Vec, stacks and queues","min":45,"learn":"Vec capacity and growth, using Vec as a stack, VecDeque as a double-ended queue, and why LinkedList is rarely the right choice in Rust.","kind":"lesson","ex":[{"id":"A2.1a","t":"A sliding window","p":"Write moving_average(values &[f64], window usize) -> Vec<f64> using a VecDeque to keep the last window values and a running sum."},{"id":"A2.1b","t":"A task queue with priorities by lane","p":"Simulate a support queue with two VecDeques, urgent and normal. Process tickets so that up to two urgent tickets are handled for every normal one, until both are empty, and return the processing order."}]},{"id":"A2.2","t":"HashMap, HashSet and hashing","min":45,"learn":"Using your own types as keys by deriving Hash and Eq, set operations with HashSet, and when hashing order and performance matter.","kind":"lesson","ex":[{"id":"A2.2a","t":"Find duplicates in a log","p":"Given a list of request ids, return the ids that appear more than once, sorted, using a HashSet for seen ids and another for duplicates."},{"id":"A2.2b","t":"Group by a composite key","p":"Given test results as (suite, platform, passed: bool), build a HashMap<(String, String), (u32, u32)> of pass and fail counts per suite and platform, and print the failing combinations."}]},{"id":"A2.3","t":"BTreeMap, BTreeSet and BinaryHeap","min":60,"learn":"Ordered maps and sets for sorted iteration and range queries, BinaryHeap as a priority queue, Reverse for a min-heap, and Ord for your own types.","kind":"lesson","ex":[{"id":"A2.3a","t":"Top K frequent words","p":"Return the k most frequent words in a text using a HashMap for counts and a BinaryHeap. Break ties alphabetically."},{"id":"A2.3b","t":"Shortest path with Dijkstra","p":"Implement Dijkstra's algorithm over an adjacency list Vec<Vec<(usize, u32)>> using a min-heap, returning the distance from a start node to every node (None if unreachable)."}]}]},{"id":"a3","n":"A03","book":0,"t":"Ownership, memory and lifetimes in depth","goal":"Reason precisely about where data lives, use borrowing patterns that keep the borrow checker happy, and read complex lifetime signatures.","res":[["The Rustonomicon, ownership","https://doc.rust-lang.org/nomicon/ownership.html"],["Common Rust lifetime misconceptions","https://github.com/pretzelhammer/rust-blog/blob/master/posts/common-rust-lifetime-misconceptions.md"],["std::borrow::Cow","https://doc.rust-lang.org/std/borrow/enum.Cow.html"]],"items":[{"id":"A3.1","t":"The stack, the heap and moves","min":45,"learn":"What lives on the stack and what on the heap, the size of common types, what a move physically does, and how to measure it with size_of.","kind":"lesson","ex":[{"id":"A3.1a","t":"Predict the sizes","p":"Before running, predict size_of for (u8, u32), [u16; 5], Option<&i32>, Result<u32, u8> and a struct { a: u8, b: u64, c: u8 }. Then check, and explain any surprise."},{"id":"A3.1b","t":"Cheap moves, expensive clones","p":"Time moving a Vec of ten million u64 into a function versus cloning it, in a release build, and explain the difference."}]},{"id":"A3.2","t":"Borrowing patterns that work","min":60,"learn":"Split borrows of struct fields, getting values out of &mut with mem::take and mem::replace, avoiding clones with Cow, and restructuring code when the borrow checker objects.","kind":"lesson","ex":[{"id":"A3.2a","t":"Drain a buffer without cloning","p":"Write a Logger struct with a Vec<String> of pending lines and a method drain_to(&mut self, sink &mut Vec<String>) that moves every line into the sink without cloning."},{"id":"A3.2b","t":"Escape HTML only when needed","p":"Write escape_html(s &str) -> Cow<str> that returns the input borrowed when it contains none of < > & \" and an owned escaped String otherwise. Test both paths."}]},{"id":"A3.3","t":"Lifetimes in depth","min":60,"learn":"Explicit lifetime annotations on structs and impls, the elision rules applied by hand, T 'static bounds and what they really mean, several lifetimes in one signature, and an intuition for variance.","kind":"lesson","ex":[{"id":"A3.3a","t":"Fix the elision trap","p":"This method fails to let the result outlive the borrow of self: fn get(&self, key: &str) -> &str on a struct Config<'a> { raw: &'a str } that returns a slice of raw. Fix the signature and show the caller using the result after the Config is dropped."},{"id":"A3.3b","t":"Owned or borrowed for threads","p":"Write fn spawn_all(names: &[&str]) -> Vec<JoinHandle<usize>> that starts a thread per name returning its length. Explain why passing the &str straight into thread::spawn fails, and fix it by moving owned Strings into the threads."}]}]},{"id":"a4","n":"A04","book":0,"t":"Error handling design","goal":"Design error types that callers can act on, use thiserror in libraries and anyhow in applications, and add context to failures.","res":[["std::error::Error","https://doc.rust-lang.org/std/error/trait.Error.html"],["thiserror","https://docs.rs/thiserror"],["anyhow","https://docs.rs/anyhow"]],"items":[{"id":"A4.1","t":"Custom error types by hand","min":60,"learn":"An error enum with one variant per failure, implementing Display and std::error::Error, From conversions so ? works, and exposing the underlying cause with source.","kind":"lesson","ex":[{"id":"A4.1a","t":"A bank transfer error","p":"Create enum TransferError { InsufficientFunds { needed u64, available u64 }, AccountNotFound(String), SameAccount } with Display and Error, and a transfer function that returns it. Test that callers can match on InsufficientFunds and read the amounts."},{"id":"A4.1b","t":"Walk the error chain","p":"Write fn report(e &dyn std::error::Error) -> String that prints an error and every source below it, one per line with \"caused by\", and use it on the ConfigError from the example."}]},{"id":"A4.2","t":"thiserror for libraries","min":45,"learn":"Derive Display, Error and From with thiserror, transparent wrapping, and why libraries should expose typed errors rather than anyhow.","kind":"lesson","ex":[{"id":"A4.2a","t":"Convert your error to thiserror","p":"Rewrite the TransferError from A4.1 with thiserror attributes, keeping the same messages and tests."},{"id":"A4.2b","t":"Wrap a lower layer","p":"Build a two-layer library, a storage module with StorageError (thiserror) and a service module with ServiceError that wraps it with #[from], plus a NotAuthorized variant. Show that ? converts storage errors in service code."}]},{"id":"A4.3","t":"anyhow for applications","min":45,"learn":"Use anyhow::Result in binaries, add context to errors with .context and .with_context, create ad-hoc errors with anyhow! and bail!, and print the full chain.","kind":"lesson","ex":[{"id":"A4.3a","t":"Context everywhere","p":"Write an app function that reads a list of file paths from a manifest file and returns their total size in bytes, adding context to every fallible step so a failure names the exact file."},{"id":"A4.3b","t":"Downcast when you must","p":"Return an anyhow::Error from a function that can fail with either an io::Error or your own ValidationError, then in main use downcast_ref to print a special message for ValidationError only."}]}]},{"id":"a5","n":"A05","book":0,"t":"Traits and generics in depth","goal":"Design generic APIs with the right bounds and associated types, use the standard conversion and comparison traits, and encode rules in types with PhantomData and const generics.","res":[["The Rust Reference, traits","https://doc.rust-lang.org/reference/items/traits.html"],["Rust API Guidelines","https://rust-lang.github.io/api-guidelines/"],["std::convert","https://doc.rust-lang.org/std/convert/"]],"items":[{"id":"A5.1","t":"Bounds, associated types and impl blocks","min":60,"learn":"Accept anything iterable with IntoIterator, associated types such as Iterator::Item in bounds, where clauses with associated type constraints, and inherent versus trait impl blocks.","kind":"lesson","ex":[{"id":"A5.1a","t":"A generic average","p":"Write fn average<I>(items I) -> Option<f64> for any IntoIterator whose items convert into f64, returning None for an empty input. Call it with a Vec<u32>, an array of f32 and an iterator chain."},{"id":"A5.1b","t":"Your own trait with an associated type","p":"Define trait Repository { type Item; type Id; fn get(&self, id: &Self::Id) -> Option<&Self::Item>; fn add(&mut self, item: Self::Item) -> Self::Id; } and implement it for an in-memory UserRepo with u32 ids. Write a generic fn add_all<R: Repository>(repo: &mut R, items: Vec<R::Item>) -> Vec<R::Id>."}]},{"id":"A5.2","t":"Conversion and comparison traits","min":60,"learn":"From and Into, TryFrom for fallible conversions, AsRef for flexible parameters, Default, FromStr for parse, and deriving or implementing PartialEq, Eq, PartialOrd, Ord and Hash correctly.","kind":"lesson","ex":[{"id":"A5.2a","t":"TryFrom for a validated type","p":"Implement TryFrom<u8> for a Weekday enum (1 = Monday ... 7 = Sunday) with a descriptive error, plus From<Weekday> for u8. Test round trips and an invalid value."},{"id":"A5.2b","t":"AsRef for flexible inputs","p":"Write fn count_lines<P AsRef<Path>>(path P) -> std::io::Result<usize> and show it accepting a &str, a: String and a PathBuf."}]},{"id":"A5.3","t":"Type-level programming","min":60,"learn":"Zero-sized marker types with PhantomData, the typestate pattern for compile-time state checks, const generics for sizes in types, and sealed traits.","kind":"lesson","ex":[{"id":"A5.3a","t":"A typestate request builder","p":"Build an HttpRequest builder where url() must be called before send() can exist, using NoUrl and HasUrl marker types. Header calls are allowed in both states."},{"id":"A5.3b","t":"Fixed-size vectors with const generics","p":"Write struct Vector<const N usize>([f64; N]) with dot(&self, other: &Self) -> f64 and implement Add for it. Show that adding a Vector<2> to a Vector<3> does not compile."}]}]},{"id":"a6","n":"A06","book":0,"t":"Crates, Cargo and documentation","goal":"Organise a crate for others, manage dependencies and features deliberately, and write documentation that is tested and easy to navigate.","res":[["The Cargo Book, features","https://doc.rust-lang.org/cargo/reference/features.html"],["The Cargo Book, specifying dependencies","https://doc.rust-lang.org/cargo/reference/specifying-dependencies.html"],["The rustdoc book","https://doc.rust-lang.org/rustdoc/"]],"items":[{"id":"A6.1","t":"Code organisation and visibility","min":45,"learn":"Visibility levels pub, pub(crate) and pub(super), a prelude module, organising a crate by feature rather than by type, and keeping the public API small.","kind":"lesson","ex":[{"id":"A6.1a","t":"Shrink a public API","p":"Take the billing example and decide, for each item, whether it should be pub, pub(crate) or private if billing were a published library. Write the reasoning as comments and adjust the code."},{"id":"A6.1b","t":"Organise by feature","p":"Sketch the src/ layout for a todo application with users, tasks and notifications, first organised by type (models, services, handlers) and then by feature (users, tasks, notifications). Note one advantage of each."}]},{"id":"A6.2","t":"Dependencies and features","min":45,"learn":"Semantic version requirements, cargo update and cargo tree, dev-dependencies and optional dependencies, defining your own features, and checking for vulnerabilities with cargo audit.","kind":"lesson","ex":[{"id":"A6.2a","t":"Add an optional feature","p":"Add a \"colors\" feature to a small CLI that, when enabled, prints errors in red using the owo-colors crate as an optional dependency, and falls back to plain text otherwise. Show the build commands for both."},{"id":"A6.2b","t":"Audit and inspect","p":"In one of your projects with dependencies, run cargo tree, cargo tree -d (duplicates) and cargo audit. Write down the deepest dependency chain and any advisory reported."}]},{"id":"A6.3","t":"Documentation with rustdoc","min":45,"learn":"Intra-doc links, doc tests that use the ? operator, hidden setup lines, documenting errors and panics, #![warn(missing_docs)], and README examples tested as doc tests.","kind":"lesson","ex":[{"id":"A6.3a","t":"Document a module properly","p":"Add crate docs, item docs with Examples and Errors sections, and intra-doc links to your textstats or durations crate. Run cargo doc --open and cargo test --doc, and fix every missing_docs warning."},{"id":"A6.3b","t":"Test the README","p":"Include your README.md in the crate docs with #![doc = include_str!(\"../README.md\")] so the README's Rust code blocks run as doc tests."}]}]},{"id":"a7","n":"A07","book":0,"t":"Concurrency and parallelism","goal":"Choose between channels, locks and atomics, avoid contention and deadlocks, and parallelise CPU-bound work with rayon.","res":[["Rust Atomics and Locks (free online)","https://marabos.nl/atomics/"],["std::sync","https://doc.rust-lang.org/std/sync/"],["rayon","https://docs.rs/rayon"]],"items":[{"id":"A7.1","t":"RwLock, Condvar and lazy statics","min":60,"learn":"Read-heavy sharing with RwLock, waiting for a condition with Condvar, one-time initialisation with OnceLock and LazyLock, and keeping lock scopes short.","kind":"lesson","ex":[{"id":"A7.1a","t":"A job board with Condvar","p":"Build a simple job board where worker threads wait on a Condvar until a job is posted to a shared Mutex<VecDeque<String>>, then take it. Post five jobs from main, then a \"stop\" message for each worker."},{"id":"A7.1b","t":"Read-mostly configuration","p":"Store a Config in Arc<RwLock<Config>>. Spawn three reader threads that read it in a loop and one writer that updates a field once. Make sure no reader holds the lock while printing."}]},{"id":"A7.2","t":"Atomics and memory ordering","min":60,"learn":"Atomic integers and booleans, fetch_add and compare_exchange, what Relaxed, Acquire, Release and SeqCst orderings guarantee, and a stop flag pattern.","kind":"lesson","ex":[{"id":"A7.2a","t":"A lock-free ID generator","p":"Write a struct IdGen { next AtomicU64 } with fn next(&self) -> u64, share it across eight threads that each take 1,000 ids, and prove that all 8,000 ids are unique."},{"id":"A7.2b","t":"compare_exchange for a one-time winner","p":"Several threads race to claim a prize stored in an AtomicU32 that starts at 0 (unclaimed). Use compare_exchange so exactly one thread succeeds and records its id; every other thread sees who won."}]},{"id":"A7.3","t":"Data parallelism with rayon","min":45,"learn":"Turn iterator chains into parallel ones with par_iter, parallel sorting, reductions, when parallelism helps and when overhead dominates, and Amdahl's law.","kind":"lesson","ex":[{"id":"A7.3a","t":"Parallel word frequencies","p":"Count word frequencies across many documents in parallel with rayon, using fold to build one HashMap per thread and reduce to merge them."},{"id":"A7.3b","t":"When parallel is slower","p":"Time summing 1,000 small numbers with iter().sum() and par_iter().sum() in a release build, then 100 million. Explain the result using the idea of overhead and Amdahl's law."}]}]},{"id":"a8","n":"A08","book":0,"t":"Async Rust with Tokio","goal":"Structure async applications with Tokio, write network servers and clients, share state and limit concurrency, and shut down cleanly.","res":[["Tokio tutorial","https://tokio.rs/tokio/tutorial"],["tokio docs","https://docs.rs/tokio"],["async-std","https://docs.rs/async-std"],["smol","https://docs.rs/smol"]],"items":[{"id":"A8.1","t":"Tasks, JoinSet and blocking work","min":60,"learn":"Spawn and manage many tasks with JoinSet, run blocking or CPU-heavy work with spawn_blocking, the multi-threaded and current-thread runtimes, and how async-std and smol compare.","kind":"lesson","ex":[{"id":"A8.1a","t":"Bounded fan-out","p":"Process 50 jobs with a JoinSet, but never run more than 5 at once. Each job sleeps a little and returns its id squared; collect all results."},{"id":"A8.1b","t":"Keep the runtime responsive","p":"Show the difference between computing a slow hash inside an async task and inside spawn_blocking by running a ticker task that prints every 10 ms on a current-thread runtime."}]},{"id":"A8.2","t":"Async networking","min":75,"learn":"A TCP echo server with TcpListener and one task per connection, a client with TcpStream, splitting streams into reader and writer halves, framing lines with BufReader, and timeouts.","kind":"lesson","ex":[{"id":"A8.2a","t":"A tiny key-value server","p":"Extend the echo server into a key-value server with commands SET key value, GET key and DEL key, storing data in an Arc<Mutex<HashMap<String, String>>> shared by all connections. Test it with a client in the same program."},{"id":"A8.2b","t":"Time out slow clients","p":"Add a 5-second idle timeout to the echo server's handle function, so a client that sends nothing for 5 seconds is disconnected with a goodbye message."}]},{"id":"A8.3","t":"Shared state, rate limits and graceful shutdown","min":60,"learn":"tokio::sync Mutex and RwLock versus std's, Semaphore for rate limiting, broadcast and watch channels, and shutting down on Ctrl+C with a shutdown signal shared by every task.","kind":"lesson","ex":[{"id":"A8.3a","t":"Rate-limited crawler skeleton","p":"Simulate fetching 20 URLs where the remote server allows at most 3 concurrent requests, using a Semaphore and JoinSet, and record the maximum concurrency observed with an AtomicUsize."},{"id":"A8.3b","t":"Broadcast events to subscribers","p":"Use tokio::sync::broadcast to send \"deploy started\", \"deploy finished\" events to three subscriber tasks that each print what they receive, and explain what happens to a subscriber that falls behind."}]}]},{"id":"a9","n":"A09","book":0,"t":"Macros and metaprogramming","goal":"Write robust declarative macros, understand and build a procedural derive macro, and design small domain-specific languages.","res":[["The Little Book of Rust Macros","https://veykril.github.io/tlborm/"],["The Rust Reference, macros by example","https://doc.rust-lang.org/reference/macros-by-example.html"],["syn","https://docs.rs/syn"],["quote","https://docs.rs/quote"]],"items":[{"id":"A9.1","t":"Declarative macros in depth","min":60,"learn":"All the fragment specifiers (expr, ident, ty, tt, pat, literal, block), nested repetition, recursive and internal rules, hygiene, $crate paths, and exporting macros from a library.","kind":"lesson","ex":[{"id":"A9.1a","t":"A test-table macro","p":"Write a macro test_cases! that turns lines like add_small: (1, 2) => 3 into separate #[test] functions calling a function add, so each case shows up by name in cargo test."},{"id":"A9.1b","t":"A counting macro with internal rules","p":"Write count! that counts its arguments at compile time (count!(a, b, c) == 3) using an internal rule, then use it inside a macro that builds a fixed-size array type [T; count!(...)]."}]},{"id":"A9.2","t":"Procedural macros and custom derive","min":75,"learn":"How a proc-macro crate works, parsing input with syn, generating code with quote, writing a derive macro, and reporting good compile errors with syn::Error.","kind":"lesson","ex":[{"id":"A9.2a","t":"Build the derive","p":"Create a workspace with describe_derive (proc-macro) and app crates, implement the Describe derive from the example, and add a test in app that checks the output for a struct with three fields. Then try it on an enum and read the error."},{"id":"A9.2b","t":"A builder derive (stretch)","p":"Extend the proc-macro crate with #[derive(Builder)] that generates a FooBuilder with an Option field and a setter per field, and a build() returning Result<Foo, String> that names the first missing field."}]},{"id":"A9.3","t":"Domain-specific languages with macros","min":45,"learn":"When a macro DSL is worth it, designing readable syntax with tt munching, keeping DSLs type-checked by expanding to ordinary Rust, and alternatives such as builder APIs.","kind":"lesson","ex":[{"id":"A9.3a","t":"An HTML DSL","p":"Write html! so html!(div { p { \"Hello\" } p { \"World\" } }) produces the string <div><p>Hello<\/p><p>World<\/p><\/div>. Support nested tags and string literals."},{"id":"A9.3b","t":"Macro or builder","p":"For each case decide whether you would write a macro, a builder API or a plain function, and give a one-sentence reason: (1) defining 40 similar error variants with messages, (2) configuring an HTTP client with optional settings, (3) a test table with 30 input/output pairs, (4) formatting a log line."}]}]},{"id":"a10","n":"A10","book":0,"t":"Testing, debugging and performance","goal":"Design testable code with trait-based mocks, find edge cases with property-based testing, debug with logs and debuggers, and measure performance properly.","res":[["proptest book","https://proptest-rs.github.io/proptest/"],["criterion.rs","https://bheisler.github.io/criterion.rs/book/"],["tracing","https://docs.rs/tracing"],["The Rust Performance Book","https://nnethercote.github.io/perf-book/"]],"items":[{"id":"A10.1","t":"Testable design and mocking","min":60,"learn":"Depend on traits instead of concrete services, inject fakes and mocks in tests, test time and randomness deterministically, and organise unit, integration and doc tests.","kind":"lesson","ex":[{"id":"A10.1a","t":"Test a retrying client","p":"Write trait Transport { fn get(&self, url: &str) -> Result<String, String>; } and fetch_with_retry(t: &impl Transport, url: &str, attempts: u32). Test it with a fake transport that fails a set number of times before succeeding, and assert how many calls were made."},{"id":"A10.1b","t":"Deterministic randomness","p":"Write a shuffle-based function pick_winners(names: &[&str], n: usize, rng: &mut impl rand::Rng) -> Vec<String>, and test it with a seeded StdRng so the result is repeatable."}]},{"id":"A10.2","t":"Property-based testing","min":60,"learn":"Describe properties that must hold for all inputs, let proptest generate and shrink failing cases, write round-trip and oracle properties, and keep regression files.","kind":"lesson","ex":[{"id":"A10.2a","t":"Properties for a sort","p":"Write my_sort(v: &mut Vec<i32>) using insertion sort and test three properties with proptest: the output is ordered, it has the same length, and it matches the standard sort (an oracle)."},{"id":"A10.2b","t":"Find the bug proptest finds","p":"This parser has a bug: fn parse_csv_line(s: &str) -> Vec<String> { s.split(',').map(|x| x.trim().to_string()).collect() } paired with fn join(fields: &[String]) -> String { fields.join(\",\") }. Write a round-trip property, let proptest find a failing input, and explain the bug."}]},{"id":"A10.3","t":"Debugging, logging and benchmarking","min":60,"learn":"Structured logs with tracing, stepping through code with rust-gdb or rust-lldb (or the editor debugger), benchmarks with criterion, and finding hot spots with flamegraphs.","kind":"lesson","ex":[{"id":"A10.3a","t":"A criterion benchmark","p":"Benchmark two implementations of counting vowels (a loop with match and a filter with contains) using criterion, and report which is faster on a 10 KB string."},{"id":"A10.3b","t":"Debug a wrong answer","p":"This function should return the second largest value but returns the wrong result for [5, 5, 3]: fn second_largest(v: &[i32]) -> Option<i32> { let mut s = v.to_vec(); s.sort(); s.get(s.len() - 2).copied() }. Use dbg! or a debugger to find why, then fix it and add tests, including an empty slice."}]}]},{"id":"a11","n":"A11","book":0,"t":"Ecosystem I: data, CLIs and HTTP","goal":"Serialise data with serde, build polished command-line tools with clap, and call web APIs with reqwest.","res":[["serde.rs","https://serde.rs/"],["clap","https://docs.rs/clap"],["reqwest","https://docs.rs/reqwest"],["Command Line Applications in Rust","https://rust-cli.github.io/book/"]],"items":[{"id":"A11.1","t":"Serialisation with serde","min":60,"learn":"Derive Serialize and Deserialize, read and write JSON and TOML, rename fields, defaults and optional fields, enums with tags, and handling unknown or invalid data.","kind":"lesson","ex":[{"id":"A11.1a","t":"Load a config file","p":"Define a Config with server (host, port), a list of upstream URLs and an optional log_level defaulting to \"info\", load it from TOML, and test both a full file and a minimal one."},{"id":"A11.1b","t":"Process a JSON API response","p":"Parse a JSON array of issues (id, title, labels, an optional assignee) from a string, ignoring unknown fields, then print the titles of unassigned issues labelled \"bug\"."}]},{"id":"A11.2","t":"Command-line tools with clap","min":60,"learn":"Define arguments, options, flags and subcommands with clap's derive API, generate help and version output, validate values, and read configuration from environment variables.","kind":"lesson","ex":[{"id":"A11.2a","t":"A file statistics CLI","p":"Build a clap CLI fstat with a list of file paths, a --format option accepting text or json, and a --top N option showing the N longest lines. Test the argument parsing with Cli::try_parse_from."},{"id":"A11.2b","t":"Exit codes and stderr","p":"Make a CLI that validates an email list file and exits with code 0 if all are valid, 1 if some are invalid (printing them to stderr), and 2 for usage or I/O errors. Explain why distinct exit codes matter in scripts and CI."}]},{"id":"A11.3","t":"HTTP clients with reqwest","min":45,"learn":"Make GET and POST requests with reqwest, decode JSON responses into structs, set headers, timeouts and query parameters, handle HTTP errors with error_for_status, and know what hyper does underneath.","kind":"lesson","ex":[{"id":"A11.3a","t":"A JSON API client","p":"Write an async function that fetches https://httpbin.org/get?course=rust with a custom header X-Student, parses the JSON echo into a struct, and returns the header value the server saw. Handle a timeout of 5 seconds."},{"id":"A11.3b","t":"Parallel requests with a limit","p":"Fetch the status codes of 10 URLs concurrently with at most 3 requests in flight, using futures::stream::iter(...).buffer_unordered(3), and print a status line per URL."}]}]},{"id":"a12","n":"A12","book":0,"t":"Ecosystem II: web, databases, FFI and WebAssembly","goal":"Build a JSON web API with axum, store data in SQLite, call and expose C functions safely, and compile Rust to WebAssembly for the browser.","res":[["axum","https://docs.rs/axum"],["rusqlite","https://docs.rs/rusqlite"],["sqlx","https://docs.rs/sqlx"],["The Rustonomicon, FFI","https://doc.rust-lang.org/nomicon/ffi.html"],["Rust and WebAssembly","https://rustwasm.github.io/docs/book/"]],"items":[{"id":"A12.1","t":"Web APIs with axum","min":75,"learn":"Routes and handlers, extractors for paths, queries and JSON bodies, shared state with State, returning status codes and JSON, and testing handlers without a network.","kind":"lesson","ex":[{"id":"A12.1a","t":"Add update and delete","p":"Extend the notes API with PUT /notes/{id} (replace the text, 404 if missing) and DELETE /notes/{id} (204 on success, 404 if missing), with tests for both."},{"id":"A12.1b","t":"Validation and error responses","p":"Make create reject empty or longer-than-280-character text with 422 Unprocessable Entity and a JSON body {\"error\":\"...\"}, by introducing an ApiError enum that implements IntoResponse."}]},{"id":"A12.2","t":"Databases with rusqlite and sqlx","min":60,"learn":"Open a SQLite database, create tables, insert with parameters (never string formatting), query rows into structs, use transactions, and how sqlx offers async and compile-time checked queries for Postgres and others.","kind":"lesson","ex":[{"id":"A12.2a","t":"A repository over SQLite","p":"Write a BugRepo struct wrapping a Connection with add(title, severity) -> i64, by_severity(sev) -> Vec<Bug> and close(id) -> bool (sets a closed flag). Test it with an in-memory database."},{"id":"A12.2b","t":"Transactions keep data consistent","p":"Write transfer(conn: &mut Connection, from: i64, to: i64, amount: i64) -> Result<()> over an accounts table that debits and credits inside one transaction and rolls back if the balance would go negative. Test that a failed transfer changes nothing."}]},{"id":"A12.3","t":"Unsafe Rust and FFI","min":60,"learn":"Call C functions through extern blocks, convert strings with CString and CStr, expose Rust functions to C with extern \"C\" and no_mangle, raw pointers across the boundary, and wrapping it all in a safe API.","kind":"lesson","ex":[{"id":"A12.3a","t":"Wrap getenv safely","p":"Call C's getenv through an extern block and write a safe wrapper fn c_getenv(name: &str) -> Option<String> that handles null pointers and invalid UTF-8. Compare its result with std::env::var for PATH."},{"id":"A12.3b","t":"Expose Rust to C","p":"Write a Rust library function exported to C, extern \"C\" fn word_count(text: *const c_char) -> usize, that returns 0 for a null pointer, and a small C program header line declaring it. Explain how you would build it as a shared library."}]},{"id":"A12.4","t":"WebAssembly with wasm-bindgen","min":60,"learn":"Compile Rust to WebAssembly, export functions to JavaScript with wasm-bindgen, build and package with wasm-pack, pass strings and numbers across the boundary, and where WASM fits (and where it does not). A short tour of GUI (Tauri), games (Bevy) and embedded (embedded-hal) closes Track 2.","kind":"lesson","ex":[{"id":"A12.4a","t":"Build and run it in a page","p":"Install wasm-pack, build the reading-time library with --target web, and load it from a minimal index.html with a textarea that updates the reading time as you type. Serve the folder with any static server."},{"id":"A12.4b","t":"Pick the right ecosystem crate","p":"For each project, name the crate or framework you would start with and one sentence why. (1) A desktop app with a web UI. (2) A 2D game. (3) Firmware for a microcontroller. (4) A full-stack web app in Rust. (5) A REST service with Postgres."}]}]}];

var MPF=[{"id":"q1","n":"Q1","book":0,"t":"loadtest: an HTTP load-testing CLI","goal":"Build a command-line load tester that fires concurrent HTTP requests at a target, measures latency percentiles and error rates, and prints a clear report, the kind of tool performance testers use every day.","res":[["tokio","https://docs.rs/tokio"],["reqwest","https://docs.rs/reqwest"],["clap","https://docs.rs/clap"],["hdrhistogram","https://docs.rs/hdrhistogram"]],"items":[{"id":"Q1.1","t":"Plan the tool","min":45,"learn":"Define what the tool measures (throughput, latency percentiles, status codes, errors), the command-line interface, and a design that keeps the statistics code independent from the network so it can be tested.","kind":"project","ex":[{"id":"Q1.1a","t":"Write the README first","p":"Write the README sections for loadtest before any code, a one-line description, an example command, an example report, the flags, and a \"how results are calculated\" note explaining percentiles."},{"id":"Q1.1b","t":"List the test cases","p":"Write the list of test cases you will need, grouped into statistics, scheduling and CLI parsing, with at least four cases per group, including edge cases."}]},{"id":"Q1.2","t":"Build the core","min":120,"learn":"Implement latency statistics and a concurrency-limited runner over the Target trait, both fully tested with a fake target and no network.","kind":"project","ex":[{"id":"Q1.2a","t":"The concurrency-limited runner","p":"Write async fn run<T: Target + Sync>(target &T, requests usize, concurrency usize) -> Vec<Outcome> that keeps at most concurrency requests in flight, using futures::stream with buffer_unordered. Test it with a fake target that sleeps 10 ms and tracks peak in-flight requests."},{"id":"Q1.2b","t":"The real HTTP target","p":"Implement Target for an HttpTarget holding a reqwest::Client and a URL, mapping responses to Outcome::Response and failures to Outcome::Error with a kind of \"timeout\", \"connect\" or \"other\"."}]},{"id":"Q1.3","t":"Ship it","min":90,"learn":"Wire the CLI with clap, print human and JSON reports, add a GitHub Actions workflow running fmt, clippy and tests, and publish a release with binaries.","kind":"project","ex":[{"id":"Q1.3a","t":"The report printer","p":"Write fn render(s &Summary, elapsed Duration) -> String producing the human report from the README, and fn render_json(...) using serde. Test the human output for a known summary."},{"id":"Q1.3b","t":"Release it","p":"Tag a v0.1.0 release, add a release workflow that builds binaries for Linux, macOS and Windows and attaches them to the GitHub release, and write the two CV bullets with your measured numbers."}]}]},{"id":"q2","n":"Q2","book":0,"t":"testlens: a flaky test detector","goal":"Parse JUnit XML test reports from many CI runs, compute pass rates per test, flag flaky tests and slowest suites, and print a report a QA lead can act on.","res":[["roxmltree","https://docs.rs/roxmltree"],["JUnit XML format overview","https://github.com/testmoapp/junitxml"],["walkdir","https://docs.rs/walkdir"]],"items":[{"id":"Q2.1","t":"Plan the analyser","min":45,"learn":"Understand the JUnit XML format, define what \"flaky\" means for this tool, and model test cases, runs and verdicts as types.","kind":"project","ex":[{"id":"Q2.1a","t":"Define the report","p":"Write the output you want testlens to print for a folder of 20 CI reports, including overall pass rate, the flaky tests sorted by failure rate, consistently failing tests, and the five slowest tests by average time."},{"id":"Q2.1b","t":"Collect sample data","p":"Create a tests/fixtures folder with three small JUnit XML files that together contain one flaky test, one always-failing test, one skipped test and one always-passing test. These become your integration test inputs."}]},{"id":"Q2.2","t":"Build the parser and the analysis","min":120,"learn":"Parse JUnit XML with roxmltree into CaseResult values, then aggregate results across runs into per-test statistics with flaky and broken classification.","kind":"project","ex":[{"id":"Q2.2a","t":"Aggregate across runs","p":"Write fn analyse(runs: &[Vec<CaseResult>]) -> Vec<TestStats> where TestStats has id, passes, fails, avg_seconds and a Class (Stable, Flaky, Broken). Sort flaky tests first by failure rate. Test it with the three-run scenario from your fixtures."},{"id":"Q2.2b","t":"Read a whole folder","p":"Write fn load_dir(path &Path) -> anyhow::Result<Vec<Vec<CaseResult>>> that parses every .xml file in a folder (one run per file), sorted by file name, adding the file name as context to any parse error. Test it with a temporary folder."}]},{"id":"Q2.3","t":"Ship it","min":90,"learn":"Add a clap CLI with a --min-runs filter and --json output, an exit code that fails CI when new flaky tests appear, a GitHub Action example, and documentation.","kind":"project","ex":[{"id":"Q2.3a","t":"Exit codes for CI","p":"Implement fn exit_code(stats &[TestStats], allow &HashSet<String>, fail_on_flaky bool) -> u8 returning 0 when all is well, 1 when there are flaky tests not in the allow-list (only if fail_on_flaky), and 2 when any test is broken. Test each case."},{"id":"Q2.3b","t":"Document and publish","p":"Write the README (problem, install, usage, CI example, how flakiness is defined), add the CI workflow from Q1, tag v0.1.0, and draft two CV bullets using numbers from running testlens on a real project's reports."}]}]},{"id":"q3","n":"Q3","book":0,"t":"logwatch: a log-based intrusion detector","goal":"Watch authentication logs on your own server, detect repeated failed logins per IP within a time window, and raise alerts, with a design that is fast, testable and safe to run continuously.","res":[["regex","https://docs.rs/regex"],["chrono","https://docs.rs/chrono"],["notify","https://docs.rs/notify"]],"items":[{"id":"Q3.1","t":"Plan the detector","min":45,"learn":"Choose the log format to support (OpenSSH auth.log), define the detection rule (N failures from one IP within W seconds), plan alert outputs, and note the ethical limits, monitoring only systems you own or are authorised to monitor.","kind":"project","ex":[{"id":"Q3.1a","t":"Threat model in one page","p":"Write a short threat model for logwatch, what it detects (password brute force, user enumeration), what it does not (attacks that do not log, distributed low-and-slow attempts), false positives to expect, and what the alert should contain."},{"id":"Q3.1b","t":"Fixture logs","p":"Create a tests/fixtures/auth.log with about 15 lines covering a brute-force burst from one IP, a few scattered failures from another, a successful login after failures, and unrelated lines that must be ignored."}]},{"id":"Q3.2","t":"Build the parser and the detector","min":120,"learn":"Parse log lines with a compiled regex into events, then detect bursts with a per-IP sliding window of timestamps in a VecDeque, clearing an IP's history after a successful login.","kind":"project","ex":[{"id":"Q3.2a","t":"The sliding-window detector","p":"Write struct Detector { rule: Rule, windows: HashMap<String, VecDeque<u64>> } with fn observe(&mut self, ip: &str, failed: bool, ts: u64) -> Option<Alert>. Failures push the timestamp and drop ones older than the window; reaching the threshold returns an Alert once and clears that IP. A success clears the IP's window. Test a burst, a slow trickle that never alerts, and a reset after success."},{"id":"Q3.2b","t":"Flag success after failures","p":"Extend the detector so a successful login from an IP that had at least two recent failures returns a high-severity Alert with a flag compromised_suspect set to true. Add a test."}]},{"id":"Q3.3","t":"Ship it","min":90,"learn":"Follow a growing log file like tail -f, send alerts to stdout as JSON lines (and optionally a webhook), add a benchmark on a large synthetic log, and document safe deployment as a systemd service.","kind":"project","ex":[{"id":"Q3.3a","t":"Benchmark on a big log","p":"Generate a synthetic 1,000,000-line auth log (mostly benign lines, some attacks) and measure how many lines per second your parser and detector process in a release build. Record the number for your README and CV."},{"id":"Q3.3b","t":"Run it as a service","p":"Write a systemd unit file that runs logwatch against /var/log/auth.log as a dedicated unprivileged user with read access to the log, restarts on failure, and writes alerts to the journal. Add the setup steps to the README."}]}]},{"id":"w1","n":"W1","book":0,"t":"taskhub: a JSON API with axum and SQLite","goal":"Build a production-shaped REST API for tasks with axum and SQLite, with validation, consistent errors, pagination, tests at every layer, structured logs and a Docker image.","res":[["axum examples","https://github.com/tokio-rs/axum/tree/main/examples"],["rusqlite","https://docs.rs/rusqlite"],["tower-http","https://docs.rs/tower-http"]],"items":[{"id":"W1.1","t":"Plan the API","min":45,"learn":"Design the resources, routes, request and response shapes, status codes and error format before writing handlers, and choose a layered structure (routes, service, repository).","kind":"project","ex":[{"id":"W1.1a","t":"Decide the edge cases","p":"For each route, list the edge cases and the exact status code you will return, including invalid JSON, unknown fields, a non-numeric id, a page beyond the end and a PATCH with an empty body."},{"id":"W1.1b","t":"Sketch the project layout","p":"Write the folder and module layout for taskhub, separating main.rs, the router, handlers, the domain model, the repository and errors, and mark which modules you will unit test and which you will test through HTTP."}]},{"id":"W1.2","t":"Build the repository and handlers","min":150,"learn":"Implement the SQLite repository behind a Mutex, the error type with IntoResponse, validated create and patch handlers, pagination, and HTTP tests with oneshot.","kind":"project","ex":[{"id":"W1.2a","t":"The task repository","p":"Implement TaskRepo with create, get, list(done Option<bool>, page u32, pe function planSessions(n){
  var t=today(),out=[];
  var q=[],pi=pathItems();
  pi.forEach(function(i,idx){
    if(!S.done[i.id]){var f=i.ex.length?exDone(i)/i.ex.length:0;q.push({it:i,rem:Math.max(10,Math.round(i.min*(1-f))),started:exDone(i)>0});}
    var nx=pi[idx+1];
    if(!nx||nx.mod.id!==i.mod.id){
      var m=i.mod,c=courseOf(m.id);
      if((QUIZ[m.id]||[]).some(function(x){return x.pool==="quiz";})&&!(S.quiz&&S.quiz[m.id]))q.push({quiz:m,rem:15,started:false});
      if(c&&!c.studio){
        var mi=c.mods.indexOf(m.id),half=Math.ceil(c.mods.length/2)-1;
        if(mi===half&&c.mods.length>1&&!(S.exam&&S.exam[c.code+"-mid"])){var dm=examDef(c,"mid");if(dm.pool.length)q.push({exam:c,which:"mid",rem:dm.minutes,started:false});}
        if(mi===c.mods.length-1&&!(S.exam&&S.exam[c.code+"-final"])){var df=examDef(c,"final");if(df.pool.length)q.push({exam:c,which:"final",rem:df.minutes,started:false});}
      }
    }
  });
  var revs=Object.keys(S.rev).map(function(id){return {id:id,due:S.rev[id].due,it:ITEMS.find(function(i){return i.id===id;})};})
    .filter(function(x){return x.it;}).sort(function(a,b){return a.due<b.due?-1:1;});
  var used={},d=S.startDate>t?S.startDate:t;
  for(var k=0;k<60&&out.length<n;k++,d=addDays(d,1)){
    if(!S.days.includes(parse(d).getDay()))continue;
    var cap=S.minutes,rows=[],nr=0;
    revs.forEach(function(r){if(!used[r.id]&&r.due<=d&&nr<3&&cap>=20){used[r.id]=1;nr++;cap-=10;rows.push({it:r.it,min:10,kind:"review"});}});
    while(cap>0&&q.length){
      var h=q[0];
      if(cap<15&&h.rem>cap)break;
      var take=Math.min(h.rem,cap);
      if(h.quiz||h.exam){if(h.rem>cap&&rows.length)break;take=h.rem;rows.push({quiz:h.quiz,exam:h.exam,which:h.which,min:take,kind:h.quiz?"quiz":"exam"});h.rem=0;cap=Math.max(0,cap-take);q.shift();continue;}
      rows.push({it:h.it,min:take,kind:take<h.rem?(h.started?"continue":"start"):(h.started?"finish":"lesson")});
      h.rem-=take;h.started=true;cap-=take;
      if(h.rem<=0)q.shift();
    }
    out.push({date:d,rows:rows,used:S.minutes-cap});
    if(!q.length&&!rows.length)break;
  }
  return out;
}

/* ================= Python runner (Pyodide in a worker) ================= */
var PY={w:null,ready:null,seq:0,pending:{},failed:false,status:""};
function pyStart(){
  if(PY.ready)return PY.ready;
  PY.ready=new Promise(function(res,rej){
    var w;
    try{w=new Worker("py-worker.js");}catch(e){PY.failed=true;rej(e);return;}
    PY.w=w;
    var guard=setTimeout(function(){PY.failed=true;rej(new Error("Python took too long to load"));},120000);
    w.onmessage=function(ev){
      var m=ev.data||{};
      if(m.type==="ready"){clearTimeout(guard);res(w);return;}
      if(m.type==="fail"){clearTimeout(guard);PY.failed=true;rej(new Error(m.error||"Python could not start"));return;}
      var p=PY.pending[m.id];
      if(p){delete PY.pending[m.id];clearTimeout(p.t);p.res(m);}
    };
    w.onerror=function(e){clearTimeout(guard);PY.failed=true;rej(e);};
  });
  return PY.ready;
}
function pyReset(){try{PY.w&&PY.w.terminate();}catch(e){}PY.w=null;PY.ready=null;PY.failed=false;}
function pyCall(msg,ms){
  return pyStart().then(function(w){
    return new Promise(function(res){
      var id=++PY.seq;
      var t=setTimeout(function(){delete PY.pending[id];pyReset();res({id:id,timeout:true});},ms);
      PY.pending[id]={res:res,t:t};
      w.postMessage(Object.assign({id:id},msg));
    });
  });
}

    var mid=S.exam&&S.exam[c.code+"-mid"],fin=S.exam&&S.exam[c.code+"-final"];
    var qSo=qTaken.length?qTaken.reduce(function(a,m){return a+S.quiz[m].best;},0)/qTaken.length:0;
    comps=[{k:"Exercises",w:30,v:exAvg,vs:exSo,has:touched,note:exDoneL.length+"/"+exs.length},{k:"Quizzes",w:20,v:qAvg,vs:qSo,has:qTaken.length>0,note:qTaken.length+"/"+qm.length},{k:"Midterm",w:20,v:mid?mid.best:0,vs:mid?mid.best:0,has:!!mid},{k:"Final",w:30,v:fin?fin.best:0,vs:fin?fin.best:0,has:!!fin}];

  var it=ITEMS.find(function(i){return i.id===lid;});
  if(body&&it){
    var y=window.scrollY,focusId=document.activeElement&&document.activeElement.id;
    body.innerHTML=itemBody(it);highlight(body.closest("details")||body);
    window.scrollTo(0,y);
    if(focusId){var f=document.getElementById(focusId);if(f)f.focus();}
  }else render();
}
async function doRun(eid,mode){
  var info=exInfo(eid);if(!info)return;
  var ta=document.getElementById("ed-"+eid),code=ta?ta.value:(CODE[eid]||"");
  var si=document.getElementById("in-"+eid);
  var r=RUNOUT[eid]=RUNOUT[eid]||{};r.stdin=si?si.value:(r.stdin||"");
  codeSave(eid,code);
  r.busy=PY.w?(mode==="check"?"Checking...":"Running..."):"Loading Python (first time only, about 14 MB)...";
  r.tests=mode==="check"?null:r.tests;
  refreshItem(info.it.id);
  try{
    if(mode==="check"){
      var spec=GRADE[eid];
      var res=await pyCall({type:"grade",code:code,spec:JSON.stringify({main:!!spec.main,cases:spec.cases})},20000);
      r.busy="";
      if(res.timeout){r.tests=null;r.out="";r.err="Stopped after 20 seconds. Check for an infinite loop or an input() the tests didn't expect.";}
      else if(res.error){r.err=res.error;}
      else{
        r.tests=JSON.parse(res.result);r.out=null;r.err="";
        var pass=r.tests.filter(function(x){return x.ok;}).length;
        S.auto=S.auto||{};var prev=S.auto[eid];
        S.auto[eid]={p:Math.max(pass,prev?prev.p:0),t:r.tests.length,at:today()};
        if(pass===r.tests.length){
          if(!S.ex[eid]){S.ex[eid]=today();bump(1);}
          toast("All tests passed. Exercise ticked off.");
        }
        save();
      }
    }else{
      var rr=await pyCall({type:"run",code:code,stdin:r.stdin},10000);
      r.busy="";
      if(rr.timeout){r.out="";r.err="Stopped after 10 seconds. Check for an infinite loop, or add the answers your program asks for under Program input.";}
      else if(rr.error){r.err=rr.error;}
      else{var o=JSON.parse(rr.result);r.out=o.out;r.err=o.err;}
    }
  }catch(e){
    r.busy="";r.err="Python couldn't start in this view. You can still copy the code into your own editor.";
    PY.failed=true;
  }
  refreshItem(info.it.id);
}
async function doReview(eid){
  var info=exInfo(eid);if(!info||!SAMPLE)return;
  var ta=document.getElementById("ed-"+eid),code=(ta?ta.value:(CODE[eid]||"")).trim();
  if(!code){toast("Write or paste your answer first.");return;}
  codeSave(eid,code);
  var r=RUNOUT[eid]=RUNOUT[eid]||{};
  var tests=r.tests?r.tests.filter(function(x){return x.ok;}).length+" of "+r.tests.length+" tests passed"+(r.tests.some(function(x){return !x.ok;})?" (failed: "+r.tests.filter(function(x){return !x.ok;}).map(function(x){return x.name;}).join(", ")+")":""):"";
  r.taBusy=true;r.ta=null;r.taErr="";refreshItem(info.it.id);
  try{
    var j=await SAMPLE.json(taReviewPrompt(info,code,tests),{modelTier:"default"});
    var sc=Math.max(0,Math.min(100,Math.round(Number(j&&j.score)||0)));
    j.score=sc;r.ta=j;
    S.ta=S.ta||{};var prev=S.ta[eid];S.ta[eid]={score:Math.max(sc,prev?prev.score:0),last:sc,at:today()};
    save();
  }catch(e){r.taErr=taErr(e);}
  r.taBusy=false;refreshItem(info.it.id);
}
async function doAsk(lid){
  var it=ITEMS.find(function(i){return i.id===lid;});if(!it||!SAMPLE)return;
  var box=document.getElementById("ask-"+lid),q=box?box.value.trim():"";
  if(!q)return;
  var ch=taChats[lid]=taChats[lid]||{turns:[]};
  ch.turns.push({role:"user",content:q});ch.busy=true;ch.live="";ch.err="";ch.ctl=new AbortController();
  refreshItem(lid);
  try{
    var hist=ch.turns.slice(-10);
    var res=await SAMPLE(taAskPrompt(it,hist),{cache:false,signal:ch.ctl.signal,modelTier:"default",onText:function(u){ch.live=u.text;var el=document.getElementById("ta-live-"+lid);if(el)el.textContent=u.text;}});
    ch.turns.push({role:"assistant",content:res.text});
  }catch(e){if(e&&e.text)ch.turns.push({role:"assistant",content:e.text});ch.err=taErr(e);}
  ch.busy=false;ch.live="";refreshItem(lid);
}

  var d=EXAM.def,done=EXAM.done,st={ans:EXAM.ans,done:done,result:EXAM.result};

    (done?"":"<div class=\"timer\" id=\"exam-timer\">"+d.minutes+":00</div>")+"</div>";
  var res="";
  if(done){
    var r=EXAM.result,passed=r.pct>=d.pass;
    res="<section class=\"panel exam-res "+(passed?"pass":"fail")+"\"><h2>"+r.pct+"% · "+(passed?"Pass":"Below the pass mark")+"</h2><p>"+r.right+" of "+r.total+" correct. Review the answers below, then go back to your grades.</p>";
    if(d.cert){var c=CERT[d.cert],secs={};EXAM.qs.forEach(function(q,i){var s=secs[q.section]||(secs[q.section]={r:0,t:0});s.t++;if(r.per[i])s.r++;});
      res+="<ul class=\"secs\">"+(c.sections||[]).map(function(s){var x=secs[s.id]||{r:0,t:0};return "<li><span>"+esc(s.id+". "+s.title)+"</span><b>"+x.r+"/"+x.t+"</b></li>";}).join("")+"</ul>";}
    res+="<div class=\"row\"><button class=\"btn primary\" data-act=\"examclose\">Back to grades</button></div></section>";
  }

  var foot=done?"":"<div class=\"row exam-foot\"><button class=\"btn primary\" data-act=\"examsubmit\">Submit exam</button><button class=\"btn\" data-act=\"examquit\">Leave without submitting</button><span class=\"note\" id=\"exam-count\">"+Object.keys(EXAM.ans).length+" of "+EXAM.qs.length+" answered</span></div>";
  return head+res+body+foot;

      var gradeCell=cg.complete?"<b class=\"gl\">"+cg.letter[0]+"</b><span class=\"note\">"+cg.pct+"%</span>":cg.any?"<span class=\"ip\">In progress</span><span class=\"note\">"+cg.pct+"% on work so far</span>":"<span class=\"note\">Not started</span>";
      var comps=cg.comps.map(function(x){return "<span class=\"cp"+(x.has?" has":"")+"\">"+x.k+" "+x.w+"%"+(x.has?": "+Math.round(cg.complete?x.v:x.vs)+"%":"")+(x.note&&x.has?" ("+x.note+" done)":"")+"</span>";}).join("");
      var exams="";

          exams+="<button class=\"btn small\" data-act=\"exam\" data-id=\""+c.code+"\" data-v=\""+w+"\""+(d.pool.length?"":" disabled")+">"+(w==="mid"?"Midterm":"Final")+(rec?" · "+rec.best+"%":"")+"</button>";});

        "<div class=\"comps\">"+comps+"</div>"+(exams?"<div class=\"row\">"+exams+"</div>":"")+"</li>";
    }).join("");
    return "<section class=\"panel year\"><div class=\"y-h\"><h2>"+YEARS[y]+"</h2></div><ul class=\"courses\">"+rows+"</ul></section>";
  }).join("");

  return "<div class=\"intro\"><div><h1>Grades</h1><p class=\"muted\">Your course grades, quizzes and exams. Grades update as you complete exercises, quizzes and exams.</p></div></div>"+
    "<dl class=\"stats\"><div><dt>GPA</dt><dd>"+(g.gpa!=null?g.gpa.toFixed(2)+" / 4.0":"—")+"</dd></div><div><dt>Credits earned</dt><dd>"+g.earned+" / "+g.total+"</dd></div><div><dt>Courses completed</dt><dd>"+COURSES.filter(function(c){return courseGrade(c).complete;}).length+" / "+COURSES.length+"</dd></div></dl>"+
    "<p class=\"note\" style=\"margin:-8px 0 16px\">Lecture courses: exercises 30%, chapter quizzes 20%, midterm 20%, final 30%. Studio courses: project work 70% (tests and TA reviews), completion 30%. Letter grades on a 4.0 scale; 60% passes. Exercises score 100 when solved unaided, 70 when you used the solution, or your TA score if higher.</p>"+
    years+
    "<p class=\"note\" style=\"margin-top:16px\">Grades here track your own progress. Rust has no widely recognised certification, so employers judge Rust skills by your code: the Track 3 projects and the minigrep and web server repositories are what to show.</p>"+
    "<section class=\"panel\" style=\"margin-top:20px\"><h2>Back up your progress</h2><p class=\"note\" style=\"margin:6px 0 10px\">Save a copy of your progress and code drafts as a file, or load one back in. Use it to move between the online page and the app on your computer.</p><div class=\"row\"><button class=\"btn primary small\" data-act=\"export\">Export progress</button><label class=\"btn small\" style=\"display:inline-flex;align-items:center\">Import progress<input type=\"file\" id=\"imp\" accept=\".json,application/json\" hidden></label></div></section>";
}

/* ---------- render + events ---------- */
function currentView(){var h=location.hash.replace("#","");if(h==="reminders"){schedOpen=true;return "control";}return h==="curriculum"||h==="grades"?h:"control";}
function render(){
  var v=currentView(),el=document.getElementById("view");
  el.innerHTML=v==="curriculum"?viewCurriculum():v==="grades"?viewGrades():viewControl();
  document.querySelectorAll("[data-tab]").forEach(function(a){
    if(a.dataset.tab===v)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current");
  });
  highlight(el);
}
function go(view){if(location.hash==="#"+view){render();}else{location.hash="#"+view;}}
function openItem(id){
  var it=ITEMS.find(function(i){return i.id===id;});if(!it)return;
  open.add(it.id);open.add(it.mod.id);
  S.track=it.mod.track;if(S.lvf&&S.lvf!==it.lv)S.lvf=0;
  go("curriculum");
  setTimeout(function(){var el=document.querySelector("[data-item=\""+id+"\"]");if(el)el.scrollIntoView({block:"start"});},60);
}
function toggleEx(id){
  if(S.ex[id]){delete S.ex[id];bump(-1);}else{S.ex[id]=today();bump(1);}
  save();render();
  var el=document.querySelector("input[data-act=\"ex\"][data-id=\""+id+"\"]");if(el)el.focus();
}
function completeItem(id){
  var it=ITEMS.find(function(i){return i.id===id;});if(!it)return;
  if(S.done[id]){delete S.done[id];delete S.rev[id];bump(-1);}
  else{
    S.done[id]=today();bump(1);
    if(it.kind!=="project"){S.rev[id]={stage:0,due:addDays(today(),INTERVALS[0])};toast("Lesson complete. First review is tomorrow.");}
    else{toast("Project complete.");}
    var nx=nextItem();
    if(nx){open.delete(id);open.add(nx.id);open.add(nx.mod.id);}
  }
  save();render();
}
function reviewItem(id){
  var r=S.rev[id];if(!r)return;
  r.stage++;
  if(r.stage>=INTERVALS.length){delete S.rev[id];toast("Review finished. This lesson is locked in.");}
  else{r.due=addDays(today(),INTERVALS[r.stage]);toast("Next review in "+INTERVALS[r.stage]+" days.");}
  bump(1);save();render();
}
async function dl(name,text){
  if(!DL)return;
  try{await DL.save({filename:name,data:text});toast("Saved "+name);}
  catch(e){if(e&&e.code==="declined")return;toast("Could not save the file here.");}
}

document.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b||b.tagName==="INPUT")return;
  var a=b.dataset.act,id=b.dataset.id;
  if(a==="open")openItem(id);
  else if(a==="complete")completeItem(id);
  else if(a==="review")reviewItem(id);
  else if(a==="reviews"){var r=document.getElementById("reviews");if(r)r.scrollIntoView({block:"start"});}
  else if(a==="tab")go(b.dataset.view);
  else if(a==="sched"){schedOpen=!schedOpen;if(currentView()!=="control")go("control");else render();if(schedOpen)setTimeout(function(){var el=document.getElementById("plan");if(el)el.scrollIntoView({block:"start"});},40);}
  else if(a==="openmod"){open.add(id);var om=M.find(function(m){return m.id===id;});if(om)S.track=om.track;S.lvf=0;go("curriculum");setTimeout(function(){var el=document.querySelector("[data-mod=\""+id+"\"]");if(el)el.scrollIntoView({block:"start"});},60);}
  else if(a==="jump"){var nx=nextItem();if(nx)openItem(nx.id);else toast("Nothing left on your study path.");}
  else if(a==="track"){S.track=b.dataset.v;S.lvf=0;save();render();window.scrollTo(0,0);}
  else if(a==="lvf"){S.lvf=Number(b.dataset.v)||0;save();render();}
  else if(a==="lvgo"){
    var lv=Number(b.dataset.v),nx2=nextItem();
    var pref=nx2?nx2.mod.track:"F",order=[pref].concat(["F","A","P"].filter(function(x){return x!==pref;}));
    var undone=function(tr){return ITEMS.some(function(i){return i.mod.track===tr&&i.lv===lv&&!S.done[i.id];});};
    var has=function(tr){return ITEMS.some(function(i){return i.mod.track===tr&&i.lv===lv;});};
    S.track=order.find(undone)||order.find(has)||pref;
    S.lvf=lv;save();go("curriculum");
  }
  else if(a==="day"){
    var d=Number(b.dataset.day);
    if(S.days.includes(d))S.days=S.days.filter(function(x){return x!==d;});else S.days=S.days.concat([d]);
    save();render();
  }
  else if(a==="run")doRun(id,"run");
  else if(a==="check")doRun(id,"check");
  else if(a==="tareview")doReview(id);
  else if(a==="ask")doAsk(id);
  else if(a==="askstop"){var chs=taChats[id];if(chs&&chs.ctl)chs.ctl.abort();}
  else if(a==="quizopen"){QSTATE[id]={ans:{},done:false,open:true};refreshQuiz(id);}
  else if(a==="quizretake"){QSTATE[id]={ans:{},done:false,open:true};refreshQuiz(id);}
  else if(a==="quizsubmit"){
    var qs=(QUIZ[id]||[]).filter(function(x){return x.pool==="quiz";}),stq=QSTATE[id];
    if(stq){stq.result=scoreQs(qs,stq.ans);stq.done=true;S.quiz=S.quiz||{};var pq=S.quiz[id];S.quiz[id]={best:Math.max(stq.result.pct,pq?pq.best:0),last:stq.result.pct,n:(pq?pq.n:0)+1,at:today()};bump(1);save();refreshQuiz(id);toast("Quiz score: "+stq.result.pct+"%");}
  }
  else if(a==="openquiz"){var qm=modById(id);if(qm){S.track=qm.track;S.lvf=0;open.add(id);QSTATE[id]=QSTATE[id]||{ans:{},done:false,open:true};QSTATE[id].open=true;save();go("curriculum");setTimeout(function(){var el=document.querySelector("[data-quiz=\""+id+"\"]");if(el)el.scrollIntoView({block:"start"});},80);}}
  else if(a==="exam"){var cc=COURSES.find(function(c){return c.code===id;});if(cc)startTest(examDef(cc,b.dataset.v));}
  else if(a==="certexam")startTest(certDef(id,Number(b.dataset.v)));
  else if(a==="examsubmit")submitTest(false);
  else if(a==="examquit"){clearInterval(examTick);EXAM=null;render();}
  else if(a==="examclose"){EXAM=null;render();window.scrollTo(0,0);}
  else if(a==="export"){if(DL)dl("rust-course-progress-"+today()+".json",JSON.stringify({app:"rust-course",version:1,exported:new Date().toISOString(),state:S,code:CODE},null,2));else toast("Downloads aren't available in this view.");}
  else if(a==="hint"){S.hint[id]=(S.hint[id]||0)+1;save();render();}
  else if(a==="sol"){
    if(shownSol.has(id))shownSol.delete(id);
    else{shownSol.add(id);if(!S.peek[id]){S.peek[id]=today();save();}}
    render();
  }
  else if(a==="copy"){
    var txt=copyText(b.dataset.key);
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){toast("Copied");},function(){selectCode(b);});}
    else selectCode(b);
  }
  else if(a==="ics")dl("rust-study.ics",icsText());
  else if(a==="json")dl("rust-progress.json",JSON.stringify(S,null,2));
  else if(a==="copyics"){
    var ta=document.getElementById("ics-text");
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value).then(function(){toast("Copied");},function(){ta.select();toast("Select and copy the text");});}
    else{ta.select();toast("Select and copy the text");}
  }
});

/* ---------- backup + standalone mode ---------- */
function applyBackup(b){
  if(!b||!b.state||typeof b.state!=="object")throw new Error("bad backup");
  S=Object.assign(defaults(),b.state);
  Object.keys(b.code||{}).forEach(function(k){codeSave(k,b.code[k]);});
  save();render();
}
var browserDL={save:async function(o){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([o.data],{type:"application/octet-stream"}));a.download=o.filename;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);}};
async function initStandalone(){
  DL=browserDL;setSync("local");
  if(S.ts)return;

async function initCloud(){

        setSync("cloud");
      }else if(S.ts>(d.ts||0)){await push();}
      else setSync("cloud");
    }else if(S.ts>0){await push();}

    }
    render();
  }catch(e){setSync("error");render();}
}

render();
