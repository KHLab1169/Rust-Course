n        .send()\n        .await?\n        .error_for_status()?        // turn 4xx/5xx into an Err\n        .json()\n        .await?;\n    println!(\"Rust {} published {}\", latest.tag_name, latest.published_at);\n    Ok(())\n}","output":"Rust 1.97.0 published 2026-07-09T..."},"exercises":{"A11.3a":{"lang":"rust","hints":[".query(&[(\"course\", \"rust\")]) adds query parameters safely.","httpbin echoes request headers under \"headers\" and query values under \"args\".","Use a HashMap<String, String> for headers in the response struct."],"solution":"use serde::Deserialize;\nuse std::collections::HashMap;\nuse std::time::Duration;\n\n#[derive(Debug, Deserialize)]\nstruct Echo {\n    args: HashMap<String, String>,\n    headers: HashMap<String, String>,\n}\n\nasync fn whoami(student: &str) -> Result<(String, String), reqwest::Error> {\n    let client = reqwest::Client::builder().timeout(Duration::from_secs(5)).build()?;\n    let echo: Echo = client\n        .get(\"https://httpbin.org/get\")\n        .query(&[(\"course\", \"rust\")])\n        .header(\"X-Student\", student)\n        .send()\n        .await?\n        .error_for_status()?\n        .json()\n        .await?;\n    Ok((\n        echo.args.get(\"course\").cloned().unwrap_or_default(),\n        echo.headers.get(\"X-Student\").cloned().unwrap_or_default(),\n    ))\n}\n\n#[tokio::main]\nasync fn main() {\n    match whoami(\"kev\").await {\n        Ok((course, who)) => println!(\"server saw course={course}, student={who}\"),\n        Err(e) if e.is_timeout() => eprintln!(\"timed out\"),\n        Err(e) => eprintln!(\"request failed: {e}\"),\n    }\n}","explain":"Using .query instead of formatting the URL yourself handles escaping correctly. Checking e.is_timeout() lets a tool give a specific message, or retry, only for timeouts."},"A11.3b":{"lang":"rust","hints":["Map each URL to an async block that returns (url, Result<StatusCode, Error>).","buffer_unordered(3) runs at most three of those futures at once.","Collect with .collect::<Vec<_>>().await."],"solution":"use futures::stream::{self, StreamExt};\n\n#[tokio::main]\nasync fn main() {\n    let client = reqwest::Client::new();\n    let urls: Vec<String> = (200..210).map(|code| format!(\"https://httpbin.org/status/{code}\")).collect();\n    let results: Vec<_> = stream::iter(urls)\n        .map(|url| {\n            let client = client.clone(); // cheap: shares the connection pool\n            async move {\n                let status = client.get(&url).send().await.map(|r| r.status());\n                (url, status)\n            }\n        })\n        .buffer_unordered(3)\n        .collect()\n        .await;\n    for (url, status) in results {\n        match status {\n            Ok(s) => println!(\"{s} {url}\"),\n            Err(e) => println!(\"ERR {url}: {e}\"),\n        }\n    }\n}","explain":"buffer_unordered is the stream equivalent of a semaphore-limited JoinSet, and a compact way to be polite to the server you are calling. Cloning a reqwest Client is cheap because it shares one connection pool."}}},"A12.1":{"example":{"title":"A notes API","lang":"rust","note":"Handlers are plain async functions whose parameters are extractors; axum parses and validates the request before your code runs, and a malformed JSON body gets a 4xx automatically. Anything implementing IntoResponse can be returned, including a (StatusCode, Json) tuple or a Result. oneshot sends a request straight to the router, so tests need no open port.","code":"use axum::{\n    extract::{Path, State},\n    http::StatusCode,\n    routing::{get, post},\n    Json, Router,\n};\nuse serde::{Deserialize, Serialize};\nuse std::sync::{Arc, Mutex};\n\n#[derive(Clone, Serialize, Deserialize)]\nstruct Note { id: u32, text: String }\n\n#[derive(Deserialize)]\nstruct NewNote { text: String }\n\ntype Db = Arc<Mutex<Vec<Note>>>;\n\nasync fn list(State(db): State<Db>) -> Json<Vec<Note>> {\n    Json(db.lock().unwrap().clone())\n}\n\nasync fn create(State(db): State<Db>, Json(input): Json<NewNote>) -> (StatusCode, Json<Note>) {\n    let mut notes = db.lock().unwrap();\n    let note = Note { id: notes.len() as u32 + 1, text: input.text };\n    notes.push(note.clone());\n    (StatusCode::CREATED, Json(note))\n}\n\nasync fn get_one(State(db): State<Db>, Path(id): Path<u32>) -> Result<Json<Note>, StatusCode> {\n    db.lock().unwrap().iter().find(|n| n.id == id).cloned().map(Json).ok_or(StatusCode::NOT_FOUND)\n}\n\nfn app(db: Db) -> Router {\n    Router::new()\n        .route(\"/notes\", get(list).post(create))\n        .route(\"/notes/{id}\", get(get_one))\n        .with_state(db)\n}\n\n#[tokio::main]\nasync fn main() {\n    let listener = tokio::net::TcpListener::bind(\"127.0.0.1:3000\").await.unwrap();\n    axum::serve(listener, app(Db::default())).await.unwrap();\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use axum::body::Body;\n    use axum::http::Request;\n    use http_body_util::BodyExt;\n    use tower::ServiceExt;\n\n    #[tokio::test]\n    async fn create_then_get() {\n        let db = Db::default();\n        let res = app(db.clone())\n            .oneshot(Request::post(\"/notes\").header(\"content-type\", \"application/json\").body(Body::from(r#\"{\"text\":\"learn axum\"}\"#)).unwrap())\n            .await.unwrap();\n        assert_eq!(res.status(), StatusCode::CREATED);\n        let res = app(db).oneshot(Request::get(\"/notes/1\").body(Body::empty()).unwrap()).await.unwrap();\n        let body = res.into_body().collect().await.unwrap().to_bytes();\n        assert!(String::from_utf8_lossy(&body).contains(\"learn axum\"));\n    }\n}","output":""},"exercises":{"A12.1a":{"lang":"rust","hints":[".route(\"/notes/{id}\", get(get_one).put(update).delete(remove))","Return StatusCode::NO_CONTENT for a successful delete.","Use iter_mut().find(...) to update in place, and position + remove to delete."],"solution":"use axum::{extract::{Path, State}, http::StatusCode, routing::get, Json, Router};\nuse serde::{Deserialize, Serialize};\nuse std::sync::{Arc, Mutex};\n\n#[derive(Clone, Serialize, Deserialize)]\nstruct Note { id: u32, text: String }\n#[derive(Deserialize)]\nstruct NewNote { text: String }\ntype Db = Arc<Mutex<Vec<Note>>>;\n\nasync fn update(State(db): State<Db>, Path(id): Path<u32>, Json(input): Json<NewNote>) -> Result<Json<Note>, StatusCode> {\n    let mut notes = db.lock().unwrap();\n    let note = notes.iter_mut().find(|n| n.id == id).ok_or(StatusCode::NOT_FOUND)?;\n    note.text = input.text;\n    Ok(Json(note.clone()))\n}\n\nasync fn remove(State(db): State<Db>, Path(id): Path<u32>) -> StatusCode {\n    let mut notes = db.lock().unwrap();\n    match notes.iter().position(|n| n.id == id) {\n        Some(i) => {\n            notes.remove(i);\n            StatusCode::NO_CONTENT\n        }\n        None => StatusCode::NOT_FOUND,\n    }\n}\n\nfn app(db: Db) -> Router {\n    Router::new().route(\"/notes/{id}\", get(|| async { \"use the full API\" }).put(update).delete(remove)).with_state(db)\n}\n\n#[tokio::main]\nasync fn main() {\n    let db: Db = Arc::new(Mutex::new(vec![Note { id: 1, text: \"first\".into() }]));\n    let listener = tokio::net::TcpListener::bind(\"127.0.0.1:3000\").await.unwrap();\n    axum::serve(listener, app(db)).await.unwrap();\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use axum::{body::Body, http::Request};\n    use tower::ServiceExt;\n\n    fn seeded() -> Db {\n        Arc::new(Mutex::new(vec![Note { id: 1, text: \"a\".into() }]))\n    }\n\n    #[tokio::test]\n    async fn put_updates_and_404s() {\n        let db = seeded();\n        let req = |id: u32| Request::put(format!(\"/notes/{id}\")).header(\"content-type\", \"application/json\").body(Body::from(r#\"{\"text\":\"b\"}\"#)).unwrap();\n        assert_eq!(app(db.clone()).oneshot(req(1)).await.unwrap().status(), StatusCode::OK);\n        assert_eq!(db.lock().unwrap()[0].text, \"b\");\n        assert_eq!(app(db).oneshot(req(9)).await.unwrap().status(), StatusCode::NOT_FOUND);\n    }\n\n    #[tokio::test]\n    async fn delete_twice() {\n        let db = seeded();\n        let req = || Request::delete(\"/notes/1\").body(Body::empty()).unwrap();\n        assert_eq!(app(db.clone()).oneshot(req()).await.unwrap().status(), StatusCode::NO_CONTENT);\n        assert_eq!(app(db).oneshot(req()).await.unwrap().status(), StatusCode::NOT_FOUND);\n    }\n}","explain":"The ? inside update returns the 404 straight from the handler, because Result<Json<Note>, StatusCode> implements IntoResponse. Testing status codes for both the happy and missing paths is the core of API test coverage."},"A12.1b":{"lang":"rust","hints":["impl IntoResponse for ApiError { fn into_response(self) -> Response { (status, Json(json!({\"error\": msg}))).into_response() } }","Handlers then return Result<(StatusCode, Json<Note>), ApiError>.","Check the length with text.trim().is_empty() and text.chars().count() > 280."],"solution":"use axum::{http::StatusCode, response::{IntoResponse, Response}, Json};\nuse serde::Deserialize;\nuse serde_json::json;\n\nenum ApiError {\n    Validation(String),\n}\n\nimpl IntoResponse for ApiError {\n    fn into_response(self) -> Response {\n        match self {\n            ApiError::Validation(msg) => (StatusCode::UNPROCESSABLE_ENTITY, Json(json!({ \"error\": msg }))).into_response(),\n        }\n    }\n}\n\n#[derive(Deserialize)]\nstruct NewNote { text: String }\n\nfn validate(n: &NewNote) -> Result<(), ApiError> {\n    if n.text.trim().is_empty() {\n        return Err(ApiError::Validation(\"text must not be empty\".into()));\n    }\n    if n.text.chars().count() > 280 {\n        return Err(ApiError::Validation(\"text must be at most 280 characters\".into()));\n    }\n    Ok(())\n}\n\nasync fn create(Json(input): Json<NewNote>) -> Result<(StatusCode, String), ApiError> {\n    validate(&input)?;\n    Ok((StatusCode::CREATED, input.text))\n}\n\n#[tokio::main]\nasync fn main() {\n    let app = axum::Router::new().route(\"/notes\", axum::routing::post(create));\n    let listener = tokio::net::TcpListener::bind(\"127.0.0.1:3000\").await.unwrap();\n    axum::serve(listener, app).await.unwrap();\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn rules() {\n        assert!(validate(&NewNote { text: \"  \".into() }).is_err());\n        assert!(validate(&NewNote { text: \"x\".repeat(281) }).is_err());\n        assert!(validate(&NewNote { text: \"ok\".into() }).is_ok());\n    }\n    #[test]\n    fn status_code() {\n        let r = ApiError::Validation(\"bad\".into()).into_response();\n        assert_eq!(r.status(), StatusCode::UNPROCESSABLE_ENTITY);\n    }\n}","explain":"One error type that knows how to become a response keeps every handler consistent, and ? converts lower-level errors once From impls are added. Counting chars rather than bytes keeps the limit fair for accented text."}}},"A12.2":{"example":{"title":"Bugs in SQLite with rusqlite","lang":"rust","note":"Parameters (?1, ?2) are sent separately from the SQL, so input can never change the query, which is how SQL injection is prevented. The bundled feature compiles SQLite into your program, so there is nothing to install. For servers, sqlx gives async access to Postgres, MySQL and SQLite, and its query! macro checks your SQL against a real database at compile time.","code":"use rusqlite::{params, Connection, Result};\n\n#[derive(Debug)]\nstruct Bug { id: i64, title: String, severity: String }\n\nfn main() -> Result<()> {\n    let conn = Connection::open_in_memory()?;      // or Connection::open(\"bugs.db\")\n    conn.execute_batch(\n        \"CREATE TABLE bugs (id INTEGER PRIMARY KEY, title TEXT NOT NULL, severity TEXT NOT NULL);\",\n    )?;\n\n    let mut tx = conn.unchecked_transaction()?;\n    for (t, s) in [(\"Crash on login\", \"high\"), (\"Typo on page\", \"low\"), (\"Robert'); DROP TABLE bugs;--\", \"low\")] {\n        tx.execute(\"INSERT INTO bugs (title, severity) VALUES (?1, ?2)\", params![t, s])?; // safe parameters\n    }\n    tx.commit()?;\n    tx = conn.unchecked_transaction()?;\n    tx.rollback()?;\n\n    let mut stmt = conn.prepare(\"SELECT id, title, severity FROM bugs WHERE severity = ?1 ORDER BY id\")?;\n    let low: Vec<Bug> = stmt\n        .query_map([\"low\"], |r| Ok(Bug { id: r.get(0)?, title: r.get(1)?, severity: r.get(2)? }))?\n        .collect::<Result<_>>()?;\n    println!(\"{low:#?}\");\n    let n: i64 = conn.query_row(\"SELECT COUNT(*) FROM bugs\", [], |r| r.get(0))?;\n    println!(\"{n} bugs total; the table survived the injection attempt\");\n    Ok(())\n}","output":"[\n    Bug {\n        id: 2,\n        title: \"Typo on page\",\n        severity: \"low\",\n    },\n    Bug {\n        id: 3,\n        title: \"Robert'); DROP TABLE bugs;--\",\n        severity: \"low\",\n    },\n]\n3 bugs total; the table survived the injection attempt"},"exercises":{"A12.2a":{"lang":"rust","hints":["Create the table in BugRepo::new, including closed INTEGER NOT NULL DEFAULT 0.","conn.last_insert_rowid() gives the new id.","execute returns the number of rows changed; close returns true when it is 1."],"solution":"use rusqlite::{params, Connection, Result};\n\n#[derive(Debug, PartialEq)]\npub struct Bug { pub id: i64, pub title: String, pub closed: bool }\n\npub struct BugRepo { conn: Connection }\n\nimpl BugRepo {\n    pub fn new(conn: Connection) -> Result<Self> {\n        conn.execute_batch(\n            \"CREATE TABLE IF NOT EXISTS bugs (\n                id INTEGER PRIMARY KEY,\n                title TEXT NOT NULL,\n                severity TEXT NOT NULL,\n                closed INTEGER NOT NULL DEFAULT 0\n            );\",\n        )?;\n        Ok(BugRepo { conn })\n    }\n    pub fn add(&self, title: &str, severity: &str) -> Result<i64> {\n        self.conn.execute(\"INSERT INTO bugs (title, severity) VALUES (?1, ?2)\", params![title, severity])?;\n        Ok(self.conn.last_insert_rowid())\n    }\n    pub fn by_severity(&self, sev: &str) -> Result<Vec<Bug>> {\n        let mut stmt = self.conn.prepare(\"SELECT id, title, closed FROM bugs WHERE severity = ?1 ORDER BY id\")?;\n        let rows = stmt.query_map([sev], |r| Ok(Bug { id: r.get(0)?, title: r.get(1)?, closed: r.get(2)? }))?;\n        rows.collect()\n    }\n    pub fn close(&self, id: i64) -> Result<bool> {\n        Ok(self.conn.execute(\"UPDATE bugs SET closed = 1 WHERE id = ?1 AND closed = 0\", [id])? == 1)\n    }\n}\n\nfn main() -> Result<()> {\n    let repo = BugRepo::new(Connection::open_in_memory()?)?;\n    let id = repo.add(\"Login loop\", \"high\")?;\n    repo.close(id)?;\n    println!(\"{:?}\", repo.by_severity(\"high\")?);\n    Ok(())\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn add_query_close() {\n        let repo = BugRepo::new(Connection::open_in_memory().unwrap()).unwrap();\n        let id = repo.add(\"a\", \"low\").unwrap();\n        repo.add(\"b\", \"high\").unwrap();\n        assert_eq!(repo.by_severity(\"low\").unwrap().len(), 1);\n        assert!(repo.close(id).unwrap());\n        assert!(!repo.close(id).unwrap(), \"closing twice changes nothing\");\n        assert!(repo.by_severity(\"low\").unwrap()[0].closed);\n    }\n}","explain":"rusqlite converts SQLite integers to bool automatically. An in-memory database makes each test fast and isolated, and the AND closed = 0 condition makes close idempotent, a nice property to test."},"A12.2b":{"lang":"rust","hints":["let tx = conn.transaction()?; then run both UPDATEs on tx and tx.commit()?","Read the balance inside the transaction first and return an error if it is too low.","Returning early drops tx, which rolls back automatically."],"solution":"use rusqlite::{params, Connection};\n\nfn setup() -> Connection {\n    let c = Connection::open_in_memory().unwrap();\n    c.execute_batch(\"CREATE TABLE accounts (id INTEGER PRIMARY KEY, balance INTEGER NOT NULL);\n                     INSERT INTO accounts VALUES (1, 100), (2, 0);\").unwrap();\n    c\n}\n\nfn transfer(conn: &mut Connection, from: i64, to: i64, amount: i64) -> Result<(), String> {\n    let tx = conn.transaction().map_err(|e| e.to_string())?;\n    let bal: i64 = tx.query_row(\"SELECT balance FROM accounts WHERE id = ?1\", [from], |r| r.get(0)).map_err(|e| e.to_string())?;\n    if bal < amount {\n        return Err(format!(\"insufficient funds: {bal} < {amount}\")); // tx dropped: rollback\n    }\n    tx.execute(\"UPDATE accounts SET balance = balance - ?1 WHERE id = ?2\", params![amount, from]).map_err(|e| e.to_string())?;\n    tx.execute(\"UPDATE accounts SET balance = balance + ?1 WHERE id = ?2\", params![amount, to]).map_err(|e| e.to_string())?;\n    tx.commit().map_err(|e| e.to_string())\n}\n\nfn balance(c: &Connection, id: i64) -> i64 {\n    c.query_row(\"SELECT balance FROM accounts WHERE id = ?1\", [id], |r| r.get(0)).unwrap()\n}\n\nfn main() {\n    let mut c = setup();\n    println!(\"{:?}\", transfer(&mut c, 1, 2, 30));\n    println!(\"{} {}\", balance(&c, 1), balance(&c, 2));\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn failed_transfer_changes_nothing() {\n        let mut c = setup();\n        assert!(transfer(&mut c, 1, 2, 500).is_err());\n        assert_eq!((balance(&c, 1), balance(&c, 2)), (100, 0));\n        transfer(&mut c, 1, 2, 40).unwrap();\n        assert_eq!((balance(&c, 1), balance(&c, 2)), (60, 40));\n    }\n}","explain":"rusqlite's Transaction rolls back in its Drop unless commit is called, so every early return is safe. This RAII behaviour makes it very hard to leave half-finished updates in the database."}}},"A12.3":{"example":{"title":"Calling C's strlen and qsort safely","lang":"rust","note":"C strings are NUL-terminated bytes, so CString adds the terminator and CStr reads one. Every crossing of the boundary is unsafe because the compiler cannot check C's promises, which is why each call sits in a tiny safe wrapper with a SAFETY comment. strlen counts bytes, so é counts as two. Tools such as bindgen generate extern blocks from C headers, and cbindgen generates headers for Rust libraries.","code":"use std::ffi::{c_char, c_int, c_void, CStr, CString};\n\nunsafe extern \"C\" {\n    fn strlen(s: *const c_char) -> usize;\n    fn qsort(base: *mut c_void, n: usize, size: usize, cmp: extern \"C\" fn(*const c_void, *const c_void) -> c_int);\n}\n\n/// Safe wrapper: a CString always ends with a NUL byte.\nfn c_len(s: &str) -> usize {\n    let c = CString::new(s).expect(\"no interior NUL bytes\");\n    // SAFETY: c is a valid, NUL-terminated string that lives for the call.\n    unsafe { strlen(c.as_ptr()) }\n}\n\nextern \"C\" fn cmp_i32(a: *const c_void, b: *const c_void) -> c_int {\n    // SAFETY: qsort passes pointers to elements of our i32 slice.\n    let (a, b) = unsafe { (*(a as *const i32), *(b as *const i32)) };\n    a.cmp(&b) as c_int\n}\n\nfn c_sort(v: &mut [i32]) {\n    // SAFETY: the pointer, length and element size describe v exactly.\n    unsafe { qsort(v.as_mut_ptr().cast(), v.len(), std::mem::size_of::<i32>(), cmp_i32) }\n}\n\n#[unsafe(no_mangle)]\npub extern \"C\" fn rust_add(a: c_int, b: c_int) -> c_int { a + b }   // callable from C\n\nfn main() {\n    println!(\"{}\", c_len(\"héllo\"));\n    let mut v = [5, -2, 9, 0];\n    c_sort(&mut v);\n    println!(\"{v:?}\");\n    let owned = CString::new(\"back from C\").unwrap();\n    let view: &CStr = owned.as_c_str();\n    println!(\"{} {}\", view.to_str().unwrap(), rust_add(2, 3));\n}","output":"6\n[-2, 0, 5, 9]\nback from C 5"},"exercises":{"A12.3a":{"lang":"rust","hints":["fn getenv(name: *const c_char) -> *mut c_char;","Check for null with ptr.is_null() before using CStr::from_ptr.","to_str() returns a Result because the bytes may not be UTF-8."],"solution":"use std::ffi::{c_char, CStr, CString};\n\nunsafe extern \"C\" {\n    fn getenv(name: *const c_char) -> *mut c_char;\n}\n\nfn c_getenv(name: &str) -> Option<String> {\n    let key = CString::new(name).ok()?;\n    // SAFETY: key is a valid NUL-terminated string. The returned\n    // pointer is either null or points to a NUL-terminated value\n    // owned by the C library, which we copy before returning.\n    unsafe {\n        let p = getenv(key.as_ptr());\n        if p.is_null() {\n            return None;\n        }\n        CStr::from_ptr(p).to_str().ok().map(String::from)\n    }\n}\n\nfn main() {\n    println!(\"{:?}\", c_getenv(\"PATH\").map(|p| p.len()));\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn matches_std() {\n        assert_eq!(c_getenv(\"PATH\"), std::env::var(\"PATH\").ok());\n        assert_eq!(c_getenv(\"SURELY_NOT_SET_12345\"), None);\n        assert_eq!(c_getenv(\"A\\0B\"), None, \"interior NUL is rejected\");\n    }\n}","explain":"The wrapper turns every C failure mode (null, bad bytes, interior NUL) into None, so callers never touch unsafe code. Copying into a String matters because the C library may change its environment memory later."},"A12.3b":{"lang":"rust","hints":["Mark it #[unsafe(no_mangle)] pub extern \"C\" fn so the symbol keeps its name.","Convert with CStr::from_ptr inside an unsafe block after the null check.","In Cargo.toml: [lib] crate-type = [\"cdylib\"] builds a .so, .dylib or .dll."],"solution":"use std::ffi::{c_char, CStr};\n\n/// Counts whitespace-separated words in a NUL-terminated C string.\n///\n/// # Safety\n/// `text` must be null or point to a valid NUL-terminated string.\n#[unsafe(no_mangle)]\npub unsafe extern \"C\" fn word_count(text: *const c_char) -> usize {\n    if text.is_null() {\n        return 0;\n    }\n    // SAFETY: the caller guarantees a valid NUL-terminated string.\n    let s = unsafe { CStr::from_ptr(text) };\n    String::from_utf8_lossy(s.to_bytes()).split_whitespace().count()\n}\n\n// C side:   size_t word_count(const char *text);\n// Cargo:    [lib] crate-type = [\"cdylib\"]\n// Build:    cargo build --release  -> target/release/libwords.so\n// Link:     cc main.c -L target/release -lwords\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use std::ffi::CString;\n    #[test]\n    fn counts() {\n        let c = CString::new(\"one two  three\").unwrap();\n        assert_eq!(unsafe { word_count(c.as_ptr()) }, 3);\n        assert_eq!(unsafe { word_count(std::ptr::null()) }, 0);\n    }\n}","explain":"Marking the function unsafe with a Safety section documents the contract C callers must keep. from_utf8_lossy makes the function robust to non-UTF-8 input instead of panicking across the FFI boundary, which would be undefined behaviour in older Rust versions."}}},"A12.4":{"example":{"title":"A markdown word counter for the browser","lang":"rust","note":"wasm-bindgen generates the JavaScript glue that converts strings and objects across the boundary, and wasm-pack builds and packages it for npm or the web. The same functions remain ordinary Rust, so they are unit tested natively. WASM shines for CPU-heavy work in the browser (parsing, image processing, games); for simple DOM manipulation, JavaScript is usually simpler.","code":"// Cargo.toml:\n// [lib]\n// crate-type = [\"cdylib\", \"rlib\"]\n// [dependencies]\n// wasm-bindgen = \"0.2\"\nuse wasm_bindgen::prelude::*;\n\n#[wasm_bindgen]\npub fn reading_time(text: &str) -> String {\n    let words = text.split_whitespace().filter(|w| !w.starts_with('#')).count();\n    let minutes = (words as f64 / 200.0).ceil() as u32;\n    format!(\"{words} words, about {minutes} min read\")\n}\n\n#[wasm_bindgen]\npub struct Counter { count: u32 }\n\n#[wasm_bindgen]\nimpl Counter {\n    #[wasm_bindgen(constructor)]\n    pub fn new() -> Counter { Counter { count: 0 } }\n    pub fn increment(&mut self) -> u32 { self.count += 1; self.count }\n}\n\n// $ wasm-pack build --target web\n// In JavaScript:\n// import init, { reading_time, Counter } from \"./pkg/reading.js\";\n// await init();\n// reading_time(document.querySelector(\"textarea\").value);\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn counts_words() {\n        assert_eq!(reading_time(\"# Title\\nhello world\"), \"3 words, about 1 min read\"); // the # marker is not a word\n        let mut c = Counter::new();\n        c.increment();\n        assert_eq!(c.increment(), 2);\n    }\n}","output":""},"exercises":{"A12.4a":{"lang":"text","hints":["cargo install wasm-pack (or use the installer from the wasm-pack site).","The pkg folder holds the .wasm file and the generated JavaScript module.","Browsers refuse to load WASM modules from file://, so serve with python -m http.server."],"solution":"<\!-- index.html -->\n<textarea id=\"t\" rows=\"8\" cols=\"60\"><\/textarea>\n<p id=\"out\"><\/p>\n<script type=\"module\">\n  import init, { reading_time } from \"./pkg/reading.js\";\n  await init();\n  const t = document.getElementById(\"t\");\n  const out = document.getElementById(\"out\");\n  t.addEventListener(\"input\", () => { out.textContent = reading_time(t.value); });\n<\/script>\n\n$ wasm-pack build --target web\n$ python -m http.server 8000\n# open http://localhost:8000","explain":"Any page that loads WebAssembly has to be served over HTTP like this. The Rust code itself did not change at all to run in the browser."},"A12.4b":{"lang":"text","hints":["roadmap.sh/rust lists GUI, game, embedded and web frameworks under the ecosystem section.","Consider maturity, community size and documentation.","There is more than one good answer for most of these."],"solution":"1. Tauri: a small native shell with a web front end and Rust back\n   end; much lighter than Electron.\n2. Bevy (or macroquad for something minimal): an ECS game engine\n   with a large community.\n3. embedded-hal with a chip-specific HAL (for example nrf-hal or\n   rp2040-hal): portable drivers on top of a common trait layer.\n4. Leptos (or Loco for a Rails-like experience): Rust on both the\n   server and the browser through WebAssembly.\n5. axum with sqlx: async, widely used, and sqlx checks queries\n   against the real database at compile time.","explain":"The Rust ecosystem moves quickly, so check recent activity and documentation before committing. Every one of these builds on the language features you have now practised, especially traits, async and macros."}}},"1.1":{"example":{"title":"Checking your installation","lang":"bash","note":"rustup is the installer and version manager, rustc is the compiler and cargo is the build tool and package manager. All three come in one install. On Windows, rustup also asks you to install the Visual Studio C++ build tools, which Rust needs to link programs.","code":"$ rustc --version\nrustc 1.97.0 (2d8144b78 2026-07-07)\n$ cargo --version\ncargo 1.97.0\n$ rustup update        # get the newest stable release\n$ rustup doc --book    # open this book from your own computer","output":""},"exercises":{"1.1a":{"lang":"bash","hints":["On Windows, download rustup-init.exe from rust-lang.org/tools/install. On macOS or Linux, run the curl command shown on that page.","Close and reopen your terminal after installing so the new PATH is picked up.","If a command is not found, run rustup show to see where the toolchain was installed."],"solution":"$ rustc --version\nrustc 1.97.0 (2d8144b78 2026-07-07)\n$ cargo --version\ncargo 1.97.0\n$ rustup --version\nrustup 1.28.2","explain":"The exact numbers will differ, and that is fine. What matters is that all three commands answer. If rustc works but cargo does not, the PATH is usually only half updated; reopening the terminal fixes it."},"1.1b":{"lang":"bash","hints":["rustup doc on its own opens an index page; rustup doc --std goes straight to the standard library.","The search box at the top of the docs page works offline.","Type String and choose the struct std::string::String."],"solution":"$ rustup doc --std\n# In the search box type: String\n# Open std::string::String and read the Methods section.\n# Example of a method worth noting: String::with_capacity(n)","explain":"The local docs match your installed version exactly, which is handy on a plane or when a newer online version describes something you do not have yet. Learning to search the docs early saves a lot of time later."}}},"1.2":{"example":{"title":"Your first program","lang":"rust","note":"Every program starts in fn main. println! ends with an exclamation mark because it is a macro, not a function; the {} in the text is filled with the next value. Compile with rustc main.rs, then run ./main (or .\\main.exe on Windows).","code":"// main.rs\nfn main() {\n    println!(\"Hello, world!\");\n    println!(\"Rust is {} years old as a stable language.\", 2026 - 2015);\n}","output":"Hello, world!\nRust is 11 years old as a stable language."},"exercises":{"1.2a":{"lang":"rust","hints":["Each println! call prints one line.","Text goes inside double quotes, and each statement ends with a semicolon.","Compile with rustc hello.rs and run the program that appears next to the file."],"solution":"fn main() {\n    println!(\"Name: Kev\");\n    println!(\"City: Montreal\");\n    println!(\"Why Rust: fast, safe tools that I can trust in production.\");\n}","explain":"rustc turns the .rs file into a native program that runs without Rust installed. Forgetting the semicolon or the ! after println is the most common first error; the compiler message points at the exact spot."},"1.2b":{"lang":"rust","hints":["Remove the last double quote from one println! line.","Read the line that starts with error, then the arrow that shows the file, line and column.","Put the quote back and compile again to confirm the fix."],"solution":"// Broken version (does not compile):\n//     println!(\"City: Montreal);\n// rustc reports: error: unterminated double quote string\n//   --> hello.rs:3:14\n// Fixed version:\nfn main() {\n    println!(\"Name: Kev\");\n    println!(\"City: Montreal\");\n}","explain":"Rust's compiler messages are unusually helpful, with arrows under the problem and often a suggested fix. Reading them carefully, top to bottom, is a skill you will use every day in Rust."}}},"1.3":{"example":{"title":"A Cargo project from start to finish","lang":"bash","note":"cargo new makes the folder, a Cargo.toml manifest, src/main.rs and a git repository. cargo check only checks that the code compiles, which is much faster than a build, so use it while you write. cargo build --release turns on optimisations and puts the program in target/release.","code":"$ cargo new hello_cargo\n    Creating binary (application) `hello_cargo` package\n$ cd hello_cargo\n$ cat Cargo.toml\n[package]\nname = \"hello_cargo\"\nversion = \"0.1.0\"\nedition = \"2024\"\n\n[dependencies]\n$ cargo run\n   Compiling hello_cargo v0.1.0\n    Finished `dev` profile [unoptimized + debuginfo]\n     Running `target/debug/hello_cargo`\nHello, world!","output":""},"exercises":{"1.3a":{"lang":"rust","hints":["cargo new greeter, then cd greeter.","Edit src/main.rs; the main function is already there.","cargo run builds and runs in one step."],"solution":"// src/main.rs\nfn main() {\n    println!(\"Bonjour from greeter!\");\n}\n\n// Terminal:\n//   cargo new greeter\n//   cd greeter\n//   cargo run      -> Bonjour from greeter!\n//   cargo check    -> Finished in a fraction of the time","explain":"Cargo is how almost every Rust project is built, even tiny ones, because it handles dependencies, profiles and tests for you. cargo check skips the slow code generation step, so it is the quickest way to see whether your code compiles."},"1.3b":{"lang":"bash","hints":["The debug build goes to target/debug and the release build to target/release.","On macOS and Linux, ls -l shows file sizes; on Windows, use dir.","Debug builds keep extra information for debuggers, so they are usually bigger."],"solution":"$ cargo build\n$ cargo build --release\n$ ls -l target/debug/greeter target/release/greeter\n# Typical result: the debug program is larger and the release\n# program is smaller and faster.","explain":"Debug builds compile quickly and are easy to step through in a debugger; release builds take longer to compile but run much faster. Always measure speed with a release build, a mistake many people make when they first compare Rust to other languages."}}},"2.1":{"example":{"title":"Reading one line of input","lang":"rust","note":"Variables are immutable by default, so guess needs mut. read_line returns a Result, which expect turns into a crash with your message if reading failed. trim removes the newline that pressing Enter adds.","code":"use std::io;\n\nfn main() {\n    println!(\"Guess the number!\");\n    println!(\"Please input your guess.\");\n\n    let mut guess = String::new();          // an empty, growable string\n    io::stdin()\n        .read_line(&mut guess)              // append what the user types\n        .expect(\"Failed to read line\");     // stop with a message if it fails\n\n    println!(\"You guessed: {}\", guess.trim());\n}","output":"Guess the number!\nPlease input your guess.\n42\nYou guessed: 42"},"exercises":{"2.1a":{"lang":"rust","hints":["Start with use std::io; at the top of the file.","Create the String with String::new() and pass &mut name to read_line.","Call .trim() on the name when you print it."],"solution":"use std::io;\n\nfn main() {\n    println!(\"What is your name?\");\n    let mut name = String::new();\n    io::stdin()\n        .read_line(&mut name)\n        .expect(\"Failed to read line\");\n    println!(\"Welcome, {}!\", name.trim());\n}","explain":"Without trim, the newline from Enter is printed too, so the ! ends up on the next line. Passing &mut name lets read_line change your string without taking ownership of it, an idea Chapter 4 explains fully."},"2.1b":{"lang":"rust","hints":["You need two separate mutable Strings.","Call read_line once for each.","Use two {} placeholders in one println!."],"solution":"use std::io;\n\nfn main() {\n    let mut first = String::new();\n    let mut last = String::new();\n\n    println!(\"First name?\");\n    io::stdin().read_line(&mut first).expect(\"Failed to read line\");\n    println!(\"Last name?\");\n    io::stdin().read_line(&mut last).expect(\"Failed to read line\");\n\n    println!(\"Full name: {} {}\", first.trim(), last.trim());\n}","explain":"read_line appends to the string you give it, which is why each answer needs its own empty String. Reusing one String without clearing it would join both answers together."}}},"2.2":{"example":{"title":"Adding and using rand","lang":"rust","note":"cargo add rand (or editing Cargo.toml by hand) adds the dependency, and the next build downloads it. Cargo.lock then records the exact version so every build uses the same one. 1..=100 is a range that includes 100. Values can go straight inside the braces, as in {secret_number}.","code":"// Cargo.toml:  [dependencies]\n//              rand = \"0.8\"\nuse rand::Rng;\n\nfn main() {\n    let secret_number = rand::thread_rng().gen_range(1..=100);\n    println!(\"The secret number is: {secret_number}\");\n}","output":"The secret number is: 57"},"exercises":{"2.2a":{"lang":"rust","hints":["cargo add rand@0.8 adds the dependency.","gen_range(1..=6) gives a number from 1 to 6.","Store each roll in its own variable and add them up."],"solution":"use rand::Rng;\n\nfn main() {\n    let mut rng = rand::thread_rng();\n    let a = rng.gen_range(1..=6);\n    let b = rng.gen_range(1..=6);\n    println!(\"You rolled {a} and {b}, total {}\", a + b);\n}","explain":"Keeping one rng in a variable is tidier than calling thread_rng twice. The range 1..=6 includes both ends; 1..6 would never roll a six, a classic off-by-one bug."},"2.2b":{"lang":"text","hints":["Search the file for name = \"rand\".","The version line under it is the exact version.","Think about what happens when a teammate builds the project six months from now."],"solution":"[[package]]\nname = \"rand\"\nversion = \"0.8.5\"\n...\nCommit Cargo.lock for programs (binaries) so everyone who builds\nthe project gets exactly the same dependency versions.","explain":"Cargo.toml says which versions are acceptable; Cargo.lock says which exact ones were used. Committing the lock file makes builds repeatable, which matters a lot when you are tracking down a bug that only appears on one machine."}}},"2.3":{"example":{"title":"The finished guessing game","lang":"rust","note":"parse can fail, so it returns a Result; matching on Ok and Err lets you decide what to do instead of crashing. The type annotation u32 tells parse what kind of number to produce. match must cover every case, so you can never forget the Equal branch.","code":"use rand::Rng;\nuse std::cmp::Ordering;\nuse std::io;\n\nfn main() {\n    let secret = rand::thread_rng().gen_range(1..=100);\n    loop {\n        println!(\"Please input your guess.\");\n        let mut guess = String::new();\n        io::stdin().read_line(&mut guess).expect(\"Failed to read line\");\n\n        // Shadowing: a new guess variable, this time a number\n        let guess: u32 = match guess.trim().parse() {\n            Ok(num) => num,\n            Err(_) => continue,   // not a number: ask again\n        };\n\n        match guess.cmp(&secret) {\n            Ordering::Less => println!(\"Too small!\"),\n            Ordering::Greater => println!(\"Too big!\"),\n            Ordering::Equal => {\n                println!(\"You win!\");\n                break;\n            }\n        }\n    }\n}","output":""},"exercises":{"2.3a":{"lang":"rust","hints":["Create let mut attempts = 0; before the loop.","Add 1 to it each time a valid number is read.","Print it inside the Equal branch, before break."],"solution":"use rand::Rng;\nuse std::cmp::Ordering;\nuse std::io;\n\nfn main() {\n    let secret = rand::thread_rng().gen_range(1..=100);\n    let mut attempts = 0;\n    loop {\n        println!(\"Your guess?\");\n        let mut guess = String::new();\n        io::stdin().read_line(&mut guess).expect(\"Failed to read line\");\n        let guess: u32 = match guess.trim().parse() {\n            Ok(n) => n,\n            Err(_) => {\n                println!(\"Please type a whole number.\");\n                continue;\n            }\n        };\n        attempts += 1; // only valid guesses count\n        match guess.cmp(&secret) {\n            Ordering::Less => println!(\"Too small!\"),\n            Ordering::Greater => println!(\"Too big!\"),\n            Ordering::Equal => {\n                println!(\"You win in {attempts} guesses!\");\n                break;\n            }\n        }\n    }\n}","explain":"Counting after the parse means typing \"abc\" does not use up a guess. attempts must be mut because it changes; Rust would refuse to compile += on an immutable variable."},"2.3b":{"lang":"rust","hints":["A for loop over 1..=7 gives you exactly seven turns.","Use if guess < 1 || guess > 100 to reject out-of-range numbers, then continue.","After the loop ends without a win, print the secret. A won flag or an early return helps."],"solution":"use rand::Rng;\nuse std::cmp::Ordering;\nuse std::io;\n\nfn main() {\n    let secret: u32 = rand::thread_rng().gen_range(1..=100);\n    for turn in 1..=7 {\n        println!(\"Guess {turn} of 7:\");\n        let mut line = String::new();\n        io::stdin().read_line(&mut line).expect(\"Failed to read line\");\n        let guess: u32 = match line.trim().parse() {\n            Ok(n) if (1..=100).contains(&n) => n,\n            _ => {\n                println!(\"Type a number from 1 to 100. That turn is lost.\");\n                continue;\n            }\n        };\n        match guess.cmp(&secret) {\n            Ordering::Less => println!(\"Too small!\"),\n            Ordering::Greater => println!(\"Too big!\"),\n            Ordering::Equal => {\n                println!(\"You win!\");\n                return; // leave main straight away\n            }\n        }\n    }\n    println!(\"Out of guesses. The number was {secret}.\");\n}","explain":"return inside main ends the program, so the line after the loop only runs when the player never won. The match guard if (1..=100).contains(&n) folds the range check into the parse step, a pattern you will see again in Chapter 19."}}},"3.1":{"example":{"title":"let, mut, const and shadowing","lang":"rust","note":"Immutability by default makes code easier to reason about, because a value cannot change behind your back. Constants must have a type and a value known at compile time. Shadowing creates a brand new variable, which is why it can change the type, while mut only lets you change the value.","code":"const SECONDS_PER_HOUR: u32 = 60 * 60;\n\nfn main() {\n    let x = 5;\n    // x = 6;          // error: cannot assign twice to immutable variable\n    let mut y = 5;\n    y += 1;             // fine, y is mutable\n\n    let x = x * 2;      // shadowing: a new x that hides the old one\n    let spaces = \"   \";\n    let spaces = spaces.len(); // same name, new type (usize)\n\n    println!(\"x = {x}, y = {y}, spaces = {spaces}, hour = {SECONDS_PER_HOUR}s\");\n}","output":"x = 10, y = 6, spaces = 3, hour = 3600s"},"exercises":{"3.1a":{"lang":"rust","hints":["The error says you cannot assign twice to an immutable variable.","Way one: declare it as let mut total.","Way two: write let total = total + 5; to make a new variable."],"solution":"fn main() {\n    // 1. With mut: the same variable changes\n    let mut total = 0;\n    total = total + 5;\n    println!(\"{total}\");\n\n    // 2. With shadowing: a new variable with the same name\n    let count = 0;\n    let count = count + 5;\n    println!(\"{count}\");\n}","explain":"Both print 5. Prefer shadowing when you are transforming a value once (especially to a new type) and mut when a value genuinely changes over time, like a counter in a loop."},"3.1b":{"lang":"rust","hints":["Constants need a type: const CM_PER_INCH: f64 = 2.54;","Constant names are written in SCREAMING_SNAKE_CASE.","Multiply with * and print with {:.1} for one decimal place."],"solution":"const CM_PER_INCH: f64 = 2.54;\nconst METRES_PER_MILE: f64 = 1609.344;\n\nfn main() {\n    let inches = 12.0;\n    let miles = 26.2;\n    println!(\"{inches} in = {:.1} cm\", inches * CM_PER_INCH);\n    println!(\"{miles} mi = {:.1} m\", miles * METRES_PER_MILE);\n}","explain":"{:.1} formats a float with one decimal place. Writing 12 instead of 12.0 would make inches an integer, and Rust will not multiply an integer by an f64 without an explicit conversion."}}},"3.2":{"example":{"title":"Numbers, booleans and characters","lang":"rust","note":"In a debug build, overflowing an integer panics; in a release build it wraps around. When overflow is possible, say what you want with checked_, wrapping_, saturating_ or overflowing_ methods. Integer division rounds toward zero.","code":"fn main() {\n    let big: i64 = 9_000_000_000;      // underscores help readability\n    let small: u8 = 255;                // u8 holds 0 to 255\n    let hex = 0xff;\n    let float = 2.0 * 3.5;               // f64 by default\n    let quotient = -7 / 2;               // integer division truncates: -3\n    let remainder = 7 % 3;\n    let is_fun: bool = true;\n    let heart = '❤';                     // char is a Unicode scalar value\n\n    println!(\"{big} {small} {hex} {float} {quotient} {remainder} {is_fun} {heart}\");\n    println!(\"checked: {:?}\", small.checked_add(1)); // None instead of overflow\n    println!(\"wrapping: {}\", small.wrapping_add(1)); // 0\n}","output":"9000000000 255 255 7 -3 1 true ❤\nchecked: None\nwrapping: 0"},"exercises":{"3.2a":{"lang":"rust","hints":["Every integer type has associated constants, for example i8::MIN.","Print with println!(\"i8: {} to {}\", i8::MIN, i8::MAX);","Notice that unsigned types always start at 0."],"solution":"fn main() {\n    println!(\"i8:  {} to {}\", i8::MIN, i8::MAX);\n    println!(\"u8:  {} to {}\", u8::MIN, u8::MAX);\n    println!(\"i32: {} to {}\", i32::MIN, i32::MAX);\n    println!(\"u64: {} to {}\", u64::MIN, u64::MAX);\n}","explain":"An n-bit signed type holds -(2^(n-1)) to 2^(n-1) - 1, and an unsigned one holds 0 to 2^n - 1. Picking the smallest type that fits is rarely worth it; i32 is a good default and usize is used for indexes and lengths."},"3.2b":{"lang":"rust","hints":["u8 has a checked_add method that already returns an Option.","Tests go in a #[cfg(test)] mod tests block with #[test] functions.","assert_eq!(safe_add(200, 100), None); checks the overflow case."],"solution":"fn safe_add(a: u8, b: u8) -> Option<u8> {\n    a.checked_add(b)\n}\n\nfn main() {\n    println!(\"{:?}\", safe_add(200, 50));\n    println!(\"{:?}\", safe_add(200, 100));\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn fits() {\n        assert_eq!(safe_add(200, 50), Some(250));\n    }\n\n    #[test]\n    fn overflows() {\n        assert_eq!(safe_add(200, 100), None);\n    }\n}","explain":"Option makes the failure part of the return type, so the caller cannot forget it. Run the tests with cargo test, or in the Playground choose Test. Chapter 6 covers Option and Chapter 11 covers tests in depth."}}},"3.3":{"example":{"title":"Tuples and arrays","lang":"rust","note":"An array's length is part of its type, [i32; 5], so it never grows; use a Vec (Chapter 8) when you need that. Indexing past the end with months[10] panics at run time instead of reading random memory, which is one of Rust's safety guarantees.","code":"fn main() {\n    let point: (i32, f64, char) = (500, 6.4, 'x');\n    let (a, b, c) = point;              // destructuring\n    println!(\"{a} {b} {c} / first again: {}\", point.0);\n\n    let months = [\"Jan\", \"Feb\", \"Mar\"];\n    let zeros = [0; 5];                 // five zeros\n    println!(\"{} has {} items; zeros = {:?}\", months[0], months.len(), zeros);\n\n    let i = 10;\n    match months.get(i) {               // get returns None instead of panicking\n        Some(m) => println!(\"{m}\"),\n        None => println!(\"no month at index {i}\"),\n    }\n}","output":"500 6.4 x / first again: 500\nJan has 3 items; zeros = [0, 0, 0, 0, 0]\nno month at index 10"},"exercises":{"3.3a":{"lang":"rust","hints":["Destructure the parameter with let (n, s) = pair;","Return (s, n) as the last expression, without a semicolon.","Use String::from(\"seven\") to make the String."],"solution":"fn swap(pair: (i32, String)) -> (String, i32) {\n    let (n, s) = pair;\n    (s, n)\n}\n\nfn main() {\n    let swapped = swap((7, String::from(\"seven\")));\n    println!(\"{:?}\", swapped);\n}","explain":"{:?} prints with the Debug format, which tuples support out of the box. The function's last line has no semicolon, so its value is returned; that rule is explained in the next lesson."},"3.3b":{"lang":"rust","hints":["let temps = [21.5, 19.0, ...]; with seven values.","Start max at f64::MIN and min at f64::MAX, then loop with for t in temps.","The average is the sum divided by temps.len() as f64."],"solution":"fn main() {\n    let temps = [21.5, 19.0, 23.1, 18.4, 25.0, 22.2, 20.7];\n    let mut max = f64::MIN;\n    let mut min = f64::MAX;\n    let mut sum = 0.0;\n    for t in temps {\n        if t > max { max = t; }\n        if t < min { min = t; }\n        sum += t;\n    }\n    let avg = sum / temps.len() as f64;\n    println!(\"high {max}, low {min}, average {avg:.1}\");\n}","explain":"as f64 converts the usize length so it can divide a float; Rust never converts number types silently. Later you will write the same thing with temps.iter().cloned().fold(f64::MIN, f64::max), but a plain loop is clear and fast."}}},"3.4":{"example":{"title":"Expressions are values","lang":"rust","note":"A statement does something and gives no value (let x = 3;). An expression produces a value (x + 1). Adding a semicolon to the last line of a function turns it into a statement, and the compiler reports mismatched types because the function now returns () instead of u32.","code":"// Returns the area of a rectangle.\nfn area(width: u32, height: u32) -> u32 {\n    width * height          // no semicolon: this is the return value\n}\n\nfn main() {\n    let y = {\n        let x = 3;\n        x + 1               // a block is an expression too\n    };\n    println!(\"y = {y}, area = {}\", area(3, 4));\n}","output":"y = 4, area = 12"},"exercises":{"3.4a":{"lang":"rust","hints":["The formula is c * 9.0 / 5.0 + 32.0.","The function body can be a single expression without a semicolon.","Loop over an array of the four values in main."],"solution":"fn celsius_to_fahrenheit(c: f64) -> f64 {\n    c * 9.0 / 5.0 + 32.0\n}\n\nfn main() {\n    for c in [0.0, 25.0, 37.0, 100.0] {\n        println!(\"{c:>5.1} C = {:>5.1} F\", celsius_to_fahrenheit(c));\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn boiling_point() {\n        assert_eq!(celsius_to_fahrenheit(100.0), 212.0);\n    }\n}","explain":"{c:>5.1} right-aligns in five characters with one decimal place, so the table lines up. Writing 9 / 5 with integers would give 1, which is why every literal here has a decimal point."},"3.4b":{"lang":"rust","hints":["Compile it and look for error[E0308] mismatched types.","The help line suggests removing the semicolon.","The fixed body is n * 2 with no semicolon."],"solution":"// Broken: fn double(n: i32) -> i32 { n * 2; }\n// error[E0308]: mismatched types ... expected `i32`, found `()`\n// help: remove this semicolon to return this value\nfn double(n: i32) -> i32 {\n    n * 2\n}\n\nfn main() {\n    println!(\"{}\", double(21));\n}","explain":"The semicolon turns the expression into a statement, so the body produces the unit value () instead of an i32. This is the single most common beginner error in Rust, and the compiler always points to the fix."}}},"3.5":{"example":{"title":"Every kind of control flow","lang":"rust","note":"The condition in an if must be a bool; Rust never treats numbers as true or false. Both branches of an if used as a value must have the same type. Prefer for over while with an index, because for cannot go out of bounds.","code":"fn main() {\n    let n = 7;\n    let kind = if n % 2 == 0 { \"even\" } else { \"odd\" };\n    println!(\"{n} is {kind}\");\n\n    let mut counter = 0;\n    let result = loop {\n        counter += 1;\n        if counter == 10 {\n            break counter * 2;   // loop can return a value\n        }\n    };\n    println!(\"result = {result}\");\n\n    'outer: for i in 1..=3 {\n        for j in 1..=3 {\n            if i * j == 4 { break 'outer; } // leave both loops\n            print!(\"{} \", i * j);\n        }\n    }\n    println!();\n\n    for i in (1..4).rev() { print!(\"{i}... \"); }\n    println!(\"liftoff!\");\n}","output":"7 is odd\nresult = 20\n1 2 3 2\n3... 2... 1... liftoff!"},"exercises":{"3.5a":{"lang":"rust","hints":["Loop with for i in 1..=30.","Check the multiple of 15 first, otherwise it never gets a chance.","Use else if for the other two cases and else to print the number."],"solution":"fn main() {\n    for i in 1..=30 {\n        if i % 15 == 0 {\n            println!(\"FizzBuzz\");\n        } else if i % 3 == 0 {\n            println!(\"Fizz\");\n        } else if i % 5 == 0 {\n            println!(\"Buzz\");\n        } else {\n            println!(\"{i}\");\n        }\n    }\n}","explain":"Order matters in an if-else chain because the first true condition wins. A neat alternative is match (i % 3, i % 5) { (0, 0) => ..., (0, _) => ..., (_, 0) => ..., _ => ... }, which you will meet in Chapter 6."},"3.5b":{"lang":"rust","hints":["Keep two variables, a and b, starting at 0 and 1.","Each step, the new pair is (b, a + b).","Repeat n times with for _ in 0..n, then return a."],"solution":"fn fib(n: u32) -> u64 {\n    let (mut a, mut b) = (0u64, 1u64);\n    for _ in 0..n {\n        let next = a + b;\n        a = b;\n        b = next;\n    }\n    a\n}\n\nfn main() {\n    println!(\"fib(10) = {}\", fib(10));\n    println!(\"fib(50) = {}\", fib(50));\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn known_values() {\n        assert_eq!(fib(0), 0);\n        assert_eq!(fib(1), 1);\n        assert_eq!(fib(10), 55);\n    }\n}","explain":"u64 matters here, because fib(50) is 12586269025, too big for a u32. The underscore in for _ in 0..n says you do not need the loop counter."}}},"4.1":{"example":{"title":"Moves, clones and copies","lang":"rust","note":"The rules: each value has one owner, there is only one owner at a time, and the value is dropped when its owner goes out of scope. Moving instead of copying means two variables can never free the same memory. Simple values that live entirely on the stack, like integers, bool and char, implement Copy and are duplicated instead of moved.","code":"fn main() {\n    let s1 = String::from(\"hello\");   // s1 owns heap memory\n    let s2 = s1;                       // ownership moves to s2\n    // println!(\"{s1}\");               // error: borrow of moved value\n    let s3 = s2.clone();               // a real copy of the heap data\n    println!(\"{s2} {s3}\");\n\n    let a = 5;\n    let b = a;                         // integers are Copy: both stay valid\n    println!(\"{a} {b}\");\n}                                      // s3, then s2 are dropped here","output":"hello hello\n5 5"},"exercises":{"4.1a":{"lang":"rust","hints":["A String moves when assigned; an integer is copied.","Case 1 fails with borrow of moved value.","Clone or print b instead of a to fix case 1."],"solution":"fn main() {\n    // (1) fails: a was moved into b. Fixed by printing b:\n    let a = String::from(\"x\");\n    let b = a;\n    println!(\"{b}\");\n\n    // (2) compiles: clone makes a separate copy\n    let c = String::from(\"x\");\n    let d = c.clone();\n    println!(\"{c} {d}\");\n\n    // (3) compiles: i32 is Copy\n    let n = 3;\n    let m = n;\n    println!(\"{n} {m}\");\n}","explain":"Predicting before compiling is the fastest way to build a mental model of ownership. Reach for clone when you truly need two independent values, but not just to silence the compiler; often a reference (next lesson) is the better fix."},"4.1b":{"lang":"rust","hints":["impl Drop for Noisy { fn drop(&mut self) { println!(\"dropping {}\", self.0); } }","Values are dropped at the end of the scope that owns them.","Within one scope, values are dropped in the reverse order they were created."],"solution":"struct Noisy(&'static str);\n\nimpl Drop for Noisy {\n    fn drop(&mut self) {\n        println!(\"dropping {}\", self.0);\n    }\n}\n\nfn main() {\n    let _a = Noisy(\"a\");\n    {\n        let _b = Noisy(\"b\");\n        println!(\"inner scope ends\");\n    }\n    let _c = Noisy(\"c\");\n    println!(\"main ends\");\n}\n// Output: inner scope ends, dropping b, main ends, dropping c, dropping a","explain":"Drop is how Rust frees memory, closes files and releases locks automatically. Reverse order matters because later values may depend on earlier ones. Chapter 15 returns to Drop in detail."}}},"4.2":{"example":{"title":"Giving and taking ownership","lang":"rust","note":"Handing ownership in and back out works but is clumsy, especially when a function wants to return something else as well. That is exactly the problem references solve in the next lesson.","code":"fn takes_ownership(s: String) {\n    println!(\"got {s}\");\n} // s is dropped here\n\nfn gives_back(s: String) -> String {\n    s // ownership moves out to the caller\n}\n\nfn main() {\n    let s = String::from(\"hello\");\n    takes_ownership(s);\n    // println!(\"{s}\"); // error: s was moved into the function\n\n    let t = String::from(\"world\");\n    let t = gives_back(t);\n    println!(\"still have {t}\");\n}","output":"got hello\nstill have world"},"exercises":{"4.2a":{"lang":"rust","hints":["s.len() gives the length in bytes.","Compute the length before you move s into the tuple.","In main, destructure with let (s, len) = calculate_length(s);"],"solution":"fn calculate_length(s: String) -> (String, usize) {\n    let length = s.len();\n    (s, length)\n}\n\nfn main() {\n    let s = String::from(\"ownership\");\n    let (s, len) = calculate_length(s);\n    println!(\"'{s}' is {len} bytes long\");\n}","explain":"This works, but notice how awkward it is to thread the String back out. In the next lesson the same function becomes fn calculate_length(s: &String) -> usize."},"4.2b":{"lang":"rust","hints":["format! works like println! but returns a String.","The parameter moves in; the new String moves out.","Each call needs its own String argument."],"solution":"fn make_greeting(name: String) -> String {\n    format!(\"Hello, {name}!\")\n}\n\nfn main() {\n    let a = make_greeting(String::from(\"Ada\"));\n    let b = make_greeting(String::from(\"Linus\"));\n    println!(\"{a}\\n{b}\");\n}","explain":"format! builds a brand new String, so returning it hands ownership to the caller with no copying of the original. The name String is dropped at the end of make_greeting."}}},"4.3":{"example":{"title":"Shared and mutable borrows","lang":"rust","note":"At any moment you can have either one mutable reference or any number of shared ones, never both. This rule stops data races at compile time. A borrow lasts until its last use, not until the end of the block, which is why r3 is allowed above.","code":"fn calculate_length(s: &String) -> usize {\n    s.len()                 // read through the reference\n}\n\nfn add_world(s: &mut String) {\n    s.push_str(\", world\");  // change through the mutable reference\n}\n\nfn main() {\n    let mut s = String::from(\"hello\");\n    let len = calculate_length(&s);\n    add_world(&mut s);\n    println!(\"{s} ({len} before)\");\n\n    let r1 = &s;\n    let r2 = &s;            // many shared borrows are fine\n    println!(\"{r1} {r2}\");\n    let r3 = &mut s;        // fine: r1 and r2 are no longer used\n    r3.push('!');\n    println!(\"{r3}\");\n}","output":"hello, world (5 before)\nhello, world hello, world\nhello, world!"},"exercises":{"4.3a":{"lang":"rust","hints":["Change the parameter type to &String.","Call it with calculate_length(&s).","Later, idiomatic Rust takes &str instead; you will see why in the slices lesson."],"solution":"fn calculate_length(s: &String) -> usize {\n    s.len()\n}\n\nfn main() {\n    let s = String::from(\"borrowing\");\n    let len = calculate_length(&s);\n    println!(\"'{s}' has {len} bytes\");\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn counts_bytes() {\n        assert_eq!(calculate_length(&String::from(\"abc\")), 3);\n    }\n}","explain":"The function borrows the String, reads it and gives it back automatically when it returns. No ownership changes hands, so there is nothing to return."},"4.3b":{"lang":"rust","hints":["*s = s.to_uppercase(); replaces the contents; then s.push('!').","Create let r = &text; then call shout(&mut text); then use r, and read the error.","Use r before the mutable borrow and the error disappears."],"solution":"fn shout(s: &mut String) {\n    *s = s.to_uppercase();\n    s.push('!');\n}\n\nfn main() {\n    let mut text = String::from(\"hello\");\n    let r = &text;\n    println!(\"before: {r}\");   // last use of r\n    shout(&mut text);          // now a mutable borrow is allowed\n    println!(\"after: {text}\");\n    // If you print r after shout, rustc reports E0502:\n    // cannot borrow `text` as mutable because it is also borrowed as immutable\n}","explain":"The * in *s = ... writes through the reference to the String itself. Moving the last use of r earlier is usually the right fix; the borrow checker cares about where references are used, not where they are declared."}}},"4.4":{"example":{"title":"first_word with slices","lang":"rust","note":"A slice is a reference to a range inside existing data, so it can never outlive that data, and the String cannot be cleared while a slice into it is in use. Taking &str instead of &String lets one function accept both Strings and literals.","code":"fn first_word(s: &str) -> &str {\n    for (i, &b) in s.as_bytes().iter().enumerate() {\n        if b == b' ' {\n            return &s[..i];\n        }\n    }\n    &s[..]\n}\n\nfn main() {\n    let sentence = String::from(\"hello world\");\n    let word = first_word(&sentence);      // &String coerces to &str\n    let lit = first_word(\"ownership rules\"); // a literal is already &str\n    println!(\"{word} / {lit}\");\n\n    let nums = [1, 2, 3, 4, 5];\n    let middle: &[i32] = &nums[1..4];\n    println!(\"{middle:?}\");\n}","output":"hello / ownership\n[2, 3, 4]"},"exercises":{"4.4a":{"lang":"rust","hints":["rfind(' ') finds the last space and gives an Option<usize>.","If there is a space at index i, the word starts at i + 1.","If there is no space, the whole string is the word."],"solution":"fn last_word(s: &str) -> &str {\n    match s.rfind(' ') {\n        Some(i) => &s[i + 1..],\n        None => s,\n    }\n}\n\nfn main() {\n    println!(\"{}\", last_word(\"the quick brown fox\"));\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn sentence() {\n        assert_eq!(last_word(\"the quick brown fox\"), \"fox\");\n    }\n    #[test]\n    fn single() {\n        assert_eq!(last_word(\"rust\"), \"rust\");\n    }\n}","explain":"Slicing by byte index is safe here because a space is a single byte. Slicing in the middle of a multi-byte character such as é panics, which is why Chapter 8 introduces chars()."},"4.4b":{"lang":"rust","hints":["A slice parameter &[i32] accepts any part of an array or vector.","Loop with for v in values and add *v, or use values.iter().sum().","Pass &arr for the whole array and &arr[..3] for the first three."],"solution":"fn sum(values: &[i32]) -> i32 {\n    let mut total = 0;\n    for v in values {\n        total += v;\n    }\n    total\n}\n\nfn main() {\n    let arr = [3, 1, 4, 1, 5, 9];\n    println!(\"all: {}, first three: {}\", sum(&arr), sum(&arr[..3]));\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn sums() {\n        assert_eq!(sum(&[3, 1, 4, 1, 5, 9]), 23);\n        assert_eq!(sum(&[]), 0);\n    }\n}","explain":"Writing the parameter as a slice instead of [i32; 6] makes the function work for any length, including an empty slice. total += v works because Rust implements += between i32 and &i32."}}},"5.1":{"example":{"title":"Structs in every shape","lang":"rust","note":"..u1 copies the remaining fields from u1. Because username is a String, it moves into u2, so u1 can no longer be used as a whole. Fields hold owned types like String, so the struct owns its data; holding references needs lifetimes, covered in Chapter 10.","code":"#[derive(Debug)]\nstruct User {\n    active: bool,\n    username: String,\n    email: String,\n    sign_in_count: u64,\n}\n\nstruct Color(u8, u8, u8);   // tuple struct\nstruct AlwaysEqual;         // unit-like struct\n\nfn build_user(email: String, username: String) -> User {\n    User { active: true, username, email, sign_in_count: 1 } // shorthand\n}\n\nfn main() {\n    let u1 = build_user(\"ada@example.com\".into(), \"ada\".into());\n    let u2 = User { email: String::from(\"grace@example.com\"), ..u1 };\n    let black = Color(0, 0, 0);\n    let _marker = AlwaysEqual;\n    println!(\"{} {} {}\", u2.username, u2.email, black.0);\n    println!(\"{u2:?}\");\n}","output":"ada grace@example.com 0\nUser { active: true, username: \"ada\", email: \"grace@example.com\", sign_in_count: 1 }"},"exercises":{"5.1a":{"lang":"rust","hints":["Put #[derive(Debug)] on the line above struct Book.","Create one with Book { title: String::from(...), author: ..., pages: 300 }.","{:#?} prints each field on its own line."],"solution":"#[derive(Debug)]\nstruct Book {\n    title: String,\n    author: String,\n    pages: u32,\n}\n\nfn main() {\n    let a = Book {\n        title: String::from(\"The Rust Programming Language\"),\n        author: String::from(\"Klabnik, Nichols, Krycho\"),\n        pages: 560,\n    };\n    let b = Book { title: String::from(\"Rust in Action\"), author: String::from(\"McNamara\"), pages: 456 };\n    println!(\"{a:?}\");\n    println!(\"{b:#?}\");\n}","explain":"Debug is a trait; derive writes the implementation for you. {:#?} is the pretty-printed form and is much easier to read for structs with several fields."},"5.1b":{"lang":"rust","hints":["struct Meters(f64); and struct Feet(f64);","Read the inner number with m.0.","One metre is about 3.28084 feet."],"solution":"#[derive(Debug)]\nstruct Meters(f64);\n#[derive(Debug)]\nstruct Feet(f64);\n\nfn to_feet(m: Meters) -> Feet {\n    Feet(m.0 * 3.28084)\n}\n\nfn main() {\n    let height = Meters(1.8);\n    println!(\"{:?}\", to_feet(height));\n    // to_feet(Feet(6.0)); // error[E0308]: expected `Meters`, found `Feet`\n}","explain":"Both types hold an f64, but the compiler treats them as different, so you cannot mix units by accident. This newtype pattern costs nothing at run time and comes back in Chapter 20."}}},"5.2":{"example":{"title":"Rectangles with a struct and dbg!","lang":"rust","note":"dbg! prints to standard error with the file and line, returns the value, and takes ownership unless you pass a reference. It is the quickest way to peek at a value while debugging. Passing &Rectangle lets area read the struct without taking it.","code":"#[derive(Debug)]\nstruct Rectangle {\n    width: u32,\n    height: u32,\n}\n\nfn area(rect: &Rectangle) -> u32 {\n    rect.width * rect.height\n}\n\nfn main() {\n    let scale = 2;\n    let rect = Rectangle {\n        width: dbg!(30 * scale), // prints the file, line and value\n        height: 50,\n    };\n    dbg!(&rect);\n    println!(\"area = {}\", area(&rect));\n}","output":"[src/main.rs:13:16] 30 * scale = 60\n[src/main.rs:16:5] &rect = Rectangle {\n    width: 60,\n    height: 50,\n}\narea = 3000"},"exercises":{"5.2a":{"lang":"rust","hints":["The perimeter is 2 * (width + height).","is_square compares width and height with ==.","Pass references so main can keep using the rectangles."],"solution":"struct Rectangle {\n    width: u32,\n    height: u32,\n}\n\nfn perimeter(r: &Rectangle) -> u32 {\n    2 * (r.width + r.height)\n}\n\nfn is_square(r: &Rectangle) -> bool {\n    r.width == r.height\n}\n\nfn main() {\n    for r in [Rectangle { width: 10, height: 10 }, Rectangle { width: 3, height: 7 }] {\n        println!(\"{}x{}: perimeter {}, square {}\", r.width, r.height, perimeter(&r), is_square(&r));\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn square() {\n        let r = Rectangle { width: 4, height: 4 };\n        assert!(is_square(&r));\n        assert_eq!(perimeter(&r), 16);\n    }\n}","explain":"Free functions taking &Rectangle work, but they are scattered. The next lesson moves them into an impl block so they read as r.perimeter() and r.is_square()."},"5.2b":{"lang":"rust","hints":["Loop over the array and add up the areas.","Wrap the area expression in dbg!(...); it returns the value.","Run it and notice dbg! output goes to standard error."],"solution":"#[derive(Debug)]\nstruct Rectangle {\n    width: u32,\n    height: u32,\n}\n\nfn main() {\n    let rects = [\n        Rectangle { width: 2, height: 3 },\n        Rectangle { width: 4, height: 5 },\n        Rectangle { width: 6, height: 1 },\n    ];\n    let mut total = 0;\n    for r in &rects {\n        total += dbg!(r.width * r.height);\n    }\n    println!(\"total area = {total}\");\n}","explain":"Because dbg! returns its argument, you can drop it into the middle of an expression and remove it later without restructuring code. Remember to delete dbg! calls before committing; clippy can warn about leftovers."}}},"5.3":{"example":{"title":"Rectangle with methods","lang":"rust","note":"&self is short for self: &Self. Rust adds the & or &mut for you when you call a method, so big.grow(5) borrows big mutably without you writing &mut big. Associated functions without self, like square, are called with Type::name and are often used as constructors.","code":"#[derive(Debug)]\nstruct Rectangle {\n    width: u32,\n    height: u32,\n}\n\nimpl Rectangle {\n    fn square(size: u32) -> Self {         // associated function\n        Self { width: size, height: size }\n    }\n    fn area(&self) -> u32 {\n        self.width * self.height\n    }\n    fn can_hold(&self, other: &Rectangle) -> bool {\n        self.width > other.width && self.height > other.height\n    }\n    fn grow(&mut self, by: u32) {\n        self.width += by;\n        self.height += by;\n    }\n}\n\nfn main() {\n    let mut big = Rectangle { width: 30, height: 50 };\n    let small = Rectangle::square(10);\n    println!(\"area {}, holds small: {}\", big.area(), big.can_hold(&small));\n    big.grow(5);\n    println!(\"{big:?}\");\n}","output":"area 1500, holds small: true\nRectangle { width: 35, height: 55 }"},"exercises":{"5.3a":{"lang":"rust","hints":["new returns Self { owner: owner.to_string(), balance: 0 }.","withdraw checks amount <= self.balance before subtracting.","Return true when the withdrawal happens and false otherwise."],"solution":"struct Account {\n    owner: String,\n    balance: i64,\n}\n\nimpl Account {\n    fn new(owner: &str) -> Self {\n        Self { owner: owner.to_string(), balance: 0 }\n    }\n    fn deposit(&mut self, amount: i64) {\n        self.balance += amount;\n    }\n    fn withdraw(&mut self, amount: i64) -> bool {\n        if amount <= self.balance {\n            self.balance -= amount;\n            true\n        } else {\n            false\n        }\n    }\n    fn balance(&self) -> i64 {\n        self.balance\n    }\n}\n\nfn main() {\n    let mut acc = Account::new(\"Kev\");\n    acc.deposit(100);\n    println!(\"withdraw 30: {}\", acc.withdraw(30));\n    println!(\"withdraw 500: {}\", acc.withdraw(500));\n    println!(\"{} has {}\", acc.owner, acc.balance());\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn no_overdraft() {\n        let mut a = Account::new(\"t\");\n        a.deposit(10);\n        assert!(!a.withdraw(20));\n        assert_eq!(a.balance(), 10);\n    }\n}","explain":"A method and a field can share a name (balance); acc.balance() calls the method and acc.balance reads the field. Keeping the field private and exposing a method is how Rust does encapsulation, which Chapter 7 makes enforceable with pub."},"5.3b":{"lang":"rust","hints":["A method that takes self (not &self) takes ownership.","Return format!(\"{}: {}\", self.owner, self.balance).","Try calling acc.balance() afterwards and read the move error."],"solution":"struct Account {\n    owner: String,\n    balance: i64,\n}\n\nimpl Account {\n    fn into_report(self) -> String {\n        format!(\"{}: {}\", self.owner, self.balance)\n    }\n}\n\nfn main() {\n    let acc = Account { owner: String::from(\"Kev\"), balance: 70 };\n    let report = acc.into_report();\n    println!(\"{report}\");\n    // println!(\"{}\", acc.balance); // error: value used after move\n}","explain":"Methods that take self are used when the object is transformed into something else, which is why their names often start with into_. The compiler then guarantees nobody uses the old value by mistake."}}},"6.1":{"example":{"title":"Messages and Option","lang":"rust","note":"Each variant can carry its own kind of data, so one type covers several shapes. Option<T> is either Some(value) or None, and because Option<i32> is a different type from i32, the compiler makes you deal with the missing case before you can use the number.","code":"#[derive(Debug)]\nenum Message {\n    Quit,\n    Move { x: i32, y: i32 },\n    Write(String),\n    ChangeColor(u8, u8, u8),\n}\n\nimpl Message {\n    fn describe(&self) -> String {\n        format!(\"{self:?}\")\n    }\n}\n\nfn main() {\n    let msgs = [\n        Message::Write(String::from(\"hi\")),\n        Message::Move { x: 1, y: 2 },\n        Message::ChangeColor(0, 128, 255),\n        Message::Quit,\n    ];\n    for m in &msgs {\n        println!(\"{}\", m.describe());\n    }\n    let some_number: Option<i32> = Some(5);\n    let absent: Option<i32> = None;\n    println!(\"{some_number:?} {absent:?}\");\n}","output":"Write(\"hi\")\nMove { x: 1, y: 2 }\nChangeColor(0, 128, 255)\nQuit\nSome(5) None"},"exercises":{"6.1a":{"lang":"rust","hints":["Inside area, match self and handle each variant.","A circle's area is std::f64::consts::PI * r * r.","A triangle's area is base * height / 2.0."],"solution":"use std::f64::consts::PI;\n\nenum Shape {\n    Circle(f64),\n    Rectangle(f64, f64),\n    Triangle(f64, f64),\n}\n\nimpl Shape {\n    fn area(&self) -> f64 {\n        match self {\n            Shape::Circle(r) => PI * r * r,\n            Shape::Rectangle(w, h) => w * h,\n            Shape::Triangle(b, h) => b * h / 2.0,\n        }\n    }\n}\n\nfn main() {\n    let shapes = [Shape::Circle(1.0), Shape::Rectangle(2.0, 3.0), Shape::Triangle(4.0, 5.0)];\n    for s in &shapes {\n        println!(\"{:.2}\", s.area());\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn rectangle() {\n        assert_eq!(Shape::Rectangle(2.0, 3.0).area(), 6.0);\n    }\n}","explain":"If you add a new variant later, every match on Shape stops compiling until you handle it. That compiler-enforced completeness is one of the main reasons Rust programmers model their data with enums."},"6.1b":{"lang":"rust","hints":["Use match name with string literal patterns such as \"ada\" => Some(36).","The catch-all _ => None handles everyone else.","Print with {:?} to see Some(36) or None."],"solution":"fn find_age(name: &str) -> Option<u32> {\n    match name {\n        \"ada\" => Some(36),\n        \"grace\" => Some(85),\n        \"linus\" => Some(56),\n        _ => None,\n    }\n}\n\nfn main() {\n    println!(\"{:?}\", find_age(\"grace\"));\n    println!(\"{:?}\", find_age(\"nobody\"));\n}","explain":"Returning Option makes \"not found\" part of the function's type. Callers must decide what to do with None, so there is no equivalent of a null pointer exception waiting to happen."}}},"6.2":{"example":{"title":"Coins and Option with match","lang":"rust","note":"match checks arms from top to bottom and runs the first one that fits. It must be exhaustive, so leaving out None or a coin is a compile error. other binds the value; _ matches anything and ignores it.","code":"#[derive(Debug)]\nenum Province { Quebec, Ontario }\n\nenum Coin {\n    Penny,\n    Nickel,\n    Dime,\n    Quarter(Province),\n}\n\nfn value_in_cents(coin: Coin) -> u8 {\n    match coin {\n        Coin::Penny => 1,\n        Coin::Nickel => 5,\n        Coin::Dime => 10,\n        Coin::Quarter(p) => {\n            println!(\"Quarter from {p:?}\");\n            25\n        }\n    }\n}\n\nfn plus_one(x: Option<i32>) -> Option<i32> {\n    match x {\n        None => None,\n        Some(i) => Some(i + 1),\n    }\n}\n\nfn main() {\n    println!(\"{}\", value_in_cents(Coin::Quarter(Province::Quebec)));\n    println!(\"{:?} {:?}\", plus_one(Some(5)), plus_one(None));\n    let roll = 9;\n    match roll {\n        3 => println!(\"hat\"),\n        7 => println!(\"lose hat\"),\n        other => println!(\"move {other} spaces\"),\n    }\n}","output":"Quarter from Quebec\n25\nSome(6) None\nmove 9 spaces"},"exercises":{"6.2a":{"lang":"rust","hints":["Derive Debug and Clone, Copy so you can print and reuse lights easily.","next matches self and returns the following light.","Loop three times, printing the light and its time, then moving to next()."],"solution":"#[derive(Debug, Clone, Copy)]\nenum Light {\n    Red,\n    Yellow,\n    Green,\n}\n\nimpl Light {\n    fn next(&self) -> Light {\n        match self {\n            Light::Red => Light::Green,\n            Light::Green => Light::Yellow,\n            Light::Yellow => Light::Red,\n        }\n    }\n    fn seconds(&self) -> u32 {\n        match self {\n            Light::Red => 30,\n            Light::Yellow => 4,\n            Light::Green => 25,\n        }\n    }\n}\n\nfn main() {\n    let mut light = Light::Red;\n    for _ in 0..3 {\n        println!(\"{light:?} for {}s\", light.seconds());\n        light = light.next();\n    }\n}","explain":"Deriving Copy lets light = light.next() replace the value freely. A state machine like this, where every transition is spelled out in a match, is impossible to leave half-handled."},"6.2b":{"lang":"rust","hints":["In divide, if b == 0 return None, otherwise Some(a / b).","In describe, match r with Some(n) and None.","format!(\"result {n}\") builds the text."],"solution":"fn divide(a: i32, b: i32) -> Option<i32> {\n    if b == 0 { None } else { Some(a / b) }\n}\n\nfn describe(r: Option<i32>) -> String {\n    match r {\n        Some(n) => format!(\"result {n}\"),\n        None => String::from(\"cannot divide by zero\"),\n    }\n}\n\nfn main() {\n    println!(\"{}\", describe(divide(10, 2)));\n    println!(\"{}\", describe(divide(1, 0)));\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn zero() {\n        assert_eq!(divide(1, 0), None);\n        assert_eq!(describe(None), \"cannot divide by zero\");\n    }\n}","explain":"Option also has helper methods such as map and unwrap_or that replace many matches, for example divide(10, 2).map(|n| n * 2). You will meet them in Chapter 13 once closures are introduced."}}},"6.3":{"example":{"title":"Shorter matches","lang":"rust","note":"if let trades the exhaustiveness check of match for less code. let...else keeps the happy path unindented, which reads well when a function needs several values that might be missing.","code":"fn parse_port(s: &str) -> Option<u16> {\n    let Ok(port) = s.parse::<u16>() else {\n        return None;                  // let...else must leave the block\n    };\n    Some(port)\n}\n\nfn main() {\n    let config_max: Option<u8> = Some(3);\n    if let Some(max) = config_max {\n        println!(\"The maximum is configured to be {max}\");\n    } else {\n        println!(\"No maximum\");\n    }\n\n    println!(\"{:?} {:?}\", parse_port(\"8080\"), parse_port(\"eighty\"));\n}","output":"The maximum is configured to be 3\nSome(8080) None"},"exercises":{"6.3a":{"lang":"rust","hints":["Loop with for r in results.","if let Some(v) = r { println!(...) } else { missing += 1 }","Print the count after the loop."],"solution":"fn main() {\n    let results = [Some(\"ok\"), None, Some(\"done\"), None, None];\n    let mut missing = 0;\n    for r in results {\n        if let Some(v) = r {\n            println!(\"got {v}\");\n        } else {\n            missing += 1;\n        }\n    }\n    println!(\"{missing} missing\");\n}","explain":"if let with else is equivalent to a two-arm match. Use it when one case is interesting and the other is a simple fallback."},"6.3b":{"lang":"rust","hints":["split_once('=') returns Option<(&str, &str)>.","let Some((key, value)) = line.split_once('=') else { return None; };","Use let...else again for value.trim().parse::<i32>()."],"solution":"fn parse_line(line: &str) -> Option<(String, i32)> {\n    let Some((key, value)) = line.split_once('=') else {\n        return None;\n    };\n    let Ok(n) = value.trim().parse::<i32>() else {\n        return None;\n    };\n    Some((key.trim().to_string(), n))\n}\n\nfn main() {\n    println!(\"{:?}\", parse_line(\"timeout = 30\"));\n    println!(\"{:?}\", parse_line(\"no equals sign\"));\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn good_and_bad() {\n        assert_eq!(parse_line(\"retries=3\"), Some((String::from(\"retries\"), 3)));\n        assert_eq!(parse_line(\"retries=three\"), None);\n        assert_eq!(parse_line(\"retries\"), None);\n    }\n}","explain":"Each let...else either binds the value or returns early, so by the last line every piece is known to be valid. Chapter 9 shows the ? operator, which shortens this even more."}}},"7.1":{"example":{"title":"One package, a library and two binaries","lang":"text","note":"A crate is the unit the compiler works on; a package is what Cargo builds and contains one Cargo.toml. A package can hold at most one library crate and any number of binary crates. Putting the real logic in lib.rs and keeping main.rs thin makes it easy to test, which Chapter 12 does.","code":"my_tool/\n├── Cargo.toml\n└── src/\n    ├── lib.rs          <- library crate root (shared logic)\n    ├── main.rs         <- binary crate
