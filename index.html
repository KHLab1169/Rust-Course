["rustfmt (cargo fmt)","clippy","rust-analyzer","rustdoc"],"answer":[0],"explain":"clippy lints, rust-analyzer powers editors, rustdoc builds docs."},{"id":"a1-02","type":"single","pool":"quiz","prompt":"What does cargo clippy -- -D warnings do?","options":["Runs clippy and fails if any warning is reported","Deletes warnings from the code","Disables all warnings","Only shows deprecated items"],"answer":[0],"explain":"-D warnings denies warnings, turning them into errors."},{"id":"a1-03","type":"single","pool":"quiz","prompt":"What does peekable() add to an iterator?","options":["A peek method to look at the next item without consuming it","Random access by index","The ability to go backwards","Parallel iteration"],"answer":[0],"explain":"Useful for run-length encoding and parsers."},{"id":"a1-04","type":"multi","pool":"exam","prompt":"Which are main reasons teams adopt Rust?","options":["Memory safety without a garbage collector","Performance close to C and C++","Data races caught at compile time","No need to learn about ownership"],"answer":[0,1,2],"explain":"Ownership is exactly what makes those guarantees possible."},{"id":"a1-05","type":"single","pool":"exam","prompt":"Why does a recursive enum like Expr need Box?","options":["Without indirection the type would have infinite size","Box makes it faster","Enums cannot hold structs","To make it Copy"],"answer":[0],"explain":"Box has a fixed pointer size."},{"id":"a1-06","type":"single","pool":"exam","prompt":"In for &n in nums where nums is &[i32], what is the type of n?","options":["i32","&i32","&&i32","usize"],"answer":[0],"explain":"The &n pattern dereferences each &i32."}],"a2":[{"id":"a2-01","type":"single","pool":"quiz","prompt":"Which collection pops from both ends in O(1)?","options":["VecDeque","Vec","BTreeSet","BinaryHeap"],"answer":[0],"explain":"Vec is O(1) only at the back."},{"id":"a2-02","type":"single","pool":"quiz","prompt":"What must a type implement to be a HashMap key?","options":["Hash and Eq","Ord only","Clone and Debug","Copy"],"answer":[0],"explain":"BTreeMap keys need Ord instead."},{"id":"a2-03","type":"single","pool":"quiz","prompt":"Which pops the smallest item first?","options":["A BinaryHeap of Reverse(x)","A BinaryHeap of x","A HashSet","A VecDeque"],"answer":[0],"explain":"BinaryHeap is a max-heap by default."},{"id":"a2-04","type":"multi","pool":"exam","prompt":"When is BTreeMap a better choice than HashMap?","options":["You need keys in sorted order","You need range queries","You need the fastest possible lookups on random keys","You want deterministic iteration order"],"answer":[0,1,3],"explain":"HashMap usually wins on raw lookup speed."},{"id":"a2-05","type":"single","pool":"exam","prompt":"Why is LinkedList rarely the right choice in Rust?","options":["Vec and VecDeque are usually faster because their data is contiguous in memory","It is unsafe","It cannot store Strings","It was removed from std"],"answer":[0],"explain":"Contiguous memory is cache-friendly."},{"id":"a2-06","type":"single","pool":"exam","prompt":"What does Vec::with_capacity(n) do?","options":["Allocates room for n items up front, avoiding reallocations","Creates n default items","Limits the vector to n items","Makes the vector immutable"],"answer":[0],"explain":"len is still 0; only capacity changes."}],"a3":[{"id":"a3-01","type":"single","pool":"quiz","prompt":"How many bytes does a String take on the stack on a 64-bit target?","options":["24: pointer, length and capacity","8","The length of the text","16"],"answer":[0],"explain":"The text itself lives on the heap."},{"id":"a3-02","type":"single","pool":"quiz","prompt":"What does std::mem::take(&mut v) do for a Vec?","options":["Moves the Vec out and leaves an empty one in its place","Clones the Vec","Drops the Vec","Borrows the Vec mutably"],"answer":[0],"explain":"It swaps in Default::default()."},{"id":"a3-03","type":"single","pool":"quiz","prompt":"What does T: 'static mean for a type?","options":["It contains no references that could expire","Every value of T lives until the program ends","T is a constant","T is stored in static memory"],"answer":[0],"explain":"Owned types such as String and Vec are 'static."},{"id":"a3-04","type":"single","pool":"exam","prompt":"Why is Option<Box<T>> the same size as Box<T>?","options":["A Box is never null, so None can be represented by the null pointer","Option is free for every type","The compiler removes Option","Box is two words"],"answer":[0],"explain":"This is called the niche optimisation."},{"id":"a3-05","type":"single","pool":"exam","prompt":"When does Cow<str> allocate?","options":["Only when it holds the Owned variant, created when the data had to change","Always","Never","When it is printed"],"answer":[0],"explain":"The Borrowed variant just wraps a reference."},{"id":"a3-06","type":"multi","pool":"exam","prompt":"Which compile inside one method of a struct with fields a and b?","options":["let x = &mut self.a; let y = &self.b; (both used)","let x = &mut self.a; let y = &self.a; (both used)","let x = &self.a; let y = &self.b; (both used)","let x = &mut self.a; let y = &mut self.b; (both used)"],"answer":[0,2,3],"explain":"Different fields can be borrowed independently; the same field cannot be borrowed mutably twice or mixed."}],"a4":[{"id":"a4-01","type":"single","pool":"quiz","prompt":"What does implementing From<io::Error> for your error type enable?","options":["Using ? on io results inside functions returning your error type","Printing the error","Cloning the error","Nothing useful"],"answer":[0],"explain":"? calls From::from on the error."},{"id":"a4-02","type":"single","pool":"quiz","prompt":"When should a library prefer thiserror over anyhow?","options":["When callers need to match on specific error cases","Always in binaries","When errors should be strings","Never"],"answer":[0],"explain":"anyhow erases the type; thiserror keeps a matchable enum."},{"id":"a4-03","type":"single","pool":"quiz","prompt":"What does {:#} print for an anyhow::Error?","options":["The error with its whole chain of causes on one line","Only the root cause","A backtrace","The Debug format"],"answer":[0],"explain":"The alternate format joins the context chain with colons."},{"id":"a4-04","type":"single","pool":"exam","prompt":"What is the purpose of Error::source?","options":["To expose the lower-level error that caused this one","To print the file name","To convert the error to a String","To retry the operation"],"answer":[0],"explain":"It forms the error chain."},{"id":"a4-05","type":"multi","pool":"exam","prompt":"Which are good practices for error messages?","options":["Say what was being attempted","Include the identifying data such as a file name","Repeat the cause's message inside Display when source already returns it","Start with lowercase and no trailing period, the Rust convention"],"answer":[0,1,3],"explain":"Repeating the cause duplicates text when the chain is printed."},{"id":"a4-06","type":"single","pool":"exam","prompt":"What does bail!(\"x\") do in a function returning anyhow::Result?","options":["Returns early with an error built from the message","Panics","Logs and continues","Exits the process"],"answer":[0],"explain":"It is shorthand for return Err(anyhow!(\"x\"))."}],"a5":[{"id":"a5-01","type":"single","pool":"quiz","prompt":"Why accept I IntoIterator instead of &[T]?","options":["Callers can pass vectors, arrays, sets, ranges, iterators or references","It is required for generics","Slices cannot be iterated","It avoids all allocations automatically"],"answer":[0],"explain":"IntoIterator is the most flexible input."},{"id":"a5-02","type":"single","pool":"quiz","prompt":"What do you get for free by implementing FromStr?","options":["The str::parse method for your type","Display","Serialization","Hashing"],"answer":[0],"explain":"\"1.2.3\".parse::<Version>() calls your from_str."},{"id":"a5-03","type":"single","pool":"quiz","prompt":"When should you implement TryFrom rather than From?","options":["When the conversion can fail","When the conversion is expensive","When converting to a String","Never"],"answer":[0],"explain":"From promises the conversion always succeeds."},{"id":"a5-04","type":"single","pool":"exam","prompt":"What does PhantomData<State> cost at run time?","options":["Nothing; it is zero-sized","One pointer","One byte","A heap allocation"],"answer":[0],"explain":"It exists only for the type checker."},{"id":"a5-05","type":"multi","pool":"exam","prompt":"Which must agree with each other when you implement them by hand?","options":["PartialEq and Eq","Eq and Hash","Ord and PartialOrd","Debug and Display"],"answer":[0,1,2],"explain":"Debug and Display are independent formats."},{"id":"a5-06","type":"single","pool":"exam","prompt":"What does const generics make possible?","options":["Values such as array lengths as part of a type","Constant functions only","Generic constants in traits only","Runtime-sized arrays on the stack"],"answer":[0],"explain":"Matrix<2, 3> and Matrix<3, 2> are distinct types."}],"a6":[{"id":"a6-01","type":"single","pool":"quiz","prompt":"What does pub(crate) mean?","options":["Visible anywhere inside this crate, but not to other crates","Visible to the parent module only","Public to everyone","Visible in tests only"],"answer":[0],"explain":"pub(super) would mean the parent module only."},{"id":"a6-02","type":"single","pool":"quiz","prompt":"What does the version requirement \"1.4\" accept in Cargo?","options":["Any 1.x release at or above 1.4.0","Exactly 1.4.0","Any version","Only 1.4.x"],"answer":[0],"explain":"Cargo uses caret requirements by default."},{"id":"a6-03","type":"single","pool":"quiz","prompt":"Why must Cargo features be additive?","options":["Cargo unifies features across the dependency graph, so enabling one must not break others","Features are compiled in alphabetical order","Only one feature can be enabled at a time","They are not; features can remove code freely"],"answer":[0],"explain":"Two dependencies may each turn on different features of the same crate."},{"id":"a6-04","type":"single","pool":"exam","prompt":"What does a line starting with # do inside a doc test?","options":["It runs but is hidden from the rendered documentation","It is a comment and does not run","It marks the test as ignored","It makes the test fail"],"answer":[0],"explain":"Useful for setup and fn main wrappers."},{"id":"a6-05","type":"multi","pool":"exam","prompt":"Which tools help keep dependencies safe?","options":["cargo audit","cargo tree","cargo deny","cargo fmt"],"answer":[0,1,2],"explain":"cargo fmt only formats code."},{"id":"a6-06","type":"single","pool":"exam","prompt":"Where do test-only dependencies go?","options":["[dev-dependencies]","[dependencies] with test = true","[build-dependencies]","A separate Cargo.toml"],"answer":[0],"explain":"They are not compiled into the normal build."}],"a7":[{"id":"a7-01","type":"single","pool":"quiz","prompt":"When is RwLock a better choice than Mutex?","options":["When reads are far more frequent than writes","When writes are frequent","Always","When the data is a single integer"],"answer":[0],"explain":"For a single integer an atomic is usually better."},{"id":"a7-02","type":"single","pool":"quiz","prompt":"Which ordering is enough for a simple statistics counter?","options":["Relaxed","SeqCst only","Acquire only","None; counters need a Mutex"],"answer":[0],"explain":"Relaxed still makes each increment atomic."},{"id":"a7-03","type":"single","pool":"quiz","prompt":"Why is Condvar::wait called in a while loop?","options":["Wakeups can be spurious, so the condition must be rechecked","wait only works once","To avoid deadlocks with RwLock","It is not; a single call is enough"],"answer":[0],"explain":"The loop rechecks the shared state after every wakeup."},{"id":"a7-04","type":"single","pool":"exam","prompt":"What does compare_exchange(0, id, ...) do?","options":["Writes id only if the current value is 0, atomically, and reports what it found","Always writes id","Swaps two atomics","Waits until the value becomes 0"],"answer":[0],"explain":"Ok means it wrote; Err carries the current value."},{"id":"a7-05","type":"multi","pool":"exam","prompt":"Which are true about rayon's par_iter?","options":["It splits work across a thread pool","The borrow checker still prevents data races","It is always faster than iter","fold plus reduce avoids sharing one locked collection"],"answer":[0,1,3],"explain":"Small workloads can be slower in parallel."},{"id":"a7-06","type":"single","pool":"exam","prompt":"What replaces lazy_static and once_cell for global, lazily initialised values in modern std?","options":["std::sync::LazyLock and OnceLock","static mut","thread_local! only","const fn"],"answer":[0],"explain":"LazyLock was stabilised in Rust 1.80."}],"a8":[{"id":"a8-01","type":"single","pool":"quiz","prompt":"What does JoinSet::join_next return results in?","options":["The order in which tasks finish","The order in which they were spawned","Random order","Reverse spawn order"],"answer":[0],"explain":"That makes it ideal for processing results as soon as they are ready."},{"id":"a8-02","type":"single","pool":"quiz","prompt":"Where should CPU-heavy or blocking code run in a Tokio application?","options":["In tokio::task::spawn_blocking (or a dedicated thread)","Directly inside async functions","In a select! branch","In tokio::spawn with a sleep"],"answer":[0],"explain":"Blocking the async workers stalls every task."},{"id":"a8-03","type":"single","pool":"quiz","prompt":"When is std::sync::Mutex acceptable in async code?","options":["When the guard is never held across an .await","Never","Always","Only on the current-thread runtime"],"answer":[0],"explain":"Otherwise use tokio::sync::Mutex."},{"id":"a8-04","type":"single","pool":"exam","prompt":"What does a Semaphore with 3 permits enforce?","options":["At most three holders at a time","Exactly three tasks in total","Three retries","A three-second timeout"],"answer":[0],"explain":"Permits are returned when dropped."},{"id":"a8-05","type":"single","pool":"exam","prompt":"Which channel suits a shutdown flag that many tasks watch?","options":["tokio::sync::watch","std::sync::mpsc","tokio::sync::oneshot with many receivers","A Vec of bools"],"answer":[0],"explain":"watch broadcasts the latest value to every receiver."},{"id":"a8-06","type":"multi","pool":"exam","prompt":"Which are reasons to add timeouts to a network server?","options":["Idle clients would otherwise hold resources forever","Slow or malicious clients could exhaust connections","Timeouts make the server faster for normal clients","They give predictable failure behaviour"],"answer":[0,1,3],"explain":"Timeouts limit damage; they do not speed up healthy requests."}],"a9":[{"id":"a9-01","type":"single","pool":"quiz","prompt":"Which fragment specifier matches any single token tree?","options":["tt","expr","ident","ty"],"answer":[0],"explain":"tt is the most flexible and is used for munching."},{"id":"a9-02","type":"single","pool":"quiz","prompt":"Why must a procedural macro live in its own crate?","options":["It runs inside the compiler at build time, so it is compiled separately with proc-macro = true","For licensing reasons","Because it uses unsafe code","It does not; it can be in any crate"],"answer":[0],"explain":"The compiler loads proc-macro crates as plugins."},{"id":"a9-03","type":"single","pool":"quiz","prompt":"What does $crate refer to inside an exported macro_rules macro?","options":["The crate where the macro is defined","The crate where it is used","The standard library","The current module"],"answer":[0],"explain":"It keeps paths correct wherever the macro is invoked."},{"id":"a9-04","type":"single","pool":"exam","prompt":"What does macro hygiene prevent?","options":["Variables created inside a macro clashing with the caller's variables","Macros calling other macros","Using macros in tests","Recursion in macros"],"answer":[0],"explain":"Names introduced by the macro live in their own syntax context."},{"id":"a9-05","type":"multi","pool":"exam","prompt":"Which tools help when writing procedural macros?","options":["syn","quote","cargo expand","rustfmt only"],"answer":[0,1,2],"explain":"syn parses, quote generates, cargo expand shows the result."},{"id":"a9-06","type":"single","pool":"exam","prompt":"When is a macro a better choice than a function?","options":["When you need to generate items such as types, impls or tests","When you need to add two numbers","Whenever code repeats twice","When you want better error messages"],"answer":[0],"explain":"Functions give better errors and tooling; macros generate code."}],"a10":[{"id":"a10-01","type":"single","pool":"quiz","prompt":"Why make a component depend on a trait such as Clock instead of the system clock directly?","options":["So tests can inject a fake and control time","Traits are faster than functions","The system clock is not available in Rust","To avoid lifetimes"],"answer":[0],"explain":"Dependency injection makes behaviour deterministic in tests."},{"id":"a10-02","type":"single","pool":"quiz","prompt":"What does proptest do when it finds a failing input?","options":["Shrinks it to a minimal failing case and saves it for future runs","Retries until it passes","Ignores it","Reports only the first random input"],"answer":[0],"explain":"Saved cases live in proptest-regressions/."},{"id":"a10-03","type":"single","pool":"quiz","prompt":"What does #[instrument] from tracing add?","options":["A span recording the function call and its arguments","A benchmark","A breakpoint","A unit test"],"answer":[0],"explain":"Every event inside the function is tagged with the span."},{"id":"a10-04","type":"single","pool":"exam","prompt":"Why use criterion instead of timing once with Instant?","options":["It repeats measurements, warms up and reports statistics","It runs faster code","It works in debug builds only","It is required by cargo"],"answer":[0],"explain":"Single measurements are noisy."},{"id":"a10-05","type":"multi","pool":"exam","prompt":"Which are good properties to test?","options":["decode(encode(x)) == x","A fast function agrees with a simple trusted one","The output of sort is ordered","The function returns 42 for input 7"],"answer":[0,1,2],"explain":"The last is an example test, not a property."},{"id":"a10-06","type":"single","pool":"exam","prompt":"What does a seeded StdRng give a test?","options":["The same random sequence on every run","True randomness","Faster random numbers","Thread safety"],"answer":[0],"explain":"Reproducibility makes failures debuggable."}],"a11":[{"id":"a11-01","type":"single","pool":"quiz","prompt":"What does #[serde(default)] on a field do when the key is missing?","options":["Uses the type's Default value","Returns an error","Uses null","Skips the whole struct"],"answer":[0],"explain":"Use default = \"path\" for a custom function."},{"id":"a11-02","type":"single","pool":"quiz","prompt":"How does clap's derive API turn doc comments into output?","options":["They become the help text for the command and each argument","They are ignored","They become log messages","They are only for rustdoc"],"answer":[0],"explain":"Running --help shows them."},{"id":"a11-03","type":"single","pool":"quiz","prompt":"Why call error_for_status() on a reqwest response?","options":["To turn 4xx and 5xx responses into errors","To retry failed requests","To parse JSON","To set a timeout"],"answer":[0],"explain":"Otherwise a 404 counts as a successful request."},{"id":"a11-04","type":"multi","pool":"exam","prompt":"Which are true about serde?","options":["One derive works with many formats such as JSON and TOML","Unknown fields are ignored unless you deny them","Invalid input causes a panic","Enums can be tagged with #[serde(tag = \"...\")]"],"answer":[0,1,3],"explain":"Invalid input returns a descriptive error."},{"id":"a11-05","type":"single","pool":"exam","prompt":"Why should one reqwest::Client be reused across requests?","options":["It keeps a connection pool, avoiding new TLS handshakes","Clients cannot be created twice","It caches responses forever","It is required for JSON"],"answer":[0],"explain":"Clone it freely; clones share the pool."},{"id":"a11-06","type":"single","pool":"exam","prompt":"What does ExitCode::from(2) from main communicate?","options":["A specific failure code that scripts and CI can test","That the program succeeded","That two errors occurred","Nothing; the code is ignored"],"answer":[0],"explain":"Exit codes are how command-line programs report outcomes."}],"a12":[{"id":"a12-01","type":"single","pool":"quiz","prompt":"What is an extractor in axum?","options":["A handler parameter type that pulls data such as JSON, path or state out of the request","A middleware that compresses responses","A database driver","A macro that generates routes"],"answer":[0],"explain":"Json<T>, Path<T>, Query<T> and State<T> are extractors."},{"id":"a12-02","type":"single","pool":"quiz","prompt":"How do SQL parameters such as ?1 prevent SQL injection?","options":["Values are sent separately from the SQL text, so they cannot change the query","They escape quotes in the string","They encrypt the query","They only allow numbers"],"answer":[0],"explain":"Never build SQL with format!."},{"id":"a12-03","type":"single","pool":"quiz","prompt":"What do CString and CStr handle?","options":["NUL-terminated C strings, owned and borrowed","UTF-16 strings for Windows","Compressed strings","Strings in WebAssembly"],"answer":[0],"explain":"CString owns and adds the NUL; CStr borrows one."},{"id":"a12-04","type":"single","pool":"exam","prompt":"Why does every FFI call need unsafe?","options":["The compiler cannot check the foreign code's promises about pointers and memory","C is always slower","FFI calls allocate memory","It does not; FFI is safe by default"],"answer":[0],"explain":"You take responsibility, ideally inside a small safe wrapper."},{"id":"a12-05","type":"single","pool":"exam","prompt":"What does a rusqlite Transaction do if it is dropped without commit?","options":["Rolls back","Commits automatically","Panics","Leaves the database locked"],"answer":[0],"explain":"RAII makes early returns safe."},{"id":"a12-06","type":"multi","pool":"exam","prompt":"Which are good uses of WebAssembly in the browser?","options":["CPU-heavy parsing or image processing","Games and simulations","Reusing an existing Rust library on the web","Replacing all HTML and CSS"],"answer":[0,1,2],"explain":"WASM complements HTML, CSS and JavaScript rather than replacing them."}],"c1":[{"id":"c1-01","type":"single","pool":"quiz","prompt":"Which tool installs Rust and switches between toolchain versions?","options":["rustup","rustc","cargo","rustfmt"],"answer":[0],"explain":"rustup manages toolchains; rustc compiles and cargo builds projects."},{"id":"c1-02","type":"single","pool":"quiz","prompt":"Why does println! end with an exclamation mark?","options":["It is a macro","It prints in bold","It is unsafe","It flushes the output immediately"],"answer":[0],"explain":"Names that end in ! are macros, which expand into more code at compile time."},{"id":"c1-03","type":"single","pool":"quiz","prompt":"What does cargo check do?","options":["Checks that the code compiles without producing a program","Runs the tests","Formats the code","Checks for newer dependencies"],"answer":[0],"explain":"cargo check skips code generation, so it is the fastest way to find compile errors."},{"id":"c1-04","type":"single","pool":"quiz","prompt":"Where does cargo build --release put the program?","options":["target/release","target/debug","bin/release","the project folder"],"answer":[0],"explain":"Release builds go to target/release; normal builds go to target/debug."},{"id":"c1-05","type":"single","pool":"exam","prompt":"Which file lists a Cargo project's name, version, edition and dependencies?","options":["Cargo.toml","Cargo.lock","src/main.rs","rust-toolchain"],"answer":[0],"explain":"Cargo.toml is the manifest; Cargo.lock records the exact versions that were resolved."},{"id":"c1-06","type":"multi","pool":"exam","prompt":"Which statements about rustc are true?","options":["It produces a program that runs without Rust installed","It needs a Cargo.toml file","It compiles a single .rs file passed on the command line","It downloads dependencies"],"answer":[0,2],"explain":"rustc compiles source files to native programs; downloading dependencies is Cargo's job."},{"id":"c1-07","type":"single","pool":"exam","prompt":"In Rust, where does every program start running?","options":["The main function","The first line of the file","A function called start","The lib.rs file"],"answer":[0],"explain":"The entry point of a binary is fn main."}],"c3":[{"id":"c3-01","type":"single","pool":"quiz","prompt":"What happens when you compile this code?","options":["It fails to compile because x is immutable","x becomes 6","It panics at run time","It creates a second variable called x"],"answer":[0],"explain":"Variables are immutable by default; you need let mut x to change it.","code":"let x = 5;\nx = 6;"},{"id":"c3-02","type":"single","pool":"quiz","prompt":"What does this program print?","options":["11 then 10","11 then 11","6 then 10","It does not compile"],"answer":[0],"explain":"Shadowing inside the block only lasts until the end of that block.","code":"let x = 5;\nlet x = x * 2;\n{\n    let x = x + 1;\n    println!(\"{x}\");\n}\nprintln!(\"{x}\");"},{"id":"c3-03","type":"single","pool":"quiz","prompt":"What is the value of -7 / 2 for i32 values?","options":["-3","-4","-3.5","It does not compile"],"answer":[0],"explain":"Integer division truncates toward zero."},{"id":"c3-04","type":"single","pool":"quiz","prompt":"Why does this function fail to compile?","options":["The semicolon makes the body return () instead of i32","Functions cannot return literals","five needs a parameter","i32 is the wrong type for 5"],"answer":[0],"explain":"With the semicolon the last line is a statement, so nothing is returned.","code":"fn five() -> i32 {\n    5;\n}"},{"id":"c3-05","type":"single","pool":"exam","prompt":"What does this print?","options":["12","9","10","13"],"answer":[0],"explain":"c goes 3, 6, 9, 12, and break c returns 12 from the loop.","code":"let mut c = 0;\nlet r = loop {\n    c += 3;\n    if c > 10 { break c; }\n};\nprintln!(\"{r}\");"},{"id":"c3-06","type":"multi","pool":"exam","prompt":"Which statements are true?","options":["A char is four bytes and holds a Unicode scalar value","The condition of an if can be any integer","An array's length is part of its type","Constants must have a type annotation"],"answer":[0,2,3],"explain":"if conditions must be bool; Rust never treats integers as true or false."},{"id":"c3-07","type":"single","pool":"exam","prompt":"What happens when an index is past the end of an array, as in a[10] for a five-item array?","options":["The program panics","It returns 0","It reads whatever memory comes next","It returns None"],"answer":[0],"explain":"Rust checks the index and panics; use a.get(10) to get an Option instead."},{"id":"c3-08","type":"single","pool":"exam","prompt":"In a debug build, what does 255u8 + 1 do at run time?","options":["Panics with an overflow error","Wraps to 0","Becomes 256","Saturates at 255"],"answer":[0],"explain":"Debug builds panic on overflow; release builds wrap unless you use checked or saturating methods."}],"c4":[{"id":"c4-01","type":"single","pool":"quiz","prompt":"What does this code do?","options":["Fails to compile because s1 was moved","Prints hi","Prints an empty line","Panics at run time"],"answer":[0],"explain":"Assigning a String moves it; s1 can no longer be used.","code":"let s1 = String::from(\"hi\");\nlet s2 = s1;\nprintln!(\"{s1}\");"},{"id":"c4-02","type":"multi","pool":"quiz","prompt":"Which types are Copy?","options":["i32","bool","String","(i32, char)"],"answer":[0,1,3],"explain":"Tuples are Copy when every element is Copy; String owns heap data so it is not."},{"id":"c4-03","type":"single","pool":"quiz","prompt":"Why does this fail to compile?","options":["A shared and a mutable borrow are alive at the same time","You cannot borrow a String twice","b must be declared mut","println! cannot print references"],"answer":[0],"explain":"a is still used after b is created, so the two borrows overlap.","code":"let mut s = String::from(\"x\");\nlet a = &s;\nlet b = &mut s;\nprintln!(\"{a} {b}\");"},{"id":"c4-04","type":"single","pool":"quiz","prompt":"What is the type of a string literal such as \"hello\"?","options":["&'static str","String","&String","char[]"],"answer":[0],"explain":"Literals are string slices baked into the program, valid for the whole run."},{"id":"c4-05","type":"single","pool":"exam","prompt":"Why is fn f(s: &str) usually better than fn f(s: &String)?","options":["It accepts both String values and literals","It is faster to copy","It lets f change the string","It avoids lifetimes"],"answer":[0],"explain":"&String coerces to &str, so a &str parameter accepts more callers."},{"id":"c4-06","type":"single","pool":"exam","prompt":"When is the memory owned by a String freed?","options":["When its owner goes out of scope","When the garbage collector runs","When you call free","At the end of the program"],"answer":[0],"explain":"Rust calls drop when the owner goes out of scope; there is no garbage collector."},{"id":"c4-07","type":"single","pool":"exam","prompt":"What does &nums[1..3] give you for nums = [10, 20, 30, 40]?","options":["[20, 30]","[10, 20, 30]","[20, 30, 40]","[10, 20]"],"answer":[0],"explain":"Ranges include the start and exclude the end."},{"id":"c4-08","type":"single","pool":"exam","prompt":"Why can a function not return a reference to a String it created inside itself?","options":["The String is dropped when the function ends so the reference would dangle","Functions cannot return references","References are always mutable","Strings cannot be borrowed"],"answer":[0],"explain":"The borrow checker refuses dangling references; return the String itself instead."}],"c5":[{"id":"c5-01","type":"single","pool":"quiz","prompt":"What does the shorthand User { email, username, active: true, sign_in_count: 1 } rely on?","options":["Variables named the same as the fields","A Default implementation","The order of fields in the struct","A derive attribute"],"answer":[0],"explain":"Field init shorthand works when a variable has the same name as the field."},{"id":"c5-02","type":"single","pool":"quiz","prompt":"Which attribute lets you print a struct with {:?}?","options":["#[derive(Debug)]","#[derive(Display)]","#[debug]","#[print]"],"answer":[0],"explain":"Debug can be derived; Display has to be written by hand."},{"id":"c5-03","type":"single","pool":"quiz","prompt":"How do you call an associated function named new on a type Point?","options":["Point::new()","Point.new()","new Point()","Point->new()"],"answer":[0],"explain":"Associated functions without self are called with the :: path syntax."},{"id":"c5-04","type":"single","pool":"quiz","prompt":"What does &self mean in a method signature?","options":["The method borrows the instance immutably","The method takes ownership","The method can change the instance","The method is static"],"answer":[0],"explain":"&self is self: &Self, a shared borrow of the instance."},{"id":"c5-05","type":"single","pool":"exam","prompt":"After let u2 = User { email: new_email, ..u1 } where username is a String, what is true?","options":["u1 can no longer be used as a whole because username moved","u1 is unchanged and fully usable","u2 shares memory with u1","It does not compile"],"answer":[0],"explain":"Struct update moves non-Copy fields; you could still use u1.email because it was not moved."},{"id":"c5-06","type":"single","pool":"exam","prompt":"Which method signature lets a method change the struct's fields?","options":["fn grow(&mut self)","fn grow(&self)","fn grow(self: Copy)","fn grow()"],"answer":[0],"explain":"Changing fields requires a mutable borrow."},{"id":"c5-07","type":"single","pool":"exam","prompt":"What does dbg!(x) return?","options":["The value it was given","Nothing","A String with the debug text","A Result"],"answer":[0],"explain":"dbg! prints to stderr and hands the value back, so it fits inside expressions."}],"c6":[{"id":"c6-01","type":"single","pool":"quiz","prompt":"What is wrong with this match?","options":["It is not exhaustive because None is not handled","Some(n) needs a type","match cannot be used on Option","Nothing"],"answer":[0],"explain":"match must cover every possibility, including None.","code":"let x: Option<i32> = Some(3);\nmatch x {\n    Some(n) => println!(\"{n}\"),\n}"},{"id":"c6-02","type":"single","pool":"quiz","prompt":"Why can you not add an Option<i32> to an i32 directly?","options":["They are different types; you must handle None first","Option is always heap allocated","i32 does not implement Add","You need to clone the Option"],"answer":[0],"explain":"The type system forces you to deal with the missing case."},{"id":"c6-03","type":"single","pool":"quiz","prompt":"What does the pattern other match in match roll { 3 => ..., other => ... }?","options":["Any value not matched earlier and binds it to other","Only the value 0","Nothing; it is a syntax error","Only negative numbers"],"answer":[0],"explain":"A variable name as a pattern matches anything and binds it."},{"id":"c6-04","type":"single","pool":"quiz","prompt":"What must the else block of a let...else do?","options":["Diverge, for example with return, break, continue or panic!","Provide a default value","Nothing special","Print an error"],"answer":[0],"explain":"The else branch cannot fall through, because the binding would not exist."},{"id":"c6-05","type":"multi","pool":"exam","prompt":"Which can an enum variant hold?","options":["Nothing","Unnamed fields like a tuple","Named fields like a struct","Another enum"],"answer":[0,1,2,3],"explain":"Variants can be unit-like, tuple-like or struct-like and hold any types."},{"id":"c6-06","type":"single","pool":"exam","prompt":"What does this print?","options":["14","7","none","Some(14)"],"answer":[0],"explain":"The pattern binds n to 7.","code":"let v = Some(7);\nif let Some(n) = v {\n    println!(\"{}\", n * 2);\n} else {\n    println!(\"none\");\n}"},{"id":"c6-07","type":"single","pool":"exam","prompt":"When is if let a better choice than match?","options":["When you only care about one pattern and can ignore the rest","When you need exhaustiveness checking","When matching integers","Never"],"answer":[0],"explain":"if let is shorter but gives up the exhaustiveness check."}],"c7":[{"id":"c7-01","type":"single","pool":"quiz","prompt":"How many library crates can one package contain?","options":["At most one","Any number","Exactly two","None, packages only contain binaries"],"answer":[0],"explain":"A package has at most one library crate but any number of binary crates."},{"id":"c7-02","type":"single","pool":"quiz","prompt":"By default, items in a module are...","options":["Private to the parent module","Public everywhere","Public inside the crate only","Visible only in tests"],"answer":[0],"explain":"Use pub to make an item visible outside its module."},{"id":"c7-03","type":"single","pool":"quiz","prompt":"If a pub struct has a private field, what can code outside the module do?","options":["Use the struct but not construct it with a literal or touch that field","Nothing at all with the struct","Read the private field but not change it","Construct it with a struct literal"],"answer":[0],"explain":"Outside code needs a public constructor to build it."},{"id":"c7-04","type":"single","pool":"quiz","prompt":"What does super refer to in a path?","options":["The parent module","The crate root","The standard library","The current function"],"answer":[0],"explain":"super goes up one level, like .. in a file path."},{"id":"c7-05","type":"single","pool":"exam","prompt":"Where does mod network; in src/main.rs look for the module's code?","options":["src/network.rs or src/network/mod.rs","src/main/network.rs","Only in Cargo.toml","Anywhere in the project"],"answer":[0],"explain":"The compiler looks next to the parent file."},{"id":"c7-06","type":"single","pool":"exam","prompt":"What does pub use do?","options":["Brings a name into scope and re-exports it for others","Makes a module public","Imports a crate from crates.io","Copies code into the current file"],"answer":[0],"explain":"Re-exporting lets callers use a shorter or different path."},{"id":"c7-07","type":"multi","pool":"exam","prompt":"Which are true about enums and structs in a module?","options":["All variants of a pub enum are public","All fields of a pub struct are public","Struct fields are private unless marked pub","Enum variants must each be marked pub"],"answer":[0,2],"explain":"Enums are only useful with public variants, so pub on the enum covers them; struct fields are private by default."}],"c8":[{"id":"c8-01","type":"single","pool":"quiz","prompt":"Why does this not compile?","options":["push needs a mutable borrow while first still borrows v","You cannot index a Vec","vec! creates an immutable vector","push takes two arguments"],"answer":[0],"explain":"Pushing may reallocate, which would invalidate first.","code":"let mut v = vec![1, 2, 3];\nlet first = &v[0];\nv.push(4);\nprintln!(\"{first}\");"},{"id":"c8-02","type":"single","pool":"quiz","prompt":"What does v.get(100) return for a three-element Vec<i32>?","options":["None","A panic","0","Some(0)"],"answer":[0],"explain":"get returns Option; indexing with [] would panic."},{"id":"c8-03","type":"single","pool":"quiz","prompt":"Why can you not write s[0] on a String?","options":["Strings are UTF-8 and a byte position may not be a whole character","Strings are immutable","Indexing is only for arrays of numbers","You can; it returns a char"],"answer":[0],"explain":"Rust makes you choose bytes, chars or a slice explicitly."},{"id":"c8-04","type":"single","pool":"quiz","prompt":"What does *map.entry(k).or_insert(0) += 1; do?","options":["Inserts 0 if k is missing, then adds 1 to the value","Always resets the value to 1","Fails if k is missing","Adds 1 to the key"],"answer":[0],"explain":"or_insert returns a mutable reference to the existing or new value."},{"id":"c8-05","type":"single","pool":"exam","prompt":"What happens to a String key after map.insert(key, 1)?","options":["It is moved into the map","It is copied into the map","The map stores a reference to it","It is dropped"],"answer":[0],"explain":"Owned values move into the map."},{"id":"c8-06","type":"single","pool":"exam","prompt":"What does \"hé\".len() return?","options":["3","2","4","1"],"answer":[0],"explain":"len counts bytes, and é takes two bytes in UTF-8."},{"id":"c8-07","type":"multi","pool":"exam","prompt":"Which correctly combine strings?","options":["format!(\"{a}{b}\")","a + &b where a is a String","&a + &b where both are &str","a.push_str(&b) where a is a mutable String"],"answer":[0,1,3],"explain":"The + operator needs an owned String on the left."}],"c9":[{"id":"c9-01","type":"single","pool":"quiz","prompt":"What does the ? operator do when the Result is Err?","options":["Returns the error from the current function, converting it with From","Panics with the error","Replaces it with a default value","Ignores the error and continues"],"answer":[0],"explain":"? is an early return for errors."},{"id":"c9-02","type":"single","pool":"quiz","prompt":"Where can you use ? on a Result?","options":["In a function whose return type is Result (or another type that supports it)","Anywhere","Only in main","Only inside match arms"],"answer":[0],"explain":"The function must be able to return the error."},{"id":"c9-03","type":"single","pool":"quiz","prompt":"What is the difference between unwrap and expect?","options":["expect lets you give the panic message","expect never panics","unwrap returns an Option","There is none"],"answer":[0],"explain":"Both panic on Err or None; expect adds your message."},{"id":"c9-04","type":"single","pool":"quiz","prompt":"Which is the best fit for Result rather than panic?","options":["A user types a word where a number was expected","An internal index that your own code computed is out of range","A test assertion fails","A hard-coded constant is invalid"],"answer":[0],"explain":"Bad user input is an expected failure."},{"id":"c9-05","type":"single","pool":"exam","prompt":"What type lets main return any kind of error with ??","options":["Result<(), Box<dyn Error>>","Option<()>","Result<(), String>","Box<Error>"],"answer":[0],"explain":"Box<dyn Error> is a trait object that any error type converts into."},{"id":"c9-06","type":"single","pool":"exam","prompt":"What does RUST_BACKTRACE=1 do?","options":["Prints the chain of function calls when a panic happens","Makes panics recoverable","Turns on optimisations","Logs every function call"],"answer":[0],"explain":"It shows a backtrace on panic."},{"id":"c9-07","type":"multi","pool":"exam","prompt":"Which statements about panic = 'abort' in a release profile are true?","options":["The program stops without unwinding","The binary can be smaller","Destructors (Drop) still run during the panic","Panics turn into Result values"],"answer":[0,1],"explain":"Abort skips unwinding, so Drop code does not run during a panic."}],"c10":[{"id":"c10-01","type":"single","pool":"quiz","prompt":"Why does fn largest<T>(list: &[T]) -> &T fail to compile when it uses >?","options":["T has no bound saying its values can be compared","Generic functions cannot return references","Slices cannot be generic","You must write T: Copy"],"answer":[0],"explain":"Add T: PartialOrd so > is allowed."},{"id":"c10-02","type":"single","pool":"quiz","prompt":"What does monomorphisation mean for generic code?","options":["The compiler generates a specific copy for each concrete type used","Generic code is interpreted at run time","Only one type can ever be used","Generics are converted to trait objects"],"answer":[0],"explain":"That is why generics have no run-time cost."},{"id":"c10-03","type":"single","pool":"quiz","prompt":"Which signature is equivalent to fn notify(item: &impl Summary)?","options":["fn notify<T: Summary>(item: &T)","fn notify(item: &dyn Summary)","fn notify(item: Summary)","fn notify<T>(item: &T) where Summary: T"],"answer":[0],"explain":"impl Trait in argument position is sugar for a generic with a bound."},{"id":"c10-04","type":"single","pool":"quiz","prompt":"What does the 'a in fn longest<'a>(x: &'a str, y: &'a str) -> &'a str promise?","options":["The result lives no longer than the shorter-lived input","Both strings live forever","The function extends the inputs' lifetimes","The result is a new String"],"answer":[0],"explain":"Lifetimes describe relationships; they never make anything live longer."},{"id":"c10-05","type":"single","pool":"exam","prompt":"The orphan rule says you can implement a trait for a type only if...","options":["the trait or the type is defined in your crate","both are from the standard library","the type is a struct","the trait has default methods"],"answer":[0],"explain":"This keeps implementations from conflicting across crates."},{"id":"c10-06","type":"multi","pool":"exam","prompt":"Which of these need no lifetime annotations thanks to elision?","options":["fn first(s: &str) -> &str","fn name(&self) -> &str","fn pick(a: &str, b: &str) -> &str","fn len(s: &str) -> usize"],"answer":[0,1,3],"explain":"With two reference inputs and no self, the compiler cannot tell which one the output borrows from."},{"id":"c10-07","type":"single","pool":"exam","prompt":"What is a blanket implementation?","options":["An impl of a trait for every type that satisfies a bound","An impl with only default methods","A trait without methods","An impl that covers all methods of a type"],"answer":[0],"explain":"For example, impl<T: Display> ToString for T."},{"id":"c10-08","type":"single","pool":"exam","prompt":"What lifetime do string literals have?","options":["'static","'a","The lifetime of the enclosing function","None"],"answer":[0],"explain":"They are stored in the program binary."}],"c11":[{"id":"c11-01","type":"single","pool":"quiz","prompt":"Why do assert_eq! arguments need to implement Debug?","options":["So both values can be printed when the assertion fails","So they can be compared","So they can be copied","They do not need it"],"answer":[0],"explain":"The failure message shows left and right using Debug."},{"id":"c11-02","type":"single","pool":"quiz","prompt":"What does #[cfg(test)] on a module do?","options":["Compiles the module only when running tests","Marks every function in it as a test","Runs the module before main","Hides the module from documentation"],"answer":[0],"explain":"The code is left out of normal builds."},{"id":"c11-03","type":"single","pool":"quiz","prompt":"Which command shows println! output from tests that pass?","options":["cargo test -- --show-output","cargo test --verbose","cargo test -- --nocolor","cargo run --tests"],"answer":[0],"explain":"By default output from passing tests is captured."},{"id":"c11-04","type":"single","pool":"quiz","prompt":"Where do integration tests live?","options":["In the tests folder next to src","In src/tests.rs","Inside main.rs","In Cargo.toml"],"answer":[0],"explain":"Each file in tests/ is compiled as its own crate."},{"id":"c11-05","type":"single","pool":"exam","prompt":"Why can integration tests not call private functions?","options":["They are separate crates that only see the public API","Rust forbids testing private code","Private functions are removed in test builds","They can, with use super::*"],"answer":[0],"explain":"Unit tests inside the crate can test private functions instead."},{"id":"c11-06","type":"single","pool":"exam","prompt":"What does should_panic(expected = \"overflow\") check?","options":["That the test panics and the message contains overflow","That the test returns Err(\"overflow\")","That the panic message is exactly overflow","That the test does not panic"],"answer":[0],"explain":"expected matches a substring of the panic message."},{"id":"c11-07","type":"multi","pool":"exam","prompt":"Which are reasons to run tests with --test-threads=1?","options":["Tests write to the same file","Tests bind the same network port","To make tests compile faster","Tests depend on shared global state"],"answer":[0,1,3],"explain":"Running in one thread avoids interference but does not speed up compiling."}],"c13":[{"id":"c13-01","type":"single","pool":"quiz","prompt":"Which closure trait does a closure implement if it moves a captured value out when called?","options":["FnOnce only","Fn","FnMut","All three"],"answer":[0],"explain":"Moving a value out can only happen once."},{"id":"c13-02","type":"single","pool":"quiz","prompt":"What does this print?","options":["Only done","saw 1, saw 2, saw 3, then done","done, then saw 1, saw 2, saw 3","Nothing; it does not compile"],"answer":[0],"explain":"Iterator adaptors are lazy; nothing consumes it.","code":"let v = vec![1, 2, 3];\nlet it = v.iter().map(|x| { println!(\"saw {x}\"); x * 2 });\nprintln!(\"done\");"},{"id":"c13-03","type":"single","pool":"quiz","prompt":"What is the difference between iter() and into_iter() on a Vec?","options":["iter borrows the items; into_iter takes ownership of them","There is no difference","into_iter is faster but unsafe","iter returns a Vec"],"answer":[0],"explain":"into_iter consumes the vector."},{"id":"c13-04","type":"single","pool":"quiz","prompt":"What does the move keyword do on a closure?","options":["Forces the closure to take ownership of the values it captures","Makes the closure run on another thread","Moves the closure into a Box","Prevents the closure from capturing anything"],"answer":[0],"explain":"Ownership is needed when the closure outlives the current scope."},{"id":"c13-05","type":"single","pool":"exam","prompt":"What is the value?","options":["20","30","10","16"],"answer":[0],"explain":"The squares are 1, 4, 9, 16; the even ones are 4 and 16.","code":"(1..=4).map(|x| x * x).filter(|x| x % 2 == 0).sum::<i32>()"},{"id":"c13-06","type":"single","pool":"exam","prompt":"Which do you need to implement to make your type an Iterator?","options":["The associated type Item and the next method","map and filter","IntoIterator only","A for loop"],"answer":[0],"explain":"Every other method has a default built on next."},{"id":"c13-07","type":"multi","pool":"exam","prompt":"Which are consuming adaptors (they use up the iterator)?","options":["sum","collect","map","count"],"answer":[0,1,3],"explain":"map is an iterator adaptor that produces another lazy iterator."}],"c14":[{"id":"c14-01","type":"single","pool":"quiz","prompt":"What does the code inside an Examples block in a /// comment do during cargo test?","options":["It runs as a documentation test","Nothing; it is only documentation","It replaces the unit tests","It is compiled but never run"],"answer":[0],"explain":"Doc tests keep examples correct."},{"id":"c14-02","type":"single","pool":"quiz","prompt":"Which comment style documents the crate or module that contains it?","options":["//!","///","/* */","#!"],"answer":[0],"explain":"//! documents the enclosing item, usually at the top of lib.rs."},{"id":"c14-03","type":"single","pool":"quiz","prompt":"Can you delete a version you published to crates.io?","options":["No; you can only yank it so new projects cannot depend on it","Yes, with cargo delete","Yes, within 24 hours","Only with an admin request"],"answer":[0],"explain":"Publishing is permanent so existing builds never break."},{"id":"c14-04","type":"multi","pool":"exam","prompt":"What do all crates in a workspace share?","options":["One Cargo.lock","One target folder","One version number","One src folder"],"answer":[0,1],"explain":"Each member keeps its own Cargo.toml and version."},{"id":"c14-05","type":"single","pool":"exam","prompt":"How does cargo find a custom command like cargo watch?","options":["It runs a program named cargo-watch found on the PATH","It must be listed in Cargo.toml","It downloads it automatically","Custom commands are not possible"],"answer":[0],"explain":"Any cargo-xyz binary on the PATH becomes cargo xyz."},{"id":"c14-06","type":"single","pool":"exam","prompt":"Which profile does cargo build use by default?","options":["dev","release","test","bench"],"answer":[0],"explain":"Add --release for the release profile."}],"c15":[{"id":"c15-01","type":"single","pool":"quiz","prompt":"Why does enum List { Cons(i32, List), Nil } fail to compile?","options":["It has infinite size; a Box is needed for indirection","Enums cannot contain themselves even with Box","i32 must come last","Nil needs a value"],"answer":[0],"explain":"Box has a known size, which breaks the infinite recursion."},{"id":"c15-02","type":"single","pool":"quiz","prompt":"What does Rc::clone(&a) do?","options":["Increments the reference count and returns another pointer to the same data","Deep-copies the data","Moves a into a new Rc","Creates a weak reference"],"answer":[0],"explain":"It is cheap; no data is copied."},{"id":"c15-03","type":"single","pool":"quiz","prompt":"What happens if you call borrow_mut twice on the same RefCell at the same time?","options":["The program panics at run time","It fails to compile","The second call waits","Both succeed"],"answer":[0],"explain":"RefCell checks the borrowing rules at run time."},{"id":"c15-04","type":"single","pool":"quiz","prompt":"Which one does not keep a value alive?","options":["Weak<T>","Rc<T>","Box<T>","Arc<T>"],"answer":[0],"explain":"Weak must be upgraded and may find the value gone."},{"id":"c15-05","type":"single","pool":"exam","prompt":"Why can you pass &MyBox<String> to a function expecting &str?","options":["Deref coercion applies deref repeatedly to match the type","MyBox implements Into<str>","All references convert to &str","Strings are Copy"],"answer":[0],"explain":"The compiler inserts deref calls at compile time, so it costs nothing."},{"id":"c15-06","type":"multi","pool":"exam","prompt":"Which are true about Rc<T>?","options":["It is for single-threaded use","It allows several owners of one value","It lets you mutate the value directly","The value is dropped when the strong count reaches zero"],"answer":[0,1,3],"explain":"Mutation needs interior mutability such as RefCell."},{"id":"c15-07","type":"single","pool":"exam","prompt":"How do you drop a value before the end of its scope?","options":["std::mem::drop(value)","value.drop()","delete value","value = null"],"answer":[0],"explain":"Calling the Drop method directly is not allowed."}],"c16":[{"id":"c16-01","type":"single","pool":"quiz","prompt":"Why does a closure passed to thread::spawn usually need move?","options":["The thread may outlive the variables it would borrow","Threads cannot read variables at all","move makes the thread start faster","It is required for join to work"],"answer":[0],"explain":"Ownership guarantees the data lives as long as the thread needs it."},{"id":"c16-02","type":"single","pool":"quiz","prompt":"When does iterating over a channel receiver end?","options":["When every sender has been dropped","After the first message","After a timeout","Never"],"answer":[0],"explain":"The channel closes when no senders remain."},{"id":"c16-03","type":"single","pool":"quiz","prompt":"What unlocks a Mutex in Rust?","options":["Dropping the MutexGuard returned by lock","Calling unlock","The end of the program","Calling join on the thread"],"answer":[0],"explain":"The guard unlocks in its Drop implementation."},{"id":"c16-04","type":"single","pool":"quiz","prompt":"Why can you not use Rc<T> with threads?","options":["Its reference count is not updated atomically, so it is not Send","It is too slow","It can only hold integers","Threads cannot hold pointers"],"answer":[0],"explain":"Arc uses atomic operations and is the thread-safe replacement."},{"id":"c16-05","type":"single","pool":"exam","prompt":"What does thread::scope allow that thread::spawn does not?","options":["Threads that borrow local variables without move","Threads that run forever","Threads without join","More than 8 threads"],"answer":[0],"explain":"The scope waits for its threads, so borrows stay valid."},{"id":"c16-06","type":"multi","pool":"exam","prompt":"Which can Rust's type system not prevent?","options":["Deadlocks","Data races","Logic races such as checking then acting in two separate lock scopes","Sending an Rc to another thread"],"answer":[0,2],"explain":"Data races and sending non-Send types are compile errors; deadlocks and logic races are design issues."},{"id":"c16-07","type":"single","pool":"exam","prompt":"What does it mean for a type to be Sync?","options":["A shared reference to it can be used from several threads","It can be sent to another thread","It synchronises its own clocks","It implements Mutex"],"answer":[0],"explain":"T is Sync if &T is Send."}],"c17":[{"id":"c17-01","type":"single","pool":"quiz","prompt":"What happens when you call an async fn without awaiting the result?","options":["Nothing runs; you get a future that does nothing until awaited","It runs in the background","It blocks the thread","It panics"],"answer":[0],"explain":"Rust futures are lazy."},{"id":"c17-02","type":"single","pool":"quiz","prompt":"Why should you not call std::thread::sleep inside an async task?","options":["It blocks the runtime thread and freezes other tasks on it","It does not compile in async code","It sleeps for a random time","It cancels the task"],"answer":[0],"explain":"Use tokio::time::sleep, which yields instead of blocking."},{"id":"c17-03","type":"single","pool":"quiz","prompt":"How long does tokio::join!(wait(100ms), wait(100ms)) take?","options":["About 100 ms","About 200 ms","0 ms","It depends on the number of CPU cores"],"answer":[0],"explain":"The waits overlap within one task."},{"id":"c17-04","type":"single","pool":"quiz","prompt":"What does tokio::select! do with the branches that do not finish first?","options":["Drops them, which cancels them","Lets them keep running in the background","Waits for them too","Restarts them"],"answer":[0],"explain":"Dropping a future cancels it."},{"id":"c17-05","type":"single","pool":"exam","prompt":"What is a stream?","options":["An asynchronous sequence of values, like an iterator whose next is awaited","A file handle","A thread pool","A kind of channel only"],"answer":[0],"explain":"StreamExt gives it iterator-like adaptors."},{"id":"c17-06","type":"multi","pool":"exam","prompt":"Which workloads suit async best?","options":["Many network requests that mostly wait","Thousands of mostly idle connections","Heavy number crunching on every core","Timers and timeouts"],"answer":[0,1,3],"explain":"CPU-bound work belongs on threads."},{"id":"c17-07","type":"single","pool":"exam","prompt":"Why must a future passed to tokio::spawn usually be 'static?","options":["The task may outlive the function that spawned it","Spawned tasks run at compile time","Futures cannot borrow anything ever","It makes them faster"],"answer":[0],"explain":"Use async move to give the task ownership."}],"c18":[{"id":"c18-01","type":"single","pool":"quiz","prompt":"How does Rust share behaviour between types instead of inheritance?","options":["Traits with default methods, plus composition","Base classes","Macros only","It cannot"],"answer":[0],"explain":"Default trait methods give reuse; struct fields give composition."},{"id":"c18-02","type":"single","pool":"quiz","prompt":"What does Vec<Box<dyn Draw>> allow that Vec<T> with T Draw does not?","options":["Holding different types that implement Draw in one vector","Faster method calls","Storing values on the stack","Calling generic methods"],"answer":[0],"explain":"Trait objects erase the concrete type."},{"id":"c18-03","type":"single","pool":"quiz","prompt":"What is the run-time cost of calling a method on a trait object?","options":["A pointer lookup in a vtable, which also prevents inlining","A heap allocation per call","Nothing at all","A thread switch"],"answer":[0],"explain":"This is dynamic dispatch."},{"id":"c18-04","type":"single","pool":"exam","prompt":"Which trait cannot be used as dyn Trait?","options":["One with a method that returns Self","One with a default method","One with a method taking &self","One implemented for String"],"answer":[0],"explain":"The size of Self is unknown behind a trait object."},{"id":"c18-05","type":"single","pool":"exam","prompt":"What is the main benefit of encoding states as separate types?","options":["Invalid transitions become compile errors","It uses less memory","States can be added at run time","It avoids ownership"],"answer":[0],"explain":"Methods simply do not exist on the wrong state."},{"id":"c18-06","type":"single","pool":"exam","prompt":"Why does the state field use Option<Box<dyn State>> with take()?","options":["To move the old state out through a mutable reference and replace it","Because states can be null","To make the struct Copy","To avoid heap allocation"],"answer":[0],"explain":"take leaves None behind temporarily so the old box can be consumed."}],"c19":[{"id":"c19-01","type":"single","pool":"quiz","prompt":"Which of these is a refutable pattern?","options":["Some(x)","x","(a, b)","_"],"answer":[0],"explain":"Some(x) does not match None."},{"id":"c19-02","type":"single","pool":"quiz","prompt":"What does this print?","options":["mid 5","low","high","5"],"answer":[0],"explain":"@ binds the matched value to n.","code":"let x = 5;\nmatch x {\n    1..=4 => println!(\"low\"),\n    n @ 5..=9 => println!(\"mid {n}\"),\n    _ => println!(\"high\"),\n}"},{"id":"c19-03","type":"single","pool":"quiz","prompt":"What does .. do in let (first, .., last) = t;?","options":["Ignores all the values in between","Creates a range","Collects the middle into a tuple","Is a syntax error"],"answer":[0],"explain":".. can appear once in a tuple or struct pattern."},{"id":"c19-04","type":"single","pool":"quiz","prompt":"Why does the compiler not count arms with a match guard toward exhaustiveness?","options":["It cannot know in general whether the guard condition holds","Guards are always false","Guards are evaluated at compile time","It does count them"],"answer":[0],"explain":"You still need an arm without a guard to cover the rest."},{"id":"c19-05","type":"multi","pool":"exam","prompt":"Which places require irrefutable patterns?","options":["let statements (without else)","for loops","function parameters","if let"],"answer":[0,1,2],"explain":"if let exists precisely for refutable patterns."},{"id":"c19-06","type":"single","pool":"exam","prompt":"In match xs { [first, rest @ ..] => ... }, what is rest?","options":["A slice of all the elements after the first","The last element","A Vec copy of the tail","The length of the slice"],"answer":[0],"explain":"rest @ .. binds the remaining elements as a sub-slice."},{"id":"c19-07","type":"single","pool":"exam","prompt":"What does matches!(c, 'a'..='z') return?","options":["A bool saying whether c matches the pattern","The matched char","An Option","A Result"],"answer":[0],"explain":"It is shorthand for a match returning true or false."}],"c20":[{"id":"c20-01","type":"multi","pool":"quiz","prompt":"Which of these does unsafe let you do?","options":["Dereference a raw pointer","Turn off the borrow checker","Call an unsafe function","Access or modify a mutable static variable"],"answer":[0,2,3],"explain":"The borrow checker still runs inside unsafe blocks."},{"id":"c20-02","type":"single","pool":"quiz","prompt":"Why does Iterator use an associated type (type Item) instead of a generic parameter?","options":["A type should implement Iterator only once, with one item type","Associated types are faster","Generic traits cannot have methods","For compatibility with C"],"answer":[0],"explain":"A generic parameter would allow many implementations for one type."},{"id":"c20-03","type":"single","pool":"quiz","prompt":"What is the newtype pattern used for?","options":["Implementing an outside trait on an outside type, or adding type safety","Creating new primitive types","Allocating on the heap","Running code in parallel"],"answer":[0],"explain":"Wrapping in a local tuple struct satisfies the orphan rule."},{"id":"c20-04","type":"single","pool":"quiz","prompt":"What is the type of panic!(\"x\")?","options":["! (the never type)","()","String","Result<(), String>"],"answer":[0],"explain":"It never returns, so it can stand in for any type."},{"id":"c20-05","type":"single","pool":"exam","prompt":"What does $( $x:expr ),* match in a macro_rules pattern?","options":["Zero or more comma-separated expressions","Exactly one expression","One or more identifiers","A block of statements"],"answer":[0],"explain":"* means zero or more; + would mean one or more."},{"id":"c20-06","type":"single","pool":"exam","prompt":"What does the bound T ?Sized allow?","options":["T may be a dynamically sized type such as str or dyn Trait","T must be sized","T can be any size up to 1 KB","T is optional"],"answer":[0],"explain":"Generic parameters are Sized by default."},{"id":"c20-07","type":"single","pool":"exam","prompt":"When should you write a SAFETY comment?","options":["Above every unsafe block, explaining why it is sound","Only in libraries","Never; unsafe is self-explanatory","Only for FFI calls"],"answer":[0],"explain":"Reviewers and clippy rely on it."},{"id":"c20-08","type":"multi","pool":"exam","prompt":"Which are kinds of procedural macro?","options":["Custom derive","Attribute-like","Function-like","macro_rules!"],"answer":[0,1,2],"explain":"macro_rules! defines a declarative macro."}]},"cert":{}};</script>
