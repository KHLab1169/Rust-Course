 n) }\n}\nimpl fmt::Display for Money {\n    fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {\n        let sign = if self.0 < 0 { \"-\" } else { \"\" };\n        write!(f, \"{sign}${}.{:02}\", self.0.abs() / 100, self.0.abs() % 100)\n    }\n}\n\nfn main() {\n    let total = Money(1999) * 3 + Money(500) - Money(97);\n    println!(\"{total}\");\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn arithmetic() {\n        assert_eq!(Money(1999) * 3 + Money(500), Money(6497));\n        assert_eq!((Money(100) - Money(250)).to_string(), \"-$1.50\");\n    }\n}","explain":"Mul<i64> shows why Add has a default type parameter, Rhs = Self, the right-hand side can be a different type. Implementing Money * Money is deliberately left out because multiplying two amounts of money has no meaning."},"20.2b":{"lang":"rust","hints":["trait Report: std::fmt::Display + std::fmt::Debug { fn report(&self) -> String { format!(\"{self} / {self:?}\") } }","Derive Debug and implement Display by hand.","impl Report for TestRun {} is enough because report has a default."],"solution":"use std::fmt;\n\ntrait Report: fmt::Display + fmt::Debug {\n    fn report(&self) -> String {\n        format!(\"{self}\\n  details: {self:?}\")\n    }\n}\n\n#[derive(Debug)]\nstruct TestRun {\n    passed: u32,\n    failed: u32,\n}\n\nimpl fmt::Display for TestRun {\n    fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {\n        let total = self.passed + self.failed;\n        write!(f, \"{}/{} passed ({:.0}%)\", self.passed, total, self.passed as f64 / total as f64 * 100.0)\n    }\n}\n\nimpl Report for TestRun {}\n\nfn main() {\n    println!(\"{}\", TestRun { passed: 47, failed: 3 }.report());\n}","explain":"The supertrait bound lets the default method use {self} and {self:?}, because every implementer is guaranteed to have both. Forgetting Display on TestRun gives a clear compile error pointing at the missing bound."}}},"20.3":{"example":{"title":"Aliases, never, fn pointers and returned closures","lang":"rust","note":"The never type ! is the type of expressions that never produce a value, such as panic!, continue and loop without break, which is why they fit in any match arm. str and dyn Trait have no size known at compile time, so they always live behind a pointer; generic functions assume Sized unless you write ?Sized.","code":"type Thunk = Box<dyn Fn() -> String + Send + 'static>;   // alias for a long type\n\nfn add_one(x: i32) -> i32 { x + 1 }\n\nfn do_twice(f: fn(i32) -> i32, arg: i32) -> i32 { f(arg) + f(arg) }\n\nfn make_adder(n: i32) -> impl Fn(i32) -> i32 { move |x| x + n }\n\nfn make_op(name: &str) -> Box<dyn Fn(i32, i32) -> i32> {\n    match name {\n        \"add\" => Box::new(|a, b| a + b),\n        \"mul\" => Box::new(|a, b| a * b),\n        _ => panic!(\"unknown op {name}\"),   // panic! has the never type !\n    }\n}\n\nfn generic<T: ?Sized + std::fmt::Debug>(t: &T) { println!(\"{t:?}\"); } // accepts str too\n\nfn main() {\n    let t: Thunk = Box::new(|| String::from(\"lazy hello\"));\n    println!(\"{}\", t());\n    println!(\"{}\", do_twice(add_one, 5));\n    let list: Vec<String> = vec![1, 2, 3].iter().map(ToString::to_string).collect();\n    println!(\"{list:?}\");\n    println!(\"{}\", make_adder(10)(5));\n    println!(\"{}\", make_op(\"mul\")(6, 7));\n    generic(\"an unsized str\");\n}","output":"lazy hello\n12\n[\"1\", \"2\", \"3\"]\n15\n42\n\"an unsized str\""},"exercises":{"20.3a":{"lang":"rust","hints":["Closures that capture nothing coerce to fn pointers.","ops.insert(\"+\", |a, b| a + b);","Look up each op with ops.get(op) and handle unknown operators."],"solution":"use std::collections::HashMap;\n\nfn ops() -> HashMap<&'static str, fn(f64, f64) -> f64> {\n    let mut m: HashMap<&'static str, fn(f64, f64) -> f64> = HashMap::new();\n    m.insert(\"+\", |a, b| a + b);\n    m.insert(\"-\", |a, b| a - b);\n    m.insert(\"*\", |a, b| a * b);\n    m.insert(\"/\", |a, b| a / b);\n    m\n}\n\nfn eval(a: f64, op: &str, b: f64) -> Option<f64> {\n    ops().get(op).map(|f| f(a, b))\n}\n\nfn main() {\n    for (a, op, b) in [(6.0, \"*\", 7.0), (1.0, \"/\", 4.0), (2.0, \"^\", 3.0)] {\n        match eval(a, op, b) {\n            Some(r) => println!(\"{a} {op} {b} = {r}\"),\n            None => println!(\"unknown operator {op}\"),\n        }\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn evaluates() {\n        assert_eq!(eval(6.0, \"*\", 7.0), Some(42.0));\n        assert_eq!(eval(1.0, \"%\", 2.0), None);\n    }\n}","explain":"fn pointers are plain addresses, small and Copy, which makes them ideal for dispatch tables. A closure that captured a variable would need Box<dyn Fn> instead."},"20.3b":{"lang":"rust","hints":["The body is move |x| g(f(x)).","Each step can be a closure taking and returning a String.","Compose two at a time, compose(compose(a, b), c)."],"solution":"fn compose<A, B, C>(f: impl Fn(A) -> B, g: impl Fn(B) -> C) -> impl Fn(A) -> C {\n    move |x| g(f(x))\n}\n\nfn main() {\n    let trim = |s: String| s.trim().to_string();\n    let lower = |s: String| s.to_lowercase();\n    let dashes = |s: String| s.split_whitespace().collect::<Vec<_>>().join(\"-\");\n    let slugify = compose(compose(trim, lower), dashes);\n    println!(\"{}\", slugify(\"  Hello Rust World  \".to_string()));\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn composes() {\n        let inc_then_double = compose(|x: i32| x + 1, |x: i32| x * 2);\n        assert_eq!(inc_then_double(3), 8);\n    }\n}","explain":"Returning impl Fn keeps everything statically dispatched, so the composed function is as fast as writing the steps inline. Each call to compose produces a new, unnameable closure type."}}},"20.4":{"example":{"title":"A vec-like macro and a hashmap literal","lang":"rust","note":"Macros run at compile time on code, not values, so they can take any number of arguments and generate items such as functions or impls. $x:expr matches an expression; $( ... ),* repeats for each comma-separated item. Procedural macros are Rust functions in their own crate that receive and return token streams; #[derive(Debug)] and serde's #[derive(Serialize)] are the ones you use most.","code":"macro_rules! my_vec {\n    ( $( $x:expr ),* $(,)? ) => {\n        {\n            let mut temp_vec = Vec::new();\n            $( temp_vec.push($x); )*\n            temp_vec\n        }\n    };\n}\n\nmacro_rules! hashmap {\n    ( $( $k:expr => $v:expr ),* $(,)? ) => {{\n        let mut m = ::std::collections::HashMap::new();\n        $( m.insert($k, $v); )*\n        m\n    }};\n}\n\nfn main() {\n    let v = my_vec![1, 2, 3,];\n    let ages = hashmap! { \"ada\" => 36, \"grace\" => 85 };\n    println!(\"{v:?} {}\", ages[\"grace\"]);\n}","output":"[1, 2, 3] 85"},"exercises":{"20.4a":{"lang":"rust","hints":["One rule for a single expression returns it as is.","A second rule ($x:expr, $($rest:expr),+) compares $x with max!($($rest),+).","Use a let binding inside so each expression is evaluated once."],"solution":"macro_rules! max {\n    ($x:expr) => { $x };\n    ($x:expr, $($rest:expr),+) => {{\n        let a = $x;\n        let b = max!($($rest),+);\n        if a > b { a } else { b }\n    }};\n}\n\nfn main() {\n    println!(\"{} {}\", max!(3), max!(3, 9, 2));\n}\n\n#[cfg(test)]\nmod tests {\n    #[test]\n    fn picks_largest() {\n        assert_eq!(max!(1, 5, 3, 4), 5);\n        assert_eq!(max!(-1), -1);\n        assert_eq!(max!(\"pear\", \"apple\"), \"pear\");\n    }\n}","explain":"The let bindings stop an expression with side effects from being evaluated twice, a classic macro bug. Recursive rules are how many standard macros handle any number of arguments."},"20.4b":{"lang":"rust","hints":["Match ( $name:ident { $( $field:ident : $ty:ty ),* } ).","Emit pub struct $name { $( $field: $ty ),* } and an impl block.","Inside the impl, $( pub fn $field(&self) -> &$ty { &self.$field } )*"],"solution":"macro_rules! getters {\n    ( $name:ident { $( $field:ident : $ty:ty ),* $(,)? } ) => {\n        pub struct $name {\n            $( $field: $ty ),*\n        }\n        impl $name {\n            $(\n                pub fn $field(&self) -> &$ty {\n                    &self.$field\n                }\n            )*\n        }\n    };\n}\n\ngetters!(Config { host: String, port: u16, verbose: bool });\n\nfn main() {\n    let c = Config { host: \"localhost\".into(), port: 8080, verbose: true };\n    println!(\"{}:{} verbose={}\", c.host(), c.port(), c.verbose());\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn getters_work() {\n        let c = Config { host: \"h\".into(), port: 1, verbose: false };\n        assert_eq!(*c.port(), 1);\n        assert_eq!(c.host(), \"h\");\n    }\n}","explain":"Macros that generate items remove repetitive boilerplate, but they also make code harder to read and give worse error messages, so use them when the repetition is real. For this exact job a derive macro from a crate is usually nicer."}}},"21.1":{"example":{"title":"Serving hello.html and a 404 page","lang":"rust","note":"HTTP is plain text over TCP. A response is a status line, headers, a blank line (\\r\\n\\r\\n) and the body; Content-Length tells the browser where the body ends. Port 7878 needs no admin rights. This server handles one connection at a time, which the next lesson shows is a problem.","code":"use std::fs;\nuse std::io::{BufRead, BufReader, Write};\nuse std::net::{TcpListener, TcpStream};\n\nfn main() {\n    let listener = TcpListener::bind(\"127.0.0.1:7878\").unwrap();\n    for stream in listener.incoming() {\n        handle_connection(stream.unwrap());\n    }\n}\n\nfn handle_connection(mut stream: TcpStream) {\n    let buf_reader = BufReader::new(&stream);\n    let request_line = buf_reader.lines().next().unwrap().unwrap();\n\n    let (status_line, filename) = if request_line == \"GET / HTTP/1.1\" {\n        (\"HTTP/1.1 200 OK\", \"hello.html\")\n    } else {\n        (\"HTTP/1.1 404 NOT FOUND\", \"404.html\")\n    };\n    let contents = fs::read_to_string(filename).unwrap_or_else(|_| String::from(\"<h1>missing page file<\/h1>\"));\n    let length = contents.len();\n    let response = format!(\"{status_line}\\r\\nContent-Length: {length}\\r\\n\\r\\n{contents}\");\n    stream.write_all(response.as_bytes()).unwrap();\n}","output":""},"exercises":{"21.1a":{"lang":"rust","hints":["The HTML files go in the project folder, next to Cargo.toml.","Add println!(\"Request: {request_line}\"); in handle_connection.","Browsers also request /favicon.ico, so you will see extra lines."],"solution":"use std::fs;\nuse std::io::{BufRead, BufReader, Write};\nuse std::net::{TcpListener, TcpStream};\n\nfn main() {\n    let listener = TcpListener::bind(\"127.0.0.1:7878\").unwrap();\n    println!(\"Listening on http://127.0.0.1:7878\");\n    for stream in listener.incoming() {\n        handle_connection(stream.unwrap());\n    }\n}\n\nfn handle_connection(mut stream: TcpStream) {\n    let request_line = match BufReader::new(&stream).lines().next() {\n        Some(Ok(line)) => line,\n        _ => return, // the browser closed the connection early\n    };\n    println!(\"Request: {request_line}\");\n    let (status, file) = if request_line == \"GET / HTTP/1.1\" {\n        (\"HTTP/1.1 200 OK\", \"hello.html\")\n    } else {\n        (\"HTTP/1.1 404 NOT FOUND\", \"404.html\")\n    };\n    let body = fs::read_to_string(file).unwrap_or_else(|_| format!(\"<h1>{file} not found on disk<\/h1>\"));\n    let response = format!(\"{status}\\r\\nContent-Length: {}\\r\\n\\r\\n{body}\", body.len());\n    let _ = stream.write_all(response.as_bytes());\n}","explain":"Returning early instead of unwrapping the request line keeps the server alive when a browser opens a connection and closes it without sending anything, which happens more than you would think."},"21.1b":{"lang":"rust","hints":["Match on the request line with a match on string slices.","Return the content type as part of the tuple and add a Content-Type header line.","Each header ends with \\r\\n, and the headers end with one extra \\r\\n."],"solution":"use std::io::{BufRead, BufReader, Write};\nuse std::net::{TcpListener, TcpStream};\n\nfn respond(request_line: &str) -> (&'static str, &'static str, String) {\n    match request_line {\n        \"GET / HTTP/1.1\" => (\"200 OK\", \"text/html\", \"<h1>Hello!<\/h1>\".to_string()),\n        \"GET /health HTTP/1.1\" => (\"200 OK\", \"application/json\", r#\"{\"status\":\"ok\"}\"#.to_string()),\n        _ => (\"404 NOT FOUND\", \"text/html\", \"<h1>Not found<\/h1>\".to_string()),\n    }\n}\n\nfn handle_connection(mut stream: TcpStream) {\n    let Some(Ok(line)) = BufReader::new(&stream).lines().next() else { return };\n    let (status, ctype, body) = respond(&line);\n    let response = format!(\n        \"HTTP/1.1 {status}\\r\\nContent-Type: {ctype}\\r\\nContent-Length: {}\\r\\n\\r\\n{body}\",\n        body.len()\n    );\n    let _ = stream.write_all(response.as_bytes());\n}\n\nfn main() {\n    let listener = TcpListener::bind(\"127.0.0.1:7878\").unwrap();\n    for stream in listener.incoming().flatten() {\n        handle_connection(stream);\n    }\n}\n// $ curl -i http://127.0.0.1:7878/health\n// HTTP/1.1 200 OK\n// Content-Type: application/json\n// Content-Length: 15\n//\n// {\"status\":\"ok\"}","explain":"Pulling the routing into a pure respond function means you can unit test it without opening sockets. Health endpoints like this are what load balancers and uptime monitors call."}}},"21.2":{"example":{"title":"The ThreadPool","lang":"rust","note":"The workers share one receiver, so it sits in Arc<Mutex<...>>, and whichever worker locks it first takes the next job. Calling recv inside a let statement drops the lock guard before the job runs, so other workers are not blocked while it executes; writing while let Ok(job) = receiver.lock().unwrap().recv() would hold the lock for the whole job.","code":"use std::sync::{mpsc, Arc, Mutex};\nuse std::thread;\n\ntype Job = Box<dyn FnOnce() + Send + 'static>;\n\npub struct ThreadPool {\n    workers: Vec<Worker>,\n    sender: mpsc::Sender<Job>,\n}\n\nimpl ThreadPool {\n    /// Create a new ThreadPool with `size` threads.\n    ///\n    /// # Panics\n    /// Panics if `size` is zero.\n    pub fn new(size: usize) -> ThreadPool {\n        assert!(size > 0);\n        let (sender, receiver) = mpsc::channel();\n        let receiver = Arc::new(Mutex::new(receiver));\n        let workers = (0..size).map(|id| Worker::new(id, Arc::clone(&receiver))).collect();\n        ThreadPool { workers, sender }\n    }\n\n    pub fn execute<F>(&self, f: F)\n    where\n        F: FnOnce() + Send + 'static,\n    {\n        self.sender.send(Box::new(f)).unwrap();\n    }\n\n    pub fn size(&self) -> usize { self.workers.len() }\n}\n\nstruct Worker {\n    _id: usize,\n    _thread: thread::JoinHandle<()>,\n}\n\nimpl Worker {\n    fn new(id: usize, receiver: Arc<Mutex<mpsc::Receiver<Job>>>) -> Worker {\n        let thread = thread::spawn(move || loop {\n            let message = receiver.lock().unwrap().recv(); // lock released at end of statement\n            match message {\n                Ok(job) => job(),\n                Err(_) => break, // channel closed\n            }\n        });\n        Worker { _id: id, _thread: thread }\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn runs_jobs_on_workers() {\n        let pool = ThreadPool::new(4);\n        let (tx, rx) = mpsc::channel();\n        for i in 0..8 {\n            let tx = tx.clone();\n            pool.execute(move || tx.send(i * i).unwrap());\n        }\n        drop(tx);\n        let mut got: Vec<i32> = rx.iter().collect();\n        got.sort();\n        assert_eq!(got, vec![0, 1, 4, 9, 16, 25, 36, 49]);\n        assert_eq!(pool.size(), 4);\n    }\n}","output":""},"exercises":{"21.2a":{"lang":"text","hints":["Add a match arm: \"GET /sleep HTTP/1.1\" => { thread::sleep(Duration::from_secs(5)); (\"HTTP/1.1 200 OK\", \"hello.html\") }","Put ThreadPool in src/lib.rs and use hello::ThreadPool; in main.rs.","The closure needs to own the stream, which happens automatically because handle_connection takes it by value."],"solution":"// src/main.rs\nuse hello::ThreadPool;\nuse std::net::TcpListener;\n\nfn main() {\n    let listener = TcpListener::bind(\"127.0.0.1:7878\").unwrap();\n    let pool = ThreadPool::new(4);\n    for stream in listener.incoming() {\n        let stream = stream.unwrap();\n        pool.execute(|| {\n            handle_connection(stream);\n        });\n    }\n}\n\n// In handle_connection's routing:\n// \"GET /sleep HTTP/1.1\" => {\n//     thread::sleep(Duration::from_secs(5));\n//     (\"HTTP/1.1 200 OK\", \"hello.html\")\n// }","explain":"With four workers, up to four slow requests can run before anyone has to wait. A fixed-size pool protects the server from creating unlimited threads under heavy load, the same reason load testers cap their concurrency."},"21.2b":{"lang":"rust","hints":["In each thread: TcpStream::connect(\"127.0.0.1:7878\"), write \"GET / HTTP/1.1\\r\\n\\r\\n\", then read_to_string.","Time each request with Instant::now() and send the duration back through a channel.","Take the maximum of the collected durations."],"solution":"use std::io::{Read, Write};\nuse std::net::TcpStream;\nuse std::sync::mpsc;\nuse std::thread;\nuse std::time::{Duration, Instant};\n\nfn one_request() -> std::io::Result<Duration> {\n    let start = Instant::now();\n    let mut s = TcpStream::connect(\"127.0.0.1:7878\")?;\n    s.write_all(b\"GET / HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n\")?;\n    let mut body = String::new();\n    s.read_to_string(&mut body)?;\n    Ok(start.elapsed())\n}\n\nfn main() {\n    let (tx, rx) = mpsc::channel();\n    for _ in 0..20 {\n        let tx = tx.clone();\n        thread::spawn(move || {\n            let _ = tx.send(one_request());\n        });\n    }\n    drop(tx);\n    let times: Vec<Duration> = rx.iter().filter_map(Result::ok).collect();\n    let slowest = times.iter().max().copied().unwrap_or_default();\n    println!(\"{} ok, slowest {:?}\", times.len(), slowest);\n}","explain":"With one worker busy on /sleep, every request waits about five seconds; with four, most return in milliseconds. You have just built a tiny load-testing tool, and Track 3 turns this idea into a full portfolio project."}}},"21.3":{"example":{"title":"Drop for ThreadPool","lang":"rust","note":"Dropping the sender first is essential; otherwise the workers block in recv forever and join never returns. drain(..) moves each Worker out of the Vec so its JoinHandle can be consumed by join. In main, listener.incoming().take(2) stops after two requests so you can watch the shutdown messages.","code":"use std::sync::{mpsc, Arc, Mutex};\nuse std::thread;\n\ntype Job = Box<dyn FnOnce() + Send + 'static>;\n\npub struct ThreadPool {\n    workers: Vec<Worker>,\n    sender: Option<mpsc::Sender<Job>>,\n}\n\nimpl ThreadPool {\n    pub fn new(size: usize) -> ThreadPool {\n        assert!(size > 0);\n        let (sender, receiver) = mpsc::channel();\n        let receiver = Arc::new(Mutex::new(receiver));\n        let workers = (0..size).map(|id| Worker::new(id, Arc::clone(&receiver))).collect();\n        ThreadPool { workers, sender: Some(sender) }\n    }\n    pub fn execute<F: FnOnce() + Send + 'static>(&self, f: F) {\n        self.sender.as_ref().unwrap().send(Box::new(f)).unwrap();\n    }\n}\n\nimpl Drop for ThreadPool {\n    fn drop(&mut self) {\n        drop(self.sender.take()); // close the channel: workers' recv returns Err\n        for worker in self.workers.drain(..) {\n            println!(\"Shutting down worker {}\", worker.id);\n            worker.thread.join().unwrap();\n        }\n    }\n}\n\nstruct Worker {\n    id: usize,\n    thread: thread::JoinHandle<()>,\n}\n\nimpl Worker {\n    fn new(id: usize, receiver: Arc<Mutex<mpsc::Receiver<Job>>>) -> Worker {\n        let thread = thread::spawn(move || loop {\n            let message = receiver.lock().unwrap().recv();\n            match message {\n                Ok(job) => job(),\n                Err(_) => {\n                    println!(\"Worker {id} disconnected; shutting down.\");\n                    break;\n                }\n            }\n        });\n        Worker { id, thread }\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use std::sync::atomic::{AtomicUsize, Ordering};\n\n    #[test]\n    fn drop_waits_for_all_jobs() {\n        let done = Arc::new(AtomicUsize::new(0));\n        {\n            let pool = ThreadPool::new(3);\n            for _ in 0..10 {\n                let done = Arc::clone(&done);\n                pool.execute(move || {\n                    thread::sleep(std::time::Duration::from_millis(5));\n                    done.fetch_add(1, Ordering::SeqCst);\n                });\n            }\n        } // pool dropped here: waits for queued jobs, then joins\n        assert_eq!(done.load(Ordering::SeqCst), 10);\n    }\n}","output":""},"exercises":{"21.3a":{"lang":"text","hints":["let limit: usize = std::env::args().nth(1).and_then(|s| s.parse().ok()).unwrap_or(usize::MAX);","listener.incoming().take(limit) ends the loop after limit connections.","The pool's Drop runs at the end of main and joins the workers."],"solution":"use hello::ThreadPool;\nuse std::net::TcpListener;\n\nfn main() {\n    let limit: usize = std::env::args().nth(1).and_then(|s| s.parse().ok()).unwrap_or(usize::MAX);\n    let listener = TcpListener::bind(\"127.0.0.1:7878\").unwrap();\n    let pool = ThreadPool::new(4);\n    let mut served = 0;\n    for stream in listener.incoming().take(limit) {\n        let stream = stream.unwrap();\n        served += 1;\n        pool.execute(|| handle_connection(stream));\n    }\n    println!(\"Served {served} connections. Shutting down.\");\n} // pool dropped here: every worker finishes and is joined","explain":"Because cleanup lives in Drop, any way out of main (the loop ending, an early return, even a panic that unwinds) still shuts the workers down properly."},"21.3b":{"lang":"rust","hints":["#[derive(Debug)] pub struct PoolCreationError(String);","impl std::fmt::Display for PoolCreationError and an empty impl std::error::Error for PoolCreationError {}.","Return Err for size 0, otherwise Ok(the pool)."],"solution":"use std::fmt;\nuse std::sync::{mpsc, Arc, Mutex};\nuse std::thread;\n\ntype Job = Box<dyn FnOnce() + Send + 'static>;\n\n#[derive(Debug)]\npub struct PoolCreationError(String);\n\nimpl fmt::Display for PoolCreationError {\n    fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {\n        write!(f, \"cannot create thread pool: {}\", self.0)\n    }\n}\nimpl std::error::Error for PoolCreationError {}\n\npub struct ThreadPool {\n    _workers: Vec<thread::JoinHandle<()>>,\n    sender: mpsc::Sender<Job>,\n}\n\nimpl ThreadPool {\n    pub fn build(size: usize) -> Result<ThreadPool, PoolCreationError> {\n        if size == 0 {\n            return Err(PoolCreationError(\"size must be at least 1\".into()));\n        }\n        let (sender, receiver) = mpsc::channel::<Job>();\n        let receiver = Arc::new(Mutex::new(receiver));\n        let workers = (0..size)\n            .map(|_| {\n                let rx = Arc::clone(&receiver);\n                thread::spawn(move || loop {\n                    let msg = rx.lock().unwrap().recv();\n                    match msg {\n                        Ok(job) => job(),\n                        Err(_) => break,\n                    }\n                })\n            })\n            .collect();\n        Ok(ThreadPool { _workers: workers, sender })\n    }\n    pub fn execute<F: FnOnce() + Send + 'static>(&self, f: F) {\n        self.sender.send(Box::new(f)).unwrap();\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn zero_is_an_error() {\n        let err = ThreadPool::build(0).err().unwrap();\n        assert!(err.to_string().contains(\"at least 1\"));\n    }\n    #[test]\n    fn builds() {\n        let pool = ThreadPool::build(2).unwrap();\n        let (tx, rx) = mpsc::channel();\n        pool.execute(move || tx.send(7).unwrap());\n        assert_eq!(rx.recv().unwrap(), 7);\n    }\n}","explain":"The book suggests exactly this improvement. A library should let the caller decide what to do about a bad configuration value, and implementing std::error::Error lets the error work with ? and Box<dyn Error>."}}},"Q1.1":{"example":{"title":"The design in types","lang":"rust","note":"Separating \"doing a request\" (Target) from \"running a plan\" and \"summarising outcomes\" means the scheduler and the statistics can be tested with a fake target that returns chosen latencies. Only one small adapter touches the real network.","code":"use std::time::Duration;\n\n/// One finished request.\n#[derive(Debug, Clone)]\npub enum Outcome {\n    Response { status: u16, latency: Duration },\n    Error { kind: String, latency: Duration },\n}\n\n/// What the user asked for.\n#[derive(Debug)]\npub struct Plan {\n    pub url: String,\n    pub requests: usize,\n    pub concurrency: usize,\n    pub timeout: Duration,\n}\n\n/// Anything that can perform one request: real HTTP in the app, a fake in tests.\npub trait Target {\n    fn hit(&self) -> impl std::future::Future<Output = Outcome> + Send;\n}\n\nfn main() {\n    let plan = Plan { url: \"http://localhost:3000/health\".into(), requests: 1000, concurrency: 50, timeout: Duration::from_secs(5) };\n    println!(\"{plan:?}\");\n    let sample = Outcome::Response { status: 200, latency: Duration::from_millis(12) };\n    println!(\"{sample:?}\");\n}","output":"Plan { url: \"http://localhost:3000/health\", requests: 1000, concurrency: 50, timeout: 5s }\nResponse { status: 200, latency: 12ms }"},"exercises":{"Q1.1a":{"lang":"text","hints":["Show the exact command a user types and the exact report they see.","Define p50, p95 and p99 in plain words.","State the defaults for requests, concurrency and timeout."],"solution":"# loadtest\nFire concurrent HTTP requests at an endpoint and report latency and errors.\n\n## Example\n    $ loadtest http://localhost:3000/health -n 1000 -c 50\n    Requests:     1000 (998 ok, 2 errors)   Duration: 2.41 s   Throughput: 415 req/s\n    Latency:      p50 21 ms   p95 48 ms   p99 97 ms   max 140 ms\n    Status codes: 200 x 998\n    Errors:       timeout x 2\n\n## Flags\n    -n, --requests     total requests (default 100)\n    -c, --concurrency  requests in flight at once (default 10)\n    -t, --timeout      per-request timeout in seconds (default 10)\n        --json         print the report as JSON\n\n## How results are calculated\np95 means 95% of requests were faster than this value. Percentiles\nare computed from every recorded latency; errors count toward the\nerror rate but not toward latency percentiles.","explain":"README-driven development forces you to decide what the user sees before implementation details pull you elsewhere. It also gives you your acceptance tests for free."},"Q1.1b":{"lang":"text","hints":["Think about zero requests, all errors, a single request, and identical latencies.","For scheduling, what proves the concurrency limit is respected?","For the CLI, cover defaults, invalid numbers and a missing URL."],"solution":"Statistics\n  - percentiles of 1..=100 ms give p50 = 50, p95 = 95, p99 = 99\n  - a single sample is every percentile\n  - all errors: error rate 100%, no latency percentiles (None)\n  - status code counts group correctly (200 x 3, 503 x 1)\nScheduling\n  - exactly N outcomes for N requests\n  - peak in-flight requests never exceeds the concurrency limit\n  - concurrency larger than requests still works\n  - total time is close to (N / c) x latency with a fake target\nCLI\n  - defaults apply when only the URL is given\n  - -c 0 is rejected with a clear message\n  - a non-number for -n is rejected\n  - a missing URL prints usage","explain":"Writing the test list first is classic QA practice, and in Rust each line becomes a #[test] quickly. It also exposes design questions early, such as how to report percentiles when every request failed."}}},"Q1.2":{"example":{"title":"The summary statistics","lang":"rust","note":"The nearest-rank percentile method used here is simple and easy to explain in the README. For millions of samples, the hdrhistogram crate records latencies in fixed memory with configurable precision.","code":"use std::collections::BTreeMap;\nuse std::time::Duration;\n\n#[derive(Debug, Clone)]\npub enum Outcome {\n    Response { status: u16, latency: Duration },\n    Error { kind: String, latency: Duration },\n}\n\n#[derive(Debug, PartialEq)]\npub struct Summary {\n    pub total: usize,\n    pub errors: usize,\n    pub p50: Option<Duration>,\n    pub p95: Option<Duration>,\n    pub p99: Option<Duration>,\n    pub statuses: BTreeMap<u16, usize>,\n}\n\nfn percentile(sorted: &[Duration], p: f64) -> Option<Duration> {\n    if sorted.is_empty() { return None; }\n    let rank = ((p / 100.0) * sorted.len() as f64).ceil() as usize;\n    Some(sorted[rank.clamp(1, sorted.len()) - 1])\n}\n\npub fn summarize(outcomes: &[Outcome]) -> Summary {\n    let mut lat = Vec::new();\n    let mut statuses = BTreeMap::new();\n    let mut errors = 0;\n    for o in outcomes {\n        match o {\n            Outcome::Response { status, latency } => {\n                lat.push(*latency);\n                *statuses.entry(*status).or_insert(0) += 1;\n            }\n            Outcome::Error { .. } => errors += 1,\n        }\n    }\n    lat.sort();\n    Summary { total: outcomes.len(), errors, p50: percentile(&lat, 50.0), p95: percentile(&lat, 95.0), p99: percentile(&lat, 99.0), statuses }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    fn ok(ms: u64) -> Outcome { Outcome::Response { status: 200, latency: Duration::from_millis(ms) } }\n\n    #[test]\n    fn percentiles_of_1_to_100() {\n        let outs: Vec<_> = (1..=100).map(ok).collect();\n        let s = summarize(&outs);\n        assert_eq!(s.p50, Some(Duration::from_millis(50)));\n        assert_eq!(s.p95, Some(Duration::from_millis(95)));\n        assert_eq!(s.p99, Some(Duration::from_millis(99)));\n    }\n\n    #[test]\n    fn all_errors() {\n        let outs = vec![Outcome::Error { kind: \"timeout\".into(), latency: Duration::from_secs(5) }];\n        let s = summarize(&outs);\n        assert_eq!((s.errors, s.p50), (1, None));\n    }\n}","output":""},"exercises":{"Q1.2a":{"lang":"rust","hints":["stream::iter(0..requests).map(|_| target.hit()).buffer_unordered(concurrency).collect().await","The fake keeps two AtomicUsize values, current and peak.","Assert outcomes.len() == requests and peak <= concurrency."],"solution":"use futures::stream::{self, StreamExt};\nuse std::future::Future;\nuse std::sync::atomic::{AtomicUsize, Ordering};\nuse std::time::{Duration, Instant};\n\n#[derive(Debug, Clone)]\npub enum Outcome {\n    Response { status: u16, latency: Duration },\n    Error { kind: String, latency: Duration },\n}\n\npub trait Target {\n    fn hit(&self) -> impl Future<Output = Outcome> + Send;\n}\n\npub async fn run<T: Target + Sync>(target: &T, requests: usize, concurrency: usize) -> Vec<Outcome> {\n    stream::iter(0..requests)\n        .map(|_| target.hit())\n        .buffer_unordered(concurrency.max(1))\n        .collect()\n        .await\n}\n\nstruct FakeTarget { current: AtomicUsize, peak: AtomicUsize }\n\nimpl Target for FakeTarget {\n    fn hit(&self) -> impl Future<Output = Outcome> + Send {\n        async move {\n            let start = Instant::now();\n            let now = self.current.fetch_add(1, Ordering::SeqCst) + 1;\n            self.peak.fetch_max(now, Ordering::SeqCst);\n            tokio::time::sleep(Duration::from_millis(10)).await;\n            self.current.fetch_sub(1, Ordering::SeqCst);\n            Outcome::Response { status: 200, latency: start.elapsed() }\n        }\n    }\n}\n\n#[tokio::main]\nasync fn main() {\n    let t = FakeTarget { current: AtomicUsize::new(0), peak: AtomicUsize::new(0) };\n    let start = Instant::now();\n    let outs = run(&t, 100, 10).await;\n    println!(\"{} outcomes in {:?}, peak {}\", outs.len(), start.elapsed(), t.peak.load(Ordering::SeqCst));\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[tokio::test]\n    async fn respects_concurrency() {\n        let t = FakeTarget { current: AtomicUsize::new(0), peak: AtomicUsize::new(0) };\n        let outs = run(&t, 50, 5).await;\n        assert_eq!(outs.len(), 50);\n        assert!(t.peak.load(Ordering::SeqCst) <= 5);\n    }\n}","explain":"buffer_unordered is exactly the closed-loop model many load testers use, a fixed number of virtual users each issuing the next request as soon as the last finishes. The fake target proves the limit without any network, so the test is fast and never flaky."},"Q1.2b":{"lang":"rust","hints":["Time each request with Instant::now() before send and elapsed() after.","reqwest::Error has is_timeout() and is_connect().","Build the client once with a timeout and reuse it."],"solution":"use std::future::Future;\nuse std::time::{Duration, Instant};\n\n#[derive(Debug, Clone)]\npub enum Outcome {\n    Response { status: u16, latency: Duration },\n    Error { kind: String, latency: Duration },\n}\n\npub trait Target {\n    fn hit(&self) -> impl Future<Output = Outcome> + Send;\n}\n\npub struct HttpTarget {\n    client: reqwest::Client,\n    url: String,\n}\n\nimpl HttpTarget {\n    pub fn new(url: &str, timeout: Duration) -> reqwest::Result<Self> {\n        let client = reqwest::Client::builder().timeout(timeout).build()?;\n        Ok(HttpTarget { client, url: url.to_string() })\n    }\n}\n\nimpl Target for HttpTarget {\n    fn hit(&self) -> impl Future<Output = Outcome> + Send {\n        async move {\n            let start = Instant::now();\n            match self.client.get(&self.url).send().await {\n                Ok(resp) => Outcome::Response { status: resp.status().as_u16(), latency: start.elapsed() },\n                Err(e) => {\n                    let kind = if e.is_timeout() { \"timeout\" } else if e.is_connect() { \"connect\" } else { \"other\" };\n                    Outcome::Error { kind: kind.into(), latency: start.elapsed() }\n                }\n            }\n        }\n    }\n}\n\n#[tokio::main]\nasync fn main() {\n    let t = HttpTarget::new(\"http://127.0.0.1:9/\", Duration::from_secs(2)).unwrap();\n    println!(\"{:?}\", t.hit().await); // nothing listens on port 9: a connect error\n}","explain":"The response body is not read here, which keeps memory flat; add an option to read and discard bodies if you need full transfer times. Classifying errors makes the report actionable, since timeouts and refused connections point at very different problems."}}},"Q1.3":{"example":{"title":"A CI workflow for any Rust project","lang":"yaml","note":"Running on three operating systems catches path and line-ending bugs early. rust-cache keeps CI fast by reusing compiled dependencies. The same workflow works for every project in this track.","code":"# .github/workflows/ci.yml\nname: CI\non: [push, pull_request]\njobs:\n  test:\n    runs-on: ${{ matrix.os }}\n    strategy:\n      matrix:\n        os: [ubuntu-latest, windows-latest, macos-latest]\n    steps:\n      - uses: actions/checkout@v4\n      - uses: dtolnay/rust-toolchain@stable\n        with:\n          components: rustfmt, clippy\n      - uses: Swatinem/rust-cache@v2\n      - run: cargo fmt --check\n      - run: cargo clippy --all-targets -- -D warnings\n      - run: cargo test --all-features","output":""},"exercises":{"Q1.3a":{"lang":"rust","hints":["Throughput is total / elapsed.as_secs_f64().","Format durations as whole milliseconds with as_millis().","Derive Serialize on a separate JsonReport struct with plain numbers, so the JSON format is stable."],"solution":"use serde::Serialize;\nuse std::collections::BTreeMap;\nuse std::time::Duration;\n\npub struct Summary {\n    pub total: usize,\n    pub errors: usize,\n    pub p50: Option<Duration>,\n    pub p95: Option<Duration>,\n    pub p99: Option<Duration>,\n    pub statuses: BTreeMap<u16, usize>,\n}\n\nfn ms(d: Option<Duration>) -> String {\n    d.map(|d| format!(\"{} ms\", d.as_millis())).unwrap_or_else(|| \"n/a\".into())\n}\n\npub fn render(s: &Summary, elapsed: Duration) -> String {\n    let rps = s.total as f64 / elapsed.as_secs_f64().max(1e-9);\n    let codes: Vec<String> = s.statuses.iter().map(|(c, n)| format!(\"{c} x {n}\")).collect();\n    format!(\n        \"Requests:     {} ({} ok, {} errors)   Duration: {:.2} s   Throughput: {:.0} req/s\\nLatency:      p50 {}   p95 {}   p99 {}\\nStatus codes: {}\",\n        s.total, s.total - s.errors, s.errors, elapsed.as_secs_f64(), rps, ms(s.p50), ms(s.p95), ms(s.p99), codes.join(\", \")\n    )\n}\n\n#[derive(Serialize)]\nstruct JsonReport { total: usize, errors: usize, p50_ms: Option<u128>, p95_ms: Option<u128>, p99_ms: Option<u128>, statuses: BTreeMap<u16, usize> }\n\npub fn render_json(s: &Summary) -> String {\n    let r = JsonReport {\n        total: s.total,\n        errors: s.errors,\n        p50_ms: s.p50.map(|d| d.as_millis()),\n        p95_ms: s.p95.map(|d| d.as_millis()),\n        p99_ms: s.p99.map(|d| d.as_millis()),\n        statuses: s.statuses.clone(),\n    };\n    serde_json::to_string_pretty(&r).unwrap()\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn human_report() {\n        let s = Summary { total: 4, errors: 1, p50: Some(Duration::from_millis(20)), p95: Some(Duration::from_millis(40)), p99: Some(Duration::from_millis(40)), statuses: BTreeMap::from([(200, 3)]) };\n        let out = render(&s, Duration::from_secs(2));\n        assert!(out.contains(\"4 (3 ok, 1 errors)\"));\n        assert!(out.contains(\"Throughput: 2 req/s\"));\n        assert!(out.contains(\"p95 40 ms\"));\n        assert!(render_json(&s).contains(\"\\\"p50_ms\\\": 20\"));\n    }\n}","explain":"A separate JsonReport keeps the machine-readable format stable even if the internal Summary changes, which matters once people pipe your tool into dashboards or CI gates."},"Q1.3b":{"lang":"text","hints":["Trigger the workflow on push of tags matching v*.","Build with cargo build --release --target for each platform, or use a ready-made action such as taiki-e/upload-rust-binary-action.","Measure your tool against a local axum server (Track 2, A12) to get honest numbers for the CV."],"solution":"# .github/workflows/release.yml\nname: Release\non:\n  push:\n    tags: [\"v*\"]\njobs:\n  build:\n    strategy:\n      matrix:\n        include:\n          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }\n          - { os: macos-latest, target: aarch64-apple-darwin }\n          - { os: windows-latest, target: x86_64-pc-windows-msvc }\n    runs-on: ${{ matrix.os }}\n    steps:\n      - uses: actions/checkout@v4\n      - uses: taiki-e/upload-rust-binary-action@v1\n        with:\n          bin: loadtest\n          target: ${{ matrix.target }}\n          token: ${{ secrets.GITHUB_TOKEN }}\n\n$ git tag v0.1.0 && git push origin v0.1.0","explain":"Downloadable binaries let reviewers try your tool in seconds without installing Rust. Real, measured numbers on the CV are far more convincing than adjectives."}}},"Q2.1":{"example":{"title":"The JUnit XML shape and the model","lang":"rust","note":"The definition of flaky is a product decision, so write it down and test it. Using classname::name as the identity lets results from many report files line up. Skipped results are ignored for flakiness.","code":"// <testsuites>\n//   <testsuite name=\"login\" tests=\"3\" failures=\"1\" time=\"1.42\">\n//     <testcase classname=\"login\" name=\"valid_password\" time=\"0.21\"/>\n//     <testcase classname=\"login\" name=\"wrong_password\" time=\"0.30\">\n//       <failure message=\"expected 401, got 500\">...<\/failure>\n//     <\/testcase>\n//     <testcase classname=\"login\" name=\"sso\" time=\"0.91\"><skipped/><\/testcase>\n//   <\/testsuite>\n// <\/testsuites>\n\n#[derive(Debug, Clone, Copy, PartialEq)]\npub enum Verdict { Passed, Failed, Skipped }\n\n#[derive(Debug, Clone)]\npub struct CaseResult {\n    pub id: String,          // \"classname::name\", stable across runs\n    pub verdict: Verdict,\n    pub seconds: f64,\n}\n\n/// A test is flaky if, across runs of the same code, it both passed and failed.\npub fn is_flaky(history: &[Verdict]) -> bool {\n    history.contains(&Verdict::Passed) && history.contains(&Verdict::Failed)\n}\n\nfn main() {\n    use Verdict::*;\n    println!(\"{} {}\", is_flaky(&[Passed, Failed, Passed]), is_flaky(&[Failed, Failed]));\n    let c = CaseResult { id: \"login::sso\".into(), verdict: Skipped, seconds: 0.91 };\n    println!(\"{c:?}\");\n}","output":"true false\nCaseResult { id: \"login::sso\", verdict: Skipped, seconds: 0.91 }"},"exercises":{"Q2.1a":{"lang":"text","hints":["Separate flaky (sometimes fails) from broken (always fails); they need different actions.","Show counts as well as rates, so 1 of 2 is not mistaken for 10 of 20.","Keep it scannable, one line per test."],"solution":"testlens: 20 runs, 412 test cases, 8,180 results\nOverall pass rate: 97.8%\n\nFlaky (passed and failed on the same code):\n  checkout::apply_coupon        fails 6/20  (30%)\n  search::autocomplete_latency  fails 2/20  (10%)\n\nAlways failing:\n  payments::refund_partial      fails 20/20\n\nSlowest (average):\n  e2e::full_signup_flow         41.2 s\n  e2e::checkout_guest           33.9 s\n  ...","explain":"Splitting flaky from broken is the most valuable part, since flaky tests erode trust in CI while broken tests block it. This is exactly the triage a QA lead does by hand today."},"Q2.1b":{"lang":"xml","hints":["Keep each file under 20 lines.","Vary only the flaky test's result between files.","Include time attributes so the slowest list can be tested."],"solution":"<\!-- tests/fixtures/run1.xml -->\n<testsuites>\n  <testsuite name=\"cart\">\n    <testcase classname=\"cart\" name=\"add_item\" time=\"0.10\"/>\n    <testcase classname=\"cart\" name=\"coupon\" time=\"0.40\"><failure message=\"timeout\"/><\/testcase>\n    <testcase classname=\"cart\" name=\"refund\" time=\"0.20\"><failure message=\"500\"/><\/testcase>\n    <testcase classname=\"cart\" name=\"gift_wrap\" time=\"0.01\"><skipped/><\/testcase>\n  <\/testsuite>\n<\/testsuites>\n<\!-- run2.xml and run3.xml: identical except coupon has no <failure/>\n     in run2, so coupon is flaky and refund always fails -->","explain":"Small, hand-made fixtures make integration tests readable and give you exact expected numbers. Real CI reports are great for a final smoke test but too large to reason about in assertions."}}},"Q2.2":{"example":{"title":"Parsing a report with roxmltree","lang":"rust","note":"descendants() finds testcase elements whether they sit under testsuites, testsuite or nested suites, which covers the variations different test runners produce. Missing attributes fall back to sensible defaults instead of failing the whole report.","code":"#[derive(Debug, Clone, Copy, PartialEq)]\npub enum Verdict { Passed, Failed, Skipped }\n\n#[derive(Debug, Clone, PartialEq)]\npub struct CaseResult { pub id: String, pub verdict: Verdict, pub seconds: f64 }\n\npub fn parse_junit(xml: &str) -> Result<Vec<CaseResult>, roxmltree::Error> {\n    let doc = roxmltree::Document::parse(xml)?;\n    let cases = doc.descendants().filter(|n| n.has_tag_name(\"testcase\")).map(|tc| {\n        let has = |tag: &str| tc.children().any(|c| c.has_tag_name(tag));\n        let verdict = if has(\"failure\") || has(\"error\") {\n            Verdict::Failed\n        } else if has(\"skipped\") {\n            Verdict::Skipped\n        } else {\n            Verdict::Passed\n        };\n        CaseResult {\n            id: format!(\"{}::{}\", tc.attribute(\"classname\").unwrap_or(\"?\"), tc.attribute(\"name\").unwrap_or(\"?\")),\n            verdict,\n            seconds: tc.attribute(\"time\").and_then(|t| t.parse().ok()).unwrap_or(0.0),\n        }\n    });\n    Ok(cases.collect())\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn parses_verdicts() {\n        let xml = r#\"<testsuite><testcase classname=\"a\" name=\"ok\" time=\"0.5\"/><testcase classname=\"a\" name=\"bad\"><failure/><\/testcase><testcase classname=\"a\" name=\"skip\"><skipped/><\/testcase><\/testsuite>\"#;\n        let r = parse_junit(xml).unwrap();\n        assert_eq!(r.len(), 3);\n        assert_eq!(r[0], CaseResult { id: \"a::ok\".into(), verdict: Verdict::Passed, seconds: 0.5 });\n        assert_eq!(r[1].verdict, Verdict::Failed);\n        assert_eq!(r[2].verdict, Verdict::Skipped);\n        assert!(parse_junit(\"<not closed\").is_err());\n    }\n}","output":""},"exercises":{"Q2.2a":{"lang":"rust","hints":["Accumulate into a HashMap<String, (passes, fails, total_seconds, count)>.","Skipped results count toward neither passes nor fails.","Classify with Broken when passes == 0 and fails > 0, Flaky when both are positive."],"solution":"use std::collections::HashMap;\n\n#[derive(Debug, Clone, Copy, PartialEq)]\npub enum Verdict { Passed, Failed, Skipped }\n#[derive(Debug, Clone)]\npub struct CaseResult { pub id: String, pub verdict: Verdict, pub seconds: f64 }\n\n#[derive(Debug, PartialEq, Clone, Copy)]\npub enum Class { Stable, Flaky, Broken }\n\n#[derive(Debug)]\npub struct TestStats { pub id: String, pub passes: u32, pub fails: u32, pub avg_seconds: f64, pub class: Class }\n\nimpl TestStats {\n    pub fn fail_rate(&self) -> f64 {\n        let n = self.passes + self.fails;\n        if n == 0 { 0.0 } else { self.fails as f64 / n as f64 }\n    }\n}\n\npub fn analyse(runs: &[Vec<CaseResult>]) -> Vec<TestStats> {\n    let mut acc: HashMap<&str, (u32, u32, f64, u32)> = HashMap::new();\n    for run in runs {\n        for c in run {\n            let e = acc.entry(&c.id).or_insert((0, 0, 0.0, 0));\n            match c.verdict {\n                Verdict::Passed => e.0 += 1,\n                Verdict::Failed => e.1 += 1,\n                Verdict::Skipped => continue,\n            }\n            e.2 += c.seconds;\n            e.3 += 1;\n        }\n    }\n    let mut stats: Vec<TestStats> = acc\n        .into_iter()\n        .map(|(id, (p, f, secs, n))| TestStats {\n            id: id.to_string(),\n            passes: p,\n            fails: f,\n            avg_seconds: if n == 0 { 0.0 } else { secs / n as f64 },\n            class: match (p, f) {\n                (0, f) if f > 0 => Class::Broken,\n                (p, f) if p > 0 && f > 0 => Class::Flaky,\n                _ => Class::Stable,\n            },\n        })\n        .collect();\n    stats.sort_by(|a, b| {\n        let rank = |c: Class| match c { Class::Flaky => 0, Class::Broken => 1, Class::Stable => 2 };\n        rank(a.class).cmp(&rank(b.class)).then(b.fail_rate().total_cmp(&a.fail_rate())).then(a.id.cmp(&b.id))\n    });\n    stats\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    fn r(id: &str, v: Verdict) -> CaseResult { CaseResult { id: id.into(), verdict: v, seconds: 0.1 } }\n\n    #[test]\n    fn classifies() {\n        use Verdict::*;\n        let runs = vec![\n            vec![r(\"cart::coupon\", Failed), r(\"cart::refund\", Failed), r(\"cart::add\", Passed), r(\"cart::wrap\", Skipped)],\n            vec![r(\"cart::coupon\", Passed), r(\"cart::refund\", Failed), r(\"cart::add\", Passed), r(\"cart::wrap\", Skipped)],\n            vec![r(\"cart::coupon\", Failed), r(\"cart::refund\", Failed), r(\"cart::add\", Passed), r(\"cart::wrap\", Skipped)],\n        ];\n        let s = analyse(&runs);\n        assert_eq!((s[0].id.as_str(), s[0].class, s[0].fails), (\"cart::coupon\", Class::Flaky, 2));\n        assert_eq!(s[1].class, Class::Broken);\n        assert!(s.iter().any(|t| t.id == \"cart::add\" && t.class == Class::Stable));\n    }\n}","explain":"total_cmp sorts floats without the NaN pitfalls of partial_cmp. A test that is only ever skipped ends up Stable with zero runs; consider reporting those separately, since a permanently skipped test is its own kind of risk."},"Q2.2b":{"lang":"rust","hints":["std::fs::read_dir gives entries; keep those whose extension is xml.","Sort the paths so runs are in a predictable order.",".with_context(|| format!(\"parsing {}\", p.display()))"],"solution":"use anyhow::{Context, Result};\nuse std::path::{Path, PathBuf};\n\n#[derive(Debug, Clone, Copy, PartialEq)]\npub enum Verdict { Passed, Failed, Skipped }\n#[derive(Debug, Clone)]\npub struct CaseResult { pub id: String, pub verdict: Verdict, pub seconds: f64 }\n\nfn parse_junit(xml: &str) -> Result<Vec<CaseResult>> {\n    let doc = roxmltree::Document::parse(xml)?;\n    Ok(doc\n        .descendants()\n        .filter(|n| n.has_tag_name(\"testcase\"))\n        .map(|tc| {\n            let has = |t: &str| tc.children().any(|c| c.has_tag_name(t));\n            CaseResult {\n                id: format!(\"{}::{}\", tc.attribute(\"classname\").unwrap_or(\"?\"), tc.attribute(\"name\").unwrap_or(\"?\")),\n                verdict: if has(\"failure\") || has(\"error\") { Verdict::Failed } else if has(\"skipped\") { Verdict::Skipped } else { Verdict::Passed },\n                seconds: tc.attribute(\"time\").and_then(|t| t.parse().ok()).unwrap_or(0.0),\n            }\n        })\n        .collect())\n}\n\npub fn load_dir(path: &Path) -> Result<Vec<Vec<CaseResult>>> {\n    let mut files: Vec<PathBuf> = std::fs::read_dir(path)\n        .with_context(|| format!(\"reading folder {}\", path.display()))?\n        .filter_map(|e| e.ok().map(|e| e.path()))\n        .filter(|p| p.extension().is_some_and(|x| x == \"xml\"))\n        .collect();\n    files.sort();\n    files\n        .iter()\n        .map(|p| {\n            let text = std::fs::read_to_string(p).with_context(|| format!(\"reading {}\", p.display()))?;\n            parse_junit(&text).with_context(|| format!(\"parsing {}\", p.display()))\n        })\n        .collect()\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn loads_and_reports_bad_file() {\n        let dir = std::env::temp_dir().join(\"testlens_load_dir_test\");\n        let _ = std::fs::remove_dir_all(&dir);\n        std::fs::create_dir_all(&dir).unwrap();\n        std::fs::write(dir.join(\"a.xml\"), r#\"<testsuite><testcase classname=\"x\" name=\"y\"/><\/testsuite>\"#).unwrap();\n        std::fs::write(dir.join(\"notes.txt\"), \"ignored\").unwrap();\n        assert_eq!(load_dir(&dir).unwrap().len(), 1);\n        std::fs::write(dir.join(\"b.xml\"), \"<broken\").unwrap();\n        let err = format!(\"{:#}\", load_dir(&dir).unwrap_err());\n        assert!(err.contains(\"b.xml\"), \"{err}\");\n    }\n}","explain":"Collecting an iterator of Result into Result<Vec<_>> stops at the first error, and the context names the exact file. For nested folders, the walkdir crate replaces read_dir."}}},"Q2.3":{"example":{"title":"Using testlens as a CI quality gate","lang":"yaml","note":"As a quality gate, the tool's exit code decides whether CI passes. An allow-list file lets a team acknowledge known flaky tests while still catching new ones, which keeps the gate useful instead of noisy.","code":"# In the project being tested (after the test step):\n- name: Download last 20 test reports\n  uses: dawidd6/action-download-artifact@v6\n  with:\n    name: junit-reports\n    path: reports/\n    workflow_conclusion: \"\"\n    if_no_artifact_found: warn\n- name: Check for flaky tests\n  run: testlens reports/ --min-runs 5 --fail-on-flaky --allow-list .testlens-allow","output":""},"exercises":{"Q2.3a":{"lang":"rust","hints":["Broken tests take priority, so check them first.","Filter flaky tests by !allow.contains(&t.id).","Keep this pure, so main only maps it to ExitCode."],"solution":"use std::collections::HashSet;\n\n#[derive(Debug, PartialEq, Clone, Copy)]\npub enum Class { Stable, Flaky, Broken }\npub struct TestStats { pub id: String, pub class: Class }\n\npub fn exit_code(stats: &[TestStats], allow: &HashSet<String>, fail_on_flaky: bool) -> u8 {\n    if stats.iter().any(|t| t.class == Class::Broken) {\n        return 2;\n    }\n    let new_flaky = stats.iter().any(|t| t.class == Class::Flaky && !allow.contains(&t.id));\n    if fail_on_flaky && new_flaky { 1 } else { 0 }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    fn t(id: &str, class: Class) -> TestStats { TestStats { id: id.into(), class } }\n\n    #[test]\n    fn cases() {\n        let none = HashSet::new();\n        assert_eq!(exit_code(&[t(\"a\", Class::Stable)], &none, true), 0);\n        assert_eq!(exit_code(&[t(\"a\", Class::Flaky)], &none, true), 1);\n        assert_eq!(exit_code(&[t(\"a\", Class::Flaky)], &none, false), 0);\n        let allow: HashSet<String> = [\"a\".to_string()].into();\n        assert_eq!(exit_code(&[t(\"a\", Class::Flaky)], &allow, true), 0);\n        assert_eq!(exit_code(&[t(\"a\", Class::Flaky), t(\"b\", Class::Broken)], &allow, true), 2);\n    }\n}","explain":"A pure decision function makes the gate's policy obvious and fully testable. Distinct codes let a pipeline treat \"new flakiness\" as a warning stage and \"broken\" as a hard failure."},"Q2.3b":{"lang":"text","hints":["Start the README with the problem in one sentence, flaky tests erode trust in CI.","Include the exact definition of flaky and broken from your code.","If you lack real reports, generate 20 runs of a sample project with a deliberately flaky test."],"solution":"# testlens\nFind flaky and broken tests across many CI runs from JUnit XML reports.\n\n## Install\n    cargo install --git https://github.com/your-name/testlens\n\n## Usage\n    testlens reports/ --min-runs 5 [--json] [--fail-on-flaky] [--allow-list FILE]\n\n## Definitions\nFlaky: passed at least once and failed at least once across the runs.\nBroken: failed in every run where it ran. Skipped results are ignored.\n\n## Exit codes\n0 OK, 1 new flaky tests (with --fail-on-flaky), 2 broken tests.","explain":"A tool that solves a well-known QA pain point is a credible portfolio piece, because you can speak to both the problem and the implementation in interviews."}}},"Q3.1":{"example":{"title":"The events and the rule","lang":"rust","note":"Working with timestamps as seconds keeps the detector independent from clocks and dates, so tests can feed events with chosen times. The IP addresses above are from documentation ranges reserved for examples. Only point the tool at logs you are allowed to read.","code":"// Sample lines from /var/log/auth.log (OpenSSH):\n// Nov  4 06:12:01 web sshd[1201]: Failed password for root from 203.0.113.9 port 51234 ssh2\n// Nov  4 06:12:03 web sshd[1203]: Failed password for invalid user admin from 203.0.113.9 port 51240 ssh2\n// Nov  4 06:13:10 web sshd[1210]: Accepted publickey for kev from 198.51.100.7 port 50111 ssh2\n\n#[derive(Debug, Clone, PartialEq)]\npub enum Event {\n    Failed { ip: String, user: String, ts: u64 },\n    Accepted { ip: String, user: String, ts: u64 },\n}\n\n/// Alert when an IP fails at least `max_failures` times within `window_secs`.\n#[derive(Debug, Clone, Copy)]\npub struct Rule { pub max_failures: usize, pub window_secs: u64 }\n\nfn main() {\n    let rule = Rule { max_failures: 5, window_secs: 60 };\n    let e = Event::Failed { ip: \"203.0.113.9\".into(), user: \"root\".into(), ts: 1_793_000_000 };\n    println!(\"{rule:?}\\n{e:?}\");\n}","output":"Rule { max_failures: 5, window_secs: 60 }\nFailed { ip: \"203.0.113.9\", user: \"root\", ts: 1793000000 }"},"exercises":{"Q3.1a":{"lang":"text","hints":["Distributed attacks from many IPs each stay under a per-IP threshold.","A user mistyping a password a few times should not trigger an alert.","An alert needs enough detail to act on without opening the log."],"solution":"Detects\n  - Repeated failed passwords from one IP (brute force)\n  - Many \"invalid user\" attempts from one IP (user enumeration)\nDoes not detect\n  - Distributed attempts below the per-IP threshold\n  - Attacks that leave no auth log entries\nFalse positives\n  - A real user who forgot their password; mitigated by a threshold\n    such as 5 failures in 60 s and by resetting on a successful login\nAlert contents\n  - IP, failure count, window, usernames tried, first and last time,\n    and whether any login from that IP later succeeded (critical)","explain":"Stating limits honestly is part of good security engineering, and the \"failed then succeeded\" signal is the highest-priority alert, since it may mean a password was guessed."},"Q3.1b":{"lang":"text","hints":["Copy the shapes from the example lines exactly.","Use documentation IP ranges such as 203.0.113.0/24 and 198.51.100.0/24.","Include a cron or systemd line so the parser must skip it."],"solution":"Nov  4 06:12:01 web sshd[1201]: Failed password for root from 203.0.113.9 port 51234 ssh2\nNov  4 06:12:03 web sshd[1203]: Failed password for invalid user admin from 203.0.113.9 port 51240 ssh2\nNov  4 06:12:04 web sshd[1204]: Failed password for root from 203.0.113.9 port 51244 ssh2\nNov  4 06:12:06 web sshd[1206]: Failed password for root from 203.0.113.9 port 51250 ssh2\nNov  4 06:12:07 web sshd[1207]: Failed password for root from 203.0.113.9 port 51251 ssh2\nNov  4 06:12:30 web CRON[1300]: pam_unix(cron:session): session opened for user root\nNov  4 06:20:00 web sshd[1400]: Failed password for kev from 198.51.100.7 port 50000 ssh2\nNov  4 06:20:40 web sshd[1401]: Accepted password for kev from 198.51.100.7 port 50001 ssh2","explain":"With this fixture you know the right answer in advance, one alert for 203.0.113.9, and no alert for kev's single typo followed by success."}}},"Q3.2":{"example":{"title":"Parsing lines with regex","lang":"rust","note":"The regex is compiled once into a LazyLock static and reused for every line, which matters when scanning millions of lines. The (?:invalid user )? group is non-capturing, so both \"Failed password for root\" and \"for invalid user admin\" yield the user name. Timestamps are added by the caller from the line's date or the time it was read.","code":"use regex::Regex;\nuse std::sync::LazyLock;\n\n#[derive(Debug, Clone, PartialEq)]\npub enum Event {\n    Failed { ip: String, user: String },\n    Accepted { ip: String, user: String },\n}\n\nstatic LINE: LazyLock<Regex> = LazyLock::new(|| {\n    Regex::new(r\"sshd\\[\\d+\\]: (Failed|Accepted) \\S+ for (?:invalid user )?(\\S+) from (\\S+) port\").unwrap()\n});\n\npub fn parse(line: &str) -> Option<Event> {\n    let c = LINE.captures(line)?;\n    let (user, ip) = (c[2].to_string(), c[3].to_string());\n    Some(match &c[1] {\n        \"Failed\" => Event::Failed { ip, user },\n        _ => Event::Accepted { ip, user },\n    })\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn parses_lines() {\n        let f = \"Nov  4 06:12:03 web sshd[1203]: Failed password for invalid user admin from 203.0.113.9 port 51240 ssh2\";\n        assert_eq!(parse(f), Some(Event::Failed { ip: \"203.0.113.9\".into(), user: \"admin\".into() }));\n        let a = \"Nov  4 06:20:40 web sshd[1401]: Accepted publickey for kev from 198.51.100.7 port 50001 ssh2\";\n        assert_eq!(parse(a), Some(Event::Accepted { ip: \"198.51.100.7\".into(), user: \"kev\".into() }));\n        assert_eq!(parse(\"Nov  4 06:12:30 web CRON[1300]: session opened\"), None);\n    }\n}","output":""},"exercises":{"Q3.2a":{"lang":"rust","hints":["while let Some(&front) = q.front() { if ts - front >= window { q.pop_front(); } else { break; } }","When q.len() >= max_failures, build the alert from q.front() and q.back(), then clear q.","On success, remove the IP from the map."],"solution":"use std::collections::{HashMap, VecDeque};\n\n#[derive(Debug, Clone, Copy)]\npub struct Rule { pub max_failures: usize, pub window_secs: u64 }\n\n#[derive(Debug, PartialEq)]\npub struct Alert { pub ip: String, pub failures: usize, pub first: u64, pub last: u64 }\n\npub struct Detector { rule: Rule, windows: HashMap<String, VecDeque<u64>> }\n\nimpl Detector {\n    pub fn new(rule: Rule) -> Self {\n        Detector { rule, windows: HashMap::new() }\n    }\n\n    pub fn observe(&mut self, ip: &str, failed: bool, ts: u64) -> Option<Alert> {\n        if !failed {\n            self.windows.remove(ip);\n            return None;\n        }\n        let q = self.windows.entry(ip.to_string()).or_default();\n        q.push_back(ts);\n        while let Some(&front) = q.front() {\n            if ts.saturating_sub(front) >= self.rule.window_secs { q.pop_front(); } else { break; }\n        }\n        if q.len() >= self.rule.max_failures {\n            let alert = Alert { ip: ip.to_string(), failures: q.len(), first: *q.front().unwrap(), last: ts };\n            q.clear();\n            return Some(alert);\n        }\n        None\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    fn det() -> Detector { Detector::new(Rule { max_failures: 3, window_secs: 60 }) }\n\n    #[test]\n    fn burst_alerts_once() {\n        let mut d = det();\n        assert_eq!(d.observe(\"a\", true, 0), None);\n        assert_eq!(d.observe(\"a\", true, 10), None);\n        assert_eq!(d.observe(\"a\", true, 20), Some(Alert { ip: \"a\".into(), failures: 3, first: 0, last: 20 }));\n        assert_eq!(d.observe(\"a\", true, 21), None, \"window was cleared after alerting\");\n    }\n\n    #[test]\n    fn slow_trickle_never_alerts() {\n        let mut d = det();\n        for t in [0, 70, 140, 210, 280] {\n            assert_eq!(d.observe(\"b\", true, t), None);\n        }\n    }\n\n    #[test]\n    fn success_resets() {\n        let mut d = det();\n        d.observe(\"c\", true, 0);\n        d.observe(\"c\", true, 5);\n        d.observe(\"c\", false, 6);\n        assert_eq!(d.observe(\"c\", true, 7), None);\n    }\n}","explain":"Each IP keeps only timestamps inside the window, so memory stays bounded per active IP; production versions also evict idle IPs periodically. saturating_sub protects against out-of-order timestamps, which real logs do contain."},"Q3.2b":{"lang":"rust","hints":["Before removing the IP on success, look at how many timestamps its window holds.","Add a severity or compromised_suspect field to Alert.","Only count failures still inside the window."],"solution":"use std::collections::{HashMap, VecDeque};\n\n#[derive(Debug, PartialEq)]\npub struct Alert { pub ip: String, pub failures: usize, pub compromised_suspect: bool }\n\npub struct Detector { max: usize, window: u64, w: HashMap<String, VecDeque<u64>> }\n\nimpl Detector {\n    pub fn new(max: usize, window: u64) -> Self {\n        Detector { max, window, w: HashMap::new() }\n    }\n    fn prune(q: &mut VecDeque<u64>, ts: u64, window: u64) {\n        while q.front().is_some_and(|&f| ts.saturating_sub(f) >= window) {\n            q.pop_front();\n        }\n    }\n    pub fn observe(&mut self, ip: &str, failed: bool, ts: u64) -> Option<Alert> {\n        if !failed {\n            let mut q = self.w.remove(ip)?;\n            Self::prune(&mut q, ts, self.window);\n            return (q.len() >= 2).then(|| Alert { ip: ip.into(), failures: q.len(), compromised_suspect: true });\n        }\n        let q = self.w.entry(ip.into()).or_default();\n        q.push_back(ts);\n        Self::prune(q, ts, self.window);\n        if q.len() >= self.max {\n            let n = q.len();\n            q.clear();\n            return Some(Alert { ip: ip.into(), failures: n, compromised_suspect: false });\n        }\n        None\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn success_after_failures_is_suspicious() {\n        let mut d = Detector::new(10, 60);\n        d.observe(\"x\", true, 0);\n        d.observe(\"x\", true, 3);\n        let a = d.observe(\"x\", false, 5).unwrap();\n        assert!(a.compromised_suspect);\n        assert_eq!(d.observe(\"y\", false, 5), None, \"a clean login is not an alert\");\n    }\n}","explain":"A burst of failures followed by a success from the same IP is a classic sign of a guessed password, so it deserves a louder alert than the failures alone. The ? on self.w.remove(ip) neatly returns None for IPs with no history."}}},"Q3.3":{"example":{"title":"Following a file as it grows","lang":"rust","note":"Polling every 250 ms is simple and portable; the notify crate can wake you on file changes instead. A production version also handles log rotation, noticing when the file is replaced and reopening it. Emitting JSON lines lets other tools (jq, a SIEM, a chat webhook) consume alerts.","code":"use std::fs::File;\nuse std::io::{BufRead, BufReader, Seek, SeekFrom};\nuse std::thread;\nuse std::time::Duration;\n\n/// Calls `on_line` for every new line appended to `path`, forever.\nfn follow(path: &str, mut on_line: impl FnMut(&str)) -> std::io::Result<()> {\n    let mut file = File::open(path)?;\n    file.seek(SeekFrom::End(0))?;          // start at the end, like tail -f\n    let mut reader = BufReader::new(file);\n    let mut line = String::new();\n    loop {\n        line.clear();\n        if reader.read_line(&mut line)? == 0 {\n            thread::sleep(Duration::from_millis(250)); // nothing new yet\n            continue;\n        }\n        on_line(line.trim_end());\n    }\n}\n\nfn main() -> std::io::Result<()> {\n    let path = std::env::args().nth(1).unwrap_or_else(|| \"/var/log/auth.log\".into());\n    follow(&path, |l| println!(\"new line: {l}\"))\n}","output":""},"exercises":{"Q3.3a":{"lang":"rust","hints":["Build the lines in memory with format! and a simple counter-based pattern instead of randomness, so runs are repeatable.","Time only the parse plus observe loop.","Report lines per second as count / elapsed.as_secs_f64()."],"solution":"use std::time::Instant;\n\nfn synthetic(n: usize) -> Vec<String> {\n    (0..n)\n        .map(|i| {\n            if i % 50 == 0 {\n                format!(\"Nov  4 06:{:02}:{:02} web sshd[{i}]: Failed password for root from 203.0.113.{} port 5{i} ssh2\", (i / 60) % 60, i % 60, i % 7)\n            } else {\n                format!(\"Nov  4 06:{:02}:{:02} web CRON[{i}]: pam_unix(cron:session): session closed for user root\", (i / 60) % 60, i % 60)\n            }\n        })\n        .collect()\n}\n\nfn main() {\n    let lines = synthetic(1_000_000);\n    let start = Instant::now();\n    let mut failures = 0usize;\n    for l in &lines {\n        // stand-in for parse(l) + detector.observe(..)\n        if l.contains(\"sshd[\") && l.contains(\"Failed password\") {\n            failures += 1;\n        }\n    }\n    let secs = start.elapsed().as_secs_f64();\n    println!(\"{failures} failures in {} lines: {:.0} lines/s\", lines.len(), lines.len() as f64 / secs);\n}","explain":"Swap the stand-in for your real parse and observe calls. A pre-filter with contains before running the regex is a common trick that skips most benign lines cheaply. Concrete throughput figures make strong CV material."},"Q3.3b":{"lang":"ini","hints":["Create a system user and add it to the adm group (which can read auth.log on Debian and Ubuntu).","Use ProtectSystem=strict and NoNewPrivileges=true to sandbox it.","Restart=on-failure restarts the service if it crashes."],"solution":"# /etc/systemd/system/logwatch.service\n[Unit]\nDescription=logwatch SSH brute-force detector\nAfter=network.target\n\n[Service]\nExecStart=/usr/local/bin/logwatch --follow /var/log/auth.log --max-failures 5 --window 60\nUser=logwatch\nGroup=adm\nRestart=on-failure\nNoNewPrivileges=true\nProtectSystem=strict\nProtectHome=true\nPrivateTmp=true\n\n[Install]\nWantedBy=multi-user.target\n\n# setup\n# sudo useradd --system --no-create-home logwatch\n# sudo usermod -aG adm logwatch\n# sudo systemctl enable --now logwatch\n# journalctl -u logwatch -f","explain":"Running a security tool with the least privilege it needs, and sandboxing it, is part of the deliverable. A home server or a small cloud VM is a good place to deploy and observe it."}}},"W1.1":{"example":{"title":"The API contract","lang":"text","note":"Writing the contract first lets you write API tests before handlers and agree the shapes with anyone building a front end. Every error uses the same JSON shape, so clients handle failures in one place.","code":"GET    /health                       200 {\"status\":\"ok\"}\nGET    /tasks?status=open&page=1     200 {\"items\":[Task], \"page\":1, \"per_page\":20, \"total\":57}\nPOST   /tasks        {\"title\",\"due\"?} 201 Task            422 {\"error\":\"title must not be empty\"}\nGET    /tasks/{id}                   200 Task            404 {\"error\":\"task 9 not found\"}\nPATCH  /tasks/{id}   {\"title\"?,\"done\"?} 200 Task          404 / 422\nDELETE /tasks/{id}                   204                 404\n\nTask = {\"id\": 1, \"title\": \"Write tests\", \"done\": false, \"due\": \"2026-11-30\" | null, \"created_at\": \"...\"}\n\nLayers: routes (HTTP) -> service (rules) -> repository (SQL)","output":""},"exercises":{"W1.1a":{"lang":"text","hints":["axum rejects malformed JSON before your handler runs; decide whether to keep its default response.","A page beyond the end is not an error; it is an empty list.","A non-numeric id fails the Path extractor with 400."],"solution":"POST /tasks\n  invalid JSON            400 (axum default, wrapped into {\"error\": ...})\n  missing title           422 {\"error\":\"title is required\"}\n  title > 200 chars       422\n  unknown fields          ignored (documented)\nGET /tasks/abc            400 {\"error\":\"id must be a number\"}\nGET /tasks?page=999       200 {\"items\":[], \"page\":999, ...}\nPATCH /tasks/{id} {}      200, unchanged task (no-op)\nPATCH done: \"yes\"         422 (wrong type)\nDELETE twice              204 then 404","explain":"Decisions like \"a page past the end is an empty list\" are what separate a polished API from a frustrating one, and they map directly onto test cases."},"W1.1b":{"lang":"text","hints":["Keep main.rs to configuration and server start-up.","Put the Router construction in a function so tests can build it.","The repository should be testable against an in-memory SQLite database."],"solution":"src/\n  main.rs        read config, open DB, build app, serve        (no tests)\n  app.rs         fn app(state) -> Router                       (HTTP tests via oneshot)\n  handlers.rs    thin: extract, call service, map to response  (HTTP tests)\n  model.rs       Task, NewTask, TaskPatch, validation          (unit tests)\n  repo.rs        TaskRepo over rusqlite                        (unit tests, in-memory DB)\n  error.rs       ApiError + IntoResponse                       (unit tests)\ntests/\n  api.rs         full flows: create, list, patch, delete       (integration)","explain":"Each layer is testable on its own, which keeps tests fast and failures easy to locate. The same layout scales to much larger services."}}},"W1.2":{"example":{"title":"Errors that become responses","lang":"rust","note":"Internal errors are logged in full but returned to clients as a generic message, so database details never leak. The From impl means repository calls can use ? inside handlers.","code":"use axum::{http::StatusCode, response::{IntoResponse, Response}, Json};\nuse serde_json::json;\n\n#[derive(Debug)]\npub enum ApiError {\n    NotFound(u64),\n    Validation(String),\n    Internal(String),\n}\n\nimpl From<rusqlite::Error> for ApiError {\n    fn from(e: rusqlite::Error) -> Self { ApiError::Internal(e.to_string()) }\n}\n\nimpl IntoResponse for ApiError {\n    fn into_response(self) -> Response {\n        let (status, msg) = match self {\n            ApiError::NotFound(id) => (StatusCode::NOT_FOUND, format!(\"task {id} not found\")),\n            ApiError::Validation(m) => (StatusCode::UNPROCESSABLE_ENTITY, m),\n            ApiError::Internal(m) => {\n                eprintln!(\"internal error: {m}\");            // log details, hide them from clients\n                (StatusCode::INTERNAL_SERVER_ERROR, \"internal error\".to_string())\n            }\n        };\n        (status, Json(json!({ \"error\": msg }))).into_response()\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn statuses() {\n        assert_eq!(ApiError::NotFound(9).into_response().status(), StatusCode::NOT_FOUND);\n        assert_eq!(ApiError::Validation(\"x\".into()).into_response().status(), StatusCode::UNPROCESSABLE_ENTITY);\n        let db_err: ApiError = rusqlite::Error::QueryReturnedNoRows.into();\n        assert_eq!(db_err.into_response().status(), StatusCode::INTERNAL_SERVER_ERROR);\n    }\n}","output":""},"exercises":{"W1.2a":{"lang":"rust","hints":["LIMIT ?1 OFFSET ?2 with offset = (page - 1) * per_page.","Build the WHERE clause from a fixed set of strings, never from user text: WHERE (?1 IS NULL OR done = ?1).","SELECT COUNT(*) with the same filter gives the total."],"solution":"use rusqlite::{params, Connection, OptionalExtension, Result};\n\n#[derive(Debug, Clone, PartialEq)]\npub struct Task { pub id: i64, pub title: String, pub done: bool }\n\npub struct TaskRepo { conn: Connection }\n\nimpl TaskRepo {\n    pub fn new(conn: Connection) -> Result<Self> {\n        conn.execute_batch(\"CREATE TABLE IF NOT EXISTS tasks (id INTEGER PRIMARY KEY, title TEXT NOT NULL, done INTEGER NOT NULL DEFAULT 0);\")?;\n        Ok(TaskRepo { conn })\n    }\n    pub fn create(&self, title: &str) -> Result<Task> {\n        self.conn.execute(\"INSERT INTO tasks (title) VALUES (?1)\", [title])?;\n        Ok(Task { id: self.conn.last_insert_rowid(), title: title.into(), done: false })\n    }\n    pub fn get(&self, id: i64) -> Result<Option<Task>> {\n        self.conn\n            .query_row(\"SELECT id, title, done FROM tasks WHERE id = ?1\", [id], |r| Ok(Task { id: r.get(0)?, title: r.get(1)?, done: r.get(2)? }))\n            .optional()\n    }\n    pub fn list(&self, done: Option<bool>, page: u32, per_page: u32) -> Result<(Vec<Task>, i64)> {\n        let offset = (page.max(1) - 1) * per_page;\n        let mut stmt = self.conn.prepare(\"SELECT id, title, done FROM tasks WHERE (?1 IS NULL OR done = ?1) ORDER BY id LIMIT ?2 OFFSET ?3\")?;\n        let items = stmt\n            .query_map(params![done, per_page, offset], |r| Ok(Task { id: r.get(0)?, title: r.get(1)?, done: r.get(2)? }))?\n            .collect::<Result<Vec<_>>>()?;\n        let total = self.conn.query_row(\"SELECT COUNT(*) FROM tasks WHERE (?1 IS NULL OR done = ?1)\", params![done], |r| r.get(0))?;\n        Ok((items, total))\n    }\n    pub fn update_done(&self, id: i64, done: bool) -> Result<bool> {\n        Ok(self.conn.execute(\"UPDATE tasks SET done = ?1 WHERE id = ?2\", params![done, id])? == 1)\n    }\n    pub fn delete(&self, id: i64) -> Result<bool> {\n        Ok(self.conn.execute(\"DELETE FROM tasks WHERE id = ?1\", [id])? == 1)\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    fn repo() -> TaskRepo { TaskRepo::new(Connection::open_in_memory().unwrap()).unwrap() }\n\n    #[test]\n    fn pagination_and_filter() {\n        let r = repo();\n        for i in 1..=25 {\n            let t = r.create(&format!(\"task {i}\")).unwrap();\n            if i % 5 == 0 { r.update_done(t.id, true).unwrap(); }\n        }\n        let (page2, total) = r.list(None, 2, 10).unwrap();\n        assert_eq!((page2.len(), total, page2[0].id), (10, 25, 11));\n        let (done, total_done) = r.list(Some(true), 1, 10).unwrap();\n        assert_eq!((done.len(), total_done), (5, 5));\n        let (empty, _) = r.list(None, 99, 10).unwrap();\n        assert!(empty.is_empty());\n    }\n\n    #[test]\n    fn get_and_delete() {\n        let r = repo();\n        let t = r.create(\"x\").unwrap();\n        assert_eq!(r.get(t.id).unwrap(), Some(t.clone()));\n        assert!(r.delete(t.id).unwrap());\n        assert!(!r.delete(t.id).unwrap());\n        assert_eq!(r.get(t.id).unwrap(), None);\n    }\n}","explain":"The (?1 IS NULL OR done = ?1) trick keeps one fixed, parameterised query for both filtered and unfiltered lists, so no SQL is ever built from user input. optional() turns \"no rows\" into None instead of an error."},"W1.2b":{"lang":"rust","hints":["Validation lives in a plain function so it can be unit tested.","Lock the mutex, call the repository, and let the guard drop before returning.","In the test, build the app with an in-memory repository and send a POST with a JSON body."],"solution":"use axum::{extract::State, http::StatusCode, response::{IntoResponse, Response}, routing::post, Json, Router};\nuse rusqlite::Connection;\nuse serde::{Deserialize, Serialize};\nuse serde_json::json;\nuse std::sync::{Arc, Mutex};\n\n#[derive(Debug, Serialize, Clone)]\nstruct Task { id: i64, title: String, done: bool }\n\n#[derive(Deserialize)]\nstruct NewTask { title: String }\n\nenum ApiError { Validation(String), Internal(String) }\n\nimpl IntoResponse for ApiError {\n    fn into_response(self) -> Response {\n        let (s, m) = match self {\n            ApiError::Validation(m) => (StatusCode::UNPROCESSABLE_ENTITY, m),\n            ApiError::Internal(_) => (StatusCode::INTERNAL_SERVER_ERROR, \"internal error\".into()),\n        };\n        (s, Json(json!({ \"error\": m }))).into_response()\n    }\n}\n\nfn validate_title(raw: &str) -> Result<String, ApiError> {\n    let t = raw.trim();\n    match t.chars().count() {\n        0 => Err(ApiError::Validation(\"title must not be empty\".into())),\n        n if n > 200 => Err(ApiError::Validation(\"title must be at most 200 characters\".into())),\n        _ => Ok(t.to_string()),\n    }\n}\n\ntype Db = Arc<Mutex<Connection>>;\n\nasync fn create(State(db): State<Db>, Json(input): Json<NewTask>) -> Result<(StatusCode, Json<Task>), ApiError> {\n    let title = validate_title(&input.title)?;\n    let conn = db.lock().unwrap();\n    conn.execute(\"INSERT INTO tasks (title) VALUES (?1)\", [&title]).map_err(|e| ApiError::Internal(e.to_string()))?;\n    let task = Task { id: conn.last_insert_rowid(), title, done: false };\n    Ok((StatusCode::CREATED, Json(task)))\n}\n\nfn app(db: Db) -> Router {\n    Router::new().route(\"/tasks\", post(create)).with_state(db)\n}\n\nfn memory_db() -> Db {\n    let c = Connection::open_in_memory().unwrap();\n    c.execute_batch(\"CREATE TABLE tasks (id INTEGER PRIMARY KEY, title TEXT NOT NULL, done INTEGER NOT NULL DEFAULT 0);\").unwrap();\n    Arc::new(Mutex::new(c))\n}\n\n#[tokio::main]\nasync fn main() {\n    let listener = tokio::net::TcpListener::bind(\"127.0.0.1:3000\").await.unwrap();\n    axum::serve(listener, app(memory_db())).await.unwrap();\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use axum::{body::Body, http::Request};\n    use tower::ServiceExt;\n\n    fn post_json(body: &str) -> Request<Body> {\n        Request::post(\"/tasks\").header(\"content-type\", \"application/json\").body(Body::from(body.to_string())).unwrap()\n    }\n\n    #[tokio::test]\n    async fn creates_and_validates() {\n        let db = memory_db();\n        let ok = app(db.clone()).oneshot(post_json(r#\"{\"title\":\"  Write tests  \"}\"#)).await.unwrap();\n        assert_eq!(ok.status(), StatusCode::CREATED);\n        let bad = app(db).oneshot(post_json(r#\"{\"title\":\"   \"}\"#)).await.unwrap();\n        assert_eq!(bad.status(), StatusCode::UNPROCESSABLE_ENTITY);\n    }\n\n    #[test]\n    fn title_rules() {\n        assert!(validate_title(&\"é\".repeat(200)).is_ok());\n        assert!(validate_title(&\"é\".repeat(201)).is_err());\n    }\n}","explain":"Holding a std Mutex guard in this handler is fine because nothing awaits while it is held. Under heavy load you would move database work to spawn_blocking or use an async driver such as sqlx; the handler shape stays the same."}}},"W1.3":{"example":{"title":"A small, secure container image","lang":"text","note":"The two-stage build compiles in a full Rust image, then copies only the binary into a tiny distroless image with no shell and a non-root user, which shrinks the attack surface and the download size. --locked makes the build use exactly the versions in Cargo.lock.","code":"# Dockerfile\nFROM rust:1.97 AS build\nWORKDIR /app\nCOPY . .\nRUN cargo build --release --locked\n\nFROM gcr.io/distroless/cc-debia
