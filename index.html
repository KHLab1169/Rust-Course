n12\nCOPY --from=build /app/target/release/taskhub /taskhub\nENV TASKHUB_ADDR=0.0.0.0:3000 TASKHUB_DB=/data/taskhub.db\nVOLUME /data\nUSER nonroot\nEXPOSE 3000\nENTRYPOINT [\"/taskhub\"]\n\n# $ docker build -t taskhub .\n# $ docker run -p 3000:3000 -v taskhub-data:/data taskhub","output":""},"exercises":{"W1.3a":{"lang":"rust","hints":["std::env::var(\"TASKHUB_ADDR\").unwrap_or_else(|_| \"127.0.0.1:3000\".into())",".layer(tower_http::trace::TraceLayer::new_for_http()) after adding tower-http with the trace feature.","axum::serve(listener, app).with_graceful_shutdown(async { tokio::signal::ctrl_c().await.ok(); })"],"solution":"use std::env;\nuse tower_http::trace::TraceLayer;\n\n#[tokio::main]\nasync fn main() -> anyhow::Result<()> {\n    tracing_subscriber::fmt().with_env_filter(\"taskhub=info,tower_http=info\").init();\n    let addr = env::var(\"TASKHUB_ADDR\").unwrap_or_else(|_| \"127.0.0.1:3000\".into());\n    let db_path = env::var(\"TASKHUB_DB\").unwrap_or_else(|_| \"taskhub.db\".into());\n\n    let state = AppState::open(&db_path)?;\n    let app = app(state).layer(TraceLayer::new_for_http());\n\n    let listener = tokio::net::TcpListener::bind(&addr).await?;\n    tracing::info!(\"listening on {addr}, database {db_path}\");\n    axum::serve(listener, app)\n        .with_graceful_shutdown(async {\n            tokio::signal::ctrl_c().await.ok();\n            tracing::info!(\"shutting down\");\n        })\n        .await?;\n    Ok(())\n}","explain":"Graceful shutdown lets in-flight requests finish before the process exits, which matters during deployments. Configuration from environment variables is the convention containers and platforms expect."},"W1.3b":{"lang":"rust","hints":["Bind a TcpListener to 127.0.0.1:0 and read local_addr() to get the port.","Spawn axum::serve in a background task, then use reqwest against the address.","Use a fresh in-memory or temporary-file database per test."],"solution":"// tests/api.rs\nuse serde_json::{json, Value};\n\n#[tokio::test]\nasync fn full_flow() {\n    let listener = tokio::net::TcpListener::bind(\"127.0.0.1:0\").await.unwrap();\n    let addr = listener.local_addr().unwrap();\n    tokio::spawn(async move { axum::serve(listener, taskhub::app(taskhub::AppState::in_memory())).await.unwrap() });\n    let base = format!(\"http://{addr}\");\n    let c = reqwest::Client::new();\n\n    let created: Value = c.post(format!(\"{base}/tasks\")).json(&json!({\"title\": \"ship it\"})).send().await.unwrap().json().await.unwrap();\n    let id = created[\"id\"].as_i64().unwrap();\n    let list: Value = c.get(format!(\"{base}/tasks\")).send().await.unwrap().json().await.unwrap();\n    assert_eq!(list[\"total\"], 1);\n    let patched: Value = c.patch(format!(\"{base}/tasks/{id}\")).json(&json!({\"done\": true})).send().await.unwrap().json().await.unwrap();\n    assert_eq!(patched[\"done\"], true);\n    assert_eq!(c.delete(format!(\"{base}/tasks/{id}\")).send().await.unwrap().status(), 204);\n    assert_eq!(c.get(format!(\"{base}/tasks/{id}\")).send().await.unwrap().status(), 404);\n}","explain":"This end-to-end test exercises real HTTP, JSON and SQLite together, catching wiring mistakes unit tests miss, while still running in well under a second."}}},"W2.1":{"example":{"title":"The record format","lang":"rust","note":"Appending is the fastest and safest way to write to disk, since existing data is never overwritten. The checksum detects a record that was half-written when the machine crashed, so recovery can stop cleanly at the last good record. A real implementation would use the crc32fast crate.","code":"/// One record in the log:\n///   [crc32: u32][kind: u8][key_len: u32][val_len: u32][key bytes][value bytes]\n/// kind 1 = set, 2 = remove (a \"tombstone\", value empty)\n#[derive(Debug, PartialEq)]\npub enum Record {\n    Set { key: Vec<u8>, value: Vec<u8> },\n    Remove { key: Vec<u8> },\n}\n\npub fn encode(r: &Record) -> Vec<u8> {\n    let (kind, key, value): (u8, &[u8], &[u8]) = match r {\n        Record::Set { key, value } => (1, key, value),\n        Record::Remove { key } => (2, key, &[]),\n    };\n    let mut body = Vec::with_capacity(9 + key.len() + value.len());\n    body.push(kind);\n    body.extend_from_slice(&(key.len() as u32).to_le_bytes());\n    body.extend_from_slice(&(value.len() as u32).to_le_bytes());\n    body.extend_from_slice(key);\n    body.extend_from_slice(value);\n    let crc = body.iter().fold(0u32, |h, &b| h.rotate_left(5) ^ b as u32); // simple checksum for now\n    let mut out = crc.to_le_bytes().to_vec();\n    out.extend(body);\n    out\n}\n\nfn main() {\n    let bytes = encode(&Record::Set { key: b\"lang\".to_vec(), value: b\"rust\".to_vec() });\n    println!(\"{} bytes: {:?}\", bytes.len(), &bytes[4..13]);\n}","output":"21 bytes: [1, 4, 0, 0, 0, 4, 0, 0, 0]"},"exercises":{"W2.1a":{"lang":"rust","hints":["The header is 13 bytes, crc (4) + kind (1) + two lengths (4 + 4).","u32::from_le_bytes(buf[5..9].try_into().unwrap()) reads a length.","Recompute the checksum over the body and compare."],"solution":"#[derive(Debug, PartialEq)]\npub enum Record {\n    Set { key: Vec<u8>, value: Vec<u8> },\n    Remove { key: Vec<u8> },\n}\n\nfn checksum(body: &[u8]) -> u32 {\n    body.iter().fold(0u32, |h, &b| h.rotate_left(5) ^ b as u32)\n}\n\npub fn encode(r: &Record) -> Vec<u8> {\n    let (kind, key, value): (u8, &[u8], &[u8]) = match r {\n        Record::Set { key, value } => (1, key, value),\n        Record::Remove { key } => (2, key, &[]),\n    };\n    let mut body = vec![kind];\n    body.extend_from_slice(&(key.len() as u32).to_le_bytes());\n    body.extend_from_slice(&(value.len() as u32).to_le_bytes());\n    body.extend_from_slice(key);\n    body.extend_from_slice(value);\n    let mut out = checksum(&body).to_le_bytes().to_vec();\n    out.extend(body);\n    out\n}\n\npub fn decode(buf: &[u8]) -> Result<Option<(Record, usize)>, String> {\n    const HEADER: usize = 13;\n    if buf.len() < HEADER {\n        return Ok(None);\n    }\n    let u32_at = |i: usize| u32::from_le_bytes(buf[i..i + 4].try_into().unwrap()) as usize;\n    let (crc, kind, klen, vlen) = (u32_at(0) as u32, buf[4], u32_at(5), u32_at(9));\n    let total = HEADER + klen + vlen;\n    if buf.len() < total {\n        return Ok(None); // torn write at the end of the log\n    }\n    if checksum(&buf[4..total]) != crc {\n        return Err(\"checksum mismatch\".into());\n    }\n    let key = buf[HEADER..HEADER + klen].to_vec();\n    let rec = match kind {\n        1 => Record::Set { key, value: buf[HEADER + klen..total].to_vec() },\n        2 => Record::Remove { key },\n        k => return Err(format!(\"unknown record kind {k}\")),\n    };\n    Ok(Some((rec, total)))\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn round_trip_truncated_corrupted() {\n        let r = Record::Set { key: b\"k\".to_vec(), value: b\"value\".to_vec() };\n        let bytes = encode(&r);\n        assert_eq!(decode(&bytes).unwrap(), Some((r, bytes.len())));\n        assert_eq!(decode(&bytes[..bytes.len() - 1]).unwrap(), None);\n        let mut bad = bytes.clone();\n        bad[15] ^= 0xFF;\n        assert!(decode(&bad).is_err());\n    }\n}","explain":"Distinguishing \"not enough bytes\" from \"bytes are wrong\" is what lets the store recover after a crash, truncate the torn tail and keep everything before it. Little-endian byte order is fixed so files move between machines."},"W2.1b":{"lang":"text","hints":["On startup, replay the log from the beginning to rebuild the index.","Compaction writes only live keys to a new file, then atomically renames it over the old one.","A write is durable only after the file is flushed and synced with sync_data."],"solution":"# kvlog design\nLog: append-only file of records [crc][kind][klen][vlen][key][value].\nIndex: HashMap<Vec<u8>, u64> from key to the offset of its latest Set.\nStartup: read records from offset 0, applying Set and Remove to the\nindex; stop at the first torn or corrupt record and truncate there.\nGet: look up the offset, seek, decode one record.\nCompaction: when dead bytes exceed 50% of the file, write every live\nkey to kvlog.compact, fsync it, rename it over kvlog.data, reopen.\nDurability: set returns after write_all; with --sync it also calls\nsync_data, surviving power loss at the cost of speed.","explain":"Design notes like this are what interviewers love to discuss, because they show you understand the trade-offs (speed versus durability, space versus write amplification), not only the code."}}},"W2.2":{"example":{"title":"Opening and replaying the log","lang":"rust","note":"This simplified version keeps values in memory to show the replay idea; the exercise version stores only offsets and reads values from disk, which is what lets Bitcask hold more data than fits in RAM. Opening in append mode guarantees every write goes to the end of the file.","code":"use std::collections::HashMap;\nuse std::fs::{File, OpenOptions};\nuse std::io::{self, Read, Seek, SeekFrom, Write};\nuse std::path::Path;\n\npub struct KvLog { file: File, index: HashMap<Vec<u8>, Vec<u8>> }\n\nimpl KvLog {\n    pub fn open(path: &Path) -> io::Result<Self> {\n        let mut file = OpenOptions::new().read(true).append(true).create(true).open(path)?;\n        let mut buf = Vec::new();\n        file.seek(SeekFrom::Start(0))?;\n        file.read_to_end(&mut buf)?;\n        let mut index = HashMap::new();\n        let mut pos = 0;\n        // Simplified format for this example: [klen u32][vlen u32][key][value], vlen u32::MAX = remove\n        while pos + 8 <= buf.len() {\n            let klen = u32::from_le_bytes(buf[pos..pos + 4].try_into().unwrap()) as usize;\n            let vlen = u32::from_le_bytes(buf[pos + 4..pos + 8].try_into().unwrap());\n            let vbytes = if vlen == u32::MAX { 0 } else { vlen as usize };\n            if pos + 8 + klen + vbytes > buf.len() { break; } // torn tail\n            let key = buf[pos + 8..pos + 8 + klen].to_vec();\n            if vlen == u32::MAX { index.remove(&key); } else { index.insert(key, buf[pos + 8 + klen..pos + 8 + klen + vbytes].to_vec()); }\n            pos += 8 + klen + vbytes;\n        }\n        Ok(KvLog { file, index })\n    }\n\n    pub fn set(&mut self, key: &[u8], value: &[u8]) -> io::Result<()> {\n        let mut rec = (key.len() as u32).to_le_bytes().to_vec();\n        rec.extend((value.len() as u32).to_le_bytes());\n        rec.extend(key);\n        rec.extend(value);\n        self.file.write_all(&rec)?;\n        self.index.insert(key.to_vec(), value.to_vec());\n        Ok(())\n    }\n\n    pub fn get(&self, key: &[u8]) -> Option<&[u8]> { self.index.get(key).map(|v| v.as_slice()) }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn survives_reopen() {\n        let path = std::env::temp_dir().join(\"kvlog_example_test.log\");\n        let _ = std::fs::remove_file(&path);\n        {\n            let mut kv = KvLog::open(&path).unwrap();\n            kv.set(b\"lang\", b\"rust\").unwrap();\n            kv.set(b\"lang\", b\"Rust 2024\").unwrap();\n        }\n        let kv = KvLog::open(&path).unwrap();\n        assert_eq!(kv.get(b\"lang\"), Some(&b\"Rust 2024\"[..]));\n    }\n}","output":""},"exercises":{"W2.2a":{"lang":"rust","hints":["Keep index HashMap<Vec<u8>, u64> pointing at the start of each key's latest record.","Before appending, get the offset with file.seek(SeekFrom::End(0)).","To test recovery, append a few garbage bytes to the file before reopening; open should ignore them."],"solution":"use std::collections::HashMap;\nuse std::fs::{File, OpenOptions};\nuse std::io::{self, Read, Seek, SeekFrom, Write};\nuse std::path::Path;\n\nfn checksum(body: &[u8]) -> u32 { body.iter().fold(0u32, |h, &b| h.rotate_left(5) ^ b as u32) }\n\nfn encode(kind: u8, key: &[u8], value: &[u8]) -> Vec<u8> {\n    let mut body = vec![kind];\n    body.extend((key.len() as u32).to_le_bytes());\n    body.extend((value.len() as u32).to_le_bytes());\n    body.extend(key);\n    body.extend(value);\n    let mut out = checksum(&body).to_le_bytes().to_vec();\n    out.extend(body);\n    out\n}\n\n/// Returns (kind, key, value, total_len) or None if incomplete or corrupt.\nfn decode(buf: &[u8]) -> Option<(u8, Vec<u8>, Vec<u8>, usize)> {\n    if buf.len() < 13 { return None; }\n    let n = |i: usize| u32::from_le_bytes(buf[i..i + 4].try_into().unwrap()) as usize;\n    let (klen, vlen) = (n(5), n(9));\n    let total = 13 + klen + vlen;\n    if buf.len() < total || checksum(&buf[4..total]) != n(0) as u32 { return None; }\n    Some((buf[4], buf[13..13 + klen].to_vec(), buf[13 + klen..total].to_vec(), total))\n}\n\npub struct KvStore { file: File, index: HashMap<Vec<u8>, u64> }\n\nimpl KvStore {\n    pub fn open(path: &Path) -> io::Result<Self> {\n        let mut file = OpenOptions::new().read(true).append(true).create(true).open(path)?;\n        let mut buf = Vec::new();\n        file.seek(SeekFrom::Start(0))?;\n        file.read_to_end(&mut buf)?;\n        let mut index = HashMap::new();\n        let mut pos = 0usize;\n        while let Some((kind, key, _, total)) = decode(&buf[pos..]) {\n            if kind == 1 { index.insert(key, pos as u64); } else { index.remove(&key); }\n            pos += total;\n        }\n        if pos < buf.len() {\n            file.set_len(pos as u64)?; // drop a torn or corrupt tail\n        }\n        Ok(KvStore { file, index })\n    }\n\n    fn append(&mut self, rec: &[u8]) -> io::Result<u64> {\n        let offset = self.file.seek(SeekFrom::End(0))?;\n        self.file.write_all(rec)?;\n        Ok(offset)\n    }\n\n    pub fn set(&mut self, key: &[u8], value: &[u8]) -> io::Result<()> {\n        let off = self.append(&encode(1, key, value))?;\n        self.index.insert(key.to_vec(), off);\n        Ok(())\n    }\n\n    pub fn remove(&mut self, key: &[u8]) -> io::Result<bool> {\n        if self.index.remove(key).is_none() { return Ok(false); }\n        self.append(&encode(2, key, &[]))?;\n        Ok(true)\n    }\n\n    pub fn get(&mut self, key: &[u8]) -> io::Result<Option<Vec<u8>>> {\n        let Some(&off) = self.index.get(key) else { return Ok(None) };\n        self.file.seek(SeekFrom::Start(off))?;\n        let mut header = [0u8; 13];\n        self.file.read_exact(&mut header)?;\n        let klen = u32::from_le_bytes(header[5..9].try_into().unwrap()) as usize;\n        let vlen = u32::from_le_bytes(header[9..13].try_into().unwrap()) as usize;\n        let mut rest = vec![0u8; klen + vlen];\n        self.file.read_exact(&mut rest)?;\n        Ok(Some(rest[klen..].to_vec()))\n    }\n\n    pub fn len(&self) -> usize { self.index.len() }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    fn tmp(name: &str) -> std::path::PathBuf {\n        let p = std::env::temp_dir().join(name);\n        let _ = std::fs::remove_file(&p);\n        p\n    }\n\n    #[test]\n    fn persists_and_removes() {\n        let p = tmp(\"kvstore_persist.log\");\n        {\n            let mut kv = KvStore::open(&p).unwrap();\n            kv.set(b\"a\", b\"1\").unwrap();\n            kv.set(b\"b\", b\"2\").unwrap();\n            kv.set(b\"a\", b\"3\").unwrap();\n            assert!(kv.remove(b\"b\").unwrap());\n        }\n        let mut kv = KvStore::open(&p).unwrap();\n        assert_eq!(kv.get(b\"a\").unwrap(), Some(b\"3\".to_vec()));\n        assert_eq!(kv.get(b\"b\").unwrap(), None);\n        assert_eq!(kv.len(), 1);\n    }\n\n    #[test]\n    fn recovers_from_torn_tail() {\n        let p = tmp(\"kvstore_torn.log\");\n        {\n            let mut kv = KvStore::open(&p).unwrap();\n            kv.set(b\"k\", b\"v\").unwrap();\n        }\n        let mut f = OpenOptions::new().append(true).open(&p).unwrap();\n        f.write_all(&[9, 9, 9, 9, 1, 50, 0]).unwrap(); // half a record\n        drop(f);\n        let mut kv = KvStore::open(&p).unwrap();\n        assert_eq!(kv.get(b\"k\").unwrap(), Some(b\"v\".to_vec()));\n        kv.set(b\"k2\", b\"v2\").unwrap();\n        drop(kv);\n        let mut kv = KvStore::open(&p).unwrap();\n        assert_eq!(kv.get(b\"k2\").unwrap(), Some(b\"v2\".to_vec()), \"writes after recovery are readable\");\n    }\n}","explain":"Truncating the torn tail on open is what makes later appends land right after the last good record; without it, new data would follow the garbage and be unreachable. The recovery test simulates a crash mid-write, the kind of test most storage bugs hide behind."},"W2.2b":{"lang":"rust","hints":["Read each live value with get, write records into path.with_extension(\"compact\").","Call sync_all on the new file before std::fs::rename.","Reopen the store from the original path to rebuild the index and file handle."],"solution":"impl KvStore {\n    pub fn compact(&mut self, path: &Path) -> io::Result<()> {\n        let tmp_path = path.with_extension(\"compact\");\n        let mut out = File::create(&tmp_path)?;\n        let keys: Vec<Vec<u8>> = self.index.keys().cloned().collect();\n        for key in keys {\n            if let Some(value) = self.get(&key)? {\n                out.write_all(&encode(1, &key, &value))?;\n            }\n        }\n        out.sync_all()?;                   // the new file is safely on disk\n        drop(out);\n        std::fs::rename(&tmp_path, path)?; // atomic replace on the same filesystem\n        *self = KvStore::open(path)?;      // reload index and file handle\n        Ok(())\n    }\n}\n\n#[test]\nfn compaction_shrinks_file() {\n    let p = std::env::temp_dir().join(\"kvstore_compact.log\");\n    let _ = std::fs::remove_file(&p);\n    let mut kv = KvStore::open(&p).unwrap();\n    for i in 0..1000 {\n        kv.set(b\"counter\", i.to_string().as_bytes()).unwrap();\n    }\n    let before = std::fs::metadata(&p).unwrap().len();\n    kv.compact(&p).unwrap();\n    let after = std::fs::metadata(&p).unwrap().len();\n    assert!(after < before / 100, \"{before} -> {after}\");\n    drop(kv);\n    let mut kv = KvStore::open(&p).unwrap();\n    assert_eq!(kv.get(b\"counter\").unwrap(), Some(b\"999\".to_vec()));\n}","explain":"Writing to a temporary file and renaming it means a crash during compaction leaves the old file intact; rename is atomic on the same filesystem. Overwrites of one key are the worst case for log growth, which is exactly what the test exercises."}}},"W2.3":{"example":{"title":"The command-line client","lang":"rust","note":"Exit code 1 for a missing key mirrors tools like grep and makes the CLI scriptable. The library and the CLI are separate crates (or a lib plus a bin), so others can embed the store directly.","code":"use clap::{Parser, Subcommand};\nuse std::path::PathBuf;\n\n#[derive(Parser)]\n#[command(name = \"kvlog\", version, about = \"A tiny log-structured key-value store\")]\nstruct Cli {\n    #[arg(long, default_value = \"kvlog.data\")]\n    path: PathBuf,\n    #[command(subcommand)]\n    cmd: Cmd,\n}\n\n#[derive(Subcommand)]\nenum Cmd { Set { key: String, value: String }, Get { key: String }, Rm { key: String }, Compact, Stats }\n\nfn main() -> anyhow::Result<()> {\n    let cli = Cli::parse();\n    let mut kv = kvlog::KvStore::open(&cli.path)?;\n    match cli.cmd {\n        Cmd::Set { key, value } => kv.set(key.as_bytes(), value.as_bytes())?,\n        Cmd::Get { key } => match kv.get(key.as_bytes())? {\n            Some(v) => println!(\"{}\", String::from_utf8_lossy(&v)),\n            None => { eprintln!(\"key not found\"); std::process::exit(1); }\n        },\n        Cmd::Rm { key } => if !kv.remove(key.as_bytes())? { eprintln!(\"key not found\"); std::process::exit(1); },\n        Cmd::Compact => kv.compact(&cli.path)?,\n        Cmd::Stats => println!(\"{} keys, {} bytes on disk\", kv.len(), std::fs::metadata(&cli.path)?.len()),\n    }\n    Ok(())\n}","output":""},"exercises":{"W2.3a":{"lang":"rust","hints":["Use a fresh temporary file per benchmark iteration group.","iter_batched lets you set up a store without timing the setup.","Expect syncing writes to be dramatically slower; that is the durability trade-off."],"solution":"use criterion::{criterion_group, criterion_main, BatchSize, Criterion};\nuse kvlog::KvStore;\n\nfn keys() -> Vec<(Vec<u8>, Vec<u8>)> {\n    (0..10_000).map(|i| (format!(\"key-{i:012}\").into_bytes(), vec![b'x'; 100])).collect()\n}\n\nfn bench(c: &mut Criterion) {\n    let data = keys();\n    c.bench_function(\"set 10k\", |b| {\n        b.iter_batched(\n            || {\n                let p = tempfile::NamedTempFile::new().unwrap().into_temp_path();\n                KvStore::open(&p).unwrap()\n            },\n            |mut kv| for (k, v) in &data { kv.set(k, v).unwrap(); },\n            BatchSize::PerIteration,\n        )\n    });\n    let p = tempfile::NamedTempFile::new().unwrap().into_temp_path();\n    let mut kv = KvStore::open(&p).unwrap();\n    for (k, v) in &data { kv.set(k, v).unwrap(); }\n    c.bench_function(\"get 10k\", |b| b.iter(|| for (k, _) in &data { kv.get(k).unwrap(); }));\n}\n\ncriterion_group!(benches, bench);\ncriterion_main!(benches);","explain":"Reporting both numbers honestly (fast but not crash-proof versus durable but slower) is exactly how real databases document their settings."},"W2.3b":{"lang":"text","hints":["Be explicit that two processes must not open the same file at once, or add a lock file.","Link DESIGN.md from the README.","Run cargo publish --dry-run first."],"solution":"## Guarantees\n- A completed `set` is never lost by a process crash.\n- With `--sync`, a completed `set` also survives power loss.\n- A torn final record is detected by checksum and dropped on open.\n\n## Limits\n- One process at a time per data file (no locking yet).\n- All keys must fit in memory; values live on disk.\n\n## Benchmarks (10k keys, 100-byte values, NVMe SSD)\n| operation      | time     |\n|----------------|----------|\n| set (no sync)  | [x] ms   |\n| set (sync)     | [y] s    |\n| get            | [z] ms   |","explain":"Clear guarantees and limits show engineering maturity, and they are what a reviewer reads first to decide whether to trust a storage library."}}},"W3.1":{"example":{"title":"The rules in one function","lang":"rust","note":"Four rules, one match. Keeping the rules in a pure function makes them trivial to test before any WebAssembly is involved. #[repr(u8)]-style values (0 and 1) let JavaScript read cells directly from WASM memory later.","code":"#[derive(Clone, Copy, PartialEq, Debug)]\npub enum Cell { Dead = 0, Alive = 1 }\n\n/// The next state of one cell given its current state and live neighbour count.\npub fn next(cell: Cell, live_neighbours: u8) -> Cell {\n    match (cell, live_neighbours) {\n        (Cell::Alive, n) if n < 2 => Cell::Dead,     // underpopulation\n        (Cell::Alive, 2) | (Cell::Alive, 3) => Cell::Alive,\n        (Cell::Alive, n) if n > 3 => Cell::Dead,     // overpopulation\n        (Cell::Dead, 3) => Cell::Alive,              // reproduction\n        (state, _) => state,\n    }\n}\n\nfn main() {\n    for n in 0..=4 {\n        println!(\"alive with {n}: {:?}, dead with {n}: {:?}\", next(Cell::Alive, n), next(Cell::Dead, n));\n    }\n}","output":"alive with 0: Dead, dead with 0: Dead\nalive with 1: Dead, dead with 1: Dead\nalive with 2: Alive, dead with 2: Dead\nalive with 3: Alive, dead with 3: Alive\nalive with 4: Dead, dead with 4: Dead"},"exercises":{"W3.1a":{"lang":"rust","hints":["The index of (row, col) in a flat grid is row * width + col.","For wrapping, the row above row 0 is height - 1: (row + height - 1) % height.","Skip the cell itself when counting the 3 by 3 block."],"solution":"pub fn live_neighbours(cells: &[u8], width: usize, height: usize, row: usize, col: usize) -> u8 {\n    let mut count = 0;\n    for dr in [height - 1, 0, 1] {\n        for dc in [width - 1, 0, 1] {\n            if dr == 0 && dc == 0 {\n                continue;\n            }\n            let r = (row + dr) % height;\n            let c = (col + dc) % width;\n            count += cells[r * width + c];\n        }\n    }\n    count\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn wraps_corners() {\n        // 3x3 grid with only the bottom-right cell alive\n        let cells = [0, 0, 0, 0, 0, 0, 0, 0, 1];\n        assert_eq!(live_neighbours(&cells, 3, 3, 0, 0), 1, \"the top-left wraps to the bottom-right\");\n        assert_eq!(live_neighbours(&cells, 3, 3, 2, 2), 0, \"a cell does not count itself\");\n    }\n}","explain":"Wrapping lets gliders fly forever, which looks good in a demo, while a fixed border makes them die at the edge. Adding height - 1 instead of subtracting 1 avoids underflow on unsigned indexes, the same trick the official Rust and WebAssembly book uses."},"W3.1b":{"lang":"text","hints":["JavaScript can read WASM memory directly through a pointer to the cells buffer.","Rust owns the simulation; JS owns the canvas, timing and mouse clicks.","Copying the whole grid every frame works but scales poorly."],"solution":"Rust (wasm-bindgen exports):\n  Universe::new(width, height)       random or patterned start\n  tick()                             advance one generation\n  toggle(row, col)                   flip a cell on click\n  width(), height()\n  cells_ptr() -> *const u8           pointer into WASM memory\nJavaScript:\n  requestAnimationFrame loop: tick(), then draw from\n  new Uint8Array(memory.buffer, cells_ptr(), width * height)\n  canvas clicks -> toggle(row, col)\n  buttons: play/pause, step, clear, speed slider","explain":"Reading cells straight from WASM memory avoids serialising the grid every frame, which is the main performance lesson of the official tutorial."}}},"W3.2":{"example":{"title":"Testing patterns natively","lang":"rust","note":"Known patterns make perfect test oracles. A blinker returns to its start every two generations, and a glider reappears one cell down and right every four. These tests run natively in milliseconds, long before any browser is involved.","code":"pub struct Universe { width: usize, height: usize, cells: Vec<u8> }\n\nimpl Universe {\n    pub fn from_pattern(width: usize, height: usize, live: &[(usize, usize)]) -> Self {\n        let mut cells = vec![0; width * height];\n        for &(r, c) in live { cells[r * width + c] = 1; }\n        Universe { width, height, cells }\n    }\n\n    fn neighbours(&self, row: usize, col: usize) -> u8 {\n        let (w, h) = (self.width, self.height);\n        let mut n = 0;\n        for dr in [h - 1, 0, 1] {\n            for dc in [w - 1, 0, 1] {\n                if dr == 0 && dc == 0 { continue; }\n                n += self.cells[((row + dr) % h) * w + (col + dc) % w];\n            }\n        }\n        n\n    }\n\n    pub fn tick(&mut self) {\n        let mut next = self.cells.clone();\n        for r in 0..self.height {\n            for c in 0..self.width {\n                let i = r * self.width + c;\n                next[i] = match (self.cells[i], self.neighbours(r, c)) {\n                    (1, 2) | (1, 3) | (0, 3) => 1,\n                    _ => 0,\n                };\n            }\n        }\n        self.cells = next;\n    }\n\n    pub fn live(&self) -> Vec<(usize, usize)> {\n        (0..self.cells.len()).filter(|&i| self.cells[i] == 1).map(|i| (i / self.width, i % self.width)).collect()\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn blinker_oscillates() {\n        let mut u = Universe::from_pattern(5, 5, &[(2, 1), (2, 2), (2, 3)]);\n        u.tick();\n        assert_eq!(u.live(), vec![(1, 2), (2, 2), (3, 2)]);\n        u.tick();\n        assert_eq!(u.live(), vec![(2, 1), (2, 2), (2, 3)]);\n    }\n\n    #[test]\n    fn glider_moves_diagonally() {\n        let start = [(0, 1), (1, 2), (2, 0), (2, 1), (2, 2)];\n        let mut u = Universe::from_pattern(8, 8, &start);\n        for _ in 0..4 { u.tick(); }\n        let mut moved: Vec<_> = start.iter().map(|&(r, c)| (r + 1, c + 1)).collect();\n        moved.sort();\n        assert_eq!(u.live(), moved);\n    }\n}","output":""},"exercises":{"W3.2a":{"lang":"rust","hints":["A tiny xorshift generator from a u32 seed is enough for a random start.","cells_ptr returns self.cells.as_ptr().","Methods called from JavaScript must take and return simple types."],"solution":"use wasm_bindgen::prelude::*;\n\n#[wasm_bindgen]\npub struct Universe { width: u32, height: u32, cells: Vec<u8> }\n\nfn xorshift(state: &mut u32) -> u32 {\n    *state ^= *state << 13;\n    *state ^= *state >> 17;\n    *state ^= *state << 5;\n    *state\n}\n\n#[wasm_bindgen]\nimpl Universe {\n    #[wasm_bindgen(constructor)]\n    pub fn new(width: u32, height: u32, seed: u32) -> Universe {\n        let mut s = seed.max(1);\n        let cells = (0..width * height).map(|_| (xorshift(&mut s) % 4 == 0) as u8).collect();\n        Universe { width, height, cells }\n    }\n    pub fn width(&self) -> u32 { self.width }\n    pub fn height(&self) -> u32 { self.height }\n    pub fn cells_ptr(&self) -> *const u8 { self.cells.as_ptr() }\n    pub fn toggle(&mut self, row: u32, col: u32) {\n        let i = (row * self.width + col) as usize;\n        self.cells[i] ^= 1;\n    }\n    pub fn tick(&mut self) {\n        let (w, h) = (self.width as usize, self.height as usize);\n        let old = &self.cells;\n        let next: Vec<u8> = (0..w * h)\n            .map(|i| {\n                let (r, c) = (i / w, i % w);\n                let mut n = 0;\n                for dr in [h - 1, 0, 1] {\n                    for dc in [w - 1, 0, 1] {\n                        if dr != 0 || dc != 0 {\n                            n += old[((r + dr) % h) * w + (c + dc) % w];\n                        }\n                    }\n                }\n                matches!((old[i], n), (1, 2) | (1, 3) | (0, 3)) as u8\n            })\n            .collect();\n        self.cells = next;\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn deterministic_seed_and_toggle() {\n        let a = Universe::new(16, 16, 42);\n        let b = Universe::new(16, 16, 42);\n        assert_eq!(a.cells, b.cells);\n        let mut u = Universe::new(4, 4, 7);\n        let before = u.cells[5];\n        u.toggle(1, 1);\n        assert_ne!(u.cells[5], before);\n    }\n}","explain":"A seeded generator makes demos shareable (\"try seed 42\") and tests deterministic, and avoids pulling in a random crate that needs extra configuration for WebAssembly. The tests still run natively with cargo test."},"W3.2b":{"lang":"text","hints":["import init, { Universe } from \"./pkg/lifewasm.js\"; const wasm = await init();","new Uint8Array(wasm.memory.buffer, u.cells_ptr(), w * h) views the cells without copying.","Convert a click to a cell with Math.floor(y / size) and Math.floor(x / size)."],"solution":"<canvas id=\"c\"><\/canvas>\n<button id=\"play\">Play<\/button> <button id=\"step\">Step<\/button>\n<script type=\"module\">\n  import init, { Universe } from \"./pkg/lifewasm.js\";\n  const wasm = await init();\n  const size = 6, u = new Universe(96, 64, 42), w = u.width(), h = u.height();\n  const canvas = document.getElementById(\"c\"), ctx = canvas.getContext(\"2d\");\n  canvas.width = w * size; canvas.height = h * size;\n  let running = false;\n\n  function draw() {\n    const cells = new Uint8Array(wasm.memory.buffer, u.cells_ptr(), w * h);\n    ctx.fillStyle = \"#111\"; ctx.fillRect(0, 0, canvas.width, canvas.height);\n    ctx.fillStyle = \"#e8834f\";\n    for (let i = 0; i < cells.length; i++) {\n      if (cells[i]) ctx.fillRect((i % w) * size, Math.floor(i / w) * size, size - 1, size - 1);\n    }\n  }\n  function loop() { if (running) { u.tick(); draw(); requestAnimationFrame(loop); } }\n\n  document.getElementById(\"play\").onclick = (e) => {\n    running = !running; e.target.textContent = running ? \"Pause\" : \"Play\"; loop();\n  };\n  document.getElementById(\"step\").onclick = () => { u.tick(); draw(); };\n  canvas.onclick = (e) => {\n    const r = canvas.getBoundingClientRect();\n    u.toggle(Math.floor((e.clientY - r.top) / size), Math.floor((e.clientX - r.left) / size));\n    draw();\n  };\n  draw();\n<\/script>","explain":"Creating the Uint8Array view each frame matters, because WASM memory can grow and replace its buffer, which would leave an old view pointing at detached memory."}}},"W3.3":{"example":{"title":"Deploying to GitHub Pages","lang":"yaml","note":"Every push to main runs the native tests, builds the WebAssembly package and publishes the www folder, so the live demo always matches the code. A clickable demo link at the top of the README is the single most effective thing for a portfolio project.","code":"# .github/workflows/pages.yml\nname: Deploy demo\non:\n  push:\n    branches: [main]\npermissions:\n  contents: read\n  pages: write\n  id-token: write\njobs:\n  deploy:\n    runs-on: ubuntu-latest\n    environment: github-pages\n    steps:\n      - uses: actions/checkout@v4\n      - uses: dtolnay/rust-toolchain@stable\n        with:\n          targets: wasm32-unknown-unknown\n      - run: cargo install wasm-pack\n      - run: cargo test\n      - run: wasm-pack build --release --target web --out-dir www/pkg\n      - uses: actions/upload-pages-artifact@v3\n        with:\n          path: www\n      - uses: actions/deploy-pages@v4","output":""},"exercises":{"W3.3a":{"lang":"toml","hints":["ls -l www/pkg/*.wasm shows the size.","wasm-pack runs wasm-opt automatically when it is installed.","Avoid formatting machinery (format!, panics with messages) in hot code if size matters."],"solution":"[profile.release]\nopt-level = \"z\"     # optimise for size\nlto = true\ncodegen-units = 1\npanic = \"abort\"\n\n# before: lifewasm_bg.wasm  ~30 KB\n# after:  lifewasm_bg.wasm  ~15 KB (exact numbers vary)","explain":"Smaller WebAssembly loads faster, especially on phones. Optimising for size is often nearly free here because the simulation loop is tiny."},"W3.3b":{"lang":"text","hints":["Record a short screen capture and convert it to a GIF under 2 MB.","Measure frames per second with performance.now() in the loop.","Mention the pattern-based tests; they show engineering discipline beyond the visual demo."],"solution":"# lifewasm\nConway's Game of Life in Rust, compiled to WebAssembly.\n**Live demo:** https://your-name.github.io/lifewasm\n\n![glider gun](docs/glider-gun.gif)\n\n## How it works\nThe universe lives in Rust; each frame JavaScript calls tick() and\ndraws straight from WASM memory through a Uint8Array view, so no\ndata is copied across the boundary.\n\n## Build\n    cargo test\n    wasm-pack build --release --target web --out-dir www/pkg\n    python -m http.server -d www\n\n## Tests\nBlinker and glider patterns are checked natively against their\nknown periods.","explain":"A live demo plus a clear explanation of a real engineering choice (zero-copy memory access) gives interviewers something to try and something to ask about."}}}},"recaps":{"a1":{"summary":["Rust offers memory safety without garbage collection, high performance and compile-time data race prevention.","A professional setup uses rust-analyzer in the editor, cargo fmt, cargo clippy and cargo test, ideally in CI.","Vec works as a stack; peekable iterators simplify scanning text.","Enums with Box model trees, and matching on tuples models state machines."],"functions":[["cargo fmt","Format the project."],["cargo clippy -- -D warnings","Lint and fail on any warning."],["iter.peekable() / it.peek()","Look ahead without consuming."],["match (state, event)","Handle every combination explicitly."]],"next":"A02 tours the standard collections, including the ones Track 1 did not cover."},"a2":{"summary":["Vec is the default list and stack; with_capacity avoids reallocations.","VecDeque is a ring buffer queue with O(1) work at both ends.","HashMap and HashSet need Hash and Eq keys; tuples and derived structs work.","BTreeMap and BTreeSet keep keys sorted and support range queries.","BinaryHeap is a max-heap priority queue; Reverse turns it into a min-heap."],"functions":[["Vec::with_capacity(n)","Preallocate room."],["VecDeque::push_back / pop_front","Queue operations."],["#[derive(Hash, PartialEq, Eq)]","Make a type usable as a hash key."],["a.intersection(&b) / a.union(&b)","Set algebra."],["btree.range(a..b)","Iterate keys in a range, in order."],["BinaryHeap::push / pop / peek","Priority queue operations."],["std::cmp::Reverse(x)","Invert ordering, for min-heaps."]],"next":"A03 goes deeper into ownership, the stack and heap, and lifetimes."},"a3":{"summary":["Stack values have a size known at compile time; heap data is reached through pointers such as Box, String and Vec.","Moves copy only the stack part; clones copy the heap data too.","The niche optimisation makes Option of a non-null pointer free.","Split borrows, mem::take and mem::replace, append and Cow solve most \"cannot borrow\" situations without clones.","Name lifetimes when the output borrows from a struct's data rather than from self; T: 'static means no short-lived references."],"functions":[["std::mem::size_of::<T>()","The size of a type in bytes."],["std::mem::take(&mut x)","Move out, leaving the default value."],["std::mem::replace(&mut x, new)","Swap in a new value, returning the old."],["vec.append(&mut other)","Move every element across."],["Cow::Borrowed / Cow::Owned","Borrow when possible, own when necessary."],["\"T: 'static\"","A type with no expiring references."]],"next":"A04 designs proper error types for libraries and applications."},"a4":{"summary":["Model failures as an enum with one variant per case so callers can match and act.","Implement Display for humans, Error with source for the cause chain, and From so ? converts.","thiserror derives all of that and suits libraries.","anyhow suits applications, adding context and printing whole chains; downcast when you must."],"functions":[["impl std::error::Error for E","Make a type a standard error."],["fn source(&self)","Return the underlying cause."],["#[derive(thiserror::Error)] #[error(\"...\")]","Derive Display and Error."],["#[from]","Derive From and set the source."],["anyhow::Result<T>","A Result with a catch-all error type."],[".context(\"msg\") / .with_context(|| ...)","Add what you were doing."],["bail!(\"msg\")","Return early with an error."],["err.downcast_ref::<T>()","Recover a concrete error type."]],"next":"A05 deepens traits and generics, including type-level programming."},"a5":{"summary":["Use IntoIterator and associated types to write APIs that accept many kinds of input.","Associated types give each implementation exactly one related type, keeping signatures short.","From, TryFrom, FromStr, AsRef and Default integrate your types with the standard library.","Ord, PartialOrd, Eq and Hash must agree; tuple comparisons give correct field-by-field ordering.","PhantomData typestate and const generics move rule checks to compile time at no run-time cost."],"functions":[["I: IntoIterator, I::Item: Bound","Generic over anything iterable."],["trait T { type Item; }","An associated type."],["impl FromStr for T","Enable .parse()."],["impl TryFrom<X> for T","A fallible conversion."],["P: AsRef<Path>","Accept many path-like types."],["PhantomData<S>","A zero-sized marker for typestate."],["struct M<const N: usize>","A const generic parameter."]],"next":"A06 covers modules, dependencies, features and documentation the way professional crates do it."},"a6":{"summary":["Keep the public API small; use pub(crate) and pub(super) for internal sharing and a prelude for convenience.","Version requirements accept compatible releases; Cargo.lock pins them; cargo update moves within the range.","Optional dependencies and additive features keep builds lean; test every feature combination you support.","cargo tree and cargo audit show and check what you depend on.","Doc comments with tested examples, intra-doc links and missing_docs make documentation reliable."],"functions":[["pub(crate) / pub(super)","Restricted visibility."],["[dev-dependencies]","Dependencies for tests and benches."],["optional = true / \"dep:name\"","An optional dependency behind a feature."],["#[cfg(feature = \"x\")]","Compile code only when a feature is on."],["cargo tree / cargo audit","Inspect and check dependencies."],["[`Item`]","An intra-doc link."],["#![warn(missing_docs)]","Warn about undocumented public items."]],"next":"A07 goes deep on concurrency, from scoped threads to atomics and data parallelism."},"a7":{"summary":["RwLock suits read-heavy shared data; Condvar lets threads wait for a condition; LazyLock and OnceLock initialise globals once.","Copy values out of guards and release locks before slow work such as I/O.","Atomics change single values without locks; Relaxed for counters, Acquire/Release to publish data, SeqCst when unsure.","compare_exchange is the building block for lock-free claims and updates.","rayon parallelises iterator chains safely; measure, because small workloads can get slower."],"functions":[["RwLock::read() / write()","Shared or exclusive access."],["cvar.wait(guard) / notify_one()","Wait for and signal a condition."],["LazyLock::new(|| ...)","A value initialised on first use."],["AtomicU64::fetch_add(1, Relaxed)","Lock-free increment."],["compare_exchange(old, new, ..)","Write only if the value is old."],["v.par_iter() / into_par_iter()","A parallel iterator (rayon)."],[".fold(init, f).reduce(init, merge)","Per-thread accumulation, then merge."]],"next":"A08 covers the async ecosystem in depth with Tokio."},"a8":{"summary":["JoinSet manages groups of tasks and yields results as they finish; bound concurrency by awaiting before spawning more.","spawn_blocking keeps CPU-heavy and blocking work off the async worker threads.","Tokio's TcpListener and TcpStream, into_split and BufReader lines build servers with one task per connection.","Use std's Mutex only when no await happens while locked; otherwise tokio::sync::Mutex.","Semaphore limits concurrency; broadcast fans events out; watch carries a shutdown flag to every task."],"functions":[["JoinSet::spawn / join_next","Manage a group of tasks."],["tokio::task::spawn_blocking(f)","Run blocking work on a separate pool."],["TcpListener::bind / accept","Accept async connections."],["stream.into_split()","Separate read and write halves."],["BufReader::new(r).lines().next_line()","Read lines asynchronously."],["Semaphore::new(n) / acquire_owned()","Limit concurrency."],["broadcast::channel / watch::channel","Fan-out events; share latest state."],["tokio::signal::ctrl_c()","Wait for Ctrl+C."]],"next":"A09 explores macros and metaprogramming."},"a9":{"summary":["macro_rules! macros match token patterns with fragment specifiers and repetitions, and expand to ordinary code.","Internal @rules, recursion and tt munching handle complex inputs; $crate keeps exported macros robust.","Procedural macros live in proc-macro crates, parse input with syn and generate code with quote.","Good macros report errors with precise spans; cargo expand shows what they generate.","Use macros to generate items or define DSLs, and prefer functions and builders otherwise."],"functions":[["$x:expr / $i:ident / $t:ty / $t:tt","Common fragment specifiers."],["$( ... ),* / $( ... )+","Zero-or-more and one-or-more repetitions."],["#[macro_export] / $crate::path","Export a macro and refer to your own crate."],["#[proc_macro_derive(Name)]","Define a derive macro."],["parse_macro_input!(input as DeriveInput)","Parse tokens with syn."],["quote! { ... #var ... }","Generate tokens."],["cargo expand","Show macro-expanded code."]],"next":"A10 covers testing strategy, debugging and performance work."},"a10":{"summary":["Depend on traits for clocks, randomness, network and mail so tests can inject fakes, spies and seeded generators.","Property-based tests state rules for all inputs; proptest generates, shrinks and remembers failing cases.","Round-trip and oracle properties are the most productive to start with.","tracing gives structured, span-aware logs; rust-gdb, rust-lldb and editor debuggers understand Rust types.","Benchmark with criterion and profile with flamegraphs before optimising."],"functions":[["trait Clock { fn now(&self) }","A seam for injecting test doubles."],["proptest! { fn p(x in strategy) }","A property-based test."],["prop::collection::vec(any::<T>(), 0..n)","Generate vectors."],["StdRng::seed_from_u64(n)","A reproducible random generator."],["#[instrument] / info!(field, \"msg\")","Structured tracing."],["criterion_group! / criterion_main!","Define benchmarks."],["cargo flamegraph","Profile where time is spent."]],"next":"A11 tours the ecosystem crates for data, command lines and HTTP."},"a11":{"summary":["serde derives turn structs and enums into JSON, TOML and many other formats, with rename, default, optional and tagged forms.","clap's derive API builds arguments, options, subcommands, validation and help from types and doc comments.","Make CLIs testable with try_parse_from, and report outcomes with stderr and exit codes.","reqwest makes HTTP calls with JSON decoding, timeouts and headers; reuse one Client and call error_for_status.","buffer_unordered limits concurrent requests in a stream."],"functions":[["#[derive(Serialize, Deserialize)]","Make a type serialisable."],["serde_json::from_str / to_string","JSON in and out."],["toml::from_str","Parse TOML configuration."],["#[derive(Parser)] / Cli::parse()","Define and parse a CLI with clap."],["Cli::try_parse_from([...])","Parse arguments in tests."],["std::process::ExitCode","Return an exit status from main."],["client.get(url).send().await?.error_for_status()?.json().await?","The usual reqwest chain."],["stream::iter(xs).map(f).buffer_unordered(n)","Bounded concurrent futures."]],"next":"A12 covers web servers, databases, unsafe code with FFI, and WebAssembly."},"a12":{"summary":["axum handlers are async functions whose parameters are extractors; anything implementing IntoResponse can be returned; oneshot tests routers without a network.","rusqlite gives simple, safe SQLite access with parameters and RAII transactions; sqlx offers async, compile-time checked SQL for servers.","FFI uses extern blocks, CString and CStr, and extern \"C\" with no_mangle; wrap every unsafe call in a small safe API with SAFETY comments.","wasm-bindgen and wasm-pack compile Rust for the browser; the same code stays testable natively.","Tauri, Bevy, embedded-hal and Leptos extend the same skills to desktop, games, firmware and full-stack web."],"functions":[["Router::new().route(path, get(h).post(h))","Define axum routes."],["State<T> / Path<T> / Json<T>","Common axum extractors."],["app.oneshot(request)","Test a router without a server."],["conn.execute(sql, params![..])","Run SQL with safe parameters."],["conn.transaction()? / tx.commit()?","A transaction that rolls back on drop."],["unsafe extern \"C\" { fn f(..); }","Declare foreign functions."],["CString::new(s) / CStr::from_ptr(p)","Cross the C string boundary."],["#[wasm_bindgen]","Export a function or type to JavaScript."]],"explore":["Rebuild the Chapter 21 web server with axum and compare the amount of code.","Try a Tauri app that wraps one of your CLI tools with a simple window."],"next":"Track 2 is complete. Track 3 turns these skills into portfolio projects you can show employers."},"c1":{"summary":["rustup installs and updates Rust; rustc compiles; cargo builds, runs, tests and manages dependencies.","Every program starts in fn main, and println! is a macro that prints a line with {} placeholders.","cargo new creates a project with Cargo.toml and src/main.rs; cargo run builds and runs it.","cargo check is the fast way to find compile errors; cargo build --release makes the optimised program.","Compiler errors show the file, line and column with arrows; read them top to bottom."],"functions":[["rustup update","Update to the latest stable toolchain."],["rustup doc","Open the documentation installed with Rust."],["rustc file.rs","Compile one file into a program."],["cargo new name","Create a new project."],["cargo run","Build and run the project."],["cargo check","Check that the code compiles without building a program."],["cargo build --release","Build an optimised program into target/release."],["println!(\"{}\", x)","Print a line with values filled into the {} placeholders."]],"next":"The next chapter builds a complete small game, so you see variables, input, crates and loops working together before each one is explained in detail."},"c2":{"summary":["use brings items such as std::io and rand::Rng into scope.","Variables are immutable unless declared with mut; read_line needs a mutable String.","Functions that can fail return Result; expect crashes with a message, match lets you handle each case.","Crates are added under [dependencies] in Cargo.toml, and Cargo.lock pins the exact versions.","loop repeats forever until break; continue jumps to the next round.","Shadowing lets you reuse a name for a new value, often of a different type."],"functions":[["io::stdin().read_line(&mut s)","Read a line of input and append it to s."],["s.trim()","The string without spaces and newlines at either end."],["s.parse::<u32>()","Turn text into a number; returns a Result."],["rand::thread_rng().gen_range(1..=100)","A random number from 1 to 100."],["a.cmp(&b)","Compare two values and get Less, Greater or Equal."],["loop / break / continue","Repeat, stop, or skip to the next round."]],"explore":["Add a difficulty setting that changes the range to 1 to 10, 1 to 100 or 1 to 1000.","Show a hint such as \"very close\" when the guess is within 5 of the answer."],"next":"Chapter 3 slows down and explains each building block you just used, starting with variables and types."},"c3":{"summary":["Variables are immutable by default; mut allows change, and shadowing makes a new variable with the same name.","Constants use const, need a type, and are named in SCREAMING_SNAKE_CASE.","Scalar types are integers (i8 to i128, u8 to u128, isize, usize), f32 and f64, bool and char.","Tuples group mixed types; arrays hold a fixed number of one type and check every index.","Functions declare parameter and return types; the last expression without a semicolon is the return value.","if needs a bool and can be used as a value; loop can return a value with break; for is the safest way to loop."],"functions":[["let mut x = 0;","A variable you can change."],["const MAX: u32 = 100;","A compile-time constant."],["x.checked_add(y)","Add and get None on overflow."],["(a, b) = tuple / tuple.0","Destructure a tuple or read one field."],["[0; 5] / arr.len() / arr.get(i)","Repeat a value, count items, index without panicking."],["break value / 'label","Return a value from loop; break out of an outer loop."],["for i in (1..4).rev()","Loop over a range backwards."]],"next":"Chapter 4 explains ownership, the idea that makes Rust different from every language you have used before. Take it slowly."},"c4":{"summary":["Each value has exactly one owner, and the value is dropped when the owner goes out of scope.","Assigning or passing a heap value such as String moves it; clone makes a deep copy; Copy types are duplicated.","References borrow without owning; &T is shared and read-only, &mut T is exclusive and can change the value.","You may have one mutable reference or many shared ones at a time, never both; borrows end at their last use.","Slices (&str, &[T]) refer to part of existing data; prefer &str and &[T] parameters."],"functions":[["String::from(\"x\")","Create an owned, growable string."],["s.clone()","Deep copy of a value."],["&s / &mut s","Borrow shared or mutably."],["*r = value","Write through a mutable reference."],["&s[a..b]","Slice part of a string or array."],["s.as_bytes()","View a string as bytes."],["impl Drop","Run code when a value goes out of scope."]],"next":"With ownership in hand, Chapter 5 shows how to group related data into your own types with structs."},"c5":{"summary":["Structs group named fields; tuple structs have unnamed fields; unit-like structs have none.","Field init shorthand and ..other update syntax reduce repetition; update syntax can move fields.","#[derive(Debug)] enables {:?} and {:#?}; dbg! prints a value with its location and returns it.","Methods live in impl blocks and take &self, &mut self or self; associated functions have no self.","Self is an alias for the type inside its impl block, often used in constructors like new."],"functions":[["struct Name { field: Type }","Define a struct with named fields."],["struct Meters(f64);","Define a tuple struct (newtype)."],["Name { ..other }","Fill the remaining fields from another instance."],["#[derive(Debug)]","Generate Debug formatting."],["dbg!(expr)","Print an expression and its value to stderr."],["impl Name { fn m(&self) }","Add methods to a type."],["Name::new()","Call an associated function."]],"next":"Chapter 6 introduces enums, Rust's way of saying a value is one of several possibilities, and match to handle each one."},"c6":{"summary":["Enums list every possible variant of a value; each variant can carry its own data.","Option<T> is Some(T) or None and replaces null; you must handle None before using the value.","match compares a value against patterns in order and must be exhaustive.","Patterns can bind parts of a value; _ ignores, and a name catches everything else.","if let handles one pattern concisely; let...else binds or exits early."],"functions":[["enum E { A, B(i32), C { x: i32 } }","Define an enum with different variant shapes."],["Some(v) / None","The two variants of Option."],["match value { pattern => expr }","Handle each possible pattern."],["_ =>","Catch-all arm that ignores the value."],["if let Some(x) = opt","Run code only when the pattern matches."],["let Some(x) = opt else { return }","Bind or leave early."],["s.split_once('=')","Split a string at the first separator; returns an Option."]],"next":"Chapter 7 shows how to organise a growing program into modules, crates and packages."},"c7":{"summary":["A package (one Cargo.toml) contains crates; src/main.rs and src/lib.rs are crate roots.","mod creates modules that form a tree; items are private to their parent unless marked pub.","Paths can be absolute (crate::...) or relative (self, super); use brings them into scope.","pub use re-exports items so the public API can differ from the internal layout.","mod name; loads the module body from name.rs (or name/mod.rs) next to the parent file."],"functions":[["mod name { ... }","Define a module inline."],["mod name;","Load a module from name.rs."],["pub fn / pub struct / pub mod","Make an item visible outside its module."],["crate::a::b","Absolute path from the crate root."],["super::item","Path through the parent module."],["use a::b::{C, D as E};","Bring several names into scope, renaming one."],["pub use inner::thing;","Re-export a name."]],"next":"Chapter 8 covers the collections you will use in almost every program, vectors, strings and hash maps."},"c8":{"summary":["Vec<T> is a growable list; push, pop, index with [] (panics) or get (Option), and loop with & or &mut.","The borrow checker stops you from changing a vector while holding a reference into it.","String is UTF-8; build with push_str, + or format!, and work with chars() or bytes() instead of indexes.","HashMap<K, V> maps keys to values; inserting moves owned keys and values in.","The entry API (or_insert, or_default) handles insert-if-missing and update in one lookup."],"functions":[["vec![1, 2, 3] / Vec::new()","Create a vector."],["v.push(x) / v.pop()","Add to or remove from the end."],["v.get(i)","Read without panicking; returns Option."],["s.chars() / s.bytes()","Iterate over characters or bytes."],["format!(\"{a}-{b}\")","Build a String without taking ownership."],["map.entry(k).or_insert(v)","Get a mutable reference, inserting v if missing."],["map.get(&k) / map.contains_key(&k)","Look up a key."]],"next":"Chapter 9 shows how Rust handles errors, with panic! for bugs and Result for problems you can recover from."},"c9":{"summary":["panic! is for unrecoverable states and bugs; it unwinds by default and prints where it happened.","Result<T, E> is Ok(T) or Err(E); match on it, or use unwrap_or, map and friends.","The ? operator propagates errors early and converts them with From; it needs a function returning Result.","main can return Result<(), Box<dyn Error>> so ? works there too.","Encode rules in types with private fields and checked constructors, so the rest of the code can trust the values."],"functions":[["panic!(\"msg\")","Stop with a message."],["assert!(cond, \"msg\")","Panic when a condition is false."],["result?","Return the error early or take the Ok value."],["r.unwrap() / r.expect(\"why\")","Take the value or panic."],["r.unwrap_or(default)","Take the value or a fallback."],["Box<dyn Error>","Any error type, handy for main and scripts."],["e.kind() == io::ErrorKind::NotFound","Check which I/O error happened."]],"next":"Chapter 10 covers generics, traits and lifetimes, the tools that let you write code once for many types."},"c10":{"summary":["Generics write code once for many types; trait bounds say what those types must be able to do.","Generic code is monomorphised, so it is as fast as code written for each type.","Traits define shared behaviour, can have default methods, and can be used as bounds, with impl Trait or where clauses.","The orphan rule limits implementations to traits or types from your own crate.","Lifetime annotations describe how references relate so the compiler can reject dangling ones; elision fills most in.","'static references live for the entire program, like string literals."],"functions":[["fn f<T: Trait>(x: T)","A generic function with a trait bound."],["impl<T> Type<T> { }","Methods for every T."],["trait Name { fn m(&self); }","Define a trait."],["impl Trait for Type { }","Implement a trait."],["&impl Trait / -> impl Trait","Accept or return some type implementing a trait."],["where T: A + B","Multiple bounds, written after the signature."],["fn f<'a>(x: &'a str) -> &'a str","Annotate how long a returned reference is valid."]],"next":"Chapter 11 shows how to write and organise automated tests, which you have already been using in exercises."},"c11":{"summary":["Tests are functions marked #[test]; cargo test builds and runs them in parallel.","assert!, assert_eq! and assert_ne! check results; add a message for clearer failures.","should_panic with expected tests panics precisely; tests can also return Result.","Arguments after -- control the test runner, such as --test-threads=1, --show-output and --ignored.","Unit tests sit in a cfg(test) module next to the code; integration tests live in tests/ and use only the public API."],"functions":[["#[test]","Mark a function as a test."],["assert_eq!(left, right, \"msg\")","Check equality, printing both values on failure."],["#[should_panic(expected = \"text\")]","Pass only if the code panics with that text."],["#[ignore = \"reason\"]","Skip a test unless asked for."],["#[cfg(test)] mod tests { use super::*; }","Unit tests that can see private items."],["tests/name.rs","An integration test crate."],["cargo test name -- --exact","Run one test by its full name."]],"next":"Chapter 12 uses everything so far to build a real command-line tool, a small version of grep."},"c12":{"summary":["env::args().collect() reads arguments; args[0] is the program path; cargo run -- passes the rest.","fs::read_to_string reads a whole file and returns a Result.","Keep main thin; put parsing in Config::build returning Result and logic in run returning Result<(), Box<dyn Error>>.","Logic in lib.rs can be tested; write the test first, then the code.","Functions returning slices of an input need a lifetime tying the output to that input.","env::var reads environment variables; eprintln! writes to standard error so errors are not mixed with output."],"functions":[["env::args().collect::<Vec<String>>()","Read command-line arguments."],["fs::read_to_string(path)","Read a file into a String."],["process::exit(1)","Stop with a failure exit status."],["r.unwrap_or_else(|e| ...)","Handle an error with a closure."],["env::var(\"NAME\").is_ok()","Check whether an environment variable is set."],["eprintln!(\"...\")","Print to standard error."],["s.to_lowercase()","Lowercase copy for case-insensitive comparisons."]],"explore":["Add a -c flag that prints only the number of matching lines, like grep -c.","Search every file in a folder with std::fs::read_dir."],"repo":"minigrep","cv":["Built a grep-style command-line search tool in Rust with test-driven development, case-insensitive mode and proper stderr error reporting."],"next":"Chapter 13 introduces closures and iterators, and uses them to make minigrep shorter and faster."},"c13":{"summary":["Closures are anonymous functions that can capture variables; types are usually inferred.","They implement Fn, FnMut or FnOnce depending on whether they read, change or move out what they capture.","move gives a closure ownership of its captures, needed when it outlives the current scope.","Iterators produce values with next; adaptors such as map and filter are lazy until consumed.","Implement Iterator (type Item and next) to get every adaptor for free.","Iterator chains compile to code as fast as hand-written loops."],"functions":[["|x| x + 1","A closure."],["move","... || A closure that owns what it captures."],["impl Fn(i32) -> i32","Accept or return a closure."],[".iter() / .iter_mut() / .into_iter()","Borrow, mutably borrow or consume items."],[".map(f) / .filter(p) / .enumerate() / .zip(other)","Common adaptors."],[".collect::<Vec<_>>() / .sum() / .count()","Consume an iterator."],[".find(p) / .max_by_key(f) / .take(n)","Search, pick the largest, limit."]],"next":"Chapter 14 looks at Cargo in more depth, release profiles, publishing, documentation and workspaces."},"c14":{"summary":["Profiles configure builds; dev is the default and release enables optimisations; tune them in Cargo.toml.","/// documents the next item, //! the enclosing crate or module; cargo doc builds HTML and examples run as tests.","pub use flattens your public API without changing the internal layout.","Publishing needs metadata, is permanent, and versions can only be yanked.","Workspaces share one lock file and target folder; members depend on each other by path.","cargo install installs binaries; cargo-xyz programs extend cargo with new subcommands."],"functions":[["[profile.release] opt-level = 3","Configure the release build."],["/// # Examples","Document an item with a tested example."],["cargo doc --open","Build and open documentation."],["cargo publish --dry-run","Check a crate is ready to publish."],["cargo yank --vers 1.0.1","Stop new use of a published version."],["[workspace] members = [...]","Group crates in a workspace."],["cargo run -p name","Run one member of a workspace."],["cargo install name","Install a binary crate."]],"next":"Chapter 15 introduces smart pointers, Box, Rc and RefCell, and the traits that make them work."},"c15":{"summary":["Box<T> puts a value on the heap; it enables recursive types and cheap moves of large data.","Deref lets a type act like a reference, and deref coercion inserts conversions in calls.","Drop runs cleanup when a value goes out of scope; std::mem::drop ends a value early.","Rc<T> gives shared ownership on one thread; Rc::clone only bumps a counter.","RefCell<T> moves borrow checking to run time for interior mutability; Rc<RefCell<T>> shares mutable data.","Rc cycles leak memory; use Weak<T> for back links and upgrade to use them."],"functions":[["Box::new(x)","Allocate x on the heap."],["impl Deref for T { type Target }","Make a type behave like a reference."],["impl Drop for T","Run code when a value is dropped."],["Rc::new / Rc::clone / Rc::strong_count","Shared ownership and its count."],["RefCell::new / .borrow() / .borrow_mut()","Run-time checked borrows."],["Rc::downgrade(&rc) / weak.upgrade()","Create and use a Weak reference."]],"next":"Chapter 16 takes these ideas to multiple threads with Arc, Mutex and channels."},"c16":{"summary":["thread::spawn runs a closure on a new thread; join waits for it and returns its value.","move closures give threads ownership; thread::scope lets threads borrow because it waits for them.","Channels (mpsc) pass ownership of messages between threads; clone the sender for several producers.","Mutex<T> allows one thread at a time; the guard unlocks when dropped; Arc<T> shares it between threads.","Send and Sync mark what may cross or be shared between threads; the compiler enforces them.","Rust prevents data races at compile time, but deadlocks and logic races are still yours to avoid."],"functions":[["thread::spawn(move","...) || Start a thread."],["handle.join()","Wait for a thread and get its result."],["thread::scope(|s| s.spawn(...))","Threads that can borrow local data."],["mpsc::channel() / sync_channel(n)","Unbounded or bounded channel."],["tx.send(v) / rx.recv() / for v in rx","Send and receive messages."],["Arc::new(Mutex::new(v))","Shared, lockable data."],["m.lock().unwrap()","Lock and get a guard."]],"next":"Chapter 17 introduces async programming, a different way to handle many tasks at once without a thread per task."},"c17":{"summary":["async fn and async blocks produce futures, which are lazy until awaited or spawned.","A runtime such as Tokio drives futures; #[tokio::main] starts one.","join! runs futures concurrently in one task; tokio::spawn makes independent tasks; async channels pass messages.","join_all waits for many futures, select! races them and cancels the losers, timeout adds a deadline.","Streams are asynchronous iterators processed with StreamExt.","Async suits many waits; threads suit CPU-heavy parallel work; spawn_blocking bridges the two."],"functions":[["async fn / async { }","Define asynchronous code that returns a future."],["fut.await","Wait for a future inside async code."],["#[tokio::main]","Start a Tokio runtime for main."],["tokio::join!(a, b)","Await several futures concurrently."],["tokio::spawn(async move { })","Run a future as its own task."],["tokio::select! { }","Take whichever future finishes first."],["tokio::time::timeout(d, fut)","Give a future a deadline."],["futures::future::join_all(iter)","Await a list of futures."],["StreamExt::next().await","Get the next value from a stream."]],"next":"Chapter 18 looks at how Rust supports object-oriented ideas with traits and trait objects."},"c18":{"summary":["Rust supports encapsulation (private fields) and polymorphism (traits) but not inheritance.","Default trait methods and composition provide code reuse.","Box<dyn Trait> stores mixed types; calls go through a vtable (dynamic dispatch).","Generics are resolved at compile time (static dispatch); pick dyn for mixed collections or plug-ins.","Only dyn compatible traits (no Self returns, no generic methods) can be trait objects.","The state pattern can use trait objects (checked at run time) or separate types (checked at compile time)."],"functions":[["Box<dyn Trait>","An owned trait object."],["&dyn Trait","A borrowed trait object."],["Vec<Box<dyn Trait>>","A collection of mixed types."],["fn m(self: Box<Self>)","A method that consumes a boxed self."],["option.take()","Move the value out, leaving None."]],"next":"Chapter 19 covers every kind of pattern Rust supports and everywhere you can use them."},"c19":{"summary":["Patterns appear in match, if let, while let, let...else, for, let and function parameters.","Refutable patterns can fail; irrefutable ones always match and are required by let, for and parameters.","Literals, ranges, | alternatives, destructuring of structs, enums, tuples, references and slices all work as patterns.","_ ignores one value, .. ignores the rest, a guard adds a condition, and @ binds while testing.","Let chains combine several let and boolean conditions in one if, and matches! gives a bool."],"functions":[["1 | 2","Match either pattern."],["1..=5","Match an inclusive range."],["Point { x, .. }","Destructure a struct, ignoring other fields."],["x if x > 0","A match guard."],["id @ 3..=7","Bind a value while testing it."],["[first, .., last] / [head, tail @ ..]","Slice patterns."],["if let A = a && let B = b && cond","A let chain."],["matches!(v, pattern)","Test a pattern as a bool."]],"next":"Chapter 20 covers advanced features you will meet in libraries, unsafe code, advanced traits and types, and macros."},"c20":{"summary":["unsafe unlocks five extra powers but keeps every other check; keep unsafe blocks small, wrapped in safe APIs, with SAFETY comments.","Associated types, default type parameters, operator traits, supertraits and fully qualified syntax give fine control over traits.","The newtype pattern adds type safety and gets around the orphan rule at no cost.","Type aliases shorten long types; ! is the never type; ?Sized allows dynamically sized types.","fn pointers are plain function addresses; closures can be returned with impl Fn or Box<dyn Fn>.","macro_rules! macros match code patterns and expand at compile time; procedural macros transform token streams."],"functions":[["unsafe { ... }","A block allowed to use unsafe operations."],["&raw const x / &raw mut x","Create raw pointers."],["impl Add for T { type Output }","Overload the + operator."],["Trait::method(&value)","Call a specific trait's method."],["trait A: B","A supertrait requirement."],["type Alias = LongType;","A type alias."],["fn(i32) -> i32","A function pointer type."],["macro_rules! name { (pattern) => { expansion } }","A declarative macro."]],"next":"Chapter 21 brings everything together in the book's final project, a multithreaded web server."},"c21":{"summary":["TcpListener::bind and incoming accept connections; BufReader reads the request line by line.","An HTTP response is a status line, headers ending in a blank line, then the body.","A single-threaded server blocks on slow requests; a fixed-size thread pool fixes that safely.","Workers share one receiver through Arc<Mutex<Receiver<Job>>>; jobs are Box<dyn FnOnce() + Send + 'static>.","Drop for the pool closes the channel first, then joins every worker, giving a graceful shutdown."],"functions":[["TcpListener::bind(\"127.0.0.1:7878\")","Listen for TCP connections."],["listener.incoming()","Iterate over incoming connections."],["BufReader::new(&stream).lines()","Read text lines from a stream."],["stream.write_all(bytes)","Send the whole response."],["type Job = Box<dyn FnOnce() + Send + 'static>","A boxed job a thread can run once."],["self.sender.take()","Move the sender out to drop it during shutdown."],["workers.drain(..)","Move every worker out of the Vec to join it."]],"explore":["Serve static files from a folder, with the right Content-Type for each extension.","Rebuild the server with Tokio or axum (Track 2, A12) and compare the code size."],"repo":"rust-thread-pool-server","cv":["Implemented an HTTP/1.1 server in Rust from raw TCP sockets with a custom thread pool, graceful shutdown and a companion load-testing client."],"next":"You have finished the book. Track 2 deepens each topic the way roadmap.sh/rust lays it out, and Track 3 builds portfolio projects."},"q1":{"summary":["Separate the network adapter (Target) from scheduling and statistics so the core is testable without a network.","buffer_unordered gives a closed-loop load model with a fixed concurrency.","Nearest-rank percentiles are simple and explainable; hdrhistogram scales to huge sample counts.","Classify errors (timeout, connect, other) so reports point at causes.","CI on three operating systems plus release binaries make the project easy to trust and try."],"functions":[["trait Target { fn hit(&self) -> impl Future<Output = Outcome> }","The seam between logic and network."],["stream::iter(..).map(..).buffer_unordered(c)","Concurrency-limited requests."],["reqwest::Client::builder().timeout(..)","A reusable client with a timeout."],["e.is_timeout() / e.is_connect()","Classify request failures."],["clap derive","The command-line interface."],["GitHub Actions + rust-cache","Continuous integration."]],"explore":["Add a --rate option for an open-loop model (fixed requests per second) and explain how its results differ.","Record latencies into hdrhistogram and print a text histogram."],"repo":"loadtest","cv":["Built loadtest, an async HTTP load-testing CLI in Rust (Tokio, reqwest, clap) that drives [N] concurrent requests and reports p50/p95/p99 latency, throughput and error classes.","Designed the scheduler and statistics behind a trait seam, reaching [X]% test coverage with deterministic fake targets and CI on Linux, macOS and Windows."],"next":"Q2 builds a test-report analyser that finds flaky tests."},"q2":{"summary":["JUnit XML is the common format for test results; roxmltree parses it into a tree you can query.","Model verdicts, results and classifications as enums and structs, and define flaky precisely.","Aggregate with a HashMap keyed by a stable test id, then sort with total_cmp for floats.","Collecting Results stops at the first error; anyhow context names the failing file.","A pure exit-code function turns the tool into a CI quality gate with an allow-list."],"functions":[["roxmltree::Document::parse(xml)","Parse XML into a read-only tree."],["doc.descendants().filter(|n| n.has_tag_name(\"testcase\"))","Find elements anywhere."],["node.attribute(\"name\")","Read an attribute."],["a.total_cmp(&b)","Total ordering for floats."],["iter.collect::<Result<Vec<_>>>()","Stop at the first error."],["std::process::ExitCode","Report the gate result to CI."]],"explore":["Add an HTML report with a pass-rate sparkline per test.","Detect tests whose duration is trending upwards across runs."],"repo":"testlens","cv":["Built testlens, a Rust CLI that parses JUnit XML from [N] CI runs and classifies flaky versus broken tests, used as a CI quality gate with an allow-list.","Identified [X] flaky tests in [project], cutting false CI failures by [Y]% after fixes."],"next":"Q3 builds a log-based intrusion detector."},"q3":{"summary":["Define the detection rule and its limits first; monitor only systems you own or are authorised to monitor.","A compiled regex in a LazyLock static parses lines quickly; unknown lines are skipped.","A per-IP VecDeque sliding window detects bursts in bounded memory; a success resets the IP.","Success after recent failures is the highest-priority signal.","Follow files like tail -f, emit JSON alerts, benchmark on synthetic logs, and deploy with least privilege."],"functions":[["Regex::new(pattern) / re.captures(line)","Compile and match a regular expression."],["LazyLock<Regex>","Compile a regex once, on first use."],["VecDeque::push_back / pop_front","Sliding-window bookkeeping."],["file.seek(SeekFrom::End(0))","Start reading at the end of a file."],["reader.read_line(&mut s)","Read the next line, returning 0 at end of file."],["systemd unit with ProtectSystem=strict","Run the tool safely as a service."]],"explore":["Add a distributed-attack rule that counts failures per username across all IPs.","Send alerts to a chat webhook with reqwest, with rate limiting so a big attack does not flood the channel."],"repo":"logwatch","cv":["Built logwatch, a Rust log-based intrusion detector that parses SSH auth logs at [N] lines/s and flags brute-force bursts and suspicious successful logins with a sliding-window algorithm.","Deployed it as a sandboxed systemd service on a self-hosted server, with property and fixture tests covering parsing and detection."],"next":"The Web and systems projects start with W1, a JSON API backed by SQLite."},"w1":{"summary":["Design the API contract, status codes and error shape before writing handlers.","Layer the code into routes, handlers, model validation and a repository, each testable on its own.","One ApiError type implementing IntoResponse keeps errors consistent and hides internal details.","Parameterised SQL with fixed queries handles filters and pagination safely.","TraceLayer logs, environment configuration, graceful shutdown and a distroless Docker image make it deployable."],"functions":[["impl IntoResponse for ApiError","Map errors to HTTP responses."],["State<Arc<Mutex<..>>>","Share state with handlers."],["LIMIT ?1 OFFSET ?2","Paginate in SQL."],["app.oneshot(req)","Test a router in-process."],["TraceLayer::new_for_http()","Log every request."],["serve(..).with_graceful_shutdown(..)","Finish in-flight requests on shutdown."],["Multi-stage Dockerfile + distroless","A small, secure image."]],"explore":["Swap rusqlite for sqlx with Postgres and compile-time checked queries.","Add API key authentication as a tower middleware layer."],"repo":"taskhub","cv":["Built taskhub, a REST API in Rust (axum, SQLite) with validation, pagination, consistent error responses and [N] unit, HTTP and end-to-end tests run in CI.","Packaged it as a [X] MB distroless container with graceful shutdown and structured request logging."],"next":"W2 builds a persistent key-value store from scratch."},"w2":{"summary":["Log-structured storage appends every change and keeps an in-memory index of the latest offsets.","A length-prefixed, checksummed record format allows clean recovery from torn writes.","Replay the log on open, truncate a bad tail, and read values by seeking to their offsets.","Compaction rewrites only live keys to a temporary file, syncs it and renames it atomically.","Document durability guarantees and limits, and benchmark both synced and unsynced writes."],"functions":[["OpenOptions::new().read(true).append(true).create(true)","Open a log for appending."],["u32::to_le_bytes / from_le_bytes","A fixed binary encoding."],["file.seek(SeekFrom::Start(off)) / read_exact","Random reads by offset."],["file.set_len(n)","Truncate a torn tail."],["file.sync_all() / sync_data()","Force data to disk."],["std::fs::rename(tmp, path)","Atomically replace a file."]],"explore":["Split the log into fixed-size segments so compaction works one segment at a time.","Add a TCP server mode speaking the SET/GET protocol from Track 2 A8."],"repo":"kvlog","cv":["Built kvlog, a Bitcask-style persistent key-value store in Rust with checksummed append-only records, crash recovery and atomic compaction, published on crates.io.","Benchmarked [N] writes/s unsynced and [M] writes/s with fsync, and documented the durability trade-offs."],"next":"W3 compiles Rust to WebAssembly for an interactive browser project."},"w3":{"summary":["Keep simulation rules in pure Rust functions and test them natively with known patterns.","Represent the grid as a flat Vec and wrap edges with modular arithmetic that avoids underflow.","Export a small API with wasm-bindgen and let JavaScript read cells directly from WASM memory.","A seeded generator makes demos shareable and tests deterministic.","Build with wasm-pack, shrink with size-focused profiles, and deploy automatically to GitHub Pages."],"functions":[["row * width + col","Index into a flat grid."],["(row + height - 1) % height","Wrap upwards without underflow."],["#[wasm_bindgen] impl Universe","Export a type to JavaScript."],["self.cells.as_ptr()","Hand JavaScript a pointer into WASM memory."],["new Uint8Array(memory.buffer, ptr, len)","Read WASM memory from JavaScript without copying."],["wasm-pack build --release --target web","Build the browser package."]],"explore":["Add a pattern library (glider gun, pulsar) loaded from RLE text files.","Only redraw cells that changed between generations."],"repo":"lifewasm","cv":["Built lifewasm, Conway's Game of Life in Rust compiled to WebAssembly ([X] KB), rendering [N] cells at 60 fps through zero-copy access to WASM memory.","Set up CI that runs pattern-based tests and deploys the live demo to GitHub Pages on every push."],"next":"You have finished all three tracks. Keep your repositories polished, and consider contributing a fix to an open-source Rust crate you used along the way."}},"grade":{},"quiz":{"a1":[{"id":"a1-01","type":"single","pool":"quiz","prompt":"Which tool formats Rust code to the community style?","options":
