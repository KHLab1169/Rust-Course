var M=[{"id":"c1","n":"01","book":1,"t":"Getting started","goal":"Install Rust with rustup, compile a program by hand with rustc, and create, build and run projects with Cargo.","res":[["Chapter 1 in the book","https://doc.rust-lang.org/book/ch01-00-getting-started.html"],["Install Rust","https://www.rust-lang.org/tools/install"],["The Cargo Book","https://doc.rust-lang.org/cargo/"]],"items":[{"id":"1.1","t":"Install Rust and check the toolchain","min":45,"learn":"Install Rust with rustup, check the versions of rustc and cargo, update the toolchain, and open the documentation that ships with it, even offline.","kind":"lesson","ex":[{"id":"1.1a","t":"Install and report","p":"Install Rust with rustup (or check your existing install), then run rustc --version, cargo --version and rustup --version. Write down the three versions in your notes."},{"id":"1.1b","t":"Local documentation","p":"Use rustup doc to open the standard library documentation on your computer, find the page for the String type, and note one method you have not seen before."}]},{"id":"1.2","t":"Hello, world with rustc","min":45,"learn":"Write a main function, print with the println! macro, compile a single file with rustc, and run the program that rustc produces.","kind":"lesson","ex":[{"id":"1.2a","t":"Introduce yourself","p":"Write a program that prints three lines, your name, your city and one reason you are learning Rust. Compile it with rustc and run it."},{"id":"1.2b","t":"Read a compiler error","p":"Break your program on purpose by removing the closing quote of one string. Compile it, read the error, then fix it. Write in your notes which line and column the compiler reported."}]},{"id":"1.3","t":"Hello, Cargo","min":60,"learn":"Create a project with cargo new, look at Cargo.toml and the src folder, and use cargo build, cargo run, cargo check and cargo build --release.","kind":"lesson","ex":[{"id":"1.3a","t":"Your first Cargo project","p":"Create a project called greeter with cargo new, change main.rs so it prints a greeting of your choice, and run it with cargo run. Then run cargo check and note how much faster it is."},{"id":"1.3b","t":"Debug versus release","p":"Build the same project with cargo build and with cargo build --release. Find both programs inside the target folder and note the difference in file size."}]}]},{"id":"c2","n":"02","book":2,"t":"Programming a guessing game","goal":"Build a complete number-guessing game that reads input, uses an external crate for random numbers and loops until the player wins.","res":[["Chapter 2 in the book","https://doc.rust-lang.org/book/ch02-00-guessing-game-tutorial.html"],["rand crate docs","https://docs.rs/rand"]],"items":[{"id":"2.1","t":"Read the player's guess","min":45,"learn":"Read a line from the keyboard with std::io::stdin, store it in a mutable String, and handle a possible failure with expect.","kind":"lesson","ex":[{"id":"2.1a","t":"Echo with a name","p":"Ask for the player's name, read it with read_line, and print \"Welcome, NAME!\" without the trailing newline."},{"id":"2.1b","t":"Two answers","p":"Ask for a first name and then a last name, read each into its own String, and print the full name on one line."}]},{"id":"2.2","t":"Generate a secret number with a crate","min":45,"learn":"Add the rand crate to Cargo.toml, understand what Cargo.lock does, and generate a random number in a range.","kind":"lesson","ex":[{"id":"2.2a","t":"Roll the dice","p":"Create a project, add rand, and print the results of rolling two six-sided dice and their total."},{"id":"2.2b","t":"Read the lock file","p":"Open Cargo.lock in the dice project and find the exact version of rand that Cargo chose. Explain in your notes why the file should be committed for programs."}]},{"id":"2.3","t":"Compare, loop and handle bad input","min":60,"learn":"Turn text into a number with parse, compare with match and Ordering, repeat with loop, stop with break, and skip invalid input instead of crashing.","kind":"lesson","ex":[{"id":"2.3a","t":"Count the guesses","p":"Change the game so it counts how many guesses the player needed and prints the count when they win."},{"id":"2.3b","t":"Limited lives","p":"Give the player seven guesses. If they run out, print the secret number and end the game. Reject numbers outside 1 to 100 with a message."}]}]},{"id":"c3","n":"03","book":3,"t":"Common programming concepts","goal":"Use variables, constants, the built-in scalar and compound types, functions and control flow with confidence.","res":[["Chapter 3 in the book","https://doc.rust-lang.org/book/ch03-00-common-programming-concepts.html"],["Rust by Example, primitives","https://doc.rust-lang.org/rust-by-example/primitives.html"]],"items":[{"id":"3.1","t":"Variables, mutability and constants","min":45,"learn":"Immutable variables by default, mut, constants with const, and shadowing to reuse a name for a new value or type.","kind":"lesson","ex":[{"id":"3.1a","t":"Fix the compile errors","p":"This code does not compile: let total = 0; total = total + 5; println!(\"{total}\");. Fix it in two different ways: once with mut and once with shadowing."},{"id":"3.1b","t":"Unit converter constants","p":"Define constants for centimetres per inch (2.54) and metres per mile (1609.344). Print how many centimetres are in 12 inches and how many metres are in 26.2 miles."}]},{"id":"3.2","t":"Scalar types","min":60,"learn":"Signed and unsigned integers and their sizes, integer overflow, floating-point numbers, the numeric operators, booleans and the four-byte char.","kind":"lesson","ex":[{"id":"3.2a","t":"Explore the limits","p":"Print the minimum and maximum values of i8, u8, i32 and u64 using the MIN and MAX constants."},{"id":"3.2b","t":"Safe arithmetic","p":"Write a function safe_add(a: u8, b: u8) -> Option<u8> that returns None on overflow. Add tests that check 200 + 50 and 200 + 100."}]},{"id":"3.3","t":"Tuples and arrays","min":45,"learn":"Group values of different types in a tuple and read them by destructuring or with .0, and store a fixed number of same-type values in an array.","kind":"lesson","ex":[{"id":"3.3a","t":"Swap with a tuple","p":"Write a function swap(pair: (i32, String)) -> (String, i32) that returns the two values in the opposite order. Print the result for (7, \"seven\")."},{"id":"3.3b","t":"Weekly temperatures","p":"Store seven daily temperatures in an array of f64, then print the highest, the lowest and the average."}]},{"id":"3.4","t":"Functions, statements and expressions","min":60,"learn":"Define functions with typed parameters and return types, the difference between statements and expressions, returning the last expression, and comments.","kind":"lesson","ex":[{"id":"3.4a","t":"Temperature function","p":"Write celsius_to_fahrenheit(c: f64) -> f64 and print a small table for 0, 25, 37 and 100 degrees."},{"id":"3.4b","t":"The semicolon bug","p":"Write fn double(n: i32) -> i32 { n * 2; } and read the error. Fix it, and in your notes explain what the compiler's help message suggested."}]},{"id":"3.5","t":"Control flow","min":60,"learn":"if and else, if as an expression in let, loop with a return value, loop labels, while, and for over arrays and ranges.","kind":"lesson","ex":[{"id":"3.5a","t":"FizzBuzz","p":"Print the numbers 1 to 30, but print Fizz for multiples of 3, Buzz for multiples of 5 and FizzBuzz for multiples of both."},{"id":"3.5b","t":"Fibonacci with loop","p":"Write fib(n: u32) -> u64 that returns the nth Fibonacci number using a loop (fib(0) = 0, fib(1) = 1). Print fib(10) and fib(50)."}]}]},{"id":"c4","n":"04","book":4,"t":"Understanding ownership","goal":"Understand ownership, moves, borrowing and slices well enough to predict what the borrow checker will accept.","res":[["Chapter 4 in the book","https://doc.rust-lang.org/book/ch04-00-understanding-ownership.html"],["Rust by Example, scoping rules","https://doc.rust-lang.org/rust-by-example/scope.html"]],"items":[{"id":"4.1","t":"Ownership, moves and clones","min":75,"learn":"The three ownership rules, the stack and the heap, how String differs from a string literal, why assigning a String moves it, clone for deep copies, and Copy types.","kind":"lesson","ex":[{"id":"4.1a","t":"Predict, then compile","p":"Write down whether each line compiles before you try it: (1) let a = String::from(\"x\"); let b = a; println!(\"{a}\"); (2) the same with let b = a.clone(); (3) let n = 3; let m = n; println!(\"{n}\");. Then fix any that fail."},{"id":"4.1b","t":"Who drops what","p":"Create a struct Noisy(&'static str) and implement Drop for it so it prints \"dropping NAME\". Create three values in nested scopes and predict the order of the messages."}]},{"id":"4.2","t":"Ownership and functions","min":45,"learn":"Passing a value to a function moves or copies it just like assignment, and returning a value moves ownership back to the caller.","kind":"lesson","ex":[{"id":"4.2a","t":"Length and the string back","p":"Write calculate_length(s: String) -> (String, usize) that returns the string and its length, so the caller can keep using the string."},{"id":"4.2b","t":"Build a greeting","p":"Write make_greeting(name: String) -> String that returns \"Hello, NAME!\". Call it twice with different names and print both results."}]},{"id":"4.3","t":"References and borrowing","min":75,"learn":"Borrow a value with & without taking ownership, change it through &mut, the rule of one mutable or many shared references, and why dangling references cannot exist.","kind":"lesson","ex":[{"id":"4.3a","t":"Borrow instead of move","p":"Rewrite calculate_length from the last lesson so it takes &String and returns just the length. Show that the caller can still use the string afterwards."},{"id":"4.3b","t":"Mutate through a reference","p":"Write shout(s: &mut String) that turns the string into upper case and adds \"!\". Then show the compile error you get when you hold a shared reference while calling it, and fix the order."}]},{"id":"4.4","t":"The slice type","min":60,"learn":"Refer to part of a String with a string slice &str, why string literals are slices, using &str parameters, and slices of arrays.","kind":"lesson","ex":[{"id":"4.4a","t":"Last word","p":"Write last_word(s: &str) -> &str that returns the last word of a sentence. Test it with \"the quick brown fox\" and with a single word."},{"id":"4.4b","t":"Sum part of an array","p":"Write sum(values: &[i32]) -> i32 and use it to add up the whole array [3, 1, 4, 1, 5, 9] and just its first three items."}]}]},{"id":"c5","n":"05","book":5,"t":"Using structs","goal":"Define structs, create and update instances, derive Debug, and add methods and associated functions with impl.","res":[["Chapter 5 in the book","https://doc.rust-lang.org/book/ch05-00-structs.html"],["Rust by Example, structures","https://doc.rust-lang.org/rust-by-example/custom_types/structs.html"]],"items":[{"id":"5.1","t":"Defining and instantiating structs","min":45,"learn":"Named-field structs, field init shorthand, struct update syntax, tuple structs, unit-like structs, and owning data in fields.","kind":"lesson","ex":[{"id":"5.1a","t":"A Book struct","p":"Define a Book struct with title, author (both String) and pages (u32). Derive Debug, create two books, and print one with {:?} and the other with {:#?}."},{"id":"5.1b","t":"Newtypes for safety","p":"Create tuple structs Meters(f64) and Feet(f64), and a function to_feet(m Meters) -> Feet. Show that passing a Feet where Meters is expected does not compile."}]},{"id":"5.2","t":"An example program with structs","min":45,"learn":"Refactor a rectangle-area program from loose variables to a tuple to a struct, and use dbg! and derived Debug to inspect values.","kind":"lesson","ex":[{"id":"5.2a","t":"Perimeter and square check","p":"Add functions perimeter(r: &Rectangle) -> u32 and is_square(r: &Rectangle) -> bool, and print both for a 10 by 10 and a 3 by 7 rectangle."},{"id":"5.2b","t":"Debug with dbg!","p":"Write a program that computes the total area of three rectangles stored in an array, and use dbg! to print each intermediate area without changing the result."}]},{"id":"5.3","t":"Methods and associated functions","min":60,"learn":"Methods in impl blocks with &self, &mut self and self, methods with extra parameters, associated functions such as constructors with Self, and multiple impl blocks.","kind":"lesson","ex":[{"id":"5.3a","t":"A bank account","p":"Create an Account struct with owner (String) and balance (i64). Add new(owner: &str) -> Self, deposit(&mut self, amount), withdraw(&mut self, amount) -> bool that refuses to overdraw, and balance(&self)."},{"id":"5.3b","t":"Consume with self","p":"Add a method into_report(self) -> String to Account that formats the owner and balance and consumes the account. Show that the account cannot be used after the call."}]}]},{"id":"c6","n":"06","book":6,"t":"Enums and pattern matching","goal":"Model choices with enums, use Option instead of null, and handle every case with match, if let and let...else.","res":[["Chapter 6 in the book","https://doc.rust-lang.org/book/ch06-00-enums.html"],["std::option","https://doc.rust-lang.org/std/option/"]],"items":[{"id":"6.1","t":"Defining enums and Option","min":60,"learn":"Enums whose variants hold different data, methods on enums, and the Option enum that replaces null.","kind":"lesson","ex":[{"id":"6.1a","t":"Shapes","p":"Create an enum Shape with Circle(f64) for the radius, Rectangle(f64, f64) and Triangle(f64, f64) for base and height. Add an area(&self) method and print the area of one of each."},{"id":"6.1b","t":"Find a user","p":"Write find_age(name: &str) -> Option<u32> that knows three people's ages and returns None for anyone else. Print the result for a known and an unknown name."}]},{"id":"6.2","t":"The match control flow construct","min":60,"learn":"match arms and patterns, binding values from variants, matching on Option, exhaustiveness, and the catch-all patterns other and _.","kind":"lesson","ex":[{"id":"6.2a","t":"Traffic light","p":"Make an enum Light { Red, Yellow, Green } with a method next(&self) -> Light and a method seconds(&self) -> u32. Print a full cycle starting from Red."},{"id":"6.2b","t":"Option arithmetic","p":"Write divide(a: i32, b: i32) -> Option<i32> that returns None when b is 0, then a function describe(r: Option<i32>) -> String that returns \"result N\" or \"cannot divide by zero\"."}]},{"id":"6.3","t":"if let and let...else","min":45,"learn":"Use if let when you only care about one pattern, and let...else to pull a value out or leave the function early.","kind":"lesson","ex":[{"id":"6.3a","t":"Only the errors","p":"Given an array of Option<&str> results, use if let to print only the values that are Some, and count how many were None."},{"id":"6.3b","t":"Parse a key=value line","p":"Write parse_line(line: &str) -> Option<(String, i32)> that reads lines like \"timeout=30\" using let...else for each step that could fail."}]}]},{"id":"c7","n":"07","book":7,"t":"Packages, crates and modules","goal":"Organise code into modules, control what is public, bring paths into scope with use, and split a project across files.","res":[["Chapter 7 in the book","https://doc.rust-lang.org/book/ch07-00-managing-growing-projects-with-packages-crates-and-modules.html"],["The Cargo Book, package layout","https://doc.rust-lang.org/cargo/guide/project-layout.html"]],"items":[{"id":"7.1","t":"Packages and crates","min":30,"learn":"The difference between a package, a binary crate and a library crate, the crate root files src/main.rs and src/lib.rs, and extra binaries in src/bin.","kind":"lesson","ex":[{"id":"7.1a","t":"Library and binary","p":"Create a package with cargo new tally, add src/lib.rs with a pub fn add(a: i32, b: i32) -> i32, and call it from main.rs through the package name."},{"id":"7.1b","t":"A second binary","p":"Add src/bin/stats.rs to the tally package that prints the sum of 1 to 100 using tally::add in a loop. Run it with cargo run --bin stats."}]},{"id":"7.2","t":"Modules and privacy","min":45,"learn":"Group related code with mod, the module tree that starts at the crate root, private by default, pub on items, and how privacy works for struct fields and enum variants.","kind":"lesson","ex":[{"id":"7.2a","t":"A geometry module","p":"In one file, create mod geometry with pub fn circle_area(r: f64) -> f64 and a private helper square(x: f64) -> f64 that circle_area uses. Call circle_area from main and show that square cannot be called from main."},{"id":"7.2b","t":"Guarded constructor","p":"In mod user, create pub struct Email(String) whose field is private and pub fn parse(s: &str) -> Option<Email> that only accepts strings containing @. Add pub fn as_str(&self) -> &str."}]},{"id":"7.3","t":"Paths and the use keyword","min":45,"learn":"Absolute paths from crate, relative paths, super, bringing names into scope with use and as, re-exporting with pub use, nested and glob imports, and using external crates.","kind":"lesson","ex":[{"id":"7.3a","t":"Tidy the imports","p":"Rewrite these four lines as one use statement with nested paths: use std::collections::HashMap; use std::collections::HashSet; use std::collections::BTreeMap; use std::io;. Use all four names in main so nothing is unused."},{"id":"7.3b","t":"Re-export a friendly API","p":"Create mod shapes with an inner mod circle containing pub fn area(r: f64) -> f64. Use pub use so main can call shapes::circle_area(1.0)."}]},{"id":"7.4","t":"Splitting modules into files","min":45,"learn":"Move a module to its own file with mod name; and name.rs, the folder layout for nested modules, and how the compiler finds module files.","kind":"lesson","ex":[{"id":"7.4a","t":"Split your geometry module","p":"Take the geometry module from lesson 7.2 and move it into src/geometry.rs in a Cargo project, keeping main.rs to a mod line and main."},{"id":"7.4b","t":"A nested module in a folder","p":"Add a nested module geometry::solids with pub fn sphere_volume(r: f64) -> f64 in its own file, and call it from main."}]}]},{"id":"c8","n":"08","book":8,"t":"Common collections","goal":"Store and process data with Vec, String and HashMap, including UTF-8 text and the entry API.","res":[["Chapter 8 in the book","https://doc.rust-lang.org/book/ch08-00-common-collections.html"],["std::collections","https://doc.rust-lang.org/std/collections/"]],"items":[{"id":"8.1","t":"Vectors","min":60,"learn":"Create vectors with Vec::new and vec!, push and pop, read with indexing or get, iterate immutably and mutably, and store different kinds of values with an enum.","kind":"lesson","ex":[{"id":"8.1a","t":"Statistics","p":"Write median(v: &mut Vec<i32>) -> Option<f64> and mode(v: &[i32]) -> Option<i32>. Return None for an empty input."},{"id":"8.1b","t":"Remove the duplicates","p":"Write dedup_keep_order(v: &[i32]) -> Vec<i32> that removes repeated values but keeps the first time each value appears."}]},{"id":"8.2","t":"Strings and UTF-8","min":60,"learn":"String versus &str, building strings with push_str, + and format!, why strings cannot be indexed by position, and iterating over chars and bytes.","kind":"lesson","ex":[{"id":"8.2a","t":"Pig Latin","p":"Write pig_latin(word: &str) -> String: words starting with a consonant move the first letter to the end and add \"ay\" (first becomes irst-fay); words starting with a vowel add \"-hay\" (apple becomes apple-hay)."},{"id":"8.2b","t":"Capitalise each word","p":"Write title_case(s: &str) -> String that capitalises the first letter of every word and lowercases the rest, so \"hELLO wORLD\" becomes \"Hello World\"."}]},{"id":"8.3","t":"Hash maps","min":60,"learn":"Create and fill a HashMap, read with get, iterate, ownership of inserted keys and values, overwriting, and the entry API for insert-if-missing and update-in-place.","kind":"lesson","ex":[{"id":"8.3a","t":"Department directory","p":"Build the book's exercise: read commands like \"Add Sally to Engineering\" from an array, store people per department in a HashMap<String, Vec<String>>, then print each department with its people sorted alphabetically."},{"id":"8.3b","t":"Anagram groups","p":"Write group_anagrams(words: &[&str]) -> Vec<Vec<String>> that groups words that are anagrams of each other, such as \"listen\" and \"silent\"."}]}]},{"id":"c9","n":"09","book":9,"t":"Error handling","goal":"Tell bugs from recoverable failures, handle Result values, propagate errors with ?, and design types that validate themselves.","res":[["Chapter 9 in the book","https://doc.rust-lang.org/book/ch09-00-error-handling.html"],["std::result","https://doc.rust-lang.org/std/result/"]],"items":[{"id":"9.1","t":"Unrecoverable errors with panic!","min":30,"learn":"When panic! happens, what unwinding means, reading a backtrace with RUST_BACKTRACE=1, and switching to abort in release builds.","kind":"lesson","ex":[{"id":"9.1a","t":"Read a backtrace","p":"Write a program where main calls a(), a calls b(), and b indexes past the end of a vector. Run it with RUST_BACKTRACE=1 and find your own functions in the output."},{"id":"9.1b","t":"Assertions as guards","p":"Write fn percentage(part: u32, whole: u32) -> f64 that panics with a clear message when whole is 0, using assert!. Add a test with #[should_panic(expected = \"whole must not be zero\")]."}]},{"id":"9.2","t":"Recoverable errors with Result","min":75,"learn":"Match on Ok and Err, match on different kinds of error, unwrap and expect, propagate errors with the ? operator, and use ? in main by returning Result.","kind":"lesson","ex":[{"id":"9.2a","t":"Sum numbers from a file","p":"Write sum_file(path: &str) -> Result<i64, Box<dyn Error>> that reads one integer per line and returns the total. Blank lines are skipped; a bad line is an error."},{"id":"9.2b","t":"unwrap_or and friends","p":"Given let inputs = [\"42\", \"x\", \"-7\"];, print each parsed as i32 three ways: with unwrap_or(0), with unwrap_or_default(), and with a match that prints the error message."}]},{"id":"9.3","t":"To panic or not to panic","min":45,"learn":"Guidelines for choosing panic or Result, when unwrap is acceptable, and encoding rules in types such as a Guess that can only hold 1 to 100.","kind":"lesson","ex":[{"id":"9.3a","t":"A Percentage type","p":"Create Percentage(u8) with a private field, Percentage::new(v: u8) -> Result<Percentage, String> that rejects values over 100, and a method of(&self, amount: f64) -> f64."},{"id":"9.3b","t":"Decide and justify","p":"For each case, decide panic or Result and write one sentence why: (1) a config file is missing, (2) a function gets a negative length that its docs forbid, (3) parsing a number typed by a user, (4) a hard-coded IP address string in your code fails to parse."}]}]},{"id":"c10","n":"10","book":10,"t":"Generics, traits and lifetimes","goal":"Write code that works for many types with generics, describe shared behaviour with traits, and explain to the compiler how long references live.","res":[["Chapter 10 in the book","https://doc.rust-lang.org/book/ch10-00-generics.html"],["Rust by Example, generics","https://doc.rust-lang.org/rust-by-example/generics.html"]],"items":[{"id":"10.1","t":"Generic data types","min":60,"learn":"Generic functions, structs, enums and methods, methods for one concrete type only, and why generics cost nothing at run time (monomorphisation).","kind":"lesson","ex":[{"id":"10.1a","t":"A generic Pair","p":"Create struct Pair<T> { a: T, b: T } with new and a method swap(self) -> Pair<T>. Add a method larger(&self) -> &T that only exists when T: PartialOrd."},{"id":"10.1b","t":"Generic stack","p":"Implement struct Stack<T> backed by a Vec<T> with push, pop -> Option<T>, peek -> Option<&T>, len and is_empty."}]},{"id":"10.2","t":"Traits","min":75,"learn":"Define and implement traits, default methods, traits as parameters with impl Trait and bounds, multiple bounds and where clauses, returning impl Trait, and blanket implementations.","kind":"lesson","ex":[{"id":"10.2a","t":"Describe yourself","p":"Define trait Describe { fn describe(&self) -> String; } and implement it for a Dog struct, a Car struct and for i32. Write fn print_all(items: &[&dyn Describe]) to print them all, plus a generic fn describe_twice(x: &impl Describe)."},{"id":"10.2b","t":"Implement Display","p":"Implement std::fmt::Display for a Money { cents: i64 } struct so it prints like $12.05 (and -$3.10 for negatives). Use it with println!(\"{}\", m) and to_string()."}]},{"id":"10.3","t":"Validating references with lifetimes","min":75,"learn":"Why dangling references are rejected, lifetime annotations in function signatures, structs that hold references, the three elision rules, and the static lifetime.","kind":"lesson","ex":[{"id":"10.3a","t":"First of two","p":"Write fn first_nonempty<'a>(a: &'a str, b: &'a str) -> &'a str that returns a unless it is empty. Then write a main that uses the result after one of the strings is dropped, read the error, and fix it."},{"id":"10.3b","t":"A tokenizer struct","p":"Create struct Words<'a> { text: &'a str } with a method next_word(&mut self) -> Option<&'a str> that returns the next space-separated word and advances."}]},{"id":"10.4","t":"Generics, bounds and lifetimes together","min":45,"learn":"Read and write signatures that combine generic type parameters, trait bounds and lifetimes, and use them to build small reusable helpers.","kind":"lesson","ex":[{"id":"10.4a","t":"Max by a key","p":"Write fn max_by<'a, T, K: PartialOrd>(items: &'a [T], key: impl Fn(&T) -> K) -> Option<&'a T> that returns the item with the largest key. Use it to find the longest word and the oldest person in a list."},{"id":"10.4b","t":"Summaries for a list","p":"Using the Summary trait idea, write fn digest<T: Summary>(items: &[T]) -> String that joins every summary with newlines, and implement Summary for a struct Email { from: String, subject: String }."}]}]},{"id":"c11","n":"11","book":11,"t":"Writing automated tests","goal":"Write unit and integration tests, control how they run, and organise them the way Rust projects expect.","res":[["Chapter 11 in the book","https://doc.rust-lang.org/book/ch11-00-testing.html"],["The Cargo Book, cargo test","https://doc.rust-lang.org/cargo/commands/cargo-test.html"]],"items":[{"id":"11.1","t":"How to write tests","min":60,"learn":"The test attribute, assert!, assert_eq! and assert_ne!, custom failure messages, should_panic with expected text, and tests that return Result.","kind":"lesson","ex":[{"id":"11.1a","t":"Test a word counter","p":"Write word_count(s: &str) -> usize and four tests, normal text, extra spaces, an empty string and newlines, each with a custom failure message."},{"id":"11.1b","t":"should_panic precisely","p":"Write Grade::new(score: u8) that panics with \"score above 100\" for scores over 100 and \"score is zero\" for zero. Write two should_panic tests that each check the right message."}]},{"id":"11.2","t":"Controlling how tests are run","min":30,"learn":"Running tests in parallel or one at a time, showing output from passing tests, running tests by name, and ignoring slow tests.","kind":"lesson","ex":[{"id":"11.2a","t":"Mark a slow test","p":"Add a test that sleeps for three seconds and mark it #[ignore = \"slow\"]. Run cargo test, then cargo test -- --ignored, and note the counts in the summary line."},{"id":"11.2b","t":"Filter by name","p":"Write five tiny tests named add_one, add_two, sub_one, mul_two and div_by_zero_panics. Run only the add tests, then only div_by_zero_panics by its full name."}]},{"id":"11.3","t":"Test organisation","min":45,"learn":"Unit tests next to the code in a cfg(test) module, testing private functions, integration tests in the tests folder, shared helpers in tests/common/mod.rs, and why binaries need a library to be integration tested.","kind":"lesson","ex":[{"id":"11.3a","t":"Add integration tests","p":"Turn your word counter into a library crate called textstats with pub fn word_count and pub fn char_count, then add tests/api.rs with integration tests for both."},{"id":"11.3b","t":"Shared fixtures","p":"Add tests/common/mod.rs with a function sample_text() -> &'static str, and use it from two different integration test files."}]}]},{"id":"c12","n":"12","book":12,"t":"An I/O project: minigrep","goal":"Build minigrep, a small grep that searches files for a word, with clean error handling, tests, an environment variable option and proper use of standard error.","res":[["Chapter 12 in the book","https://doc.rust-lang.org/book/ch12-00-an-io-project.html"],["std::env","https://doc.rust-lang.org/std/env/"],["std::fs","https://doc.rust-lang.org/std/fs/"]],"items":[{"id":"12.1","t":"Arguments and reading a file","min":45,"learn":"Read command-line arguments with std::env::args, collect them into a Vec, and read a whole file with fs::read_to_string.","kind":"project","ex":[{"id":"12.1a","t":"Create minigrep","p":"Create the minigrep project, save a poem.txt with a few lines next to Cargo.toml, and get the first version running with cargo run -- frog poem.txt."},{"id":"12.1b","t":"Count lines and words","p":"Extend the first version to also print how many lines and words the file has, before printing the text."}]},{"id":"12.2","t":"Refactoring for modularity and errors","min":75,"learn":"Move argument parsing into a Config struct with a build function that returns Result, move the logic into run returning Result<(), Box<dyn Error>>, and move both into lib.rs so main stays tiny.","kind":"project","ex":[{"id":"12.2a","t":"Do the refactor","p":"Split your minigrep into src/lib.rs (Config, build, run) and src/main.rs. Running it with one argument must print \"Problem parsing arguments not enough arguments\" and exit with status 1."},{"id":"12.2b","t":"A missing file","p":"Run your refactored minigrep with a file that does not exist and confirm the error comes from run through the ? operator. Change the message so it names the missing file."}]},{"id":"12.3","t":"Test-driven search","min":60,"learn":"Write a failing test first, then a search function that returns matching lines, and see why it needs a lifetime annotation.","kind":"project","ex":[{"id":"12.3a","t":"Count matches","p":"Add pub fn count<'a>(query: &str, contents: &'a str) -> usize and a test for it, writing the test before the function."},{"id":"12.3b","t":"Line numbers","p":"Write search_numbered(query: &str, contents: &'a str) -> Vec<(usize, &'a str)> that returns the 1-based line number with each match, test-first, and print results as \"3 line text\"."}]},{"id":"12.4","t":"Environment variables and standard error","min":60,"learn":"Add a case-insensitive search controlled by the IGNORE_CASE environment variable, and print errors with eprintln! so they go to standard error.","kind":"project","ex":[{"id":"12.4a","t":"Wire up IGNORE_CASE","p":"Add an ignore_case bool to Config, fill it from the environment in build, and choose between search and search_case_insensitive in run. Switch every error message in main to eprintln!."},{"id":"12.4b","t":"A flag beats the variable","p":"Let a --ignore-case (or -i) argument anywhere on the command line turn on case-insensitive search too, and add tests for build that check both the flag and its absence."}]}]},{"id":"c13","n":"13","book":13,"t":"Iterators and closures","goal":"Write closures that capture their environment, understand the Fn traits, and process data with iterator adaptors instead of manual loops.","res":[["Chapter 13 in the book","https://doc.rust-lang.org/book/ch13-00-functional-features.html"],["std::iter::Iterator","https://doc.rust-lang.org/std/iter/trait.Iterator.html"]],"items":[{"id":"13.1","t":"Closures","min":60,"learn":"Closure syntax and type inference, capturing by reference, by mutable reference or by move, the FnOnce, FnMut and Fn traits, and passing closures to functions like sort_by_key.","kind":"lesson","ex":[{"id":"13.1a","t":"A counter factory","p":"Write make_counter() -> impl FnMut() -> u32 that returns a closure counting 1, 2, 3 each time it is called."},{"id":"13.1b","t":"Retry with a closure","p":"Write retry<T, E>(times: u32, mut op: impl FnMut() -> Result<T, E>) -> Result<T, E> that calls op until it succeeds or the attempts run out. Test it with a closure that fails twice before succeeding."}]},{"id":"13.2","t":"Iterators","min":75,"learn":"The Iterator trait and next, iter, iter_mut and into_iter, consuming adaptors like sum and collect, iterator adaptors like map, filter, zip and enumerate, laziness, and implementing Iterator for your own type.","kind":"lesson","ex":[{"id":"13.2a","t":"Rewrite loops as chains","p":"Rewrite three loops as iterator chains: the sum of squares of odd numbers below 100, the longest word in a sentence, and a Vec of the lengths of each word."},{"id":"13.2b","t":"A Fibonacci iterator","p":"Implement Iterator for a Fib struct so Fib::new().take(10).collect::<Vec<u64>>() gives the first ten Fibonacci numbers. Then find the first Fibonacci number over one million with find."}]},{"id":"13.3","t":"Improving minigrep and iterator performance","min":45,"learn":"Take ownership of the argument iterator in Config::build instead of cloning, rewrite search as a filter chain, and why iterators compile to the same machine code as loops.","kind":"lesson","ex":[{"id":"13.3a","t":"Update your minigrep","p":"Apply both changes to your minigrep project, run cargo clippy, and fix anything it suggests."},{"id":"13.3b","t":"Measure it yourself","p":"Time search on a large text (repeat a paragraph 100,000 times) in a release build, once with the loop version and once with the iterator version, using std::time::Instant."}]}]},{"id":"c14","n":"14","book":14,"t":"More about Cargo and crates.io","goal":"Tune release builds, document and publish a crate, organise several crates in a workspace, and install and extend Cargo.","res":[["Chapter 14 in the book","https://doc.rust-lang.org/book/ch14-00-more-about-cargo.html"],["The Cargo Book, profiles","https://doc.rust-lang.org/cargo/reference/profiles.html"],["The rustdoc book","https://doc.rust-lang.org/rustdoc/"]],"items":[{"id":"14.1","t":"Release profiles and documentation comments","min":60,"learn":"The dev and release profiles and opt-level, doc comments with three slashes, sections like Examples, Panics and Errors, documentation tests, and crate-level docs with //!.","kind":"lesson","ex":[{"id":"14.1a","t":"Document your library","p":"Add doc comments with an Examples section to the public functions of your textstats crate from Chapter 11, plus a crate-level //! comment. Run cargo test and cargo doc --open."},{"id":"14.1b","t":"Tune a release profile","p":"Add a [profile.release] section that sets lto = true, codegen-units = 1 and panic = \"abort\". Compare the release binary size of the guessing game before and after."}]},{"id":"14.2","t":"Publishing a crate","min":45,"learn":"Re-export a convenient public API with pub use, add the metadata crates.io requires, publish with cargo publish, and deprecate a version with cargo yank.","kind":"lesson","ex":[{"id":"14.2a","t":"Flatten the public API","p":"Inside a single file, create a crate layout with mod kinds { pub enum PrimaryColor { Red, Yellow, Blue } } and mod utils { pub fn mix(...) }, then re-export both at the top so users write PrimaryColor and mix directly."},{"id":"14.2b","t":"Dry-run a publish","p":"Fill in the metadata for your textstats crate and run cargo publish --dry-run (no account needed). Fix every warning it prints."}]},{"id":"14.3","t":"Workspaces, cargo install and custom commands","min":45,"learn":"Group related crates in a workspace with one Cargo.lock and target folder, depend on sibling crates by path, install binaries with cargo install, and how cargo-something becomes cargo something.","kind":"lesson","ex":[{"id":"14.3a","t":"Build a workspace","p":"Create a workspace with a library crate textstats and a binary crate wc-cli that prints word and character counts of a file using the library."},{"id":"14.3b","t":"Install a tool","p":"Install a well-known tool with cargo install (for example ripgrep or cargo-watch), find where the binary went, and use it once. Note what it does in your notes."}]}]},{"id":"c15","n":"15","book":15,"t":"Smart pointers","goal":"Use Box, Rc and RefCell for heap data, shared ownership and interior mutability, understand Deref and Drop, and avoid reference cycles with Weak.","res":[["Chapter 15 in the book","https://doc.rust-lang.org/book/ch15-00-smart-pointers.html"],["std::rc","https://doc.rust-lang.org/std/rc/"],["std::cell","https://doc.rust-lang.org/std/cell/"]],"items":[{"id":"15.1","t":"Box and recursive types","min":45,"learn":"Put data on the heap with Box, why recursive types such as a cons list need indirection, and when Box is the right choice.","kind":"lesson","ex":[{"id":"15.1a","t":"A binary tree","p":"Define enum Tree { Leaf, Node(Box<Tree>, i32, Box<Tree>) } with insert(self, v: i32) -> Tree for a binary search tree, plus contains and an in-order to_vec."},{"id":"15.1b","t":"Box a large value","p":"Create a struct holding a [u8; 1_000_000] buffer, and show with std::mem::size_of that a Box of it is only pointer-sized. Move the Box into a function and back."}]},{"id":"15.2","t":"Deref and Drop","min":60,"learn":"Implement Deref so a type behaves like a reference, deref coercion in function calls, implement Drop for cleanup, and drop a value early with std::mem::drop.","kind":"lesson","ex":[{"id":"15.2a","t":"A timer guard","p":"Write struct Timer { label: &'static str, start: Instant } whose Drop prints how long it lived. Use it to time a block of work by just creating it at the top of the block."},{"id":"15.2b","t":"Deref for a wrapper","p":"Create struct Name(String) with Deref to str, so a Name can be passed to functions taking &str and can call str methods like len and to_uppercase directly."}]},{"id":"15.3","t":"Rc and shared ownership","min":45,"learn":"Share ownership of one value with Rc, clone the pointer instead of the data, and watch the strong count change.","kind":"lesson","ex":[{"id":"15.3a","t":"Shared configuration","p":"Create an Rc<Config> and give it to three Worker structs. Print the strong count, drop one worker, and print it again."},{"id":"15.3b","t":"A graph of shared nodes","p":"Build nodes A, B, C, D where B and C both point to D, using Rc<Node> with a Vec of children. Print D's strong count and the names reachable from A."}]},{"id":"15.4","t":"RefCell and interior mutability","min":75,"learn":"Borrow rules checked at run time with RefCell, borrow and borrow_mut, the panic when the rules are broken, a mock object for tests, and Rc<RefCell<T>> for shared mutable data.","kind":"lesson","ex":[{"id":"15.4a","t":"A shared bank ledger","p":"Two Teller structs share one Rc<RefCell<Vec<i64>>> ledger. Each teller has deposit(&self, amount) that records into the shared ledger. Print the total after both tellers make deposits."},{"id":"15.4b","t":"Trigger the panic on purpose","p":"Write a test marked should_panic that holds a borrow_mut and then calls borrow on the same RefCell. Then fix the code by limiting the first borrow to a block."}]},{"id":"15.5","t":"Reference cycles and Weak","min":45,"learn":"How two Rc values pointing at each other leak memory, and how Weak references for parent links break the cycle, with upgrade, strong_count and weak_count.","kind":"lesson","ex":[{"id":"15.5a","t":"Find the root","p":"Using the Node type from the example, write fn root_value(node: &Rc<Node>) -> i32 that follows parent links up until there is no parent. Build a three-level tree and test it."},{"id":"15.5b","t":"Prove the leak","p":"Make two nodes that hold Rc pointers to each other through RefCell, give the node type a Drop that prints, and show that nothing is printed when main ends. Then change one link to Weak and show both drops happen."}]}]},{"id":"c16","n":"16","book":16,"t":"Fearless concurrency","goal":"Run code on several threads, pass messages between them, share state safely with Arc and Mutex, and understand what Send and Sync guarantee.","res":[["Chapter 16 in the book","https://doc.rust-lang.org/book/ch16-00-concurrency.html"],["std::thread","https://doc.rust-lang.org/std/thread/"],["std::sync","https://doc.rust-lang.org/std/sync/"]],"items":[{"id":"16.1","t":"Threads","min":45,"learn":"Start threads with thread::spawn, wait for them with join, move data into a thread with a move closure, and borrow local data safely with scoped threads.","kind":"lesson","ex":[{"id":"16.1a","t":"Parallel sum","p":"Split a Vec of the numbers 1 to 1,000,000 into four chunks and sum each chunk on its own scoped thread. Add the four results and check them against the formula n(n+1)/2."},{"id":"16.1b","t":"Return values from threads","p":"Spawn five threads with thread::spawn that each compute the square of their index after sleeping a little, collect the JoinHandles, and print the results in index order."}]},{"id":"16.2","t":"Message passing with channels","min":45,"learn":"Create a channel with mpsc::channel, send values from producer threads, receive with recv or by iterating, ownership moving through send, and cloning the sender for several producers.","kind":"lesson","ex":[{"id":"16.2a","t":"A worker pipeline","p":"Spawn three worker threads that each receive the same job description and send back a (worker_id, result) tuple through one channel. The main thread prints all results once all workers finish."},{"id":"16.2b","t":"A bounded queue","p":"Use mpsc::sync_channel(2) so a fast producer has to wait for a slow consumer. Print when each item is sent and received to see the back-pressure."}]},{"id":"16.3","t":"Shared state with Mutex and Arc","min":60,"learn":"Lock a Mutex to get a guard, the guard unlocking on drop, why Rc does not work across threads, sharing with Arc, and deadlocks to watch out for.","kind":"lesson","ex":[{"id":"16.3a","t":"A shared inventory","p":"Store a HashMap<String, u32> of stock in Arc<Mutex<...>>. Spawn four threads that each sell items, reducing the stock but never below zero, and print the final stock."},{"id":"16.3b","t":"Spot the deadlock","p":"Write two threads that lock Mutex A then B, and B then A, with a short sleep in between, and see the program hang. Fix it by making both threads lock in the same order."}]},{"id":"16.4","t":"Send and Sync","min":30,"learn":"What the Send and Sync marker traits mean, why Rc and RefCell are neither, how the compiler uses them to reject unsafe sharing, and why you rarely implement them yourself.","kind":"lesson","ex":[{"id":"16.4a","t":"Make it compile","p":"Fix the example by switching to the thread-safe types, then extend it so two threads each add to a shared total stored inside."},{"id":"16.4b","t":"Which are Send and Sync","p":"Write a function fn assert_send<T: Send>() {} and fn assert_sync<T: Sync>() {}, then call them for i32, String, Vec<u8>, Arc<Mutex<i32>>, Rc<i32> and Cell<i32>. Note which calls fail and why."}]}]},{"id":"c17","n":"17","book":17,"t":"Async and await","goal":"Write asynchronous code with async and await, run many tasks concurrently on one thread, combine futures, and process streams.","res":[["Chapter 17 in the book","https://doc.rust-lang.org/book/ch17-00-async-await.html"],["Tokio tutorial","https://tokio.rs/tokio/tutorial"],["Asynchronous Programming in Rust","https://rust-lang.github.io/async-book/"]],"items":[{"id":"17.1","t":"Futures and the async syntax","min":60,"learn":"What a future is, async fn and async blocks, await points, why futures do nothing until awaited, and starting a runtime. The book uses its trpl crate, a thin wrapper over Tokio; these lessons use Tokio directly, as real projects do.","kind":"lesson","ex":[{"id":"17.1a","t":"First async program","p":"Create a Cargo project with Tokio, write async fn slow_add(a: u32, b: u32) -> u32 that sleeps 100 ms and returns the sum, and await it twice in main, printing the elapsed time."},{"id":"17.1b","t":"Laziness in action","p":"Create a future with an async block that prints \"running\", then show that the message only appears after you await it, and never appears if the future is dropped without being awaited."}]},{"id":"17.2","t":"Concurrency with async","min":60,"learn":"Run futures at the same time with join!, spawn independent tasks with tokio::spawn, pass messages between tasks with tokio::sync::mpsc, and move ownership into async blocks.","kind":"lesson","ex":[{"id":"17.2a","t":"Fetch three pages at once","p":"Simulate fetching three URLs with different delays using an async fn, run them together with tokio::join!, and show the total time is the longest delay rather than the sum."},{"id":"17.2b","t":"Spawned workers report back","p":"Spawn five tasks with tokio::spawn that each send a message with their id after a random-ish delay (for example 50 ms times (5 - id)), and collect all five messages in the order they arrive."}]},{"id":"17.3","t":"Working with any number of futures","min":60,"learn":"Wait for a whole list of futures with join_all, race futures with tokio::select!, add a timeout, and yield control so long loops do not starve other tasks.","kind":"lesson","ex":[{"id":"17.3a","t":"A health checker","p":"Check five fake services concurrently with join_all; each check sleeps for a different time and returns Ok or Err. Wrap each check in a 150 ms timeout and print a status line per service."},{"id":"17.3b","t":"First response wins","p":"Query two mirror servers (simulated with sleeps) using tokio::select!, print which mirror answered first, and check that the slower one was cancelled by giving it a print statement after its sleep."}]},{"id":"17.4","t":"Streams, async traits and threads","min":60,"learn":"Streams as asynchronous iterators, processing them with StreamExt, the Future trait, Pin and Unpin at a high level, and choosing between threads and async tasks.","kind":"lesson","ex":[{"id":"17.4a","t":"Batch a stream","p":"Turn the numbers 1 to 20 into a stream, keep only multiples of 3, and use chunks_timeout or a manual buffer to print them in batches of 2."},{"id":"17.4b","t":"Async or threads","p":"For each workload decide async or threads and write one sentence why. (1) Resize 10,000 images. (2) Serve 5,000 idle websocket connections. (3) Call 200 REST endpoints. (4) Compress a 10 GB file while keeping a UI responsive."}]}]},{"id":"c18","n":"18","book":18,"t":"Object-oriented programming features","goal":"Map object-oriented ideas onto Rust, use trait objects for runtime polymorphism, and implement the state pattern two ways.","res":[["Chapter 18 in the book","https://doc.rust-lang.org/book/ch18-00-oop.html"],["The Rust Reference, trait objects","https://doc.rust-lang.org/reference/types/trait-object.html"]],"items":[{"id":"18.1","t":"Object-oriented ideas in Rust","min":30,"learn":"Objects as data plus behaviour, encapsulation with pub and private fields, why Rust has no inheritance, and getting code reuse and polymorphism from traits instead.","kind":"lesson","ex":[{"id":"18.1a","t":"Encapsulate a temperature log","p":"Write a TempLog that keeps readings private and also caches the minimum and maximum, updated on every add. Expose add, min, max and len only."},{"id":"18.1b","t":"Reuse without inheritance","p":"Give three types (Circle, Square, Hexagon) a shared describe method through a Shape trait with required name and area methods and a default describe that uses them."}]},{"id":"18.2","t":"Trait objects","min":60,"learn":"Store values of different types behind dyn Trait in a Box, dynamic dispatch through a vtable, the difference from generics, and which traits can be made into trait objects (dyn compatibility).","kind":"lesson","ex":[{"id":"18.2a","t":"A plugin pipeline","p":"Define trait Step { fn name(&self) -> &str; fn apply(&self, input: String) -> String; } and build a Vec<Box<dyn Step>> pipeline with Trim, Upper and Replace { from, to } steps. Run text through every step and log each step's name."},{"id":"18.2b","t":"Generic or dyn","p":"Write the same \"render all\" function twice, once generic (fn render_all<T: Draw>(items: &[T])) and once with trait objects (fn render_dyn(items: &[&dyn Draw])), then show a call that only the dyn version accepts."}]},{"id":"18.3","t":"The state pattern, two ways","min":60,"learn":"Implement a blog post workflow with trait-object states that change at run time, then re-implement it with separate types so invalid transitions cannot even compile.","kind":"lesson","ex":[{"id":"18.3a","t":"Trait-object states","p":"Implement the book's run-time version: Post with state Option<Box<dyn State>> and states Draft, PendingReview and Published, where content returns an empty string unless the post is published."},{"id":"18.3b","t":"Two approvals","p":"Extend the type-state version so a PendingReviewPost needs two calls to approve before it becomes a Post. Model the half-approved state as its own type."}]}]},{"id":"c19","n":"19","book":19,"t":"Patterns and matching","goal":"Use patterns everywhere they are allowed, tell refutable from irrefutable patterns, and write expressive matches with destructuring, guards and bindings.","res":[["Chapter 19 in the book","https://doc.rust-lang.org/book/ch19-00-patterns.html"],["The Rust Reference, patterns","https://doc.rust-lang.org/reference/patterns.html"]],"items":[{"id":"19.1","t":"Where patterns appear and refutability","min":45,"learn":"Patterns in match, if let, while let, for, let and function parameters, and why let needs irrefutable patterns while if let and let...else accept refutable ones.","kind":"lesson","ex":[{"id":"19.1a","t":"Parameters that destructure","p":"Write fn distance(&(x1, y1) &(f64, f64), &(x2, y2) &(f64, f64)) -> f64 using patterns in the parameters, and use it in a for loop over pairs of points."},{"id":"19.1b","t":"Drain a queue with while let","p":"Process a VecDeque of tasks with while let Some(task) = queue.pop_front(), where some tasks add follow-up tasks to the back. Stop when the queue is empty and print the order."}]},{"id":"19.2","t":"Pattern syntax","min":75,"learn":"Literals, named variables and shadowing, multiple patterns with |, ranges with ..=, destructuring structs, enums, nested values and references, ignoring with _ and .., match guards, and @ bindings.","kind":"lesson","ex":[{"id":"19.2a","t":"HTTP status classifier","p":"Write fn describe(code: u16) -> String using ranges, |, a guard and @, so 200 gives \"OK\", 201 to 299 \"success CODE\", 301 or 302 \"redirect\", other 3xx \"other redirect\", 404 \"not found\", 4xx \"client error\", 5xx \"server error CODE\" and anything else \"unknown\"."},{"id":"19.2b","t":"Destructure nested data","p":"Given enum Shape { Circle { center: (i32, i32), r: u32 }, Line((i32, i32), (i32, i32)) }, write fn touches_origin(s: &Shape) -> bool using nested patterns: a circle centred at (0, 0), or a line with either end at (0, 0)."}]},{"id":"19.3","t":"Slice patterns and let chains","min":45,"learn":"Match on the shape of slices with [first, .., last] and [head, tail @ ..], combine conditions with let chains in if (Rust 2024), and use matches! for quick checks.","kind":"lesson","ex":[{"id":"19.3a","t":"A tiny command parser","p":"Parse commands from words with slice patterns, [\"add\", item], [\"remove\", item], [\"list\"] and [\"rename\", old, new], returning an enum Command or an Err with a helpful message."},{"id":"19.3b","t":"Flatten nested if lets","p":"Rewrite this with a let chain: if let Some(user) = find(id) { if let Some(email) = user.email { if email.ends_with(\"@example.com\") { notify(email) } } }."}]}]},{"id":"c20","n":"20","book":20,"t":"Advanced features","goal":"Read and write unsafe code responsibly, use advanced trait and type features, return closures, and write your own macros.","res":[["Chapter 20 in the book","https://doc.rust-lang.org/book/ch20-00-advanced-features.html"],["The Rustonomicon","https://doc.rust-lang.org/nomicon/"],["The Little Book of Rust Macros","https://veykril.github.io/tlborm/"]],"items":[{"id":"20.1","t":"Unsafe Rust","min":60,"learn":"The five unsafe superpowers, raw pointers, calling unsafe functions, building a safe abstraction like split_at_mut, extern functions, mutable statics, and why unsafe blocks should be small and documented.","kind":"lesson","ex":[{"id":"20.1a","t":"Swap through raw pointers","p":"Write fn swap_ends(v: &mut [i32]) that swaps the first and last elements using raw pointers and std::ptr::swap, with a SAFETY comment. Make it do nothing for slices shorter than 2, and test it."},{"id":"20.1b","t":"A global counter","p":"Count how many times a function is called using a static AtomicUsize, then explain in a comment why this is better than static mut."}]},{"id":"20.2","t":"Advanced traits","min":60,"learn":"Associated types versus generic parameters, default type parameters and operator overloading with Add, fully qualified syntax for methods with the same name, supertraits, and the newtype pattern for implementing outside traits on outside types.","kind":"lesson","ex":[{"id":"20.2a","t":"Money arithmetic","p":"Implement Add, Sub and Mul<i64> (multiplying by a quantity) for a Money(i64) of cents type, plus Display, so you can write Money(1999) * 3 + Money(500)."},{"id":"20.2b","t":"A supertrait for reports","p":"Define trait Report: Display + Debug with a default fn report(&self) -> String combining both formats, and implement it for a TestRun { passed: u32, failed: u32 } struct."}]},{"id":"20.3","t":"Advanced types and functions","min":45,"learn":"Type aliases, the never type, dynamically sized types and the Sized bound, function pointers versus closures, and returning closures with impl Fn or Box<dyn Fn>.","kind":"lesson","ex":[{"id":"20.3a","t":"A calculator table","p":"Build a HashMap<&str, fn(f64, f64) -> f64> of operations (+, -, *, /) using function pointers and closures that capture nothing, then evaluate a list of (a, op, b) expressions."},{"id":"20.3b","t":"Composing functions","p":"Write fn compose<A, B, C>(f: impl Fn(A) -> B, g: impl Fn(B) -> C) -> impl Fn(A) -> C and use it to build a slugify function from trim, lowercase and replace-spaces steps."}]},{"id":"20.4","t":"Macros","min":75,"learn":"How macros differ from functions, declarative macros with macro_rules and repetition, hygiene, and an overview of the three kinds of procedural macros (derive, attribute-like and function-like).","kind":"lesson","ex":[{"id":"20.4a","t":"A max! macro","p":"Write a macro max! that takes one or more expressions and returns the largest, so max!(3), max!(3, 9, 2) all work. Use recursion in the macro."},{"id":"20.4b","t":"Generate getters","p":"Write a macro getters! that, given a struct name and a list of field: Type pairs, generates the struct and a getter method for each field."}]}]},{"id":"c21","n":"21","book":21,"t":"Final project: a multithreaded web server","goal":"Build an HTTP server from TCP sockets up, make it handle requests in parallel with a thread pool you write yourself, and shut it down gracefully.","res":[["Chapter 21 in the book","https://doc.rust-lang.org/book/ch21-00-final-project-a-web-server.html"],["std::net","https://doc.rust-lang.org/std/net/"]],"items":[{"id":"21.1","t":"A single-threaded web server","min":75,"learn":"Listen on a port with TcpListener, read an HTTP request line with BufReader, write a valid response with a status line, headers and an HTML body, and route / versus everything else.","kind":"project","ex":[{"id":"21.1a","t":"Build and visit it","p":"Create the hello project with hello.html and 404.html, run it, and open http://127.0.0.1:7878 and http://127.0.0.1:7878/nope in a browser. Then print each request line to the terminal."},{"id":"21.1b","t":"A JSON health endpoint","p":"Add a route GET /health that returns {\"status\":\"ok\"} with a Content-Type application/json header, and test it with curl -i http://127.0.0.1:7878/health."}]},{"id":"21.2","t":"From single-threaded to a thread pool","min":120,"learn":"Show the problem with a slow /sleep route, design a ThreadPool API first, build it from Workers that pull jobs from a shared channel, and type jobs as Box<dyn FnOnce() + Send + 'static>.","kind":"project","ex":[{"id":"21.2a","t":"Prove the slowdown, then fix it","p":"Add a GET /sleep route that sleeps five seconds. Open /sleep and / in two tabs and observe / waiting. Then use your ThreadPool with four threads in main via pool.execute(|| handle_connection(stream)) and observe / responding immediately."},{"id":"21.2b","t":"Measure with a mini load test","p":"Write a separate Rust program that opens 20 TCP connections at once to your server (one thread each), requests /, and reports the slowest response time. Compare a pool of 1 thread with a pool of 4 while one /sleep request is running."}]},{"id":"21.3","t":"Graceful shutdown and cleanup","min":75,"learn":"Implement Drop for ThreadPool so it closes the channel and joins every worker, store the sender in an Option so it can be dropped first, and stop the server after a fixed number of requests to watch the shutdown.","kind":"project","ex":[{"id":"21.3a","t":"Shut down after N requests","p":"Make your server accept an optional command-line argument for how many requests to serve before shutting down, and print a summary line with the count when it exits."},{"id":"21.3b","t":"A fallible pool builder","p":"Replace ThreadPool::new's assert with ThreadPool::build(size) -> Result<ThreadPool, PoolCreationError>, where PoolCreationError is your own error type implementing Display and std::error::Error."}]}]}];
