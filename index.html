32, u32, u32)) -> Self { Version { major, minor, patch } }\n}\n\nfn main() {\n    let mut vs: Vec<Version> = [\"1.10.0\", \"v1.2.3\", \"0.9.12\"].iter().map(|s| s.parse().unwrap()).collect();\n    vs.sort();\n    println!(\"{vs:?}\");\n    let v: Version = (2, 0, 0).into();\n    println!(\"{} {:?}\", v > vs[2], \"1.x\".parse::<Version>());\n    println!(\"{:?}\", Version::default());\n}","output":"[Version { major: 0, minor: 9, patch: 12 }, Version { major: 1, minor: 2, patch: 3 }, Version { major: 1, minor: 10, patch: 0 }]\ntrue Err(\"expected X.Y.Z, got 1.x\")\nVersion { major: 0, minor: 0, patch: 0 }"},"exercises":{"A5.2a":{"lang":"rust","hints":["impl TryFrom<u8> for Weekday { type Error = String; fn try_from(n: u8) -> Result<Self, Self::Error> }","Implementing TryFrom gives you u8::try_into() for free.","For the reverse direction, cast the enum with as u8 after giving variants explicit values."],"solution":"use std::convert::TryFrom;\n\n#[derive(Debug, Clone, Copy, PartialEq)]\n#[repr(u8)]\nenum Weekday { Mon = 1, Tue, Wed, Thu, Fri, Sat, Sun }\n\nimpl TryFrom<u8> for Weekday {\n    type Error = String;\n    fn try_from(n: u8) -> Result<Self, Self::Error> {\n        use Weekday::*;\n        Ok(match n {\n            1 => Mon, 2 => Tue, 3 => Wed, 4 => Thu, 5 => Fri, 6 => Sat, 7 => Sun,\n            _ => return Err(format!(\"{n} is not a weekday number (1-7)\")),\n        })\n    }\n}\n\nimpl From<Weekday> for u8 {\n    fn from(d: Weekday) -> u8 { d as u8 }\n}\n\nfn main() {\n    let d: Result<Weekday, _> = 5u8.try_into();\n    println!(\"{d:?} {:?}\", Weekday::try_from(9));\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn round_trip() {\n        for n in 1..=7u8 {\n            let d = Weekday::try_from(n).unwrap();\n            assert_eq!(u8::from(d), n);\n        }\n        assert!(Weekday::try_from(0).is_err());\n    }\n}","explain":"TryFrom is the standard way to say \"this conversion can fail\", and implementing it unlocks try_into everywhere. Never implement From for a conversion that can fail; From is a promise of success."},"A5.2b":{"lang":"rust","hints":["use std::path::{Path, PathBuf};","Inside, call fs::read_to_string(path.as_ref()).","std's own fs functions are written exactly like this."],"solution":"use std::fs;\nuse std::io;\nuse std::path::{Path, PathBuf};\n\nfn count_lines<P: AsRef<Path>>(path: P) -> io::Result<usize> {\n    Ok(fs::read_to_string(path.as_ref())?.lines().count())\n}\n\nfn main() -> io::Result<()> {\n    fs::write(\"lines.txt\", \"a\\nb\\nc\\n\")?;\n    let s = String::from(\"lines.txt\");\n    let p = PathBuf::from(\"lines.txt\");\n    println!(\"{} {} {}\", count_lines(\"lines.txt\")?, count_lines(&s)?, count_lines(&p)?);\n    fs::remove_file(\"lines.txt\")?;\n    Ok(())\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn accepts_pathbuf() {\n        let p = std::env::temp_dir().join(\"asref_lines_test.txt\");\n        std::fs::write(&p, \"1\\n2\\n\").unwrap();\n        assert_eq!(count_lines(&p).unwrap(), 2);\n    }\n}","explain":"AsRef<Path> is implemented for str, String, Path, PathBuf, OsStr and more, so one signature accepts them all without forcing the caller to convert."}}},"A5.3":{"example":{"title":"Typestate and const generics","lang":"rust","note":"PhantomData lets a type carry a state parameter without storing anything, so the state check costs nothing at run time. Const generics put numbers in types, so a 2x3 matrix and a 3x2 matrix are different types and a mismatched multiplication fails to compile.","code":"use std::marker::PhantomData;\n\nstruct Open;\nstruct Closed;\n\nstruct Connection<State> {\n    addr: String,\n    _state: PhantomData<State>,     // zero bytes, compile-time only\n}\n\nimpl Connection<Closed> {\n    fn new(addr: &str) -> Self { Connection { addr: addr.into(), _state: PhantomData } }\n    fn open(self) -> Connection<Open> { Connection { addr: self.addr, _state: PhantomData } }\n}\n\nimpl Connection<Open> {\n    fn send(&self, msg: &str) -> String { format!(\"sent {msg:?} to {}\", self.addr) }\n    fn close(self) -> Connection<Closed> { Connection { addr: self.addr, _state: PhantomData } }\n}\n\n#[derive(Debug)]\nstruct Matrix<const R: usize, const C: usize>([[i32; C]; R]);\n\nimpl<const R: usize, const C: usize> Matrix<R, C> {\n    fn transpose(&self) -> Matrix<C, R> {\n        let mut out = [[0; R]; C];\n        for r in 0..R { for c in 0..C { out[c][r] = self.0[r][c]; } }\n        Matrix(out)\n    }\n}\n\nfn main() {\n    let conn = Connection::new(\"db:5432\").open();\n    println!(\"{}\", conn.send(\"SELECT 1\"));\n    let _closed = conn.close();\n    // _closed.send(\"x\"); // error: no method `send` for Connection<Closed>\n    let m = Matrix([[1, 2, 3], [4, 5, 6]]);\n    println!(\"{:?}\", m.transpose());\n    println!(\"size of Connection<Open>: {}\", std::mem::size_of::<Connection<Open>>());\n}","output":"sent \"SELECT 1\" to db:5432\nMatrix([[1, 4], [2, 5], [3, 6]])\nsize of Connection<Open>: 24"},"exercises":{"A5.3a":{"lang":"rust","hints":["struct RequestBuilder<S> { url: Option<String>, headers: Vec<(String, String)>, _s: PhantomData<S> }","Implement header for every S with impl<S> RequestBuilder<S>.","send exists only in impl RequestBuilder<HasUrl>."],"solution":"use std::marker::PhantomData;\n\nstruct NoUrl;\nstruct HasUrl;\n\nstruct RequestBuilder<S> {\n    url: Option<String>,\n    headers: Vec<(String, String)>,\n    _s: PhantomData<S>,\n}\n\nimpl RequestBuilder<NoUrl> {\n    fn new() -> Self {\n        RequestBuilder { url: None, headers: vec![], _s: PhantomData }\n    }\n    fn url(self, u: &str) -> RequestBuilder<HasUrl> {\n        RequestBuilder { url: Some(u.into()), headers: self.headers, _s: PhantomData }\n    }\n}\n\nimpl<S> RequestBuilder<S> {\n    fn header(mut self, k: &str, v: &str) -> Self {\n        self.headers.push((k.into(), v.into()));\n        self\n    }\n}\n\nimpl RequestBuilder<HasUrl> {\n    fn send(&self) -> String {\n        format!(\"GET {} with {} headers\", self.url.as_ref().unwrap(), self.headers.len())\n    }\n}\n\nfn main() {\n    let r = RequestBuilder::new().header(\"Accept\", \"json\").url(\"https://example.com\").header(\"X-Test\", \"1\");\n    println!(\"{}\", r.send());\n    // RequestBuilder::new().send(); // error: no method named `send` found\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn builds() {\n        assert_eq!(RequestBuilder::new().url(\"u\").send(), \"GET u with 0 headers\");\n    }\n}","explain":"The unwrap inside send is safe because the type guarantees url was set. Typestate builders are common in Rust HTTP, database and embedded libraries."},"A5.3b":{"lang":"rust","hints":["impl<const N: usize> std::ops::Add for Vector<N> { type Output = Self; ... }","Use std::array::from_fn(|i| self.0[i] + rhs.0[i]) to build the result.","dot sums the products of matching elements."],"solution":"use std::ops::Add;\n\n#[derive(Debug, Clone, Copy, PartialEq)]\nstruct Vector<const N: usize>([f64; N]);\n\nimpl<const N: usize> Vector<N> {\n    fn dot(&self, o: &Self) -> f64 {\n        self.0.iter().zip(o.0.iter()).map(|(a, b)| a * b).sum()\n    }\n}\n\nimpl<const N: usize> Add for Vector<N> {\n    type Output = Self;\n    fn add(self, rhs: Self) -> Self {\n        Vector(std::array::from_fn(|i| self.0[i] + rhs.0[i]))\n    }\n}\n\nfn main() {\n    let a = Vector([1.0, 2.0, 3.0]);\n    let b = Vector([4.0, 5.0, 6.0]);\n    println!(\"{:?} dot {}\", a + b, a.dot(&b));\n    // let c = Vector([1.0, 2.0]) + a; // error: expected `Vector<2>`, found `Vector<3>`\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn math() {\n        assert_eq!(Vector([1.0, 2.0]) + Vector([3.0, 4.0]), Vector([4.0, 6.0]));\n        assert_eq!(Vector([1.0, 0.0]).dot(&Vector([0.0, 1.0])), 0.0);\n    }\n}","explain":"The dimension check happens at compile time, with no run-time length test at all. Graphics and linear-algebra crates such as glam and nalgebra use this to make dimension bugs impossible."}}},"A6.1":{"example":{"title":"Visibility levels in one crate","lang":"rust","note":"pub(crate) shares an item inside your crate without making it part of the public API, which keeps you free to change it later. A prelude module re-exports the handful of items most users need. Every pub item is a promise you must keep across versions.","code":"mod billing {\n    pub struct Invoice { pub id: u32, pub(crate) total_cents: u64 }\n\n    pub(crate) fn tax(cents: u64) -> u64 { cents * 15 / 100 }   // whole crate only\n\n    pub mod format {\n        pub fn money(cents: u64) -> String { format!(\"${}.{:02}\", cents / 100, cents % 100) }\n        pub(super) fn internal_code(id: u32) -> String { format!(\"INV-{id:05}\") } // parent only\n    }\n\n    impl Invoice {\n        pub fn label(&self) -> String {\n            format!(\"{} {}\", format::internal_code(self.id), format::money(self.total_cents + tax(self.total_cents)))\n        }\n    }\n}\n\npub mod prelude {                     // one import for the common items\n    pub use crate::billing::format::money;\n    pub use crate::billing::Invoice;\n}\n\nuse prelude::*;\n\nfn main() {\n    let inv = Invoice { id: 42, total_cents: 10_000 };\n    println!(\"{} / {}\", inv.label(), money(250));\n}","output":"INV-00042 $115.00 / $2.50"},"exercises":{"A6.1a":{"lang":"rust","hints":["Ask whether an outside user needs the item to do their job.","Fields that must stay consistent with each other should be private, with methods.","Items only tests need can be private; unit tests in the same module can see them."],"solution":"mod billing {\n    pub struct Invoice {\n        id: u32,          // private: set only through new()\n        total_cents: u64, // private: invariants (non-negative, tax rules) live here\n    }\n\n    fn tax(cents: u64) -> u64 { cents * 15 / 100 } // private: a policy detail\n\n    impl Invoice {\n        pub fn new(id: u32, total_cents: u64) -> Self { Invoice { id, total_cents } }\n        pub fn id(&self) -> u32 { self.id }\n        pub fn label(&self) -> String {\n            format!(\"INV-{:05} {}\", self.id, money(self.total_cents + tax(self.total_cents)))\n        }\n    }\n\n    pub fn money(cents: u64) -> String { // pub: useful to every caller\n        format!(\"${}.{:02}\", cents / 100, cents % 100)\n    }\n}\n\nfn main() {\n    let inv = billing::Invoice::new(7, 999);\n    println!(\"{} {}\", inv.id(), inv.label());\n}","explain":"A smaller API is easier to document, test and keep stable. You can always make something public later, but making a public item private is a breaking change."},"A6.1b":{"lang":"text","hints":["By type puts all structs together, all services together, and so on.","By feature puts everything about tasks in one module.","Think about how many files a typical change touches."],"solution":"By type:                     By feature:\nsrc/                         src/\n  models/{user,task,note}.rs   users/{mod,model,service,handler}.rs\n  services/{user,task,...}.rs  tasks/{mod,model,service,handler}.rs\n  handlers/{user,task,...}.rs  notifications/{mod,model,service}.rs\n  lib.rs                       lib.rs\n\nBy type: easy to find \"all the handlers\"; fine for small crates.\nBy feature: a change to tasks touches one folder, and pub(crate)\ncan keep each feature's internals private from the others.","explain":"Most growing Rust codebases drift toward organising by feature, because module privacy then matches the boundaries of the domain."}}},"A6.2":{"example":{"title":"A Cargo.toml with features","lang":"toml","note":"A version like \"1\" accepts any compatible release, and Cargo.lock pins the exact one; cargo update moves within the allowed range. Features must be additive, enabling one should never break another, because Cargo unifies features across the whole dependency graph.","code":"[package]\nname = \"reportgen\"\nversion = \"0.3.0\"\nedition = \"2024\"\nrust-version = \"1.85\"           # minimum supported Rust version\n\n[dependencies]\nserde = { version = \"1\", features = [\"derive\"] }   # \"1\" means >=1.0.0, <2.0.0\nserde_json = { version = \"1\", optional = true }    # only with the json feature\nchrono = { version = \"0.4\", default-features = false, features = [\"clock\"] }\n\n[dev-dependencies]\nproptest = \"1\"                  # tests and benchmarks only\n\n[features]\ndefault = [\"json\"]\njson = [\"dep:serde_json\"]\ncsv = []\n\n# In code:  #[cfg(feature = \"json\")] pub mod json;\n# $ cargo tree -e features      # who enabled what\n# $ cargo build --no-default-features --features csv\n# $ cargo install cargo-audit && cargo audit","output":""},"exercises":{"A6.2a":{"lang":"text","hints":["owo-colors = { version = \"4\", optional = true } and colors = [\"dep:owo-colors\"].","Write two versions of one function, one with #[cfg(feature = \"colors\")] and one with #[cfg(not(feature = \"colors\"))].","cargo run --features colors turns it on."],"solution":"# Cargo.toml\n[dependencies]\nowo-colors = { version = \"4\", optional = true }\n\n[features]\ncolors = [\"dep:owo-colors\"]\n\n// src/main.rs\n#[cfg(feature = \"colors\")]\nfn error_line(msg: &str) -> String {\n    use owo_colors::OwoColorize;\n    format!(\"{}\", msg.red())\n}\n\n#[cfg(not(feature = \"colors\"))]\nfn error_line(msg: &str) -> String {\n    format!(\"error: {msg}\")\n}\n\nfn main() {\n    eprintln!(\"{}\", error_line(\"file not found\"));\n}\n\n// cargo run                    -> plain text\n// cargo run --features colors  -> red text","explain":"Optional dependencies keep the default build small and fast to compile. Test both configurations in CI, since code behind a feature flag is easy to break unnoticed."},"A6.2b":{"lang":"bash","hints":["cargo tree -i some_crate shows who depends on some_crate.","Duplicates appear when two crates need incompatible versions of a third.","cargo audit checks Cargo.lock against the RustSec advisory database."],"solution":"$ cargo tree | head\nguess v0.1.0\n└── rand v0.8.5\n    ├── libc v0.2.x\n    ├── rand_chacha v0.3.1\n    │   ├── ppv-lite86 v0.2.x\n    │   └── rand_core v0.6.4\n    └── rand_core v0.6.4\n$ cargo tree -d\n(nothing printed: no duplicate versions)\n$ cargo audit\nScanning Cargo.lock for vulnerabilities (12 crate dependencies)\n(no advisories found)","explain":"Knowing your dependency tree is part of shipping software responsibly. cargo audit (and cargo deny for licences and policies) are standard steps in a Rust CI pipeline."}}},"A6.3":{"example":{"title":"Doc tests with ? and hidden lines","lang":"rust","note":"Lines starting with # inside a doc example run but are hidden in the rendered docs, which lets examples use ? without clutter. [`format_secs`] becomes a clickable link that rustdoc checks. missing_docs warns about every undocumented public item.","code":"#![warn(missing_docs)]\n//! Tools for parsing durations such as `\"1h30m\"`.\n\n/// Parses a duration like `\"1h30m\"` or `\"45s\"` into seconds.\n///\n/// See also [`format_secs`] for the reverse direction.\n///\n/// # Errors\n///\n/// Returns an error message if a number is missing or a unit is unknown.\n///\n/// # Examples\n///\n/// ```\n/// # fn main() -> Result<(), String> {\n/// # use durations::parse_secs;\n/// assert_eq!(parse_secs(\"1h30m\")?, 5400);\n/// assert!(parse_secs(\"10x\").is_err());\n/// # Ok(())\n/// # }\n/// ```\npub fn parse_secs(s: &str) -> Result<u64, String> {\n    let mut total = 0;\n    let mut num = String::new();\n    for c in s.chars() {\n        if c.is_ascii_digit() {\n            num.push(c);\n            continue;\n        }\n        let n: u64 = num.parse().map_err(|_| format!(\"missing number before {c}\"))?;\n        num.clear();\n        total += n * match c {\n            'h' => 3600,\n            'm' => 60,\n            's' => 1,\n            _ => return Err(format!(\"unknown unit {c}\")),\n        };\n    }\n    Ok(total)\n}\n\n/// Formats seconds as `\"XhYmZs\"`, the inverse of [`parse_secs`].\npub fn format_secs(secs: u64) -> String {\n    format!(\"{}h{}m{}s\", secs / 3600, secs % 3600 / 60, secs % 60)\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn round_trip() {\n        assert_eq!(parse_secs(&format_secs(3725)).unwrap(), 3725);\n    }\n}","output":""},"exercises":{"A6.3a":{"lang":"text","hints":["Put #![warn(missing_docs)] at the top of lib.rs.","Link items with [`name`] or [`Type::method`].","cargo test --doc runs only the documentation tests."],"solution":"//! # textstats\n//! Word, line and character statistics for text.\n#![warn(missing_docs)]\n\n/// Counts words separated by whitespace.\n///\n/// For characters instead of words, see [`char_count`].\n///\n/// ```\n/// assert_eq!(textstats::word_count(\"one two\"), 2);\n/// ```\npub fn word_count(s: &str) -> usize { s.split_whitespace().count() }\n\n/// Counts Unicode scalar values (what Rust calls `char`s).\n///\n/// ```\n/// assert_eq!(textstats::char_count(\"naïve\"), 5);\n/// ```\npub fn char_count(s: &str) -> usize { s.chars().count() }","explain":"Docs with tested examples are the first thing people look at on docs.rs, and broken intra-doc links show up as warnings, so docs stay correct as the code changes."},"A6.3b":{"lang":"text","hints":["Put the attribute at the top of lib.rs.","Code blocks marked ```rust in the README become doc tests.","Mark blocks that should not run with ```text or ```ignore."],"solution":"// src/lib.rs\n#![doc = include_str!(\"../README.md\")]\n\n// README.md\n// # textstats\n// ```rust\n// let n = textstats::word_count(\"hello brave world\");\n// assert_eq!(n, 3);\n// ```\n\n// $ cargo test --doc\n// test src/lib.rs - (line 1) ... ok","explain":"README examples are what most people copy first. Testing them means the very first impression of your crate is code that actually compiles."}}},"A7.1":{"example":{"title":"A shared cache and a lazily built table","lang":"rust","note":"RwLock lets many threads read at once but gives a writer exclusive access, which suits caches and configuration that are read far more often than written. LazyLock (stable since 1.80) replaces the older lazy_static and once_cell crates for global tables.","code":"use std::collections::HashMap;\nuse std::sync::{Arc, LazyLock, RwLock};\nuse std::thread;\n\nstatic UNITS: LazyLock<HashMap<&'static str, u64>> = LazyLock::new(|| {\n    HashMap::from([(\"KB\", 1 << 10), (\"MB\", 1 << 20), (\"GB\", 1 << 30)]) // built on first use\n});\n\nfn main() {\n    let cache: Arc<RwLock<HashMap<String, u64>>> = Arc::new(RwLock::new(HashMap::new()));\n    cache.write().unwrap().insert(\"limit\".into(), 5 * UNITS[\"MB\"]);\n\n    let readers: Vec<_> = (0..4).map(|i| {\n        let cache = Arc::clone(&cache);\n        thread::spawn(move || {\n            let guard = cache.read().unwrap();          // many readers at once\n            format!(\"reader {i} sees {:?}\", guard.get(\"limit\"))\n        })\n    }).collect();\n    for r in readers { println!(\"{}\", r.join().unwrap()); }\n}","output":"reader 0 sees Some(5242880)\nreader 1 sees Some(5242880)\nreader 2 sees Some(5242880)\nreader 3 sees Some(5242880)"},"exercises":{"A7.1a":{"lang":"rust","hints":["Share Arc<(Mutex<VecDeque<String>>, Condvar)>.","In the worker: let mut q = lock.lock().unwrap(); while q.is_empty() { q = cvar.wait(q).unwrap(); }","After pushing, call cvar.notify_one()."],"solution":"use std::collections::VecDeque;\nuse std::sync::{Arc, Condvar, Mutex};\nuse std::thread;\n\nfn main() {\n    let board = Arc::new((Mutex::new(VecDeque::<String>::new()), Condvar::new()));\n    let workers: Vec<_> = (0..2)\n        .map(|id| {\n            let board = Arc::clone(&board);\n            thread::spawn(move || {\n                let (lock, cvar) = &*board;\n                loop {\n                    let job = {\n                        let mut q = lock.lock().unwrap();\n                        while q.is_empty() {\n                            q = cvar.wait(q).unwrap(); // releases the lock while waiting\n                        }\n                        q.pop_front().unwrap()\n                    };\n                    if job == \"stop\" {\n                        break;\n                    }\n                    println!(\"worker {id} did {job}\");\n                }\n            })\n        })\n        .collect();\n\n    let (lock, cvar) = &*board;\n    for j in (1..=5).map(|n| format!(\"job {n}\")).chain([\"stop\".into(), \"stop\".into()]) {\n        lock.lock().unwrap().push_back(j);\n        cvar.notify_one();\n    }\n    for w in workers {\n        w.join().unwrap();\n    }\n}","explain":"The while loop around wait guards against spurious wakeups, which Condvar allows. In practice a channel is simpler for this job; Condvar is the right tool when threads wait for a condition on shared state rather than for messages."},"A7.1b":{"lang":"rust","hints":["Clone the needed value out of the guard, then drop the guard before printing.","let level = { cfg.read().unwrap().log_level.clone() };","The writer uses cfg.write().unwrap().log_level = ..."],"solution":"use std::sync::{Arc, RwLock};\nuse std::thread;\nuse std::time::Duration;\n\nstruct Config {\n    log_level: String,\n}\n\nfn main() {\n    let cfg = Arc::new(RwLock::new(Config { log_level: \"info\".into() }));\n    let readers: Vec<_> = (0..3)\n        .map(|i| {\n            let cfg = Arc::clone(&cfg);\n            thread::spawn(move || {\n                for _ in 0..3 {\n                    let level = cfg.read().unwrap().log_level.clone(); // guard dropped here\n                    println!(\"reader {i}: {level}\");\n                    thread::sleep(Duration::from_millis(10));\n                }\n            })\n        })\n        .collect();\n    thread::sleep(Duration::from_millis(15));\n    cfg.write().unwrap().log_level = \"debug\".into();\n    for r in readers {\n        r.join().unwrap();\n    }\n}","explain":"The guard is a temporary that ends with the statement, so the lock is released before the slow println. Holding locks during I/O is a common cause of contention that only shows up under load."}}},"A7.2":{"example":{"title":"Counters and a stop flag","lang":"rust","note":"Atomics change a value without a lock. Relaxed only guarantees the operation itself is atomic, fine for counters. A Release store paired with an Acquire load also makes every write before the store visible after the load, which is what flags guarding data need. SeqCst is the simplest choice when in doubt.","code":"use std::sync::atomic::{AtomicBool, AtomicU64, Ordering};\nuse std::sync::Arc;\nuse std::thread;\nuse std::time::Duration;\n\nfn main() {\n    let requests = Arc::new(AtomicU64::new(0));\n    let stop = Arc::new(AtomicBool::new(false));\n\n    let workers: Vec<_> = (0..4).map(|_| {\n        let (requests, stop) = (Arc::clone(&requests), Arc::clone(&stop));\n        thread::spawn(move || {\n            while !stop.load(Ordering::Acquire) {\n                requests.fetch_add(1, Ordering::Relaxed);   // just a count: Relaxed is enough\n                thread::sleep(Duration::from_millis(1));\n            }\n        })\n    }).collect();\n\n    thread::sleep(Duration::from_millis(50));\n    stop.store(true, Ordering::Release);                    // publish the stop request\n    for w in workers { w.join().unwrap(); }\n    println!(\"handled some requests: {}\", requests.load(Ordering::Relaxed) > 0);\n\n    let max = AtomicU64::new(10);\n    let _ = max.fetch_max(42, Ordering::Relaxed);\n    let swapped = max.compare_exchange(42, 7, Ordering::AcqRel, Ordering::Acquire);\n    println!(\"{swapped:?} now {}\", max.load(Ordering::Relaxed));\n}","output":"handled some requests: true\nOk(42) now 7"},"exercises":{"A7.2a":{"lang":"rust","hints":["fetch_add(1, Ordering::Relaxed) returns the previous value.","Use thread::scope so threads can borrow the generator.","Collect into a HashSet and check its length."],"solution":"use std::collections::HashSet;\nuse std::sync::atomic::{AtomicU64, Ordering};\nuse std::thread;\n\nstruct IdGen {\n    next: AtomicU64,\n}\n\nimpl IdGen {\n    fn next(&self) -> u64 {\n        self.next.fetch_add(1, Ordering::Relaxed)\n    }\n}\n\nfn generate(threads: usize, per: usize) -> Vec<u64> {\n    let g = IdGen { next: AtomicU64::new(1) };\n    thread::scope(|s| {\n        let hs: Vec<_> = (0..threads).map(|_| s.spawn(|| (0..per).map(|_| g.next()).collect::<Vec<_>>())).collect();\n        hs.into_iter().flat_map(|h| h.join().unwrap()).collect()\n    })\n}\n\nfn main() {\n    let ids = generate(8, 1000);\n    let unique: HashSet<_> = ids.iter().collect();\n    println!(\"{} ids, {} unique\", ids.len(), unique.len());\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn all_unique() {\n        let ids = generate(8, 1000);\n        let set: HashSet<_> = ids.iter().collect();\n        assert_eq!(set.len(), 8000);\n    }\n}","explain":"fetch_add is a single indivisible step, so no two threads can ever receive the same number, and there is no lock to contend on. Relaxed suffices because the ids do not guard any other data."},"A7.2b":{"lang":"rust","hints":["prize.compare_exchange(0, my_id, Ordering::AcqRel, Ordering::Acquire)","Ok means this thread won; Err(current) tells you the winner.","Count the Ok results across threads; it must be exactly one."],"solution":"use std::sync::atomic::{AtomicU32, Ordering};\nuse std::thread;\n\nfn race(threads: u32) -> (u32, usize) {\n    let prize = AtomicU32::new(0);\n    let wins = thread::scope(|s| {\n        let hs: Vec<_> = (1..=threads)\n            .map(|id| {\n                let prize = &prize;\n                s.spawn(move || prize.compare_exchange(0, id, Ordering::AcqRel, Ordering::Acquire).is_ok())\n            })\n            .collect();\n        hs.into_iter().map(|h| h.join().unwrap()).filter(|&won| won).count()\n    });\n    (prize.load(Ordering::Acquire), wins)\n}\n\nfn main() {\n    let (winner, wins) = race(16);\n    println!(\"thread {winner} won ({wins} winner)\");\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn exactly_one() {\n        let (winner, wins) = race(32);\n        assert_eq!(wins, 1);\n        assert!((1..=32).contains(&winner));\n    }\n}","explain":"compare_exchange only writes if the current value is what you expect, atomically, which is the building block of lock-free algorithms. Exactly-once claims like this appear in job schedulers and leader election."}}},"A7.3":{"example":{"title":"par_iter in one line","lang":"rust","note":"Changing iter to par_iter (or into_par_iter) splits the work across a thread pool sized to your CPU, and the borrow checker still guarantees there are no data races. Exact times depend on your machine. Parallelism pays off for CPU-heavy work on many items; for tiny workloads the coordination overhead can make it slower.","code":"use rayon::prelude::*;\nuse std::time::Instant;\n\nfn is_prime(n: u64) -> bool {\n    n >= 2 && (2..).take_while(|d| d * d <= n).all(|d| n % d != 0)\n}\n\nfn main() {\n    let t = Instant::now();\n    let seq = (1..2_000_000u64).filter(|&n| is_prime(n)).count();\n    let t_seq = t.elapsed();\n    let t = Instant::now();\n    let par = (1..2_000_000u64).into_par_iter().filter(|&n| is_prime(n)).count();\n    let t_par = t.elapsed();\n    println!(\"{seq} primes sequential in {t_seq:?}, {par} parallel in {t_par:?}\");\n    println!(\"threads available: {}\", rayon::current_num_threads());\n\n    let mut v: Vec<u32> = (0..1_000_000).rev().collect();\n    v.par_sort_unstable();\n    println!(\"sorted: {}\", v.windows(2).all(|w| w[0] <= w[1]));\n}","output":"148933 primes sequential in 1.2s, 148933 parallel in 160ms\nthreads available: 8\nsorted: true"},"exercises":{"A7.3a":{"lang":"rust","hints":["docs.par_iter().fold(HashMap::new, |mut m, doc| { ...; m })",".reduce(HashMap::new, |mut a, b| { merge b into a; a })","Compare the result with a sequential version in a test."],"solution":"use rayon::prelude::*;\nuse std::collections::HashMap;\n\nfn word_freq(docs: &[String]) -> HashMap<String, usize> {\n    docs.par_iter()\n        .fold(HashMap::new, |mut m: HashMap<String, usize>, doc| {\n            for w in doc.split_whitespace() {\n                *m.entry(w.to_lowercase()).or_insert(0) += 1;\n            }\n            m\n        })\n        .reduce(HashMap::new, |mut a, b| {\n            for (k, v) in b {\n                *a.entry(k).or_insert(0) += v;\n            }\n            a\n        })\n}\n\nfn main() {\n    let docs: Vec<String> = (0..10_000).map(|i| format!(\"Rust is fast and rust is safe {}\", i % 7)).collect();\n    let f = word_freq(&docs);\n    println!(\"rust: {}, safe: {}\", f[\"rust\"], f[\"safe\"]);\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn matches_sequential() {\n        let docs = vec![\"a b a\".to_string(), \"b c\".to_string()];\n        let f = word_freq(&docs);\n        assert_eq!((f[\"a\"], f[\"b\"], f[\"c\"]), (2, 2, 1));\n    }\n}","explain":"Each thread fills its own map with no locking, and the maps are merged at the end. This map-reduce shape scales far better than sharing one Mutex<HashMap>."},"A7.3b":{"lang":"rust","hints":["Use std::hint::black_box around inputs so nothing is computed at compile time.","Run each measurement a few times; the first run includes thread-pool start-up.","Amdahl's law says the serial part of a job limits the possible speed-up."],"solution":"use rayon::prelude::*;\nuse std::hint::black_box;\nuse std::time::Instant;\n\nfn time(label: &str, n: u64) {\n    let v: Vec<u64> = (0..n).collect();\n    let t = Instant::now();\n    let a: u64 = black_box(&v).iter().sum();\n    let seq = t.elapsed();\n    let t = Instant::now();\n    let b: u64 = black_box(&v).par_iter().sum();\n    let par = t.elapsed();\n    assert_eq!(a, b);\n    println!(\"{label}: sequential {seq:?}, parallel {par:?}\");\n}\n\nfn main() {\n    rayon::current_num_threads(); // start the pool before timing\n    time(\"1 thousand\", 1_000);\n    time(\"100 million\", 100_000_000);\n}","explain":"For 1,000 numbers, splitting work across threads costs more than the addition itself, so parallel is slower. For 100 million it wins, though memory bandwidth limits the gain. Always measure; never assume parallel is faster."}}},"A8.1":{"example":{"title":"A JoinSet of fetches and a blocking hash","lang":"rust","note":"JoinSet owns a group of tasks, hands back results as they finish, and aborts the rest when dropped. spawn_blocking moves blocking or CPU-heavy work to a separate thread pool so it cannot freeze the async workers. async-std and smol offer similar APIs; Tokio is the most widely used runtime, especially for networking.","code":"use std::time::Duration;\nuse tokio::task::JoinSet;\n\nasync fn fetch(id: u32) -> (u32, usize) {\n    tokio::time::sleep(Duration::from_millis(10 * (5 - id as u64))).await;\n    (id, id as usize * 100)\n}\n\nfn expensive_checksum(data: &[u8]) -> u64 {\n    data.iter().fold(0u64, |h, &b| h.wrapping_mul(31).wrapping_add(b as u64))\n}\n\n#[tokio::main]\nasync fn main() {\n    let mut set = JoinSet::new();\n    for id in 1..=4 {\n        set.spawn(fetch(id));\n    }\n    while let Some(res) = set.join_next().await {   // results in completion order\n        let (id, size) = res.unwrap();\n        println!(\"fetched {id}: {size} bytes\");\n    }\n\n    let data = vec![7u8; 1_000_000];\n    let sum = tokio::task::spawn_blocking(move || expensive_checksum(&data)).await.unwrap();\n    println!(\"checksum computed off the async threads: {}\", sum != 0);\n}","output":"fetched 4: 400 bytes\nfetched 3: 300 bytes\nfetched 2: 200 bytes\nfetched 1: 100 bytes\nchecksum computed off the async threads: true"},"exercises":{"A8.1a":{"lang":"rust","hints":["Spawn until set.len() reaches 5, then await join_next before spawning more.","After the loop, drain the remaining tasks.","Track the peak number of running tasks to prove the limit."],"solution":"use std::time::Duration;\nuse tokio::task::JoinSet;\n\nasync fn run_bounded(jobs: u64, limit: usize) -> (Vec<u64>, usize) {\n    let mut set = JoinSet::new();\n    let mut results = Vec::new();\n    let mut peak = 0;\n    for id in 0..jobs {\n        while set.len() >= limit {\n            results.push(set.join_next().await.unwrap().unwrap());\n        }\n        set.spawn(async move {\n            tokio::time::sleep(Duration::from_millis(2)).await;\n            id * id\n        });\n        peak = peak.max(set.len());\n    }\n    while let Some(r) = set.join_next().await {\n        results.push(r.unwrap());\n    }\n    results.sort();\n    (results, peak)\n}\n\n#[tokio::main]\nasync fn main() {\n    let (r, peak) = run_bounded(50, 5).await;\n    println!(\"{} results, peak concurrency {peak}\", r.len());\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[tokio::test]\n    async fn respects_limit() {\n        let (r, peak) = run_bounded(20, 3).await;\n        assert_eq!(r.len(), 20);\n        assert!(peak <= 3);\n        assert_eq!(r[19], 19 * 19);\n    }\n}","explain":"Bounding concurrency protects the services you call and your own memory. #[tokio::test] gives each test its own runtime."},"A8.1b":{"lang":"rust","hints":["#[tokio::main(flavor = \"current_thread\")] makes the effect easy to see.","The ticker uses tokio::time::interval.","With the slow work inline, the ticker stops printing until it finishes."],"solution":"use std::time::{Duration, Instant};\n\nfn slow_work() -> u64 {\n    let start = Instant::now();\n    let mut x = 0u64;\n    while start.elapsed() < Duration::from_millis(100) {\n        x = x.wrapping_add(1);\n    }\n    x\n}\n\n#[tokio::main(flavor = \"current_thread\")]\nasync fn main() {\n    let ticker = tokio::spawn(async {\n        let mut tick = tokio::time::interval(Duration::from_millis(10));\n        for i in 0..15 {\n            tick.tick().await;\n            println!(\"tick {i}\");\n        }\n    });\n    tokio::time::sleep(Duration::from_millis(30)).await;\n    println!(\"-- blocking inline (ticks freeze) --\");\n    slow_work();\n    println!(\"-- spawn_blocking (ticks continue) --\");\n    tokio::task::spawn_blocking(slow_work).await.unwrap();\n    ticker.await.unwrap();\n}","explain":"On the current-thread runtime there is only one worker, so inline slow work stops every other task. Multi-threaded runtimes hide the problem until all workers are blocked, which is why the habit of using spawn_blocking matters."}}},"A8.2":{"example":{"title":"A line-based echo server and client in one program","lang":"rust","note":"Each connection gets its own lightweight task, so a server can hold thousands of connections on a few threads. into_split gives independent read and write halves. Binding to port 0 lets the OS pick a free port, which is handy in tests.","code":"use tokio::io::{AsyncBufReadExt, AsyncWriteExt, BufReader};\nuse tokio::net::{TcpListener, TcpStream};\n\nasync fn handle(stream: TcpStream) -> std::io::Result<()> {\n    let (read, mut write) = stream.into_split();\n    let mut lines = BufReader::new(read).lines();\n    while let Some(line) = lines.next_line().await? {\n        write.write_all(format!(\"echo: {}\\n\", line.to_uppercase()).as_bytes()).await?;\n    }\n    Ok(())\n}\n\n#[tokio::main]\nasync fn main() -> std::io::Result<()> {\n    let listener = TcpListener::bind(\"127.0.0.1:0\").await?;   // port 0: pick a free port\n    let addr = listener.local_addr()?;\n    tokio::spawn(async move {\n        loop {\n            let (stream, _) = listener.accept().await.unwrap();\n            tokio::spawn(handle(stream));                     // one task per connection\n        }\n    });\n\n    let mut client = TcpStream::connect(addr).await?;\n    client.write_all(b\"hello\\nrust\\n\").await?;\n    client.shutdown().await?;                                 // no more data from us\n    let mut reply = String::new();\n    tokio::io::AsyncReadExt::read_to_string(&mut client, &mut reply).await?;\n    print!(\"{reply}\");\n    Ok(())\n}","output":"echo: HELLO\necho: RUST"},"exercises":{"A8.2a":{"lang":"rust","hints":["Parse each line with split_whitespace and a match on a slice pattern.","A std::sync::Mutex is fine here because the lock is never held across an await.","Reply with OK, the value, or NOT_FOUND."],"solution":"use std::collections::HashMap;\nuse std::sync::{Arc, Mutex};\nuse tokio::io::{AsyncBufReadExt, AsyncWriteExt, BufReader};\nuse tokio::net::{TcpListener, TcpStream};\n\ntype Db = Arc<Mutex<HashMap<String, String>>>;\n\nfn execute(db: &Db, line: &str) -> String {\n    let words: Vec<&str> = line.split_whitespace().collect();\n    let mut map = db.lock().unwrap();\n    match words.as_slice() {\n        [\"SET\", k, v] => {\n            map.insert(k.to_string(), v.to_string());\n            \"OK\".into()\n        }\n        [\"GET\", k] => map.get(*k).cloned().unwrap_or_else(|| \"NOT_FOUND\".into()),\n        [\"DEL\", k] => if map.remove(*k).is_some() { \"OK\".into() } else { \"NOT_FOUND\".into() },\n        _ => \"ERR unknown command\".into(),\n    }\n}\n\nasync fn handle(stream: TcpStream, db: Db) -> std::io::Result<()> {\n    let (r, mut w) = stream.into_split();\n    let mut lines = BufReader::new(r).lines();\n    while let Some(line) = lines.next_line().await? {\n        let reply = execute(&db, &line); // lock released before the await below\n        w.write_all(format!(\"{reply}\\n\").as_bytes()).await?;\n    }\n    Ok(())\n}\n\nasync fn start() -> std::io::Result<std::net::SocketAddr> {\n    let listener = TcpListener::bind(\"127.0.0.1:0\").await?;\n    let addr = listener.local_addr()?;\n    let db: Db = Arc::new(Mutex::new(HashMap::new()));\n    tokio::spawn(async move {\n        while let Ok((s, _)) = listener.accept().await {\n            tokio::spawn(handle(s, Arc::clone(&db)));\n        }\n    });\n    Ok(addr)\n}\n\nasync fn send(addr: std::net::SocketAddr, cmds: &str) -> std::io::Result<String> {\n    let mut c = TcpStream::connect(addr).await?;\n    c.write_all(cmds.as_bytes()).await?;\n    c.shutdown().await?;\n    let mut out = String::new();\n    tokio::io::AsyncReadExt::read_to_string(&mut c, &mut out).await?;\n    Ok(out)\n}\n\n#[tokio::main]\nasync fn main() -> std::io::Result<()> {\n    let addr = start().await?;\n    print!(\"{}\", send(addr, \"SET lang rust\\nGET lang\\nDEL lang\\nGET lang\\n\").await?);\n    Ok(())\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[tokio::test]\n    async fn shared_between_connections() {\n        let addr = start().await.unwrap();\n        send(addr, \"SET a 1\\n\").await.unwrap();\n        assert_eq!(send(addr, \"GET a\\n\").await.unwrap(), \"1\\n\");\n    }\n}","explain":"Keeping the command logic in a plain execute function makes it testable without sockets. Using std's Mutex in async code is fine as long as the guard is never held across an .await; otherwise use tokio::sync::Mutex."},"A8.2b":{"lang":"rust","hints":["Wrap lines.next_line() in tokio::time::timeout(Duration::from_secs(5), ...).","Err(_) from timeout means the client was idle too long.","Write the goodbye message, then return."],"solution":"use std::time::Duration;\nuse tokio::io::{AsyncBufReadExt, AsyncWriteExt, BufReader};\nuse tokio::net::{TcpListener, TcpStream};\nuse tokio::time::timeout;\n\nasync fn handle(stream: TcpStream) -> std::io::Result<()> {\n    let (r, mut w) = stream.into_split();\n    let mut lines = BufReader::new(r).lines();\n    loop {\n        match timeout(Duration::from_secs(5), lines.next_line()).await {\n            Ok(Ok(Some(line))) => w.write_all(format!(\"echo: {line}\\n\").as_bytes()).await?,\n            Ok(Ok(None)) => return Ok(()),  // client closed the connection\n            Ok(Err(e)) => return Err(e),\n            Err(_) => {\n                w.write_all(b\"idle for 5s, goodbye\\n\").await?;\n                return Ok(());\n            }\n        }\n    }\n}\n\n#[tokio::main]\nasync fn main() -> std::io::Result<()> {\n    let listener = TcpListener::bind(\"127.0.0.1:7000\").await?;\n    println!(\"try: nc 127.0.0.1 7000\");\n    loop {\n        let (s, _) = listener.accept().await?;\n        tokio::spawn(handle(s));\n    }\n}","explain":"Without timeouts, idle or malicious clients can hold connections open forever and exhaust resources. Matching all four outcomes makes every way the read can end explicit."}}},"A8.3":{"example":{"title":"A semaphore and a shutdown signal","lang":"rust","note":"A Semaphore hands out a fixed number of permits, a simple and robust rate limiter. A watch channel broadcasts the latest value to every receiver, ideal for a shutdown flag; select! lets each task react immediately. In a server, replace the sleep with tokio::signal::ctrl_c().await. The exact call count varies slightly from run to run.","code":"use std::sync::Arc;\nuse std::time::Duration;\nuse tokio::sync::{watch, Semaphore};\n\n#[tokio::main]\nasync fn main() {\n    let permits = Arc::new(Semaphore::new(2));          // at most two calls in flight\n    let (shutdown_tx, shutdown_rx) = watch::channel(false);\n    let mut handles = Vec::new();\n\n    for id in 0..4 {\n        let permits = Arc::clone(&permits);\n        let mut stop = shutdown_rx.clone();\n        handles.push(tokio::spawn(async move {\n            let mut done = 0;\n            loop {\n                tokio::select! {\n                    _ = stop.changed() => break,         // shutdown requested\n                    permit = permits.acquire() => {\n                        let _permit = permit.unwrap();   // released when dropped\n                        tokio::time::sleep(Duration::from_millis(20)).await;\n                        done += 1;\n                    }\n                }\n            }\n            (id, done)\n        }));\n    }\n\n    tokio::time::sleep(Duration::from_millis(110)).await; // in a real app: tokio::signal::ctrl_c().await\n    shutdown_tx.send(true).unwrap();\n    let mut total = 0;\n    for h in handles { total += h.await.unwrap().1; }\n    println!(\"finished cleanly after about {total} calls (at most 2 at a time)\");\n}","output":"finished cleanly after about 10 calls (at most 2 at a time)"},"exercises":{"A8.3a":{"lang":"rust","hints":["Acquire with permits.clone().acquire_owned().await so the permit can move into the task.","Increment an AtomicUsize when a fetch starts, decrement when it ends, and update a max with fetch_max.","Assert the max is at most 3."],"solution":"use std::sync::atomic::{AtomicUsize, Ordering};\nuse std::sync::Arc;\nuse std::time::Duration;\nuse tokio::sync::Semaphore;\nuse tokio::task::JoinSet;\n\nasync fn crawl(urls: usize, limit: usize) -> usize {\n    let permits = Arc::new(Semaphore::new(limit));\n    let current = Arc::new(AtomicUsize::new(0));\n    let max = Arc::new(AtomicUsize::new(0));\n    let mut set = JoinSet::new();\n    for _ in 0..urls {\n        let permit = permits.clone().acquire_owned().await.unwrap();\n        let (current, max) = (Arc::clone(&current), Arc::clone(&max));\n        set.spawn(async move {\n            let now = current.fetch_add(1, Ordering::SeqCst) + 1;\n            max.fetch_max(now, Ordering::SeqCst);\n            tokio::time::sleep(Duration::from_millis(5)).await;\n            current.fetch_sub(1, Ordering::SeqCst);\n            drop(permit);\n        });\n    }\n    while set.join_next().await.is_some() {}\n    max.load(Ordering::SeqCst)\n}\n\n#[tokio::main]\nasync fn main() {\n    println!(\"peak concurrency {}\", crawl(20, 3).await);\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[tokio::test]\n    async fn never_exceeds() {\n        assert!(crawl(30, 3).await <= 3);\n    }\n}","explain":"acquire_owned returns a permit that is not tied to a borrow of the semaphore, so it can be moved into a spawned task and released when the task ends. Measuring peak concurrency is a direct way to test the limiter."},"A8.3b":{"lang":"rust","hints":["let (tx, _) = broadcast::channel(16); let mut rx = tx.subscribe();","Subscribe before sending, or the early messages are missed.","A slow receiver gets RecvError::Lagged(n) when it misses n messages."],"solution":"use tokio::sync::broadcast;\n\n#[tokio::main]\nasync fn main() {\n    let (tx, _) = broadcast::channel::<String>(16);\n    let mut subs = Vec::new();\n    for name in [\"slack\", \"email\", \"dashboard\"] {\n        let mut rx = tx.subscribe();\n        subs.push(tokio::spawn(async move {\n            let mut got = Vec::new();\n            while let Ok(ev) = rx.recv().await {\n                got.push(ev);\n            }\n            println!(\"{name} received {got:?}\");\n        }));\n    }\n    for ev in [\"deploy started\", \"deploy finished\"] {\n        tx.send(ev.to_string()).unwrap();\n    }\n    drop(tx); // closing the channel ends every subscriber's loop\n    for s in subs {\n        s.await.unwrap();\n    }\n}","explain":"Every subscriber gets its own copy of each message. The channel keeps only the last 16; a receiver that falls further behind gets Lagged and skips ahead rather than slowing everyone down."}}},"A9.1":{"example":{"title":"Generating enums with string conversion","lang":"rust","note":"$vis captures pub or nothing, $(#[$meta])* forwards attributes such as derive, and one repetition drives three different expansions. Macro hygiene means variables a macro creates cannot clash with the caller's. In a library, add #[macro_export] and refer to your own items as $crate::path.","code":"macro_rules! string_enum {\n    ($(#[$meta:meta])* $vis:vis enum $name:ident { $($variant:ident => $text:literal),+ $(,)? }) => {\n        $(#[$meta])*\n        $vis enum $name { $($variant),+ }\n\n        impl $name {\n            pub fn as_str(&self) -> &'static str {\n                match self { $(Self::$variant => $text),+ }\n            }\n            pub fn parse(s: &str) -> Option<Self> {\n                match s { $($text => Some(Self::$variant),)+ _ => None }\n            }\n            pub const ALL: &'static [Self] = &[$(Self::$variant),+];\n        }\n    };\n}\n\nstring_enum! {\n    #[derive(Debug, Clone, Copy, PartialEq)]\n    pub enum Severity { Low => \"low\", Medium => \"medium\", High => \"high\", Critical => \"critical\" }\n}\n\nfn main() {\n    println!(\"{:?} {}\", Severity::parse(\"high\"), Severity::Critical.as_str());\n    println!(\"{} levels: {:?}\", Severity::ALL.len(), Severity::ALL);\n}","output":"Some(High) critical\n4 levels: [Low, Medium, High, Critical]"},"exercises":{"A9.1a":{"lang":"rust","hints":["Match $($name:ident: ($a:expr, $b:expr) => $expected:expr),* $(,)?","Each repetition expands to a #[test] fn $name() { assert_eq!(add($a, $b), $expected); }","Invoke the macro inside mod tests."],"solution":"pub fn add(a: i32, b: i32) -> i32 {\n    a + b\n}\n\nmacro_rules! test_cases {\n    ($($name:ident: ($a:expr, $b:expr) => $expected:expr),* $(,)?) => {\n        $(\n            #[test]\n            fn $name() {\n                assert_eq!(add($a, $b), $expected, \"add({}, {})\", $a, $b);\n            }\n        )*\n    };\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    test_cases! {\n        add_small: (1, 2) => 3,\n        add_negative: (-5, 2) => -3,\n        add_zero: (0, 0) => 0,\n    }\n}","explain":"Each case becomes its own named test, so a failure report says exactly which input broke. Crates such as rstest and test-case offer this as attribute macros."},"A9.1b":{"lang":"rust","hints":["An internal rule like (@one $x:tt) => (1usize) turns each item into 1.","count!($($x:tt),*) => (0usize $(+ count!(@one $x))*)","The result is a constant expression, so it can be an array length."],"solution":"macro_rules! count {\n    (@one $x:tt) => (1usize);\n    ($($x:tt),* $(,)?) => (0usize $(+ count!(@one $x))*);\n}\n\nmacro_rules! fixed_list {\n    ($($x:expr),* $(,)?) => {{\n        let arr: [i32; count!($($x),*)] = [$($x),*];\n        arr\n    }};\n}\n\nfn main() {\n    const N: usize = count!(a, b, c, d);\n    let list = fixed_list![10, 20, 30];\n    println!(\"{N} {} {:?}\", list.len(), list);\n}\n\n#[cfg(test)]\nmod tests {\n    #[test]\n    fn counts() {\n        assert_eq!(count!(), 0);\n        assert_eq!(count!(x, y), 2);\n    }\n}","explain":"Internal rules beginning with @ are a convention for helper patterns callers are not meant to use. Because count! expands to a constant expression, it works anywhere a compile-time number is needed."}}},"A9.2":{"example":{"title":"A Describe derive macro (two crates)","lang":"rust","note":"A procedural macro is a function from tokens to tokens that runs inside the compiler, so it lives in its own crate with proc-macro = true. syn parses the tokens into a syntax tree, and quote turns Rust-like templates back into tokens, with #name splicing in values. Errors created with syn::Error point at the user's code.","code":"// --- describe_derive/Cargo.toml ---\n// [lib]\n// proc-macro = true\n// [dependencies]\n// syn = \"2\"\n// quote = \"1\"\n// proc-macro2 = \"1\"\n\n// --- describe_derive/src/lib.rs ---\nuse proc_macro::TokenStream;\nuse quote::quote;\nuse syn::{parse_macro_input, Data, DeriveInput, Fields};\n\n#[proc_macro_derive(Describe)]\npub fn derive_describe(input: TokenStream) -> TokenStream {\n    let ast = parse_macro_input!(input as DeriveInput);\n    let name = &ast.ident;\n    let fields: Vec<String> = match &ast.data {\n        Data::Struct(s) => match &s.fields {\n            Fields::Named(named) => named.named.iter().map(|f| f.ident.as_ref().unwrap().to_string()).collect(),\n            _ => vec![],\n        },\n        _ => {\n            return syn::Error::new_spanned(name, \"Describe only supports structs\")\n                .to_compile_error()\n                .into();\n        }\n    };\n    let list = fields.join(\", \");\n    quote! {\n        impl #name {\n            pub fn describe() -> String {\n                format!(\"{} {{ {} }}\", stringify!(#name), #list)\n            }\n        }\n    }\n    .into()\n}\n\n// --- app/src/main.rs ---  (depends on describe_derive)\n// use describe_derive::Describe;\n// #[derive(Describe)]\n// struct User { id: u32, email: String }\n// fn main() { println!(\"{}\", User::describe()); } // User { id, email }","output":""},"exercises":{"A9.2a":{"lang":"text","hints":["The workspace Cargo.toml lists both members; app depends on describe_derive by path.","cargo expand (cargo install cargo-expand) shows the generated code.","The enum case should show your \"Describe only supports structs\" message underlined at the enum's name."],"solution":"# Cargo.toml (workspace)\n[workspace]\nresolver = \"3\"\nmembers = [\"describe_derive\", \"app\"]\n\n# app/Cargo.toml\n[dependencies]\ndescribe_derive = { path = \"../describe_derive\" }\n\n// app/src/main.rs\nuse describe_derive::Describe;\n\n#[derive(Describe)]\nstruct Ticket { id: u32, title: String, open: bool }\n\nfn main() {\n    println!(\"{}\", Ticket::describe());\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn lists_fields() {\n        assert_eq!(Ticket::describe(), \"Ticket { id, title, open }\");\n    }\n}\n\n// #[derive(Describe)] enum Status { Open }  ->\n// error: Describe only supports structs\n//  --> app/src/main.rs:  enum Status { Open }\n//                             ^^^^^^","explain":"cargo expand is the essential debugging tool for macros, because it shows exactly what your macro produced. Good error spans are the difference between a pleasant macro and a frustrating one."},"A9.2b":{"lang":"text","hints":["Generate the builder name with quote::format_ident!(\"{}Builder\", name).","For each field emit #fname: Option<#fty> in the builder struct and a setter fn #fname(mut self, v: #fty) -> Self.","In build, use ok_or(concat!(\"missing \", stringify!(#fname)))?"],"solution":"#[proc_macro_derive(Builder)]\npub fn derive_builder(input: TokenStream) -> TokenStream {\n    let ast = parse_macro_input!(input as DeriveInput);\n    let name = &ast.ident;\n    let builder = quote::format_ident!(\"{}Builder\", name);\n    let Data::Struct(data) = &ast.data else {\n        return syn::Error::new_spanned(name, \"Builder only supports structs\").to_compile_error().into();\n    };\n    let Fields::Named(fields) = &data.fields else {\n        return syn::Error::new_spanned(name, \"Builder needs named fields\").to_compile_error().into();\n    };\n    let names: Vec<_> = fields.named.iter().map(|f| f.ident.clone().unwrap()).collect();\n    let types: Vec<_> = fields.named.iter().map(|f| f.ty.clone()).collect();\n    quote! {\n        #[derive(Default)]\n        pub struct #builder { #( #names: Option<#types>, )* }\n        impl #builder {\n            #( pub fn #names(mut self, v: #types) -> Self { self.#names = Some(v); self } )*\n            pub fn build(self) -> Result<#name, String> {\n                Ok(#name { #( #names: self.#names.ok_or(concat!(\"missing \", stringify!(#names)))?, )* })\n            }\n        }\n        impl #name {\n            pub fn builder() -> #builder { #builder::default() }\n        }\n    }\n    .into()\n}\n\n// usage:\n// #[derive(Builder)] struct Server { host: String, port: u16 }\n// let s = Server::builder().host(\"localhost\".into()).port(8080).build()?;","explain":"This is the famous exercise from David Tolnay's proc-macro workshop. #( ... )* in quote repeats once per element of the iterators used inside it, the code-generation mirror of macro_rules repetition."}}},"A9.3":{"example":{"title":"A tiny routing DSL","lang":"rust","note":"The macro only rearranges syntax; the handlers are ordinary closures, so the compiler still checks their types. A good DSL makes the common case read like a configuration file, while staying plain Rust underneath.","code":"type Handler = fn(&str) -> String;\n\nmacro_rules! routes {\n    ($($method:ident $path:literal => $handler:expr),* $(,)?) => {{\n        let mut table: Vec<(&'static str, &'static str, Handler)> = Vec::new();\n        $( table.push((stringify!($method), $path, $handler)); )*\n        table\n    }};\n}\n\nfn dispatch(table: &[(&str, &str, Handler)], method: &str, path: &str, body: &str) -> String {\n    table.iter()\n        .find(|(m, p, _)| *m == method && *p == path)\n        .map(|(_, _, h)| h(body))\n        .unwrap_or_else(|| String::from(\"404 not found\"))\n}\n\nfn main() {\n    let table = routes! {\n        GET \"/health\" => |_| String::from(\"ok\"),\n        POST \"/echo\" => |b| format!(\"you said {b}\"),\n    };\n    println!(\"{}\", dispatch(&table, \"GET\", \"/health\", \"\"));\n    println!(\"{}\", dispatch(&table, \"POST\", \"/echo\", \"hi\"));\n    println!(\"{}\", dispatch(&table, \"GET\", \"/nope\", \"\"));\n}","output":"ok\nyou said hi\n404 not found"},"exercises":{"A9.3a":{"lang":"rust","hints":["One rule matches a literal and returns it as a String.","Another matches $tag:ident { $($inner:tt)* } and wraps the inner HTML in the tag.","Inner content is a sequence of items; handle it with a rule that munches one item at a time: (@items $($rest:tt)*)."],"solution":"macro_rules! html {\n    ($text:literal) => { String::from($text) };\n    ($tag:ident { $($inner:tt)* }) => {\n        format!(\"<{0}>{1}<\/{0}>\", stringify!($tag), html!(@items $($inner)*))\n    };\n    (@items) => { String::new() };\n    (@items $text:literal $($rest:tt)*) => {\n        String::from($text) + &html!(@items $($rest)*)\n    };\n    (@items $tag:ident { $($inner:tt)* } $($rest:tt)*) => {\n        html!($tag { $($inner)* }) + &html!(@items $($rest)*)\n    };\n}\n\nfn main() {\n    println!(\"{}\", html!(div { p { \"Hello\" } p { \"World\" } }));\n}\n\n#[cfg(test)]\nmod tests {\n    #[test]\n    fn nests() {\n        assert_eq!(html!(ul { li { \"a\" } li { \"b\" } }), \"<ul><li>a<\/li><li>b<\/li><\/ul>\");\n        assert_eq!(html!(\"plain\"), \"plain\");\n    }\n}","explain":"The @items rules process the contents one token tree at a time, the tt-munching technique behind most complex macro DSLs. Real crates such as maud and leptos's view! use procedural macros for better errors."},"A9.3b":{"lang":"text","hints":["Macros shine when you need to generate items (types, functions, impls).","Builders shine for optional configuration that IDEs can autocomplete.","Prefer the simplest tool that removes the repetition."],"solution":"1. Macro (or thiserror's derive): it generates many items with a\n   fixed shape, which functions cannot do.\n2. Builder: optional settings read clearly as chained methods and\n   get autocompletion and type checking.\n3. Macro: each pair becomes its own named #[test] function.\n4. Function: format! inside a plain function is simple, debuggable\n   and needs no metaprogramming.","explain":"Macros are powerful but cost readability, compile errors and tooling support. Use them to generate items or remove heavy repetition, and reach for functions and builders first otherwise."}}},"A10.1":{"example":{"title":"Injecting a clock and a mailer","lang":"rust","note":"The real program passes a system clock and an SMTP mailer; tests pass a fixed clock and a spy that records calls. Implementing the trait for &SpyMailer lets the test keep ownership of the spy and inspect it afterwards. Crates like mockall generate such mocks, but hand-written fakes are often clearer.","code":"use std::cell::RefCell;\n\npub trait Clock { fn hour(&self) -> u32; }\npub trait Mailer { fn send(&self, to: &str, body: &str); }\n\npub struct Reminder<C: Clock, M: Mailer> { clock: C, mailer: M }\n\nimpl<C: Clock, M: Mailer> Reminder<C, M> {\n    pub fn new(clock: C, mailer: M) -> Self { Reminder { clock, mailer } }\n    /// Sends the daily reminder, but never outside 8:00 to 20:00.\n    pub fn run(&self, user: &str) -> bool {\n        let h = self.clock.hour();\n        if !(8..20).contains(&h) { return false; }\n        self.mailer.send(user, \"Time to study Rust!\");\n        true\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    struct FixedClock(u32);\n    impl Clock for FixedClock { fn hour(&self) -> u32 { self.0 } }\n\n    #[derive(Default)]\n    struct SpyMailer { sent: RefCell<Vec<(String, String)>> }\n    impl Mailer for &SpyMailer {\n        fn send(&self, to: &str, body: &str) { self.sent.borrow_mut().push((to.into(), body.into())); }\n    }\n\n    #[test]\n    fn sends_during_the_day() {\n        let spy = SpyMailer::default();\n        assert!(Reminder::new(FixedClock(9), &spy).run(\"kev\"));\n        assert_eq!(spy.sent.borrow()[0].0, \"kev\");\n    }\n\n    #[test]\n    fn silent_at_night() {\n        let spy = SpyMailer::default();\n        assert!(!Reminder::new(FixedClock(23), &spy).run(\"kev\"));\n        assert!(spy.sent.borrow().is_empty());\n    }\n}","output":""},"exercises":{"A10.1a":{"lang":"rust","hints":["The fake holds a Cell<u32> counting calls and a failures_before_success number.","Return Err while calls <= failures, then Ok.","Write tests for success after retries and for giving up."],"solution":"use std::cell::Cell;\n\npub trait Transport {\n    fn get(&self, url: &str) -> Result<String, String>;\n}\n\npub fn fetch_with_retry(t: &impl Transport, url: &str, attempts: u32) -> Result<String, String> {\n    let mut last = Err(String::from(\"no attempts made\"));\n    for _ in 0..attempts {\n        last = t.get(url);\n        if last.is_ok() {\n            break;\n        }\n    }\n    last\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    struct Flaky { calls: Cell<u32>, failures: u32 }\n    impl Transport for Flaky {\n        fn get(&self, _url: &str) -> Result<String, String> {\n            self.calls.set(self.calls.get() + 1);\n            if self.calls.get() <= self.failures { Err(\"503\".into()) } else { Ok(\"body\".into()) }\n        }\n    }\n\n    #[test]\n    fn succeeds_after_two_failures() {\n        let t = Flaky { calls: Cell::new(0), failures: 2 };\n        assert_eq!(fetch_with_retry(&t, \"u\", 5), Ok(\"body\".into()));\n        assert_eq!(t.calls.get(), 3);\n    }\n\n    #[test]\n    fn gives_up() {\n        let t = Flaky { calls: Cell::new(0), failures: 10 };\n        assert!(fetch_with_retry(&t, \"u\", 3).is_err());\n        assert_eq!(t.calls.get(), 3);\n    }\n}","explain":"Cell is enough for a counter behind &self in single-threaded tests. Asserting the number of calls verifies the retry policy itself, not just the final result, which is the kind of check that catches subtle regressions."},"A10.1b":{"lang":"rust","hints":["use rand::seq::SliceRandom; names.choose_multiple(rng, n)","In tests, StdRng::seed_from_u64(42) gives the same sequence every run.","Check properties too, such as no duplicates and the right count."],"solution":"use rand::seq::SliceRandom;\nuse rand::Rng;\n\npub fn pick_winners(names: &[&str], n: usize, rng: &mut impl Rng) -> Vec<String> {\n    names.choose_multiple(rng, n).map(|s| s.to_string()).collect()\n}\n\nfn main() {\n    let mut rng = rand::thread_rng();\n    println!(\"{:?}\", pick_winners(&[\"a\", \"b\", \"c\", \"d\"], 2, &mut rng));\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use rand::{rngs::StdRng, SeedableRng};\n    use std::collections::HashSet;\n\n    #[test]\n    fn repeatable_with_seed() {\n        let names = [\"ana\", \"bo\", \"cy\", \"dee\", \"eli\"];\n        let a = pick_winners(&names, 3, &mut StdRng::seed_from_u64(42));\n        let b = pick_winners(&names, 3, &mut StdRng::seed_from_u64(42));\n        assert_eq!(a, b);\n        assert_eq!(a.iter().collect::<HashSet<_>>().len(), 3);\n    }\n}","explain":"Passing the random number generator in, instead of calling thread_rng inside, is dependency injection again. Seeded tests stay reproducible, so a failure in CI can be replayed locally."}}},"A10.2":{"example":{"title":"Properties of a run-length encoder","lang":"rust","note":"Instead of picking examples, you state a rule (\"decoding an encoding gives back the input\") and proptest tries hundreds of random inputs, including strange Unicode. When a test fails it shrinks the input to the smallest failing case and saves it in proptest-regressions/ so it is retried every run.","code":"pub fn encode(s: &str) -> Vec<(char, usize)> {\n    let mut out: Vec<(char, usize)> = Vec::new();\n    for c in s.chars() {\n        match out.last_mut() {\n            Some((last, n)) if *last == c => *n += 1,\n            _ => out.push((c, 1)),\n        }\n    }\n    out\n}\n\npub fn decode(runs: &[(char, usize)]) -> String {\n    runs.iter().map(|&(c, n)| c.to_string().repeat(n)).collect()\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use proptest::prelude::*;\n\n    proptest! {\n        #[test]\n        fn round_trip(s in \".*\") {\n            prop_assert_eq!(decode(&encode(&s)), s);\n        }\n\n        #[test]\n        fn neighbours_differ(s in \"[ab]{0,40}\") {\n            let runs = encode(&s);\n            for w in runs.windows(2) {\n                prop_assert_ne!(w[0].0, w[1].0);\n            }\n        }\n    }\n}","output":""},"exercises":{"A10.2a":{"lang":"rust","hints":["Generate inputs with prop::collection::vec(any::<i32>(), 0..100).","Ordered means every window of two satisfies w[0] <= w[1].","For the oracle, clone the input, call sort(), and compare."],"solution":"pub fn my_sort(v: &mut Vec<i32>) {\n    for i in 1..v.len() {\n        let mut j = i;\n        while j > 0 && v[j - 1] > v[j] {\n            v.swap(j - 1, j);\n            j -= 1;\n        }\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use proptest::prelude::*;\n\n    proptest! {\n        #[test]\n        fn sorted_and_same_as_std(input in prop::collection::vec(any::<i32>(), 0..100)) {\n            let mut mine = input.clone();\n            my_sort(&mut mine);\n            prop_assert_eq!(mine.len(), input.len());\n            prop_assert!(mine.windows(2).all(|w| w[0] <= w[1]));\n            let mut expected = input;\n            expected.sort();\n            prop_assert_eq!(mine, expected);\n        }\n    }\n}","explain":"Comparing against a trusted implementation (the oracle) is one of the strongest properties you can write. Property tests complement example tests rather than replace them."},"A10.2b":{"lang":"rust","hints":["Generate vectors of strings with prop::collection::vec(\".*\", 1..5).","Fields containing commas or leading spaces break the round trip.","The fix in the test is to restrict inputs, or better, to quote fields properly in join."],"solution":"pub fn parse_csv_line(s: &str) -> Vec<String> {\n    s.split(',').map(|x| x.trim().to_string()).collect()\n}\n\npub fn join(fields: &[String]) -> String {\n    fields.join(\",\")\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use proptest::prelude::*;\n\n    // The unrestricted property fails quickly, for example with\n    // fields = [\",\"] (a comma inside a field) or [\" a\"] (trim removes\n    // the space). This version documents the inputs the simple\n    // format really supports:\n    proptest! {\n        #[test]\n        fn round_trip_simple_fields(fields in prop::collection::vec(\"[a-z0-9]{0,8}\", 1..5)) {\n            prop_assert_eq!(parse_csv_line(&join(&fields)), fields);\n        }\n    }\n\n    #[test]\n    fn known_counterexample() {\n        let fields = vec![\"a,b\".to_string()];\n        assert_ne!(parse_csv_line(&join(&fields)), fields);\n    }\n}","explain":"Proptest shrinks the failure to something tiny like a single comma, which immediately explains the bug. In production you would use the csv crate, which quotes fields correctly."}}},"A10.3":{"example":{"title":"Instrumented code with tracing","lang":"rust","note":"tracing records structured fields, not just text, and #[instrument] adds a span so every log line inside a function carries its arguments. For interactive debugging, rust-gdb and rust-lldb (or VS Code with CodeLLDB) understand Rust types. For performance, cargo bench with criterion gives statistically sound timings, and cargo flamegraph shows where time goes.","code":"use tracing::{debug, info, instrument, warn};\n\n#[instrument]                          // logs entry with the arguments\nfn charge(customer: &str, cents: u64) -> Result<u64, String> {\n    debug!(\"validating amount\");\n    if cents == 0 {\n        warn!(customer, \"zero charge rejected\");\n        return Err(\"amount must be positive\".into());\n    }\n    info!(cents, \"charged\");\n    Ok(cents)\n}\n\nfn main() {\n    tracing_subscriber::fmt().with_max_level(tracing::Level::DEBUG).with_target(false).without_time().init();\n    let _ = charge(\"kev\", 1999);\n    let _ = charge(\"sam\", 0);\n}","output":"DEBUG charge{customer=\"kev\" cents=1999}: validating amount\n INFO charge{customer=\"kev\" cents=1999}: charged cents=1999\nDEBUG charge{customer=\"sam\" cents=0}: validating amount\n WARN charge{customer=\"sam\" cents=0}: zero charge rejected customer=\"sam\""},"exercises":{"A10.3a":{"lang":"text","hints":["Add criterion = \"0.5\" under [dev-dependencies] and a [[bench]] section with harness = false.","Put the benchmark in benches/vowels.rs using criterion_group! and criterion_main!.","Wrap inputs in std::hint::black_box."],"solution":"# Cargo.toml\n[dev-dependencies]\ncriterion = \"0.5\"\n\n[[bench]]\nname = \"vowels\"\nharness = false\n\n// benches/vowels.rs\nuse criterion::{criterion_group, criterion_main, Criterion};\nuse std::hint::black_box;\n\nfn by_match(s: &str) -> usize {\n    s.bytes().filter(|b| matches!(b, b'a' | b'e' | b'i' | b'o' | b'u')).count()\n}\n\nfn by_contains(s: &str) -> usize {\n    s.chars().filter(|c| \"aeiou\".contains(*c)).count()\n}\n\nfn bench(c: &mut Criterion) {\n    let text = \"the quick brown fox jumps over the lazy dog \".repeat(230);\n    c.bench_function(\"match bytes\", |b| b.iter(|| by_match(black_box(&text))));\n    c.bench_function(\"contains chars\", |b| b.iter(|| by_contains(black_box(&text))));\n}\n\ncriterion_group!(benches, bench);\ncriterion_main!(benches);\n\n// $ cargo bench\n// match bytes      time: [~3 µs ...]\n// contains chars   time: [~15 µs ...]","explain":"Criterion runs each function many times, warms up, detects outliers and reports confidence intervals, much like a proper load-test report rather than a single stopwatch reading. Byte matching wins here because it skips UTF-8 decoding."},"A10.3b":{"lang":"rust","hints":["dbg!(&s) after sorting shows [3, 5, 5].","The second-to-last element is still the largest value when it is duplicated.","Also note s.len() - 2 underflows for slices shorter than two: use checked_sub or dedup."],"solution":"fn second_largest(v: &[i32]) -> Option<i32> {\n    let mut s = v.to_vec();\n    s.sort_unstable();\n    s.dedup(); // [5, 5, 3] -> [3, 5]\n    let i = s.len().checked_sub(2)?;\n    s.get(i).copied()\n}\n\nfn main() {\n    println!(\"{:?}\", second_largest(&[5, 5, 3]));\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn cases() {\n        assert_eq!(second_largest(&[5, 5, 3]), Some(3));\n        assert_eq!(second_largest(&[1, 9, 4]), Some(4));\n        assert_eq!(second_largest(&[7]), None);\n        assert_eq!(second_largest(&[]), None);\n    }\n}","explain":"The original had two bugs, duplicates and an overflow that panics in debug builds for short inputs. A good bug report always adds the regression tests that would have caught both."}}},"A11.1":{"example":{"title":"JSON and TOML from the same types","lang":"rust","note":"One derive works with every format serde supports (JSON, TOML, YAML, CBOR, MessagePack and more). Option fields may be missing, #[serde(default)] fills missing values, and tagged enums map cleanly onto API shapes. Invalid input becomes a descriptive error, never a panic.","code":"use serde::{Deserialize, Serialize};\n\n#[derive(Debug, Serialize, Deserialize)]\n#[serde(rename_all = \"camelCase\")]\nstruct TestRun {\n    suite_name: String,\n    #[serde(default)]\n    retries: u32,\n    tags: Option<Vec<String>>,\n    result: Outcome,\n}\n\n#[derive(Debug, Serialize, Deserialize)]\n#[serde(tag = \"status\", rename_all = \"lowercase\")]\nenum Outcome {\n    Passed { duration_ms: u64 },\n    Failed { reason: String },\n}\n\nfn main() -> Result<(), Box<dyn std::error::Error>> {\n    let json = r#\"{\"suiteName\":\"login\",\"result\":{\"status\":\"failed\",\"reason\":\"timeout\"}}\"#;\n    let run: TestRun = serde_json::from_str(json)?;\n    println!(\"{run:?}\");\n\n    let ok = TestRun { suite_name: \"pay\".into(), retries: 1, tags: Some(vec![\"smoke\".into()]), result: Outcome::Passed { duration_ms: 420 } };\n    println!(\"{}\", serde_json::to_string(&ok)?);\n    print!(\"{}\", toml::to_string(&ok)?);\n    Ok(())\n}","output":"TestRun { suite_name: \"login\", retries: 0, tags: None, result: Failed { reason: \"timeout\" } }\n{\"suiteName\":\"pay\",\"retries\":1,\"tags\":[\"smoke\"],\"result\":{\"status\":\"passed\",\"duration_ms\":420}}\nsuiteName = \"pay\"\nretries = 1\ntags = [\"smoke\"]\n\n[result]\nstatus = \"passed\"\nduration_ms = 420"},"exercises":{"A11.1a":{"lang":"rust","hints":["Nested tables in TOML map to nested structs.","#[serde(default = \"default_level\")] calls a function for the default.","toml::from_str returns a Result with a helpful message on errors."],"solution":"use serde::Deserialize;\n\n#[derive(Debug, Deserialize, PartialEq)]\nstruct Server { host: String, port: u16 }\n\nfn default_level() -> String { \"info\".into() }\n\n#[derive(Debug, Deserialize, PartialEq)]\nstruct Config {\n    server: Server,\n    #[serde(default)]\n    upstreams: Vec<String>,\n    #[serde(default = \"default_level\")]\n    log_level: String,\n}\n\nfn load(text: &str) -> Result<Config, toml::de::Error> {\n    toml::from_str(text)\n}\n\nfn main() {\n    let c = load(\"upstreams = [\\\"http://a\\\"]\\n[server]\\nhost = \\\"0.0.0.0\\\"\\nport = 8080\\n\").unwrap();\n    println!(\"{c:?}\");\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn minimal_uses_defaults() {\n        let c = load(\"[server]\\nhost = \\\"h\\\"\\nport = 1\\n\").unwrap();\n        assert_eq!(c.log_level, \"info\");\n        assert!(c.upstreams.is_empty());\n    }\n    #[test]\n    fn bad_port_is_error() {\n        assert!(load(\"[server]\\nhost = \\\"h\\\"\\nport = 99999\\n\").is_err());\n    }\n}","explain":"The port check comes for free because u16 cannot hold 99999, and serde reports exactly which key failed. Typed configuration catches mistakes at start-up instead of deep inside the program."},"A11.1b":{"lang":"rust","hints":["Fields not listed in the struct are ignored by default.","Use Option<String> for assignee.","Filter with issue.assignee.is_none() && issue.labels.iter().any(|l| l == \"bug\")."],"solution":"use serde::Deserialize;\n\n#[derive(Debug, Deserialize)]\nstruct Issue {\n    id: u64,\n    title: String,\n    #[serde(default)]\n    labels: Vec<String>,\n    assignee: Option<String>,\n}\n\nfn unassigned_bugs(json: &str) -> serde_json::Result<Vec<String>> {\n    let issues: Vec<Issue> = serde_json::from_str(json)?;\n    Ok(issues\n        .into_iter()\n        .filter(|i| i.assignee.is_none() && i.labels.iter().any(|l| l == \"bug\"))\n        .map(|i| format!(\"#{} {}\", i.id, i.title))\n        .collect())\n}\n\nfn main() {\n    let json = r#\"[\n      {\"id\": 1, \"title\": \"Crash on login\", \"labels\": [\"bug\"], \"assignee\": null, \"url\": \"x\"},\n      {\"id\": 2, \"title\": \"Dark mode\", \"labels\": [\"feature\"]},\n      {\"id\": 3, \"title\": \"Typo\", \"labels\": [\"bug\", \"docs\"], \"assignee\": \"kev\"}\n    ]\"#;\n    println!(\"{:?}\", unassigned_bugs(json).unwrap());\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn filters() {\n        let j = r#\"[{\"id\":5,\"title\":\"x\",\"labels\":[\"bug\"]}]\"#;\n        assert_eq!(unassigned_bugs(j).unwrap(), vec![\"#5 x\"]);\n    }\n}","explain":"Ignoring unknown fields means your code keeps working when the API adds new ones. Add #[serde(deny_unknown_fields)] instead when you want strictness, for example for configuration files."}}},"A11.2":{"example":{"title":"A todo CLI skeleton","lang":"rust","note":"Doc comments become help text, types become validation (Done needs a number, priority must be low, normal or high), and errors and --help come for free. env = \"TODO_FILE\" lets the environment supply a default.","code":"use clap::{Parser, Subcommand, ValueEnum};\n\n/// A tiny todo manager\n#[derive(Parser, Debug)]\n#[command(version, about)]\nstruct Cli {\n    /// Path to the todo file\n    #[arg(short, long, env = \"TODO_FILE\", default_value = \"todo.json\")]\n    file: String,\n    /// Print more details\n    #[arg(short, long)]\n    verbose: bool,\n    #[command(subcommand)]\n    command: Command,\n}\n\n#[derive(Subcommand, Debug)]\nenum Command {\n    /// Add a task\n    Add { text: String, #[arg(short, long, value_enum, default_value_t = Priority::Normal)] priority: Priority },\n    /// List tasks\n    List { #[arg(long)] all: bool },\n    /// Mark a task as done\n    Done { id: u32 },\n}\n\n#[derive(ValueEnum, Clone, Debug)]\nenum Priority { Low, Normal, High }\n\nfn main() {\n    let cli = Cli::parse();\n    match &cli.command {\n        Command::Add { text, priority } => println!(\"add {text:?} ({priority:?}) to {}\", cli.file),\n        Command::List { all } => println!(\"list (all: {all})\"),\n        Command::Done { id } => println!(\"done #{id}\"),\n    }\n}","output":"$ todo add \"write tests\" -p high\nadd \"write tests\" (High) to todo.json\n$ todo --help\nA tiny todo manager\n\nUsage: todo [OPTIONS] <COMMAND>\n\nCommands:\n  add   Add a task\n  list  List tasks\n  done  Mark a task as done\n..."},"exercises":{"A11.2a":{"lang":"rust","hints":["#[arg(required = true)] paths: Vec<PathBuf> collects one or more paths.","A ValueEnum enum gives the allowed formats.","try_parse_from([\"fstat\", \"a.txt\", \"--top\", \"3\"]) lets tests parse without a real command line."],"solution":"use clap::{Parser, ValueEnum};\nuse std::path::PathBuf;\n\n#[derive(ValueEnum, Clone, Debug, PartialEq)]\nenum Format { Text, Json }\n\n/// Show statistics about text files\n#[derive(Parser, Debug)]\n#[command(name = \"fstat\", version)]\nstruct Cli {\n    /// Files to inspect\n    #[arg(required = true)]\n    paths: Vec<PathBuf>,\n    /// Output format\n    #[arg(long, value_enum, default_value_t = Format::Text)]\n    format: Format,\n    /// Show the N longest lines\n    #[arg(long, default_value_t = 0)]\n    top: usize,\n}\n\nfn main() {\n    let cli = Cli::parse();\n    for p in &cli.paths {\n        let text = std::fs::read_to_string(p).unwrap_or_default();\n        let mut lines: Vec<&str> = text.lines().collect();\n        lines.sort_by_key(|l| std::cmp::Reverse(l.len()));\n        match cli.format {\n            Format::Text => println!(\"{}: {} lines\", p.display(), text.lines().count()),\n            Format::Json => println!(\"{{\\\"path\\\":{:?},\\\"lines\\\":{}}}\", p.display().to_string(), text.lines().count()),\n        }\n        for l in lines.iter().take(cli.top) {\n            println!(\"  {l}\");\n        }\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn parses() {\n        let c = Cli::try_parse_from([\"fstat\", \"a.txt\", \"b.txt\", \"--format\", \"json\", \"--top\", \"3\"]).unwrap();\n        assert_eq!(c.paths.len(), 2);\n        assert_eq!(c.format, Format::Json);\n        assert_eq!(c.top, 3);\n    }\n    #[test]\n    fn needs_a_path() {\n        assert!(Cli::try_parse_from([\"fstat\"]).is_err());\n    }\n    #[test]\n    fn rejects_bad_format() {\n        assert!(Cli::try_parse_from([\"fstat\", \"a\", \"--format\", \"xml\"]).is_err());\n    }\n}","explain":"try_parse_from makes the command-line interface itself testable, a step many tools skip. In real JSON output use serde_json rather than hand-building strings."},"A11.2b":{"lang":"rust","hints":["std::process::ExitCode lets main return a code cleanly.","Use eprintln! for invalid entries and errors.","Keep the validation in a separate function you can test."],"solution":"use std::process::ExitCode;\n\nfn invalid_lines(text: &str) -> Vec<&str> {\n    text.lines()\n        .map(str::trim)\n        .filter(|l| !l.is_empty())\n        .filter(|l| !(l.contains('@') && l.split('@').nth(1).is_some_and(|d| d.contains('.'))))\n        .collect()\n}\n\nfn main() -> ExitCode {\n    let Some(path) = std::env::args().nth(1) else {\n        eprintln!(\"usage: checkmail FILE\");\n        return ExitCode::from(2);\n    };\n    let text = match std::fs::read_to_string(&path) {\n        Ok(t) => t,\n        Err(e) => {\n            eprintln!(\"cannot read {path}: {e}\");\n            return ExitCode::from(2);\n        }\n    };\n    let bad = invalid_lines(&text);\n    for b in &bad {\n        eprintln!(\"invalid: {b}\");\n    }\n    if bad.is_empty() { ExitCode::SUCCESS } else { ExitCode::from(1) }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn finds_invalid() {\n        assert_eq!(invalid_lines(\"a@b.com\\nnope\\nx@y\\n\\n\"), vec![\"nope\", \"x@y\"]);\n    }\n}","explain":"Scripts and CI pipelines decide what to do next from the exit code, so \"some data was invalid\" (1) and \"the tool could not run\" (2) should be distinguishable, the same convention grep and many Unix tools use."}}},"A11.3":{"example":{"title":"Calling a JSON API","lang":"rust","note":"Reuse one Client for many requests, since it pools connections. error_for_status is easy to forget; without it a 404 response is treated as success. reqwest is built on hyper, the low-level HTTP library that also powers axum. reqwest::blocking exists for simple scripts without async.","code":"use serde::Deserialize;\nuse std::time::Duration;\n\n#[derive(Debug, Deserialize)]\nstruct Release {\n    tag_name: String,\n    published_at: String,\n}\n\n#[tokio::main]\nasync fn main() -> Result<(), reqwest::Error> {\n    let client = reqwest::Client::builder()\n        .user_agent(\"rust-course-example\")\n        .timeout(Duration::from_secs(10))\n        .build()?;\n    let latest: Release = client\n        .get(\"https://api.github.com/repos/rust-lang/rust/releases/latest\")\
