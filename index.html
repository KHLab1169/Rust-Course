olution":"[profile.release]\nlto = true          # link-time optimisation across crates\ncodegen-units = 1   # slower to compile, better optimised\npanic = \"abort\"     # no unwinding code\nstrip = true        # remove symbols from the binary","explain":"These settings usually shrink the program and can speed it up, at the cost of longer compile times. They matter most for tools you hand out to other people."}}},"14.2":{"example":{"title":"Metadata for crates.io","lang":"toml","note":"Publishing is permanent; a version can be yanked but never deleted or overwritten. Always run cargo publish --dry-run first. Use semantic versioning so users know whether an upgrade can break them.","code":"[package]\nname = \"textstats-kev\"            # names on crates.io are first come, first served\nversion = \"0.1.0\"\nedition = \"2024\"\ndescription = \"Word and character counts for text.\"\nlicense = \"MIT OR Apache-2.0\"\nrepository = \"https://github.com/KHLab1169/textstats\"\nreadme = \"README.md\"\nkeywords = [\"text\", \"statistics\"]\n\n# $ cargo login          (paste the API token from crates.io)\n# $ cargo publish --dry-run\n# $ cargo publish\n# $ cargo yank --vers 0.1.0   (stop new projects from depending on it)","output":""},"exercises":{"14.2a":{"lang":"rust","hints":["Write pub use kinds::PrimaryColor; and pub use utils::mix; at the top level.","mix can take two PrimaryColor values and return a &'static str such as \"green\".","Call mix from main through the re-exported names."],"solution":"pub use kinds::PrimaryColor;\npub use utils::mix;\n\npub mod kinds {\n    #[derive(Debug, Clone, Copy, PartialEq)]\n    pub enum PrimaryColor {\n        Red,\n        Yellow,\n        Blue,\n    }\n}\n\npub mod utils {\n    use crate::kinds::PrimaryColor;\n\n    pub fn mix(a: PrimaryColor, b: PrimaryColor) -> &'static str {\n        use PrimaryColor::*;\n        match (a, b) {\n            (Red, Yellow) | (Yellow, Red) => \"orange\",\n            (Yellow, Blue) | (Blue, Yellow) => \"green\",\n            (Red, Blue) | (Blue, Red) => \"purple\",\n            _ => \"the same colour\",\n        }\n    }\n}\n\nfn main() {\n    println!(\"{}\", mix(PrimaryColor::Blue, PrimaryColor::Yellow));\n}","explain":"The internal modules stay organised for you, while users see a flat, simple API, and cargo doc shows the re-exports on the front page."},"14.2b":{"lang":"bash","hints":["Missing description and license are the usual warnings.","The dry run packages the crate into target/package so you can inspect it.","cargo package --list shows exactly which files would be uploaded."],"solution":"$ cargo package --list\nCargo.toml\nCargo.toml.orig\nREADME.md\nsrc/lib.rs\ntests/api.rs\n$ cargo publish --dry-run\n   Packaging textstats-kev v0.1.0\n   Verifying textstats-kev v0.1.0\n   Uploading textstats-kev v0.1.0\nwarning: aborting upload due to dry run","explain":"The verify step builds the packaged crate from scratch, which catches files you forgot to commit. Use exclude in Cargo.toml to keep test data or large assets out of the package."}}},"14.3":{"example":{"title":"A workspace with an app and a library","lang":"text","note":"All members share one lock file, so they always agree on dependency versions, and one target folder, so shared dependencies compile once. Any program on your PATH named cargo-xyz can be run as cargo xyz, which is how tools like cargo-watch and cargo-edit work.","code":"add/\n├── Cargo.toml          [workspace]\n│                       resolver = \"3\"\n│                       members = [\"adder\", \"add_one\"]\n├── adder/              (binary)  Cargo.toml: [dependencies] add_one = { path = \"../add_one\" }\n│   └── src/main.rs     fn main() { println!(\"{}\", add_one::add_one(10)); }\n└── add_one/            (library)\n    └── src/lib.rs      pub fn add_one(x: i32) -> i32 { x + 1 }\n\n$ cargo run -p adder          # build and run one member\n$ cargo test -p add_one       # test one member\n$ cargo install ripgrep       # install a binary from crates.io into ~/.cargo/bin","output":""},"exercises":{"14.3a":{"lang":"text","hints":["Create the top Cargo.toml by hand with [workspace] and members.","Run cargo new wc-cli and cargo new textstats --lib inside the folder.","wc-cli's Cargo.toml needs textstats = { path = \"../textstats\" }."],"solution":"# Cargo.toml (workspace root)\n[workspace]\nresolver = \"3\"\nmembers = [\"textstats\", \"wc-cli\"]\n\n# wc-cli/Cargo.toml\n[dependencies]\ntextstats = { path = \"../textstats\" }\n\n// wc-cli/src/main.rs\nfn main() {\n    let path = std::env::args().nth(1).expect(\"usage: wc-cli FILE\");\n    let text = std::fs::read_to_string(&path).expect(\"cannot read file\");\n    println!(\"{} words, {} chars\", textstats::word_count(&text), textstats::char_count(&text));\n}\n\n# $ cargo run -p wc-cli -- poem.txt","explain":"Workspaces are how larger Rust projects such as web services split into an API crate, a core library and tooling, while still building with one command."},"14.3b":{"lang":"bash","hints":["Installed binaries go to ~/.cargo/bin (on Windows %USERPROFILE%\\.cargo\\bin).","cargo install --list shows what you have installed.","cargo watch -x test re-runs your tests whenever you save a file."],"solution":"$ cargo install ripgrep\n$ which rg            # ~/.cargo/bin/rg\n$ rg \"fn main\" src    # search your code, very fast\n$ cargo install --list\nripgrep v14.x.x:\n    rg","explain":"cargo install builds from source in release mode, so it takes a minute, but the result is a native program. Many everyday developer tools are distributed this way."}}},"15.1":{"example":{"title":"A cons list with Box","lang":"rust","note":"Without Box, List would contain a List directly, so its size would be infinite and the compiler would refuse it. A Box is a pointer of known size, so the enum's size becomes fixed. Box is also how you move a large value cheaply or store a trait object.","code":"#[derive(Debug)]\nenum List {\n    Cons(i32, Box<List>),\n    Nil,\n}\n\nuse List::{Cons, Nil};\n\nfn sum(list: &List) -> i32 {\n    match list {\n        Cons(v, rest) => v + sum(rest),\n        Nil => 0,\n    }\n}\n\nfn main() {\n    let b = Box::new(5);\n    println!(\"b = {b}\");\n    let list = Cons(1, Box::new(Cons(2, Box::new(Cons(3, Box::new(Nil))))));\n    println!(\"{list:?} sums to {}\", sum(&list));\n}","output":"b = 5\nCons(1, Cons(2, Cons(3, Nil))) sums to 6"},"exercises":{"15.1a":{"lang":"rust","hints":["insert matches self; inserting into a Leaf makes a Node with two Leaf children.","Smaller values go left, larger or equal go right.","to_vec visits left, then the value, then right."],"solution":"#[derive(Debug)]\nenum Tree {\n    Leaf,\n    Node(Box<Tree>, i32, Box<Tree>),\n}\n\nimpl Tree {\n    fn insert(self, v: i32) -> Tree {\n        match self {\n            Tree::Leaf => Tree::Node(Box::new(Tree::Leaf), v, Box::new(Tree::Leaf)),\n            Tree::Node(l, x, r) => {\n                if v < x {\n                    Tree::Node(Box::new(l.insert(v)), x, r)\n                } else {\n                    Tree::Node(l, x, Box::new(r.insert(v)))\n                }\n            }\n        }\n    }\n    fn contains(&self, v: i32) -> bool {\n        match self {\n            Tree::Leaf => false,\n            Tree::Node(l, x, r) => v == *x || if v < *x { l.contains(v) } else { r.contains(v) },\n        }\n    }\n    fn to_vec(&self) -> Vec<i32> {\n        match self {\n            Tree::Leaf => vec![],\n            Tree::Node(l, x, r) => {\n                let mut out = l.to_vec();\n                out.push(*x);\n                out.extend(r.to_vec());\n                out\n            }\n        }\n    }\n}\n\nfn main() {\n    let t = [5, 2, 8, 1, 9].into_iter().fold(Tree::Leaf, |t, v| t.insert(v));\n    println!(\"{:?} has 8: {}\", t.to_vec(), t.contains(8));\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn sorted() {\n        let t = [3, 1, 2].into_iter().fold(Tree::Leaf, |t, v| t.insert(v));\n        assert_eq!(t.to_vec(), vec![1, 2, 3]);\n        assert!(!t.contains(7));\n    }\n}","explain":"l.insert(v) works on a Box<Tree> because of Deref, covered next; it calls Tree::insert on the boxed value. Taking self by value avoids any need for mutable references inside the tree."},"15.1b":{"lang":"rust","hints":["std::mem::size_of::<Big>() is one million; size_of::<Box<Big>>() is 8 on 64-bit.","Box::new(Big { data: [0; 1_000_000] }) may use the stack briefly; vec![0u8; 1_000_000].into_boxed_slice() avoids that.","Moving a Box moves only the pointer."],"solution":"use std::mem::size_of;\n\nstruct Big {\n    data: Box<[u8]>,\n}\n\nfn touch(mut b: Box<Big>) -> Box<Big> {\n    b.data[0] = 42;\n    b // moving a Box copies only a pointer\n}\n\nfn main() {\n    println!(\"array: {} bytes\", size_of::<[u8; 1_000_000]>());\n    println!(\"Box<[u8; 1_000_000]>: {} bytes\", size_of::<Box<[u8; 1_000_000]>>());\n    let b = Box::new(Big { data: vec![0u8; 1_000_000].into_boxed_slice() });\n    let b = touch(b);\n    println!(\"first byte {}, len {}\", b.data[0], b.data.len());\n}","explain":"Boxing big values keeps moves cheap and avoids stack overflows, since the stack is usually only a few megabytes. A Box<[u8]> slice is two words (pointer and length) and lives entirely on the heap."}}},"15.2":{"example":{"title":"MyBox and a custom Drop","lang":"rust","note":"Deref coercion lets the compiler insert as many deref calls as needed to match a parameter type, which is why &String works where &str is expected. You cannot call c.drop() yourself; std::mem::drop(c) takes ownership and lets the normal Drop run.","code":"use std::ops::Deref;\n\nstruct MyBox<T>(T);\n\nimpl<T> MyBox<T> {\n    fn new(x: T) -> MyBox<T> { MyBox(x) }\n}\n\nimpl<T> Deref for MyBox<T> {\n    type Target = T;\n    fn deref(&self) -> &T { &self.0 }\n}\n\nstruct Connection { name: String }\nimpl Drop for Connection {\n    fn drop(&mut self) { println!(\"closing {}\", self.name); }\n}\n\nfn hello(name: &str) { println!(\"Hello, {name}!\"); }\n\nfn main() {\n    let x = 5;\n    let y = MyBox::new(x);\n    assert_eq!(5, *y);                 // *y is *(y.deref())\n    let m = MyBox::new(String::from(\"Rust\"));\n    hello(&m);                          // &MyBox<String> -> &String -> &str\n    let c = Connection { name: \"db\".into() };\n    let _d = Connection { name: \"cache\".into() };\n    drop(c);                            // close early\n    println!(\"end of main\");\n}","output":"Hello, Rust!\nclosing db\nend of main\nclosing cache"},"exercises":{"15.2a":{"lang":"rust","hints":["std::time::Instant::now() records the start.","In drop: println!(\"{} took {:?}\", self.label, self.start.elapsed());","Bind it with let _t = Timer { ... }; because let _ = ... drops it immediately."],"solution":"use std::time::Instant;\n\nstruct Timer {\n    label: &'static str,\n    start: Instant,\n}\n\nimpl Timer {\n    fn new(label: &'static str) -> Timer {\n        Timer { label, start: Instant::now() }\n    }\n}\n\nimpl Drop for Timer {\n    fn drop(&mut self) {\n        println!(\"{} took {:?}\", self.label, self.start.elapsed());\n    }\n}\n\nfn main() {\n    {\n        let _t = Timer::new(\"summing\");\n        let s: u64 = (1..=5_000_000u64).sum();\n        println!(\"sum = {s}\");\n    }\n    println!(\"done\");\n}","explain":"This is the RAII guard pattern, also used by MutexGuard and file handles. Watch the difference between let _t (lives to the end of the block) and let _ (dropped on the spot), a classic gotcha."},"15.2b":{"lang":"rust","hints":["type Target = str;","fn deref(&self) -> &str { &self.0 }","Then name.len() and takes_str(&name) both work."],"solution":"use std::ops::Deref;\n\nstruct Name(String);\n\nimpl Deref for Name {\n    type Target = str;\n    fn deref(&self) -> &str {\n        &self.0\n    }\n}\n\nfn shout(s: &str) -> String {\n    s.to_uppercase()\n}\n\nfn main() {\n    let n = Name(String::from(\"kevon\"));\n    println!(\"{} has {} letters\", shout(&n), n.len());\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn derefs() {\n        let n = Name(\"ab\".into());\n        assert_eq!(n.len(), 2);\n        assert_eq!(shout(&n), \"AB\");\n    }\n}","explain":"Implementing Deref is meant for smart-pointer-like wrappers. Using it to fake inheritance between unrelated types is discouraged, because method lookups become surprising."}}},"15.3":{"example":{"title":"Two lists sharing a tail","lang":"rust","note":"Rc::clone only increments a counter, so it is cheap; writing Rc::clone(&a) instead of a.clone() makes that visible to readers. The value is dropped when the last Rc goes away. Rc is for one thread only; Chapter 16 uses Arc for threads. Data inside an Rc is read-only unless combined with RefCell.","code":"use std::rc::Rc;\n\n#[derive(Debug)]\nenum List {\n    Cons(i32, Rc<List>),\n    Nil,\n}\nuse List::{Cons, Nil};\n\nfn main() {\n    let a = Rc::new(Cons(5, Rc::new(Cons(10, Rc::new(Nil)))));\n    println!(\"count after creating a = {}\", Rc::strong_count(&a));\n    let _b = Cons(3, Rc::clone(&a));\n    println!(\"count after creating b = {}\", Rc::strong_count(&a));\n    {\n        let _c = Cons(4, Rc::clone(&a));\n        println!(\"count after creating c = {}\", Rc::strong_count(&a));\n    }\n    println!(\"count after c goes out of scope = {}\", Rc::strong_count(&a));\n}","output":"count after creating a = 1\ncount after creating b = 2\ncount after creating c = 3\ncount after c goes out of scope = 2"},"exercises":{"15.3a":{"lang":"rust","hints":["struct Worker { id: u32, config: Rc<Config> }","Create workers in a Vec with Rc::clone(&cfg).","Remove one with workers.pop() or drop(workers.remove(0))."],"solution":"use std::rc::Rc;\n\nstruct Config {\n    server: String,\n}\n\nstruct Worker {\n    id: u32,\n    config: Rc<Config>,\n}\n\nfn main() {\n    let cfg = Rc::new(Config { server: \"api.example.com\".into() });\n    let mut workers: Vec<Worker> = (1..=3).map(|id| Worker { id, config: Rc::clone(&cfg) }).collect();\n    println!(\"count = {}\", Rc::strong_count(&cfg));\n    let w = workers.remove(0);\n    println!(\"worker {} used {}\", w.id, w.config.server);\n    drop(w);\n    println!(\"count = {}\", Rc::strong_count(&cfg));\n    println!(\"{} workers left\", workers.len());\n}","explain":"Each worker owns a share of the same Config, so nobody has to decide who is the \"real\" owner. When all workers and cfg are gone, the Config is freed exactly once."},"15.3b":{"lang":"rust","hints":["struct Node { name: &'static str, children: Vec<Rc<Node>> }","Build from the bottom up, D first, then B and C cloning the Rc of D, then A.","A recursive function can print the names depth-first."],"solution":"use std::rc::Rc;\n\nstruct Node {\n    name: &'static str,\n    children: Vec<Rc<Node>>,\n}\n\nfn walk(n: &Node, depth: usize) {\n    println!(\"{}{}\", \"  \".repeat(depth), n.name);\n    for c in &n.children {\n        walk(c, depth + 1);\n    }\n}\n\nfn main() {\n    let d = Rc::new(Node { name: \"D\", children: vec![] });\n    let b = Rc::new(Node { name: \"B\", children: vec![Rc::clone(&d)] });\n    let c = Rc::new(Node { name: \"C\", children: vec![Rc::clone(&d)] });\n    let a = Node { name: \"A\", children: vec![b, c] };\n    println!(\"D is shared by {} owners\", Rc::strong_count(&d));\n    walk(&a, 0);\n}","explain":"D's count is 3, one for the variable d and one for each parent. Notice D is printed twice when walking, because two paths reach it; this is a DAG, not a tree."}}},"15.4":{"example":{"title":"A mock messenger and shared mutable data","lang":"rust","note":"RefCell enforces the same one-writer-or-many-readers rule, but at run time; holding two borrow_mut at once panics with \"already borrowed\". Use it when you know the access pattern is safe but the compiler cannot prove it, as with a mock behind an &self interface.","code":"use std::cell::RefCell;\nuse std::rc::Rc;\n\npub trait Messenger {\n    fn send(&self, msg: &str);\n}\n\npub fn check_quota(m: &dyn Messenger, used: u32, max: u32) {\n    if used * 100 / max >= 90 {\n        m.send(\"Warning: over 90% of quota used\");\n    }\n}\n\nstruct MockMessenger {\n    sent: RefCell<Vec<String>>,   // send takes &self, yet we record messages\n}\n\nimpl Messenger for MockMessenger {\n    fn send(&self, msg: &str) {\n        self.sent.borrow_mut().push(String::from(msg));\n    }\n}\n\nfn main() {\n    let shared = Rc::new(RefCell::new(vec![1, 2]));\n    let other = Rc::clone(&shared);\n    other.borrow_mut().push(3);\n    println!(\"{:?}\", shared.borrow());\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn sends_warning() {\n        let m = MockMessenger { sent: RefCell::new(vec![]) };\n        check_quota(&m, 95, 100);\n        assert_eq!(m.sent.borrow().len(), 1);\n    }\n}","output":"[1, 2, 3]"},"exercises":{"15.4a":{"lang":"rust","hints":["struct Teller { ledger: Rc<RefCell<Vec<i64>>> }","Inside deposit, self.ledger.borrow_mut().push(amount);","Sum with ledger.borrow().iter().sum::<i64>()."],"solution":"use std::cell::RefCell;\nuse std::rc::Rc;\n\nstruct Teller {\n    ledger: Rc<RefCell<Vec<i64>>>,\n}\n\nimpl Teller {\n    fn deposit(&self, amount: i64) {\n        self.ledger.borrow_mut().push(amount);\n    }\n}\n\nfn main() {\n    let ledger = Rc::new(RefCell::new(Vec::new()));\n    let a = Teller { ledger: Rc::clone(&ledger) };\n    let b = Teller { ledger: Rc::clone(&ledger) };\n    a.deposit(100);\n    b.deposit(250);\n    a.deposit(-40);\n    println!(\"total = {}\", ledger.borrow().iter().sum::<i64>());\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn both_tellers_write() {\n        let l = Rc::new(RefCell::new(vec![]));\n        Teller { ledger: Rc::clone(&l) }.deposit(1);\n        Teller { ledger: Rc::clone(&l) }.deposit(2);\n        assert_eq!(*l.borrow(), vec![1, 2]);\n    }\n}","explain":"Rc gives several owners, RefCell lets them change the value; together they are the single-threaded version of Arc<Mutex<T>>. Keep borrows short, since a borrow held across another call is how \"already borrowed\" panics happen."},"15.4b":{"lang":"rust","hints":["let a = cell.borrow_mut(); let b = cell.borrow(); panics.","The message contains \"already mutably borrowed\".","Put the borrow_mut in its own { } block so it ends before the next borrow."],"solution":"use std::cell::RefCell;\n\nfn fixed() -> i32 {\n    let cell = RefCell::new(1);\n    {\n        let mut w = cell.borrow_mut();\n        *w += 1;\n    } // the mutable borrow ends here\n    let r = cell.borrow();\n    *r\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    #[should_panic(expected = \"already mutably borrowed\")]\n    fn overlapping_borrows_panic() {\n        let cell = RefCell::new(1);\n        let _w = cell.borrow_mut();\n        let _r = cell.borrow(); // panics at run time\n    }\n\n    #[test]\n    fn scoped_borrows_are_fine() {\n        assert_eq!(fixed(), 2);\n    }\n}","explain":"The compiler accepts the broken version because RefCell moves the check to run time. try_borrow and try_borrow_mut return a Result instead of panicking when you need to handle contention."}}},"15.5":{"example":{"title":"A tree with Weak parent links","lang":"rust","note":"A Weak does not keep its value alive, so parents own children with Rc, and children point back with Weak. upgrade returns Some only while the value still exists. Rust prevents dangling pointers but not memory leaks, so cycles are your responsibility.","code":"use std::cell::RefCell;\nuse std::rc::{Rc, Weak};\n\n#[derive(Debug)]\nstruct Node {\n    value: i32,\n    parent: RefCell<Weak<Node>>,\n    children: RefCell<Vec<Rc<Node>>>,\n}\n\nfn main() {\n    let leaf = Rc::new(Node { value: 3, parent: RefCell::new(Weak::new()), children: RefCell::new(vec![]) });\n    println!(\"leaf parent = {:?}\", leaf.parent.borrow().upgrade().map(|p| p.value));\n    let branch = Rc::new(Node { value: 5, parent: RefCell::new(Weak::new()), children: RefCell::new(vec![Rc::clone(&leaf)]) });\n    *leaf.parent.borrow_mut() = Rc::downgrade(&branch);\n    println!(\"leaf parent = {:?}\", leaf.parent.borrow().upgrade().map(|p| p.value));\n    println!(\"branch strong = {}, weak = {}\", Rc::strong_count(&branch), Rc::weak_count(&branch));\n}","output":"leaf parent = None\nleaf parent = Some(5)\nbranch strong = 1, weak = 1"},"exercises":{"15.5a":{"lang":"rust","hints":["Loop while node.parent.borrow().upgrade() returns Some(p), moving to p.","Keep the current node in a variable of type Rc<Node>.","Link each child with Rc::downgrade(&parent)."],"solution":"use std::cell::RefCell;\nuse std::rc::{Rc, Weak};\n\nstruct Node {\n    value: i32,\n    parent: RefCell<Weak<Node>>,\n    children: RefCell<Vec<Rc<Node>>>,\n}\n\nfn new_node(value: i32) -> Rc<Node> {\n    Rc::new(Node { value, parent: RefCell::new(Weak::new()), children: RefCell::new(vec![]) })\n}\n\nfn add_child(parent: &Rc<Node>, child: &Rc<Node>) {\n    *child.parent.borrow_mut() = Rc::downgrade(parent);\n    parent.children.borrow_mut().push(Rc::clone(child));\n}\n\nfn root_value(node: &Rc<Node>) -> i32 {\n    let mut current = Rc::clone(node);\n    loop {\n        let parent = current.parent.borrow().upgrade();\n        match parent {\n            Some(p) => current = p,\n            None => return current.value,\n        }\n    }\n}\n\nfn main() {\n    let root = new_node(1);\n    let mid = new_node(2);\n    let leaf = new_node(3);\n    add_child(&root, &mid);\n    add_child(&mid, &leaf);\n    println!(\"root of leaf = {}\", root_value(&leaf));\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn climbs() {\n        let r = new_node(10);\n        let c = new_node(20);\n        add_child(&r, &c);\n        assert_eq!(root_value(&c), 10);\n        assert_eq!(root_value(&r), 10);\n    }\n}","explain":"The upgrade result is stored in a variable before the match so the RefCell borrow ends before current is replaced; matching on current.parent.borrow().upgrade() directly would hold the borrow too long."},"15.5b":{"lang":"rust","hints":["struct Pal { name: &'static str, other: RefCell<Option<Rc<Pal>>> } with a printing Drop.","Set a.other to b and b.other to a, then let main end.","The fixed version uses RefCell<Option<Weak<Pal>>> for one of the links."],"solution":"use std::cell::RefCell;\nuse std::rc::{Rc, Weak};\n\nstruct Pal {\n    name: &'static str,\n    strong: RefCell<Option<Rc<Pal>>>,\n    weak: RefCell<Option<Weak<Pal>>>,\n}\n\nimpl Drop for Pal {\n    fn drop(&mut self) {\n        println!(\"dropping {}\", self.name);\n    }\n}\n\nfn pal(name: &'static str) -> Rc<Pal> {\n    Rc::new(Pal { name, strong: RefCell::new(None), weak: RefCell::new(None) })\n}\n\nfn main() {\n    {\n        let a = pal(\"leaky a\");\n        let b = pal(\"leaky b\");\n        *a.strong.borrow_mut() = Some(Rc::clone(&b));\n        *b.strong.borrow_mut() = Some(Rc::clone(&a)); // cycle: never dropped\n    }\n    {\n        let a = pal(\"fine a\");\n        let b = pal(\"fine b\");\n        *a.strong.borrow_mut() = Some(Rc::clone(&b));\n        *b.weak.borrow_mut() = Some(Rc::downgrade(&a)); // back link is weak\n    }\n    println!(\"end of main\");\n}\n// Output: dropping fine a, dropping fine b, end of main","explain":"The leaky pair never prints because each keeps the other's count above zero forever. Leaks are memory-safe in Rust, which is exactly why the compiler cannot help here; design ownership so back links are Weak."}}},"16.1":{"example":{"title":"spawn, join, move and scope","lang":"rust","note":"A spawned thread might outlive the function that started it, so it cannot borrow local variables; move gives it ownership instead. thread::scope guarantees every thread ends before the scope does, so borrowing is allowed there. When main returns, any threads still running are stopped.","code":"use std::thread;\nuse std::time::Duration;\n\nfn main() {\n    let handle = thread::spawn(|| {\n        for i in 1..4 {\n            println!(\"hi number {i} from the spawned thread!\");\n            thread::sleep(Duration::from_millis(1));\n        }\n    });\n    handle.join().unwrap();             // wait for it to finish\n\n    let v = vec![1, 2, 3];\n    let h = thread::spawn(move || {     // v moves into the thread\n        println!(\"vector: {v:?}\");\n        v.len()\n    });\n    println!(\"thread returned {}\", h.join().unwrap());\n\n    let mut data = vec![1, 2, 3, 4];\n    thread::scope(|s| {                  // scoped threads may borrow\n        let (left, right) = data.split_at_mut(2);\n        s.spawn(|| left.iter_mut().for_each(|x| *x *= 10));\n        s.spawn(|| right.iter_mut().for_each(|x| *x += 1));\n    });\n    println!(\"{data:?}\");\n}","output":"hi number 1 from the spawned thread!\nhi number 2 from the spawned thread!\nhi number 3 from the spawned thread!\nvector: [1, 2, 3]\nthread returned 3\n[10, 20, 4, 5]"},"exercises":{"16.1a":{"lang":"rust","hints":["data.chunks(data.len() / 4) gives four slices.","Inside thread::scope, collect the handles from s.spawn into a Vec.","Each handle's join() returns that chunk's sum."],"solution":"use std::thread;\n\nfn parallel_sum(data: &[u64], parts: usize) -> u64 {\n    let size = data.len().div_ceil(parts).max(1);\n    thread::scope(|s| {\n        let handles: Vec<_> = data\n            .chunks(size)\n            .map(|chunk| s.spawn(move || chunk.iter().sum::<u64>()))\n            .collect();\n        handles.into_iter().map(|h| h.join().unwrap()).sum()\n    })\n}\n\nfn main() {\n    let data: Vec<u64> = (1..=1_000_000).collect();\n    let n = data.len() as u64;\n    println!(\"{} (expected {})\", parallel_sum(&data, 4), n * (n + 1) / 2);\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn matches_formula() {\n        let d: Vec<u64> = (1..=1000).collect();\n        assert_eq!(parallel_sum(&d, 4), 500500);\n        assert_eq!(parallel_sum(&d, 3), 500500);\n    }\n}","explain":"The threads only borrow the chunks, which is safe because scope waits for them all. div_ceil makes sure no numbers are left over when the length does not divide evenly. For real data-parallel work, the rayon crate does this splitting for you."},"16.1b":{"lang":"rust","hints":["Each closure needs move so it owns its i.","Store handles in a Vec<thread::JoinHandle<u64>>.","Joining in order gives results in order, regardless of which finished first."],"solution":"use std::thread;\nuse std::time::Duration;\n\nfn main() {\n    let handles: Vec<thread::JoinHandle<u64>> = (0..5u64)\n        .map(|i| {\n            thread::spawn(move || {\n                thread::sleep(Duration::from_millis(50 - i * 10));\n                i * i\n            })\n        })\n        .collect();\n    let results: Vec<u64> = handles.into_iter().map(|h| h.join().unwrap()).collect();\n    println!(\"{results:?}\");\n}","explain":"Later threads sleep less so they finish first, but joining in order still produces [0, 1, 4, 9, 16]. join returns Err if the thread panicked, which is why unwrap is needed."}}},"16.2":{"example":{"title":"Several producers, one consumer","lang":"rust","note":"send moves the value into the channel, so the sending thread cannot use it afterwards; the compiler enforces this. The receiver's iterator ends when every sender has been dropped, which is a simple way to know all work is finished. The order between producers is not guaranteed, which is why the example sorts.","code":"use std::sync::mpsc;\nuse std::thread;\nuse std::time::Duration;\n\nfn main() {\n    let (tx, rx) = mpsc::channel();\n    let tx2 = tx.clone();\n\n    thread::spawn(move || {\n        for word in [\"hi\", \"from\", \"the\", \"thread\"] {\n            tx.send(format!(\"A: {word}\")).unwrap();\n            thread::sleep(Duration::from_millis(5));\n        }\n    });\n    thread::spawn(move || {\n        for word in [\"more\", \"messages\"] {\n            tx2.send(format!(\"B: {word}\")).unwrap();\n            thread::sleep(Duration::from_millis(5));\n        }\n    });\n\n    let mut got: Vec<String> = rx.iter().collect(); // ends when all senders drop\n    got.sort();\n    println!(\"{got:?}\");\n}","output":"[\"A: from\", \"A: hi\", \"A: the\", \"A: thread\", \"B: messages\", \"B: more\"]"},"exercises":{"16.2a":{"lang":"rust","hints":["Clone tx once per worker inside a loop.","Drop the original tx in main, or the receiving loop never ends.","for (id, r) in rx { ... } collects results as they arrive."],"solution":"use std::sync::mpsc;\nuse std::thread;\n\nfn main() {\n    let (tx, rx) = mpsc::channel();\n    for id in 1..=3u32 {\n        let tx = tx.clone();\n        thread::spawn(move || {\n            let result: u32 = (1..=id * 100).sum();\n            tx.send((id, result)).unwrap();\n        });\n    }\n    drop(tx); // otherwise rx waits forever for this sender\n    let mut results: Vec<(u32, u32)> = rx.iter().collect();\n    results.sort();\n    for (id, r) in results {\n        println!(\"worker {id}: {r}\");\n    }\n}","explain":"Forgetting drop(tx) is the most common channel bug, the program simply hangs. Channels are the core of the worker pool you will build in Chapter 21."},"16.2b":{"lang":"rust","hints":["sync_channel(2) holds at most two unreceived messages.","send blocks when the buffer is full.","Make the consumer sleep 50 ms per item and the producer not sleep at all."],"solution":"use std::sync::mpsc;\nuse std::thread;\nuse std::time::Duration;\n\nfn main() {\n    let (tx, rx) = mpsc::sync_channel(2);\n    let producer = thread::spawn(move || {\n        for i in 1..=6 {\n            tx.send(i).unwrap(); // blocks while two items are waiting\n            println!(\"sent {i}\");\n        }\n    });\n    for item in rx {\n        thread::sleep(Duration::from_millis(50));\n        println!(\"  received {item}\");\n    }\n    producer.join().unwrap();\n}","explain":"Back-pressure stops a fast producer from filling memory when the consumer cannot keep up, the same idea as a bounded queue in a load-testing tool. An unbounded channel would let the producer race ahead."}}},"16.3":{"example":{"title":"Ten threads, one counter","lang":"rust","note":"Arc is the thread-safe version of Rc, using atomic operations for its count. lock returns a Result because a thread that panicked while holding the lock leaves it poisoned. Keep lock scopes short, and always take several locks in the same order to avoid deadlocks.","code":"use std::sync::{Arc, Mutex};\nuse std::thread;\n\nfn main() {\n    let counter = Arc::new(Mutex::new(0));\n    let mut handles = vec![];\n    for _ in 0..10 {\n        let counter = Arc::clone(&counter);\n        handles.push(thread::spawn(move || {\n            let mut num = counter.lock().unwrap();  // MutexGuard\n            *num += 1;\n        }));                                         // guard dropped: unlocked\n    }\n    for h in handles {\n        h.join().unwrap();\n    }\n    println!(\"Result: {}\", *counter.lock().unwrap());\n}","output":"Result: 10"},"exercises":{"16.3a":{"lang":"rust","hints":["fn sell(stock: &Mutex<HashMap<String, u32>>, item: &str) -> bool","Inside, let mut s = stock.lock().unwrap(); then check and decrement.","Use get_mut to change a value in place."],"solution":"use std::collections::HashMap;\nuse std::sync::{Arc, Mutex};\nuse std::thread;\n\nfn sell(stock: &Mutex<HashMap<String, u32>>, item: &str) -> bool {\n    let mut s = stock.lock().unwrap();\n    match s.get_mut(item) {\n        Some(n) if *n > 0 => {\n            *n -= 1;\n            true\n        }\n        _ => false,\n    }\n}\n\nfn main() {\n    let stock = Arc::new(Mutex::new(HashMap::from([(\"apple\".to_string(), 5), (\"pear\".to_string(), 2)])));\n    let handles: Vec<_> = (0..4)\n        .map(|_| {\n            let stock = Arc::clone(&stock);\n            thread::spawn(move || (0..3).filter(|_| sell(&stock, \"apple\")).count())\n        })\n        .collect();\n    let sold: usize = handles.into_iter().map(|h| h.join().unwrap()).sum();\n    println!(\"sold {sold} apples, stock now {:?}\", stock.lock().unwrap());\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn never_below_zero() {\n        let s = Mutex::new(HashMap::from([(\"x\".to_string(), 1)]));\n        assert!(sell(&s, \"x\"));\n        assert!(!sell(&s, \"x\"));\n        assert!(!sell(&s, \"missing\"));\n    }\n}","explain":"Twelve attempts but only five apples, and the check-and-decrement happens while holding the lock, so two threads can never both sell the last apple. That race is exactly the kind of bug QA finds in systems without such guarantees."},"16.3b":{"lang":"rust","hints":["Thread 1: let _a = a.lock(); sleep; let _b = b.lock();","Thread 2 does the same but with b first.","The fix is to make both threads take a first, then b."],"solution":"use std::sync::{Arc, Mutex};\nuse std::thread;\nuse std::time::Duration;\n\nfn main() {\n    let a = Arc::new(Mutex::new(0));\n    let b = Arc::new(Mutex::new(0));\n\n    // Fixed version: both threads lock a, then b.\n    // (Locking b then a in the second thread can deadlock.)\n    let (a1, b1) = (Arc::clone(&a), Arc::clone(&b));\n    let t1 = thread::spawn(move || {\n        let mut x = a1.lock().unwrap();\n        thread::sleep(Duration::from_millis(10));\n        let mut y = b1.lock().unwrap();\n        *x += 1;\n        *y += 1;\n    });\n    let (a2, b2) = (Arc::clone(&a), Arc::clone(&b));\n    let t2 = thread::spawn(move || {\n        let mut x = a2.lock().unwrap();\n        thread::sleep(Duration::from_millis(10));\n        let mut y = b2.lock().unwrap();\n        *x += 10;\n        *y += 10;\n    });\n    t1.join().unwrap();\n    t2.join().unwrap();\n    println!(\"a = {}, b = {}\", a.lock().unwrap(), b.lock().unwrap());\n}","explain":"Rust prevents data races, but not deadlocks, which are a logic problem. A consistent lock order is the standard cure; holding a single lock around both values is often even simpler."}}},"16.4":{"example":{"title":"The compiler refusing Rc across threads","lang":"rust","note":"Send means ownership of a value can move to another thread; Sync means a shared reference can be used from several threads. Types made only of Send and Sync parts get the traits automatically. Rc's counter is not atomic, so the compiler stops it at the thread boundary; swap in Arc and it compiles.","code":"use std::rc::Rc;\nuse std::thread;\n\nfn main() {\n    let shared = Rc::new(5);\n    let s = Rc::clone(&shared);\n    // error[E0277]: `Rc<i32>` cannot be sent between threads safely\n    let h = thread::spawn(move || println!(\"{s}\"));\n    h.join().unwrap();\n}","output":"error[E0277]: `Rc<i32>` cannot be sent between threads safely\n   = help: within `{closure}`, the trait `Send` is not implemented for `Rc<i32>`"},"exercises":{"16.4a":{"lang":"rust","hints":["Replace Rc with Arc.","To change the number, wrap it as Arc<Mutex<i32>>.","Clone the Arc once per thread."],"solution":"use std::sync::{Arc, Mutex};\nuse std::thread;\n\nfn add_in_threads(start: i32) -> i32 {\n    let shared = Arc::new(Mutex::new(start));\n    let handles: Vec<_> = [5, 7]\n        .into_iter()\n        .map(|n| {\n            let s = Arc::clone(&shared);\n            thread::spawn(move || *s.lock().unwrap() += n)\n        })\n        .collect();\n    for h in handles {\n        h.join().unwrap();\n    }\n    let total = *shared.lock().unwrap();\n    total\n}\n\nfn main() {\n    println!(\"{}\", add_in_threads(5));\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn adds() {\n        assert_eq!(add_in_threads(0), 12);\n    }\n}","explain":"Arc gives shared ownership across threads (Send and Sync), and Mutex makes changing the value safe. The compiler error disappears because every type involved now carries the right marker traits."},"16.4b":{"lang":"rust","hints":["These empty generic functions compile only if T has the bound.","Call them as assert_send::<String>();","Comment out the ones that fail and write the reason next to each."],"solution":"use std::cell::Cell;\nuse std::sync::{Arc, Mutex};\n\nfn assert_send<T: Send>() {}\nfn assert_sync<T: Sync>() {}\n\nfn main() {\n    assert_send::<i32>();\n    assert_sync::<i32>();\n    assert_send::<String>();\n    assert_sync::<String>();\n    assert_send::<Vec<u8>>();\n    assert_send::<Arc<Mutex<i32>>>();\n    assert_sync::<Arc<Mutex<i32>>>();\n    assert_send::<Cell<i32>>(); // Cell can move to another thread...\n    // assert_sync::<Cell<i32>>(); // ...but not be shared: changes are not synchronised\n    // assert_send::<std::rc::Rc<i32>>(); // Rc's count is not atomic\n    println!(\"all remaining checks compiled\");\n}","explain":"This trick of compile-time assertions with empty generic functions is common in library tests. Cell is Send but not Sync, which shows the two traits really are different questions."}}},"17.1":{"example":{"title":"Two async functions, awaited in order","lang":"rust","note":"An async fn returns a future, a value that describes work to do. Futures are lazy, so nothing runs until something awaits them. #[tokio::main] starts a runtime that drives the futures. Each .await is a point where the task can pause and let others run.","code":"use std::time::Duration;\nuse tokio::time::sleep;\n\nasync fn fetch_title(url: &str) -> String {\n    sleep(Duration::from_millis(50)).await;      // pretend network wait\n    format!(\"Title of {url}\")\n}\n\n#[tokio::main]\nasync fn main() {\n    let fut = fetch_title(\"https://rust-lang.org\"); // nothing happens yet\n    println!(\"future created\");\n    let title = fut.await;                          // now it runs\n    println!(\"{title}\");\n}","output":"future created\nTitle of https://rust-lang.org"},"exercises":{"17.1a":{"lang":"rust","hints":["cargo add tokio --features full","Use tokio::time::sleep, never std::thread::sleep, inside async code.","Awaiting one after the other takes about 200 ms in total."],"solution":"use std::time::{Duration, Instant};\n\nasync fn slow_add(a: u32, b: u32) -> u32 {\n    tokio::time::sleep(Duration::from_millis(100)).await;\n    a + b\n}\n\n#[tokio::main]\nasync fn main() {\n    let start = Instant::now();\n    let x = slow_add(1, 2).await;\n    let y = slow_add(x, 3).await;\n    println!(\"{y} after {:?}\", start.elapsed());\n}","explain":"std::thread::sleep would block the whole runtime thread, freezing every other task; tokio::time::sleep only pauses this task. The two calls run in sequence here because each await waits for its result before moving on."},"17.1b":{"lang":"rust","hints":["let f = async { println!(\"running\"); 42 };","Print something before awaiting it.","Make a second future and drop it with drop(g)."],"solution":"#[tokio::main]\nasync fn main() {\n    let f = async {\n        println!(\"running f\");\n        42\n    };\n    println!(\"before await\");\n    println!(\"f returned {}\", f.await);\n\n    let g = async {\n        println!(\"running g\"); // never printed\n    };\n    drop(g);\n    println!(\"g was dropped without running\");\n}","explain":"Unlike JavaScript promises, Rust futures do not start on their own. This is a frequent surprise; if a log line never appears, check that the future is actually awaited or spawned."}}},"17.2":{"example":{"title":"join!, spawn and an async channel","lang":"rust","note":"join! polls both futures in the same task, so their waits overlap and the total is about one wait, not two. tokio::spawn hands a future to the runtime as its own task, which needs 'static data, hence async move. while let Some(v) = rx.recv().await ends when all senders are dropped, just like the thread channel.","code":"use std::time::{Duration, Instant};\nuse tokio::sync::mpsc;\nuse tokio::time::sleep;\n\nasync fn work(name: &str, ms: u64) -> String {\n    sleep(Duration::from_millis(ms)).await;\n    format!(\"{name} done\")\n}\n\n#[tokio::main]\nasync fn main() {\n    let start = Instant::now();\n    let (a, b) = tokio::join!(work(\"a\", 100), work(\"b\", 100));\n    println!(\"{a}, {b} in about {} ms\", start.elapsed().as_millis() / 100 * 100);\n\n    let (tx, mut rx) = mpsc::channel(8);\n    let producer = tokio::spawn(async move {\n        for i in 1..=3 {\n            tx.send(i).await.unwrap();\n            sleep(Duration::from_millis(10)).await;\n        }\n    }); // tx dropped when the task ends, closing the channel\n    while let Some(v) = rx.recv().await {\n        println!(\"got {v}\");\n    }\n    producer.await.unwrap();\n}","output":"a done, b done in about 100 ms\ngot 1\ngot 2\ngot 3"},"exercises":{"17.2a":{"lang":"rust","hints":["async fn fake_fetch(url: &str, ms: u64) -> usize returns a pretend page length.","tokio::join!(a, b, c) returns a tuple of the three results.","Measure with Instant::now() before and elapsed() after."],"solution":"use std::time::{Duration, Instant};\n\nasync fn fake_fetch(url: &str, ms: u64) -> usize {\n    tokio::time::sleep(Duration::from_millis(ms)).await;\n    url.len() * 100\n}\n\n#[tokio::main]\nasync fn main() {\n    let start = Instant::now();\n    let (a, b, c) = tokio::join!(\n        fake_fetch(\"https://a.example\", 300),\n        fake_fetch(\"https://b.example\", 100),\n        fake_fetch(\"https://c.example\", 200),\n    );\n    println!(\"{a} {b} {c} in {:?} (about 300 ms, not 600)\", start.elapsed());\n}","explain":"All three waits overlap on a single thread. This is where async shines, I/O-bound work such as HTTP requests, where a thread per request would waste memory."},"17.2b":{"lang":"rust","hints":["Create the channel with mpsc::channel(10) and clone tx for each task.","Drop the original tx after spawning so recv eventually returns None.","Push each received message into a Vec and print it at the end."],"solution":"use std::time::Duration;\nuse tokio::sync::mpsc;\n\n#[tokio::main]\nasync fn main() {\n    let (tx, mut rx) = mpsc::channel(10);\n    for id in 1..=5u64 {\n        let tx = tx.clone();\n        tokio::spawn(async move {\n            tokio::time::sleep(Duration::from_millis(50 * (5 - id))).await;\n            tx.send(format!(\"task {id}\")).await.unwrap();\n        });\n    }\n    drop(tx);\n    let mut arrived = Vec::new();\n    while let Some(msg) = rx.recv().await {\n        arrived.push(msg);\n    }\n    println!(\"{arrived:?}\");\n}","explain":"Task 5 waits least, so it arrives first. Spawned tasks run independently and may run on different worker threads, which is why their futures must be Send."}}},"17.3":{"example":{"title":"join_all, select! and timeout","lang":"rust","note":"join_all keeps the results in the same order as the input. select! runs whichever branch finishes first and drops the others, which cancels them. A future that never reaches an await point never gives other tasks a turn, so heavy computation belongs in tokio::task::spawn_blocking or a regular thread.","code":"use futures::future::join_all;\nuse std::time::Duration;\nuse tokio::time::{sleep, timeout};\n\nasync fn job(id: u64) -> u64 {\n    sleep(Duration::from_millis(20 * id)).await;\n    id * 10\n}\n\n#[tokio::main]\nasync fn main() {\n    let results = join_all((1..=4).map(job)).await;\n    println!(\"all: {results:?}\");\n\n    tokio::select! {\n        v = job(3) => println!(\"job 3 won with {v}\"),\n        v = job(1) => println!(\"job 1 won with {v}\"),\n    }\n\n    match timeout(Duration::from_millis(30), job(5)).await {\n        Ok(v) => println!(\"finished: {v}\"),\n        Err(_) => println!(\"job 5 timed out\"),\n    }\n\n    for i in 0..3 {\n        // in a long CPU loop, let other tasks run now and then\n        tokio::task::yield_now().await;\n        println!(\"step {i}\");\n    }\n}","output":"all: [10, 20, 30, 40]\njob 1 won with 10\njob 5 timed out\nstep 0\nstep 1\nstep 2"},"exercises":{"17.3a":{"lang":"rust","hints":["async fn check(name: &str, ms: u64, healthy: bool) -> Result<(), String>","Map each service to timeout(Duration::from_millis(150), check(...)).","The result is Result<Result<(), String>, Elapsed>; match both layers."],"solution":"use futures::future::join_all;\nuse std::time::Duration;\nuse tokio::time::{sleep, timeout};\n\nasync fn check(ms: u64, healthy: bool) -> Result<(), String> {\n    sleep(Duration::from_millis(ms)).await;\n    if healthy { Ok(()) } else { Err(\"returned 500\".into()) }\n}\n\n#[tokio::main]\nasync fn main() {\n    let services = [(\"auth\", 40, true), (\"db\", 90, true), (\"search\", 400, true), (\"mail\", 60, false), (\"cdn\", 10, true)];\n    let checks = services\n        .iter()\n        .map(|&(_, ms, ok)| timeout(Duration::from_millis(150), check(ms, ok)));\n    let results = join_all(checks).await;\n    for ((name, _, _), r) in services.iter().zip(results) {\n        let status = match r {\n            Ok(Ok(())) => \"UP\".to_string(),\n            Ok(Err(e)) => format!(\"DOWN ({e})\"),\n            Err(_) => \"TIMEOUT\".to_string(),\n        };\n        println!(\"{name:<8}{status}\");\n    }\n}","explain":"The whole check takes about 150 ms no matter how many services there are, because the waits overlap and the slow one is cut off. This is the skeleton of a real monitoring or smoke-test tool."},"17.3b":{"lang":"rust","hints":["async fn mirror(name: &'static str, ms: u64) -> &'static str prints after sleeping.","Put both calls in select!, each with its own branch.","The loser's print never appears, because select! drops it."],"solution":"use std::time::Duration;\n\nasync fn mirror(name: &'static str, ms: u64) -> &'static str {\n    tokio::time::sleep(Duration::from_millis(ms)).await;\n    println!(\"{name} finished its request\"); // only the winner gets here\n    name\n}\n\n#[tokio::main]\nasync fn main() {\n    let winner = tokio::select! {\n        n = mirror(\"eu-mirror\", 80) => n,\n        n = mirror(\"us-mirror\", 30) => n,\n    };\n    println!(\"using {winner}\");\n    tokio::time::sleep(Duration::from_millis(100)).await; // the loser never prints\n}","explain":"Cancellation by dropping is powerful but means a future can stop at any await point. Code that must finish once started (such as writing a file) should be spawned as its own task instead."}}},"17.4":{"example":{"title":"A stream of ticks, filtered and mapped","lang":"rust","note":"A stream produces values over time, the async version of an iterator, and StreamExt adds map, filter, take and friends. Under the hood every future implements the Future trait's poll method; Pin guarantees a future will not move in memory once polled, which self-referencing async code needs. Use threads for CPU-heavy work and async for many waits.","code":"use std::time::Duration;\nuse tokio_stream::{wrappers::IntervalStream, StreamExt};\n\n#[tokio::main]\nasync fn main() {\n    let ticks = IntervalStream::new(tokio::time::interval(Duration::from_millis(10)));\n    let mut count = 0;\n    let mut evens = ticks\n        .map(move |_| { count += 1; count - 1 })  // number each tick\n        .filter(|i| i % 2 == 0)\n        .take(4);\n    while let Some(i) = evens.next().await {\n        println!(\"tick {i}\");\n    }\n\n    let mut words = tokio_stream::iter([\"async\", \"streams\", \"are\", \"iterators\"]).map(str::len);\n    let mut total = 0;\n    while let Some(n) = words.next().await {\n        total += n;\n    }\n    println!(\"total letters: {total}\");\n}","output":"tick 0\ntick 2\ntick 4\ntick 6\ntotal letters: 27"},"exercises":{"17.4a":{"lang":"rust","hints":["tokio_stream::iter(1..=20) makes a stream from a range.",".filter(|n| n % 3 == 0) works just like on iterators.","Collect items into a Vec buffer and print when it reaches 2, then print any leftovers."],"solution":"use tokio_stream::StreamExt;\n\n#[tokio::main]\nasync fn main() {\n    let mut s = tokio_stream::iter(1..=20).filter(|n| n % 3 == 0);\n    let mut batch = Vec::new();\n    while let Some(n) = s.next().await {\n        batch.push(n);\n        if batch.len() == 2 {\n            println!(\"batch {batch:?}\");\n            batch.clear();\n        }\n    }\n    if !batch.is_empty() {\n        println!(\"last batch {batch:?}\");\n    }\n}","explain":"Batching is how real pipelines cut down on database or network round trips. The StreamExt trait must be imported for the adaptor methods to appear, the same way Iterator methods need nothing because Iterator is in the prelude."},"17.4b":{"lang":"text","hints":["Is the time spent computing or waiting?","Async tasks are cheap; threads use real CPU cores in parallel.","Mixing is fine, spawn_blocking runs blocking work from async code."],"solution":"1. Threads (or rayon): pure CPU work that should use every core.\n2. Async: thousands of connections that mostly wait; one thread each\n   would waste memory.\n3. Async: the time is network waiting, so overlapping requests helps.\n4. A dedicated thread (or spawn_blocking) for compression so the UI\n   or async runtime stays responsive.","explain":"The book's own summary is that threads suit parallel computation and async suits concurrent waiting, and many real programs use both together."}}},"18.1":{"example":{"title":"Encapsulation with a private field","lang":"rust","note":"Because the fields are private, the cached average can never disagree with the list. Rust gives you encapsulation and polymorphism, and shares code through default trait methods and composition rather than inheritance.","code":"pub struct AveragedCollection {\n    list: Vec<i32>,     // private: callers cannot desync the average\n    average: f64,\n}\n\nimpl AveragedCollection {\n    pub fn new() -> Self { AveragedCollection { list: vec![], average: 0.0 } }\n    pub fn add(&mut self, value: i32) {\n        self.list.push(value);\n        self.update_average();\n    }\n    pub fn remove(&mut self) -> Option<i32> {\n        let result = self.list.pop();\n        if result.is_some() { self.update_average(); }\n        result\n    }\n    pub fn average(&self) -> f64 { self.average }\n    fn update_average(&mut self) {\n        let total: i32 = self.list.iter().sum();\n        self.average = if self.list.is_empty() { 0.0 } else { total as f64 / self.list.len() as f64 };\n    }\n}\n\nfn main() {\n    let mut c = AveragedCollection::new();\n    for v in [3, 5, 10] { c.add(v); }\n    c.remove();\n    println!(\"average = {}\", c.average());\n}","output":"average = 4"},"exercises":{"18.1a":{"lang":"rust","hints":["Store readings Vec<f64>, min: Option<f64> and max: Option<f64>.","In add, update min and max with f64::min and f64::max.","min() and max() return Option<f64> so an empty log is handled."],"solution":"pub struct TempLog {\n    readings: Vec<f64>,\n    min: Option<f64>,\n    max: Option<f64>,\n}\n\nimpl TempLog {\n    pub fn new() -> Self {\n        TempLog { readings: Vec::new(), min: None, max: None }\n    }\n    pub fn add(&mut self, t: f64) {\n        self.readings.push(t);\n        self.min = Some(self.min.map_or(t, |m| m.min(t)));\n        self.max = Some(self.max.map_or(t, |m| m.max(t)));\n    }\n    pub fn min(&self) -> Option<f64> { self.min }\n    pub fn max(&self) -> Option<f64> { self.max }\n    pub fn len(&self) -> usize { self.readings.len() }\n}\n\nfn main() {\n    let mut log = TempLog::new();\n    for t in [21.0, -4.5, 30.2] { log.add(t); }\n    println!(\"{} readings, min {:?}, max {:?}\", log.len(), log.min(), log.max());\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn tracks_extremes() {\n        let mut l = TempLog::new();\n        assert_eq!(l.min(), None);\n        l.add(5.0);\n        l.add(-1.0);\n        assert_eq!((l.min(), l.max()), (Some(-1.0), Some(5.0)));\n    }\n}","explain":"map_or handles the first reading neatly, when there is no previous minimum. Since nothing outside can push to readings directly, the cache is always right."},"18.1b":{"lang":"rust","hints":["trait Shape { fn name(&self) -> String; fn area(&self) -> f64; fn describe(&self) -> String { ... } }","Each type implements only name and area.","A regular hexagon with side s has area 3 * sqrt(3) / 2 * s squared."],"solution":"trait Shape {\n    fn name(&self) -> String;\n    fn area(&self) -> f64;\n    fn describe(&self) -> String {\n        format!(\"{} with area {:.2}\", self.name(), self.area())\n    }\n}\n\nstruct Circle(f64);\nstruct Square(f64);\nstruct Hexagon(f64);\n\nimpl Shape for Circle {\n    fn name(&self) -> String { \"circle\".into() }\n    fn area(&self) -> f64 { std::f64::consts::PI * self.0 * self.0 }\n}\nimpl Shape for Square {\n    fn name(&self) -> String { \"square\".into() }\n    fn area(&self) -> f64 { self.0 * self.0 }\n}\nimpl Shape for Hexagon {\n    fn name(&self) -> String { \"hexagon\".into() }\n    fn area(&self) -> f64 { 3.0 * 3f64.sqrt() / 2.0 * self.0 * self.0 }\n}\n\nfn main() {\n    println!(\"{}\", Circle(1.0).describe());\n    println!(\"{}\", Square(2.0).describe());\n    println!(\"{}\", Hexagon(1.0).describe());\n}","explain":"The default method plays the role an inherited method would in other languages, but there is no hidden parent state, so each type stays simple and the shared behaviour is spelled out in the trait."}}},"18.2":{"example":{"title":"A GUI screen of mixed components","lang":"rust","note":"A generic Screen<T Draw> could only hold one component type at a time; Box<dyn Draw> holds any mix. The cost is a pointer lookup per call and no inlining. A trait can be used with dyn only if its methods do not return Self or take generic type parameters.","code":"pub trait Draw {\n    fn draw(&self) -> String;\n}\n\npub struct Screen {\n    pub components: Vec<Box<dyn Draw>>,\n}\n\nimpl Screen {\n    pub fn run(&self) {\n        for c in self.components.iter() {\n            println!(\"{}\", c.draw());\n        }\n    }\n}\n\npub struct Button { pub label: String }\nimpl Draw for Button {\n    fn draw(&self) -> String { format!(\"[ {} ]\", self.label) }\n}\n\nstruct SelectBox { options: Vec<String> }\nimpl Draw for SelectBox {\n    fn draw(&self) -> String { format!(\"<{}>\", self.options.join(\" | \")) }\n}\n\nfn main() {\n    let screen = Screen {\n        components: vec![\n            Box::new(SelectBox { options: vec![\"Yes\".into(), \"Maybe\".into(), \"No\".into()] }),\n            Box::new(Button { label: \"OK\".into() }),\n        ],\n    };\n    screen.run();\n}","output":"<Yes | Maybe | No>\n[ OK ]"},"exercises":{"18.2a":{"lang":"rust","hints":["Each step is its own struct implementing Step.","Fold the text through the steps with steps.iter().fold(text, |acc, s| s.apply(acc)).","Replace holds the two strings as fields."],"solution":"trait Step {\n    fn name(&self) -> &str;\n    fn apply(&self, input: String) -> String;\n}\n\nstruct Trim;\nstruct Upper;\nstruct Replace { from: String, to: String }\n\nimpl Step for Trim {\n    fn name(&self) -> &str { \"trim\" }\n    fn apply(&self, s: String) -> String { s.trim().to_string() }\n}\nimpl Step for Upper {\n    fn name(&self) -> &str { \"upper\" }\n    fn apply(&self, s: String) -> String { s.to_uppercase() }\n}\nimpl Step for Replace {\n    fn name(&self) -> &str { \"replace\" }\n    fn apply(&self, s: String) -> String { s.replace(&self.from, &self.to) }\n}\n\nfn run(steps: &[Box<dyn Step>], text: &str) -> String {\n    steps.iter().fold(text.to_string(), |acc, s| {\n        println!(\"applying {}\", s.name());\n        s.apply(acc)\n    })\n}\n\nfn main() {\n    let steps: Vec<Box<dyn Step>> = vec![\n        Box::new(Trim),\n        Box::new(Replace { from: \"rust\".into(), to: \"Rust\".into() }),\n        Box::new(Upper),\n    ];\n    println!(\"{}\", run(&steps, \"  i like rust  \"));\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn order_matters() {\n        let s: Vec<Box<dyn Step>> = vec![Box::new(Upper), Box::new(Replace { from: \"A\".into(), to: \"4\".into() })];\n        assert_eq!(run(&s, \"banana\"), \"B4N4N4\");\n    }\n}","explain":"Users can add their own Step types without changing run, which is the open-closed principle in practice. This shape appears in middleware stacks, log processors and test harnesses."},"18.2b":{"lang":"rust","hints":["The generic version needs every item to be the same type T.","Mixing a Button and a Label in one slice only works with &dyn Draw.","Write the failing generic call as a comment with the error."],"solution":"trait Draw {\n    fn draw(&self) -> String;\n}\nstruct Button(&'static str);\nstruct Label(&'static str);\nimpl Draw for Button { fn draw(&self) -> String { format!(\"[{}]\", self.0) } }\nimpl Draw for Label { fn draw(&self) -> String { self.0.to_string() } }\n\nfn render_all<T: Draw>(items: &[T]) -> Vec<String> {\n    items.iter().map(|i| i.draw()).collect()\n}\n\nfn render_dyn(items: &[&dyn Draw]) -> Vec<String> {\n    items.iter().map(|i| i.draw()).collect()\n}\n\nfn main() {\n    println!(\"{:?}\", render_all(&[Button(\"Save\"), Button(\"Quit\")]));\n    println!(\"{:?}\", render_dyn(&[&Label(\"Name:\"), &Button(\"OK\")]));\n    // render_all(&[Label(\"x\"), Button(\"y\")]); // error: expected `Label`, found `Button`\n}","explain":"Reach for generics when one type per call is enough and speed matters; reach for dyn when a collection must hold mixed types or when you want smaller compiled code."}}},"18.3":{"example":{"title":"Encoding states as types","lang":"rust","note":"The book first builds this with a Box<dyn State> field that swaps itself on each transition, which is flexible but only checks rules at run time. Turning each state into its own type moves those checks to the compiler, and a draft simply has no content method to call. The trade-off is less flexibility when states are configured at run time.","code":"pub struct Post { content: String }\npub struct DraftPost { content: String }\npub struct PendingReviewPost { content: String }\n\nimpl Post {\n    pub fn new() -> DraftPost { DraftPost { content: String::new() } }\n    pub fn content(&self) -> &str { &self.content }\n}\nimpl DraftPost {\n    pub fn add_text(&mut self, text: &str) { self.content.push_str(text); }\n    pub fn request_review(self) -> PendingReviewPost {\n        PendingReviewPost { content: self.content }\n    }\n}\nimpl PendingReviewPost {\n    pub fn approve(self) -> Post { Post { content: self.content } }\n}\n\nfn main() {\n    let mut post = Post::new();\n    post.add_text(\"I ate a salad for lunch today\");\n    // post.content();      // error: DraftPost has no content method\n    let post = post.request_review();\n    let post = post.approve();\n    println!(\"{}\", post.content());\n}","output":"I ate a salad for lunch today"},"exercises":{"18.3a":{"lang":"rust","hints":["trait State { fn request_review(self: Box<Self>) -> Box<dyn State>; fn approve(self: Box<Self>) -> Box<dyn State>; fn content<'a>(&self, _p: &'a Post) -> &'a str { \"\" } }","Use self.state.take() to move the old state out before replacing it.","Published overrides content to return &post.content."],"solution":"pub struct Post {\n    state: Option<Box<dyn State>>,\n    content: String,\n}\n\nimpl Post {\n    pub fn new() -> Post {\n        Post { state: Some(Box::new(Draft)), content: String::new() }\n    }\n    pub fn add_text(&mut self, text: &str) {\n        self.content.push_str(text);\n    }\n    pub fn content(&self) -> &str {\n        self.state.as_ref().unwrap().content(self)\n    }\n    pub fn request_review(&mut self) {\n        if let Some(s) = self.state.take() {\n            self.state = Some(s.request_review());\n        }\n    }\n    pub fn approve(&mut self) {\n        if let Some(s) = self.state.take() {\n            self.state = Some(s.approve());\n        }\n    }\n}\n\ntrait State {\n    fn request_review(self: Box<Self>) -> Box<dyn State>;\n    fn approve(self: Box<Self>) -> Box<dyn State>;\n    fn content<'a>(&self, _post: &'a Post) -> &'a str {\n        \"\"\n    }\n}\n\nstruct Draft;\nstruct PendingReview;\nstruct Published;\n\nimpl State for Draft {\n    fn request_review(self: Box<Self>) -> Box<dyn State> { Box::new(PendingReview) }\n    fn approve(self: Box<Self>) -> Box<dyn State> { self }\n}\nimpl State for PendingReview {\n    fn request_review(self: Box<Self>) -> Box<dyn State> { self }\n    fn approve(self: Box<Self>) -> Box<dyn State> { Box::new(Published) }\n}\nimpl State for Published {\n    fn request_review(self: Box<Self>) -> Box<dyn State> { self }\n    fn approve(self: Box<Self>) -> Box<dyn State> { self }\n    fn content<'a>(&self, post: &'a Post) -> &'a str { &post.content }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn workflow() {\n        let mut p = Post::new();\n        p.add_text(\"hello\");\n        assert_eq!(p.content(), \"\");\n        p.request_review();\n        assert_eq!(p.content(), \"\");\n        p.approve();\n        assert_eq!(p.content(), \"hello\");\n    }\n}","explain":"self Box<Self> lets a state consume itself and return the next one. Option plus take is the standard trick for moving a value out of a field you only have &mut access to."},"18.3b":{"lang":"rust","hints":["Add a struct HalfApprovedPost { content: String }.","PendingReviewPost::approve returns HalfApprovedPost; HalfApprovedPost::approve returns Post.","Add a reject method on both that returns a DraftPost."],"solution":"pub struct Post { content: String }\npub struct DraftPost { content: String }\npub struct PendingReviewPost { content: String }\npub struct HalfApprovedPost { content: String }\n\nimpl Post {\n    pub fn new() -> DraftPost { DraftPost { content: String::new() } }\n    pub fn content(&self) -> &str { &self.content }\n}\nimpl DraftPost {\n    pub fn add_text(&mut self, t: &str) { self.content.push_str(t); }\n    pub fn request_review(self) -> PendingReviewPost { PendingReviewPost { content: self.content } }\n}\nimpl PendingReviewPost {\n    pub fn approve(self) -> HalfApprovedPost { HalfApprovedPost { content: self.content } }\n    pub fn reject(self) -> DraftPost { DraftPost { content: self.content } }\n}\nimpl HalfApprovedPost {\n    pub fn approve(self) -> Post { Post { content: self.content } }\n    pub fn reject(self) -> DraftPost { DraftPost { content: self.content } }\n}\n\nfn main() {\n    let mut d = Post::new();\n    d.add_text(\"Two reviewers agree\");\n    let published = d.request_review().approve().approve();\n    println!(\"{}\", published.content());\n    // d.request_review().approve().content(); // error: no method `content` on HalfApprovedPost\n}","explain":"The compiler now enforces the two-approval rule, so no test can ever find a post published with one approval. This is a powerful technique for workflows in regulated domains such as medtech, where a skipped step is a serious defect."}}},"19.1":{"example":{"title":"Patterns everywhere","lang":"rust","note":"A pattern that can fail to match, such as Some(x), is refutable; one that always matches, such as a plain name or a tuple of names, is irrefutable. let, for and parameters need irrefutable patterns, since there is nothing sensible to do on failure.","code":"fn print_coordinates(&(x, y): &(i32, i32)) {   // pattern in a parameter\n    println!(\"Current location: ({x}, {y})\");\n}\n\nfn main() {\n    let (a, b, c) = (1, 2, 3);                   // let with a tuple pattern\n    println!(\"{a} {b} {c}\");\n\n    let mut stack = vec![1, 2, 3];\n    while let Some(top) = stack.pop() {          // while let\n        print!(\"{top} \");\n    }\n    println!();\n\n    for (index, value) in ['a', 'b'].iter().enumerate() {  // for\n        println!(\"{value} is at index {index}\");\n    }\n\n    print_coordinates(&(3, 5));\n\n    let maybe: Option<i32> = None;\n    // let Some(x) = maybe;   // error: refutable pattern in local binding\n    let Some(x) = maybe else {\n        println!(\"nothing there\");\n        return;\n    };\n    println!(\"{x}\");\n}","output":"1 2 3\n3 2 1\na is at index 0\nb is at index 1\nCurrent location: (3, 5)\nnothing there"},"exercises":{"19.1a":{"lang":"rust","hints":["The pattern goes where the parameter name usually is.","The formula is ((x2 - x1).powi(2) + (y2 - y1).powi(2)).sqrt().","Loop with for w in points.windows(2) and call distance(&w[0], &w[1])."],"solution":"fn distance(&(x1, y1): &(f64, f64), &(x2, y2): &(f64, f64)) -> f64 {\n    ((x2 - x1).powi(2) + (y2 - y1).powi(2)).sqrt()\n}\n\nfn main() {\n    let route = [(0.0, 0.0), (3.0, 4.0), (6.0, 8.0)];\n    let mut total = 0.0;\n    for w in route.windows(2) {\n        total += distance(&w[0], &w[1]);\n    }\n    println!(\"route length {total}\");\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn three_four_five() {\n        assert_eq!(distance(&(0.0, 0.0), &(3.0, 4.0)), 5.0);\n    }\n}","explain":"windows(2) yields overlapping pairs of neighbours, perfect for routes and time series. The pattern in the parameter saves a line of let destructuring in the body."},"19.1b":{"lang":"rust","hints":["use std::collections::VecDeque;","Represent a task as a (name, depth) tuple and add a child while depth < 2.","Destructure in the pattern, while let Some((name, depth)) = ..."],"solution":"use std::collections::VecDeque;\n\nfn main() {\n    let mut queue = VecDeque::from([(\"root\".to_string(), 0)]);\n    let mut order = Vec::new();\n    while let Some((name, depth)) = queue.pop_front() {\n        if depth < 2 {\n            queue.push_back((format!(\"{name}.a\"), depth + 1));\n            queue.push_back((format!(\"{name}.b\"), depth + 1));\n        }\n        order.push(name);\n    }\n    println!(\"{order:?}\");\n}","explain":"This is a breadth-first traversal. The loop ends naturally when pop_front returns None, with no index or counter to get wrong."}}},"19.2":{"example":{"title":"The whole pattern toolbox","lang":"rust","note":"A match guard (if ...) adds a condition the pattern itself cannot express; the compiler does not count guarded arms toward exhaustiveness. @ binds a name while also testing the value against a pattern. .. ignores the rest of a struct or tuple, and _ ignores a single value without binding it.","code":"struct Point { x: i32, y: i32 }\n\nenum Message {\n    Hello { id: i32 },\n    Move { x: i32, y: i32 },\n    Color(u8, u8, u8),\n}\n\nfn classify(n: i32) -> &'static str {\n    match n {\n        i32::MIN..=-1 => \"negative\",\n        0 => \"zero\",\n        1 | 2 | 3 => \"small\",\n        x if x % 2 == 0 => \"even and big\",\n        _ => \"odd and big\",\n    }\n}\n\nfn main() {\n    let p = Point { x: 0, y: 7 };\n    match p {\n        Point { x: 0, y } => println!(\"on the y axis at {y}\"),\n        Point { x, y: 0 } => println!(\"on the x axis at {x}\"),\n        Point { x, y } => println!(\"at ({x}, {y})\"),\n    }\n\n    for msg in [Message::Hello { id: 5 }, Message::Hello { id: 42 }, Message::Move { x: 1, y: 2 }, Message::Color(0, 160, 255)] {\n        match msg {\n            Message::Hello { id: id_var @ 3..=7 } => println!(\"id in range: {id_var}\"),\n            Message::Hello { id } => println!(\"other id: {id}\"),\n            Message::Move { x, .. } => println!(\"move to x = {x}\"),\n            Message::Color(r, _, b) => println!(\"red {r}, blue {b}\"),\n        }\n    }\n\n    let numbers = (2, 4, 8, 16, 32);\n    let (first, .., last) = numbers;\n    println!(\"{first} {last} {} {} {}\", classify(-5), classify(2), classify(10));\n}","output":"on the y axis at 7\nid in range: 5\nother id: 42\nmove to x = 1\nred 0, blue 255\n2 32 negative small even and big"},"exercises":{"19.2a":{"lang":"rust","hints":["Put the specific codes before the ranges that contain them.","c @ 201..=299 => format!(\"success {c}\")","The last arm _ handles everything else."],"solution":"fn describe(code: u16) -> String {\n    match code {\n        200 => \"OK\".to_string(),\n        c @ 201..=299 => format!(\"success {c}\"),\n        301 | 302 => \"redirect\".to_string(),\n        300..=399 => \"other redirect\".to_string(),\n        404 => \"not found\".to_string(),\n        400..=499 => \"client error\".to_string(),\n        c @ 500..=599 => format!(\"server error {c}\"),\n        _ => \"unknown\".to_string(),\n    }\n}\n\nfn main() {\n    for c in [200, 204, 302, 307, 404, 418, 503, 999] {\n        println!(\"{c}: {}\", describe(c));\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn classes() {\n        assert_eq!(describe(204), \"success 204\");\n        assert_eq!(describe(418), \"client error\");\n        assert_eq!(describe(503), \"server error 503\");\n        assert_eq!(describe(42), \"unknown\");\n    }\n}","explain":"Ordering matters, because 404 also falls in 400..=499. The compiler warns about unreachable arms if you put a broad range before a specific value, a free bug check."},"19.2b":{"lang":"rust","hints":["Shape::Circle { center: (0, 0), .. } => true","Shape::Line((0, 0), _) | Shape::Line(_, (0, 0)) => true","Everything else is false."],"solution":"enum Shape {\n    Circle { center: (i32, i32), r: u32 },\n    Line((i32, i32), (i32, i32)),\n}\n\nfn touches_origin(s: &Shape) -> bool {\n    match s {\n        Shape::Circle { center: (0, 0), .. } => true,\n        Shape::Line((0, 0), _) | Shape::Line(_, (0, 0)) => true,\n        _ => false,\n    }\n}\n\nfn main() {\n    let shapes = [\n        Shape::Circle { center: (0, 0), r: 3 },\n        Shape::Circle { center: (1, 1), r: 3 },\n        Shape::Line((5, 5), (0, 0)),\n    ];\n    for s in &shapes {\n        println!(\"{}\", touches_origin(s));\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn nested() {\n        assert!(touches_origin(&Shape::Line((0, 0), (9, 9))));\n        assert!(!touches_origin(&Shape::Circle { center: (0, 1), r: 1 }));\n    }\n}","explain":"Matching on &Shape works without writing & in the patterns thanks to default binding modes, a convenience the book calls match ergonomics."}}},"19.3":{"example":{"title":"Slices, let chains and matches!","lang":"rust","note":"rest @ .. binds the middle or tail of a slice as a sub-slice. Let chains, stable since Rust 1.88 in the 2024 edition, replace deeply nested if let blocks. matches! turns a pattern into a bool.","code":"fn describe(xs: &[i32]) -> String {\n    match xs {\n        [] => \"empty\".into(),\n        [x] => format!(\"one item: {x}\"),\n        [first, .., last] if first == last => format!(\"starts and ends with {first}\"),\n        [first, rest @ ..] => format!(\"{first} then {} more\", rest.len()),\n    }\n}\n\nfn main() {\n    for xs in [&[][..], &[7], &[1, 2, 1], &[4, 5, 6, 7]] {\n        println!(\"{}\", describe(xs));\n    }\n\n    let input = Some(\"42\");\n    if let Some(s) = input && let Ok(n) = s.parse::<i32>() && n > 10 {\n        println!(\"got a big number: {n}\");\n    }\n\n    let c = 'q';\n    println!(\"{}\", matches!(c, 'a'..='z' | 'A'..='Z'));\n}","output":"empty\none item: 7\nstarts and ends with 1\n4 then 3 more\ngot a big number: 42\ntrue"},"exercises":{"19.3a":{"lang":"rust","hints":["let words: Vec<&str> = line.split_whitespace().collect(); match words.as_slice() { ... }","[\"add\", item] => Ok(Command::Add(item.to_string()))","[] => Err(\"empty command\".into()), and [other, ..] => Err(format!(\"unknown command {other}\"))."],"solution":"#[derive(Debug, PartialEq)]\nenum Command {\n    Add(String),\n    Remove(String),\n    List,\n    Rename(String, String),\n}\n\nfn parse(line: &str) -> Result<Command, String> {\n    let words: Vec<&str> = line.split_whitespace().collect();\n    match words.as_slice() {\n        [\"add\", item] => Ok(Command::Add(item.to_string())),\n        [\"remove\", item] => Ok(Command::Remove(item.to_string())),\n        [\"list\"] => Ok(Command::List),\n        [\"rename\", old, new] => Ok(Command::Rename(old.to_string(), new.to_string())),\n        [] => Err(\"empty command\".into()),\n        [cmd @ (\"add\" | \"remove\" | \"rename\" | \"list\"), ..] => Err(format!(\"wrong number of arguments for {cmd}\")),\n        [other, ..] => Err(format!(\"unknown command {other}\")),\n    }\n}\n\nfn main() {\n    for l in [\"add milk\", \"list\", \"rename milk oat-milk\", \"add\", \"fly away\"] {\n        println!(\"{l:?} -> {:?}\", parse(l));\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn parses() {\n        assert_eq!(parse(\"add milk\"), Ok(Command::Add(\"milk\".into())));\n        assert_eq!(parse(\"rename a b\"), Ok(Command::Rename(\"a\".into(), \"b\".into())));\n        assert!(parse(\"add\").unwrap_err().contains(\"wrong number\"));\n        assert!(parse(\"jump\").unwrap_err().contains(\"unknown\"));\n    }\n}","explain":"Each arm documents one command's exact shape, so the parser reads like its own specification. The cmd @ (... | ...) arm gives a better error than \"unknown\" when the command exists but the arguments are wrong."},"19.3b":{"lang":"rust","hints":["Join the conditions with && after each let.","The final plain condition can go in the same chain.","Requires edition 2024, which new Cargo projects use."],"solution":"struct User {\n    email: Option<String>,\n}\n\nfn find(id: u32) -> Option<User> {\n    (id == 1).then(|| User { email: Some(\"kev@example.com\".into()) })\n}\n\nfn notify(email: &str) {\n    println!(\"notifying {email}\");\n}\n\nfn main() {\n    let id = 1;\n    if let Some(user) = find(id)\n        && let Some(email) = user.email\n        && email.ends_with(\"@example.com\")\n    {\n        notify(&email);\n    }\n}","explain":"Three levels of nesting become one condition. Names bound earlier in the chain, such as user, are available in the later conditions and in the body."}}},"20.1":{"example":{"title":"A safe wrapper around unsafe code","lang":"rust","note":"Inside unsafe you may dereference raw pointers, call unsafe functions, access mutable statics, implement unsafe traits and access union fields. The borrow checker still runs; unsafe only means you, not the compiler, are guaranteeing these operations are valid. Wrapping them in a safe function with a SAFETY comment keeps the risky part tiny and reviewable.","code":"use std::slice;\n\n/// Splits a slice into two mutable halves at `mid`.\nfn split_at_mut(values: &mut [i32], mid: usize) -> (&mut [i32], &mut [i32]) {\n    let len = values.len();\n    let ptr = values.as_mut_ptr();\n    assert!(mid <= len);\n    // SAFETY: the two ranges [0, mid) and [mid, len) do not overlap\n    // and both lie inside the original slice.\n    unsafe {\n        (\n            slice::from_raw_parts_mut(ptr, mid),\n            slice::from_raw_parts_mut(ptr.add(mid), len - mid),\n        )\n    }\n}\n\nunsafe extern \"C\" {\n    safe fn abs(input: i32) -> i32;   // a C library function we promise is safe to call\n}\n\nfn main() {\n    let mut v = vec![1, 2, 3, 4, 5, 6];\n    let (a, b) = split_at_mut(&mut v, 3);\n    a[0] = 10;\n    b[0] = 40;\n    println!(\"{v:?}\");\n\n    let x = 5;\n    let r = &raw const x;                 // creating a raw pointer is safe\n    unsafe { println!(\"r points to {}\", *r); } // dereferencing is not\n    println!(\"abs(-3) according to C: {}\", abs(-3));\n}","output":"[10, 2, 3, 40, 5, 6]\nr points to 5\nabs(-3) according to C: 3"},"exercises":{"20.1a":{"lang":"rust","hints":["Get the pointers with v.as_mut_ptr() and ptr.add(v.len() - 1).","std::ptr::swap(a, b) is unsafe because it trusts the pointers.","The safe slice method v.swap(0, v.len() - 1) does the same; compare your result with it in the test."],"solution":"fn swap_ends(v: &mut [i32]) {\n    if v.len() < 2 {\n        return;\n    }\n    let p = v.as_mut_ptr();\n    // SAFETY: len >= 2, so index 0 and len - 1 are both valid,\n    // distinct elements of this exclusively borrowed slice.\n    unsafe {\n        std::ptr::swap(p, p.add(v.len() - 1));\n    }\n}\n\nfn main() {\n    let mut v = [1, 2, 3, 4];\n    swap_ends(&mut v);\n    println!(\"{v:?}\");\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn matches_safe_version() {\n        let mut a = [5, 6, 7];\n        let mut b = a;\n        swap_ends(&mut a);\n        b.swap(0, 2);\n        assert_eq!(a, b);\n        let mut one = [9];\n        swap_ends(&mut one);\n        assert_eq!(one, [9]);\n    }\n}","explain":"The length check is what makes the unsafe block sound; without it an empty slice would compute an invalid pointer. In real code you would just call v.swap, the point is to practise writing a sound safe wrapper. Running tests under cargo miri test checks unsafe code for undefined behaviour."},"20.1b":{"lang":"rust","hints":["static CALLS: AtomicUsize = AtomicUsize::new(0);","CALLS.fetch_add(1, Ordering::Relaxed) increments it without unsafe.","static mut needs unsafe for every access and is a data race waiting to happen with threads."],"solution":"use std::sync::atomic::{AtomicUsize, Ordering};\n\nstatic CALLS: AtomicUsize = AtomicUsize::new(0);\n\nfn tracked() {\n    CALLS.fetch_add(1, Ordering::Relaxed);\n}\n\nfn main() {\n    for _ in 0..5 {\n        tracked();\n    }\n    println!(\"tracked() was called {} times\", CALLS.load(Ordering::Relaxed));\n    // static mut COUNT: usize would need `unsafe` on every read and\n    // write, and two threads updating it at once is undefined\n    // behaviour. Atomics make the same thing safe and thread-safe.\n}","explain":"Most uses of mutable global state are better served by atomics, a Mutex in a static (std::sync::LazyLock or OnceLock), or passing state explicitly. Rust 2024 makes references to static mut a hard error to discourage it further."}}},"20.2":{"example":{"title":"Add for Point, supertraits and newtype","lang":"rust","note":"Iterator uses an associated type (type Item) because a type has exactly one item type; a generic parameter would let one type implement the trait many times. The newtype Wrapper gets around the orphan rule at zero cost. When names clash, Trait::method(&value) picks the trait's version.","code":"use std::fmt;\nuse std::ops::Add;\n\n#[derive(Debug, Copy, Clone, PartialEq)]\nstruct Point { x: i32, y: i32 }\n\nimpl Add for Point {\n    type Output = Point;\n    fn add(self, other: Point) -> Point {\n        Point { x: self.x + other.x, y: self.y + other.y }\n    }\n}\n\ntrait OutlinePrint: fmt::Display {      // supertrait: requires Display\n    fn outline_print(&self) {\n        let s = self.to_string();\n        println!(\"{}\", \"*\".repeat(s.len() + 4));\n        println!(\"* {s} *\");\n        println!(\"{}\", \"*\".repeat(s.len() + 4));\n    }\n}\n\nimpl fmt::Display for Point {\n    fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result { write!(f, \"({}, {})\", self.x, self.y) }\n}\nimpl OutlinePrint for Point {}\n\nstruct Wrapper(Vec<String>);           // newtype around an outside type\nimpl fmt::Display for Wrapper {\n    fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result { write!(f, \"[{}]\", self.0.join(\", \")) }\n}\n\ntrait Pilot { fn fly(&self) -> &'static str; }\nstruct Human;\nimpl Pilot for Human { fn fly(&self) -> &'static str { \"This is your captain speaking.\" } }\nimpl Human { fn fly(&self) -> &'static str { \"*waving arms furiously*\" } }\n\nfn main() {\n    let p = Point { x: 1, y: 0 } + Point { x: 2, y: 3 };\n    p.outline_print();\n    println!(\"{}\", Wrapper(vec![\"hello\".into(), \"world\".into()]));\n    let h = Human;\n    println!(\"{} / {}\", h.fly(), Pilot::fly(&h));\n}","output":"**********\n* (3, 3) *\n**********\n[hello, world]\n*waving arms furiously* / This is your captain speaking."},"exercises":{"20.2a":{"lang":"rust","hints":["impl Mul<i64> for Money { type Output = Money; fn mul(self, n: i64) -> Money { Money(self.0 * n) } }","Derive Debug, Clone, Copy and PartialEq for easy testing.","Display divides by 100 for dollars and uses {:02} for cents."],"solution":"use std::fmt;\nuse std::ops::{Add, Mul, Sub};\n\n#[derive(Debug, Clone, Copy, PartialEq)]\nstruct Money(i64);\n\nimpl Add for Money {\n    type Output = Money;\n    fn add(self, o: Money) -> Money { Money(self.0 + o.0) }\n}\nimpl Sub for Money {\n    type Output = Money;\n    fn sub(self, o: Money) -> Money { Money(self.0 - o.0) }\n}\nimpl Mul<i64> for Money {\n    type Output = Money;\n    fn mul(self, n: i64) -> Money { Money(self.0 *
