- id: a4
  n: A04
  t: Error handling design
  lv: 3
  goal: Design error types that callers can act on, use thiserror in libraries and anyhow in applications, and add context to failures.
  res: |
    std::error::Error | https://doc.rust-lang.org/std/error/trait.Error.html
    thiserror | https://docs.rs/thiserror
    anyhow | https://docs.rs/anyhow
  items:
    - id: A4.1
      t: Custom error types by hand
      min: 60
      learn: An error enum with one variant per failure, implementing Display and std::error::Error, From conversions so ? works, and exposing the underlying cause with source.
      example:
        title: A config loader with its own error type
        code: |
          use std::{error::Error, fmt, fs, io, num::ParseIntError};

          #[derive(Debug)]
          enum ConfigError {
              Io(io::Error),
              MissingKey(&'static str),
              BadPort(ParseIntError),
          }

          impl fmt::Display for ConfigError {
              fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {
                  match self {
                      ConfigError::Io(_) => write!(f, "could not read the config file"),
                      ConfigError::MissingKey(k) => write!(f, "missing key `{k}`"),
                      ConfigError::BadPort(_) => write!(f, "port is not a number"),
                  }
              }
          }

          impl Error for ConfigError {
              fn source(&self) -> Option<&(dyn Error + 'static)> {
                  match self {
                      ConfigError::Io(e) => Some(e),
                      ConfigError::BadPort(e) => Some(e),
                      ConfigError::MissingKey(_) => None,
                  }
              }
          }

          impl From<io::Error> for ConfigError {
              fn from(e: io::Error) -> Self { ConfigError::Io(e) }
          }
          impl From<ParseIntError> for ConfigError {
              fn from(e: ParseIntError) -> Self { ConfigError::BadPort(e) }
          }

          fn load_port(path: &str) -> Result<u16, ConfigError> {
              let text = fs::read_to_string(path)?;          // io::Error -> ConfigError
              let line = text.lines().find(|l| l.starts_with("port="))
                  .ok_or(ConfigError::MissingKey("port"))?;
              Ok(line["port=".len()..].trim().parse()?)       // ParseIntError -> ConfigError
          }

          fn main() {
              fs::write("app.cfg", "port=80x\n").unwrap();
              match load_port("app.cfg") {
                  Ok(p) => println!("port {p}"),
                  Err(e) => println!("error: {e} (cause: {})", e.source().map(|s| s.to_string()).unwrap_or_default()),
              }
              fs::remove_file("app.cfg").unwrap();
          }
        output: |
          error: port is not a number (cause: invalid digit found in string)
        note: Callers can match on the variant to decide what to do, Display gives a human message, and source chains to the lower-level cause without repeating it. The From impls are what let ? convert automatically.
      ex:
        - t: A bank transfer error
          p: Create enum TransferError { InsufficientFunds { needed u64, available u64 }, AccountNotFound(String), SameAccount } with Display and Error, and a transfer function that returns it. Test that callers can match on InsufficientFunds and read the amounts.
          check: test
          hints:
            - Struct-like variants carry named data.
            - Display should produce a sentence like "need 50, have 20".
            - An empty impl std::error::Error for TransferError {} is enough when there is no source.
          solution: |
            use std::collections::HashMap;
            use std::fmt;

            #[derive(Debug, PartialEq)]
            enum TransferError {
                InsufficientFunds { needed: u64, available: u64 },
                AccountNotFound(String),
                SameAccount,
            }

            impl fmt::Display for TransferError {
                fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {
                    match self {
                        TransferError::InsufficientFunds { needed, available } => write!(f, "need {needed}, have {available}"),
                        TransferError::AccountNotFound(id) => write!(f, "no account {id}"),
                        TransferError::SameAccount => write!(f, "cannot transfer to the same account"),
                    }
                }
            }

            impl std::error::Error for TransferError {}

            fn transfer(accts: &mut HashMap<String, u64>, from: &str, to: &str, amount: u64) -> Result<(), TransferError> {
                if from == to {
                    return Err(TransferError::SameAccount);
                }
                if !accts.contains_key(to) {
                    return Err(TransferError::AccountNotFound(to.into()));
                }
                let bal = *accts.get(from).ok_or_else(|| TransferError::AccountNotFound(from.into()))?;
                if bal < amount {
                    return Err(TransferError::InsufficientFunds { needed: amount, available: bal });
                }
                *accts.get_mut(from).unwrap() -= amount;
                *accts.get_mut(to).unwrap() += amount;
                Ok(())
            }

            fn main() {
                let mut a = HashMap::from([("kev".to_string(), 20), ("sam".to_string(), 0)]);
                if let Err(e) = transfer(&mut a, "kev", "sam", 50) {
                    println!("refused: {e}");
                }
            }

            #[cfg(test)]
            mod tests {
                use super::*;
                #[test]
                fn caller_can_read_amounts() {
                    let mut a = HashMap::from([("a".to_string(), 5), ("b".to_string(), 0)]);
                    match transfer(&mut a, "a", "b", 9) {
                        Err(TransferError::InsufficientFunds { needed, available }) => assert_eq!((needed, available), (9, 5)),
                        other => panic!("unexpected {other:?}"),
                    }
                }
            }
          explain: A UI can turn InsufficientFunds into "top up 30 dollars" because the numbers are data, not text buried in a message. That is the main advantage of typed errors over strings.
        - t: Walk the error chain
          p: Write fn report(e &dyn std::error::Error) -> String that prints an error and every source below it, one per line with "caused by", and use it on the ConfigError from the example.
          check: test
          hints:
            - Start with e.to_string(), then loop with let mut cur = e.source();
            - "while let Some(s) = cur { ...; cur = s.source(); }"
            - Join the lines with newlines.
          solution: |
            use std::error::Error;
            use std::fmt;

            #[derive(Debug)]
            struct Outer(std::num::ParseIntError);
            impl fmt::Display for Outer {
                fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {
                    write!(f, "invalid configuration")
                }
            }
            impl Error for Outer {
                fn source(&self) -> Option<&(dyn Error + 'static)> {
                    Some(&self.0)
                }
            }

            fn report(e: &dyn Error) -> String {
                let mut lines = vec![e.to_string()];
                let mut cur = e.source();
                while let Some(s) = cur {
                    lines.push(format!("  caused by: {s}"));
                    cur = s.source();
                }
                lines.join("\n")
            }

            fn main() {
                let err = Outer("x1".parse::<u16>().unwrap_err());
                println!("{}", report(&err));
            }

            #[cfg(test)]
            mod tests {
                use super::*;
                #[test]
                fn two_levels() {
                    let r = report(&Outer("z".parse::<u8>().unwrap_err()));
                    assert!(r.starts_with("invalid configuration\n  caused by:"));
                }
            }
          explain: Printing the whole chain gives users and logs both the high-level story and the root cause. anyhow does exactly this with {:#} or {:?}, which the next lessons use.
    - id: A4.2
      t: thiserror for libraries
      min: 45
      learn: Derive Display, Error and From with thiserror, transparent wrapping, and why libraries should expose typed errors rather than anyhow.
      example:
        title: The config error with thiserror
        deps: ['thiserror = "2"']
        code: |
          use std::{fs, io, num::ParseIntError};
          use thiserror::Error;

          #[derive(Debug, Error)]
          pub enum ConfigError {
              #[error("could not read the config file")]
              Io(#[from] io::Error),
              #[error("missing key `{0}`")]
              MissingKey(&'static str),
              #[error("port is not a number")]
              BadPort(#[from] ParseIntError),
          }

          pub fn load_port(path: &str) -> Result<u16, ConfigError> {
              let text = fs::read_to_string(path)?;
              let line = text.lines().find(|l| l.starts_with("port=")).ok_or(ConfigError::MissingKey("port"))?;
              Ok(line["port=".len()..].trim().parse()?)
          }

          fn main() {
              println!("{}", load_port("does-not-exist.cfg").unwrap_err());
          }
        output: |
          could not read the config file
        note: 'The derive writes the Display, Error, source and From code from the previous lesson. #[from] both converts with ? and sets source. Libraries should return concrete error types like this so callers can match on them.'
      ex:
        - t: Convert your error to thiserror
          p: Rewrite the TransferError from A4.1 with thiserror attributes, keeping the same messages and tests.
          deps: ['thiserror = "2"']
          check: test
          hints:
            - "#[error(\"need {needed}, have {available}\")] works with named fields."
            - "#[error(\"no account {0}\")] refers to the first tuple field."
            - Remove the manual Display and Error impls.
          solution: |
            use thiserror::Error;

            #[derive(Debug, Error, PartialEq)]
            pub enum TransferError {
                #[error("need {needed}, have {available}")]
                InsufficientFunds { needed: u64, available: u64 },
                #[error("no account {0}")]
                AccountNotFound(String),
                #[error("cannot transfer to the same account")]
                SameAccount,
            }

            fn main() {
                println!("{}", TransferError::InsufficientFunds { needed: 50, available: 20 });
            }

            #[cfg(test)]
            mod tests {
                use super::*;
                #[test]
                fn messages() {
                    assert_eq!(TransferError::AccountNotFound("x".into()).to_string(), "no account x");
                    assert_eq!(TransferError::InsufficientFunds { needed: 2, available: 1 }.to_string(), "need 2, have 1");
                }
            }
          explain: Thirty lines of boilerplate become attributes, and the behaviour is identical. thiserror adds nothing to your public API; callers just see a normal error enum.
        - t: Wrap a lower layer
          p: 'Build a two-layer library, a storage module with StorageError (thiserror) and a service module with ServiceError that wraps it with #[from], plus a NotAuthorized variant. Show that ? converts storage errors in service code.'
          deps: ['thiserror = "2"']
          check: test
          hints:
            - "ServiceError::Storage(#[from] StorageError)"
            - The service function calls a storage function with ? directly.
            - Test that the source of a ServiceError::Storage is the StorageError.
          solution: |
            use std::error::Error as _;
            use thiserror::Error;

            mod storage {
                use super::Error;
                #[derive(Debug, Error)]
                pub enum StorageError {
                    #[error("record {0} not found")]
                    NotFound(u32),
                }
                pub fn load(id: u32) -> Result<String, StorageError> {
                    if id == 1 { Ok("Kev".into()) } else { Err(StorageError::NotFound(id)) }
                }
            }

            #[derive(Debug, Error)]
            pub enum ServiceError {
                #[error("storage failure")]
                Storage(#[from] storage::StorageError),
                #[error("not authorised")]
                NotAuthorized,
            }

            pub fn profile(id: u32, admin: bool) -> Result<String, ServiceError> {
                if !admin {
                    return Err(ServiceError::NotAuthorized);
                }
                let name = storage::load(id)?;
                Ok(format!("profile of {name}"))
            }

            fn main() {
                println!("{:?}", profile(1, true));
                println!("{}", profile(7, true).unwrap_err());
            }

            #[cfg(test)]
            mod tests {
                use super::*;
                #[test]
                fn wraps_source() {
                    let e = profile(9, true).unwrap_err();
                    assert_eq!(e.to_string(), "storage failure");
                    assert_eq!(e.source().unwrap().to_string(), "record 9 not found");
                }
            }
          explain: Each layer describes failures in its own terms while keeping the lower cause reachable through source. This layering is what large Rust services do.
    - id: A4.3
      t: anyhow for applications
      min: 45
      learn: Use anyhow::Result in binaries, add context to errors with .context and .with_context, create ad-hoc errors with anyhow! and bail!, and print the full chain.
      example:
        title: An application main with context
        deps: ['anyhow = "1"']
        code: |
          use anyhow::{bail, Context, Result};
          use std::fs;

          fn read_threshold(path: &str) -> Result<u32> {
              let text = fs::read_to_string(path)
                  .with_context(|| format!("reading threshold file {path}"))?;
              let n: u32 = text.trim().parse().context("threshold must be a whole number")?;
              if n > 100 {
                  bail!("threshold {n} is above 100");
              }
              Ok(n)
          }

          fn main() -> Result<()> {
              fs::write("threshold.txt", "abc")?;
              if let Err(e) = read_threshold("threshold.txt") {
                  println!("{e:#}");      // the whole chain on one line
              }
              fs::write("threshold.txt", "250")?;
              println!("{}", read_threshold("threshold.txt").unwrap_err());
              fs::remove_file("threshold.txt")?;
              Ok(())
          }
        output: |
          threshold must be a whole number: invalid digit found in string
          threshold 250 is above 100
        note: anyhow::Error holds any error plus a chain of context messages, which is ideal at the top of an application where you mostly report errors. Use thiserror for libraries so callers can match, and anyhow in binaries where you just need good messages.
      ex:
        - t: Context everywhere
          p: Write an app function that reads a list of file paths from a manifest file and returns their total size in bytes, adding context to every fallible step so a failure names the exact file.
          deps: ['anyhow = "1"']
          check: test
          hints:
            - "fs::metadata(path).with_context(|| format!(\"checking {path}\"))?.len()"
            - Skip blank lines in the manifest.
            - In a test, list a missing file and check the error text contains its name.
          solution: |
            use anyhow::{Context, Result};
            use std::fs;

            fn total_size(manifest: &str) -> Result<u64> {
                let list = fs::read_to_string(manifest).with_context(|| format!("reading manifest {manifest}"))?;
                let mut total = 0;
                for path in list.lines().map(str::trim).filter(|l| !l.is_empty()) {
                    total += fs::metadata(path).with_context(|| format!("checking {path}"))?.len();
                }
                Ok(total)
            }

            fn main() -> Result<()> {
                fs::write("a.txt", "hello")?;
                fs::write("manifest.txt", "a.txt\n")?;
                println!("{} bytes", total_size("manifest.txt")?);
                fs::remove_file("a.txt")?;
                fs::remove_file("manifest.txt")?;
                Ok(())
            }

            #[cfg(test)]
            mod tests {
                use super::*;
                #[test]
                fn names_missing_file() {
                    let dir = std::env::temp_dir();
                    let m = dir.join("anyhow_manifest_test.txt");
                    std::fs::write(&m, "definitely_missing_file.bin\n").unwrap();
                    let err = format!("{:#}", total_size(m.to_str().unwrap()).unwrap_err());
                    assert!(err.contains("definitely_missing_file.bin"), "{err}");
                }
            }
          explain: with_context takes a closure, so the format! only runs when there is an error. A good error message answers "what were you trying to do" and "what went wrong"; context supplies the first part.
        - t: Downcast when you must
          p: Return an anyhow::Error from a function that can fail with either an io::Error or your own ValidationError, then in main use downcast_ref to print a special message for ValidationError only.
          deps: ['anyhow = "1"', 'thiserror = "2"']
          check: test
          hints:
            - "#[derive(Debug, thiserror::Error)] #[error(\"invalid: {0}\")] struct ValidationError(String);"
            - Return Err(ValidationError(...).into()) or use ? on it.
            - "if let Some(v) = err.downcast_ref::<ValidationError>() { ... }"
          solution: |
            use anyhow::Result;
            use thiserror::Error;

            #[derive(Debug, Error)]
            #[error("invalid: {0}")]
            struct ValidationError(String);

            fn check(name: &str) -> Result<()> {
                if name.is_empty() {
                    return Err(ValidationError("name is empty".into()).into());
                }
                std::fs::metadata(name)?; // may produce an io::Error
                Ok(())
            }

            fn main() {
                for n in ["", "no-such-file"] {
                    let err = check(n).unwrap_err();
                    match err.downcast_ref::<ValidationError>() {
                        Some(v) => println!("user mistake: {v}"),
                        None => println!("system problem: {err}"),
                    }
                }
            }

            #[cfg(test)]
            mod tests {
                use super::*;
                #[test]
                fn downcasts() {
                    assert!(check("").unwrap_err().downcast_ref::<ValidationError>().is_some());
                    assert!(check("missing.x").unwrap_err().downcast_ref::<ValidationError>().is_none());
                }
            }
          explain: Downcasting recovers the concrete type when an application genuinely needs to react differently. If you find yourself downcasting often, a typed error enum is probably the better design.
  quiz:
    - q: What does implementing From<io::Error> for your error type enable?
      o: |
        Using ? on io results inside functions returning your error type
        Printing the error
        Cloning the error
        Nothing useful
      a: 0
      x: '? calls From::from on the error.'
    - q: When should a library prefer thiserror over anyhow?
      o: |
        When callers need to match on specific error cases
        Always in binaries
        When errors should be strings
        Never
      a: 0
      x: anyhow erases the type; thiserror keeps a matchable enum.
    - q: What does {:#} print for an anyhow::Error?
      o: |
        The error with its whole chain of causes on one line
        Only the root cause
        A backtrace
        The Debug format
      a: 0
      x: The alternate format joins the context chain with colons.
    - q: What is the purpose of Error::source?
      o: |
        To expose the lower-level error that caused this one
        To print the file name
        To convert the error to a String
        To retry the operation
      a: 0
      x: It forms the error chain.
      pool: exam
    - q: Which are good practices for error messages?
      type: multi
      o: |
        Say what was being attempted
        Include the identifying data such as a file name
        Repeat the cause's message inside Display when source already returns it
        Start with lowercase and no trailing period, the Rust convention
      a: [0, 1, 3]
      x: Repeating the cause duplicates text when the chain is printed.
      pool: exam
    - q: What does bail!("x") do in a function returning anyhow::Result?
      o: |
        Returns early with an error built from the message
        Panics
        Logs and continues
        Exits the process
      a: 0
      x: It is shorthand for return Err(anyhow!("x")).
      pool: exam
  recap:
    summary:
      - Model failures as an enum with one variant per case so callers can match and act.
      - Implement Display for humans, Error with source for the cause chain, and From so ? converts.
      - thiserror derives all of that and suits libraries.
      - anyhow suits applications, adding context and printing whole chains; downcast when you must.
    functions: |
      impl std::error::Error for E || Make a type a standard error.
      fn source(&self) || Return the underlying cause.
      #[derive(thiserror::Error)] #[error("...")] || Derive Display and Error.
      #[from] || Derive From and set the source.
      anyhow::Result<T> || A Result with a catch-all error type.
      .context("msg") / .with_context(|| ...) || Add what you were doing.
      bail!("msg") || Return early with an error.
      err.downcast_ref::<T>() || Recover a concrete error type.
    next: A05 deepens traits and generics, including type-level programming.
