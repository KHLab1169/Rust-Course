- id: a3
  n: A03
  t: Ownership, memory and lifetimes in depth
  lv: 4
  goal: Reason precisely about where data lives, use borrowing patterns that keep the borrow checker happy, and read complex lifetime signatures.
  res: |
    The Rustonomicon, ownership | https://doc.rust-lang.org/nomicon/ownership.html
    Common Rust lifetime misconceptions | https://github.com/pretzelhammer/rust-blog/blob/master/posts/common-rust-lifetime-misconceptions.md
    std::borrow::Cow | https://doc.rust-lang.org/std/borrow/enum.Cow.html
  items:
    - id: A3.1
      t: The stack, the heap and moves
      min: 45
      learn: What lives on the stack and what on the heap, the size of common types, what a move physically does, and how to measure it with size_of.
      example:
        title: Measuring types
        code: |
          use std::mem::size_of;

          #[allow(dead_code)]
          enum Shape { Circle(f64), Rect(f64, f64) }

          fn main() {
              println!("u8 {}  u64 {}  char {}", size_of::<u8>(), size_of::<u64>(), size_of::<char>());
              println!("&str {}  String {}  Vec<u8> {}", size_of::<&str>(), size_of::<String>(), size_of::<Vec<u8>>());
              println!("Box<u64> {}  Option<Box<u64>> {}", size_of::<Box<u64>>(), size_of::<Option<Box<u64>>>());
              println!("Shape {}  Option<u32> {}", size_of::<Shape>(), size_of::<Option<u32>>());
          }
        output: |
          u8 1  u64 8  char 4
          &str 16  String 24  Vec<u8> 24
          Box<u64> 8  Option<Box<u64>> 8
          Shape 24  Option<u32> 8
        note: A String is three words on the stack (pointer, length, capacity) pointing to heap bytes, so moving it copies 24 bytes, never the text. Option<Box<T>> is the same size as Box<T> because a box is never null, so None can use the null value (the niche optimisation). Sizes here are for 64-bit targets.
      ex:
        - t: Predict the sizes
          p: "Before running, predict size_of for (u8, u32), [u16; 5], Option<&i32>, Result<u32, u8> and a struct { a: u8, b: u64, c: u8 }. Then check, and explain any surprise."
          hints:
            - Fields are aligned to their size, which adds padding.
            - Rust may reorder struct fields to reduce padding.
            - References are never null, so Option<&T> has a niche.
          solution: |
            use std::mem::size_of;

            #[allow(dead_code)]
            struct S { a: u8, b: u64, c: u8 }

            fn main() {
                println!("(u8, u32): {}", size_of::<(u8, u32)>());           // 8: padding after u8
                println!("[u16; 5]: {}", size_of::<[u16; 5]>());             // 10
                println!("Option<&i32>: {}", size_of::<Option<&i32>>());     // 8: niche
                println!("Result<u32, u8>: {}", size_of::<Result<u32, u8>>()); // 8
                println!("S: {}", size_of::<S>());                           // 16: fields reordered
            }
          explain: 'A C compiler would make S 24 bytes because it keeps field order; Rust reorders to b, a, c and needs only 16. Use #[repr(C)] when you need a fixed layout, for example for FFI.'
        - t: Cheap moves, expensive clones
          p: Time moving a Vec of ten million u64 into a function versus cloning it, in a release build, and explain the difference.
          check: build
          hints:
            - "let v: Vec<u64> = (0..10_000_000).collect();"
            - A function taking Vec<u64> by value receives a move.
            - Use std::hint::black_box so the optimiser keeps the work.
          solution: |
            use std::hint::black_box;
            use std::time::Instant;

            fn consume(v: Vec<u64>) -> usize {
                black_box(v.len())
            }

            fn main() {
                let v: Vec<u64> = (0..10_000_000).collect();
                let t = Instant::now();
                let c = v.clone();
                println!("clone: {:?}", t.elapsed());
                let t = Instant::now();
                let n = consume(v);
                println!("move:  {:?} ({n} items)", t.elapsed());
                black_box(c);
            }
          explain: The clone copies 80 MB of heap data, while the move copies three machine words. That is why Rust APIs pass ownership freely and why reaching for clone everywhere has a real cost.
    - id: A3.2
      t: Borrowing patterns that work
      min: 60
      learn: Split borrows of struct fields, getting values out of &mut with mem::take and mem::replace, avoiding clones with Cow, and restructuring code when the borrow checker objects.
      example:
        title: take, replace and Cow
        code: |
          use std::borrow::Cow;
          use std::mem;

          struct Buffer { lines: Vec<String>, flushed: usize }

          impl Buffer {
              fn flush(&mut self) -> Vec<String> {
                  self.flushed += self.lines.len();     // split borrow: two different fields
                  mem::take(&mut self.lines)            // move out, leave an empty Vec behind
              }
          }

          fn normalize(input: &str) -> Cow<'_, str> {
              if input.contains('\t') {
                  Cow::Owned(input.replace('\t', "    "))   // allocate only when needed
              } else {
                  Cow::Borrowed(input)
              }
          }

          fn main() {
              let mut b = Buffer { lines: vec!["a".into(), "b".into()], flushed: 0 };
              let out = b.flush();
              println!("{out:?}, buffer now {:?}, flushed {}", b.lines, b.flushed);

              let mut state = String::from("draft");
              let old = mem::replace(&mut state, String::from("published"));
              println!("{old} -> {state}");

              for s in ["no tabs", "one\ttab"] {
                  let n = normalize(s);
                  println!("{n:?} owned={}", matches!(n, Cow::Owned(_)));
              }
          }
        output: |
          ["a", "b"], buffer now [], flushed 2
          draft -> published
          "no tabs" owned=false
          "one    tab" owned=true
        note: The borrow checker tracks fields separately inside one function, so borrowing two fields at once is fine. mem::take swaps in the Default value, which lets you move a field out through &mut self. Cow (clone on write) returns borrowed data when nothing changes and owned data only when it must.
      ex:
        - t: Drain a buffer without cloning
          p: Write a Logger struct with a Vec<String> of pending lines and a method drain_to(&mut self, sink &mut Vec<String>) that moves every line into the sink without cloning.
          check: test
          hints:
            - sink.append(&mut self.pending) moves all elements in one call.
            - Or use sink.extend(mem::take(&mut self.pending)).
            - Afterwards pending should be empty.
          solution: |
            struct Logger {
                pending: Vec<String>,
            }

            impl Logger {
                fn log(&mut self, msg: &str) {
                    self.pending.push(msg.to_string());
                }
                fn drain_to(&mut self, sink: &mut Vec<String>) {
                    sink.append(&mut self.pending);
                }
            }

            fn main() {
                let mut l = Logger { pending: vec![] };
                l.log("start");
                l.log("done");
                let mut file = Vec::new();
                l.drain_to(&mut file);
                println!("{file:?} {}", l.pending.len());
            }

            #[cfg(test)]
            mod tests {
                use super::*;
                #[test]
                fn moves_all() {
                    let mut l = Logger { pending: vec!["x".into()] };
                    let mut s = vec!["old".to_string()];
                    l.drain_to(&mut s);
                    assert_eq!(s, vec!["old", "x"]);
                    assert!(l.pending.is_empty());
                }
            }
          explain: append moves the Strings' three-word headers, not their text, and reuses the sink's buffer. Both String vectors stay valid the whole time, so there is nothing for the borrow checker to complain about.
        - t: Escape HTML only when needed
          p: Write escape_html(s &str) -> Cow<str> that returns the input borrowed when it contains none of < > & " and an owned escaped String otherwise. Test both paths.
          check: test
          hints:
            - "Check first with s.contains(|c| matches!(c, '<' | '>' | '&' | '\"'))."
            - Build the escaped string char by char into a String with capacity s.len().
            - In tests, use matches!(result, Cow::Borrowed(_)).
          solution: |
            use std::borrow::Cow;

            fn escape_html(s: &str) -> Cow<'_, str> {
                if !s.contains(|c| matches!(c, '<' | '>' | '&' | '"')) {
                    return Cow::Borrowed(s);
                }
                let mut out = String::with_capacity(s.len() + 8);
                for c in s.chars() {
                    match c {
                        '<' => out.push_str("&lt;"),
                        '>' => out.push_str("&gt;"),
                        '&' => out.push_str("&amp;"),
                        '"' => out.push_str("&quot;"),
                        _ => out.push(c),
                    }
                }
                Cow::Owned(out)
            }

            fn main() {
                println!("{}", escape_html("plain text"));
                println!("{}", escape_html("<b>\"bold\" & brave</b>"));
            }

            #[cfg(test)]
            mod tests {
                use super::*;
                #[test]
                fn borrows_when_clean() {
                    assert!(matches!(escape_html("hello"), Cow::Borrowed(_)));
                    assert_eq!(escape_html("a<b"), "a&lt;b");
                }
            }
          explain: Most strings need no escaping, so Cow avoids an allocation on the common path. Callers can treat the result like a &str thanks to Deref, and call into_owned only when they need a String.
    - id: A3.3
      t: Lifetimes in depth
      min: 60
      learn: Explicit lifetime annotations on structs and impls, the elision rules applied by hand, T 'static bounds and what they really mean, several lifetimes in one signature, and an intuition for variance.
      example:
        title: Two lifetimes and a 'static bound
        code: |
          use std::fmt::Debug;
          use std::thread;

          struct Parser<'src> { text: &'src str, pos: usize }

          impl<'src> Parser<'src> {
              // The returned token borrows from the source text, not from the parser
              fn next_token(&mut self) -> Option<&'src str> {
                  let rest = &self.text[self.pos..];
                  let rest_trim = rest.trim_start();
                  if rest_trim.is_empty() { return None; }
                  let start = self.pos + (rest.len() - rest_trim.len());
                  let end = rest_trim.find(' ').map(|i| start + i).unwrap_or(self.text.len());
                  self.pos = end;
                  Some(&self.text[start..end])
              }
          }

          // Owned data satisfies 'static: it contains no short-lived references
          fn log_later<T: Debug + Send + 'static>(value: T) -> thread::JoinHandle<()> {
              thread::spawn(move || println!("later: {value:?}"))
          }

          fn main() {
              let src = String::from("let x = 42");
              let first;
              {
                  let mut p = Parser { text: &src, pos: 0 };
                  first = p.next_token();
                  println!("{:?}", p.next_token());
              } // the parser is gone, but first still points into src
              println!("{first:?}");
              log_later(vec![1, 2, 3]).join().unwrap();
              log_later(String::from("owned strings are 'static")).join().unwrap();
          }
        output: |
          Some("x")
          Some("let")
          later: [1, 2, 3]
          later: "owned strings are 'static"
        note: "T: 'static does not mean the value lives forever; it means the type holds no references that could expire, so owned types like String and Vec qualify. Naming the lifetime 'src on the return type, instead of letting elision tie it to &mut self, is what lets tokens outlive the parser."
      ex:
        - t: Fix the elision trap
          p: "This method fails to let the result outlive the borrow of self: fn get(&self, key: &str) -> &str on a struct Config<'a> { raw: &'a str } that returns a slice of raw. Fix the signature and show the caller using the result after the Config is dropped."
          check: test
          hints:
            - Elision ties the output to &self.
            - "Write fn get(&self, key: &str) -> Option<&'a str> to tie it to raw instead."
            - In a test, create the Config in an inner block and use the result outside.
          solution: |
            struct Config<'a> {
                raw: &'a str,
            }

            impl<'a> Config<'a> {
                fn get(&self, key: &str) -> Option<&'a str> {
                    self.raw.lines().find_map(|line| {
                        let (k, v) = line.split_once('=')?;
                        (k.trim() == key).then(|| v.trim())
                    })
                }
            }

            fn main() {
                let text = String::from("host = localhost\nport = 8080");
                let port;
                {
                    let cfg = Config { raw: &text };
                    port = cfg.get("port");
                }
                println!("{port:?}");
            }

            #[cfg(test)]
            mod tests {
                use super::*;
                #[test]
                fn outlives_config() {
                    let text = String::from("a=1");
                    let v = { Config { raw: &text }.get("a") };
                    assert_eq!(v, Some("1"));
                }
            }
          explain: "With elision, the output would get the lifetime of &self, so it could not outlive cfg. Naming 'a states the truth: the value points into the original text. find_map with ? inside a closure is a tidy way to search and parse at once."
        - t: Owned or borrowed for threads
          p: "Write fn spawn_all(names: &[&str]) -> Vec<JoinHandle<usize>> that starts a thread per name returning its length. Explain why passing the &str straight into thread::spawn fails, and fix it by moving owned Strings into the threads."
          check: test
          hints:
            - "thread::spawn needs F: 'static, and a &str borrowed from the caller is not."
            - Convert with let owned = name.to_string(); before spawning.
            - Collect the handles and join them in the test.
          solution: |
            use std::thread::{self, JoinHandle};

            fn spawn_all(names: &[&str]) -> Vec<JoinHandle<usize>> {
                names
                    .iter()
                    .map(|name| {
                        let owned = name.to_string(); // 'static: owns its data
                        thread::spawn(move || owned.len())
                    })
                    .collect()
            }

            fn main() {
                let hs = spawn_all(&["ada", "grace"]);
                let lens: Vec<usize> = hs.into_iter().map(|h| h.join().unwrap()).collect();
                println!("{lens:?}");
            }

            #[cfg(test)]
            mod tests {
                use super::*;
                #[test]
                fn lengths() {
                    let lens: Vec<usize> = spawn_all(&["a", "bcd"]).into_iter().map(|h| h.join().unwrap()).collect();
                    assert_eq!(lens, vec![1, 3]);
                }
            }
          explain: "The borrowed &str might be gone by the time the thread runs, so the 'static bound rejects it. Owning the data (or using thread::scope, which waits) are the two standard fixes."
  quiz:
    - q: How many bytes does a String take on the stack on a 64-bit target?
      o: |
        "24: pointer, length and capacity"
        "8"
        The length of the text
        "16"
      a: 0
      x: The text itself lives on the heap.
    - q: What does std::mem::take(&mut v) do for a Vec?
      o: |
        Moves the Vec out and leaves an empty one in its place
        Clones the Vec
        Drops the Vec
        Borrows the Vec mutably
      a: 0
      x: It swaps in Default::default().
    - q: "What does T: 'static mean for a type?"
      o: |
        It contains no references that could expire
        Every value of T lives until the program ends
        T is a constant
        T is stored in static memory
      a: 0
      x: Owned types such as String and Vec are 'static.
    - q: Why is Option<Box<T>> the same size as Box<T>?
      o: |
        A Box is never null, so None can be represented by the null pointer
        Option is free for every type
        The compiler removes Option
        Box is two words
      a: 0
      x: This is called the niche optimisation.
      pool: exam
    - q: When does Cow<str> allocate?
      o: |
        Only when it holds the Owned variant, created when the data had to change
        Always
        Never
        When it is printed
      a: 0
      x: The Borrowed variant just wraps a reference.
      pool: exam
    - q: Which compile inside one method of a struct with fields a and b?
      type: multi
      o: |
        "let x = &mut self.a; let y = &self.b; (both used)"
        "let x = &mut self.a; let y = &self.a; (both used)"
        "let x = &self.a; let y = &self.b; (both used)"
        "let x = &mut self.a; let y = &mut self.b; (both used)"
      a: [0, 2, 3]
      x: Different fields can be borrowed independently; the same field cannot be borrowed mutably twice or mixed.
      pool: exam
  recap:
    summary:
      - Stack values have a size known at compile time; heap data is reached through pointers such as Box, String and Vec.
      - Moves copy only the stack part; clones copy the heap data too.
      - The niche optimisation makes Option of a non-null pointer free.
      - Split borrows, mem::take and mem::replace, append and Cow solve most "cannot borrow" situations without clones.
      - "Name lifetimes when the output borrows from a struct's data rather than from self; T: 'static means no short-lived references."
    functions: |
      std::mem::size_of::<T>() || The size of a type in bytes.
      std::mem::take(&mut x) || Move out, leaving the default value.
      std::mem::replace(&mut x, new) || Swap in a new value, returning the old.
      vec.append(&mut other) || Move every element across.
      Cow::Borrowed / Cow::Owned || Borrow when possible, own when necessary.
      "T: 'static" || A type with no expiring references.
