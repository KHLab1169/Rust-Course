    - id: "16.1"
      t: Threads
      min: 45
      learn: Start threads with thread::spawn, wait for them with join, move data into a thread with a move closure, and borrow local data safely with scoped threads.
      example:
        title: spawn, join, move and scope
        code: |
          use std::thread;
          use std::time::Duration;

          fn main() {
              let handle = thread::spawn(|| {
                  for i in 1..4 {
                      println!("hi number {i} from the spawned thread!");
                      thread::sleep(Duration::from_millis(1));
                  }
              });
              handle.join().unwrap();             // wait for it to finish

              let v = vec![1, 2, 3];
              let h = thread::spawn(move || {     // v moves into the thread
                  println!("vector: {v:?}");
                  v.len()
              });
              println!("thread returned {}", h.join().unwrap());

              let mut data = vec![1, 2, 3, 4];
              thread::scope(|s| {                  // scoped threads may borrow
                  let (left, right) = data.split_at_mut(2);
                  s.spawn(|| left.iter_mut().for_each(|x| *x *= 10));
                  s.spawn(|| right.iter_mut().for_each(|x| *x += 1));
              });
              println!("{data:?}");
          }
        output: |
          hi number 1 from the spawned thread!
          hi number 2 from the spawned thread!
          hi number 3 from the spawned thread!
          vector: [1, 2, 3]
          thread returned 3
          [10, 20, 4, 5]
        note: A spawned thread might outlive the function that started it, so it cannot borrow local variables; move gives it ownership instead. thread::scope guarantees every thread ends before the scope does, so borrowing is allowed there. When main returns, any threads still running are stopped.
      ex:
        - t: Parallel sum
          p: Split a Vec of the numbers 1 to 1,000,000 into four chunks and sum each chunk on its own scoped thread. Add the four results and check them against the formula n(n+1)/2.
          check: test
          hints:
            - "data.chunks(data.len() / 4) gives four slices."
            - Inside thread::scope, collect the handles from s.spawn into a Vec.
            - Each handle's join() returns that chunk's sum.
          solution: |
            use std::thread;

            fn parallel_sum(data: &[u64], parts: usize) -> u64 {
                let size = data.len().div_ceil(parts).max(1);
                thread::scope(|s| {
                    let handles: Vec<_> = data
                        .chunks(size)
                        .map(|chunk| s.spawn(move || chunk.iter().sum::<u64>()))
                        .collect();
                    handles.into_iter().map(|h| h.join().unwrap()).sum()
                })
            }

            fn main() {
                let data: Vec<u64> = (1..=1_000_000).collect();
                let n = data.len() as u64;
                println!("{} (expected {})", parallel_sum(&data, 4), n * (n + 1) / 2);
            }

            #[cfg(test)]
            mod tests {
                use super::*;
                #[test]
                fn matches_formula() {
                    let d: Vec<u64> = (1..=1000).collect();
                    assert_eq!(parallel_sum(&d, 4), 500500);
                    assert_eq!(parallel_sum(&d, 3), 500500);
                }
            }
          explain: The threads only borrow the chunks, which is safe because scope waits for them all. div_ceil makes sure no numbers are left over when the length does not divide evenly. For real data-parallel work, the rayon crate does this splitting for you.
        - t: Return values from threads
          p: Spawn five threads with thread::spawn that each compute the square of their index after sleeping a little, collect the JoinHandles, and print the results in index order.
          hints:
            - "Each closure needs move so it owns its i."
            - Store handles in a Vec<thread::JoinHandle<u64>>.
            - Joining in order gives results in order, regardless of which finished first.
          solution: |
            use std::thread;
            use std::time::Duration;

            fn main() {
                let handles: Vec<thread::JoinHandle<u64>> = (0..5u64)
                    .map(|i| {
                        thread::spawn(move || {
                            thread::sleep(Duration::from_millis(50 - i * 10));
                            i * i
                        })
                    })
                    .collect();
                let results: Vec<u64> = handles.into_iter().map(|h| h.join().unwrap()).collect();
                println!("{results:?}");
            }
          explain: Later threads sleep less so they finish first, but joining in order still produces [0, 1, 4, 9, 16]. join returns Err if the thread panicked, which is why unwrap is needed.
    - id: "16.2"
      t: Message passing with channels
      min: 45
      learn: Create a channel with mpsc::channel, send values from producer threads, receive with recv or by iterating, ownership moving through send, and cloning the sender for several producers.
      example:
        title: Several producers, one consumer
        code: |
          use std::sync::mpsc;
          use std::thread;
          use std::time::Duration;

          fn main() {
              let (tx, rx) = mpsc::channel();
              let tx2 = tx.clone();

              thread::spawn(move || {
                  for word in ["hi", "from", "the", "thread"] {
                      tx.send(format!("A: {word}")).unwrap();
                      thread::sleep(Duration::from_millis(5));
                  }
              });
              thread::spawn(move || {
                  for word in ["more", "messages"] {
                      tx2.send(format!("B: {word}")).unwrap();
                      thread::sleep(Duration::from_millis(5));
                  }
              });

              let mut got: Vec<String> = rx.iter().collect(); // ends when all senders drop
              got.sort();
              println!("{got:?}");
          }
        output: |
          ["A: from", "A: hi", "A: the", "A: thread", "B: messages", "B: more"]
        note: send moves the value into the channel, so the sending thread cannot use it afterwards; the compiler enforces this. The receiver's iterator ends when every sender has been dropped, which is a simple way to know all work is finished. The order between producers is not guaranteed, which is why the example sorts.
      ex:
        - t: A worker pipeline
          p: Spawn three worker threads that each receive the same job description and send back a (worker_id, result) tuple through one channel. The main thread prints all results once all workers finish.
          hints:
            - Clone tx once per worker inside a loop.
            - Drop the original tx in main, or the receiving loop never ends.
            - for (id, r) in rx { ... } collects results as they arrive.
          solution: |
            use std::sync::mpsc;
            use std::thread;

            fn main() {
                let (tx, rx) = mpsc::channel();
                for id in 1..=3u32 {
                    let tx = tx.clone();
                    thread::spawn(move || {
                        let result: u32 = (1..=id * 100).sum();
                        tx.send((id, result)).unwrap();
                    });
                }
                drop(tx); // otherwise rx waits forever for this sender
                let mut results: Vec<(u32, u32)> = rx.iter().collect();
                results.sort();
                for (id, r) in results {
                    println!("worker {id}: {r}");
                }
            }
          explain: Forgetting drop(tx) is the most common channel bug, the program simply hangs. Channels are the core of the worker pool you will build in Chapter 21.
        - t: A bounded queue
          p: Use mpsc::sync_channel(2) so a fast producer has to wait for a slow consumer. Print when each item is sent and received to see the back-pressure.
          check: build
          hints:
            - sync_channel(2) holds at most two unreceived messages.
            - send blocks when the buffer is full.
            - Make the consumer sleep 50 ms per item and the producer not sleep at all.
          solution: |
            use std::sync::mpsc;
            use std::thread;
            use std::time::Duration;

            fn main() {
                let (tx, rx) = mpsc::sync_channel(2);
                let producer = thread::spawn(move || {
                    for i in 1..=6 {
                        tx.send(i).unwrap(); // blocks while two items are waiting
                        println!("sent {i}");
                    }
                });
                for item in rx {
                    thread::sleep(Duration::from_millis(50));
                    println!("  received {item}");
                }
                producer.join().unwrap();
            }
          explain: Back-pressure stops a fast producer from filling memory when the consumer cannot keep up, the same idea as a bounded queue in a load-testing tool. An unbounded channel would let the producer race ahead.
    - id: "16.3"
      t: Shared state with Mutex and Arc
      min: 60
      learn: Lock a Mutex to get a guard, the guard unlocking on drop, why Rc does not work across threads, sharing with Arc, and deadlocks to watch out for.
      example:
        title: Ten threads, one counter
        code: |
          use std::sync::{Arc, Mutex};
          use std::thread;

          fn main() {
              let counter = Arc::new(Mutex::new(0));
              let mut handles = vec![];
              for _ in 0..10 {
                  let counter = Arc::clone(&counter);
                  handles.push(thread::spawn(move || {
                      let mut num = counter.lock().unwrap();  // MutexGuard
                      *num += 1;
                  }));                                         // guard dropped: unlocked
              }
              for h in handles {
                  h.join().unwrap();
              }
              println!("Result: {}", *counter.lock().unwrap());
          }
        output: |
          Result: 10
        note: Arc is the thread-safe version of Rc, using atomic operations for its count. lock returns a Result because a thread that panicked while holding the lock leaves it poisoned. Keep lock scopes short, and always take several locks in the same order to avoid deadlocks.
      ex:
        - t: A shared inventory
          p: Store a HashMap<String, u32> of stock in Arc<Mutex<...>>. Spawn four threads that each sell items, reducing the stock but never below zero, and print the final stock.
          check: test
          hints:
            - "fn sell(stock: &Mutex<HashMap<String, u32>>, item: &str) -> bool"
            - "Inside, let mut s = stock.lock().unwrap(); then check and decrement."
            - Use get_mut to change a value in place.
          solution: |
            use std::collections::HashMap;
            use std::sync::{Arc, Mutex};
            use std::thread;

            fn sell(stock: &Mutex<HashMap<String, u32>>, item: &str) -> bool {
                let mut s = stock.lock().unwrap();
                match s.get_mut(item) {
                    Some(n) if *n > 0 => {
                        *n -= 1;
                        true
                    }
                    _ => false,
                }
            }

            fn main() {
                let stock = Arc::new(Mutex::new(HashMap::from([("apple".to_string(), 5), ("pear".to_string(), 2)])));
                let handles: Vec<_> = (0..4)
                    .map(|_| {
                        let stock = Arc::clone(&stock);
                        thread::spawn(move || (0..3).filter(|_| sell(&stock, "apple")).count())
                    })
                    .collect();
                let sold: usize = handles.into_iter().map(|h| h.join().unwrap()).sum();
                println!("sold {sold} apples, stock now {:?}", stock.lock().unwrap());
            }

            #[cfg(test)]
            mod tests {
                use super::*;
                #[test]
                fn never_below_zero() {
                    let s = Mutex::new(HashMap::from([("x".to_string(), 1)]));
                    assert!(sell(&s, "x"));
                    assert!(!sell(&s, "x"));
                    assert!(!sell(&s, "missing"));
                }
            }
          explain: Twelve attempts but only five apples, and the check-and-decrement happens while holding the lock, so two threads can never both sell the last apple. That race is exactly the kind of bug QA finds in systems without such guarantees.
        - t: Spot the deadlock
          p: Write two threads that lock Mutex A then B, and B then A, with a short sleep in between, and see the program hang. Fix it by making both threads lock in the same order.
          check: build
          hints:
            - "Thread 1: let _a = a.lock(); sleep; let _b = b.lock();"
            - "Thread 2 does the same but with b first."
            - The fix is to make both threads take a first, then b.
          solution: |
            use std::sync::{Arc, Mutex};
            use std::thread;
            use std::time::Duration;

            fn main() {
                let a = Arc::new(Mutex::new(0));
                let b = Arc::new(Mutex::new(0));

                // Fixed version: both threads lock a, then b.
                // (Locking b then a in the second thread can deadlock.)
                let (a1, b1) = (Arc::clone(&a), Arc::clone(&b));
                let t1 = thread::spawn(move || {
                    let mut x = a1.lock().unwrap();
                    thread::sleep(Duration::from_millis(10));
                    let mut y = b1.lock().unwrap();
                    *x += 1;
                    *y += 1;
                });
                let (a2, b2) = (Arc::clone(&a), Arc::clone(&b));
                let t2 = thread::spawn(move || {
                    let mut x = a2.lock().unwrap();
                    thread::sleep(Duration::from_millis(10));
                    let mut y = b2.lock().unwrap();
                    *x += 10;
                    *y += 10;
                });
                t1.join().unwrap();
                t2.join().unwrap();
                println!("a = {}, b = {}", a.lock().unwrap(), b.lock().unwrap());
            }
          explain: Rust prevents data races, but not deadlocks, which are a logic problem. A consistent lock order is the standard cure; holding a single lock around both values is often even simpler.
    - id: "16.4"
      t: Send and Sync
      min: 30
      learn: What the Send and Sync marker traits mean, why Rc and RefCell are neither, how the compiler uses them to reject unsafe sharing, and why you rarely implement them yourself.
      example:
        title: The compiler refusing Rc across threads
        check: fail
        code: |
          use std::rc::Rc;
          use std::thread;

          fn main() {
              let shared = Rc::new(5);
              let s = Rc::clone(&shared);
              // error[E0277]: `Rc<i32>` cannot be sent between threads safely
              let h = thread::spawn(move || println!("{s}"));
              h.join().unwrap();
          }
        output: |
          error[E0277]: `Rc<i32>` cannot be sent between threads safely
             = help: within `{closure}`, the trait `Send` is not implemented for `Rc<i32>`
        note: Send means ownership of a value can move to another thread; Sync means a shared reference can be used from several threads. Types made only of Send and Sync parts get the traits automatically. Rc's counter is not atomic, so the compiler stops it at the thread boundary; swap in Arc and it compiles.
      ex:
        - t: Make it compile
          p: Fix the example by switching to the thread-safe types, then extend it so two threads each add to a shared total stored inside.
          check: test
          hints:
            - Replace Rc with Arc.
            - To change the number, wrap it as Arc<Mutex<i32>>.
            - Clone the Arc once per thread.
          solution: |
            use std::sync::{Arc, Mutex};
            use std::thread;

            fn add_in_threads(start: i32) -> i32 {
                let shared = Arc::new(Mutex::new(start));
                let handles: Vec<_> = [5, 7]
                    .into_iter()
                    .map(|n| {
                        let s = Arc::clone(&shared);
                        thread::spawn(move || *s.lock().unwrap() += n)
                    })
                    .collect();
                for h in handles {
                    h.join().unwrap();
                }
                let total = *shared.lock().unwrap();
                total
            }

            fn main() {
                println!("{}", add_in_threads(5));
            }

            #[cfg(test)]
            mod tests {
                use super::*;
                #[test]
                fn adds() {
                    assert_eq!(add_in_threads(0), 12);
                }
            }
          explain: Arc gives shared ownership across threads (Send and Sync), and Mutex makes changing the value safe. The compiler error disappears because every type involved now carries the right marker traits.
        - t: Which are Send and Sync
          p: 'Write a function fn assert_send<T: Send>() {} and fn assert_sync<T: Sync>() {}, then call them for i32, String, Vec<u8>, Arc<Mutex<i32>>, Rc<i32> and Cell<i32>. Note which calls fail and why.'
          hints:
            - These empty generic functions compile only if T has the bound.
            - "Call them as assert_send::<String>();"
            - Comment out the ones that fail and write the reason next to each.
          solution: |
            use std::cell::Cell;
            use std::sync::{Arc, Mutex};

            fn assert_send<T: Send>() {}
            fn assert_sync<T: Sync>() {}

            fn main() {
                assert_send::<i32>();
                assert_sync::<i32>();
                assert_send::<String>();
                assert_sync::<String>();
                assert_send::<Vec<u8>>();
                assert_send::<Arc<Mutex<i32>>>();
                assert_sync::<Arc<Mutex<i32>>>();
                assert_send::<Cell<i32>>(); // Cell can move to another thread...
                // assert_sync::<Cell<i32>>(); // ...but not be shared: changes are not synchronised
                // assert_send::<std::rc::Rc<i32>>(); // Rc's count is not atomic
                println!("all remaining checks compiled");
            }
          explain: This trick of compile-time assertions with empty generic functions is common in library tests. Cell is Send but not Sync, which shows the two traits really are different questions.
  quiz:
    - q: Why does a closure passed to thread::spawn usually need move?
      o: |
        The thread may outlive the variables it would borrow
        Threads cannot read variables at all
        move makes the thread start faster
        It is required for join to work
      a: 0
      x: Ownership guarantees the data lives as long as the thread needs it.
    - q: When does iterating over a channel receiver end?
      o: |
        When every sender has been dropped
        After the first message
        After a timeout
        Never
      a: 0
      x: The channel closes when no senders remain.
    - q: What unlocks a Mutex in Rust?
      o: |
        Dropping the MutexGuard returned by lock
        Calling unlock
        The end of the program
        Calling join on the thread
      a: 0
      x: The guard unlocks in its Drop implementation.
    - q: Why can you not use Rc<T> with threads?
      o: |
        Its reference count is not updated atomically, so it is not Send
        It is too slow
        It can only hold integers
        Threads cannot hold pointers
      a: 0
      x: Arc uses atomic operations and is the thread-safe replacement.
    - q: What does thread::scope allow that thread::spawn does not?
      o: |
        Threads that borrow local variables without move
        Threads that run forever
        Threads without join
        More than 8 threads
      a: 0
      x: The scope waits for its threads, so borrows stay valid.
      pool: exam
    - q: Which can Rust's type system not prevent?
      type: multi
      o: |
        Deadlocks
        Data races
        Logic races such as checking then acting in two separate lock scopes
        Sending an Rc to another thread
      a: [0, 2]
      x: Data races and sending non-Send types are compile errors; deadlocks and logic races are design issues.
      pool: exam
    - q: What does it mean for a type to be Sync?
      o: |
        A shared reference to it can be used from several threads
        It can be sent to another thread
        It synchronises its own clocks
        It implements Mutex
      a: 0
      x: T is Sync if &T is Send.
      pool: exam
  recap:
    summary:
      - thread::spawn runs a closure on a new thread; join waits for it and returns its value.
      - move closures give threads ownership; thread::scope lets threads borrow because it waits for them.
      - Channels (mpsc) pass ownership of messages between threads; clone the sender for several producers.
      - Mutex<T> allows one thread at a time; the guard unlocks when dropped; Arc<T> shares it between threads.
      - Send and Sync mark what may cross or be shared between threads; the compiler enforces them.
      - Rust prevents data races at compile time, but deadlocks and logic races are still yours to avoid.
    functions: |
      thread::spawn(move || ...) || Start a thread.
      handle.join() || Wait for a thread and get its result.
      thread::scope(|s| s.spawn(...)) || Threads that can borrow local data.
      mpsc::channel() / sync_channel(n) || Unbounded or bounded channel.
      tx.send(v) / rx.recv() / for v in rx || Send and receive messages.
      Arc::new(Mutex::new(v)) || Shared, lockable data.
      m.lock().unwrap() || Lock and get a guard.
    next: Chapter 17 introduces async programming, a different way to handle many tasks at once without a thread per task.
