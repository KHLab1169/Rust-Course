- id: w3
  n: W3
  t: "lifewasm: Game of Life in WebAssembly"
  lv: 4
  goal: Implement Conway's Game of Life in Rust, compile it to WebAssembly, render it in the browser with a canvas, and deploy it as a live demo on GitHub Pages.
  res: |
    Rust and WebAssembly book (Game of Life tutorial) | https://rustwasm.github.io/docs/book/game-of-life/introduction.html
    wasm-bindgen | https://docs.rs/wasm-bindgen
    wasm-pack | https://rustwasm.github.io/wasm-pack/
  items:
    - id: W3.1
      t: Plan the simulation
      min: 45
      lv: 3
      kind: project
      learn: The rules of the Game of Life, representing the grid as a flat Vec with wrap-around edges, and splitting the work between Rust (simulation) and JavaScript (drawing and input).
      example:
        title: The rules in one function
        code: |
          #[derive(Clone, Copy, PartialEq, Debug)]
          pub enum Cell { Dead = 0, Alive = 1 }

          /// The next state of one cell given its current state and live neighbour count.
          pub fn next(cell: Cell, live_neighbours: u8) -> Cell {
              match (cell, live_neighbours) {
                  (Cell::Alive, n) if n < 2 => Cell::Dead,     // underpopulation
                  (Cell::Alive, 2) | (Cell::Alive, 3) => Cell::Alive,
                  (Cell::Alive, n) if n > 3 => Cell::Dead,     // overpopulation
                  (Cell::Dead, 3) => Cell::Alive,              // reproduction
                  (state, _) => state,
              }
          }

          fn main() {
              for n in 0..=4 {
                  println!("alive with {n}: {:?}, dead with {n}: {:?}", next(Cell::Alive, n), next(Cell::Dead, n));
              }
          }
        output: |
          alive with 0: Dead, dead with 0: Dead
          alive with 1: Dead, dead with 1: Dead
          alive with 2: Alive, dead with 2: Dead
          alive with 3: Alive, dead with 3: Alive
          alive with 4: Dead, dead with 4: Dead
        note: 'Four rules, one match. Keeping the rules in a pure function makes them trivial to test before any WebAssembly is involved. #[repr(u8)]-style values (0 and 1) let JavaScript read cells directly from WASM memory later.'
      ex:
        - t: Choose the boundary
          p: Decide between a wrapping (toroidal) grid and a fixed border where outside cells are dead, and write down the effect on a glider. Then write the neighbour-count function for your choice on a flat Vec with width and height.
          check: test
          hints:
            - The index of (row, col) in a flat grid is row * width + col.
            - "For wrapping, the row above row 0 is height - 1: (row + height - 1) % height."
            - Skip the cell itself when counting the 3 by 3 block.
          solution: |
            pub fn live_neighbours(cells: &[u8], width: usize, height: usize, row: usize, col: usize) -> u8 {
                let mut count = 0;
                for dr in [height - 1, 0, 1] {
                    for dc in [width - 1, 0, 1] {
                        if dr == 0 && dc == 0 {
                            continue;
                        }
                        let r = (row + dr) % height;
                        let c = (col + dc) % width;
                        count += cells[r * width + c];
                    }
                }
                count
            }

            #[cfg(test)]
            mod tests {
                use super::*;
                #[test]
                fn wraps_corners() {
                    // 3x3 grid with only the bottom-right cell alive
                    let cells = [0, 0, 0, 0, 0, 0, 0, 0, 1];
                    assert_eq!(live_neighbours(&cells, 3, 3, 0, 0), 1, "the top-left wraps to the bottom-right");
                    assert_eq!(live_neighbours(&cells, 3, 3, 2, 2), 0, "a cell does not count itself");
                }
            }
          explain: Wrapping lets gliders fly forever, which looks good in a demo, while a fixed border makes them die at the edge. Adding height - 1 instead of subtracting 1 avoids underflow on unsigned indexes, the same trick the official Rust and WebAssembly book uses.
        - t: Plan the browser side
          p: List what Rust exports to JavaScript and what JavaScript does, aiming to copy as little data as possible across the boundary each frame.
          lang: text
          check: none
          hints:
            - JavaScript can read WASM memory directly through a pointer to the cells buffer.
            - Rust owns the simulation; JS owns the canvas, timing and mouse clicks.
            - Copying the whole grid every frame works but scales poorly.
          solution: |
            Rust (wasm-bindgen exports):
              Universe::new(width, height)       random or patterned start
              tick()                             advance one generation
              toggle(row, col)                   flip a cell on click
              width(), height()
              cells_ptr() -> *const u8           pointer into WASM memory
            JavaScript:
              requestAnimationFrame loop: tick(), then draw from
              new Uint8Array(memory.buffer, cells_ptr(), width * height)
              canvas clicks -> toggle(row, col)
              buttons: play/pause, step, clear, speed slider
          explain: Reading cells straight from WASM memory avoids serialising the grid every frame, which is the main performance lesson of the official tutorial.
    - id: W3.2
      t: Build the universe
      min: 120
      kind: project
      learn: Implement a Universe struct with tick, toggle and pattern insertion, test it natively with known patterns (blinker, glider), then add wasm-bindgen exports.
      example:
        title: Testing patterns natively
        check: test
        code: |
          pub struct Universe { width: usize, height: usize, cells: Vec<u8> }

          impl Universe {
              pub fn from_pattern(width: usize, height: usize, live: &[(usize, usize)]) -> Self {
                  let mut cells = vec![0; width * height];
                  for &(r, c) in live { cells[r * width + c] = 1; }
                  Universe { width, height, cells }
              }

              fn neighbours(&self, row: usize, col: usize) -> u8 {
                  let (w, h) = (self.width, self.height);
                  let mut n = 0;
                  for dr in [h - 1, 0, 1] {
                      for dc in [w - 1, 0, 1] {
                          if dr == 0 && dc == 0 { continue; }
                          n += self.cells[((row + dr) % h) * w + (col + dc) % w];
                      }
                  }
                  n
              }

              pub fn tick(&mut self) {
                  let mut next = self.cells.clone();
                  for r in 0..self.height {
                      for c in 0..self.width {
                          let i = r * self.width + c;
                          next[i] = match (self.cells[i], self.neighbours(r, c)) {
                              (1, 2) | (1, 3) | (0, 3) => 1,
                              _ => 0,
                          };
                      }
                  }
                  self.cells = next;
              }

              pub fn live(&self) -> Vec<(usize, usize)> {
                  (0..self.cells.len()).filter(|&i| self.cells[i] == 1).map(|i| (i / self.width, i % self.width)).collect()
              }
          }

          #[cfg(test)]
          mod tests {
              use super::*;
              #[test]
              fn blinker_oscillates() {
                  let mut u = Universe::from_pattern(5, 5, &[(2, 1), (2, 2), (2, 3)]);
                  u.tick();
                  assert_eq!(u.live(), vec![(1, 2), (2, 2), (3, 2)]);
                  u.tick();
                  assert_eq!(u.live(), vec![(2, 1), (2, 2), (2, 3)]);
              }

              #[test]
              fn glider_moves_diagonally() {
                  let start = [(0, 1), (1, 2), (2, 0), (2, 1), (2, 2)];
                  let mut u = Universe::from_pattern(8, 8, &start);
                  for _ in 0..4 { u.tick(); }
                  let mut moved: Vec<_> = start.iter().map(|&(r, c)| (r + 1, c + 1)).collect();
                  moved.sort();
                  assert_eq!(u.live(), moved);
              }
          }
        note: Known patterns make perfect test oracles. A blinker returns to its start every two generations, and a glider reappears one cell down and right every four. These tests run natively in milliseconds, long before any browser is involved.
      ex:
        - t: Export it with wasm-bindgen
          p: 'Add #[wasm_bindgen] to Universe with a constructor that seeds a pseudo-random grid from a seed (no external RNG crate), plus tick, toggle, width, height and cells_ptr. Keep the native tests passing.'
          deps: ['wasm-bindgen = "0.2"']
          check: test
          hints:
            - A tiny xorshift generator from a u32 seed is enough for a random start.
            - cells_ptr returns self.cells.as_ptr().
            - Methods called from JavaScript must take and return simple types.
          solution: |
            use wasm_bindgen::prelude::*;

            #[wasm_bindgen]
            pub struct Universe { width: u32, height: u32, cells: Vec<u8> }

            fn xorshift(state: &mut u32) -> u32 {
                *state ^= *state << 13;
                *state ^= *state >> 17;
                *state ^= *state << 5;
                *state
            }

            #[wasm_bindgen]
            impl Universe {
                #[wasm_bindgen(constructor)]
                pub fn new(width: u32, height: u32, seed: u32) -> Universe {
                    let mut s = seed.max(1);
                    let cells = (0..width * height).map(|_| (xorshift(&mut s) % 4 == 0) as u8).collect();
                    Universe { width, height, cells }
                }
                pub fn width(&self) -> u32 { self.width }
                pub fn height(&self) -> u32 { self.height }
                pub fn cells_ptr(&self) -> *const u8 { self.cells.as_ptr() }
                pub fn toggle(&mut self, row: u32, col: u32) {
                    let i = (row * self.width + col) as usize;
                    self.cells[i] ^= 1;
                }
                pub fn tick(&mut self) {
                    let (w, h) = (self.width as usize, self.height as usize);
                    let old = &self.cells;
                    let next: Vec<u8> = (0..w * h)
                        .map(|i| {
                            let (r, c) = (i / w, i % w);
                            let mut n = 0;
                            for dr in [h - 1, 0, 1] {
                                for dc in [w - 1, 0, 1] {
                                    if dr != 0 || dc != 0 {
                                        n += old[((r + dr) % h) * w + (c + dc) % w];
                                    }
                                }
                            }
                            matches!((old[i], n), (1, 2) | (1, 3) | (0, 3)) as u8
                        })
                        .collect();
                    self.cells = next;
                }
            }

            #[cfg(test)]
            mod tests {
                use super::*;
                #[test]
                fn deterministic_seed_and_toggle() {
                    let a = Universe::new(16, 16, 42);
                    let b = Universe::new(16, 16, 42);
                    assert_eq!(a.cells, b.cells);
                    let mut u = Universe::new(4, 4, 7);
                    let before = u.cells[5];
                    u.toggle(1, 1);
                    assert_ne!(u.cells[5], before);
                }
            }
          explain: A seeded generator makes demos shareable ("try seed 42") and tests deterministic, and avoids pulling in a random crate that needs extra configuration for WebAssembly. The tests still run natively with cargo test.
        - t: Draw it in the browser
          p: Write index.html and a JavaScript module that loads the package, reads cells from WASM memory each frame, draws them on a canvas, toggles cells on click, and has play, pause and step buttons.
          lang: text
          check: none
          hints:
            - "import init, { Universe } from \"./pkg/lifewasm.js\"; const wasm = await init();"
            - new Uint8Array(wasm.memory.buffer, u.cells_ptr(), w * h) views the cells without copying.
            - Convert a click to a cell with Math.floor(y / size) and Math.floor(x / size).
          solution: |
            <canvas id="c"></canvas>
            <button id="play">Play</button> <button id="step">Step</button>
            <script type="module">
              import init, { Universe } from "./pkg/lifewasm.js";
              const wasm = await init();
              const size = 6, u = new Universe(96, 64, 42), w = u.width(), h = u.height();
              const canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
              canvas.width = w * size; canvas.height = h * size;
              let running = false;

              function draw() {
                const cells = new Uint8Array(wasm.memory.buffer, u.cells_ptr(), w * h);
                ctx.fillStyle = "#111"; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#e8834f";
                for (let i = 0; i < cells.length; i++) {
                  if (cells[i]) ctx.fillRect((i % w) * size, Math.floor(i / w) * size, size - 1, size - 1);
                }
              }
              function loop() { if (running) { u.tick(); draw(); requestAnimationFrame(loop); } }

              document.getElementById("play").onclick = (e) => {
                running = !running; e.target.textContent = running ? "Pause" : "Play"; loop();
              };
              document.getElementById("step").onclick = () => { u.tick(); draw(); };
              canvas.onclick = (e) => {
                const r = canvas.getBoundingClientRect();
                u.toggle(Math.floor((e.clientY - r.top) / size), Math.floor((e.clientX - r.left) / size));
                draw();
              };
              draw();
            </script>
          explain: Creating the Uint8Array view each frame matters, because WASM memory can grow and replace its buffer, which would leave an old view pointing at detached memory.
    - id: W3.3
      t: Ship it
      min: 75
      kind: project
      learn: Build with wasm-pack in release mode, measure and shrink the .wasm size, deploy to GitHub Pages with a workflow, and write a README with a live demo link and a GIF.
      example:
        title: Deploying to GitHub Pages
        lang: yaml
        check: none
        code: |
          # .github/workflows/pages.yml
          name: Deploy demo
          on:
            push:
              branches: [main]
          permissions:
            contents: read
            pages: write
            id-token: write
          jobs:
            deploy:
              runs-on: ubuntu-latest
              environment: github-pages
              steps:
                - uses: actions/checkout@v4
                - uses: dtolnay/rust-toolchain@stable
                  with:
                    targets: wasm32-unknown-unknown
                - run: cargo install wasm-pack
                - run: cargo test
                - run: wasm-pack build --release --target web --out-dir www/pkg
                - uses: actions/upload-pages-artifact@v3
                  with:
                    path: www
                - uses: actions/deploy-pages@v4
        note: Every push to main runs the native tests, builds the WebAssembly package and publishes the www folder, so the live demo always matches the code. A clickable demo link at the top of the README is the single most effective thing for a portfolio project.
      ex:
        - t: Shrink the binary
          p: Measure the .wasm size of a release build, then add opt-level = "z", lto = true and codegen-units = 1 to the release profile and run wasm-opt if available. Record before and after sizes.
          lang: toml
          check: none
          hints:
            - ls -l www/pkg/*.wasm shows the size.
            - wasm-pack runs wasm-opt automatically when it is installed.
            - Avoid formatting machinery (format!, panics with messages) in hot code if size matters.
          solution: |
            [profile.release]
            opt-level = "z"     # optimise for size
            lto = true
            codegen-units = 1
            panic = "abort"

            # before: lifewasm_bg.wasm  ~30 KB
            # after:  lifewasm_bg.wasm  ~15 KB (exact numbers vary)
          explain: Smaller WebAssembly loads faster, especially on phones. Optimising for size is often nearly free here because the simulation loop is tiny.
        - t: Write the README and CV bullets
          p: Write the README with a live demo link, a GIF of a glider gun, how it works (Rust simulation, JS canvas, zero-copy memory view), how to build locally, and the test strategy. Draft two CV bullets with the binary size and frame rate you measured.
          lang: text
          check: none
          hints:
            - Record a short screen capture and convert it to a GIF under 2 MB.
            - Measure frames per second with performance.now() in the loop.
            - Mention the pattern-based tests; they show engineering discipline beyond the visual demo.
          solution: |
            # lifewasm
            Conway's Game of Life in Rust, compiled to WebAssembly.
            **Live demo:** https://your-name.github.io/lifewasm

            ![glider gun](docs/glider-gun.gif)

            ## How it works
            The universe lives in Rust; each frame JavaScript calls tick() and
            draws straight from WASM memory through a Uint8Array view, so no
            data is copied across the boundary.

            ## Build
                cargo test
                wasm-pack build --release --target web --out-dir www/pkg
                python -m http.server -d www

            ## Tests
            Blinker and glider patterns are checked natively against their
            known periods.
          explain: A live demo plus a clear explanation of a real engineering choice (zero-copy memory access) gives interviewers something to try and something to ask about.
  recap:
    summary:
      - Keep simulation rules in pure Rust functions and test them natively with known patterns.
      - Represent the grid as a flat Vec and wrap edges with modular arithmetic that avoids underflow.
      - Export a small API with wasm-bindgen and let JavaScript read cells directly from WASM memory.
      - A seeded generator makes demos shareable and tests deterministic.
      - Build with wasm-pack, shrink with size-focused profiles, and deploy automatically to GitHub Pages.
    functions: |
      row * width + col || Index into a flat grid.
      (row + height - 1) % height || Wrap upwards without underflow.
      #[wasm_bindgen] impl Universe || Export a type to JavaScript.
      self.cells.as_ptr() || Hand JavaScript a pointer into WASM memory.
      new Uint8Array(memory.buffer, ptr, len) || Read WASM memory from JavaScript without copying.
      wasm-pack build --release --target web || Build the browser package.
    explore:
      - Add a pattern library (glider gun, pulsar) loaded from RLE text files.
      - Only redraw cells that changed between generations.
    repo: lifewasm
    cv:
      - Built lifewasm, Conway's Game of Life in Rust compiled to WebAssembly ([X] KB), rendering [N] cells at 60 fps through zero-copy access to WASM memory.
      - Set up CI that runs pattern-based tests and deploys the live demo to GitHub Pages on every push.
    next: You have finished all three tracks. Keep your repositories polished, and consider contributing a fix to an open-source Rust crate you used along the way.
