- id: w1
  n: W1
  t: "taskhub: a JSON API with axum and SQLite"
  lv: 4
  goal: Build a production-shaped REST API for tasks with axum and SQLite, with validation, consistent errors, pagination, tests at every layer, structured logs and a Docker image.
  res: |
    axum examples | https://github.com/tokio-rs/axum/tree/main/examples
    rusqlite | https://docs.rs/rusqlite
    tower-http | https://docs.rs/tower-http
  items:
    - id: W1.1
      t: Plan the API
      min: 45
      lv: 3
      kind: project
      learn: Design the resources, routes, request and response shapes, status codes and error format before writing handlers, and choose a layered structure (routes, service, repository).
      example:
        title: The API contract
        lang: text
        check: none
        code: |
          GET    /health                       200 {"status":"ok"}
          GET    /tasks?status=open&page=1     200 {"items":[Task], "page":1, "per_page":20, "total":57}
          POST   /tasks        {"title","due"?} 201 Task            422 {"error":"title must not be empty"}
          GET    /tasks/{id}                   200 Task            404 {"error":"task 9 not found"}
          PATCH  /tasks/{id}   {"title"?,"done"?} 200 Task          404 / 422
          DELETE /tasks/{id}                   204                 404

          Task = {"id": 1, "title": "Write tests", "done": false, "due": "2026-11-30" | null, "created_at": "..."}

          Layers: routes (HTTP) -> service (rules) -> repository (SQL)
        note: Writing the contract first lets you write API tests before handlers and agree the shapes with anyone building a front end. Every error uses the same JSON shape, so clients handle failures in one place.
      ex:
        - t: Decide the edge cases
          p: For each route, list the edge cases and the exact status code you will return, including invalid JSON, unknown fields, a non-numeric id, a page beyond the end and a PATCH with an empty body.
          lang: text
          check: none
          hints:
            - axum rejects malformed JSON before your handler runs; decide whether to keep its default response.
            - A page beyond the end is not an error; it is an empty list.
            - A non-numeric id fails the Path extractor with 400.
          solution: |
            POST /tasks
              invalid JSON            400 (axum default, wrapped into {"error": ...})
              missing title           422 {"error":"title is required"}
              title > 200 chars       422
              unknown fields          ignored (documented)
            GET /tasks/abc            400 {"error":"id must be a number"}
            GET /tasks?page=999       200 {"items":[], "page":999, ...}
            PATCH /tasks/{id} {}      200, unchanged task (no-op)
            PATCH done: "yes"         422 (wrong type)
            DELETE twice              204 then 404
          explain: Decisions like "a page past the end is an empty list" are what separate a polished API from a frustrating one, and they map directly onto test cases.
        - t: Sketch the project layout
          p: Write the folder and module layout for taskhub, separating main.rs, the router, handlers, the domain model, the repository and errors, and mark which modules you will unit test and which you will test through HTTP.
          lang: text
          check: none
          hints:
            - Keep main.rs to configuration and server start-up.
            - Put the Router construction in a function so tests can build it.
            - The repository should be testable against an in-memory SQLite database.
          solution: |
            src/
              main.rs        read config, open DB, build app, serve        (no tests)
              app.rs         fn app(state) -> Router                       (HTTP tests via oneshot)
              handlers.rs    thin: extract, call service, map to response  (HTTP tests)
              model.rs       Task, NewTask, TaskPatch, validation          (unit tests)
              repo.rs        TaskRepo over rusqlite                        (unit tests, in-memory DB)
              error.rs       ApiError + IntoResponse                       (unit tests)
            tests/
              api.rs         full flows: create, list, patch, delete       (integration)
          explain: Each layer is testable on its own, which keeps tests fast and failures easy to locate. The same layout scales to much larger services.
    - id: W1.2
      t: Build the repository and handlers
      min: 150
      kind: project
      learn: Implement the SQLite repository behind a Mutex, the error type with IntoResponse, validated create and patch handlers, pagination, and HTTP tests with oneshot.
      example:
        title: Errors that become responses
        deps: ['axum = "0.8"', 'serde_json = "1"', 'rusqlite = { version = "0.32", features = ["bundled"] }']
        check: test
        code: |
          use axum::{http::StatusCode, response::{IntoResponse, Response}, Json};
          use serde_json::json;

          #[derive(Debug)]
          pub enum ApiError {
              NotFound(u64),
              Validation(String),
              Internal(String),
          }

          impl From<rusqlite::Error> for ApiError {
              fn from(e: rusqlite::Error) -> Self { ApiError::Internal(e.to_string()) }
          }

          impl IntoResponse for ApiError {
              fn into_response(self) -> Response {
                  let (status, msg) = match self {
                      ApiError::NotFound(id) => (StatusCode::NOT_FOUND, format!("task {id} not found")),
                      ApiError::Validation(m) => (StatusCode::UNPROCESSABLE_ENTITY, m),
                      ApiError::Internal(m) => {
                          eprintln!("internal error: {m}");            // log details, hide them from clients
                          (StatusCode::INTERNAL_SERVER_ERROR, "internal error".to_string())
                      }
                  };
                  (status, Json(json!({ "error": msg }))).into_response()
              }
          }

          #[cfg(test)]
          mod tests {
              use super::*;
              #[test]
              fn statuses() {
                  assert_eq!(ApiError::NotFound(9).into_response().status(), StatusCode::NOT_FOUND);
                  assert_eq!(ApiError::Validation("x".into()).into_response().status(), StatusCode::UNPROCESSABLE_ENTITY);
                  let db_err: ApiError = rusqlite::Error::QueryReturnedNoRows.into();
                  assert_eq!(db_err.into_response().status(), StatusCode::INTERNAL_SERVER_ERROR);
              }
          }
        note: Internal errors are logged in full but returned to clients as a generic message, so database details never leak. The From impl means repository calls can use ? inside handlers.
      ex:
        - t: The task repository
          p: Implement TaskRepo with create, get, list(done Option<bool>, page u32, per_page u32) returning (Vec<Task>, total), update_done and delete, over an in-memory SQLite connection. Test pagination and filtering.
          deps: ['rusqlite = { version = "0.32", features = ["bundled"] }']
          check: test
          hints:
            - LIMIT ?1 OFFSET ?2 with offset = (page - 1) * per_page.
            - "Build the WHERE clause from a fixed set of strings, never from user text: WHERE (?1 IS NULL OR done = ?1)."
            - SELECT COUNT(*) with the same filter gives the total.
          solution: |
            use rusqlite::{params, Connection, OptionalExtension, Result};

            #[derive(Debug, Clone, PartialEq)]
            pub struct Task { pub id: i64, pub title: String, pub done: bool }

            pub struct TaskRepo { conn: Connection }

            impl TaskRepo {
                pub fn new(conn: Connection) -> Result<Self> {
                    conn.execute_batch("CREATE TABLE IF NOT EXISTS tasks (id INTEGER PRIMARY KEY, title TEXT NOT NULL, done INTEGER NOT NULL DEFAULT 0);")?;
                    Ok(TaskRepo { conn })
                }
                pub fn create(&self, title: &str) -> Result<Task> {
                    self.conn.execute("INSERT INTO tasks (title) VALUES (?1)", [title])?;
                    Ok(Task { id: self.conn.last_insert_rowid(), title: title.into(), done: false })
                }
                pub fn get(&self, id: i64) -> Result<Option<Task>> {
                    self.conn
                        .query_row("SELECT id, title, done FROM tasks WHERE id = ?1", [id], |r| Ok(Task { id: r.get(0)?, title: r.get(1)?, done: r.get(2)? }))
                        .optional()
                }
                pub fn list(&self, done: Option<bool>, page: u32, per_page: u32) -> Result<(Vec<Task>, i64)> {
                    let offset = (page.max(1) - 1) * per_page;
                    let mut stmt = self.conn.prepare("SELECT id, title, done FROM tasks WHERE (?1 IS NULL OR done = ?1) ORDER BY id LIMIT ?2 OFFSET ?3")?;
                    let items = stmt
                        .query_map(params![done, per_page, offset], |r| Ok(Task { id: r.get(0)?, title: r.get(1)?, done: r.get(2)? }))?
                        .collect::<Result<Vec<_>>>()?;
                    let total = self.conn.query_row("SELECT COUNT(*) FROM tasks WHERE (?1 IS NULL OR done = ?1)", params![done], |r| r.get(0))?;
                    Ok((items, total))
                }
                pub fn update_done(&self, id: i64, done: bool) -> Result<bool> {
                    Ok(self.conn.execute("UPDATE tasks SET done = ?1 WHERE id = ?2", params![done, id])? == 1)
                }
                pub fn delete(&self, id: i64) -> Result<bool> {
                    Ok(self.conn.execute("DELETE FROM tasks WHERE id = ?1", [id])? == 1)
                }
            }

            #[cfg(test)]
            mod tests {
                use super::*;
                fn repo() -> TaskRepo { TaskRepo::new(Connection::open_in_memory().unwrap()).unwrap() }

                #[test]
                fn pagination_and_filter() {
                    let r = repo();
                    for i in 1..=25 {
                        let t = r.create(&format!("task {i}")).unwrap();
                        if i % 5 == 0 { r.update_done(t.id, true).unwrap(); }
                    }
                    let (page2, total) = r.list(None, 2, 10).unwrap();
                    assert_eq!((page2.len(), total, page2[0].id), (10, 25, 11));
                    let (done, total_done) = r.list(Some(true), 1, 10).unwrap();
                    assert_eq!((done.len(), total_done), (5, 5));
                    let (empty, _) = r.list(None, 99, 10).unwrap();
                    assert!(empty.is_empty());
                }

                #[test]
                fn get_and_delete() {
                    let r = repo();
                    let t = r.create("x").unwrap();
                    assert_eq!(r.get(t.id).unwrap(), Some(t.clone()));
                    assert!(r.delete(t.id).unwrap());
                    assert!(!r.delete(t.id).unwrap());
                    assert_eq!(r.get(t.id).unwrap(), None);
                }
            }
          explain: The (?1 IS NULL OR done = ?1) trick keeps one fixed, parameterised query for both filtered and unfiltered lists, so no SQL is ever built from user input. optional() turns "no rows" into None instead of an error.
        - t: Handlers with validation
          p: Write the create handler that validates a NewTask (title trimmed, 1 to 200 characters) and returns 201 with the task, using the ApiError type, plus an HTTP test with oneshot for the 201 and 422 cases. Share the repository as State<Arc<Mutex<TaskRepo>>>.
          deps: ['axum = "0.8"', 'tokio = { version = "1", features = ["full"] }', 'serde = { version = "1", features = ["derive"] }', 'serde_json = "1"', 'tower = { version = "0.5", features = ["util"] }', 'rusqlite = { version = "0.32", features = ["bundled"] }']
          check: test
          hints:
            - Validation lives in a plain function so it can be unit tested.
            - Lock the mutex, call the repository, and let the guard drop before returning.
            - In the test, build the app with an in-memory repository and send a POST with a JSON body.
          solution: |
            use axum::{extract::State, http::StatusCode, response::{IntoResponse, Response}, routing::post, Json, Router};
            use rusqlite::Connection;
            use serde::{Deserialize, Serialize};
            use serde_json::json;
            use std::sync::{Arc, Mutex};

            #[derive(Debug, Serialize, Clone)]
            struct Task { id: i64, title: String, done: bool }

            #[derive(Deserialize)]
            struct NewTask { title: String }

            enum ApiError { Validation(String), Internal(String) }

            impl IntoResponse for ApiError {
                fn into_response(self) -> Response {
                    let (s, m) = match self {
                        ApiError::Validation(m) => (StatusCode::UNPROCESSABLE_ENTITY, m),
                        ApiError::Internal(_) => (StatusCode::INTERNAL_SERVER_ERROR, "internal error".into()),
                    };
                    (s, Json(json!({ "error": m }))).into_response()
                }
            }

            fn validate_title(raw: &str) -> Result<String, ApiError> {
                let t = raw.trim();
                match t.chars().count() {
                    0 => Err(ApiError::Validation("title must not be empty".into())),
                    n if n > 200 => Err(ApiError::Validation("title must be at most 200 characters".into())),
                    _ => Ok(t.to_string()),
                }
            }

            type Db = Arc<Mutex<Connection>>;

            async fn create(State(db): State<Db>, Json(input): Json<NewTask>) -> Result<(StatusCode, Json<Task>), ApiError> {
                let title = validate_title(&input.title)?;
                let conn = db.lock().unwrap();
                conn.execute("INSERT INTO tasks (title) VALUES (?1)", [&title]).map_err(|e| ApiError::Internal(e.to_string()))?;
                let task = Task { id: conn.last_insert_rowid(), title, done: false };
                Ok((StatusCode::CREATED, Json(task)))
            }

            fn app(db: Db) -> Router {
                Router::new().route("/tasks", post(create)).with_state(db)
            }

            fn memory_db() -> Db {
                let c = Connection::open_in_memory().unwrap();
                c.execute_batch("CREATE TABLE tasks (id INTEGER PRIMARY KEY, title TEXT NOT NULL, done INTEGER NOT NULL DEFAULT 0);").unwrap();
                Arc::new(Mutex::new(c))
            }

            #[tokio::main]
            async fn main() {
                let listener = tokio::net::TcpListener::bind("127.0.0.1:3000").await.unwrap();
                axum::serve(listener, app(memory_db())).await.unwrap();
            }

            #[cfg(test)]
            mod tests {
                use super::*;
                use axum::{body::Body, http::Request};
                use tower::ServiceExt;

                fn post_json(body: &str) -> Request<Body> {
                    Request::post("/tasks").header("content-type", "application/json").body(Body::from(body.to_string())).unwrap()
                }

                #[tokio::test]
                async fn creates_and_validates() {
                    let db = memory_db();
                    let ok = app(db.clone()).oneshot(post_json(r#"{"title":"  Write tests  "}"#)).await.unwrap();
                    assert_eq!(ok.status(), StatusCode::CREATED);
                    let bad = app(db).oneshot(post_json(r#"{"title":"   "}"#)).await.unwrap();
                    assert_eq!(bad.status(), StatusCode::UNPROCESSABLE_ENTITY);
                }

                #[test]
                fn title_rules() {
                    assert!(validate_title(&"é".repeat(200)).is_ok());
                    assert!(validate_title(&"é".repeat(201)).is_err());
                }
            }
          explain: Holding a std Mutex guard in this handler is fine because nothing awaits while it is held. Under heavy load you would move database work to spawn_blocking or use an async driver such as sqlx; the handler shape stays the same.
    - id: W1.3
      t: Ship it
      min: 90
      kind: project
      learn: Add request logging with tower-http's TraceLayer, configuration from environment variables, graceful shutdown, a multi-stage Dockerfile, CI, and an OpenAPI-style README.
      example:
        title: A small, secure container image
        lang: text
        check: none
        code: |
          # Dockerfile
          FROM rust:1.97 AS build
          WORKDIR /app
          COPY . .
          RUN cargo build --release --locked

          FROM gcr.io/distroless/cc-debian12
          COPY --from=build /app/target/release/taskhub /taskhub
          ENV TASKHUB_ADDR=0.0.0.0:3000 TASKHUB_DB=/data/taskhub.db
          VOLUME /data
          USER nonroot
          EXPOSE 3000
          ENTRYPOINT ["/taskhub"]

          # $ docker build -t taskhub .
          # $ docker run -p 3000:3000 -v taskhub-data:/data taskhub
        note: The two-stage build compiles in a full Rust image, then copies only the binary into a tiny distroless image with no shell and a non-root user, which shrinks the attack surface and the download size. --locked makes the build use exactly the versions in Cargo.lock.
      ex:
        - t: Configuration and graceful shutdown
          p: Read the bind address and database path from TASKHUB_ADDR and TASKHUB_DB with defaults, add TraceLayer for request logs, and make axum::serve stop gracefully on Ctrl+C.
          lang: rust
          check: none
          hints:
            - std::env::var("TASKHUB_ADDR").unwrap_or_else(|_| "127.0.0.1:3000".into())
            - ".layer(tower_http::trace::TraceLayer::new_for_http()) after adding tower-http with the trace feature."
            - axum::serve(listener, app).with_graceful_shutdown(async { tokio::signal::ctrl_c().await.ok(); })
          solution: |
            use std::env;
            use tower_http::trace::TraceLayer;

            #[tokio::main]
            async fn main() -> anyhow::Result<()> {
                tracing_subscriber::fmt().with_env_filter("taskhub=info,tower_http=info").init();
                let addr = env::var("TASKHUB_ADDR").unwrap_or_else(|_| "127.0.0.1:3000".into());
                let db_path = env::var("TASKHUB_DB").unwrap_or_else(|_| "taskhub.db".into());

                let state = AppState::open(&db_path)?;
                let app = app(state).layer(TraceLayer::new_for_http());

                let listener = tokio::net::TcpListener::bind(&addr).await?;
                tracing::info!("listening on {addr}, database {db_path}");
                axum::serve(listener, app)
                    .with_graceful_shutdown(async {
                        tokio::signal::ctrl_c().await.ok();
                        tracing::info!("shutting down");
                    })
                    .await?;
                Ok(())
            }
          explain: Graceful shutdown lets in-flight requests finish before the process exits, which matters during deployments. Configuration from environment variables is the convention containers and platforms expect.
        - t: Contract tests in CI
          p: Add tests/api.rs that starts the real app on a random port and drives a full create, list, patch and delete flow with reqwest, then add it to the CI workflow. Write the two CV bullets.
          lang: rust
          check: none
          hints:
            - Bind a TcpListener to 127.0.0.1:0 and read local_addr() to get the port.
            - Spawn axum::serve in a background task, then use reqwest against the address.
            - Use a fresh in-memory or temporary-file database per test.
          solution: |
            // tests/api.rs
            use serde_json::{json, Value};

            #[tokio::test]
            async fn full_flow() {
                let listener = tokio::net::TcpListener::bind("127.0.0.1:0").await.unwrap();
                let addr = listener.local_addr().unwrap();
                tokio::spawn(async move { axum::serve(listener, taskhub::app(taskhub::AppState::in_memory())).await.unwrap() });
                let base = format!("http://{addr}");
                let c = reqwest::Client::new();

                let created: Value = c.post(format!("{base}/tasks")).json(&json!({"title": "ship it"})).send().await.unwrap().json().await.unwrap();
                let id = created["id"].as_i64().unwrap();
                let list: Value = c.get(format!("{base}/tasks")).send().await.unwrap().json().await.unwrap();
                assert_eq!(list["total"], 1);
                let patched: Value = c.patch(format!("{base}/tasks/{id}")).json(&json!({"done": true})).send().await.unwrap().json().await.unwrap();
                assert_eq!(patched["done"], true);
                assert_eq!(c.delete(format!("{base}/tasks/{id}")).send().await.unwrap().status(), 204);
                assert_eq!(c.get(format!("{base}/tasks/{id}")).send().await.unwrap().status(), 404);
            }
          explain: This end-to-end test exercises real HTTP, JSON and SQLite together, catching wiring mistakes unit tests miss, while still running in well under a second.
  recap:
    summary:
      - Design the API contract, status codes and error shape before writing handlers.
      - Layer the code into routes, handlers, model validation and a repository, each testable on its own.
      - One ApiError type implementing IntoResponse keeps errors consistent and hides internal details.
      - Parameterised SQL with fixed queries handles filters and pagination safely.
      - TraceLayer logs, environment configuration, graceful shutdown and a distroless Docker image make it deployable.
    functions: |
      impl IntoResponse for ApiError || Map errors to HTTP responses.
      State<Arc<Mutex<..>>> || Share state with handlers.
      LIMIT ?1 OFFSET ?2 || Paginate in SQL.
      app.oneshot(req) || Test a router in-process.
      TraceLayer::new_for_http() || Log every request.
      serve(..).with_graceful_shutdown(..) || Finish in-flight requests on shutdown.
      Multi-stage Dockerfile + distroless || A small, secure image.
    explore:
      - Swap rusqlite for sqlx with Postgres and compile-time checked queries.
      - Add API key authentication as a tower middleware layer.
    repo: taskhub
    cv:
      - Built taskhub, a REST API in Rust (axum, SQLite) with validation, pagination, consistent error responses and [N] unit, HTTP and end-to-end tests run in CI.
      - Packaged it as a [X] MB distroless container with graceful shutdown and structured request logging.
    next: W2 builds a persistent key-value store from scratch.

- id: w2
  n: W2
  t: "kvlog: a persistent key-value store"
  lv: 5
  goal: Build a small log-structured key-value store like Bitcask, with an append-only file, an in-memory index, crash-safe writes, compaction and a command-line client.
  res: |
    Bitcask paper | https://riak.com/assets/bitcask-intro.pdf
    std::fs::OpenOptions | https://doc.rust-lang.org/std/fs/struct.OpenOptions.html
    PingCAP talent plan (Rust projects) | https://github.com/pingcap/talent-plan
  items:
    - id: W2.1
      t: Plan the storage engine
      min: 60
      lv: 4
      kind: project
      learn: How a log-structured store works (append every change, keep an index of where each key's latest value lives, compact old entries), the on-disk record format, and what crash safety means here.
      example:
        title: The record format
        code: |
          /// One record in the log:
          ///   [crc32: u32][kind: u8][key_len: u32][val_len: u32][key bytes][value bytes]
          /// kind 1 = set, 2 = remove (a "tombstone", value empty)
          #[derive(Debug, PartialEq)]
          pub enum Record {
              Set { key: Vec<u8>, value: Vec<u8> },
              Remove { key: Vec<u8> },
          }

          pub fn encode(r: &Record) -> Vec<u8> {
              let (kind, key, value): (u8, &[u8], &[u8]) = match r {
                  Record::Set { key, value } => (1, key, value),
                  Record::Remove { key } => (2, key, &[]),
              };
              let mut body = Vec::with_capacity(9 + key.len() + value.len());
              body.push(kind);
              body.extend_from_slice(&(key.len() as u32).to_le_bytes());
              body.extend_from_slice(&(value.len() as u32).to_le_bytes());
              body.extend_from_slice(key);
              body.extend_from_slice(value);
              let crc = body.iter().fold(0u32, |h, &b| h.rotate_left(5) ^ b as u32); // simple checksum for now
              let mut out = crc.to_le_bytes().to_vec();
              out.extend(body);
              out
          }

          fn main() {
              let bytes = encode(&Record::Set { key: b"lang".to_vec(), value: b"rust".to_vec() });
              println!("{} bytes: {:?}", bytes.len(), &bytes[4..13]);
          }
        output: |
          21 bytes: [1, 4, 0, 0, 0, 4, 0, 0, 0]
        note: Appending is the fastest and safest way to write to disk, since existing data is never overwritten. The checksum detects a record that was half-written when the machine crashed, so recovery can stop cleanly at the last good record. A real implementation would use the crc32fast crate.
      ex:
        - t: Decode with validation
          p: "Write fn decode(buf: &[u8]) -> Result<Option<(Record, usize)>, String> that reads one record from the start of a buffer, returns how many bytes it used, returns Ok(None) when the buffer is too short (end of log or torn write), and Err on a checksum mismatch. Test a round trip, a truncated record and a corrupted byte."
          check: test
          hints:
            - The header is 13 bytes, crc (4) + kind (1) + two lengths (4 + 4).
            - "u32::from_le_bytes(buf[5..9].try_into().unwrap()) reads a length."
            - Recompute the checksum over the body and compare.
          solution: |
            #[derive(Debug, PartialEq)]
            pub enum Record {
                Set { key: Vec<u8>, value: Vec<u8> },
                Remove { key: Vec<u8> },
            }

            fn checksum(body: &[u8]) -> u32 {
                body.iter().fold(0u32, |h, &b| h.rotate_left(5) ^ b as u32)
            }

            pub fn encode(r: &Record) -> Vec<u8> {
                let (kind, key, value): (u8, &[u8], &[u8]) = match r {
                    Record::Set { key, value } => (1, key, value),
                    Record::Remove { key } => (2, key, &[]),
                };
                let mut body = vec![kind];
                body.extend_from_slice(&(key.len() as u32).to_le_bytes());
                body.extend_from_slice(&(value.len() as u32).to_le_bytes());
                body.extend_from_slice(key);
                body.extend_from_slice(value);
                let mut out = checksum(&body).to_le_bytes().to_vec();
                out.extend(body);
                out
            }

            pub fn decode(buf: &[u8]) -> Result<Option<(Record, usize)>, String> {
                const HEADER: usize = 13;
                if buf.len() < HEADER {
                    return Ok(None);
                }
                let u32_at = |i: usize| u32::from_le_bytes(buf[i..i + 4].try_into().unwrap()) as usize;
                let (crc, kind, klen, vlen) = (u32_at(0) as u32, buf[4], u32_at(5), u32_at(9));
                let total = HEADER + klen + vlen;
                if buf.len() < total {
                    return Ok(None); // torn write at the end of the log
                }
                if checksum(&buf[4..total]) != crc {
                    return Err("checksum mismatch".into());
                }
                let key = buf[HEADER..HEADER + klen].to_vec();
                let rec = match kind {
                    1 => Record::Set { key, value: buf[HEADER + klen..total].to_vec() },
                    2 => Record::Remove { key },
                    k => return Err(format!("unknown record kind {k}")),
                };
                Ok(Some((rec, total)))
            }

            #[cfg(test)]
            mod tests {
                use super::*;
                #[test]
                fn round_trip_truncated_corrupted() {
                    let r = Record::Set { key: b"k".to_vec(), value: b"value".to_vec() };
                    let bytes = encode(&r);
                    assert_eq!(decode(&bytes).unwrap(), Some((r, bytes.len())));
                    assert_eq!(decode(&bytes[..bytes.len() - 1]).unwrap(), None);
                    let mut bad = bytes.clone();
                    bad[15] ^= 0xFF;
                    assert!(decode(&bad).is_err());
                }
            }
          explain: Distinguishing "not enough bytes" from "bytes are wrong" is what lets the store recover after a crash, truncate the torn tail and keep everything before it. Little-endian byte order is fixed so files move between machines.
        - t: Write the design notes
          p: Write a DESIGN.md covering the record format, the in-memory index (key to file offset), what happens on startup, how compaction works, and the durability guarantee (when a write is safe from power loss).
          lang: text
          check: none
          hints:
            - On startup, replay the log from the beginning to rebuild the index.
            - Compaction writes only live keys to a new file, then atomically renames it over the old one.
            - A write is durable only after the file is flushed and synced with sync_data.
          solution: |
            # kvlog design
            Log: append-only file of records [crc][kind][klen][vlen][key][value].
            Index: HashMap<Vec<u8>, u64> from key to the offset of its latest Set.
            Startup: read records from offset 0, applying Set and Remove to the
            index; stop at the first torn or corrupt record and truncate there.
            Get: look up the offset, seek, decode one record.
            Compaction: when dead bytes exceed 50% of the file, write every live
            key to kvlog.compact, fsync it, rename it over kvlog.data, reopen.
            Durability: set returns after write_all; with --sync it also calls
            sync_data, surviving power loss at the cost of speed.
          explain: Design notes like this are what interviewers love to discuss, because they show you understand the trade-offs (speed versus durability, space versus write amplification), not only the code.
    - id: W2.2
      t: Build the engine
      min: 150
      kind: project
      lv: 5
      learn: Implement open (replay and recover), set, get, remove and compaction on top of the record format, with tests that reopen the store to prove data persists.
      example:
        title: Opening and replaying the log
        check: test
        code: |
          use std::collections::HashMap;
          use std::fs::{File, OpenOptions};
          use std::io::{self, Read, Seek, SeekFrom, Write};
          use std::path::Path;

          pub struct KvLog { file: File, index: HashMap<Vec<u8>, Vec<u8>> }

          impl KvLog {
              pub fn open(path: &Path) -> io::Result<Self> {
                  let mut file = OpenOptions::new().read(true).append(true).create(true).open(path)?;
                  let mut buf = Vec::new();
                  file.seek(SeekFrom::Start(0))?;
                  file.read_to_end(&mut buf)?;
                  let mut index = HashMap::new();
                  let mut pos = 0;
                  // Simplified format for this example: [klen u32][vlen u32][key][value], vlen u32::MAX = remove
                  while pos + 8 <= buf.len() {
                      let klen = u32::from_le_bytes(buf[pos..pos + 4].try_into().unwrap()) as usize;
                      let vlen = u32::from_le_bytes(buf[pos + 4..pos + 8].try_into().unwrap());
                      let vbytes = if vlen == u32::MAX { 0 } else { vlen as usize };
                      if pos + 8 + klen + vbytes > buf.len() { break; } // torn tail
                      let key = buf[pos + 8..pos + 8 + klen].to_vec();
                      if vlen == u32::MAX { index.remove(&key); } else { index.insert(key, buf[pos + 8 + klen..pos + 8 + klen + vbytes].to_vec()); }
                      pos += 8 + klen + vbytes;
                  }
                  Ok(KvLog { file, index })
              }

              pub fn set(&mut self, key: &[u8], value: &[u8]) -> io::Result<()> {
                  let mut rec = (key.len() as u32).to_le_bytes().to_vec();
                  rec.extend((value.len() as u32).to_le_bytes());
                  rec.extend(key);
                  rec.extend(value);
                  self.file.write_all(&rec)?;
                  self.index.insert(key.to_vec(), value.to_vec());
                  Ok(())
              }

              pub fn get(&self, key: &[u8]) -> Option<&[u8]> { self.index.get(key).map(|v| v.as_slice()) }
          }

          #[cfg(test)]
          mod tests {
              use super::*;
              #[test]
              fn survives_reopen() {
                  let path = std::env::temp_dir().join("kvlog_example_test.log");
                  let _ = std::fs::remove_file(&path);
                  {
                      let mut kv = KvLog::open(&path).unwrap();
                      kv.set(b"lang", b"rust").unwrap();
                      kv.set(b"lang", b"Rust 2024").unwrap();
                  }
                  let kv = KvLog::open(&path).unwrap();
                  assert_eq!(kv.get(b"lang"), Some(&b"Rust 2024"[..]));
              }
          }
        note: This simplified version keeps values in memory to show the replay idea; the exercise version stores only offsets and reads values from disk, which is what lets Bitcask hold more data than fits in RAM. Opening in append mode guarantees every write goes to the end of the file.
      ex:
        - t: The full engine with offsets
          p: Build KvStore with open, set, get (reading the value from disk by offset), remove (writing a tombstone) and len, using your encode and decode functions. Test persistence across reopen, removal across reopen, and recovery from a torn final record.
          check: test
          hints:
            - Keep index HashMap<Vec<u8>, u64> pointing at the start of each key's latest record.
            - Before appending, get the offset with file.seek(SeekFrom::End(0)).
            - To test recovery, append a few garbage bytes to the file before reopening; open should ignore them.
          solution: |
            use std::collections::HashMap;
            use std::fs::{File, OpenOptions};
            use std::io::{self, Read, Seek, SeekFrom, Write};
            use std::path::Path;

            fn checksum(body: &[u8]) -> u32 { body.iter().fold(0u32, |h, &b| h.rotate_left(5) ^ b as u32) }

            fn encode(kind: u8, key: &[u8], value: &[u8]) -> Vec<u8> {
                let mut body = vec![kind];
                body.extend((key.len() as u32).to_le_bytes());
                body.extend((value.len() as u32).to_le_bytes());
                body.extend(key);
                body.extend(value);
                let mut out = checksum(&body).to_le_bytes().to_vec();
                out.extend(body);
                out
            }

            /// Returns (kind, key, value, total_len) or None if incomplete or corrupt.
            fn decode(buf: &[u8]) -> Option<(u8, Vec<u8>, Vec<u8>, usize)> {
                if buf.len() < 13 { return None; }
                let n = |i: usize| u32::from_le_bytes(buf[i..i + 4].try_into().unwrap()) as usize;
                let (klen, vlen) = (n(5), n(9));
                let total = 13 + klen + vlen;
                if buf.len() < total || checksum(&buf[4..total]) != n(0) as u32 { return None; }
                Some((buf[4], buf[13..13 + klen].to_vec(), buf[13 + klen..total].to_vec(), total))
            }

            pub struct KvStore { file: File, index: HashMap<Vec<u8>, u64> }

            impl KvStore {
                pub fn open(path: &Path) -> io::Result<Self> {
                    let mut file = OpenOptions::new().read(true).append(true).create(true).open(path)?;
                    let mut buf = Vec::new();
                    file.seek(SeekFrom::Start(0))?;
                    file.read_to_end(&mut buf)?;
                    let mut index = HashMap::new();
                    let mut pos = 0usize;
                    while let Some((kind, key, _, total)) = decode(&buf[pos..]) {
                        if kind == 1 { index.insert(key, pos as u64); } else { index.remove(&key); }
                        pos += total;
                    }
                    if pos < buf.len() {
                        file.set_len(pos as u64)?; // drop a torn or corrupt tail
                    }
                    Ok(KvStore { file, index })
                }

                fn append(&mut self, rec: &[u8]) -> io::Result<u64> {
                    let offset = self.file.seek(SeekFrom::End(0))?;
                    self.file.write_all(rec)?;
                    Ok(offset)
                }

                pub fn set(&mut self, key: &[u8], value: &[u8]) -> io::Result<()> {
                    let off = self.append(&encode(1, key, value))?;
                    self.index.insert(key.to_vec(), off);
                    Ok(())
                }

                pub fn remove(&mut self, key: &[u8]) -> io::Result<bool> {
                    if self.index.remove(key).is_none() { return Ok(false); }
                    self.append(&encode(2, key, &[]))?;
                    Ok(true)
                }

                pub fn get(&mut self, key: &[u8]) -> io::Result<Option<Vec<u8>>> {
                    let Some(&off) = self.index.get(key) else { return Ok(None) };
                    self.file.seek(SeekFrom::Start(off))?;
                    let mut header = [0u8; 13];
                    self.file.read_exact(&mut header)?;
                    let klen = u32::from_le_bytes(header[5..9].try_into().unwrap()) as usize;
                    let vlen = u32::from_le_bytes(header[9..13].try_into().unwrap()) as usize;
                    let mut rest = vec![0u8; klen + vlen];
                    self.file.read_exact(&mut rest)?;
                    Ok(Some(rest[klen..].to_vec()))
                }

                pub fn len(&self) -> usize { self.index.len() }
            }

            #[cfg(test)]
            mod tests {
                use super::*;
                fn tmp(name: &str) -> std::path::PathBuf {
                    let p = std::env::temp_dir().join(name);
                    let _ = std::fs::remove_file(&p);
                    p
                }

                #[test]
                fn persists_and_removes() {
                    let p = tmp("kvstore_persist.log");
                    {
                        let mut kv = KvStore::open(&p).unwrap();
                        kv.set(b"a", b"1").unwrap();
                        kv.set(b"b", b"2").unwrap();
                        kv.set(b"a", b"3").unwrap();
                        assert!(kv.remove(b"b").unwrap());
                    }
                    let mut kv = KvStore::open(&p).unwrap();
                    assert_eq!(kv.get(b"a").unwrap(), Some(b"3".to_vec()));
                    assert_eq!(kv.get(b"b").unwrap(), None);
                    assert_eq!(kv.len(), 1);
                }

                #[test]
                fn recovers_from_torn_tail() {
                    let p = tmp("kvstore_torn.log");
                    {
                        let mut kv = KvStore::open(&p).unwrap();
                        kv.set(b"k", b"v").unwrap();
                    }
                    let mut f = OpenOptions::new().append(true).open(&p).unwrap();
                    f.write_all(&[9, 9, 9, 9, 1, 50, 0]).unwrap(); // half a record
                    drop(f);
                    let mut kv = KvStore::open(&p).unwrap();
                    assert_eq!(kv.get(b"k").unwrap(), Some(b"v".to_vec()));
                    kv.set(b"k2", b"v2").unwrap();
                    drop(kv);
                    let mut kv = KvStore::open(&p).unwrap();
                    assert_eq!(kv.get(b"k2").unwrap(), Some(b"v2".to_vec()), "writes after recovery are readable");
                }
            }
          explain: Truncating the torn tail on open is what makes later appends land right after the last good record; without it, new data would follow the garbage and be unreachable. The recovery test simulates a crash mid-write, the kind of test most storage bugs hide behind.
        - t: Compaction
          p: Add compact(&mut self, path &Path) that writes only the latest value of every live key into a new file, syncs it, renames it over the original, and rebuilds the index. Test that the file shrinks and every key still reads correctly after reopening.
          lang: rust
          check: none
          hints:
            - Read each live value with get, write records into path.with_extension("compact").
            - Call sync_all on the new file before std::fs::rename.
            - Reopen the store from the original path to rebuild the index and file handle.
          solution: |
            impl KvStore {
                pub fn compact(&mut self, path: &Path) -> io::Result<()> {
                    let tmp_path = path.with_extension("compact");
                    let mut out = File::create(&tmp_path)?;
                    let keys: Vec<Vec<u8>> = self.index.keys().cloned().collect();
                    for key in keys {
                        if let Some(value) = self.get(&key)? {
                            out.write_all(&encode(1, &key, &value))?;
                        }
                    }
                    out.sync_all()?;                   // the new file is safely on disk
                    drop(out);
                    std::fs::rename(&tmp_path, path)?; // atomic replace on the same filesystem
                    *self = KvStore::open(path)?;      // reload index and file handle
                    Ok(())
                }
            }

            #[test]
            fn compaction_shrinks_file() {
                let p = std::env::temp_dir().join("kvstore_compact.log");
                let _ = std::fs::remove_file(&p);
                let mut kv = KvStore::open(&p).unwrap();
                for i in 0..1000 {
                    kv.set(b"counter", i.to_string().as_bytes()).unwrap();
                }
                let before = std::fs::metadata(&p).unwrap().len();
                kv.compact(&p).unwrap();
                let after = std::fs::metadata(&p).unwrap().len();
                assert!(after < before / 100, "{before} -> {after}");
                drop(kv);
                let mut kv = KvStore::open(&p).unwrap();
                assert_eq!(kv.get(b"counter").unwrap(), Some(b"999".to_vec()));
            }
          explain: Writing to a temporary file and renaming it means a crash during compaction leaves the old file intact; rename is atomic on the same filesystem. Overwrites of one key are the worst case for log growth, which is exactly what the test exercises.
    - id: W2.3
      t: Ship it
      min: 90
      kind: project
      learn: Wrap the engine in a clap CLI (set, get, rm, compact, stats), benchmark writes and reads with criterion, document guarantees and limits, and publish the crate.
      example:
        title: The command-line client
        lang: rust
        check: none
        code: |
          use clap::{Parser, Subcommand};
          use std::path::PathBuf;

          #[derive(Parser)]
          #[command(name = "kvlog", version, about = "A tiny log-structured key-value store")]
          struct Cli {
              #[arg(long, default_value = "kvlog.data")]
              path: PathBuf,
              #[command(subcommand)]
              cmd: Cmd,
          }

          #[derive(Subcommand)]
          enum Cmd { Set { key: String, value: String }, Get { key: String }, Rm { key: String }, Compact, Stats }

          fn main() -> anyhow::Result<()> {
              let cli = Cli::parse();
              let mut kv = kvlog::KvStore::open(&cli.path)?;
              match cli.cmd {
                  Cmd::Set { key, value } => kv.set(key.as_bytes(), value.as_bytes())?,
                  Cmd::Get { key } => match kv.get(key.as_bytes())? {
                      Some(v) => println!("{}", String::from_utf8_lossy(&v)),
                      None => { eprintln!("key not found"); std::process::exit(1); }
                  },
                  Cmd::Rm { key } => if !kv.remove(key.as_bytes())? { eprintln!("key not found"); std::process::exit(1); },
                  Cmd::Compact => kv.compact(&cli.path)?,
                  Cmd::Stats => println!("{} keys, {} bytes on disk", kv.len(), std::fs::metadata(&cli.path)?.len()),
              }
              Ok(())
          }
        note: Exit code 1 for a missing key mirrors tools like grep and makes the CLI scriptable. The library and the CLI are separate crates (or a lib plus a bin), so others can embed the store directly.
      ex:
        - t: Benchmark the engine
          p: Write criterion benchmarks for set and get with 10,000 keys of 16 bytes and values of 100 bytes, once with and once without sync_data after every write. Put the numbers in the README.
          lang: rust
          check: none
          hints:
            - Use a fresh temporary file per benchmark iteration group.
            - iter_batched lets you set up a store without timing the setup.
            - Expect syncing writes to be dramatically slower; that is the durability trade-off.
          solution: |
            use criterion::{criterion_group, criterion_main, BatchSize, Criterion};
            use kvlog::KvStore;

            fn keys() -> Vec<(Vec<u8>, Vec<u8>)> {
                (0..10_000).map(|i| (format!("key-{i:012}").into_bytes(), vec![b'x'; 100])).collect()
            }

            fn bench(c: &mut Criterion) {
                let data = keys();
                c.bench_function("set 10k", |b| {
                    b.iter_batched(
                        || {
                            let p = tempfile::NamedTempFile::new().unwrap().into_temp_path();
                            KvStore::open(&p).unwrap()
                        },
                        |mut kv| for (k, v) in &data { kv.set(k, v).unwrap(); },
                        BatchSize::PerIteration,
                    )
                });
                let p = tempfile::NamedTempFile::new().unwrap().into_temp_path();
                let mut kv = KvStore::open(&p).unwrap();
                for (k, v) in &data { kv.set(k, v).unwrap(); }
                c.bench_function("get 10k", |b| b.iter(|| for (k, _) in &data { kv.get(k).unwrap(); }));
            }

            criterion_group!(benches, bench);
            criterion_main!(benches);
          explain: Reporting both numbers honestly (fast but not crash-proof versus durable but slower) is exactly how real databases document their settings.
        - t: Document guarantees and publish
          p: Write the README with usage, guarantees (what survives a crash, with and without sync), limits (single process, keys in memory), the benchmark table, and publish the library to crates.io under a unique name. Draft the CV bullets.
          lang: text
          check: none
          hints:
            - Be explicit that two processes must not open the same file at once, or add a lock file.
            - Link DESIGN.md from the README.
            - Run cargo publish --dry-run first.
          solution: |
            ## Guarantees
            - A completed `set` is never lost by a process crash.
            - With `--sync`, a completed `set` also survives power loss.
            - A torn final record is detected by checksum and dropped on open.

            ## Limits
            - One process at a time per data file (no locking yet).
            - All keys must fit in memory; values live on disk.

            ## Benchmarks (10k keys, 100-byte values, NVMe SSD)
            | operation      | time     |
            |----------------|----------|
            | set (no sync)  | [x] ms   |
            | set (sync)     | [y] s    |
            | get            | [z] ms   |
          explain: Clear guarantees and limits show engineering maturity, and they are what a reviewer reads first to decide whether to trust a storage library.
  recap:
    summary:
      - Log-structured storage appends every change and keeps an in-memory index of the latest offsets.
      - A length-prefixed, checksummed record format allows clean recovery from torn writes.
      - Replay the log on open, truncate a bad tail, and read values by seeking to their offsets.
      - Compaction rewrites only live keys to a temporary file, syncs it and renames it atomically.
      - Document durability guarantees and limits, and benchmark both synced and unsynced writes.
    functions: |
      OpenOptions::new().read(true).append(true).create(true) || Open a log for appending.
      u32::to_le_bytes / from_le_bytes || A fixed binary encoding.
      file.seek(SeekFrom::Start(off)) / read_exact || Random reads by offset.
      file.set_len(n) || Truncate a torn tail.
      file.sync_all() / sync_data() || Force data to disk.
      std::fs::rename(tmp, path) || Atomically replace a file.
    explore:
      - Split the log into fixed-size segments so compaction works one segment at a time.
      - Add a TCP server mode speaking the SET/GET protocol from Track 2 A8.
    repo: kvlog
    cv:
      - Built kvlog, a Bitcask-style persistent key-value store in Rust with checksummed append-only records, crash recovery and atomic compaction, published on crates.io.
      - Benchmarked [N] writes/s unsynced and [M] writes/s with fsync, and documented the durability trade-offs.
