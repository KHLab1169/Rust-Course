- id: c21
  n: "21"
  book: 21
  t: "Final project: a multithreaded web server"
  lv: 4
  goal: Build an HTTP server from TCP sockets up, make it handle requests in parallel with a thread pool you write yourself, and shut it down gracefully.
  res: |
    Chapter 21 in the book | https://doc.rust-lang.org/book/ch21-00-final-project-a-web-server.html
    std::net | https://doc.rust-lang.org/std/net/
  items:
    - id: "21.1"
      t: A single-threaded web server
      min: 75
      kind: project
      learn: Listen on a port with TcpListener, read an HTTP request line with BufReader, write a valid response with a status line, headers and an HTML body, and route / versus everything else.
      example:
        title: Serving hello.html and a 404 page
        check: build
        code: |
          use std::fs;
          use std::io::{BufRead, BufReader, Write};
          use std::net::{TcpListener, TcpStream};

          fn main() {
              let listener = TcpListener::bind("127.0.0.1:7878").unwrap();
              for stream in listener.incoming() {
                  handle_connection(stream.unwrap());
              }
          }

          fn handle_connection(mut stream: TcpStream) {
              let buf_reader = BufReader::new(&stream);
              let request_line = buf_reader.lines().next().unwrap().unwrap();

              let (status_line, filename) = if request_line == "GET / HTTP/1.1" {
                  ("HTTP/1.1 200 OK", "hello.html")
              } else {
                  ("HTTP/1.1 404 NOT FOUND", "404.html")
              };
              let contents = fs::read_to_string(filename).unwrap_or_else(|_| String::from("<h1>missing page file</h1>"));
              let length = contents.len();
              let response = format!("{status_line}\r\nContent-Length: {length}\r\n\r\n{contents}");
              stream.write_all(response.as_bytes()).unwrap();
          }
        note: HTTP is plain text over TCP. A response is a status line, headers, a blank line (\r\n\r\n) and the body; Content-Length tells the browser where the body ends. Port 7878 needs no admin rights. This server handles one connection at a time, which the next lesson shows is a problem.
      ex:
        - t: Build and visit it
          p: Create the hello project with hello.html and 404.html, run it, and open http://127.0.0.1:7878 and http://127.0.0.1:7878/nope in a browser. Then print each request line to the terminal.
          check: build
          hints:
            - The HTML files go in the project folder, next to Cargo.toml.
            - "Add println!(\"Request: {request_line}\"); in handle_connection."
            - Browsers also request /favicon.ico, so you will see extra lines.
          solution: |
            use std::fs;
            use std::io::{BufRead, BufReader, Write};
            use std::net::{TcpListener, TcpStream};

            fn main() {
                let listener = TcpListener::bind("127.0.0.1:7878").unwrap();
                println!("Listening on http://127.0.0.1:7878");
                for stream in listener.incoming() {
                    handle_connection(stream.unwrap());
                }
            }

            fn handle_connection(mut stream: TcpStream) {
                let request_line = match BufReader::new(&stream).lines().next() {
                    Some(Ok(line)) => line,
                    _ => return, // the browser closed the connection early
                };
                println!("Request: {request_line}");
                let (status, file) = if request_line == "GET / HTTP/1.1" {
                    ("HTTP/1.1 200 OK", "hello.html")
                } else {
                    ("HTTP/1.1 404 NOT FOUND", "404.html")
                };
                let body = fs::read_to_string(file).unwrap_or_else(|_| format!("<h1>{file} not found on disk</h1>"));
                let response = format!("{status}\r\nContent-Length: {}\r\n\r\n{body}", body.len());
                let _ = stream.write_all(response.as_bytes());
            }
          explain: Returning early instead of unwrapping the request line keeps the server alive when a browser opens a connection and closes it without sending anything, which happens more than you would think.
        - t: A JSON health endpoint
          p: Add a route GET /health that returns {"status":"ok"} with a Content-Type application/json header, and test it with curl -i http://127.0.0.1:7878/health.
          check: build
          hints:
            - Match on the request line with a match on string slices.
            - "Return the content type as part of the tuple and add a Content-Type header line."
            - Each header ends with \r\n, and the headers end with one extra \r\n.
          solution: |
            use std::io::{BufRead, BufReader, Write};
            use std::net::{TcpListener, TcpStream};

            fn respond(request_line: &str) -> (&'static str, &'static str, String) {
                match request_line {
                    "GET / HTTP/1.1" => ("200 OK", "text/html", "<h1>Hello!</h1>".to_string()),
                    "GET /health HTTP/1.1" => ("200 OK", "application/json", r#"{"status":"ok"}"#.to_string()),
                    _ => ("404 NOT FOUND", "text/html", "<h1>Not found</h1>".to_string()),
                }
            }

            fn handle_connection(mut stream: TcpStream) {
                let Some(Ok(line)) = BufReader::new(&stream).lines().next() else { return };
                let (status, ctype, body) = respond(&line);
                let response = format!(
                    "HTTP/1.1 {status}\r\nContent-Type: {ctype}\r\nContent-Length: {}\r\n\r\n{body}",
                    body.len()
                );
                let _ = stream.write_all(response.as_bytes());
            }

            fn main() {
                let listener = TcpListener::bind("127.0.0.1:7878").unwrap();
                for stream in listener.incoming().flatten() {
                    handle_connection(stream);
                }
            }
            // $ curl -i http://127.0.0.1:7878/health
            // HTTP/1.1 200 OK
            // Content-Type: application/json
            // Content-Length: 15
            //
            // {"status":"ok"}
          explain: Pulling the routing into a pure respond function means you can unit test it without opening sockets. Health endpoints like this are what load balancers and uptime monitors call.
    - id: "21.2"
      t: From single-threaded to a thread pool
      min: 120
      kind: project
      learn: Show the problem with a slow /sleep route, design a ThreadPool API first, build it from Workers that pull jobs from a shared channel, and type jobs as Box<dyn FnOnce() + Send + 'static>.
      example:
        title: The ThreadPool
        check: test
        code: |
          use std::sync::{mpsc, Arc, Mutex};
          use std::thread;

          type Job = Box<dyn FnOnce() + Send + 'static>;

          pub struct ThreadPool {
              workers: Vec<Worker>,
              sender: mpsc::Sender<Job>,
          }

          impl ThreadPool {
              /// Create a new ThreadPool with `size` threads.
              ///
              /// # Panics
              /// Panics if `size` is zero.
              pub fn new(size: usize) -> ThreadPool {
                  assert!(size > 0);
                  let (sender, receiver) = mpsc::channel();
                  let receiver = Arc::new(Mutex::new(receiver));
                  let workers = (0..size).map(|id| Worker::new(id, Arc::clone(&receiver))).collect();
                  ThreadPool { workers, sender }
              }

              pub fn execute<F>(&self, f: F)
              where
                  F: FnOnce() + Send + 'static,
              {
                  self.sender.send(Box::new(f)).unwrap();
              }

              pub fn size(&self) -> usize { self.workers.len() }
          }

          struct Worker {
              _id: usize,
              _thread: thread::JoinHandle<()>,
          }

          impl Worker {
              fn new(id: usize, receiver: Arc<Mutex<mpsc::Receiver<Job>>>) -> Worker {
                  let thread = thread::spawn(move || loop {
                      let message = receiver.lock().unwrap().recv(); // lock released at end of statement
                      match message {
                          Ok(job) => job(),
                          Err(_) => break, // channel closed
                      }
                  });
                  Worker { _id: id, _thread: thread }
              }
          }

          #[cfg(test)]
          mod tests {
              use super::*;
              #[test]
              fn runs_jobs_on_workers() {
                  let pool = ThreadPool::new(4);
                  let (tx, rx) = mpsc::channel();
                  for i in 0..8 {
                      let tx = tx.clone();
                      pool.execute(move || tx.send(i * i).unwrap());
                  }
                  drop(tx);
                  let mut got: Vec<i32> = rx.iter().collect();
                  got.sort();
                  assert_eq!(got, vec![0, 1, 4, 9, 16, 25, 36, 49]);
                  assert_eq!(pool.size(), 4);
              }
          }
        note: The workers share one receiver, so it sits in Arc<Mutex<...>>, and whichever worker locks it first takes the next job. Calling recv inside a let statement drops the lock guard before the job runs, so other workers are not blocked while it executes; writing while let Ok(job) = receiver.lock().unwrap().recv() would hold the lock for the whole job.
      ex:
        - t: Prove the slowdown, then fix it
          p: "Add a GET /sleep route that sleeps five seconds. Open /sleep and / in two tabs and observe / waiting. Then use your ThreadPool with four threads in main via pool.execute(|| handle_connection(stream)) and observe / responding immediately."
          lang: text
          check: none
          hints:
            - "Add a match arm: \"GET /sleep HTTP/1.1\" => { thread::sleep(Duration::from_secs(5)); (\"HTTP/1.1 200 OK\", \"hello.html\") }"
            - Put ThreadPool in src/lib.rs and use hello::ThreadPool; in main.rs.
            - The closure needs to own the stream, which happens automatically because handle_connection takes it by value.
          solution: |
            // src/main.rs
            use hello::ThreadPool;
            use std::net::TcpListener;

            fn main() {
                let listener = TcpListener::bind("127.0.0.1:7878").unwrap();
                let pool = ThreadPool::new(4);
                for stream in listener.incoming() {
                    let stream = stream.unwrap();
                    pool.execute(|| {
                        handle_connection(stream);
                    });
                }
            }

            // In handle_connection's routing:
            // "GET /sleep HTTP/1.1" => {
            //     thread::sleep(Duration::from_secs(5));
            //     ("HTTP/1.1 200 OK", "hello.html")
            // }
          explain: With four workers, up to four slow requests can run before anyone has to wait. A fixed-size pool protects the server from creating unlimited threads under heavy load, the same reason load testers cap their concurrency.
        - t: Measure with a mini load test
          p: Write a separate Rust program that opens 20 TCP connections at once to your server (one thread each), requests /, and reports the slowest response time. Compare a pool of 1 thread with a pool of 4 while one /sleep request is running.
          check: build
          hints:
            - "In each thread: TcpStream::connect(\"127.0.0.1:7878\"), write \"GET / HTTP/1.1\\r\\n\\r\\n\", then read_to_string."
            - Time each request with Instant::now() and send the duration back through a channel.
            - Take the maximum of the collected durations.
          solution: |
            use std::io::{Read, Write};
            use std::net::TcpStream;
            use std::sync::mpsc;
            use std::thread;
            use std::time::{Duration, Instant};

            fn one_request() -> std::io::Result<Duration> {
                let start = Instant::now();
                let mut s = TcpStream::connect("127.0.0.1:7878")?;
                s.write_all(b"GET / HTTP/1.1\r\nHost: localhost\r\n\r\n")?;
                let mut body = String::new();
                s.read_to_string(&mut body)?;
                Ok(start.elapsed())
            }

            fn main() {
                let (tx, rx) = mpsc::channel();
                for _ in 0..20 {
                    let tx = tx.clone();
                    thread::spawn(move || {
                        let _ = tx.send(one_request());
                    });
                }
                drop(tx);
                let times: Vec<Duration> = rx.iter().filter_map(Result::ok).collect();
                let slowest = times.iter().max().copied().unwrap_or_default();
                println!("{} ok, slowest {:?}", times.len(), slowest);
            }
          explain: With one worker busy on /sleep, every request waits about five seconds; with four, most return in milliseconds. You have just built a tiny load-testing tool, and Track 3 turns this idea into a full portfolio project.
    - id: "21.3"
      t: Graceful shutdown and cleanup
      min: 75
      kind: project
      learn: Implement Drop for ThreadPool so it closes the channel and joins every worker, store the sender in an Option so it can be dropped first, and stop the server after a fixed number of requests to watch the shutdown.
      example:
        title: Drop for ThreadPool
        check: test
        code: |
          use std::sync::{mpsc, Arc, Mutex};
          use std::thread;

          type Job = Box<dyn FnOnce() + Send + 'static>;

          pub struct ThreadPool {
              workers: Vec<Worker>,
              sender: Option<mpsc::Sender<Job>>,
          }

          impl ThreadPool {
              pub fn new(size: usize) -> ThreadPool {
                  assert!(size > 0);
                  let (sender, receiver) = mpsc::channel();
                  let receiver = Arc::new(Mutex::new(receiver));
                  let workers = (0..size).map(|id| Worker::new(id, Arc::clone(&receiver))).collect();
                  ThreadPool { workers, sender: Some(sender) }
              }
              pub fn execute<F: FnOnce() + Send + 'static>(&self, f: F) {
                  self.sender.as_ref().unwrap().send(Box::new(f)).unwrap();
              }
          }

          impl Drop for ThreadPool {
              fn drop(&mut self) {
                  drop(self.sender.take()); // close the channel: workers' recv returns Err
                  for worker in self.workers.drain(..) {
                      println!("Shutting down worker {}", worker.id);
                      worker.thread.join().unwrap();
                  }
              }
          }

          struct Worker {
              id: usize,
              thread: thread::JoinHandle<()>,
          }

          impl Worker {
              fn new(id: usize, receiver: Arc<Mutex<mpsc::Receiver<Job>>>) -> Worker {
                  let thread = thread::spawn(move || loop {
                      let message = receiver.lock().unwrap().recv();
                      match message {
                          Ok(job) => job(),
                          Err(_) => {
                              println!("Worker {id} disconnected; shutting down.");
                              break;
                          }
                      }
                  });
                  Worker { id, thread }
              }
          }

          #[cfg(test)]
          mod tests {
              use super::*;
              use std::sync::atomic::{AtomicUsize, Ordering};

              #[test]
              fn drop_waits_for_all_jobs() {
                  let done = Arc::new(AtomicUsize::new(0));
                  {
                      let pool = ThreadPool::new(3);
                      for _ in 0..10 {
                          let done = Arc::clone(&done);
                          pool.execute(move || {
                              thread::sleep(std::time::Duration::from_millis(5));
                              done.fetch_add(1, Ordering::SeqCst);
                          });
                      }
                  } // pool dropped here: waits for queued jobs, then joins
                  assert_eq!(done.load(Ordering::SeqCst), 10);
              }
          }
        note: Dropping the sender first is essential; otherwise the workers block in recv forever and join never returns. drain(..) moves each Worker out of the Vec so its JoinHandle can be consumed by join. In main, listener.incoming().take(2) stops after two requests so you can watch the shutdown messages.
      ex:
        - t: Shut down after N requests
          p: Make your server accept an optional command-line argument for how many requests to serve before shutting down, and print a summary line with the count when it exits.
          lang: text
          check: none
          hints:
            - "let limit: usize = std::env::args().nth(1).and_then(|s| s.parse().ok()).unwrap_or(usize::MAX);"
            - listener.incoming().take(limit) ends the loop after limit connections.
            - The pool's Drop runs at the end of main and joins the workers.
          solution: |
            use hello::ThreadPool;
            use std::net::TcpListener;

            fn main() {
                let limit: usize = std::env::args().nth(1).and_then(|s| s.parse().ok()).unwrap_or(usize::MAX);
                let listener = TcpListener::bind("127.0.0.1:7878").unwrap();
                let pool = ThreadPool::new(4);
                let mut served = 0;
                for stream in listener.incoming().take(limit) {
                    let stream = stream.unwrap();
                    served += 1;
                    pool.execute(|| handle_connection(stream));
                }
                println!("Served {served} connections. Shutting down.");
            } // pool dropped here: every worker finishes and is joined
          explain: Because cleanup lives in Drop, any way out of main (the loop ending, an early return, even a panic that unwinds) still shuts the workers down properly.
        - t: A fallible pool builder
          p: Replace ThreadPool::new's assert with ThreadPool::build(size) -> Result<ThreadPool, PoolCreationError>, where PoolCreationError is your own error type implementing Display and std::error::Error.
          check: test
          hints:
            - "#[derive(Debug)] pub struct PoolCreationError(String);"
            - "impl std::fmt::Display for PoolCreationError and an empty impl std::error::Error for PoolCreationError {}."
            - Return Err for size 0, otherwise Ok(the pool).
          solution: |
            use std::fmt;
            use std::sync::{mpsc, Arc, Mutex};
            use std::thread;

            type Job = Box<dyn FnOnce() + Send + 'static>;

            #[derive(Debug)]
            pub struct PoolCreationError(String);

            impl fmt::Display for PoolCreationError {
                fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
                    write!(f, "cannot create thread pool: {}", self.0)
                }
            }
            impl std::error::Error for PoolCreationError {}

            pub struct ThreadPool {
                _workers: Vec<thread::JoinHandle<()>>,
                sender: mpsc::Sender<Job>,
            }

            impl ThreadPool {
                pub fn build(size: usize) -> Result<ThreadPool, PoolCreationError> {
                    if size == 0 {
                        return Err(PoolCreationError("size must be at least 1".into()));
                    }
                    let (sender, receiver) = mpsc::channel::<Job>();
                    let receiver = Arc::new(Mutex::new(receiver));
                    let workers = (0..size)
                        .map(|_| {
                            let rx = Arc::clone(&receiver);
                            thread::spawn(move || loop {
                                let msg = rx.lock().unwrap().recv();
                                match msg {
                                    Ok(job) => job(),
                                    Err(_) => break,
                                }
                            })
                        })
                        .collect();
                    Ok(ThreadPool { _workers: workers, sender })
                }
                pub fn execute<F: FnOnce() + Send + 'static>(&self, f: F) {
                    self.sender.send(Box::new(f)).unwrap();
                }
            }

            #[cfg(test)]
            mod tests {
                use super::*;
                #[test]
                fn zero_is_an_error() {
                    let err = ThreadPool::build(0).err().unwrap();
                    assert!(err.to_string().contains("at least 1"));
                }
                #[test]
                fn builds() {
                    let pool = ThreadPool::build(2).unwrap();
                    let (tx, rx) = mpsc::channel();
                    pool.execute(move || tx.send(7).unwrap());
                    assert_eq!(rx.recv().unwrap(), 7);
                }
            }
          explain: The book suggests exactly this improvement. A library should let the caller decide what to do about a bad configuration value, and implementing std::error::Error lets the error work with ? and Box<dyn Error>.
  recap:
    summary:
      - TcpListener::bind and incoming accept connections; BufReader reads the request line by line.
      - An HTTP response is a status line, headers ending in a blank line, then the body.
      - A single-threaded server blocks on slow requests; a fixed-size thread pool fixes that safely.
      - Workers share one receiver through Arc<Mutex<Receiver<Job>>>; jobs are Box<dyn FnOnce() + Send + 'static>.
      - Drop for the pool closes the channel first, then joins every worker, giving a graceful shutdown.
    functions: |
      TcpListener::bind("127.0.0.1:7878") || Listen for TCP connections.
      listener.incoming() || Iterate over incoming connections.
      BufReader::new(&stream).lines() || Read text lines from a stream.
      stream.write_all(bytes) || Send the whole response.
      type Job = Box<dyn FnOnce() + Send + 'static> || A boxed job a thread can run once.
      self.sender.take() || Move the sender out to drop it during shutdown.
      workers.drain(..) || Move every worker out of the Vec to join it.
    explore:
      - Serve static files from a folder, with the right Content-Type for each extension.
      - Rebuild the server with Tokio or axum (Track 2, A12) and compare the code size.
    repo: rust-thread-pool-server
    cv:
      - Implemented an HTTP/1.1 server in Rust from raw TCP sockets with a custom thread pool, graceful shutdown and a companion load-testing client.
    next: You have finished the book. Track 2 deepens each topic the way roadmap.sh/rust lays it out, and Track 3 builds portfolio projects.
