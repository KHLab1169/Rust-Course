- id: a7
  n: A07
  t: Concurrency and parallelism
  lv: 4
  goal: Choose between channels, locks and atomics, avoid contention and deadlocks, and parallelise CPU-bound work with rayon.
  res: |
    Rust Atomics and Locks (free online) | https://marabos.nl/atomics/
    std::sync | https://doc.rust-lang.org/std/sync/
    rayon | https://docs.rs/rayon
  items:
    - id: A7.1
      t: RwLock, Condvar and lazy statics
      min: 60
      learn: Read-heavy sharing with RwLock, waiting for a condition with Condvar, one-time initialisation with OnceLock and LazyLock, and keeping lock scopes short.
      example:
        title: A shared cache and a lazily built table
        code: |
          use std::collections::HashMap;
          use std::sync::{Arc, LazyLock, RwLock};
          use std::thread;

          static UNITS: LazyLock<HashMap<&'static str, u64>> = LazyLock::new(|| {
              HashMap::from([("KB", 1 << 10), ("MB", 1 << 20), ("GB", 1 << 30)]) // built on first use
          });

          fn main() {
              let cache: Arc<RwLock<HashMap<String, u64>>> = Arc::new(RwLock::new(HashMap::new()));
              cache.write().unwrap().insert("limit".into(), 5 * UNITS["MB"]);

              let readers: Vec<_> = (0..4).map(|i| {
                  let cache = Arc::clone(&cache);
                  thread::spawn(move || {
                      let guard = cache.read().unwrap();          // many readers at once
                      format!("reader {i} sees {:?}", guard.get("limit"))
                  })
              }).collect();
              for r in readers { println!("{}", r.join().unwrap()); }
          }
        output: |
          reader 0 sees Some(5242880)
          reader 1 sees Some(5242880)
          reader 2 sees Some(5242880)
          reader 3 sees Some(5242880)
        note: RwLock lets many threads read at once but gives a writer exclusive access, which suits caches and configuration that are read far more often than written. LazyLock (stable since 1.80) replaces the older lazy_static and once_cell crates for global tables.
      ex:
        - t: A job board with Condvar
          p: Build a simple job board where worker threads wait on a Condvar until a job is posted to a shared Mutex<VecDeque<String>>, then take it. Post five jobs from main, then a "stop" message for each worker.
          check: build
          hints:
            - "Share Arc<(Mutex<VecDeque<String>>, Condvar)>."
            - "In the worker: let mut q = lock.lock().unwrap(); while q.is_empty() { q = cvar.wait(q).unwrap(); }"
            - After pushing, call cvar.notify_one().
          solution: |
            use std::collections::VecDeque;
            use std::sync::{Arc, Condvar, Mutex};
            use std::thread;

            fn main() {
                let board = Arc::new((Mutex::new(VecDeque::<String>::new()), Condvar::new()));
                let workers: Vec<_> = (0..2)
                    .map(|id| {
                        let board = Arc::clone(&board);
                        thread::spawn(move || {
                            let (lock, cvar) = &*board;
                            loop {
                                let job = {
                                    let mut q = lock.lock().unwrap();
                                    while q.is_empty() {
                                        q = cvar.wait(q).unwrap(); // releases the lock while waiting
                                    }
                                    q.pop_front().unwrap()
                                };
                                if job == "stop" {
                                    break;
                                }
                                println!("worker {id} did {job}");
                            }
                        })
                    })
                    .collect();

                let (lock, cvar) = &*board;
                for j in (1..=5).map(|n| format!("job {n}")).chain(["stop".into(), "stop".into()]) {
                    lock.lock().unwrap().push_back(j);
                    cvar.notify_one();
                }
                for w in workers {
                    w.join().unwrap();
                }
            }
          explain: The while loop around wait guards against spurious wakeups, which Condvar allows. In practice a channel is simpler for this job; Condvar is the right tool when threads wait for a condition on shared state rather than for messages.
        - t: Read-mostly configuration
          p: Store a Config in Arc<RwLock<Config>>. Spawn three reader threads that read it in a loop and one writer that updates a field once. Make sure no reader holds the lock while printing.
          check: build
          hints:
            - Clone the needed value out of the guard, then drop the guard before printing.
            - "let level = { cfg.read().unwrap().log_level.clone() };"
            - The writer uses cfg.write().unwrap().log_level = ...
          solution: |
            use std::sync::{Arc, RwLock};
            use std::thread;
            use std::time::Duration;

            struct Config {
                log_level: String,
            }

            fn main() {
                let cfg = Arc::new(RwLock::new(Config { log_level: "info".into() }));
                let readers: Vec<_> = (0..3)
                    .map(|i| {
                        let cfg = Arc::clone(&cfg);
                        thread::spawn(move || {
                            for _ in 0..3 {
                                let level = cfg.read().unwrap().log_level.clone(); // guard dropped here
                                println!("reader {i}: {level}");
                                thread::sleep(Duration::from_millis(10));
                            }
                        })
                    })
                    .collect();
                thread::sleep(Duration::from_millis(15));
                cfg.write().unwrap().log_level = "debug".into();
                for r in readers {
                    r.join().unwrap();
                }
            }
          explain: The guard is a temporary that ends with the statement, so the lock is released before the slow println. Holding locks during I/O is a common cause of contention that only shows up under load.
    - id: A7.2
      t: Atomics and memory ordering
      min: 60
      learn: Atomic integers and booleans, fetch_add and compare_exchange, what Relaxed, Acquire, Release and SeqCst orderings guarantee, and a stop flag pattern.
      example:
        title: Counters and a stop flag
        code: |
          use std::sync::atomic::{AtomicBool, AtomicU64, Ordering};
          use std::sync::Arc;
          use std::thread;
          use std::time::Duration;

          fn main() {
              let requests = Arc::new(AtomicU64::new(0));
              let stop = Arc::new(AtomicBool::new(false));

              let workers: Vec<_> = (0..4).map(|_| {
                  let (requests, stop) = (Arc::clone(&requests), Arc::clone(&stop));
                  thread::spawn(move || {
                      while !stop.load(Ordering::Acquire) {
                          requests.fetch_add(1, Ordering::Relaxed);   // just a count: Relaxed is enough
                          thread::sleep(Duration::from_millis(1));
                      }
                  })
              }).collect();

              thread::sleep(Duration::from_millis(50));
              stop.store(true, Ordering::Release);                    // publish the stop request
              for w in workers { w.join().unwrap(); }
              println!("handled some requests: {}", requests.load(Ordering::Relaxed) > 0);

              let max = AtomicU64::new(10);
              let _ = max.fetch_max(42, Ordering::Relaxed);
              let swapped = max.compare_exchange(42, 7, Ordering::AcqRel, Ordering::Acquire);
              println!("{swapped:?} now {}", max.load(Ordering::Relaxed));
          }
        output: |
          handled some requests: true
          Ok(42) now 7
        note: Atomics change a value without a lock. Relaxed only guarantees the operation itself is atomic, fine for counters. A Release store paired with an Acquire load also makes every write before the store visible after the load, which is what flags guarding data need. SeqCst is the simplest choice when in doubt.
      ex:
        - t: A lock-free ID generator
          p: Write a struct IdGen { next AtomicU64 } with fn next(&self) -> u64, share it across eight threads that each take 1,000 ids, and prove that all 8,000 ids are unique.
          check: test
          hints:
            - fetch_add(1, Ordering::Relaxed) returns the previous value.
            - Use thread::scope so threads can borrow the generator.
            - Collect into a HashSet and check its length.
          solution: |
            use std::collections::HashSet;
            use std::sync::atomic::{AtomicU64, Ordering};
            use std::thread;

            struct IdGen {
                next: AtomicU64,
            }

            impl IdGen {
                fn next(&self) -> u64 {
                    self.next.fetch_add(1, Ordering::Relaxed)
                }
            }

            fn generate(threads: usize, per: usize) -> Vec<u64> {
                let g = IdGen { next: AtomicU64::new(1) };
                thread::scope(|s| {
                    let hs: Vec<_> = (0..threads).map(|_| s.spawn(|| (0..per).map(|_| g.next()).collect::<Vec<_>>())).collect();
                    hs.into_iter().flat_map(|h| h.join().unwrap()).collect()
                })
            }

            fn main() {
                let ids = generate(8, 1000);
                let unique: HashSet<_> = ids.iter().collect();
                println!("{} ids, {} unique", ids.len(), unique.len());
            }

            #[cfg(test)]
            mod tests {
                use super::*;
                #[test]
                fn all_unique() {
                    let ids = generate(8, 1000);
                    let set: HashSet<_> = ids.iter().collect();
                    assert_eq!(set.len(), 8000);
                }
            }
          explain: fetch_add is a single indivisible step, so no two threads can ever receive the same number, and there is no lock to contend on. Relaxed suffices because the ids do not guard any other data.
        - t: compare_exchange for a one-time winner
          p: Several threads race to claim a prize stored in an AtomicU32 that starts at 0 (unclaimed). Use compare_exchange so exactly one thread succeeds and records its id; every other thread sees who won.
          check: test
          hints:
            - "prize.compare_exchange(0, my_id, Ordering::AcqRel, Ordering::Acquire)"
            - Ok means this thread won; Err(current) tells you the winner.
            - Count the Ok results across threads; it must be exactly one.
          solution: |
            use std::sync::atomic::{AtomicU32, Ordering};
            use std::thread;

            fn race(threads: u32) -> (u32, usize) {
                let prize = AtomicU32::new(0);
                let wins = thread::scope(|s| {
                    let hs: Vec<_> = (1..=threads)
                        .map(|id| {
                            let prize = &prize;
                            s.spawn(move || prize.compare_exchange(0, id, Ordering::AcqRel, Ordering::Acquire).is_ok())
                        })
                        .collect();
                    hs.into_iter().map(|h| h.join().unwrap()).filter(|&won| won).count()
                });
                (prize.load(Ordering::Acquire), wins)
            }

            fn main() {
                let (winner, wins) = race(16);
                println!("thread {winner} won ({wins} winner)");
            }

            #[cfg(test)]
            mod tests {
                use super::*;
                #[test]
                fn exactly_one() {
                    let (winner, wins) = race(32);
                    assert_eq!(wins, 1);
                    assert!((1..=32).contains(&winner));
                }
            }
          explain: compare_exchange only writes if the current value is what you expect, atomically, which is the building block of lock-free algorithms. Exactly-once claims like this appear in job schedulers and leader election.
    - id: A7.3
      t: Data parallelism with rayon
      min: 45
      learn: Turn iterator chains into parallel ones with par_iter, parallel sorting, reductions, when parallelism helps and when overhead dominates, and Amdahl's law.
      example:
        title: par_iter in one line
        deps: ['rayon = "1"']
        code: |
          use rayon::prelude::*;
          use std::time::Instant;

          fn is_prime(n: u64) -> bool {
              n >= 2 && (2..).take_while(|d| d * d <= n).all(|d| n % d != 0)
          }

          fn main() {
              let t = Instant::now();
              let seq = (1..2_000_000u64).filter(|&n| is_prime(n)).count();
              let t_seq = t.elapsed();
              let t = Instant::now();
              let par = (1..2_000_000u64).into_par_iter().filter(|&n| is_prime(n)).count();
              let t_par = t.elapsed();
              println!("{seq} primes sequential in {t_seq:?}, {par} parallel in {t_par:?}");
              println!("threads available: {}", rayon::current_num_threads());

              let mut v: Vec<u32> = (0..1_000_000).rev().collect();
              v.par_sort_unstable();
              println!("sorted: {}", v.windows(2).all(|w| w[0] <= w[1]));
          }
        output: |
          148933 primes sequential in 1.2s, 148933 parallel in 160ms
          threads available: 8
          sorted: true
        note: Changing iter to par_iter (or into_par_iter) splits the work across a thread pool sized to your CPU, and the borrow checker still guarantees there are no data races. Exact times depend on your machine. Parallelism pays off for CPU-heavy work on many items; for tiny workloads the coordination overhead can make it slower.
      ex:
        - t: Parallel word frequencies
          p: Count word frequencies across many documents in parallel with rayon, using fold to build one HashMap per thread and reduce to merge them.
          deps: ['rayon = "1"']
          check: test
          hints:
            - docs.par_iter().fold(HashMap::new, |mut m, doc| { ...; m })
            - .reduce(HashMap::new, |mut a, b| { merge b into a; a })
            - Compare the result with a sequential version in a test.
          solution: |
            use rayon::prelude::*;
            use std::collections::HashMap;

            fn word_freq(docs: &[String]) -> HashMap<String, usize> {
                docs.par_iter()
                    .fold(HashMap::new, |mut m: HashMap<String, usize>, doc| {
                        for w in doc.split_whitespace() {
                            *m.entry(w.to_lowercase()).or_insert(0) += 1;
                        }
                        m
                    })
                    .reduce(HashMap::new, |mut a, b| {
                        for (k, v) in b {
                            *a.entry(k).or_insert(0) += v;
                        }
                        a
                    })
            }

            fn main() {
                let docs: Vec<String> = (0..10_000).map(|i| format!("Rust is fast and rust is safe {}", i % 7)).collect();
                let f = word_freq(&docs);
                println!("rust: {}, safe: {}", f["rust"], f["safe"]);
            }

            #[cfg(test)]
            mod tests {
                use super::*;
                #[test]
                fn matches_sequential() {
                    let docs = vec!["a b a".to_string(), "b c".to_string()];
                    let f = word_freq(&docs);
                    assert_eq!((f["a"], f["b"], f["c"]), (2, 2, 1));
                }
            }
          explain: Each thread fills its own map with no locking, and the maps are merged at the end. This map-reduce shape scales far better than sharing one Mutex<HashMap>.
        - t: When parallel is slower
          p: Time summing 1,000 small numbers with iter().sum() and par_iter().sum() in a release build, then 100 million. Explain the result using the idea of overhead and Amdahl's law.
          deps: ['rayon = "1"']
          check: build
          hints:
            - Use std::hint::black_box around inputs so nothing is computed at compile time.
            - Run each measurement a few times; the first run includes thread-pool start-up.
            - Amdahl's law says the serial part of a job limits the possible speed-up.
          solution: |
            use rayon::prelude::*;
            use std::hint::black_box;
            use std::time::Instant;

            fn time(label: &str, n: u64) {
                let v: Vec<u64> = (0..n).collect();
                let t = Instant::now();
                let a: u64 = black_box(&v).iter().sum();
                let seq = t.elapsed();
                let t = Instant::now();
                let b: u64 = black_box(&v).par_iter().sum();
                let par = t.elapsed();
                assert_eq!(a, b);
                println!("{label}: sequential {seq:?}, parallel {par:?}");
            }

            fn main() {
                rayon::current_num_threads(); // start the pool before timing
                time("1 thousand", 1_000);
                time("100 million", 100_000_000);
            }
          explain: For 1,000 numbers, splitting work across threads costs more than the addition itself, so parallel is slower. For 100 million it wins, though memory bandwidth limits the gain. Always measure; never assume parallel is faster.
  quiz:
    - q: When is RwLock a better choice than Mutex?
      o: |
        When reads are far more frequent than writes
        When writes are frequent
        Always
        When the data is a single integer
      a: 0
      x: For a single integer an atomic is usually better.
    - q: Which ordering is enough for a simple statistics counter?
      o: |
        Relaxed
        SeqCst only
        Acquire only
        None; counters need a Mutex
      a: 0
      x: Relaxed still makes each increment atomic.
    - q: Why is Condvar::wait called in a while loop?
      o: |
        Wakeups can be spurious, so the condition must be rechecked
        wait only works once
        To avoid deadlocks with RwLock
        It is not; a single call is enough
      a: 0
      x: The loop rechecks the shared state after every wakeup.
    - q: What does compare_exchange(0, id, ...) do?
      o: |
        Writes id only if the current value is 0, atomically, and reports what it found
        Always writes id
        Swaps two atomics
        Waits until the value becomes 0
      a: 0
      x: Ok means it wrote; Err carries the current value.
      pool: exam
    - q: Which are true about rayon's par_iter?
      type: multi
      o: |
        It splits work across a thread pool
        The borrow checker still prevents data races
        It is always faster than iter
        fold plus reduce avoids sharing one locked collection
      a: [0, 1, 3]
      x: Small workloads can be slower in parallel.
      pool: exam
    - q: What replaces lazy_static and once_cell for global, lazily initialised values in modern std?
      o: |
        std::sync::LazyLock and OnceLock
        static mut
        thread_local! only
        const fn
      a: 0
      x: LazyLock was stabilised in Rust 1.80.
      pool: exam
  recap:
    summary:
      - RwLock suits read-heavy shared data; Condvar lets threads wait for a condition; LazyLock and OnceLock initialise globals once.
      - Copy values out of guards and release locks before slow work such as I/O.
      - Atomics change single values without locks; Relaxed for counters, Acquire/Release to publish data, SeqCst when unsure.
      - compare_exchange is the building block for lock-free claims and updates.
      - rayon parallelises iterator chains safely; measure, because small workloads can get slower.
    functions: |
      RwLock::read() / write() || Shared or exclusive access.
      cvar.wait(guard) / notify_one() || Wait for and signal a condition.
      LazyLock::new(|| ...) || A value initialised on first use.
      AtomicU64::fetch_add(1, Relaxed) || Lock-free increment.
      compare_exchange(old, new, ..) || Write only if the value is old.
      v.par_iter() / into_par_iter() || A parallel iterator (rayon).
      .fold(init, f).reduce(init, merge) || Per-thread accumulation, then merge.
