  recap:
    summary:
      - Keep the public API small; use pub(crate) and pub(super) for internal sharing and a prelude for convenience.
      - Version requirements accept compatible releases; Cargo.lock pins them; cargo update moves within the range.
      - Optional dependencies and additive features keep builds lean; test every feature combination you support.
      - cargo tree and cargo audit show and check what you depend on.
      - Doc comments with tested examples, intra-doc links and missing_docs make documentation reliable.
    functions: |
      pub(crate) / pub(super) || Restricted visibility.
      [dev-dependencies] || Dependencies for tests and benches.
      optional = true / "dep:name" || An optional dependency behind a feature.
      #[cfg(feature = "x")] || Compile code only when a feature is on.
      cargo tree / cargo audit || Inspect and check dependencies.
      [`Item`] || An intra-doc link.
      #![warn(missing_docs)] || Warn about undocumented public items.
