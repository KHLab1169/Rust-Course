- id: a8
  n: A08
  t: Async Rust with Tokio
  lv: 4
  goal: Structure async applications with Tokio, write network servers and clients, share state and limit concurrency, and shut down cleanly.
  res: |
    Tokio tutorial | https://tokio.rs/tokio/tutorial
    tokio docs | https://docs.rs/tokio
    async-std | https://docs.rs/async-std
    smol | https://docs.rs/smol
  items:
    - id: A8.1
      t: Tasks, JoinSet and blocking work
      min: 60
      learn: Spawn and manage many tasks with JoinSet, run blocking or CPU-heavy work with spawn_blocking, the multi-threaded and current-thread runtimes, and how async-std and smol compare.
      example:
        title: A JoinSet of fetches and a blocking hash
        deps: ['tokio = { version = "1", features = ["full"] }']
        code: |
          use std::time::Duration;
          use tokio::task::JoinSet;

          async fn fetch(id: u32) -> (u32, usize) {
              tokio::time::sleep(Duration::from_millis(10 * (5 - id as u64))).await;
              (id, id as usize * 100)
          }

          fn expensive_checksum(data: &[u8]) -> u64 {
              data.iter().fold(0u64, |h, &b| h.wrapping_mul(31).wrapping_add(b as u64))
          }

          #[tokio::main]
          async fn main() {
              let mut set = JoinSet::new();
              for id in 1..=4 {
                  set.spawn(fetch(id));
              }
              while let Some(res) = set.join_next().await {   // results in completion order
                  let (id, size) = res.unwrap();
                  println!("fetched {id}: {size} bytes");
              }

              let data = vec![7u8; 1_000_000];
              let sum = tokio::task::spawn_blocking(move || expensive_checksum(&data)).await.unwrap();
              println!("checksum computed off the async threads: {}", sum != 0);
          }
        output: |
          fetched 4: 400 bytes
          fetched 3: 300 bytes
          fetched 2: 200 bytes
          fetched 1: 100 bytes
          checksum computed off the async threads: true
        note: JoinSet owns a group of tasks, hands back results as they finish, and aborts the rest when dropped. spawn_blocking moves blocking or CPU-heavy work to a separate thread pool so it cannot freeze the async workers. async-std and smol offer similar APIs; Tokio is the most widely used runtime, especially for networking.
      ex:
        - t: Bounded fan-out
          p: Process 50 jobs with a JoinSet, but never run more than 5 at once. Each job sleeps a little and returns its id squared; collect all results.
          deps: ['tokio = { version = "1", features = ["full"] }']
          check: test
          hints:
            - Spawn until set.len() reaches 5, then await join_next before spawning more.
            - After the loop, drain the remaining tasks.
            - Track the peak number of running tasks to prove the limit.
          solution: |
            use std::time::Duration;
            use tokio::task::JoinSet;

            async fn run_bounded(jobs: u64, limit: usize) -> (Vec<u64>, usize) {
                let mut set = JoinSet::new();
                let mut results = Vec::new();
                let mut peak = 0;
                for id in 0..jobs {
                    while set.len() >= limit {
                        results.push(set.join_next().await.unwrap().unwrap());
                    }
                    set.spawn(async move {
                        tokio::time::sleep(Duration::from_millis(2)).await;
                        id * id
                    });
                    peak = peak.max(set.len());
                }
                while let Some(r) = set.join_next().await {
                    results.push(r.unwrap());
                }
                results.sort();
                (results, peak)
            }

            #[tokio::main]
            async fn main() {
                let (r, peak) = run_bounded(50, 5).await;
                println!("{} results, peak concurrency {peak}", r.len());
            }

            #[cfg(test)]
            mod tests {
                use super::*;
                #[tokio::test]
                async fn respects_limit() {
                    let (r, peak) = run_bounded(20, 3).await;
                    assert_eq!(r.len(), 20);
                    assert!(peak <= 3);
                    assert_eq!(r[19], 19 * 19);
                }
            }
          explain: 'Bounding concurrency protects the services you call and your own memory. #[tokio::test] gives each test its own runtime.'
        - t: Keep the runtime responsive
          p: Show the difference between computing a slow hash inside an async task and inside spawn_blocking by running a ticker task that prints every 10 ms on a current-thread runtime.
          deps: ['tokio = { version = "1", features = ["full"] }']
          check: build
          hints:
            - "#[tokio::main(flavor = \"current_thread\")] makes the effect easy to see."
            - The ticker uses tokio::time::interval.
            - With the slow work inline, the ticker stops printing until it finishes.
          solution: |
            use std::time::{Duration, Instant};

            fn slow_work() -> u64 {
                let start = Instant::now();
                let mut x = 0u64;
                while start.elapsed() < Duration::from_millis(100) {
                    x = x.wrapping_add(1);
                }
                x
            }

            #[tokio::main(flavor = "current_thread")]
            async fn main() {
                let ticker = tokio::spawn(async {
                    let mut tick = tokio::time::interval(Duration::from_millis(10));
                    for i in 0..15 {
                        tick.tick().await;
                        println!("tick {i}");
                    }
                });
                tokio::time::sleep(Duration::from_millis(30)).await;
                println!("-- blocking inline (ticks freeze) --");
                slow_work();
                println!("-- spawn_blocking (ticks continue) --");
                tokio::task::spawn_blocking(slow_work).await.unwrap();
                ticker.await.unwrap();
            }
          explain: On the current-thread runtime there is only one worker, so inline slow work stops every other task. Multi-threaded runtimes hide the problem until all workers are blocked, which is why the habit of using spawn_blocking matters.
    - id: A8.2
      t: Async networking
      min: 75
      learn: A TCP echo server with TcpListener and one task per connection, a client with TcpStream, splitting streams into reader and writer halves, framing lines with BufReader, and timeouts.
      example:
        title: A line-based echo server and client in one program
        deps: ['tokio = { version = "1", features = ["full"] }']
        code: |
          use tokio::io::{AsyncBufReadExt, AsyncWriteExt, BufReader};
          use tokio::net::{TcpListener, TcpStream};

          async fn handle(stream: TcpStream) -> std::io::Result<()> {
              let (read, mut write) = stream.into_split();
              let mut lines = BufReader::new(read).lines();
              while let Some(line) = lines.next_line().await? {
                  write.write_all(format!("echo: {}\n", line.to_uppercase()).as_bytes()).await?;
              }
              Ok(())
          }

          #[tokio::main]
          async fn main() -> std::io::Result<()> {
              let listener = TcpListener::bind("127.0.0.1:0").await?;   // port 0: pick a free port
              let addr = listener.local_addr()?;
              tokio::spawn(async move {
                  loop {
                      let (stream, _) = listener.accept().await.unwrap();
                      tokio::spawn(handle(stream));                     // one task per connection
                  }
              });

              let mut client = TcpStream::connect(addr).await?;
              client.write_all(b"hello\nrust\n").await?;
              client.shutdown().await?;                                 // no more data from us
              let mut reply = String::new();
              tokio::io::AsyncReadExt::read_to_string(&mut client, &mut reply).await?;
              print!("{reply}");
              Ok(())
          }
        output: |
          echo: HELLO
          echo: RUST
        note: Each connection gets its own lightweight task, so a server can hold thousands of connections on a few threads. into_split gives independent read and write halves. Binding to port 0 lets the OS pick a free port, which is handy in tests.
      ex:
        - t: A tiny key-value server
          p: "Extend the echo server into a key-value server with commands SET key value, GET key and DEL key, storing data in an Arc<Mutex<HashMap<String, String>>> shared by all connections. Test it with a client in the same program."
          deps: ['tokio = { version = "1", features = ["full"] }']
          check: test
          hints:
            - Parse each line with split_whitespace and a match on a slice pattern.
            - A std::sync::Mutex is fine here because the lock is never held across an await.
            - Reply with OK, the value, or NOT_FOUND.
          solution: |
            use std::collections::HashMap;
            use std::sync::{Arc, Mutex};
            use tokio::io::{AsyncBufReadExt, AsyncWriteExt, BufReader};
            use tokio::net::{TcpListener, TcpStream};

            type Db = Arc<Mutex<HashMap<String, String>>>;

            fn execute(db: &Db, line: &str) -> String {
                let words: Vec<&str> = line.split_whitespace().collect();
                let mut map = db.lock().unwrap();
                match words.as_slice() {
                    ["SET", k, v] => {
                        map.insert(k.to_string(), v.to_string());
                        "OK".into()
                    }
                    ["GET", k] => map.get(*k).cloned().unwrap_or_else(|| "NOT_FOUND".into()),
                    ["DEL", k] => if map.remove(*k).is_some() { "OK".into() } else { "NOT_FOUND".into() },
                    _ => "ERR unknown command".into(),
                }
            }

            async fn handle(stream: TcpStream, db: Db) -> std::io::Result<()> {
                let (r, mut w) = stream.into_split();
                let mut lines = BufReader::new(r).lines();
                while let Some(line) = lines.next_line().await? {
                    let reply = execute(&db, &line); // lock released before the await below
                    w.write_all(format!("{reply}\n").as_bytes()).await?;
                }
                Ok(())
            }

            async fn start() -> std::io::Result<std::net::SocketAddr> {
                let listener = TcpListener::bind("127.0.0.1:0").await?;
                let addr = listener.local_addr()?;
                let db: Db = Arc::new(Mutex::new(HashMap::new()));
                tokio::spawn(async move {
                    while let Ok((s, _)) = listener.accept().await {
                        tokio::spawn(handle(s, Arc::clone(&db)));
                    }
                });
                Ok(addr)
            }

            async fn send(addr: std::net::SocketAddr, cmds: &str) -> std::io::Result<String> {
                let mut c = TcpStream::connect(addr).await?;
                c.write_all(cmds.as_bytes()).await?;
                c.shutdown().await?;
                let mut out = String::new();
                tokio::io::AsyncReadExt::read_to_string(&mut c, &mut out).await?;
                Ok(out)
            }

            #[tokio::main]
            async fn main() -> std::io::Result<()> {
                let addr = start().await?;
                print!("{}", send(addr, "SET lang rust\nGET lang\nDEL lang\nGET lang\n").await?);
                Ok(())
            }

            #[cfg(test)]
            mod tests {
                use super::*;
                #[tokio::test]
                async fn shared_between_connections() {
                    let addr = start().await.unwrap();
                    send(addr, "SET a 1\n").await.unwrap();
                    assert_eq!(send(addr, "GET a\n").await.unwrap(), "1\n");
                }
            }
          explain: Keeping the command logic in a plain execute function makes it testable without sockets. Using std's Mutex in async code is fine as long as the guard is never held across an .await; otherwise use tokio::sync::Mutex.
        - t: Time out slow clients
          p: Add a 5-second idle timeout to the echo server's handle function, so a client that sends nothing for 5 seconds is disconnected with a goodbye message.
          deps: ['tokio = { version = "1", features = ["full"] }']
          check: build
          hints:
            - Wrap lines.next_line() in tokio::time::timeout(Duration::from_secs(5), ...).
            - Err(_) from timeout means the client was idle too long.
            - Write the goodbye message, then return.
          solution: |
            use std::time::Duration;
            use tokio::io::{AsyncBufReadExt, AsyncWriteExt, BufReader};
            use tokio::net::{TcpListener, TcpStream};
            use tokio::time::timeout;

            async fn handle(stream: TcpStream) -> std::io::Result<()> {
                let (r, mut w) = stream.into_split();
                let mut lines = BufReader::new(r).lines();
                loop {
                    match timeout(Duration::from_secs(5), lines.next_line()).await {
                        Ok(Ok(Some(line))) => w.write_all(format!("echo: {line}\n").as_bytes()).await?,
                        Ok(Ok(None)) => return Ok(()),  // client closed the connection
                        Ok(Err(e)) => return Err(e),
                        Err(_) => {
                            w.write_all(b"idle for 5s, goodbye\n").await?;
                            return Ok(());
                        }
                    }
                }
            }

            #[tokio::main]
            async fn main() -> std::io::Result<()> {
                let listener = TcpListener::bind("127.0.0.1:7000").await?;
                println!("try: nc 127.0.0.1 7000");
                loop {
                    let (s, _) = listener.accept().await?;
                    tokio::spawn(handle(s));
                }
            }
          explain: Without timeouts, idle or malicious clients can hold connections open forever and exhaust resources. Matching all four outcomes makes every way the read can end explicit.
    - id: A8.3
      t: Shared state, rate limits and graceful shutdown
      min: 60
      learn: tokio::sync Mutex and RwLock versus std's, Semaphore for rate limiting, broadcast and watch channels, and shutting down on Ctrl+C with a shutdown signal shared by every task.
      example:
        title: A semaphore and a shutdown signal
        deps: ['tokio = { version = "1", features = ["full"] }']
        code: |
          use std::sync::Arc;
          use std::time::Duration;
          use tokio::sync::{watch, Semaphore};

          #[tokio::main]
          async fn main() {
              let permits = Arc::new(Semaphore::new(2));          // at most two calls in flight
              let (shutdown_tx, shutdown_rx) = watch::channel(false);
              let mut handles = Vec::new();

              for id in 0..4 {
                  let permits = Arc::clone(&permits);
                  let mut stop = shutdown_rx.clone();
                  handles.push(tokio::spawn(async move {
                      let mut done = 0;
                      loop {
                          tokio::select! {
                              _ = stop.changed() => break,         // shutdown requested
                              permit = permits.acquire() => {
                                  let _permit = permit.unwrap();   // released when dropped
                                  tokio::time::sleep(Duration::from_millis(20)).await;
                                  done += 1;
                              }
                          }
                      }
                      (id, done)
                  }));
              }

              tokio::time::sleep(Duration::from_millis(110)).await; // in a real app: tokio::signal::ctrl_c().await
              shutdown_tx.send(true).unwrap();
              let mut total = 0;
              for h in handles { total += h.await.unwrap().1; }
              println!("finished cleanly after about {total} calls (at most 2 at a time)");
          }
        output: |
          finished cleanly after about 10 calls (at most 2 at a time)
        note: A Semaphore hands out a fixed number of permits, a simple and robust rate limiter. A watch channel broadcasts the latest value to every receiver, ideal for a shutdown flag; select! lets each task react immediately. In a server, replace the sleep with tokio::signal::ctrl_c().await. The exact call count varies slightly from run to run.
      ex:
        - t: Rate-limited crawler skeleton
          p: Simulate fetching 20 URLs where the remote server allows at most 3 concurrent requests, using a Semaphore and JoinSet, and record the maximum concurrency observed with an AtomicUsize.
          deps: ['tokio = { version = "1", features = ["full"] }']
          check: test
          hints:
            - Acquire with permits.clone().acquire_owned().await so the permit can move into the task.
            - Increment an AtomicUsize when a fetch starts, decrement when it ends, and update a max with fetch_max.
            - Assert the max is at most 3.
          solution: |
            use std::sync::atomic::{AtomicUsize, Ordering};
            use std::sync::Arc;
            use std::time::Duration;
            use tokio::sync::Semaphore;
            use tokio::task::JoinSet;

            async fn crawl(urls: usize, limit: usize) -> usize {
                let permits = Arc::new(Semaphore::new(limit));
                let current = Arc::new(AtomicUsize::new(0));
                let max = Arc::new(AtomicUsize::new(0));
                let mut set = JoinSet::new();
                for _ in 0..urls {
                    let permit = permits.clone().acquire_owned().await.unwrap();
                    let (current, max) = (Arc::clone(&current), Arc::clone(&max));
                    set.spawn(async move {
                        let now = current.fetch_add(1, Ordering::SeqCst) + 1;
                        max.fetch_max(now, Ordering::SeqCst);
                        tokio::time::sleep(Duration::from_millis(5)).await;
                        current.fetch_sub(1, Ordering::SeqCst);
                        drop(permit);
                    });
                }
                while set.join_next().await.is_some() {}
                max.load(Ordering::SeqCst)
            }

            #[tokio::main]
            async fn main() {
                println!("peak concurrency {}", crawl(20, 3).await);
            }

            #[cfg(test)]
            mod tests {
                use super::*;
                #[tokio::test]
                async fn never_exceeds() {
                    assert!(crawl(30, 3).await <= 3);
                }
            }
          explain: acquire_owned returns a permit that is not tied to a borrow of the semaphore, so it can be moved into a spawned task and released when the task ends. Measuring peak concurrency is a direct way to test the limiter.
        - t: Broadcast events to subscribers
          p: Use tokio::sync::broadcast to send "deploy started", "deploy finished" events to three subscriber tasks that each print what they receive, and explain what happens to a subscriber that falls behind.
          deps: ['tokio = { version = "1", features = ["full"] }']
          hints:
            - "let (tx, _) = broadcast::channel(16); let mut rx = tx.subscribe();"
            - Subscribe before sending, or the early messages are missed.
            - A slow receiver gets RecvError::Lagged(n) when it misses n messages.
          solution: |
            use tokio::sync::broadcast;

            #[tokio::main]
            async fn main() {
                let (tx, _) = broadcast::channel::<String>(16);
                let mut subs = Vec::new();
                for name in ["slack", "email", "dashboard"] {
                    let mut rx = tx.subscribe();
                    subs.push(tokio::spawn(async move {
                        let mut got = Vec::new();
                        while let Ok(ev) = rx.recv().await {
                            got.push(ev);
                        }
                        println!("{name} received {got:?}");
                    }));
                }
                for ev in ["deploy started", "deploy finished"] {
                    tx.send(ev.to_string()).unwrap();
                }
                drop(tx); // closing the channel ends every subscriber's loop
                for s in subs {
                    s.await.unwrap();
                }
            }
          explain: Every subscriber gets its own copy of each message. The channel keeps only the last 16; a receiver that falls further behind gets Lagged and skips ahead rather than slowing everyone down.
  quiz:
    - q: What does JoinSet::join_next return results in?
      o: |
        The order in which tasks finish
        The order in which they were spawned
        Random order
        Reverse spawn order
      a: 0
      x: That makes it ideal for processing results as soon as they are ready.
    - q: Where should CPU-heavy or blocking code run in a Tokio application?
      o: |
        In tokio::task::spawn_blocking (or a dedicated thread)
        Directly inside async functions
        In a select! branch
        In tokio::spawn with a sleep
      a: 0
      x: Blocking the async workers stalls every task.
    - q: When is std::sync::Mutex acceptable in async code?
      o: |
        When the guard is never held across an .await
        Never
        Always
        Only on the current-thread runtime
      a: 0
      x: Otherwise use tokio::sync::Mutex.
    - q: What does a Semaphore with 3 permits enforce?
      o: |
        At most three holders at a time
        Exactly three tasks in total
        Three retries
        A three-second timeout
      a: 0
      x: Permits are returned when dropped.
      pool: exam
    - q: Which channel suits a shutdown flag that many tasks watch?
      o: |
        tokio::sync::watch
        std::sync::mpsc
        tokio::sync::oneshot with many receivers
        A Vec of bools
      a: 0
      x: watch broadcasts the latest value to every receiver.
      pool: exam
    - q: Which are reasons to add timeouts to a network server?
      type: multi
      o: |
        Idle clients would otherwise hold resources forever
        Slow or malicious clients could exhaust connections
        Timeouts make the server faster for normal clients
        They give predictable failure behaviour
      a: [0, 1, 3]
      x: Timeouts limit damage; they do not speed up healthy requests.
      pool: exam
  recap:
    summary:
      - JoinSet manages groups of tasks and yields results as they finish; bound concurrency by awaiting before spawning more.
      - spawn_blocking keeps CPU-heavy and blocking work off the async worker threads.
      - Tokio's TcpListener and TcpStream, into_split and BufReader lines build servers with one task per connection.
      - Use std's Mutex only when no await happens while locked; otherwise tokio::sync::Mutex.
      - Semaphore limits concurrency; broadcast fans events out; watch carries a shutdown flag to every task.
    functions: |
      JoinSet::spawn / join_next || Manage a group of tasks.
      tokio::task::spawn_blocking(f) || Run blocking work on a separate pool.
      TcpListener::bind / accept || Accept async connections.
      stream.into_split() || Separate read and write halves.
      BufReader::new(r).lines().next_line() || Read lines asynchronously.
      Semaphore::new(n) / acquire_owned() || Limit concurrency.
      broadcast::channel / watch::channel || Fan-out events; share latest state.
      tokio::signal::ctrl_c() || Wait for Ctrl+C.
