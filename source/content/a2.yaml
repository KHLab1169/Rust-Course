- id: a5
  n: A05
  t: Traits and generics in depth
  lv: 4
  goal: Design generic APIs with the right bounds and associated types, use the standard conversion and comparison traits, and encode rules in types with PhantomData and const generics.
  res: |
    The Rust Reference, traits | https://doc.rust-lang.org/reference/items/traits.html
    Rust API Guidelines | https://rust-lang.github.io/api-guidelines/
    std::convert | https://doc.rust-lang.org/std/convert/
  items:
    - id: A5.1
      t: Bounds, associated types and impl blocks
      min: 60
      learn: Accept anything iterable with IntoIterator, associated types such as Iterator::Item in bounds, where clauses with associated type constraints, and inherent versus trait impl blocks.
      example:
        title: Generic over anything iterable
        code: |
          use std::collections::{BTreeSet, HashMap};
          use std::hash::Hash;

          /// Counts occurrences of each item from any iterable source.
          fn frequencies<I>(items: I) -> HashMap<I::Item, usize>
          where
              I: IntoIterator,
              I::Item: Hash + Eq,
          {
              let mut m = HashMap::new();
              for it in items {
                  *m.entry(it).or_insert(0) += 1;
              }
              m
          }

          fn total<I>(items: I) -> f64
          where
              I: IntoIterator,
              I::Item: Into<f64>,
          {
              items.into_iter().map(Into::into).sum()
          }

          fn main() {
              let words = frequencies("a b a c b a".split(' '));
              let chars = frequencies("hello".chars());
              let set: BTreeSet<u8> = [3, 1, 2].into();
              println!("{} {} {}", words["a"], chars[&'l'], frequencies(&set).len());
              println!("{} {}", total(vec![1u8, 2, 3]), total([0.5f32, 0.25]));
          }
        output: |
          3 2 3
          6 0.75
        note: Taking IntoIterator instead of &[T] lets callers pass vectors, arrays, sets, iterators or references to any of them. I::Item refers to the associated type, and bounds on it go in the where clause.
      ex:
        - t: A generic average
          p: Write fn average<I>(items I) -> Option<f64> for any IntoIterator whose items convert into f64, returning None for an empty input. Call it with a Vec<u32>, an array of f32 and an iterator chain.
          check: test
          hints:
            - "Bounds: I: IntoIterator, I::Item: Into<f64>."
            - Keep a running sum and count in one pass.
            - u32 implements Into<f64>; u64 does not, because it could lose precision.
          solution: |
            fn average<I>(items: I) -> Option<f64>
            where
                I: IntoIterator,
                I::Item: Into<f64>,
            {
                let (sum, n) = items.into_iter().fold((0.0, 0usize), |(s, n), x| (s + x.into(), n + 1));
                if n == 0 { None } else { Some(sum / n as f64) }
            }

            fn main() {
                println!("{:?}", average(vec![1u32, 2, 3, 4]));
                println!("{:?}", average([2.5f32, 3.5]));
                println!("{:?}", average((1..=10u8).filter(|n| n % 2 == 0)));
            }

            #[cfg(test)]
            mod tests {
                use super::*;
                #[test]
                fn empty_and_values() {
                    assert_eq!(average(Vec::<u32>::new()), None);
                    assert_eq!(average([1u16, 3]), Some(2.0));
                }
            }
          explain: The standard library only implements Into<f64> for conversions that cannot lose precision, so the compiler stops average(vec![u64]) instead of silently rounding. Use as f64 explicitly when you accept that risk.
        - t: Your own trait with an associated type
          p: "Define trait Repository { type Item; type Id; fn get(&self, id: &Self::Id) -> Option<&Self::Item>; fn add(&mut self, item: Self::Item) -> Self::Id; } and implement it for an in-memory UserRepo with u32 ids. Write a generic fn add_all<R: Repository>(repo: &mut R, items: Vec<R::Item>) -> Vec<R::Id>."
          check: test
          hints:
            - The implementation sets type Item = User; type Id = u32;
            - Store users in a HashMap<u32, User> and keep a next_id counter.
            - add_all maps each item through repo.add.
          solution: |
            use std::collections::HashMap;

            trait Repository {
                type Item;
                type Id;
                fn get(&self, id: &Self::Id) -> Option<&Self::Item>;
                fn add(&mut self, item: Self::Item) -> Self::Id;
            }

            #[derive(Debug, PartialEq)]
            struct User { name: String }

            #[derive(Default)]
            struct UserRepo { users: HashMap<u32, User>, next_id: u32 }

            impl Repository for UserRepo {
                type Item = User;
                type Id = u32;
                fn get(&self, id: &u32) -> Option<&User> {
                    self.users.get(id)
                }
                fn add(&mut self, item: User) -> u32 {
                    self.next_id += 1;
                    self.users.insert(self.next_id, item);
                    self.next_id
                }
            }

            fn add_all<R: Repository>(repo: &mut R, items: Vec<R::Item>) -> Vec<R::Id> {
                items.into_iter().map(|i| repo.add(i)).collect()
            }

            fn main() {
                let mut repo = UserRepo::default();
                let ids = add_all(&mut repo, vec![User { name: "Ada".into() }, User { name: "Linus".into() }]);
                println!("{ids:?} {:?}", repo.get(&ids[1]));
            }

            #[cfg(test)]
            mod tests {
                use super::*;
                #[test]
                fn stores() {
                    let mut r = UserRepo::default();
                    let id = r.add(User { name: "x".into() });
                    assert_eq!(r.get(&id).unwrap().name, "x");
                    assert!(r.get(&99).is_none());
                }
            }
          explain: Associated types say each repository has exactly one item and id type, so callers write R::Item instead of threading extra generic parameters everywhere. A database-backed repository could implement the same trait, and tests could use the in-memory one.
    - id: A5.2
      t: Conversion and comparison traits
      min: 60
      learn: From and Into, TryFrom for fallible conversions, AsRef for flexible parameters, Default, FromStr for parse, and deriving or implementing PartialEq, Eq, PartialOrd, Ord and Hash correctly.
      example:
        title: A Version type that plays well with std
        code: |
          use std::cmp::Ordering;
          use std::str::FromStr;

          #[derive(Debug, Clone, Copy, PartialEq, Eq, Hash, Default)]
          struct Version { major: u32, minor: u32, patch: u32 }

          impl FromStr for Version {
              type Err = String;
              fn from_str(s: &str) -> Result<Self, Self::Err> {
                  let parts: Vec<&str> = s.trim_start_matches('v').split('.').collect();
                  let [a, b, c] = parts.as_slice() else { return Err(format!("expected X.Y.Z, got {s}")) };
                  let n = |x: &str| x.parse::<u32>().map_err(|e| format!("{x}: {e}"));
                  Ok(Version { major: n(a)?, minor: n(b)?, patch: n(c)? })
              }
          }

          impl Ord for Version {
              fn cmp(&self, o: &Self) -> Ordering {
                  (self.major, self.minor, self.patch).cmp(&(o.major, o.minor, o.patch))
              }
          }
          impl PartialOrd for Version {
              fn partial_cmp(&self, o: &Self) -> Option<Ordering> { Some(self.cmp(o)) }
          }

          impl From<(u32, u32, u32)> for Version {
              fn from((major, minor, patch): (u32, u32, u32)) -> Self { Version { major, minor, patch } }
          }

          fn main() {
              let mut vs: Vec<Version> = ["1.10.0", "v1.2.3", "0.9.12"].iter().map(|s| s.parse().unwrap()).collect();
              vs.sort();
              println!("{vs:?}");
              let v: Version = (2, 0, 0).into();
              println!("{} {:?}", v > vs[2], "1.x".parse::<Version>());
              println!("{:?}", Version::default());
          }
        output: |
          [Version { major: 0, minor: 9, patch: 12 }, Version { major: 1, minor: 2, patch: 3 }, Version { major: 1, minor: 10, patch: 0 }]
          true Err("expected X.Y.Z, got 1.x")
          Version { major: 0, minor: 0, patch: 0 }
        note: Implementing FromStr makes .parse() work, From gives you .into() for free, and Ord makes sort, max and BTreeMap keys work. Comparing tuples gives correct numeric ordering (1.10 after 1.2), which string comparison would get wrong. Ord, PartialOrd, Eq and Hash must all agree.
      ex:
        - t: TryFrom for a validated type
          p: Implement TryFrom<u8> for a Weekday enum (1 = Monday ... 7 = Sunday) with a descriptive error, plus From<Weekday> for u8. Test round trips and an invalid value.
          check: test
          hints:
            - "impl TryFrom<u8> for Weekday { type Error = String; fn try_from(n: u8) -> Result<Self, Self::Error> }"
            - Implementing TryFrom gives you u8::try_into() for free.
            - For the reverse direction, cast the enum with as u8 after giving variants explicit values.
          solution: |
            use std::convert::TryFrom;

            #[derive(Debug, Clone, Copy, PartialEq)]
            #[repr(u8)]
            enum Weekday { Mon = 1, Tue, Wed, Thu, Fri, Sat, Sun }

            impl TryFrom<u8> for Weekday {
                type Error = String;
                fn try_from(n: u8) -> Result<Self, Self::Error> {
                    use Weekday::*;
                    Ok(match n {
                        1 => Mon, 2 => Tue, 3 => Wed, 4 => Thu, 5 => Fri, 6 => Sat, 7 => Sun,
                        _ => return Err(format!("{n} is not a weekday number (1-7)")),
                    })
                }
            }

            impl From<Weekday> for u8 {
                fn from(d: Weekday) -> u8 { d as u8 }
            }

            fn main() {
                let d: Result<Weekday, _> = 5u8.try_into();
                println!("{d:?} {:?}", Weekday::try_from(9));
            }

            #[cfg(test)]
            mod tests {
                use super::*;
                #[test]
                fn round_trip() {
                    for n in 1..=7u8 {
                        let d = Weekday::try_from(n).unwrap();
                        assert_eq!(u8::from(d), n);
                    }
                    assert!(Weekday::try_from(0).is_err());
                }
            }
          explain: TryFrom is the standard way to say "this conversion can fail", and implementing it unlocks try_into everywhere. Never implement From for a conversion that can fail; From is a promise of success.
        - t: AsRef for flexible inputs
          p: 'Write fn count_lines<P AsRef<Path>>(path P) -> std::io::Result<usize> and show it accepting a &str, a: String and a PathBuf.'
          check: test
          hints:
            - "use std::path::{Path, PathBuf};"
            - Inside, call fs::read_to_string(path.as_ref()).
            - std's own fs functions are written exactly like this.
          solution: |
            use std::fs;
            use std::io;
            use std::path::{Path, PathBuf};

            fn count_lines<P: AsRef<Path>>(path: P) -> io::Result<usize> {
                Ok(fs::read_to_string(path.as_ref())?.lines().count())
            }

            fn main() -> io::Result<()> {
                fs::write("lines.txt", "a\nb\nc\n")?;
                let s = String::from("lines.txt");
                let p = PathBuf::from("lines.txt");
                println!("{} {} {}", count_lines("lines.txt")?, count_lines(&s)?, count_lines(&p)?);
                fs::remove_file("lines.txt")?;
                Ok(())
            }

            #[cfg(test)]
            mod tests {
                use super::*;
                #[test]
                fn accepts_pathbuf() {
                    let p = std::env::temp_dir().join("asref_lines_test.txt");
                    std::fs::write(&p, "1\n2\n").unwrap();
                    assert_eq!(count_lines(&p).unwrap(), 2);
                }
            }
          explain: AsRef<Path> is implemented for str, String, Path, PathBuf, OsStr and more, so one signature accepts them all without forcing the caller to convert.
    - id: A5.3
      t: Type-level programming
      min: 60
      learn: Zero-sized marker types with PhantomData, the typestate pattern for compile-time state checks, const generics for sizes in types, and sealed traits.
      example:
        title: Typestate and const generics
        code: |
          use std::marker::PhantomData;

          struct Open;
          struct Closed;

          struct Connection<State> {
              addr: String,
              _state: PhantomData<State>,     // zero bytes, compile-time only
          }

          impl Connection<Closed> {
              fn new(addr: &str) -> Self { Connection { addr: addr.into(), _state: PhantomData } }
              fn open(self) -> Connection<Open> { Connection { addr: self.addr, _state: PhantomData } }
          }

          impl Connection<Open> {
              fn send(&self, msg: &str) -> String { format!("sent {msg:?} to {}", self.addr) }
              fn close(self) -> Connection<Closed> { Connection { addr: self.addr, _state: PhantomData } }
          }

          #[derive(Debug)]
          struct Matrix<const R: usize, const C: usize>([[i32; C]; R]);

          impl<const R: usize, const C: usize> Matrix<R, C> {
              fn transpose(&self) -> Matrix<C, R> {
                  let mut out = [[0; R]; C];
                  for r in 0..R { for c in 0..C { out[c][r] = self.0[r][c]; } }
                  Matrix(out)
              }
          }

          fn main() {
              let conn = Connection::new("db:5432").open();
              println!("{}", conn.send("SELECT 1"));
              let _closed = conn.close();
              // _closed.send("x"); // error: no method `send` for Connection<Closed>
              let m = Matrix([[1, 2, 3], [4, 5, 6]]);
              println!("{:?}", m.transpose());
              println!("size of Connection<Open>: {}", std::mem::size_of::<Connection<Open>>());
          }
        output: |
          sent "SELECT 1" to db:5432
          Matrix([[1, 4], [2, 5], [3, 6]])
          size of Connection<Open>: 24
        note: PhantomData lets a type carry a state parameter without storing anything, so the state check costs nothing at run time. Const generics put numbers in types, so a 2x3 matrix and a 3x2 matrix are different types and a mismatched multiplication fails to compile.
      ex:
        - t: A typestate request builder
          p: Build an HttpRequest builder where url() must be called before send() can exist, using NoUrl and HasUrl marker types. Header calls are allowed in both states.
          check: test
          hints:
            - "struct RequestBuilder<S> { url: Option<String>, headers: Vec<(String, String)>, _s: PhantomData<S> }"
            - Implement header for every S with impl<S> RequestBuilder<S>.
            - send exists only in impl RequestBuilder<HasUrl>.
          solution: |
            use std::marker::PhantomData;

            struct NoUrl;
            struct HasUrl;

            struct RequestBuilder<S> {
                url: Option<String>,
                headers: Vec<(String, String)>,
                _s: PhantomData<S>,
            }

            impl RequestBuilder<NoUrl> {
                fn new() -> Self {
                    RequestBuilder { url: None, headers: vec![], _s: PhantomData }
                }
                fn url(self, u: &str) -> RequestBuilder<HasUrl> {
                    RequestBuilder { url: Some(u.into()), headers: self.headers, _s: PhantomData }
                }
            }

            impl<S> RequestBuilder<S> {
                fn header(mut self, k: &str, v: &str) -> Self {
                    self.headers.push((k.into(), v.into()));
                    self
                }
            }

            impl RequestBuilder<HasUrl> {
                fn send(&self) -> String {
                    format!("GET {} with {} headers", self.url.as_ref().unwrap(), self.headers.len())
                }
            }

            fn main() {
                let r = RequestBuilder::new().header("Accept", "json").url("https://example.com").header("X-Test", "1");
                println!("{}", r.send());
                // RequestBuilder::new().send(); // error: no method named `send` found
            }

            #[cfg(test)]
            mod tests {
                use super::*;
                #[test]
                fn builds() {
                    assert_eq!(RequestBuilder::new().url("u").send(), "GET u with 0 headers");
                }
            }
          explain: The unwrap inside send is safe because the type guarantees url was set. Typestate builders are common in Rust HTTP, database and embedded libraries.
        - t: Fixed-size vectors with const generics
          p: 'Write struct Vector<const N usize>([f64; N]) with dot(&self, other: &Self) -> f64 and implement Add for it. Show that adding a Vector<2> to a Vector<3> does not compile.'
          check: test
          hints:
            - "impl<const N: usize> std::ops::Add for Vector<N> { type Output = Self; ... }"
            - Use std::array::from_fn(|i| self.0[i] + rhs.0[i]) to build the result.
            - dot sums the products of matching elements.
          solution: |
            use std::ops::Add;

            #[derive(Debug, Clone, Copy, PartialEq)]
            struct Vector<const N: usize>([f64; N]);

            impl<const N: usize> Vector<N> {
                fn dot(&self, o: &Self) -> f64 {
                    self.0.iter().zip(o.0.iter()).map(|(a, b)| a * b).sum()
                }
            }

            impl<const N: usize> Add for Vector<N> {
                type Output = Self;
                fn add(self, rhs: Self) -> Self {
                    Vector(std::array::from_fn(|i| self.0[i] + rhs.0[i]))
                }
            }

            fn main() {
                let a = Vector([1.0, 2.0, 3.0]);
                let b = Vector([4.0, 5.0, 6.0]);
                println!("{:?} dot {}", a + b, a.dot(&b));
                // let c = Vector([1.0, 2.0]) + a; // error: expected `Vector<2>`, found `Vector<3>`
            }

            #[cfg(test)]
            mod tests {
                use super::*;
                #[test]
                fn math() {
                    assert_eq!(Vector([1.0, 2.0]) + Vector([3.0, 4.0]), Vector([4.0, 6.0]));
                    assert_eq!(Vector([1.0, 0.0]).dot(&Vector([0.0, 1.0])), 0.0);
                }
            }
          explain: The dimension check happens at compile time, with no run-time length test at all. Graphics and linear-algebra crates such as glam and nalgebra use this to make dimension bugs impossible.
  quiz:
    - q: Why accept I IntoIterator instead of &[T]?
      o: |
        Callers can pass vectors, arrays, sets, ranges, iterators or references
        It is required for generics
        Slices cannot be iterated
        It avoids all allocations automatically
      a: 0
      x: IntoIterator is the most flexible input.
    - q: What do you get for free by implementing FromStr?
      o: |
        The str::parse method for your type
        Display
        Serialization
        Hashing
      a: 0
      x: '"1.2.3".parse::<Version>() calls your from_str.'
    - q: When should you implement TryFrom rather than From?
      o: |
        When the conversion can fail
        When the conversion is expensive
        When converting to a String
        Never
      a: 0
      x: From promises the conversion always succeeds.
    - q: What does PhantomData<State> cost at run time?
      o: |
        Nothing; it is zero-sized
        One pointer
        One byte
        A heap allocation
      a: 0
      x: It exists only for the type checker.
      pool: exam
    - q: Which must agree with each other when you implement them by hand?
      type: multi
      o: |
        PartialEq and Eq
        Eq and Hash
        Ord and PartialOrd
        Debug and Display
      a: [0, 1, 2]
      x: Debug and Display are independent formats.
      pool: exam
    - q: What does const generics make possible?
      o: |
        Values such as array lengths as part of a type
        Constant functions only
        Generic constants in traits only
        Runtime-sized arrays on the stack
      a: 0
      x: Matrix<2, 3> and Matrix<3, 2> are distinct types.
      pool: exam
  recap:
    summary:
      - Use IntoIterator and associated types to write APIs that accept many kinds of input.
      - Associated types give each implementation exactly one related type, keeping signatures short.
      - From, TryFrom, FromStr, AsRef and Default integrate your types with the standard library.
      - Ord, PartialOrd, Eq and Hash must agree; tuple comparisons give correct field-by-field ordering.
      - PhantomData typestate and const generics move rule checks to compile time at no run-time cost.
    functions: |
      I: IntoIterator, I::Item: Bound || Generic over anything iterable.
      trait T { type Item; } || An associated type.
      impl FromStr for T || Enable .parse().
      impl TryFrom<X> for T || A fallible conversion.
      P: AsRef<Path> || Accept many path-like types.
      PhantomData<S> || A zero-sized marker for typestate.
      struct M<const N: usize> || A const generic parameter.
    next: A06 covers modules, dependencies, features and documentation the way professional crates do it.

- id: a6
  n: A06
  t: Crates, Cargo and documentation
  lv: 3
  goal: Organise a crate for others, manage dependencies and features deliberately, and write documentation that is tested and easy to navigate.
  res: |
    The Cargo Book, features | https://doc.rust-lang.org/cargo/reference/features.html
    The Cargo Book, specifying dependencies | https://doc.rust-lang.org/cargo/reference/specifying-dependencies.html
    The rustdoc book | https://doc.rust-lang.org/rustdoc/
  items:
    - id: A6.1
      t: Code organisation and visibility
      min: 45
      learn: Visibility levels pub, pub(crate) and pub(super), a prelude module, organising a crate by feature rather than by type, and keeping the public API small.
      example:
        title: Visibility levels in one crate
        code: |
          mod billing {
              pub struct Invoice { pub id: u32, pub(crate) total_cents: u64 }

              pub(crate) fn tax(cents: u64) -> u64 { cents * 15 / 100 }   // whole crate only

              pub mod format {
                  pub fn money(cents: u64) -> String { format!("${}.{:02}", cents / 100, cents % 100) }
                  pub(super) fn internal_code(id: u32) -> String { format!("INV-{id:05}") } // parent only
              }

              impl Invoice {
                  pub fn label(&self) -> String {
                      format!("{} {}", format::internal_code(self.id), format::money(self.total_cents + tax(self.total_cents)))
                  }
              }
          }

          pub mod prelude {                     // one import for the common items
              pub use crate::billing::format::money;
              pub use crate::billing::Invoice;
          }

          use prelude::*;

          fn main() {
              let inv = Invoice { id: 42, total_cents: 10_000 };
              println!("{} / {}", inv.label(), money(250));
          }
        output: |
          INV-00042 $115.00 / $2.50
        note: pub(crate) shares an item inside your crate without making it part of the public API, which keeps you free to change it later. A prelude module re-exports the handful of items most users need. Every pub item is a promise you must keep across versions.
      ex:
        - t: Shrink a public API
          p: Take the billing example and decide, for each item, whether it should be pub, pub(crate) or private if billing were a published library. Write the reasoning as comments and adjust the code.
          hints:
            - Ask whether an outside user needs the item to do their job.
            - Fields that must stay consistent with each other should be private, with methods.
            - Items only tests need can be private; unit tests in the same module can see them.
          solution: |
            mod billing {
                pub struct Invoice {
                    id: u32,          // private: set only through new()
                    total_cents: u64, // private: invariants (non-negative, tax rules) live here
                }

                fn tax(cents: u64) -> u64 { cents * 15 / 100 } // private: a policy detail

                impl Invoice {
                    pub fn new(id: u32, total_cents: u64) -> Self { Invoice { id, total_cents } }
                    pub fn id(&self) -> u32 { self.id }
                    pub fn label(&self) -> String {
                        format!("INV-{:05} {}", self.id, money(self.total_cents + tax(self.total_cents)))
                    }
                }

                pub fn money(cents: u64) -> String { // pub: useful to every caller
                    format!("${}.{:02}", cents / 100, cents % 100)
                }
            }

            fn main() {
                let inv = billing::Invoice::new(7, 999);
                println!("{} {}", inv.id(), inv.label());
            }
          explain: A smaller API is easier to document, test and keep stable. You can always make something public later, but making a public item private is a breaking change.
        - t: Organise by feature
          p: Sketch the src/ layout for a todo application with users, tasks and notifications, first organised by type (models, services, handlers) and then by feature (users, tasks, notifications). Note one advantage of each.
          lang: text
          check: none
          hints:
            - By type puts all structs together, all services together, and so on.
            - By feature puts everything about tasks in one module.
            - Think about how many files a typical change touches.
          solution: |
            By type:                     By feature:
            src/                         src/
              models/{user,task,note}.rs   users/{mod,model,service,handler}.rs
              services/{user,task,...}.rs  tasks/{mod,model,service,handler}.rs
              handlers/{user,task,...}.rs  notifications/{mod,model,service}.rs
              lib.rs                       lib.rs

            By type: easy to find "all the handlers"; fine for small crates.
            By feature: a change to tasks touches one folder, and pub(crate)
            can keep each feature's internals private from the others.
          explain: Most growing Rust codebases drift toward organising by feature, because module privacy then matches the boundaries of the domain.
    - id: A6.2
      t: Dependencies and features
      min: 45
      learn: Semantic version requirements, cargo update and cargo tree, dev-dependencies and optional dependencies, defining your own features, and checking for vulnerabilities with cargo audit.
      example:
        title: A Cargo.toml with features
        lang: toml
        check: none
        code: |
          [package]
          name = "reportgen"
          version = "0.3.0"
          edition = "2024"
          rust-version = "1.85"           # minimum supported Rust version

          [dependencies]
          serde = { version = "1", features = ["derive"] }   # "1" means >=1.0.0, <2.0.0
          serde_json = { version = "1", optional = true }    # only with the json feature
          chrono = { version = "0.4", default-features = false, features = ["clock"] }

          [dev-dependencies]
          proptest = "1"                  # tests and benchmarks only

          [features]
          default = ["json"]
          json = ["dep:serde_json"]
          csv = []

          # In code:  #[cfg(feature = "json")] pub mod json;
          # $ cargo tree -e features      # who enabled what
          # $ cargo build --no-default-features --features csv
          # $ cargo install cargo-audit && cargo audit
        note: A version like "1" accepts any compatible release, and Cargo.lock pins the exact one; cargo update moves within the allowed range. Features must be additive, enabling one should never break another, because Cargo unifies features across the whole dependency graph.
      ex:
        - t: Add an optional feature
          p: Add a "colors" feature to a small CLI that, when enabled, prints errors in red using the owo-colors crate as an optional dependency, and falls back to plain text otherwise. Show the build commands for both.
          lang: text
          check: none
          hints:
            - "owo-colors = { version = \"4\", optional = true } and colors = [\"dep:owo-colors\"]."
            - 'Write two versions of one function, one with #[cfg(feature = "colors")] and one with #[cfg(not(feature = "colors"))].'
            - cargo run --features colors turns it on.
          solution: |
            # Cargo.toml
            [dependencies]
            owo-colors = { version = "4", optional = true }

            [features]
            colors = ["dep:owo-colors"]

            // src/main.rs
            #[cfg(feature = "colors")]
            fn error_line(msg: &str) -> String {
                use owo_colors::OwoColorize;
                format!("{}", msg.red())
            }

            #[cfg(not(feature = "colors"))]
            fn error_line(msg: &str) -> String {
                format!("error: {msg}")
            }

            fn main() {
                eprintln!("{}", error_line("file not found"));
            }

            // cargo run                    -> plain text
            // cargo run --features colors  -> red text
          explain: Optional dependencies keep the default build small and fast to compile. Test both configurations in CI, since code behind a feature flag is easy to break unnoticed.
        - t: Audit and inspect
          p: In one of your projects with dependencies, run cargo tree, cargo tree -d (duplicates) and cargo audit. Write down the deepest dependency chain and any advisory reported.
          lang: bash
          check: none
          hints:
            - cargo tree -i some_crate shows who depends on some_crate.
            - Duplicates appear when two crates need incompatible versions of a third.
            - cargo audit checks Cargo.lock against the RustSec advisory database.
          solution: |
            $ cargo tree | head
            guess v0.1.0
            └── rand v0.8.5
                ├── libc v0.2.x
                ├── rand_chacha v0.3.1
                │   ├── ppv-lite86 v0.2.x
                │   └── rand_core v0.6.4
                └── rand_core v0.6.4
            $ cargo tree -d
            (nothing printed: no duplicate versions)
            $ cargo audit
            Scanning Cargo.lock for vulnerabilities (12 crate dependencies)
            (no advisories found)
          explain: Knowing your dependency tree is part of shipping software responsibly. cargo audit (and cargo deny for licences and policies) are standard steps in a Rust CI pipeline.
    - id: A6.3
      t: Documentation with rustdoc
      min: 45
      learn: 'Intra-doc links, doc tests that use the ? operator, hidden setup lines, documenting errors and panics, #![warn(missing_docs)], and README examples tested as doc tests.'
      example:
        title: Doc tests with ? and hidden lines
        check: test
        code: |
          #![warn(missing_docs)]
          //! Tools for parsing durations such as `"1h30m"`.

          /// Parses a duration like `"1h30m"` or `"45s"` into seconds.
          ///
          /// See also [`format_secs`] for the reverse direction.
          ///
          /// # Errors
          ///
          /// Returns an error message if a number is missing or a unit is unknown.
          ///
          /// # Examples
          ///
          /// ```
          /// # fn main() -> Result<(), String> {
          /// # use durations::parse_secs;
          /// assert_eq!(parse_secs("1h30m")?, 5400);
          /// assert!(parse_secs("10x").is_err());
          /// # Ok(())
          /// # }
          /// ```
          pub fn parse_secs(s: &str) -> Result<u64, String> {
              let mut total = 0;
              let mut num = String::new();
              for c in s.chars() {
                  if c.is_ascii_digit() {
                      num.push(c);
                      continue;
                  }
                  let n: u64 = num.parse().map_err(|_| format!("missing number before {c}"))?;
                  num.clear();
                  total += n * match c {
                      'h' => 3600,
                      'm' => 60,
                      's' => 1,
                      _ => return Err(format!("unknown unit {c}")),
                  };
              }
              Ok(total)
          }

          /// Formats seconds as `"XhYmZs"`, the inverse of [`parse_secs`].
          pub fn format_secs(secs: u64) -> String {
              format!("{}h{}m{}s", secs / 3600, secs % 3600 / 60, secs % 60)
          }

          #[cfg(test)]
          mod tests {
              use super::*;
              #[test]
              fn round_trip() {
                  assert_eq!(parse_secs(&format_secs(3725)).unwrap(), 3725);
              }
          }
        note: 'Lines starting with # inside a doc example run but are hidden in the rendered docs, which lets examples use ? without clutter. [`format_secs`] becomes a clickable link that rustdoc checks. missing_docs warns about every undocumented public item.'
      ex:
        - t: Document a module properly
          p: Add crate docs, item docs with Examples and Errors sections, and intra-doc links to your textstats or durations crate. Run cargo doc --open and cargo test --doc, and fix every missing_docs warning.
          lang: text
          check: none
          hints:
            - 'Put #![warn(missing_docs)] at the top of lib.rs.'
            - Link items with [`name`] or [`Type::method`].
            - cargo test --doc runs only the documentation tests.
          solution: |
            //! # textstats
            //! Word, line and character statistics for text.
            #![warn(missing_docs)]

            /// Counts words separated by whitespace.
            ///
            /// For characters instead of words, see [`char_count`].
            ///
            /// ```
            /// assert_eq!(textstats::word_count("one two"), 2);
            /// ```
            pub fn word_count(s: &str) -> usize { s.split_whitespace().count() }

            /// Counts Unicode scalar values (what Rust calls `char`s).
            ///
            /// ```
            /// assert_eq!(textstats::char_count("naïve"), 5);
            /// ```
            pub fn char_count(s: &str) -> usize { s.chars().count() }
          explain: Docs with tested examples are the first thing people look at on docs.rs, and broken intra-doc links show up as warnings, so docs stay correct as the code changes.
        - t: Test the README
          p: 'Include your README.md in the crate docs with #![doc = include_str!("../README.md")] so the README''s Rust code blocks run as doc tests.'
          lang: text
          check: none
          hints:
            - Put the attribute at the top of lib.rs.
            - Code blocks marked ```rust in the README become doc tests.
            - Mark blocks that should not run with ```text or ```ignore.
          solution: |
            // src/lib.rs
            #![doc = include_str!("../README.md")]

            // README.md
            // # textstats
            // ```rust
            // let n = textstats::word_count("hello brave world");
            // assert_eq!(n, 3);
            // ```

            // $ cargo test --doc
            // test src/lib.rs - (line 1) ... ok
          explain: README examples are what most people copy first. Testing them means the very first impression of your crate is code that actually compiles.
