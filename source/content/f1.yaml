      x: The pattern binds n to 7.
      pool: exam
    - q: When is if let a better choice than match?
      o: |
        When you only care about one pattern and can ignore the rest
        When you need exhaustiveness checking
        When matching integers
        Never
      a: 0
      x: if let is shorter but gives up the exhaustiveness check.
      pool: exam
  recap:
    summary:
      - Enums list every possible variant of a value; each variant can carry its own data.
      - Option<T> is Some(T) or None and replaces null; you must handle None before using the value.
      - match compares a value against patterns in order and must be exhaustive.
      - Patterns can bind parts of a value; _ ignores, and a name catches everything else.
      - if let handles one pattern concisely; let...else binds or exits early.
    functions: |
      enum E { A, B(i32), C { x: i32 } } || Define an enum with different variant shapes.
      Some(v) / None || The two variants of Option.
      match value { pattern => expr } || Handle each possible pattern.
      _ => || Catch-all arm that ignores the value.
      if let Some(x) = opt || Run code only when the pattern matches.
      let Some(x) = opt else { return } || Bind or leave early.
      s.split_once('=') || Split a string at the first separator; returns an Option.
    next: Chapter 7 shows how to organise a growing program into modules, crates and packages.
