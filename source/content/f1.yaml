- id: c6
  n: "06"
  book: 6
  t: Enums and pattern matching
  lv: 2
  goal: Model choices with enums, use Option instead of null, and handle every case with match, if let and let...else.
  res: |
    Chapter 6 in the book | https://doc.rust-lang.org/book/ch06-00-enums.html
    std::option | https://doc.rust-lang.org/std/option/
  items:
    - id: "6.1"
      t: Defining enums and Option
      min: 60
      learn: Enums whose variants hold different data, methods on enums, and the Option enum that replaces null.
      example:
        title: Messages and Option
        code: |
          #[derive(Debug)]
          enum Message {
              Quit,
              Move { x: i32, y: i32 },
              Write(String),
              ChangeColor(u8, u8, u8),
          }

          impl Message {
              fn describe(&self) -> String {
                  format!("{self:?}")
              }
          }

          fn main() {
              let msgs = [
                  Message::Write(String::from("hi")),
                  Message::Move { x: 1, y: 2 },
                  Message::ChangeColor(0, 128, 255),
                  Message::Quit,
              ];
              for m in &msgs {
                  println!("{}", m.describe());
              }
              let some_number: Option<i32> = Some(5);
              let absent: Option<i32> = None;
              println!("{some_number:?} {absent:?}");
          }
        output: |
          Write("hi")
          Move { x: 1, y: 2 }
          ChangeColor(0, 128, 255)
          Quit
          Some(5) None
        note: Each variant can carry its own kind of data, so one type covers several shapes. Option<T> is either Some(value) or None, and because Option<i32> is a different type from i32, the compiler makes you deal with the missing case before you can use the number.
      ex:
        - t: Shapes
          p: Create an enum Shape with Circle(f64) for the radius, Rectangle(f64, f64) and Triangle(f64, f64) for base and height. Add an area(&self) method and print the area of one of each.
          check: test
          hints:
            - Inside area, match self and handle each variant.
            - "A circle's area is std::f64::consts::PI * r * r."
            - A triangle's area is base * height / 2.0.
          solution: |
            use std::f64::consts::PI;

            enum Shape {
                Circle(f64),
                Rectangle(f64, f64),
                Triangle(f64, f64),
            }

            impl Shape {
                fn area(&self) -> f64 {
                    match self {
                        Shape::Circle(r) => PI * r * r,
                        Shape::Rectangle(w, h) => w * h,
                        Shape::Triangle(b, h) => b * h / 2.0,
                    }
                }
            }

            fn main() {
                let shapes = [Shape::Circle(1.0), Shape::Rectangle(2.0, 3.0), Shape::Triangle(4.0, 5.0)];
                for s in &shapes {
                    println!("{:.2}", s.area());
                }
            }

            #[cfg(test)]
            mod tests {
                use super::*;
                #[test]
                fn rectangle() {
                    assert_eq!(Shape::Rectangle(2.0, 3.0).area(), 6.0);
                }
            }
          explain: If you add a new variant later, every match on Shape stops compiling until you handle it. That compiler-enforced completeness is one of the main reasons Rust programmers model their data with enums.
        - t: Find a user
          p: 'Write find_age(name: &str) -> Option<u32> that knows three people''s ages and returns None for anyone else. Print the result for a known and an unknown name.'
          hints:
            - Use match name with string literal patterns such as "ada" => Some(36).
            - The catch-all _ => None handles everyone else.
            - "Print with {:?} to see Some(36) or None."
          solution: |
            fn find_age(name: &str) -> Option<u32> {
                match name {
                    "ada" => Some(36),
                    "grace" => Some(85),
                    "linus" => Some(56),
                    _ => None,
                }
            }

            fn main() {
                println!("{:?}", find_age("grace"));
                println!("{:?}", find_age("nobody"));
            }
          explain: Returning Option makes "not found" part of the function's type. Callers must decide what to do with None, so there is no equivalent of a null pointer exception waiting to happen.
    - id: "6.2"
      t: The match control flow construct
      min: 60
      learn: match arms and patterns, binding values from variants, matching on Option, exhaustiveness, and the catch-all patterns other and _.
      example:
        title: Coins and Option with match
        code: |
          #[derive(Debug)]
          enum Province { Quebec, Ontario }

          enum Coin {
              Penny,
              Nickel,
              Dime,
              Quarter(Province),
          }

          fn value_in_cents(coin: Coin) -> u8 {
              match coin {
                  Coin::Penny => 1,
                  Coin::Nickel => 5,
                  Coin::Dime => 10,
                  Coin::Quarter(p) => {
                      println!("Quarter from {p:?}");
                      25
                  }
              }
          }

          fn plus_one(x: Option<i32>) -> Option<i32> {
              match x {
                  None => None,
                  Some(i) => Some(i + 1),
              }
          }

          fn main() {
              println!("{}", value_in_cents(Coin::Quarter(Province::Quebec)));
              println!("{:?} {:?}", plus_one(Some(5)), plus_one(None));
              let roll = 9;
              match roll {
                  3 => println!("hat"),
                  7 => println!("lose hat"),
                  other => println!("move {other} spaces"),
              }
          }
        output: |
          Quarter from Quebec
          25
          Some(6) None
          move 9 spaces
        note: match checks arms from top to bottom and runs the first one that fits. It must be exhaustive, so leaving out None or a coin is a compile error. other binds the value; _ matches anything and ignores it.
      ex:
        - t: Traffic light
          p: Make an enum Light { Red, Yellow, Green } with a method next(&self) -> Light and a method seconds(&self) -> u32. Print a full cycle starting from Red.
          hints:
            - Derive Debug and Clone, Copy so you can print and reuse lights easily.
            - next matches self and returns the following light.
            - Loop three times, printing the light and its time, then moving to next().
          solution: |
            #[derive(Debug, Clone, Copy)]
            enum Light {
                Red,
                Yellow,
                Green,
            }

            impl Light {
                fn next(&self) -> Light {
                    match self {
                        Light::Red => Light::Green,
                        Light::Green => Light::Yellow,
                        Light::Yellow => Light::Red,
                    }
                }
                fn seconds(&self) -> u32 {
                    match self {
                        Light::Red => 30,
                        Light::Yellow => 4,
                        Light::Green => 25,
                    }
                }
            }

            fn main() {
                let mut light = Light::Red;
                for _ in 0..3 {
                    println!("{light:?} for {}s", light.seconds());
                    light = light.next();
                }
            }
          explain: Deriving Copy lets light = light.next() replace the value freely. A state machine like this, where every transition is spelled out in a match, is impossible to leave half-handled.
        - t: Option arithmetic
          p: 'Write divide(a: i32, b: i32) -> Option<i32> that returns None when b is 0, then a function describe(r: Option<i32>) -> String that returns "result N" or "cannot divide by zero".'
          check: test
          hints:
            - In divide, if b == 0 return None, otherwise Some(a / b).
            - In describe, match r with Some(n) and None.
            - "format!(\"result {n}\") builds the text."
          solution: |
            fn divide(a: i32, b: i32) -> Option<i32> {
                if b == 0 { None } else { Some(a / b) }
            }

            fn describe(r: Option<i32>) -> String {
                match r {
                    Some(n) => format!("result {n}"),
                    None => String::from("cannot divide by zero"),
                }
            }

            fn main() {
                println!("{}", describe(divide(10, 2)));
                println!("{}", describe(divide(1, 0)));
            }

            #[cfg(test)]
            mod tests {
                use super::*;
                #[test]
                fn zero() {
                    assert_eq!(divide(1, 0), None);
                    assert_eq!(describe(None), "cannot divide by zero");
                }
            }
          explain: Option also has helper methods such as map and unwrap_or that replace many matches, for example divide(10, 2).map(|n| n * 2). You will meet them in Chapter 13 once closures are introduced.
    - id: "6.3"
      t: if let and let...else
      min: 45
      learn: Use if let when you only care about one pattern, and let...else to pull a value out or leave the function early.
      example:
        title: Shorter matches
        code: |
          fn parse_port(s: &str) -> Option<u16> {
              let Ok(port) = s.parse::<u16>() else {
                  return None;                  // let...else must leave the block
              };
              Some(port)
          }

          fn main() {
              let config_max: Option<u8> = Some(3);
              if let Some(max) = config_max {
                  println!("The maximum is configured to be {max}");
              } else {
                  println!("No maximum");
              }

              println!("{:?} {:?}", parse_port("8080"), parse_port("eighty"));
          }
        output: |
          The maximum is configured to be 3
          Some(8080) None
        note: if let trades the exhaustiveness check of match for less code. let...else keeps the happy path unindented, which reads well when a function needs several values that might be missing.
      ex:
        - t: Only the errors
          p: Given an array of Option<&str> results, use if let to print only the values that are Some, and count how many were None.
          hints:
            - "Loop with for r in results."
            - "if let Some(v) = r { println!(...) } else { missing += 1 }"
            - Print the count after the loop.
          solution: |
            fn main() {
                let results = [Some("ok"), None, Some("done"), None, None];
                let mut missing = 0;
                for r in results {
                    if let Some(v) = r {
                        println!("got {v}");
                    } else {
                        missing += 1;
                    }
                }
                println!("{missing} missing");
            }
          explain: if let with else is equivalent to a two-arm match. Use it when one case is interesting and the other is a simple fallback.
        - t: Parse a key=value line
          p: 'Write parse_line(line: &str) -> Option<(String, i32)> that reads lines like "timeout=30" using let...else for each step that could fail.'
          check: test
          hints:
            - "split_once('=') returns Option<(&str, &str)>."
            - "let Some((key, value)) = line.split_once('=') else { return None; };"
            - Use let...else again for value.trim().parse::<i32>().
          solution: |
            fn parse_line(line: &str) -> Option<(String, i32)> {
                let Some((key, value)) = line.split_once('=') else {
                    return None;
                };
                let Ok(n) = value.trim().parse::<i32>() else {
                    return None;
                };
                Some((key.trim().to_string(), n))
            }

            fn main() {
                println!("{:?}", parse_line("timeout = 30"));
                println!("{:?}", parse_line("no equals sign"));
            }

            #[cfg(test)]
            mod tests {
                use super::*;
                #[test]
                fn good_and_bad() {
                    assert_eq!(parse_line("retries=3"), Some((String::from("retries"), 3)));
                    assert_eq!(parse_line("retries=three"), None);
                    assert_eq!(parse_line("retries"), None);
                }
            }
          explain: Each let...else either binds the value or returns early, so by the last line every piece is known to be valid. Chapter 9 shows the ? operator, which shortens this even more.
  quiz:
    - q: What is wrong with this match?
