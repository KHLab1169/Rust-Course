        The method borrows the instance immutably
        The method takes ownership
        The method can change the instance
        The method is static
      a: 0
      x: "&self is self: &Self, a shared borrow of the instance."
    - q: 'After let u2 = User { email: new_email, ..u1 } where username is a String, what is true?'
