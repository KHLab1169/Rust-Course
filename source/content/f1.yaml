- id: c5
  n: "05"
  book: 5
  t: Using structs
  lv: 2
  goal: Define structs, create and update instances, derive Debug, and add methods and associated functions with impl.
  res: |
    Chapter 5 in the book | https://doc.rust-lang.org/book/ch05-00-structs.html
    Rust by Example, structures | https://doc.rust-lang.org/rust-by-example/custom_types/structs.html
  items:
    - id: "5.1"
      t: Defining and instantiating structs
      min: 45
      learn: Named-field structs, field init shorthand, struct update syntax, tuple structs, unit-like structs, and owning data in fields.
      example:
        title: Structs in every shape
        code: |
          #[derive(Debug)]
          struct User {
              active: bool,
              username: String,
              email: String,
              sign_in_count: u64,
          }

          struct Color(u8, u8, u8);   // tuple struct
          struct AlwaysEqual;         // unit-like struct

          fn build_user(email: String, username: String) -> User {
              User { active: true, username, email, sign_in_count: 1 } // shorthand
          }

          fn main() {
              let u1 = build_user("ada@example.com".into(), "ada".into());
              let u2 = User { email: String::from("grace@example.com"), ..u1 };
              let black = Color(0, 0, 0);
              let _marker = AlwaysEqual;
              println!("{} {} {}", u2.username, u2.email, black.0);
              println!("{u2:?}");
          }
        output: |
          ada grace@example.com 0
          User { active: true, username: "ada", email: "grace@example.com", sign_in_count: 1 }
        note: ..u1 copies the remaining fields from u1. Because username is a String, it moves into u2, so u1 can no longer be used as a whole. Fields hold owned types like String, so the struct owns its data; holding references needs lifetimes, covered in Chapter 10.
      ex:
        - t: A Book struct
          p: Define a Book struct with title, author (both String) and pages (u32). Derive Debug, create two books, and print one with {:?} and the other with {:#?}.
          hints:
            - "Put #[derive(Debug)] on the line above struct Book."
            - "Create one with Book { title: String::from(...), author: ..., pages: 300 }."
            - "{:#?} prints each field on its own line."
          solution: |
            #[derive(Debug)]
            struct Book {
                title: String,
                author: String,
                pages: u32,
            }

            fn main() {
                let a = Book {
                    title: String::from("The Rust Programming Language"),
                    author: String::from("Klabnik, Nichols, Krycho"),
                    pages: 560,
                };
                let b = Book { title: String::from("Rust in Action"), author: String::from("McNamara"), pages: 456 };
                println!("{a:?}");
                println!("{b:#?}");
            }
          explain: Debug is a trait; derive writes the implementation for you. {:#?} is the pretty-printed form and is much easier to read for structs with several fields.
        - t: Newtypes for safety
          p: Create tuple structs Meters(f64) and Feet(f64), and a function to_feet(m Meters) -> Feet. Show that passing a Feet where Meters is expected does not compile.
          hints:
            - "struct Meters(f64); and struct Feet(f64);"
            - Read the inner number with m.0.
            - One metre is about 3.28084 feet.
          solution: |
            #[derive(Debug)]
            struct Meters(f64);
            #[derive(Debug)]
            struct Feet(f64);

            fn to_feet(m: Meters) -> Feet {
                Feet(m.0 * 3.28084)
            }

            fn main() {
                let height = Meters(1.8);
                println!("{:?}", to_feet(height));
                // to_feet(Feet(6.0)); // error[E0308]: expected `Meters`, found `Feet`
            }
          explain: Both types hold an f64, but the compiler treats them as different, so you cannot mix units by accident. This newtype pattern costs nothing at run time and comes back in Chapter 20.
    - id: "5.2"
      t: An example program with structs
      min: 45
      learn: Refactor a rectangle-area program from loose variables to a tuple to a struct, and use dbg! and derived Debug to inspect values.
      example:
        title: Rectangles with a struct and dbg!
        code: |
          #[derive(Debug)]
          struct Rectangle {
              width: u32,
              height: u32,
          }

          fn area(rect: &Rectangle) -> u32 {
              rect.width * rect.height
          }

          fn main() {
              let scale = 2;
              let rect = Rectangle {
                  width: dbg!(30 * scale), // prints the file, line and value
                  height: 50,
              };
              dbg!(&rect);
              println!("area = {}", area(&rect));
          }
        output: |
          [src/main.rs:13:16] 30 * scale = 60
          [src/main.rs:16:5] &rect = Rectangle {
              width: 60,
              height: 50,
          }
          area = 3000
        note: dbg! prints to standard error with the file and line, returns the value, and takes ownership unless you pass a reference. It is the quickest way to peek at a value while debugging. Passing &Rectangle lets area read the struct without taking it.
      ex:
        - t: Perimeter and square check
          p: 'Add functions perimeter(r: &Rectangle) -> u32 and is_square(r: &Rectangle) -> bool, and print both for a 10 by 10 and a 3 by 7 rectangle.'
          check: test
          hints:
            - The perimeter is 2 * (width + height).
            - is_square compares width and height with ==.
            - Pass references so main can keep using the rectangles.
          solution: |
            struct Rectangle {
                width: u32,
                height: u32,
            }

            fn perimeter(r: &Rectangle) -> u32 {
                2 * (r.width + r.height)
            }

            fn is_square(r: &Rectangle) -> bool {
                r.width == r.height
            }

            fn main() {
                for r in [Rectangle { width: 10, height: 10 }, Rectangle { width: 3, height: 7 }] {
                    println!("{}x{}: perimeter {}, square {}", r.width, r.height, perimeter(&r), is_square(&r));
                }
            }

            #[cfg(test)]
            mod tests {
                use super::*;
                #[test]
                fn square() {
                    let r = Rectangle { width: 4, height: 4 };
                    assert!(is_square(&r));
                    assert_eq!(perimeter(&r), 16);
                }
            }
          explain: Free functions taking &Rectangle work, but they are scattered. The next lesson moves them into an impl block so they read as r.perimeter() and r.is_square().
        - t: Debug with dbg!
          p: Write a program that computes the total area of three rectangles stored in an array, and use dbg! to print each intermediate area without changing the result.
          hints:
            - Loop over the array and add up the areas.
            - Wrap the area expression in dbg!(...); it returns the value.
            - Run it and notice dbg! output goes to standard error.
          solution: |
            #[derive(Debug)]
            struct Rectangle {
                width: u32,
                height: u32,
            }

            fn main() {
                let rects = [
                    Rectangle { width: 2, height: 3 },
                    Rectangle { width: 4, height: 5 },
                    Rectangle { width: 6, height: 1 },
                ];
                let mut total = 0;
                for r in &rects {
                    total += dbg!(r.width * r.height);
                }
                println!("total area = {total}");
            }
          explain: Because dbg! returns its argument, you can drop it into the middle of an expression and remove it later without restructuring code. Remember to delete dbg! calls before committing; clippy can warn about leftovers.
    - id: "5.3"
      t: Methods and associated functions
      min: 60
      learn: Methods in impl blocks with &self, &mut self and self, methods with extra parameters, associated functions such as constructors with Self, and multiple impl blocks.
      example:
        title: Rectangle with methods
        code: |
          #[derive(Debug)]
          struct Rectangle {
              width: u32,
              height: u32,
          }

          impl Rectangle {
              fn square(size: u32) -> Self {         // associated function
                  Self { width: size, height: size }
              }
              fn area(&self) -> u32 {
                  self.width * self.height
              }
              fn can_hold(&self, other: &Rectangle) -> bool {
                  self.width > other.width && self.height > other.height
              }
              fn grow(&mut self, by: u32) {
                  self.width += by;
                  self.height += by;
              }
          }

          fn main() {
              let mut big = Rectangle { width: 30, height: 50 };
              let small = Rectangle::square(10);
              println!("area {}, holds small: {}", big.area(), big.can_hold(&small));
              big.grow(5);
              println!("{big:?}");
          }
        output: |
          area 1500, holds small: true
          Rectangle { width: 35, height: 55 }
        note: "&self is short for self: &Self. Rust adds the & or &mut for you when you call a method, so big.grow(5) borrows big mutably without you writing &mut big. Associated functions without self, like square, are called with Type::name and are often used as constructors."
      ex:
        - t: A bank account
          p: 'Create an Account struct with owner (String) and balance (i64). Add new(owner: &str) -> Self, deposit(&mut self, amount), withdraw(&mut self, amount) -> bool that refuses to overdraw, and balance(&self).'
          check: test
          hints:
            - "new returns Self { owner: owner.to_string(), balance: 0 }."
            - withdraw checks amount <= self.balance before subtracting.
            - Return true when the withdrawal happens and false otherwise.
          solution: |
            struct Account {
                owner: String,
                balance: i64,
            }

            impl Account {
                fn new(owner: &str) -> Self {
                    Self { owner: owner.to_string(), balance: 0 }
                }
                fn deposit(&mut self, amount: i64) {
                    self.balance += amount;
                }
                fn withdraw(&mut self, amount: i64) -> bool {
                    if amount <= self.balance {
                        self.balance -= amount;
                        true
                    } else {
                        false
                    }
                }
                fn balance(&self) -> i64 {
                    self.balance
                }
            }

            fn main() {
                let mut acc = Account::new("Kev");
                acc.deposit(100);
                println!("withdraw 30: {}", acc.withdraw(30));
                println!("withdraw 500: {}", acc.withdraw(500));
                println!("{} has {}", acc.owner, acc.balance());
            }

            #[cfg(test)]
            mod tests {
                use super::*;
                #[test]
                fn no_overdraft() {
                    let mut a = Account::new("t");
                    a.deposit(10);
                    assert!(!a.withdraw(20));
                    assert_eq!(a.balance(), 10);
                }
            }
          explain: A method and a field can share a name (balance); acc.balance() calls the method and acc.balance reads the field. Keeping the field private and exposing a method is how Rust does encapsulation, which Chapter 7 makes enforceable with pub.
        - t: Consume with self
          p: Add a method into_report(self) -> String to Account that formats the owner and balance and consumes the account. Show that the account cannot be used after the call.
          hints:
            - A method that takes self (not &self) takes ownership.
            - "Return format!(\"{}: {}\", self.owner, self.balance)."
            - Try calling acc.balance() afterwards and read the move error.
          solution: |
            struct Account {
                owner: String,
                balance: i64,
            }

            impl Account {
                fn into_report(self) -> String {
                    format!("{}: {}", self.owner, self.balance)
                }
            }

            fn main() {
                let acc = Account { owner: String::from("Kev"), balance: 70 };
                let report = acc.into_report();
                println!("{report}");
                // println!("{}", acc.balance); // error: value used after move
            }
          explain: Methods that take self are used when the object is transformed into something else, which is why their names often start with into_. The compiler then guarantees nobody uses the old value by mistake.
  quiz:
    - q: 'What does the shorthand User { email, username, active: true, sign_in_count: 1 } rely on?'
      o: |
        Variables named the same as the fields
        A Default implementation
        The order of fields in the struct
