  recap:
    summary:
      - Structs group named fields; tuple structs have unnamed fields; unit-like structs have none.
      - Field init shorthand and ..other update syntax reduce repetition; update syntax can move fields.
      - "#[derive(Debug)] enables {:?} and {:#?}; dbg! prints a value with its location and returns it."
      - Methods live in impl blocks and take &self, &mut self or self; associated functions have no self.
      - Self is an alias for the type inside its impl block, often used in constructors like new.
    functions: |
