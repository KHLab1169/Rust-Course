    - q: What does the pattern other match in match roll { 3 => ..., other => ... }?
      o: |
        Any value not matched earlier and binds it to other
        Only the value 0
        Nothing; it is a syntax error
        Only negative numbers
      a: 0
      x: A variable name as a pattern matches anything and binds it.
    - q: What must the else block of a let...else do?
      o: |
        Diverge, for example with return, break, continue or panic!
        Provide a default value
        Nothing special
        Print an error
      a: 0
      x: The else branch cannot fall through, because the binding would not exist.
    - q: Which can an enum variant hold?
      type: multi
      o: |
        Nothing
        Unnamed fields like a tuple
        Named fields like a struct
        Another enum
      a: [0, 1, 2, 3]
      x: Variants can be unit-like, tuple-like or struct-like and hold any types.
      pool: exam
