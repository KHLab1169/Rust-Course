- id: a12
  n: A12
  t: "Ecosystem II: web, databases, FFI and WebAssembly"
  lv: 4
  goal: Build a JSON web API with axum, store data in SQLite, call and expose C functions safely, and compile Rust to WebAssembly for the browser.
  res: |
    axum | https://docs.rs/axum
    rusqlite | https://docs.rs/rusqlite
    sqlx | https://docs.rs/sqlx
    The Rustonomicon, FFI | https://doc.rust-lang.org/nomicon/ffi.html
    Rust and WebAssembly | https://rustwasm.github.io/docs/book/
  items:
    - id: A12.1
      t: Web APIs with axum
      min: 75
      lv: 4
      learn: Routes and handlers, extractors for paths, queries and JSON bodies, shared state with State, returning status codes and JSON, and testing handlers without a network.
      example:
        title: A notes API
        deps: ['axum = "0.8"', 'tokio = { version = "1", features = ["full"] }', 'serde = { version = "1", features = ["derive"] }', 'tower = { version = "0.5", features = ["util"] }', 'http-body-util = "0.1"']
        check: test
        code: |
          use axum::{
              extract::{Path, State},
              http::StatusCode,
              routing::{get, post},
              Json, Router,
          };
          use serde::{Deserialize, Serialize};
          use std::sync::{Arc, Mutex};

          #[derive(Clone, Serialize, Deserialize)]
          struct Note { id: u32, text: String }

          #[derive(Deserialize)]
          struct NewNote { text: String }

          type Db = Arc<Mutex<Vec<Note>>>;

          async fn list(State(db): State<Db>) -> Json<Vec<Note>> {
              Json(db.lock().unwrap().clone())
          }

          async fn create(State(db): State<Db>, Json(input): Json<NewNote>) -> (StatusCode, Json<Note>) {
              let mut notes = db.lock().unwrap();
              let note = Note { id: notes.len() as u32 + 1, text: input.text };
              notes.push(note.clone());
              (StatusCode::CREATED, Json(note))
          }

          async fn get_one(State(db): State<Db>, Path(id): Path<u32>) -> Result<Json<Note>, StatusCode> {
              db.lock().unwrap().iter().find(|n| n.id == id).cloned().map(Json).ok_or(StatusCode::NOT_FOUND)
          }

          fn app(db: Db) -> Router {
              Router::new()
                  .route("/notes", get(list).post(create))
                  .route("/notes/{id}", get(get_one))
                  .with_state(db)
          }

          #[tokio::main]
          async fn main() {
              let listener = tokio::net::TcpListener::bind("127.0.0.1:3000").await.unwrap();
              axum::serve(listener, app(Db::default())).await.unwrap();
          }

          #[cfg(test)]
          mod tests {
              use super::*;
              use axum::body::Body;
              use axum::http::Request;
              use http_body_util::BodyExt;
              use tower::ServiceExt;

              #[tokio::test]
              async fn create_then_get() {
                  let db = Db::default();
                  let res = app(db.clone())
                      .oneshot(Request::post("/notes").header("content-type", "application/json").body(Body::from(r#"{"text":"learn axum"}"#)).unwrap())
                      .await.unwrap();
                  assert_eq!(res.status(), StatusCode::CREATED);
                  let res = app(db).oneshot(Request::get("/notes/1").body(Body::empty()).unwrap()).await.unwrap();
                  let body = res.into_body().collect().await.unwrap().to_bytes();
                  assert!(String::from_utf8_lossy(&body).contains("learn axum"));
              }
          }
        note: Handlers are plain async functions whose parameters are extractors; axum parses and validates the request before your code runs, and a malformed JSON body gets a 4xx automatically. Anything implementing IntoResponse can be returned, including a (StatusCode, Json) tuple or a Result. oneshot sends a request straight to the router, so tests need no open port.
      ex:
        - t: Add update and delete
          p: Extend the notes API with PUT /notes/{id} (replace the text, 404 if missing) and DELETE /notes/{id} (204 on success, 404 if missing), with tests for both.
          deps: ['axum = "0.8"', 'tokio = { version = "1", features = ["full"] }', 'serde = { version = "1", features = ["derive"] }', 'tower = { version = "0.5", features = ["util"] }']
          check: test
          hints:
            - ".route(\"/notes/{id}\", get(get_one).put(update).delete(remove))"
            - Return StatusCode::NO_CONTENT for a successful delete.
            - Use iter_mut().find(...) to update in place, and position + remove to delete.
          solution: |
            use axum::{extract::{Path, State}, http::StatusCode, routing::get, Json, Router};
            use serde::{Deserialize, Serialize};
            use std::sync::{Arc, Mutex};

            #[derive(Clone, Serialize, Deserialize)]
            struct Note { id: u32, text: String }
            #[derive(Deserialize)]
            struct NewNote { text: String }
            type Db = Arc<Mutex<Vec<Note>>>;

            async fn update(State(db): State<Db>, Path(id): Path<u32>, Json(input): Json<NewNote>) -> Result<Json<Note>, StatusCode> {
                let mut notes = db.lock().unwrap();
                let note = notes.iter_mut().find(|n| n.id == id).ok_or(StatusCode::NOT_FOUND)?;
                note.text = input.text;
                Ok(Json(note.clone()))
            }

            async fn remove(State(db): State<Db>, Path(id): Path<u32>) -> StatusCode {
                let mut notes = db.lock().unwrap();
                match notes.iter().position(|n| n.id == id) {
                    Some(i) => {
                        notes.remove(i);
                        StatusCode::NO_CONTENT
                    }
                    None => StatusCode::NOT_FOUND,
                }
            }

            fn app(db: Db) -> Router {
                Router::new().route("/notes/{id}", get(|| async { "use the full API" }).put(update).delete(remove)).with_state(db)
            }

            #[tokio::main]
            async fn main() {
                let db: Db = Arc::new(Mutex::new(vec![Note { id: 1, text: "first".into() }]));
                let listener = tokio::net::TcpListener::bind("127.0.0.1:3000").await.unwrap();
                axum::serve(listener, app(db)).await.unwrap();
            }

            #[cfg(test)]
            mod tests {
                use super::*;
                use axum::{body::Body, http::Request};
                use tower::ServiceExt;

                fn seeded() -> Db {
                    Arc::new(Mutex::new(vec![Note { id: 1, text: "a".into() }]))
                }

                #[tokio::test]
                async fn put_updates_and_404s() {
                    let db = seeded();
                    let req = |id: u32| Request::put(format!("/notes/{id}")).header("content-type", "application/json").body(Body::from(r#"{"text":"b"}"#)).unwrap();
                    assert_eq!(app(db.clone()).oneshot(req(1)).await.unwrap().status(), StatusCode::OK);
                    assert_eq!(db.lock().unwrap()[0].text, "b");
                    assert_eq!(app(db).oneshot(req(9)).await.unwrap().status(), StatusCode::NOT_FOUND);
                }

                #[tokio::test]
                async fn delete_twice() {
                    let db = seeded();
                    let req = || Request::delete("/notes/1").body(Body::empty()).unwrap();
                    assert_eq!(app(db.clone()).oneshot(req()).await.unwrap().status(), StatusCode::NO_CONTENT);
                    assert_eq!(app(db).oneshot(req()).await.unwrap().status(), StatusCode::NOT_FOUND);
                }
            }
          explain: The ? inside update returns the 404 straight from the handler, because Result<Json<Note>, StatusCode> implements IntoResponse. Testing status codes for both the happy and missing paths is the core of API test coverage.
        - t: Validation and error responses
          p: Make create reject empty or longer-than-280-character text with 422 Unprocessable Entity and a JSON body {"error":"..."}, by introducing an ApiError enum that implements IntoResponse.
          deps: ['axum = "0.8"', 'tokio = { version = "1", features = ["full"] }', 'serde = { version = "1", features = ["derive"] }', 'serde_json = "1"']
          check: test
          hints:
            - "impl IntoResponse for ApiError { fn into_response(self) -> Response { (status, Json(json!({\"error\": msg}))).into_response() } }"
            - Handlers then return Result<(StatusCode, Json<Note>), ApiError>.
            - Check the length with text.trim().is_empty() and text.chars().count() > 280.
          solution: |
            use axum::{http::StatusCode, response::{IntoResponse, Response}, Json};
            use serde::Deserialize;
            use serde_json::json;

            enum ApiError {
                Validation(String),
            }

            impl IntoResponse for ApiError {
                fn into_response(self) -> Response {
                    match self {
                        ApiError::Validation(msg) => (StatusCode::UNPROCESSABLE_ENTITY, Json(json!({ "error": msg }))).into_response(),
                    }
                }
            }

            #[derive(Deserialize)]
            struct NewNote { text: String }

            fn validate(n: &NewNote) -> Result<(), ApiError> {
                if n.text.trim().is_empty() {
                    return Err(ApiError::Validation("text must not be empty".into()));
                }
                if n.text.chars().count() > 280 {
                    return Err(ApiError::Validation("text must be at most 280 characters".into()));
                }
                Ok(())
            }

            async fn create(Json(input): Json<NewNote>) -> Result<(StatusCode, String), ApiError> {
                validate(&input)?;
                Ok((StatusCode::CREATED, input.text))
            }

            #[tokio::main]
            async fn main() {
                let app = axum::Router::new().route("/notes", axum::routing::post(create));
                let listener = tokio::net::TcpListener::bind("127.0.0.1:3000").await.unwrap();
                axum::serve(listener, app).await.unwrap();
            }

            #[cfg(test)]
            mod tests {
                use super::*;
                #[test]
                fn rules() {
                    assert!(validate(&NewNote { text: "  ".into() }).is_err());
                    assert!(validate(&NewNote { text: "x".repeat(281) }).is_err());
                    assert!(validate(&NewNote { text: "ok".into() }).is_ok());
                }
                #[test]
                fn status_code() {
                    let r = ApiError::Validation("bad".into()).into_response();
                    assert_eq!(r.status(), StatusCode::UNPROCESSABLE_ENTITY);
                }
            }
          explain: One error type that knows how to become a response keeps every handler consistent, and ? converts lower-level errors once From impls are added. Counting chars rather than bytes keeps the limit fair for accented text.
    - id: A12.2
      t: Databases with rusqlite and sqlx
      min: 60
      learn: Open a SQLite database, create tables, insert with parameters (never string formatting), query rows into structs, use transactions, and how sqlx offers async and compile-time checked queries for Postgres and others.
      example:
        title: Bugs in SQLite with rusqlite
        deps: ['rusqlite = { version = "0.32", features = ["bundled"] }']
        code: |
          use rusqlite::{params, Connection, Result};

          #[derive(Debug)]
          struct Bug { id: i64, title: String, severity: String }

          fn main() -> Result<()> {
              let conn = Connection::open_in_memory()?;      // or Connection::open("bugs.db")
              conn.execute_batch(
                  "CREATE TABLE bugs (id INTEGER PRIMARY KEY, title TEXT NOT NULL, severity TEXT NOT NULL);",
              )?;

              let mut tx = conn.unchecked_transaction()?;
              for (t, s) in [("Crash on login", "high"), ("Typo on page", "low"), ("Robert'); DROP TABLE bugs;--", "low")] {
                  tx.execute("INSERT INTO bugs (title, severity) VALUES (?1, ?2)", params![t, s])?; // safe parameters
              }
              tx.commit()?;
              tx = conn.unchecked_transaction()?;
              tx.rollback()?;

              let mut stmt = conn.prepare("SELECT id, title, severity FROM bugs WHERE severity = ?1 ORDER BY id")?;
              let low: Vec<Bug> = stmt
                  .query_map(["low"], |r| Ok(Bug { id: r.get(0)?, title: r.get(1)?, severity: r.get(2)? }))?
                  .collect::<Result<_>>()?;
              println!("{low:#?}");
              let n: i64 = conn.query_row("SELECT COUNT(*) FROM bugs", [], |r| r.get(0))?;
              println!("{n} bugs total; the table survived the injection attempt");
              Ok(())
          }
        output: |
          [
              Bug {
                  id: 2,
                  title: "Typo on page",
                  severity: "low",
              },
              Bug {
                  id: 3,
                  title: "Robert'); DROP TABLE bugs;--",
                  severity: "low",
              },
          ]
          3 bugs total; the table survived the injection attempt
        note: Parameters (?1, ?2) are sent separately from the SQL, so input can never change the query, which is how SQL injection is prevented. The bundled feature compiles SQLite into your program, so there is nothing to install. For servers, sqlx gives async access to Postgres, MySQL and SQLite, and its query! macro checks your SQL against a real database at compile time.
      ex:
        - t: A repository over SQLite
          p: Write a BugRepo struct wrapping a Connection with add(title, severity) -> i64, by_severity(sev) -> Vec<Bug> and close(id) -> bool (sets a closed flag). Test it with an in-memory database.
          deps: ['rusqlite = { version = "0.32", features = ["bundled"] }']
          check: test
          hints:
            - Create the table in BugRepo::new, including closed INTEGER NOT NULL DEFAULT 0.
            - conn.last_insert_rowid() gives the new id.
            - execute returns the number of rows changed; close returns true when it is 1.
          solution: |
            use rusqlite::{params, Connection, Result};

            #[derive(Debug, PartialEq)]
            pub struct Bug { pub id: i64, pub title: String, pub closed: bool }

            pub struct BugRepo { conn: Connection }

            impl BugRepo {
                pub fn new(conn: Connection) -> Result<Self> {
                    conn.execute_batch(
                        "CREATE TABLE IF NOT EXISTS bugs (
                            id INTEGER PRIMARY KEY,
                            title TEXT NOT NULL,
                            severity TEXT NOT NULL,
                            closed INTEGER NOT NULL DEFAULT 0
                        );",
                    )?;
                    Ok(BugRepo { conn })
                }
                pub fn add(&self, title: &str, severity: &str) -> Result<i64> {
                    self.conn.execute("INSERT INTO bugs (title, severity) VALUES (?1, ?2)", params![title, severity])?;
                    Ok(self.conn.last_insert_rowid())
                }
                pub fn by_severity(&self, sev: &str) -> Result<Vec<Bug>> {
                    let mut stmt = self.conn.prepare("SELECT id, title, closed FROM bugs WHERE severity = ?1 ORDER BY id")?;
                    let rows = stmt.query_map([sev], |r| Ok(Bug { id: r.get(0)?, title: r.get(1)?, closed: r.get(2)? }))?;
                    rows.collect()
                }
                pub fn close(&self, id: i64) -> Result<bool> {
                    Ok(self.conn.execute("UPDATE bugs SET closed = 1 WHERE id = ?1 AND closed = 0", [id])? == 1)
                }
            }

            fn main() -> Result<()> {
                let repo = BugRepo::new(Connection::open_in_memory()?)?;
                let id = repo.add("Login loop", "high")?;
                repo.close(id)?;
                println!("{:?}", repo.by_severity("high")?);
                Ok(())
            }

            #[cfg(test)]
            mod tests {
                use super::*;
                #[test]
                fn add_query_close() {
                    let repo = BugRepo::new(Connection::open_in_memory().unwrap()).unwrap();
                    let id = repo.add("a", "low").unwrap();
                    repo.add("b", "high").unwrap();
                    assert_eq!(repo.by_severity("low").unwrap().len(), 1);
                    assert!(repo.close(id).unwrap());
                    assert!(!repo.close(id).unwrap(), "closing twice changes nothing");
                    assert!(repo.by_severity("low").unwrap()[0].closed);
                }
            }
          explain: rusqlite converts SQLite integers to bool automatically. An in-memory database makes each test fast and isolated, and the AND closed = 0 condition makes close idempotent, a nice property to test.
        - t: Transactions keep data consistent
          p: 'Write transfer(conn: &mut Connection, from: i64, to: i64, amount: i64) -> Result<()> over an accounts table that debits and credits inside one transaction and rolls back if the balance would go negative. Test that a failed transfer changes nothing.'
          deps: ['rusqlite = { version = "0.32", features = ["bundled"] }']
          check: test
          hints:
            - let tx = conn.transaction()?; then run both UPDATEs on tx and tx.commit()?
            - Read the balance inside the transaction first and return an error if it is too low.
            - Returning early drops tx, which rolls back automatically.
          solution: |
            use rusqlite::{params, Connection};

            fn setup() -> Connection {
                let c = Connection::open_in_memory().unwrap();
                c.execute_batch("CREATE TABLE accounts (id INTEGER PRIMARY KEY, balance INTEGER NOT NULL);
                                 INSERT INTO accounts VALUES (1, 100), (2, 0);").unwrap();
                c
            }

            fn transfer(conn: &mut Connection, from: i64, to: i64, amount: i64) -> Result<(), String> {
                let tx = conn.transaction().map_err(|e| e.to_string())?;
                let bal: i64 = tx.query_row("SELECT balance FROM accounts WHERE id = ?1", [from], |r| r.get(0)).map_err(|e| e.to_string())?;
                if bal < amount {
                    return Err(format!("insufficient funds: {bal} < {amount}")); // tx dropped: rollback
                }
                tx.execute("UPDATE accounts SET balance = balance - ?1 WHERE id = ?2", params![amount, from]).map_err(|e| e.to_string())?;
                tx.execute("UPDATE accounts SET balance = balance + ?1 WHERE id = ?2", params![amount, to]).map_err(|e| e.to_string())?;
                tx.commit().map_err(|e| e.to_string())
            }

            fn balance(c: &Connection, id: i64) -> i64 {
                c.query_row("SELECT balance FROM accounts WHERE id = ?1", [id], |r| r.get(0)).unwrap()
            }

            fn main() {
                let mut c = setup();
                println!("{:?}", transfer(&mut c, 1, 2, 30));
                println!("{} {}", balance(&c, 1), balance(&c, 2));
            }

            #[cfg(test)]
            mod tests {
                use super::*;
                #[test]
                fn failed_transfer_changes_nothing() {
                    let mut c = setup();
                    assert!(transfer(&mut c, 1, 2, 500).is_err());
                    assert_eq!((balance(&c, 1), balance(&c, 2)), (100, 0));
                    transfer(&mut c, 1, 2, 40).unwrap();
                    assert_eq!((balance(&c, 1), balance(&c, 2)), (60, 40));
                }
            }
          explain: rusqlite's Transaction rolls back in its Drop unless commit is called, so every early return is safe. This RAII behaviour makes it very hard to leave half-finished updates in the database.
    - id: A12.3
      t: Unsafe Rust and FFI
      min: 60
      lv: 5
      learn: Call C functions through extern blocks, convert strings with CString and CStr, expose Rust functions to C with extern "C" and no_mangle, raw pointers across the boundary, and wrapping it all in a safe API.
      example:
        title: Calling C's strlen and qsort safely
        code: |
          use std::ffi::{c_char, c_int, c_void, CStr, CString};

          unsafe extern "C" {
              fn strlen(s: *const c_char) -> usize;
              fn qsort(base: *mut c_void, n: usize, size: usize, cmp: extern "C" fn(*const c_void, *const c_void) -> c_int);
          }

          /// Safe wrapper: a CString always ends with a NUL byte.
          fn c_len(s: &str) -> usize {
              let c = CString::new(s).expect("no interior NUL bytes");
              // SAFETY: c is a valid, NUL-terminated string that lives for the call.
              unsafe { strlen(c.as_ptr()) }
          }

          extern "C" fn cmp_i32(a: *const c_void, b: *const c_void) -> c_int {
              // SAFETY: qsort passes pointers to elements of our i32 slice.
              let (a, b) = unsafe { (*(a as *const i32), *(b as *const i32)) };
              a.cmp(&b) as c_int
          }

          fn c_sort(v: &mut [i32]) {
              // SAFETY: the pointer, length and element size describe v exactly.
              unsafe { qsort(v.as_mut_ptr().cast(), v.len(), std::mem::size_of::<i32>(), cmp_i32) }
          }

          #[unsafe(no_mangle)]
          pub extern "C" fn rust_add(a: c_int, b: c_int) -> c_int { a + b }   // callable from C

          fn main() {
              println!("{}", c_len("héllo"));
              let mut v = [5, -2, 9, 0];
              c_sort(&mut v);
              println!("{v:?}");
              let owned = CString::new("back from C").unwrap();
              let view: &CStr = owned.as_c_str();
              println!("{} {}", view.to_str().unwrap(), rust_add(2, 3));
          }
        output: |
          6
          [-2, 0, 5, 9]
          back from C 5
        note: C strings are NUL-terminated bytes, so CString adds the terminator and CStr reads one. Every crossing of the boundary is unsafe because the compiler cannot check C's promises, which is why each call sits in a tiny safe wrapper with a SAFETY comment. strlen counts bytes, so é counts as two. Tools such as bindgen generate extern blocks from C headers, and cbindgen generates headers for Rust libraries.
      ex:
        - t: Wrap getenv safely
          p: 'Call C''s getenv through an extern block and write a safe wrapper fn c_getenv(name: &str) -> Option<String> that handles null pointers and invalid UTF-8. Compare its result with std::env::var for PATH.'
          check: test
          hints:
            - "fn getenv(name: *const c_char) -> *mut c_char;"
            - Check for null with ptr.is_null() before using CStr::from_ptr.
            - to_str() returns a Result because the bytes may not be UTF-8.
          solution: |
            use std::ffi::{c_char, CStr, CString};

            unsafe extern "C" {
                fn getenv(name: *const c_char) -> *mut c_char;
            }

            fn c_getenv(name: &str) -> Option<String> {
                let key = CString::new(name).ok()?;
                // SAFETY: key is a valid NUL-terminated string. The returned
                // pointer is either null or points to a NUL-terminated value
                // owned by the C library, which we copy before returning.
                unsafe {
                    let p = getenv(key.as_ptr());
                    if p.is_null() {
                        return None;
                    }
                    CStr::from_ptr(p).to_str().ok().map(String::from)
                }
            }

            fn main() {
                println!("{:?}", c_getenv("PATH").map(|p| p.len()));
            }

            #[cfg(test)]
            mod tests {
                use super::*;
                #[test]
                fn matches_std() {
                    assert_eq!(c_getenv("PATH"), std::env::var("PATH").ok());
                    assert_eq!(c_getenv("SURELY_NOT_SET_12345"), None);
                    assert_eq!(c_getenv("A\0B"), None, "interior NUL is rejected");
                }
            }
          explain: The wrapper turns every C failure mode (null, bad bytes, interior NUL) into None, so callers never touch unsafe code. Copying into a String matters because the C library may change its environment memory later.
        - t: Expose Rust to C
          p: "Write a Rust library function exported to C, extern \"C\" fn word_count(text: *const c_char) -> usize, that returns 0 for a null pointer, and a small C program header line declaring it. Explain how you would build it as a shared library."
          check: test
          hints:
            - "Mark it #[unsafe(no_mangle)] pub extern \"C\" fn so the symbol keeps its name."
            - Convert with CStr::from_ptr inside an unsafe block after the null check.
            - "In Cargo.toml: [lib] crate-type = [\"cdylib\"] builds a .so, .dylib or .dll."
          solution: |
            use std::ffi::{c_char, CStr};

            /// Counts whitespace-separated words in a NUL-terminated C string.
            ///
            /// # Safety
            /// `text` must be null or point to a valid NUL-terminated string.
            #[unsafe(no_mangle)]
            pub unsafe extern "C" fn word_count(text: *const c_char) -> usize {
                if text.is_null() {
                    return 0;
                }
                // SAFETY: the caller guarantees a valid NUL-terminated string.
                let s = unsafe { CStr::from_ptr(text) };
                String::from_utf8_lossy(s.to_bytes()).split_whitespace().count()
            }

            // C side:   size_t word_count(const char *text);
            // Cargo:    [lib] crate-type = ["cdylib"]
            // Build:    cargo build --release  -> target/release/libwords.so
            // Link:     cc main.c -L target/release -lwords

            #[cfg(test)]
            mod tests {
                use super::*;
                use std::ffi::CString;
                #[test]
                fn counts() {
                    let c = CString::new("one two  three").unwrap();
                    assert_eq!(unsafe { word_count(c.as_ptr()) }, 3);
                    assert_eq!(unsafe { word_count(std::ptr::null()) }, 0);
                }
            }
          explain: Marking the function unsafe with a Safety section documents the contract C callers must keep. from_utf8_lossy makes the function robust to non-UTF-8 input instead of panicking across the FFI boundary, which would be undefined behaviour in older Rust versions.
    - id: A12.4
      t: WebAssembly with wasm-bindgen
      min: 60
      lv: 4
      learn: Compile Rust to WebAssembly, export functions to JavaScript with wasm-bindgen, build and package with wasm-pack, pass strings and numbers across the boundary, and where WASM fits (and where it does not). A short tour of GUI (Tauri), games (Bevy) and embedded (embedded-hal) closes Track 2.
      example:
        title: A markdown word counter for the browser
        deps: ['wasm-bindgen = "0.2"']
        check: test
        code: |
          // Cargo.toml:
          // [lib]
          // crate-type = ["cdylib", "rlib"]
          // [dependencies]
          // wasm-bindgen = "0.2"
          use wasm_bindgen::prelude::*;

          #[wasm_bindgen]
          pub fn reading_time(text: &str) -> String {
              let words = text.split_whitespace().filter(|w| !w.starts_with('#')).count();
              let minutes = (words as f64 / 200.0).ceil() as u32;
              format!("{words} words, about {minutes} min read")
          }

          #[wasm_bindgen]
          pub struct Counter { count: u32 }

          #[wasm_bindgen]
          impl Counter {
              #[wasm_bindgen(constructor)]
              pub fn new() -> Counter { Counter { count: 0 } }
              pub fn increment(&mut self) -> u32 { self.count += 1; self.count }
          }

          // $ wasm-pack build --target web
          // In JavaScript:
          // import init, { reading_time, Counter } from "./pkg/reading.js";
          // await init();
          // reading_time(document.querySelector("textarea").value);

          #[cfg(test)]
          mod tests {
              use super::*;
              #[test]
              fn counts_words() {
                  assert_eq!(reading_time("# Title\nhello world"), "3 words, about 1 min read"); // the # marker is not a word
                  let mut c = Counter::new();
                  c.increment();
                  assert_eq!(c.increment(), 2);
              }
          }
        note: wasm-bindgen generates the JavaScript glue that converts strings and objects across the boundary, and wasm-pack builds and packages it for npm or the web. The same functions remain ordinary Rust, so they are unit tested natively. WASM shines for CPU-heavy work in the browser (parsing, image processing, games); for simple DOM manipulation, JavaScript is usually simpler.
      ex:
        - t: Build and run it in a page
          p: Install wasm-pack, build the reading-time library with --target web, and load it from a minimal index.html with a textarea that updates the reading time as you type. Serve the folder with any static server.
          lang: text
          check: none
          hints:
            - cargo install wasm-pack (or use the installer from the wasm-pack site).
            - The pkg folder holds the .wasm file and the generated JavaScript module.
            - Browsers refuse to load WASM modules from file://, so serve with python -m http.server.
          solution: |
            <!-- index.html -->
            <textarea id="t" rows="8" cols="60"></textarea>
            <p id="out"></p>
            <script type="module">
              import init, { reading_time } from "./pkg/reading.js";
              await init();
              const t = document.getElementById("t");
              const out = document.getElementById("out");
              t.addEventListener("input", () => { out.textContent = reading_time(t.value); });
            </script>

            $ wasm-pack build --target web
            $ python -m http.server 8000
            # open http://localhost:8000
          explain: Any page that loads WebAssembly has to be served over HTTP like this. The Rust code itself did not change at all to run in the browser.
        - t: Pick the right ecosystem crate
          p: For each project, name the crate or framework you would start with and one sentence why. (1) A desktop app with a web UI. (2) A 2D game. (3) Firmware for a microcontroller. (4) A full-stack web app in Rust. (5) A REST service with Postgres.
          lang: text
          check: none
          hints:
            - roadmap.sh/rust lists GUI, game, embedded and web frameworks under the ecosystem section.
            - Consider maturity, community size and documentation.
            - There is more than one good answer for most of these.
          solution: |
            1. Tauri: a small native shell with a web front end and Rust back
               end; much lighter than Electron.
            2. Bevy (or macroquad for something minimal): an ECS game engine
               with a large community.
            3. embedded-hal with a chip-specific HAL (for example nrf-hal or
               rp2040-hal): portable drivers on top of a common trait layer.
            4. Leptos (or Loco for a Rails-like experience): Rust on both the
               server and the browser through WebAssembly.
            5. axum with sqlx: async, widely used, and sqlx checks queries
               against the real database at compile time.
          explain: The Rust ecosystem moves quickly, so check recent activity and documentation before committing. Every one of these builds on the language features you have now practised, especially traits, async and macros.
  quiz:
    - q: What is an extractor in axum?
      o: |
        A handler parameter type that pulls data such as JSON, path or state out of the request
        A middleware that compresses responses
        A database driver
        A macro that generates routes
      a: 0
      x: Json<T>, Path<T>, Query<T> and State<T> are extractors.
    - q: How do SQL parameters such as ?1 prevent SQL injection?
      o: |
        Values are sent separately from the SQL text, so they cannot change the query
        They escape quotes in the string
        They encrypt the query
        They only allow numbers
      a: 0
      x: Never build SQL with format!.
    - q: What do CString and CStr handle?
      o: |
        NUL-terminated C strings, owned and borrowed
        UTF-16 strings for Windows
        Compressed strings
        Strings in WebAssembly
      a: 0
      x: CString owns and adds the NUL; CStr borrows one.
    - q: Why does every FFI call need unsafe?
      o: |
        The compiler cannot check the foreign code's promises about pointers and memory
        C is always slower
        FFI calls allocate memory
        It does not; FFI is safe by default
      a: 0
      x: You take responsibility, ideally inside a small safe wrapper.
      pool: exam
    - q: What does a rusqlite Transaction do if it is dropped without commit?
      o: |
        Rolls back
        Commits automatically
        Panics
        Leaves the database locked
      a: 0
      x: RAII makes early returns safe.
      pool: exam
    - q: Which are good uses of WebAssembly in the browser?
      type: multi
      o: |
        CPU-heavy parsing or image processing
        Games and simulations
        Reusing an existing Rust library on the web
        Replacing all HTML and CSS
      a: [0, 1, 2]
      x: WASM complements HTML, CSS and JavaScript rather than replacing them.
      pool: exam
  recap:
    summary:
      - axum handlers are async functions whose parameters are extractors; anything implementing IntoResponse can be returned; oneshot tests routers without a network.
      - rusqlite gives simple, safe SQLite access with parameters and RAII transactions; sqlx offers async, compile-time checked SQL for servers.
      - FFI uses extern blocks, CString and CStr, and extern "C" with no_mangle; wrap every unsafe call in a small safe API with SAFETY comments.
      - wasm-bindgen and wasm-pack compile Rust for the browser; the same code stays testable natively.
      - Tauri, Bevy, embedded-hal and Leptos extend the same skills to desktop, games, firmware and full-stack web.
    functions: |
      Router::new().route(path, get(h).post(h)) || Define axum routes.
      State<T> / Path<T> / Json<T> || Common axum extractors.
      app.oneshot(request) || Test a router without a server.
      conn.execute(sql, params![..]) || Run SQL with safe parameters.
      conn.transaction()? / tx.commit()? || A transaction that rolls back on drop.
      unsafe extern "C" { fn f(..); } || Declare foreign functions.
      CString::new(s) / CStr::from_ptr(p) || Cross the C string boundary.
      #[wasm_bindgen] || Export a function or type to JavaScript.
    explore:
      - Rebuild the Chapter 21 web server with axum and compare the amount of code.
      - Try a Tauri app that wraps one of your CLI tools with a simple window.
    next: Track 2 is complete. Track 3 turns these skills into portfolio projects you can show employers.
